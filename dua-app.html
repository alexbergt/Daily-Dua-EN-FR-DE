  { id:47, catId:"eid", type:"dua", order:3, title:{en:"Eid Takbir – Ibn Abbas",fr:"Takbir de l'Aïd – Ibn Abbas",de:"Eid Takbir – Ibn Abbas"}, arabic:"اَللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ، وَلِلَّهِ الْحَمْدُ، اَللَّهُ أَكْبَرُ وَأَجَلُّ، اَللَّهُ أَكْبَرُ عَلَى مَا هَدَانَا", transliteration:"Allaahu Akbar, Allaahu Akbar, Allaahu Akbar, wa lillaahil hamd, Allaahu Akbar wa ajall, Allaahu Akbar 'alaa maa hadaanaa.",
    translation:{en:"Allah is the Greatest, Allah is the Greatest, Allah is the Greatest, and to Allah belongs all praise. Allah is the Greatest and most Exalted. Allah is the Greatest for what He has guided us to.",fr:"Allah est le Plus Grand, Allah est le Plus Grand, Allah est le Plus Grand, et à Allah appartient toute louange. Allah est le Plus Grand et le Plus Élevé. Allah est le Plus Grand pour ce qu'Il nous a guidés.",de:"Allah ist der Größte, Allah ist der Größte, Allah ist der Größte, und Allah gebührt alles Lob. Allah ist der Größte und Erhabenste. Allah ist der Größte für das, wozu Er uns geleitet hat."}, source:["Ibn Abbas – Sahabi practice","Al-Bayhaqi"] },

  { id:48, catId:"eid", type:"dua", order:4, title:{en:"Eid Takbir – Salman Al-Farisi",fr:"Takbir de l'Aïd – Salman Al-Farisi",de:"Eid Takbir – Salman Al-Farisi"}, arabic:"اَللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ كَبِيْرًا", transliteration:"Allaahu Akbar, Allaahu Akbar, Allaahu Akbar kabiiraa.",
    translation:{en:"Allah is the Greatest, Allah is the Greatest, Allah is the Greatest – truly the Greatest.",fr:"Allah est le Plus Grand, Allah est le Plus Grand, Allah est le Plus Grand – vraiment le Plus Grand.",de:"Allah ist der Größte, Allah ist der Größte, Allah ist der Größte – wahrhaftig der Größte."}, source:["Salman Al-Farisi – Sahabi practice"] },

  { id:49, catId:"eid", type:"dua", order:5, title:{en:"Eid Greeting",fr:"Vœux de l'Aïd",de:"Eid-Gruß"}, arabic:"تَقَبَّلَ اللَّهُ مِنَّا وَمِنْكُمْ", transliteration:"Taqobbalallaahu minnaa wa minkum.",
    translation:{en:"May Allah accept from us and from you.",fr:"Qu'Allah accepte de nous et de vous.",de:"Möge Allah von uns und von euch annehmen."}, benefit:{en:"Used by the companions on Eid. Applies to both Eid al-Fitr and Eid al-Adha.",fr:"Utilisé par les compagnons à l'Aïd. S'applique à l'Aïd al-Fitr et à l'Aïd al-Adha.",de:"Von den Gefährten an Eid verwendet. Gilt für Eid al-Fitr und Eid al-Adha."}, source:["Ahmad","Al-Bayhaqi","Sahabi practice"] },

  { id:50, catId:"eid", type:"dua", order:6, title:{en:"Reply to Eid Greeting",fr:"Réponse aux vœux de l'Aïd",de:"Antwort auf den Eid-Gruß"}, arabic:"تَقَبَّلَ اللَّهُ مِنَّا وَمِنْكُمْ", transliteration:"Taqobbalallaahu minnaa wa minkum.",
    translation:{en:"May Allah accept from us and from you.",fr:"Qu'Allah accepte de nous et de vous.",de:"Möge Allah von uns und von euch annehmen."}, benefit:{en:"The reply is the same wording – returning the dua back to the person.",fr:"La réponse est la même formulation – retourner le dua à la personne.",de:"Die Antwort ist dieselbe Formulierung – das Dua an die Person zurückgeben."}, source:["Sahabi practice"] },

  { id:51, catId:"eid", type:"info", order:7, title:{en:"Eid Greeting Applicability",fr:"Applicabilité des vœux de l'Aïd",de:"Anwendbarkeit des Eid-Grußes"}, content:{en:"The Eid greeting 'Taqabbalallahu minna wa minkum' applies to both Eid al-Fitr and Eid al-Adha. It is not restricted to one of them only.",fr:"Le vœu de l'Aïd s'applique à l'Aïd al-Fitr et à l'Aïd al-Adha. Il n'est pas limité à l'un d'eux seulement.",de:"Der Eid-Gruß gilt für Eid al-Fitr und Eid al-Adha. Er ist nicht auf einen von ihnen beschränkt."}, source:["Scholars consensus"] },

  { id:52, catId:"eid", type:"dua", order:8, title:{en:"Sacrifice (Qurban) Dua",fr:"Invocation du sacrifice (Qurban)",de:"Opfer-Dua (Qurban)"}, instruction:{en:"Recite before slaughtering the animal.",fr:"Réciter avant d'abattre l'animal.",de:"Vor dem Schlachten des Tieres sprechen."}, arabic:"بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ، اَللَّهُمَّ مِنْكَ وَلَكَ، اَللَّهُمَّ تَقَبَّلْ مِنِّيْ", transliteration:"Bismillaah, wallaahu akbar. Allaahumma minka wa laka. Allaahumma taqobbal minnii.",
    translation:{en:"In the name of Allah, and Allah is the Greatest. O Allah, this is from You and for You. O Allah, accept from me.",fr:"Au nom d'Allah, et Allah est le Plus Grand. Ô Allah, ceci vient de Toi et est pour Toi. Ô Allah, accepte de moi.",de:"Im Namen Allahs, und Allah ist der Größte. O Allah, dies kommt von Dir und ist für Dich. O Allah, nimm von mir an."}, source:["Sahih Muslim"] },

  // ── CATEGORY: TOILET ──
  {     id: 22, catId: "toilet", type: "dua", order: 1,     title: { en: "Dua when entering the toilet", fr: "Invocation en entrant aux toilettes", de: "Dua beim Betreten der Toilette" },     instruction: { en: "Say before entering the toilet, entering with the left foot.", fr: "Dire avant d'entrer aux toilettes, en entrant du pied gauche.", de: "Vor dem Betreten der Toilette sprechen, mit dem linken Fuß eintreten." },
    arabic: "بِسْمِ اللَّهِ، اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْخُبْثِ وَالْخَبَائِثِ",
    transliteration: "Bismillah, Allahumma inni a'udhu bika minal khubthi wal khaba'ith.",
    translation: { en: "In the name of Allah. O Allah, I seek refuge in You from the male and female devils.", fr: "Au nom d'Allah. Ô Allah, je cherche refuge en Toi contre les démons mâles et femelles.", de: "Im Namen Allahs. O Allah, ich suche Zuflucht bei Dir vor den männlichen und weiblichen Dämonen." },     benefit: { en: "The toilet is a place where devils reside. This dua protects from their harm when entering.", fr: "Les toilettes sont un lieu où résident les démons. Cette invocation protège de leur mal en entrant.", de: "Die Toilette ist ein Ort, wo Dämonen verweilen. Dieses Dua schützt beim Eintreten vor ihrem Schaden." },     source: ["Sahih Bukhari", "Sahih Muslim"]   },   {     id: 23, catId: "toilet", type: "dua", order: 2,     title: { en: "Dua when leaving the toilet", fr: "Invocation en sortant des toilettes", de: "Dua beim Verlassen der Toilette" },     instruction: { en: "Say after leaving the toilet, exiting with the right foot.", fr: "Dire après être sorti des toilettes, en sortant du pied droit.", de: "Nach dem Verlassen der Toilette sprechen, mit dem rechten Fuß heraustreten." },     arabic: "غُفْرَانَكَ",     transliteration: "Ghufraanak.",     translation: { en: "I ask You for forgiveness.", fr: "Je Te demande pardon.", de: "Ich bitte Dich um Vergebung." },     benefit: { en: "The Prophet ﷺ said this every time he exited the toilet. It is a reminder that even in relieving ourselves, we need Allah's forgiveness and mercy.", fr: "Le Prophète ﷺ disait cela à chaque fois qu'il sortait des toilettes. C'est un rappel que même pour soulager nos besoins, nous avons besoin du pardon d'Allah.", de: "Der Prophet ﷺ sprach dies jedes Mal beim Verlassen der Toilette. Es erinnert uns daran, dass wir auch beim Erleichtern Allahs Vergebung bedürfen." },     source: ["Abu Dawud", "At-Tirmidhi", "Ibn Majah", "Hisnul Muslim"]   } 
];

// ═══════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + id).classList.add("active");
  window.scrollTo(0, 0);
}

function goHome() {
  showScreen("home");
  renderHome();
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  const homeBtn = document.getElementById("nav-btn-home");
  if (homeBtn) homeBtn.classList.add("active");
}

function goCategory() { showScreen("category"); renderCategory(currentCatId); }

function openCategory(catId) {
  currentCatId = catId;
  showScreen("category");
  renderCategory(catId);
}

function openDua(duaIndex) {
  currentDuaIndex = duaIndex;
  showScreen("detail");
  renderDetail();
}

function navigateDua(dir) {
  const catDuas = duas.filter(d => d.catId === currentCatId);
  const newIndex = currentDuaIndex + dir;
  if (newIndex >= 0 && newIndex < catDuas.length) {
    currentDuaIndex = newIndex;
    renderDetail();
    window.scrollTo(0, 0);
  }
}

// ═══════════════════════════════════════
// LANGUAGE
// ═══════════════════════════════════════
function setLang(l) {
  lang = l;
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.textContent.trim() === l.toUpperCase()));
  const t = ui[l];
  document.getElementById("tagline").textContent = t.tagline;
  document.getElementById("hero-sub").textContent = t.heroSub;
  document.getElementById("section-label").textContent = t.allCats;
  document.getElementById("nav-home").textContent = t.navHome;
  document.getElementById("nav-favs").textContent = t.navFavs;
  document.getElementById("nav-search").textContent = t.navSearch;
  document.getElementById("nav-settings").textContent = t.navSettings;
  renderHome();
  if (currentCatId) renderCategory(currentCatId);
}

// ═══════════════════════════════════════
// RENDER HOME
// ═══════════════════════════════════════
function renderHome() {
  const totalDuas = duas.length;
  document.getElementById("stat-cats").textContent = categories.length;
  document.getElementById("stat-duas").textContent = totalDuas; document.title = "Dua & Dhikr v" + duas.length;

  const list = document.getElementById("category-list");
  list.innerHTML = "";

  categories.forEach((cat, i) => {
    const catDuas = duas.filter(d => d.catId === cat.id);
    const card = document.createElement("div");
    card.className = "category-card";
    card.style.animationDelay = (i * 0.06) + "s";
    card.onclick = () => openCategory(cat.id);
    card.innerHTML = `
      <div class="cat-icon">${cat.icon}</div>
      <div class="cat-info">
        <div class="cat-name">${cat.name[lang]}</div>
        <div class="cat-sub">${cat.sub[lang]}</div>
      </div>
      <div class="cat-count">${catDuas.length}</div>
      <div class="cat-arrow">›</div>
    `;
    list.appendChild(card);
  });
}

// ═══════════════════════════════════════
// RENDER CATEGORY
// ═══════════════════════════════════════
function renderCategory(catId) {
  const cat = categories.find(c => c.id === catId);
  const catDuas = duas.filter(d => d.catId === catId);
  const t = ui[lang];

  document.getElementById("cat-screen-title").textContent = cat.name[lang];
  document.getElementById("cat-arabic-title").textContent = cat.arabicTitle;
  document.getElementById("cat-title-display").textContent = cat.name[lang].toUpperCase();
  document.getElementById("cat-sub-display").textContent = `${cat.sub[lang]} • ${catDuas.length} ${t.navDuas}`;
  document.getElementById("back-home-label").textContent = t.backHome;
  document.getElementById("nav-home2").textContent = t.navHome;
  document.getElementById("nav-duas2").textContent = t.navDuas;
  document.getElementById("nav-favs2").textContent = t.navFavs;
  document.getElementById("nav-search2").textContent = t.navSearch;

  const container = document.getElementById("dua-list-container");
  container.innerHTML = "";

  catDuas.forEach((dua, i) => {
    const badgeMap = { dua: `<span class="dua-item-badge badge-dua">Dua</span>`, info: `<span class="dua-item-badge badge-info">Info</span>`, surah: `<span class="dua-item-badge badge-surah">Surah</span>`, dhikr: `<span class="dua-item-badge badge-dhikr">Dhikr</span>`, steps: `<span class="dua-item-badge badge-steps">Guide</span>` };
    const item = document.createElement("div");
    item.className = "dua-item";
    item.style.animationDelay = (i * 0.04) + "s";
    item.onclick = () => openDua(i);
    item.innerHTML = `
      <div class="dua-num">${dua.order}</div>
      <div class="dua-item-info">
        <div class="dua-item-title">${dua.title[lang]}</div>
        ${badgeMap[dua.type] || ''}
      </div>
      <div class="dua-item-arrow">›</div>
    `;
    container.appendChild(item);
  });
}

// ═══════════════════════════════════════
// RENDER DETAIL
// ═══════════════════════════════════════
function renderDetail() {
  const catDuas = duas.filter(d => d.catId === currentCatId);
  const dua = catDuas[currentDuaIndex];
  const cat = categories.find(c => c.id === currentCatId);
  const t = ui[lang];
  const isFav = favorites.includes(dua.id);

  document.getElementById("detail-header-title").textContent = cat.name[lang];
  document.getElementById("back-cat-label").textContent = cat.name[lang];
  document.getElementById("detail-pos").textContent = `${currentDuaIndex + 1} / ${catDuas.length}`;
  document.getElementById("prev-btn").disabled = currentDuaIndex === 0;
  document.getElementById("next-btn").disabled = currentDuaIndex === catDuas.length - 1;
  document.getElementById("prev-label").textContent = t.prev;
  document.getElementById("next-label").textContent = t.next;
  document.getElementById("nav-home3").textContent = t.navHome;
  document.getElementById("nav-list3").textContent = t.navList;
  document.getElementById("nav-dua3").textContent = t.navDua;
  document.getElementById("nav-favs3").textContent = t.navFavs;

  const favBtn = document.getElementById("fav-btn");
  favBtn.textContent = isFav ? "★" : "☆";
  favBtn.className = "fav-btn" + (isFav ? " active" : "");

  const body = document.getElementById("detail-body");
  let html = `<h2 style="font-size:16px;font-weight:700;color:var(--text-main);margin-bottom:16px;line-height:1.4;">${dua.title[lang]}</h2>`;

  const instruction = dua.instruction ? `<div class="instruction-box">📌 ${dua.instruction[lang]}</div>` : "";
  const sources = dua.source ? `<div class="source-row">${dua.source.map(s=>`<span class="source-tag">${s}</span>`).join('')}</div>` : "";

  if (dua.type === "info") {
    html += `<p class="info-text">${dua.content[lang]}</p>${sources}`;
  } else if (dua.type === "dua") {
    const translit = dua.transliteration ? `<div class="transliteration"><div class="trans-label">${t.transliteration}</div><div class="trans-text">${dua.transliteration}</div></div>` : "";
        const extraArabic = dua.arabic_extra ? `<div class="arabic-block" style="margin-top:12px;"><div style="font-size:11px;color:var(--gold);font-weight:700;margin-bottom:8px;">ثُمَّ – ${lang==="de"?"Dann":"Then"}</div><div class="arabic-text">${dua.arabic_extra}</div></div><div class="transliteration"><div class="trans-label">${t.transliteration}</div><div class="trans-text">${dua.transliteration_extra}</div></div>` : "";
    const benefit = dua.benefit ? `<div class="benefit-box"><span class="benefit-icon">✨</span><span class="benefit-text">${dua.benefit[lang]}</span></div>` : "";
    const promise = dua.promise ? `<div class="promise-box"><div class="promise-label">🌟 ${t.promise}</div><div class="promise-text">${dua.promise[lang]}</div></div>` : "";
    const scholarsHtml = dua.scholars ? `<div style="margin-top:12px;"><div class="translation-label">📜 ${t.scholars}</div>${dua.scholars[lang].map(s=>`<div class="scholar-box"><div class="scholar-name">${s.name}</div><div class="scholar-text">${s.text}</div></div>`).join('')}</div>` : "";
    html += `${instruction}<div class="arabic-block"><div class="arabic-text">${dua.arabic}</div></div>${translit}${extraArabic}<div class="translation-block"><div class="translation-label">${t.translation}</div><div class="translation-text">${dua.translation[lang]}</div></div>${promise}${scholarsHtml}${benefit}${sources}`;
  } else if (dua.type === "surah") {
    const surahsHtml = dua.surahs.map(s => `
      <div class="arabic-block" style="margin-bottom:10px;">
        <div style="font-size:12px;color:var(--gold);font-weight:700;letter-spacing:0.5px;margin-bottom:10px;text-align:left;direction:ltr;">
          📖 ${s.name[lang]} &nbsp;•&nbsp; ${s.ref}
        </div>
        <div class="arabic-text">${s.arabic}</div>
        ${s.transliteration ? `<div style="font-size:12px;color:var(--green-glow);font-style:italic;margin-top:10px;text-align:left;direction:ltr;line-height:1.7;">${s.transliteration}</div>` : ''}
        ${s.translation ? `<div style="font-size:13px;color:var(--text-main);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);text-align:left;direction:ltr;line-height:1.7;opacity:0.85;">${s.translation[lang]}</div>` : (s.note ? `<div style="font-size:11px;color:var(--text-muted);margin-top:6px;font-style:italic;">${s.note[lang]}</div>` : '')}
      </div>
    `).join("<div class='ornament'>✦ ✦ ✦</div>");
    const benefitsHtml = dua.benefits[lang].map(b=>`<div class="benefit-box" style="margin-bottom:8px;"><span class="benefit-icon">✨</span><span class="benefit-text">${b}</span></div>`).join("");
    html += `${instruction}${surahsHtml}<div style="margin-top:14px;"><div class="translation-label">${t.benefit}</div>${benefitsHtml}</div>${sources}`;
  } else if (dua.type === "dhikr") {
    const dhikrHtml = dua.dhikr_items.map(d=>`<div class="dhikr-card"><div class="dhikr-count">${d.count}×</div><div class="dhikr-info"><div class="dhikr-arabic">${d.arabic}</div><div class="dhikr-trans">${d.transliteration}</div><div class="dhikr-meaning">${d.meaning[lang]}</div></div></div><div class="ornament">✦</div>`).join("");
    const storyHtml = dua.story ? `<div class="story-box"><div class="story-label">📜 ${t.story}</div><div class="story-text">${dua.story[lang]}</div></div>` : "";
    const benefit = dua.benefit ? `<div class="benefit-box"><span class="benefit-icon">✨</span><span class="benefit-text">${dua.benefit[lang]}</span></div>` : "";
    html += `${instruction}<div style="margin-top:12px;">${dhikrHtml}</div>${storyHtml}${benefit}${sources}`;
  } else if (dua.type === "steps") {
    const stepsHtml = dua.steps.map(s=>`<div class="step-card"><div class="step-icon-box"><span class="step-emoji">${s.icon}</span><span class="step-num">${s.number}</span></div><div class="step-content"><div class="step-action">${s.action[lang]}</div>${s.arabic?`<div style="font-family:'Scheherazade New',serif;font-size:22px;color:var(--text-arabic);text-align:right;direction:rtl;margin:8px 0;">${s.arabic}</div><div style="font-size:11px;color:var(--green-glow);font-style:italic;margin-bottom:5px;">${s.transliteration}</div>`:''}<div class="step-detail">${s.detail[lang]}</div><div class="step-source">📚 ${s.source}</div></div></div>`).join("");
    html += `<p class="info-text" style="margin-bottom:14px;">${dua.intro[lang]}</p>${stepsHtml}${sources}`;
  }

  body.innerHTML = html;
}

// ═══════════════════════════════════════
// FAVORITES
// ═══════════════════════════════════════
function toggleFav() {
  const catDuas = duas.filter(d => d.catId === currentCatId);
  const dua = catDuas[currentDuaIndex];
  if (favorites.includes(dua.id)) {
    favorites = favorites.filter(f => f !== dua.id);
  } else {
    favorites.push(dua.id);
  }
  try { localStorage.setItem("dua_favs", JSON.stringify(favorites)); } catch(e) {}
  const favBtn = document.getElementById("fav-btn");
  favBtn.textContent = favorites.includes(dua.id) ? "★" : "☆";
  favBtn.className = "fav-btn" + (favorites.includes(dua.id) ? " active" : "");
}

function showFavorites() {
  alert("Favorites coming soon! ⭐");
}


// ═══════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════
function showSearch() {
  showScreen("search");
  setTimeout(() => {
    const inp = document.getElementById("search-input");
    if (inp) inp.focus();
  }, 100);
  const t = ui[lang];
  document.getElementById("search-title").textContent = t.navSearch || "Search";
  document.getElementById("search-input").placeholder = t.searchPlaceholder || "Search duas...";
  if (!document.getElementById("search-input").value) {
    document.getElementById("search-results").innerHTML =
      "<div class=\"search-empty\">🔍</div>";
  }
}

function highlight(text, query) {
  if (!query || !text) return text || "";
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return text.replace(new RegExp("(" + escaped + ")", "gi"),
    "<mark>$1</mark>");
}

function doSearch(query) {
  const clearBtn = document.getElementById("search-clear");
  clearBtn.style.display = query ? "block" : "none";
  const resultsEl = document.getElementById("search-results");

  if (!query.trim()) {
    resultsEl.innerHTML = "<div class=\"search-empty\">🔍</div>";
    return;
  }

  const q = query.toLowerCase();
  const results = [];

  duas.forEach(dua => {
    const title = (dua.title && dua.title[lang]) || "";
    const translation = (dua.translation && dua.translation[lang]) || (dua.content && dua.content[lang]) || "";
    const transliteration = dua.transliteration || "";
    const arabic = dua.arabic || "";
    const benefit = (dua.benefit && dua.benefit[lang]) || "";

    const matchTitle = title.toLowerCase().includes(q);
    const matchTrans = translation.toLowerCase().includes(q);
    const matchTranslit = transliteration.toLowerCase().includes(q);
    const matchArabic = arabic.includes(query);
    const matchBenefit = benefit.toLowerCase().includes(q);

    if (matchTitle || matchTrans || matchTranslit || matchArabic || matchBenefit) {
      const cat = categories.find(c => c.id === dua.catId);
      const catName = cat ? (cat.name[lang] || cat.name.en) : "";
      let snippet = "";
      if (matchTrans) {
        const idx = translation.toLowerCase().indexOf(q);
        const start = Math.max(0, idx - 40);
        snippet = (start > 0 ? "…" : "") + translation.substring(start, idx + q.length + 60) + "…";
      } else if (matchBenefit) {
        const idx = benefit.toLowerCase().indexOf(q);
        const start = Math.max(0, idx - 40);
        snippet = (start > 0 ? "…" : "") + benefit.substring(start, idx + q.length + 60) + "…";
      } else if (matchTranslit) {
        snippet = transliteration.substring(0, 100) + "…";
      }
      results.push({ dua, catName, title, arabic: matchArabic ? arabic : "", snippet, query });
    }
  });

  if (results.length === 0) {
    resultsEl.innerHTML = "<div class=\"search-empty\">No results found for <strong>\"" + query + "\"</strong></div>";
    return;
  }

  let html = "<div class=\"search-count\">" + results.length + " result" + (results.length > 1 ? "s" : "") + "</div>";
  results.forEach(({ dua, catName, title, arabic, snippet, query }) => {
    html += "<div class=\"search-result-item\" onclick=\"openDuaFromSearch(" + dua.id + ")\">";
    html += "<div class=\"search-result-cat\">" + catName + "</div>";
    html += "<div class=\"search-result-title\">" + highlight(title, query) + "</div>";
    if (arabic) {
      html += "<div class=\"search-result-arabic\">" + arabic.substring(0, 60) + (arabic.length > 60 ? "…" : "") + "</div>";
    }
    if (snippet) {
      html += "<div class=\"search-result-snippet\">" + highlight(snippet, query) + "</div>";
    }
    html += "</div>";
  });

  resultsEl.innerHTML = html;
}

function clearSearch() {
  document.getElementById("search-input").value = "";
  document.getElementById("search-clear").style.display = "none";
  document.getElementById("search-results").innerHTML = "<div class=\"search-empty\">🔍</div>";
  document.getElementById("search-input").focus();
}

function openDuaFromSearch(duaId) {
  const dua = duas.find(d => d.id === duaId);
  if (!dua) return;
  const cat = categories.find(c => c.id === dua.catId);
  if (!cat) return;
  currentCatId = cat.id;
  const catDuas = duas.filter(d => d.catId === currentCatId);
  currentDuaIndex = catDuas.findIndex(d => d.id === duaId);
  renderDetail();
  showScreen("detail");
}

// INIT
// ═══════════════════════════════════════
renderHome();
</script>
