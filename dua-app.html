    translation: { en: "Allah – there is no deity except Him, the Ever-Living, the Sustainer of all existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills. His Throne extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great.", fr: "Allah – il n'y a pas de divinité en dehors de Lui, le Vivant, le Subsistant de toute existence. Ni somnolence ni sommeil ne Le saisissent. À Lui appartient tout ce qui est dans les cieux et sur la terre. Qui peut intercéder auprès de Lui sans Sa permission ? Il sait ce qui est devant eux et ce qui est derrière eux, et ils ne saisissent de Sa science que ce qu'Il veut. Son Trône s'étend sur les cieux et la terre, et leur préservation ne Lui coûte aucune peine. Il est le Très Haut, le Très Grand.", de: "Allah – es gibt keinen Gott außer Ihm, dem Lebendigen, dem Beständigen aller Existenz. Ihn erfasst weder Schlummer noch Schlaf. Ihm gehört alles, was in den Himmeln und auf der Erde ist. Wer kann bei Ihm Fürsprache einlegen außer mit Seiner Erlaubnis? Er weiß was vor ihnen und was hinter ihnen liegt, und sie umfassen nichts von Seinem Wissen außer was Er will. Sein Thron erstreckt sich über die Himmel und die Erde, und ihre Bewahrung ermüdet Ihn nicht. Er ist der Erhabene, der Gewaltige." },     benefit: { en: "Whoever recites Ayat al-Kursi before sleeping will be protected by Allah throughout the night.", fr: "Celui qui récite l'Ayat al-Kursi avant de dormir sera protégé par Allah toute la nuit.", de: "Wer Ayat Kursi vor dem Schlafen liest, wird die ganze Nacht von Allah beschützt." },

    arabic: "ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ ۚ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَـٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِۦ ۚ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ ۝ لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَـٰفِرِينَ",
    transliteration: "Amana ar-rasulu bima unzila ilayhi min rabbihi wal-mu'minun...",     translation: { en: "The Messenger has believed in what was revealed to him from his Lord, and so have the believers. All of them have believed in Allah and His angels and His books and His messengers, saying: We make no distinction between any of His messengers. And they say: We hear and we obey. Grant us Your forgiveness, our Lord, and to You is the final destination. Allah does not burden a soul beyond that it can bear. It will have the reward of that which it earned, and it will bear the consequence of that which it committed. Our Lord, do not impose blame upon us if we have forgotten or erred. Our Lord, do not lay upon us a burden like that which You laid upon those before us. Our Lord, do not burden us with that which we have no ability to bear. And pardon us; and forgive us; and have mercy upon us. You are our protector, so give us victory over the disbelieving people.", fr: "Le Messager a cru en ce qui lui a été révélé par son Seigneur, et les croyants aussi. Tous ont cru en Allah, en Ses anges, en Ses livres et en Ses messagers. Nous ne faisons pas de distinction entre Ses messagers. Et ils disent : Nous entendons et nous obéissons. Accorde-nous Ton pardon, notre Seigneur, et c'est vers Toi que mène la destination finale. Allah n'impose à aucune âme une charge supérieure à sa capacité. À son actif ce qu'elle a acquis, et à son passif ce qu'elle a commis. Notre Seigneur, ne nous châtie pas si nous oublions ou commettons des erreurs. Notre Seigneur, ne nous impose pas un fardeau comme Tu l'as imposé à ceux d'avant nous. Notre Seigneur, ne nous charge pas de ce que nous ne pouvons supporter. Pardonne-nous, absous-nous et fais-nous miséricorde. Tu es notre Maître, donne-nous la victoire sur les peuples mécréants.", de: "Der Gesandte glaubt an das, was ihm von seinem Herrn herabgesandt wurde, und die Gläubigen auch. Alle glauben an Allah und Seine Engel und Seine Bücher und Seine Gesandten. Wir machen keinen Unterschied zwischen Seinen Gesandten. Und sie sagen: Wir hören und gehorchen. Gewähre uns Deine Vergebung, unser Herr, und zu Dir ist das endgültige Ziel. Allah belastet keine Seele über ihre Fähigkeit hinaus. Zu ihren Gunsten was sie erworben hat, und zu ihren Ungunsten was sie begangen hat. Unser Herr, bestrafe uns nicht wenn wir vergessen oder irren. Unser Herr, lege uns keine Last auf wie Du sie denen vor uns auferlegt hast. Unser Herr, bürde uns nicht auf was wir nicht tragen können. Und vergib uns, verzeihe uns und erbarme Dich unser. Du bist unser Beschützer, hilf uns gegen die ungläubigen Menschen." },     benefit: { en: "These two verses suffice whoever recites them at night.", fr: "Ces deux versets suffisent à celui qui les récite la nuit.", de: "Diese zwei Verse genügen demjenigen, der sie in der Nacht liest." },     source: ["Sahih Bukhari", "Sahih Muslim"]   },   {     id: 5, catId: "sleep", type: "dua", order: 5,     title: { en: "Dua before sleeping – To die upon Fitrah", fr: "Invocation avant de dormir – Mourir sur la Fitrah", de: "Dua vor dem Schlafen – Auf der Fitrah sterben" },     instruction: { en: "Perform ablution, lie on your right side and recite.", fr: "Faire les ablutions, s'allonger sur le côté droit et réciter.", de: "Wudu machen, auf die rechte Seite legen und sprechen." },
    arabic: "اَللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لاَ مَلْجَأَ وَلاَ مَنْجَا مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ",
    transliteration: "Allahumma aslamtu nafsi ilaika, wa wajjahtu wajhi ilaika, wa fawwadhtu amri ilaika, wa alja'tu zahri ilaika, raghbatan wa rahbatan ilaika, la malja'a wa la manja minka illa ilaika, amantu bikitabika alladhi anzalta, wa binabiyyika alladhi arsalta.",
    translation: { en: "O Allah, I submit myself to You, I turn my face to You, I entrust my affairs to You, I rely on You in hope and fear. There is no refuge except with You. I believe in Your Book and Your Prophet.", fr: "Ô Allah, je me soumets à Toi, je tourne mon visage vers Toi, je Te confie mes affaires et je m'appuie sur Toi avec espoir et crainte. Il n'y a aucun refuge sauf auprès de Toi. Je crois en Ton Livre et Ton Prophète.", de: "O Allah, ich ergebe mich Dir, ich wende mein Gesicht Dir zu, ich überlasse meine Angelegenheiten Dir, ich stütze mich auf Dich – in Hoffnung und Furcht. Es gibt keinen Zufluchtsort außer bei Dir. Ich glaube an Dein Buch und Deinen Propheten." },
    benefit: { en: "Whoever recites this and dies that night will die upon Islam (Fitrah).", fr: "Celui qui récite cela et meurt cette nuit mourra sur l'Islam (Fitrah).", de: "Wer dieses Dua liest und in der Nacht stirbt, stirbt im Zustand des Islam (Fitrah)." },     source: ["Sahih Bukhari 6311", "Sahih Muslim 2710"]   },   {     id: 6, catId: "sleep", type: "dua", order: 6,     title: { en: "Bismika Rabbi – Dua when lying down", fr: "Bismika Rabbi – Invocation en se couchant", de: "Bismika Rabbi – Dua beim Hinlegen" },     instruction: { en: "Recite when lying down.", fr: "Réciter en se couchant.", de: "Beim Hinlegen sprechen." },     arabic: "بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، إِنْ أَمْسَكْتَ نَفْسِي فَارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ",     transliteration: "Bismika Rabbi wada'tu janbi, wa bika arfa'uhu, in amsakta nafsi farhamha, wa in arsaltaha fahfazha bima tahfazhu bihi 'ibadakas-salihin.",
    translation: { en: "In Your name, my Lord, I lie down and rise. If You take my soul, have mercy on it. If You return it, protect it as You protect Your righteous servants.", fr: "En Ton nom, mon Seigneur, je me couche et me relève. Si Tu prends mon âme, fais-lui miséricorde. Si Tu la rends, protège-la comme Tu protèges Tes serviteurs vertueux.", de: "In Deinem Namen, mein Herr, lege ich mich nieder und stehe wieder auf. Wenn Du meine Seele nimmst, erbarme Dich ihrer. Wenn Du sie zurückgibst, beschütze sie." },
    source: ["Sahih Bukhari", "Sahih Muslim"]
  },
  {
    id: 7, catId: "sleep", type: "dua", order: 7,
    title: { en: "Allahumma khalaqta nafsi – Asking for wellbeing", fr: "Allahumma khalaqta nafsi – Demander la santé", de: "Allahumma khalaqta nafsi – Um Wohlbefinden bitten" },
    arabic: "اَللَّهُمَّ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا، لَكَ مَمَاتُهَا وَمَحْيَاهَا، إِنْ أَحْيَيْتَهَا فَاحْفَظْهَا، وَإِنْ أَمَتَّهَا فَاغْفِرْ لَهَا، اَللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ",
    transliteration: "Allahumma khalaqta nafsi wa anta tawaffaha, laka mamatuha wa mahyaha, in ahyaytaha fahfazha, wa in amattaha faghfir laha, Allahumma inni as'alukal 'afiyah.",
    translation: { en: "O Allah, You created my soul and You take it. Its life and death belong to You. If You keep it alive, protect it. If You cause it to die, forgive it. O Allah, I ask You for wellbeing.", fr: "Ô Allah, Tu as créé mon âme et Tu la rappelles. Sa mort et sa vie T'appartiennent. Si Tu la laisses vivre, protège-la. Si Tu la fais mourir, pardonne-lui. Ô Allah, je Te demande la santé.", de: "O Allah, Du hast meine Seele erschaffen und Du nimmst sie. Ihr Leben und Tod gehören Dir. Wenn Du sie leben lässt, beschütze sie. Wenn Du sie sterben lässt, vergib ihr. O Allah, ich bitte Dich um Wohlbefinden." },     source: ["Sahih Muslim"]   },   {     id: 8, catId: "sleep", type: "dua", order: 8,     title: { en: "Allahumma qini – Protection from punishment", fr: "Allahumma qini – Protection du châtiment", de: "Allahumma qini – Schutz vor der Strafe" },     instruction: { en: "Recite before sleeping, often after lying down.", fr: "Réciter avant de dormir, souvent après s'être couché.", de: "Vor dem Schlafen sprechen, oft nachdem man sich ins Bett gelegt hat." },
    arabic: "اَللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ",
    transliteration: "Allahumma qini 'adhabaka yawma tab'athu 'ibadak.",     translation: { en: "O Allah, protect me from Your punishment on the Day You resurrect Your servants.", fr: "Ô Allah, protège-moi de Ton châtiment le jour où Tu ressusciteras Tes serviteurs.", de: "O Allah, bewahre mich vor Deiner Strafe an dem Tag, an dem Du Deine Diener auferweckst." },     benefit: { en: "This short supplication asks for protection from punishment on the Day of Resurrection.", fr: "Cette courte invocation demande la protection contre le châtiment au Jour de la Résurrection.", de: "Dieses kurze Bittgebet bittet um Schutz vor der Strafe am Tag der Auferstehung." },     source: ["Sahih Bukhari", "Sahih Muslim"]   },   {     id: 9, catId: "sleep", type: "dua", order: 9,     title: { en: "Dying and living in the name of Allah", fr: "Mourir et vivre au nom d'Allah", de: "Im Namen Allahs sterben und leben" },
    arabic: "بِاسْمِكَ اللَّهُمَّ أَمُوْتُ وَأَحْيَا",
    transliteration: "Bismika-llaahumma amuutu wa ahyaa.",
    translation: { en: "In Your name, O Allah, I die and I live.", fr: "En Ton nom, ô Allah, je meurs et je vis.", de: "In Deinem Namen, o Allah, sterbe ich und lebe ich." },
    benefit: { en: "Sleep is a small death – Allah takes the soul and returns it upon waking. The Prophet ﷺ recited this every night before sleeping.", fr: "Le sommeil est une petite mort – Allah prend l'âme et la rend au réveil. Le Prophète ﷺ récitait cela chaque nuit avant de dormir.", de: "Der Schlaf ist ein kleiner Tod – Allah nimmt die Seele und gibt sie beim Aufwachen zurück. Der Prophet ﷺ sprach dies jede Nacht vor dem Schlafen." },     source: ["Sahih Bukhari 6324"]   },   {     id: 10, catId: "sleep", type: "surah", order: 10,     title: { en: "Surah As-Sajdah and Al-Mulk before sleeping", fr: "Sourate As-Sajdah et Al-Mulk avant de dormir", de: "Sure As-Sajdah und Al-Mulk vor dem Schlafen" },     instruction: { en: "Recite Surah As-Sajdah (32:1–30) and Surah Al-Mulk (67:1–30) in full before sleeping.", fr: "Réciter en entier la Sourate As-Sajdah (32:1–30) et la Sourate Al-Mulk (67:1–30) avant de dormir.", de: "Vor dem Schlafen Sure As-Sajdah (32:1–30) und Sure Al-Mulk (67:1–30) vollständig lesen." },     surahs: [       { name: { en: "Surah As-Sajdah (The Prostration)", fr: "Sourate As-Sajdah (La Prosternation)", de: "Sure As-Sajdah (Die Niederwerfung)" }, ref: "32:1–30", arabic: "الم ۝ تَنزِيلُ الْكِتَابِ لَا رَيْبَ فِيهِ مِن رَّبِّ الْعَالَمِينَ", note: { en: "Opening verses", fr: "Versets d'ouverture", de: "Erste Verse" } },
      { name: { en: "Surah Al-Mulk (The Sovereignty)", fr: "Sourate Al-Mulk (La Royauté)", de: "Sure Al-Mulk (Die Herrschaft)" }, ref: "67:1–30", arabic: "تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", note: { en: "Opening verses", fr: "Versets d'ouverture", de: "Erste Verse" } }     ],     benefits: { en: ["Surah Al-Mulk protects from the punishment of the grave.", "The Prophet ﷺ would not sleep until he had recited these two surahs."], fr: ["La Sourate Al-Mulk protège du châtiment de la tombe.", "Le Prophète ﷺ ne dormait pas avant d'avoir récité ces deux sourates."], de: ["Sure Al-Mulk schützt vor der Strafe im Grab.", "Der Prophet ﷺ schlief nicht, bevor er diese beiden Suren gelesen hatte."] },
    source: ["At-Tirmidhi", "An-Nasai", "Hisnul Muslim"]
  },
  {
    id: 11, catId: "sleep", type: "dhikr", order: 11,
    title: { en: "Dhikr for Fatigue – Tasbih of Fatimah", fr: "Dhikr de la Fatigue – Tasbih de Fatima", de: "Dhikr der Erschöpfung – Tasbih Fatimas" },
    instruction: { en: "Recite before sleeping. The order may vary.", fr: "À réciter avant de dormir. L'ordre peut varier.", de: "Vor dem Schlafen zu sprechen. Die Reihenfolge ist frei wählbar." },     dhikr_items: [       { arabic: "سُبْحَانَ اللَّهِ", transliteration: "Subhaanallah", count: 33, meaning: { en: "Glory be to Allah", fr: "Gloire à Allah", de: "Gepriesen sei Allah" } },       { arabic: "اَلْحَمْدُ لِلَّهِ", transliteration: "Alhamdulillah", count: 33, meaning: { en: "All praise is due to Allah", fr: "Toute louange appartient à Allah", de: "Alles Lob gebührt Allah" } },       { arabic: "اَللَّهُ أَكْبَرُ", transliteration: "Allahu Akbar", count: 34, meaning: { en: "Allah is the Greatest", fr: "Allah est le Plus Grand", de: "Allah ist der Größte" } }     ],     story: { en: "Fatimah complained to the Prophet ﷺ about blisters on her hands from grinding. He came to her and Ali at night and said: 'Shall I not tell you of something better than a servant? When you go to bed, say Allahu Akbar 34 times, Subhanallah 33 times and Alhamdulillah 33 times.' Ali said: I have never abandoned this – not even on the night of the Battle of Siffin.", fr: "Fatima s'est plainte au Prophète ﷺ des ampoules sur ses mains. Il vint la voir et dit : 'Ne vous indiquerai-je pas quelque chose de meilleur qu'une servante ? Dites Allahu Akbar 34 fois, Subhanallah 33 fois et Alhamdulillah 33 fois.' Ali dit : Je ne l'ai jamais abandonné – pas même la nuit de la bataille de Siffin.", de: "Fatimah klagte dem Propheten ﷺ über Schwielen an ihren Händen. Er kam nachts zu ihr und Ali und sagte: 'Soll ich euch etwas zeigen, das besser ist als eine Dienerin? Sprecht 34× Allahu Akbar, 33× Subhanallah und 33× Alhamdulillah.' Ali sagte: Ich habe es nie aufgegeben – nicht einmal in der Nacht der Schlacht von Siffin." },
    benefit: { en: "This dhikr gives strength and relieves fatigue. It is better than a servant, as it connects to the eternal.", fr: "Ce dhikr donne de la force et soulage la fatigue. Il vaut mieux qu'une servante car il relie à l'éternel.", de: "Dieser Dhikr gibt Kraft und lindert Erschöpfung. Er ist besser als eine Dienerin, denn er verbindet mit dem Ewigen." },
    source: ["Sahih Bukhari 3113", "Sahih Muslim 2727"]
  },
  {
    id: 12, catId: "sleep", type: "dua", order: 12,
    title: { en: "Sleep Dua 11 – Lord of the Seven Heavens", fr: "Invocation du Sommeil 11 – Seigneur des Sept Cieux", de: "Schlafdua 11 – Herr der sieben Himmel" },
    arabic: "اَللَّهُمَّ رَبَّ السَّمَاوَاتِ السَّبْعِ وَرَبَّ الْعَرْشِ الْعَظِيْمِ، رَبَّنَا وَرَبَّ كُلِّ شَيْءٍ، فَالِقَ الْحَبِّ وَالنَّوَى، وَمُنْزِلَ التَّوْرَاةِ وَاْلإِنْجِيْلِ وَالْفُرْقَانِ، أَعُوْذُ بِكَ مِنْ شَرِّ كُلِّ شَيْءٍ أَنْتَ آخِذٌ بِنَاصِيَتِهِ. اَللَّهُمَّ أَنْتَ اْلأَوَّلُ فَلَيْسَ قَبْلَكَ شَيْءٌ، وَأَنْتَ اْلآخِرُ فَلَيْسَ بَعْدَكَ شَيْءٌ، وَأَنْتَ الظَّاهِرُ فَلَيْسَ فَوْقَكَ شَيْءٌ، وَأَنْتَ الْبَاطِنُ فَلَيْسَ دُوْنَكَ شَيْءٌ، اِقْضِ عَنَّا الدَّيْنَ وَأَغْنِنَا مِنَ الْفَقْرِ",
    transliteration: "Allaahumma robbas-samaawaatis-sab'i wa robbal 'arsyil 'azhiim, robbanaa wa robba kulli syai-in...",     translation: { en: "O Allah, Lord of the seven heavens and the Magnificent Throne, our Lord and Lord of all things... You are the First, the Last, the Manifest, the Hidden. Settle our debts and free us from poverty.", fr: "Ô Allah, Seigneur des sept cieux et du Trône Majestueux... Tu es le Premier, le Dernier, le Manifeste, le Caché. Acquitte nos dettes et libère-nous de la pauvreté.", de: "O Allah, Herr der sieben Himmel und des gewaltigen Thrones... Du bist der Erste, der Letzte, der Offenbare, der Verborgene. Tilge unsere Schulden und befreie uns von der Armut." },     benefit: { en: "Contains four of Allah's greatest names: Al-Awwal, Al-Akhir, Az-Zahir, Al-Batin.", fr: "Contient quatre des plus grands noms d'Allah : Al-Awwal, Al-Akhir, Az-Zahir, Al-Batin.", de: "Enthält vier der größten Namen Allahs: Al-Awwal, Al-Akhir, Az-Zahir, Al-Batin." },     source: ["Sahih Muslim 4/2084", "Hisnul Muslim"]   },   {     id: 13, catId: "sleep", type: "dua", order: 13,     title: { en: "Sleep Dua 12 – Gratitude for Allah's Blessings", fr: "Invocation du Sommeil 12 – Gratitude pour les Bienfaits", de: "Schlafdua 12 – Dankbarkeit für Allahs Gaben" },
    arabic: "اَلْحَمْدُ لِلَّهِ الَّذِيْ أَطْعَمَنَا، وَسَقَانَا، وَكَفَانَا، وَآوَانَا، فَكَمْ مِمَّنْ لاَ كَافِيَ لَهُ وَلاَ مُؤْوِيَ",
    transliteration: "Alhamdulillaahil-ladzii ath'amanaa, wa saqoonaa, wa kafaanaa, wa aawaanaa, fakam mimman laa kaafiya lahu wa laa mu'wii.",
    translation: { en: "All praise is due to Allah, Who fed us, gave us drink, provided for us, and gave us shelter. How many are there who have no one to provide for them and give them shelter.", fr: "Toute louange appartient à Allah, Qui nous a nourris, nous a abreuvés, nous a pourvus et nous a donné un abri. Combien sont ceux qui n'ont personne pour subvenir à leurs besoins.", de: "Alles Lob gebührt Allah, Der uns gespeist, getränkt, versorgt und Obdach gegeben hat. Wie viele gibt es, die niemanden haben, der sie versorgt und ihnen Obdach gibt." },     benefit: { en: "This dua reminds us of Allah's blessings before sleep and awakens gratitude for those who have less.", fr: "Cette invocation nous rappelle les bienfaits d'Allah avant le sommeil et éveille la gratitude.", de: "Dieses Dua erinnert uns beim Einschlafen an die Gaben Allahs und weckt Dankbarkeit." },     source: ["Sahih Muslim 4/2085", "Hisnul Muslim"]   },   {     id: 14, catId: "sleep", type: "dua", order: 14,     title: { en: "Sleep Dua 13 – Protection from one's own evil", fr: "Invocation du Sommeil 13 – Protection contre son propre mal", de: "Schlafdua 13 – Schutz vor dem eigenen Bösen" },
    arabic: "اَللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَاْلأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيْكَهُ، أَشْهَدُ أَنْ لاَ إِلَـٰهَ إِلاَّ أَنْتَ، أَعُوْذُ بِكَ مِنْ شَرِّ نَفْسِيْ، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِيْ سُوْءًا، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ",
    transliteration: "Allaahumma 'aalimal ghoibi wasy-syahaadati, faathiros-samaawaati wal ardh...",     translation: { en: "O Allah, Knower of the unseen and the seen, Creator of the heavens and earth... I seek refuge in You from the evil of my own soul, from Satan and his traps, and from committing wrong against myself or a Muslim.", fr: "Ô Allah, Connaisseur de l'invisible et du visible, Créateur des cieux et de la terre... Je cherche refuge en Toi contre le mal de mon âme, contre Satan et ses pièges, et contre le fait de nuire à moi-même ou à un musulman.", de: "O Allah, Kenner des Verborgenen und Sichtbaren, Schöpfer der Himmel und Erde... Ich suche Zuflucht bei Dir vor dem Bösen meiner eigenen Seele, vor dem Satan und davor, mir selbst oder einem Muslim Schlechtes anzutun." },
    benefit: { en: "Uniquely asks for protection from the evil of one's own soul (Nafs) – a deep self-reflection before sleep.", fr: "Demande uniquement la protection contre le mal de sa propre âme (Nafs) – une profonde auto-réflexion.", de: "Bittet einzigartig um Schutz vor dem Bösen der eigenen Seele (Nafs) – eine tiefe Selbstreflexion vor dem Schlaf." },     source: ["Abu Dawud 4/317", "Shahih At-Tirmidzi 3/142", "Hisnul Muslim"]   },   {     id: 15, catId: "sleep", type: "steps", order: 15,     title: { en: "What to do when having a bad dream?", fr: "Que faire en cas de mauvais rêve ?", de: "Was tun bei einem Albtraum?" },     intro: { en: "The Prophet ﷺ taught us five steps when having a bad dream. A bad dream comes from Satan – these actions protect you.", fr: "Le Prophète ﷺ nous a enseigné cinq étapes lors d'un mauvais rêve. Un mauvais rêve vient de Satan – ces actions te protègent.", de: "Der Prophet ﷺ lehrte uns fünf Schritte bei einem Albtraum. Ein schlechter Traum kommt vom Satan – diese Handlungen schützen dich." },
    steps: [
      { number:1, icon:"💨", action:{en:"Spit lightly to the left three times",fr:"Cracher légèrement à gauche trois fois",de:"Dreimal leicht nach links spucken"}, detail:{en:"A prophetic act that drives away Satan.",fr:"Un acte prophétique qui chasse Satan.",de:"Eine prophetische Handlung, die den Satan vertreibt."}, source:"Muslim 4/1772" },
      { number:2, icon:"🤲", action:{en:"Seek refuge in Allah from Satan three times",fr:"Chercher refuge auprès d'Allah contre Satan trois fois",de:"Dreimal Zuflucht bei Allah suchen vor Satan"}, arabic:"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", transliteration:"A'udhu billahi minash-shaytanir-rajim", detail:{en:"I seek refuge in Allah from the accursed Satan.",fr:"Je cherche refuge auprès d'Allah contre Satan le maudit.",de:"Ich suche Zuflucht bei Allah vor dem verfluchten Satan."}, source:"Muslim 4/1772-1773" },       { number:3, icon:"🤫", action:{en:"Do not tell anyone about the dream",fr:"Ne parler à personne du rêve",de:"Den Traum niemandem erzählen"}, detail:{en:"Telling a bad dream gives it no power over you.",fr:"Raconter un mauvais rêve lui ôte tout pouvoir sur toi.",de:"Ein schlecht erzählter Traum gibt ihm keine Macht über dich."}, source:"Muslim 4/1772" },       { number:4, icon:"🔄", action:{en:"Change sleeping position",fr:"Changer de position de sommeil",de:"Die Schlafposition wechseln"}, detail:{en:"Turn and continue sleeping on the other side.",fr:"Se retourner et continuer à dormir de l'autre côté.",de:"Den Körper umdrehen und auf der anderen Seite weiterschlafen."}, source:"Muslim 4/1773" },
      { number:5, icon:"🕌", action:{en:"Get up and pray (optional)",fr:"Se lever et prier (facultatif)",de:"Aufstehen und beten (optional)"}, detail:{en:"Recommended but not obligatory.",fr:"Recommandé mais pas obligatoire.",de:"Empfohlen, aber nicht verpflichtend."}, source:"Muslim 4/1773" }
    ],
    source: ["Sahih Muslim 4/1772-1773", "Hisnul Muslim"]
  },
  {
    id: 16, catId: "sleep", type: "dua", order: 16,
    title: { en: "Dua when feeling fear and loneliness during sleep", fr: "Invocation en cas de peur et solitude pendant le sommeil", de: "Dua bei Angst und Einsamkeit im Schlaf" },
    arabic: "أَعُوْذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ غَضَبِهِ وَعِقَابِهِ، وَشَرِّ عِبَادِهِ، وَمِنْ هَمَزَاتِ الشَّيَاطِيْنِ وَأَنْ يَحْضُرُوْنِ",
    transliteration: "A'uudzu bikalimaatillaahit-taammaati min ghodhobihi wa 'iqoobihi, wa syarri 'ibaadihi, wa min hamazaatisy-syayaathiini wa an yahdhuruun.",     translation: { en: "I seek refuge in the perfect words of Allah from His anger and punishment, from the evil of His servants, from the whispers of the devils and from their presence.", fr: "Je cherche refuge dans les paroles parfaites d'Allah contre Sa colère et Son châtiment, contre le mal de Ses serviteurs, contre les chuchotements des démons et contre leur présence.", de: "Ich suche Zuflucht in den vollkommenen Worten Allahs vor Seinem Zorn und Seiner Strafe, vor dem Bösen Seiner Diener, vor den Einflüsterungen der Teufel und davor, dass sie bei mir erscheinen." },
    benefit: { en: "Recited when afraid in the dark or alone. The perfect words of Allah encompass everything He has revealed.", fr: "Récitée lorsqu'on ressent de la peur seul. Les paroles parfaites d'Allah englobent tout ce qu'Il a révélé.", de: "Gesprochen wenn man sich fürchtet. Die vollkommenen Worte Allahs umfassen alles, was Er herabgesandt hat." },     source: ["Abu Dawud 4/12", "Shahih At-Tirmidzi 3/171", "Hisnul Muslim"]   },   {     id: 17, catId: "sleep", type: "dua", order: 17,     title: { en: "Dua when turning over during the night", fr: "Invocation en se retournant pendant la nuit", de: "Dua beim Umdrehen in der Nacht" },     instruction: { en: "Recite when turning from one side to the other during the night.", fr: "Réciter en se retournant d'un côté à l'autre pendant la nuit.", de: "Sprechen wenn man sich nachts von einer Seite auf die andere dreht." },     arabic: "لاَ إِلَـٰهَ إِلاَّ اللَّهُ الْوَاحِدُ الْقَهَّارُ، رَبُّ السَّمَاوَاتِ وَاْلأَرْضِ وَمَا بَيْنَهُمَا الْعَزِيْزُ الْغَفَّارُ",     transliteration: "Laa ilaaha illallaahul waahidul qohhaar, robbus-samaawaati wal ardhi wa maa bainahumal 'aziizul ghoffaar.",
    translation: { en: "There is no god but Allah, the One, the Almighty, Lord of the heavens and the earth and all between them, the Exalted in Might, the Oft-Forgiving.", fr: "Il n'y a pas de dieu sauf Allah, l'Unique, le Tout-Puissant, Seigneur des cieux et de la terre, le Puissant, le Très-Pardonneur.", de: "Es gibt keinen Gott außer Allah, dem Einen, dem Allmächtigen, dem Herrn der Himmel und der Erde, dem Erhabenen, dem Allvergebenden." },
    benefit: { en: "Contains four mighty names of Allah: Al-Wahid, Al-Qahhar, Al-Aziz, Al-Ghaffar. Every movement in the night becomes remembrance of Allah.", fr: "Contient quatre noms puissants d'Allah : Al-Wahid, Al-Qahhar, Al-Aziz, Al-Ghaffar. Chaque mouvement devient souvenir d'Allah.", de: "Enthält vier mächtige Namen Allahs: Al-Wahid, Al-Qahhar, Al-Aziz, Al-Ghaffar. Jede Bewegung in der Nacht wird zur Erinnerung an Allah." },
    source: ["Al-Hakim 1/540", "Shahihul Jami' 4/231", "Hisnul Muslim"]   },   {     id: 18, catId: "sleep", type: "dua", order: 18,     title: { en: "Waking Dua 1 – Praise after sleep", fr: "Invocation au Réveil 1 – Louange après le sommeil", de: "Dua beim Aufwachen 1 – Lob nach dem Schlaf" },     instruction: { en: "Recite immediately upon waking up.", fr: "Réciter immédiatement au réveil.", de: "Direkt beim Aufwachen sprechen." },     arabic: "اَلْحَمْدُ لِلَّهِ الَّذِيْ أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُوْرُ",     transliteration: "Alhamdulillaahil-ladzii ahyaanaa ba'da maa amaatanaa wa ilaihin-nusyuur.",
    translation: { en: "All praise is due to Allah, Who gave us life after He had caused us to die, and to Him is the resurrection.", fr: "Toute louange appartient à Allah, Qui nous a redonné la vie après nous avoir fait mourir, et c'est vers Lui que sera la résurrection.", de: "Alles Lob gebührt Allah, Der uns zum Leben erweckt hat, nachdem Er uns sterben ließ, und zu Ihm ist die Auferstehung." },     benefit: { en: "Sleep is a small death. This dua reminds us with the first breath that Allah gifted us life and we will return to Him.", fr: "Le sommeil est une petite mort. Cette invocation nous rappelle qu'Allah nous a accordé la vie et que nous retournerons vers Lui.", de: "Der Schlaf ist ein kleiner Tod. Dieses Dua erinnert uns beim ersten Atemzug daran, dass Allah uns das Leben schenkte." },
    source: ["Sahih Bukhari – Fathul Baari 11/113", "Sahih Muslim 4/2083", "Hisnul Muslim"]
  },
  {
    id: 19, catId: "sleep", type: "dua", order: 19,
    title: { en: "Waking Dua 2 – Health and return of the soul", fr: "Invocation au Réveil 2 – Santé et retour de l'âme", de: "Dua beim Aufwachen 2 – Gesundheit und Rückkehr der Seele" },     instruction: { en: "Recite upon waking up.", fr: "Réciter au réveil.", de: "Beim Aufwachen sprechen." },     arabic: "اَلْحَمْدُ لِلَّهِ الَّذِيْ عَافَانِيْ فِيْ جَسَدِيْ، وَرَدَّ عَلَيَّ رُوْحِيْ، وَأَذِنَ لِيْ بِذِكْرِهِ",     transliteration: "Alhamdulillaahil-ladzii 'aafaanii fii jasadii, wa rodda 'alayya ruuhii, wa adzina lii bidzikrih.",     translation: { en: "All praise is due to Allah, Who granted me health in my body, returned my soul to me, and permitted me to remember Him.", fr: "Toute louange appartient à Allah, Qui m'a accordé la santé dans mon corps, m'a rendu mon âme et m'a permis de L'invoquer.", de: "Alles Lob gebührt Allah, Der meinen Körper gesund erhalten hat, mir meine Seele zurückgegeben hat und mir erlaubt hat, Ihn zu erwähnen." },     benefit: { en: "Three great gratitudes: health of body, return of soul, and permission to make dhikr.", fr: "Trois grandes gratitudes : santé du corps, retour de l'âme, et permission de faire le dhikr.", de: "Drei große Dankbarkeiten: Gesundheit des Körpers, Rückkehr der Seele und die Erlaubnis, Dhikr zu machen." },
    source: ["At-Tirmidzi 5/473", "Shahih At-Tirmidzi 3/144", "Hisnul Muslim"]
  },
  {
    id: 20, catId: "sleep", type: "surah", order: 20,
    title: { en: "Waking Dua 3 – Surah Ali Imran 190–200", fr: "Invocation au Réveil 3 – Sourate Ali Imran 190–200", de: "Dua beim Aufwachen 3 – Sure Ali Imran 190–200" },
    instruction: { en: "The Prophet ﷺ used to recite these verses upon waking at night and reflect on creation.", fr: "Le Prophète ﷺ récitait ces versets en se réveillant la nuit et réfléchissait à la création.", de: "Der Prophet ﷺ pflegte beim Aufwachen in der Nacht diese Verse zu rezitieren und über die Schöpfung nachzudenken." },
    surahs: [
      { name: { en: "Surah Ali Imran – Verses 190–200", fr: "Sourate Ali Imran – Versets 190–200", de: "Sure Ali Imran – Verse 190–200" }, ref: "3:190–200", arabic: "إِنَّ فِى خَلْقِ السَّمَاوَ‌اتِ وَالْأَرْضِ وَاخْتِلَافِ الَّيْلِ وَالنَّهَارِ لَءَايَاتٍ لِّأُولِى الْأَلْبَابِ ﴿١٩٠﴾ الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَى جُنُوبِهِمْ", note: { en: "Verses 190–200 shown (opening)", fr: "Versets 190–200 (ouverture)", de: "Verse 190–200 (Anfang)" } }
    ],
    benefits: { en: ["These verses contain deep reflection on creation – the foundation of Iman.", "Verses 192–194 contain powerful duas: protection from fire, forgiveness, dying with the righteous."], fr: ["Ces versets contiennent une profonde réflexion sur la création – le fondement de l'Iman.", "Les versets 192–194 contiennent des invocations puissantes : protection contre le feu, pardon, mort parmi les vertueux."], de: ["Diese Verse enthalten tiefe Reflexion über die Schöpfung – die Grundlage des Iman.", "Verse 192–194 enthalten kraftvolle Duas: Schutz vor dem Feuer, Vergebung, Versterben mit den Rechtschaffenen."] },     source: ["Sahih Bukhari – Fathul Bari 8/237", "Sahih Muslim 1/530", "Hisnul Muslim"]   },   {     id: 21, catId: "sleep", type: "dua", order: 21,     title: { en: "Dua when waking up in the middle of the night", fr: "Invocation en cas de réveil nocturne", de: "Dua beim nächtlichen Erwachen" },     instruction: { en: "When waking at night: recite this dhikr, then say 'Allahummaghfir li'. Optionally perform wudu and pray.", fr: "En cas de réveil nocturne : réciter ce dhikr, puis dire 'Allahummaghfir li'. Faire les ablutions et prier si désiré.", de: "Wenn man nachts aufwacht: diesen Dhikr sprechen, dann 'Allahummaghfir li' sagen. Wer möchte, macht Wudu und betet." },     arabic: "لاَ إِلَـٰهَ إِلاَّ اللَّهُ، وَحْدَهُ لاَ شَرِيْكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ، اَلْحَمْدُ لِلَّهِ، وَسُبْحَانَ اللَّهِ، وَلاَ إِلَـٰهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ",     transliteration: "Laa ilaaha illallaah, wahdahu laa syariika lah, lahul mulku wa lahul hamdu, wa huwa 'alaa kulli syai-in qodiir, alhamdulillaah, wa subhaanallaah, wa laa ilaaha illallaah, wallaahu akbar, wa laa haula wa laa quwwata illaa billaah.",
    arabic_extra: "اَللَّهُمَّ اغْفِرْ لِي",
    transliteration_extra: "Allaahummaghfir lii.",
    translation: { en: "There is no god but Allah, the One, without partner. To Him belongs the dominion and all praise. He is capable of all things. All praise is due to Allah. Glory be to Allah. There is no god but Allah. Allah is the Greatest. There is no power except through Allah.  Then: O Allah, forgive me.", fr: "Il n'y a pas de dieu sauf Allah, l'Unique, sans associé. À Lui appartient le royaume et toute louange. Il est capable de toute chose. Toute louange appartient à Allah. Gloire à Allah. Il n'y a pas de dieu sauf Allah. Allah est le Plus Grand. Il n'y a pas de puissance sauf par Allah.  Puis : Ô Allah, pardonne-moi.", de: "Es gibt keinen Gott außer Allah, dem Einen, ohne Teilhaber. Ihm gehört das Königreich und Ihm gebührt alles Lob. Er ist über alles mächtig. Alles Lob gebührt Allah. Gepriesen sei Allah. Es gibt keinen Gott außer Allah. Allah ist der Größte. Es gibt keine Kraft außer durch Allah.  Dann: O Allah, vergib mir." },
    promise: { en: "The Prophet ﷺ promised: Whoever says this and prays will have their prayer accepted. Whoever makes dua will be answered.", fr: "Le Prophète ﷺ a promis : Celui qui dit cela et prie, sa prière sera acceptée. Celui qui invoque sera exaucé.", de: "Der Prophet ﷺ versprach: Wer dies spricht und dann betet, wird sein Gebet angenommen. Wer danach eine Dua spricht, wird erhört." },
    scholars: {
      en: [
        { name: "Ibn Baththal رحمه الله", text: "Whoever this hadith reaches, it is befitting to act upon it sincerely for Allah." },
        { name: "Ibn Hajar رحمه الله", text: "This act is only possible for one accustomed to much dhikr – so that dhikr becomes his habit in sleep and waking. Allah honors such a person by accepting his dua and prayer." },
        { name: "An-Nawawi رحمه الله", text: "Whoever wakes at night and wishes to sleep again is recommended to remember Allah until he falls asleep." }
      ],
      fr: [
        { name: "Ibn Baththal رحمه الله", text: "Quiconque reçoit ce hadith, il lui convient de le pratiquer sincèrement pour Allah." },
        { name: "Ibn Hajar رحمه الله", text: "Cet acte n'est possible que pour celui habitué à beaucoup de dhikr. Allah honore une telle personne en acceptant son dua et sa prière." },         { name: "An-Nawawi رحمه الله", text: "Celui qui se réveille la nuit et souhaite se rendormir est recommandé d'invoquer Allah jusqu'à ce qu'il s'endorme." }       ],       de: [         { name: "Ibn Baththal رحمه الله", text: "Wem dieser Hadith bekannt ist, dem ziemt es sich, ihn aufrichtig für Allah zu praktizieren." },         { name: "Ibn Hajar رحمه الله", text: "Diese Handlung gelingt nur demjenigen, der gewohnt ist, viel Dhikr zu sprechen. Allah ehrt einen solchen Menschen, indem Er sein Dua und Gebet annimmt." },         { name: "An-Nawawi رحمه الله", text: "Wer nachts aufwacht und wieder schlafen möchte, dem wird empfohlen, Allah zu erwähnen bis er einschläft." }       ]     },     source: ["Sahih Bukhari 1103", "Abu Dawud 5060", "At-Tirmidzi 3414", "Ibnu Majah 3878"]   },

  // ── CATEGORY: WUDU ──   
  { id:60, catId:"wudu", type:"dua", order:1, title:{en:"Before Wudu",fr:"Avant les ablutions",de:"Vor dem Wudu"}, arabic:"بِسْمِ اللَّهِ", transliteration:"Bismillaah.",
    translation:{en:"In the name of Allah.",fr:"Au nom d'Allah.",de:"Im Namen Allahs."}, benefit:{en:"The Prophet ﷺ said: There is no wudu for the one who does not mention Allah's name.",fr:"Le Prophète ﷺ a dit : Il n'y a pas d'ablution pour celui qui ne mentionne pas le nom d'Allah.",de:"Der Prophet ﷺ sagte: Es gibt kein Wudu für denjenigen, der Allahs Namen nicht erwähnt."}, source:["Abu Dawud","At-Tirmidhi","Ibn Majah"] },

  { id:61, catId:"wudu", type:"dua", order:2, title:{en:"After Wudu (1)",fr:"Après les ablutions (1)",de:"Nach dem Wudu (1)"}, arabic:"أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ", transliteration:"Ashhadu an laa ilaaha illallaah wahdahu laa syariika lah, wa ashhadu anna Muhammadan 'abduhu wa rasuuluh.",
    translation:{en:"I bear witness that there is no god but Allah alone, without partner, and I bear witness that Muhammad is His servant and messenger.",fr:"J'atteste qu'il n'y a pas de divinité digne d'adoration sauf Allah, seul sans associé, et j'atteste que Muhammad est Son serviteur et messager.",de:"Ich bezeuge, dass es keinen Gott außer Allah gibt, allein ohne Partner, und ich bezeuge, dass Muhammad Sein Diener und Gesandter ist."}, benefit:{en:"Whoever says this after wudu, the eight gates of Paradise will be opened for him.",fr:"Celui qui dit cela après les ablutions, les huit portes du Paradis lui seront ouvertes.",de:"Wer dies nach dem Wudu sagt, für den werden die acht Tore des Paradieses geöffnet."}, source:["Sahih Muslim"] },

  { id:62, catId:"wudu", type:"dua", order:3, title:{en:"After Wudu (2) – Complete Version",fr:"Après les ablutions (2) – Version complète",de:"Nach dem Wudu (2) – Vollständige Version"}, arabic:"أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، اَللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ", transliteration:"Ashhadu an laa ilaaha illallaah wahdahu laa syariika lah, wa ashhadu anna Muhammadan 'abduhu wa rasuuluh. Allaahummaj'alnii minat-tawwaabiina waj'alnii minal mutatahhiriin.",
    translation:{en:"I bear witness that there is no god but Allah alone, without partner, and that Muhammad is His servant and messenger. O Allah, make me among those who repent and make me among those who purify themselves.",fr:"J'atteste qu'il n'y a pas de divinité sauf Allah seul, sans associé, et que Muhammad est Son serviteur et messager. Ô Allah, fais de moi parmi ceux qui se repentent et parmi ceux qui se purifient.",de:"Ich bezeuge, dass es keinen Gott außer Allah gibt und dass Muhammad Sein Diener und Gesandter ist. O Allah, mache mich zu denen, die Reue zeigen, und zu denen, die sich reinigen."}, source:["At-Tirmidhi"] },

  { id:63, catId:"wudu", type:"dua", order:4, title:{en:"After Wudu (3) – Subhaanaka Allahumma",fr:"Après les ablutions (3) – Subhaanaka Allahumma",de:"Nach dem Wudu (3) – Subhaanaka Allahumma"}, arabic:"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ", transliteration:"Subhaanakallahumma wa bihamdik, ashhadu an laa ilaaha illaa anta, astaghfiruka wa atuubu ilaik.",
    translation:{en:"Glory be to You, O Allah, and with Your praise. I bear witness that there is no god but You. I seek Your forgiveness and turn to You in repentance.",fr:"Gloire à Toi, ô Allah, et par Ta louange. J'atteste qu'il n'y a pas de divinité sauf Toi. Je Te demande pardon et me repens à Toi.",de:"Gepriesen seist Du, o Allah, und Dir sei Lob. Ich bezeuge, dass es keinen Gott außer Dir gibt. Ich bitte Dich um Vergebung und wende mich Dir reumütig zu."}, source:["An-Nasai","Authenticated"] },

  // ── CATEGORY: CLOTHING ── 
  { id:64, catId:"clothing", type:"dua", order:1, title:{en:"When Putting on Clothes",fr:"En mettant des vêtements",de:"Beim Anziehen von Kleidung"}, arabic:"الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ", transliteration:"Alhamdu lillaahil ladzii kasaanii haadzaa wa razaqaniihi min ghairi haulin minni wa laa quwwah.",
    translation:{en:"All praise is for Allah who clothed me with this and provided it without any power or strength from me.",fr:"Louange à Allah qui m'a vêtu de ceci et me l'a accordé sans force ni puissance de ma part.",de:"Alles Lob gebührt Allah, der mich damit bekleidet hat und es mir gegeben hat ohne eigene Kraft oder Macht."}, benefit:{en:"Whoever says this when putting on clothes will be forgiven his past and future sins.",fr:"Celui qui dit cela en mettant ses vêtements sera pardonné pour ses péchés passés et futurs.",de:"Wer dies beim Anziehen sagt, dem werden seine vergangenen und zukünftigen Sünden vergeben."}, source:["Abu Dawud","At-Tirmidhi","Hasan"] },

  { id:65, catId:"clothing", type:"dua", order:2, title:{en:"When Putting on New Clothes",fr:"En mettant de nouveaux vêtements",de:"Beim Anziehen neuer Kleidung"}, arabic:"اَللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ مِنْ خَيْرِهِ وَخَيْرِ مَا صُنِعَ لَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ", transliteration:"Allaahumma lakal hamdu anta kasawtaniihi, as'aluka min khayrihi wa khayri maa suni'a lah, wa a'uudzu bika min syarrihi wa syarri maa suni'a lah.",
    translation:{en:"O Allah, for You is all praise. You have clothed me with it. I ask You for its good and the good of what it was made for, and I seek refuge in You from its evil and the evil of what it was made for.",fr:"Ô Allah, à Toi toute louange. Tu m'as vêtu de cela. Je Te demande son bien et le bien de ce pour quoi il a été fait, et je cherche refuge en Toi contre son mal.",de:"O Allah, Dir gebührt alles Lob. Du hast mich damit bekleidet. Ich bitte Dich um sein Gutes und das Gute wofür es gemacht wurde, und suche Zuflucht bei Dir vor seinem Bösen."}, source:["Abu Dawud","At-Tirmidhi"] },

  { id:66, catId:"clothing", type:"dua", order:3, title:{en:"Dua for Someone Wearing New Clothes (1)",fr:"Invocation pour quelqu'un portant de nouveaux vêtements (1)",de:"Dua für jemanden der neue Kleidung trägt (1)"}, arabic:"تُبْلِي وَيُخْلِفُ اللَّهُ", transliteration:"Tubli wa yukhlifullaah.",
    translation:{en:"May you wear it out and may Allah replace it.",fr:"Puisses-tu l'user et qu'Allah te le remplace.",de:"Mögest du es abnutzen und möge Allah es ersetzen."}, source:["Abu Dawud","Hasan"] },

  { id:67, catId:"clothing", type:"dua", order:4, title:{en:"Dua for Someone Wearing New Clothes (2)",fr:"Invocation pour quelqu'un portant de nouveaux vêtements (2)",de:"Dua für jemanden der neue Kleidung trägt (2)"}, arabic:"البَسْ جَدِيدًا، وَعِشْ حَمِيدًا، وَمُتْ شَهِيدًا", transliteration:"Ilbas jadiidan, wa 'ish hamiidan, wa mut shahiidaa.",
    translation:{en:"Wear new, live praised, and die as a martyr.",fr:"Porte du neuf, vis loué et meurs en martyr.",de:"Trage Neues, lebe lobenswert und stirb als Märtyrer."}, source:["Ibn Majah","Authenticated"] },

  { id:68, catId:"clothing", type:"dua", order:5, title:{en:"When Removing Clothes",fr:"En retirant ses vêtements",de:"Beim Ausziehen von Kleidung"}, arabic:"بِسْمِ اللَّهِ", transliteration:"Bismillaah.",
    translation:{en:"In the name of Allah.",fr:"Au nom d'Allah.",de:"Im Namen Allahs."}, benefit:{en:"Saying Bismillah when undressing is a screen between humans and jinn.",fr:"Dire Bismillah en se déshabillant est un écran entre les humains et les djinns.",de:"Bismillah beim Ausziehen zu sagen bildet einen Schutzschirm zwischen Menschen und Dschinn."}, source:["At-Tirmidhi","Ibn Majah"] },

  // ── CATEGORY: MOSQUE ──
  
  { id:69, catId:"mosque", type:"dua", order:1, title:{en:"Going to the Mosque (1)",fr:"Aller à la mosquée (1)",de:"Zur Moschee gehen (1)"}, arabic:"اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا وَفِي لِسَانِي نُورًا، وَاجْعَلْ فِي سَمْعِي نُورًا وَفِي بَصَرِي نُورًا، وَاجْعَلْ مِنْ خَلْفِي نُورًا وَمِنْ أَمَامِي نُورًا، وَاجْعَلْ مِنْ فَوْقِي نُورًا وَمِنْ تَحْتِي نُورًا، اللَّهُمَّ أَعْطِنِي نُورًا", transliteration:"Allaahumma aj'al fii qalbii nuuran wa fii lisaanii nuuran, waj'al fii sam'ii nuuran wa fii basarii nuuran, waj'al min khalfii nuuran wa min amamii nuuran, waj'al min fawqii nuuran wa min tahtii nuuran, Allaahumma a'tinii nuuraa.",
    translation:{en:"O Allah, place light in my heart, light on my tongue, light in my hearing, light in my sight, light behind me, light in front of me, light above me and light below me. O Allah, grant me light.",fr:"Ô Allah, mets une lumière dans mon cœur, sur ma langue, dans mon ouïe, dans ma vue, derrière moi, devant moi, au-dessus et en dessous de moi. Ô Allah, accorde-moi la lumière.",de:"O Allah, setze Licht in mein Herz, Licht auf meine Zunge, Licht in mein Gehör, Licht in mein Sehen, Licht hinter mir, Licht vor mir, Licht über mir und Licht unter mir. O Allah, gib mir Licht."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:70, catId:"mosque", type:"dua", order:2, title:{en:"Going to the Mosque (2) – Short",fr:"Aller à la mosquée (2) – Court",de:"Zur Moschee gehen (2) – Kurz"}, arabic:"اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُورًا وَفِي لِسَانِي نُورًا", transliteration:"Allaahumma aj'al fii qalbii nuuran wa fii lisaanii nuuran.",
    translation:{en:"O Allah, place light in my heart and light on my tongue.",fr:"Ô Allah, mets une lumière dans mon cœur et sur ma langue.",de:"O Allah, setze Licht in mein Herz und Licht auf meine Zunge."}, source:["Sahih Muslim"] },

  { id:71, catId:"mosque", type:"dua", order:3, title:{en:"Entering the Mosque (1)",fr:"Entrer dans la mosquée (1)",de:"Die Moschee betreten (1)"}, arabic:"اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", transliteration:"Allaahummaftah lii abwaaba rahmatik.",
    translation:{en:"O Allah, open for me the doors of Your mercy.",fr:"Ô Allah, ouvre-moi les portes de Ta miséricorde.",de:"O Allah, öffne mir die Tore Deiner Barmherzigkeit."}, instruction:{en:"Enter with the right foot.",fr:"Entrer du pied droit.",de:"Mit dem rechten Fuß eintreten."}, source:["Sahih Muslim"] },

  { id:72, catId:"mosque", type:"dua", order:4, title:{en:"Entering the Mosque (2)",fr:"Entrer dans la mosquée (2)",de:"Die Moschee betreten (2)"}, arabic:"أَعُوذُ بِاللَّهِ الْعَظِيمِ وَبِوَجْهِهِ الْكَرِيمِ وَسُلْطَانِهِ الْقَدِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ", transliteration:"A'uudzu billaahil 'azhiim, wa biwajhihil kariim, wa sulthaanihil qadiim, minash-shaythaanir-rajiim.",
    translation:{en:"I seek refuge in Allah the Mighty, and in His noble countenance, and His eternal authority, from Satan the accursed.",fr:"Je cherche refuge auprès d'Allah le Tout-Puissant, et de Son noble visage, et de Son autorité éternelle, contre Satan le maudit.",de:"Ich suche Zuflucht bei Allah dem Mächtigen, und bei Seinem edlen Antlitz, und Seiner ewigen Autorität, vor dem verfluchten Satan."}, benefit:{en:"Whoever says this, Satan says: 'He is protected from me for the rest of the day.'",fr:"Celui qui dit cela, Satan dit : 'Il est protégé de moi pour le reste de la journée.'",de:"Wer dies sagt, sagt der Satan: 'Er ist für den Rest des Tages vor mir geschützt.'"}, source:["Abu Dawud","Authenticated"] },

  { id:73, catId:"mosque", type:"dua", order:5, title:{en:"Entering the Mosque (3) – Salawat",fr:"Entrer dans la mosquée (3) – Salawat",de:"Die Moschee betreten (3) – Salawat"}, arabic:"بِسْمِ اللَّهِ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ", transliteration:"Bismillaah was-salaamu 'alaa Rasuulillaah.",
    translation:{en:"In the name of Allah and peace be upon the Messenger of Allah.",fr:"Au nom d'Allah et que la paix soit sur le Messager d'Allah.",de:"Im Namen Allahs und Friede sei auf dem Gesandten Allahs."}, source:["Ibn Majah","Authenticated"] },

  { id:74, catId:"mosque", type:"dua", order:6, title:{en:"Entering the Mosque (4) – Brief",fr:"Entrer dans la mosquée (4) – Bref",de:"Die Moschee betreten (4) – Kurz"}, arabic:"رَبِّ اغْفِرْ لِي ذُنُوبِي وَافْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", transliteration:"Rabbighfir lii dzunuubii waftah lii abwaaba rahmatik.",
    translation:{en:"My Lord, forgive me my sins and open for me the doors of Your mercy.",fr:"Mon Seigneur, pardonne-moi mes péchés et ouvre-moi les portes de Ta miséricorde.",de:"Mein Herr, vergib mir meine Sünden und öffne mir die Tore Deiner Barmherzigkeit."}, source:["Ibn Majah","At-Tirmidhi"] },

  { id:75, catId:"mosque", type:"dua", order:7, title:{en:"Leaving the Mosque",fr:"Quitter la mosquée",de:"Die Moschee verlassen"}, arabic:"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", transliteration:"Allaahumma inni as'aluka min fadhlik.",
    translation:{en:"O Allah, I ask You for Your bounty.",fr:"Ô Allah, je Te demande de Ta grâce.",de:"O Allah, ich bitte Dich um Deine Gunst."}, instruction:{en:"Exit with the left foot.",fr:"Sortir du pied gauche.",de:"Mit dem linken Fuß heraustreten."}, source:["Sahih Muslim"] },

  // ── CATEGORY: ADHAN ──
  
  { id:76, catId:"adhan", type:"info", order:1, title:{en:"Responding to the Adhan",fr:"Répondre à l'Adhan",de:"Dem Adhan antworten"}, content:{en:"When hearing the Adhan, repeat what the Mu'adhdhin says after each phrase – except for 'Hayya 'alas-Salah' and 'Hayya 'alal-Falah', to which you respond: 'Laa hawla wa laa quwwata illaa billaah' (There is no power and no strength except with Allah).",fr:"En entendant l'Adhan, répétez ce que dit le muezzin après chaque phrase – sauf pour 'Hayya 'alas-Salah' et 'Hayya 'alal-Falah', auxquels vous répondez : 'Laa hawla wa laa quwwata illaa billaah'.",de:"Beim Hören des Adhan wiederhole nach jeder Phrase, was der Muezzin sagt – außer bei 'Hayya 'alas-Salah' und 'Hayya 'alal-Falah', worauf du antwortest: 'Laa hawla wa laa quwwata illaa billaah'."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:77, catId:"adhan", type:"dua", order:2, title:{en:"After Adhan – Shahada (Version 1)",fr:"Après l'Adhan – Shahada (Version 1)",de:"Nach dem Adhan – Schahada (Version 1)"}, arabic:"أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، رَضِيتُ بِاللَّهِ رَبًّا وَبِمُحَمَّدٍ رَسُولًا وَبِالإِسْلَامِ دِينًا", transliteration:"Ashhadu an laa ilaaha illallaah wahdahu laa syariika lahu wa anna Muhammadan 'abduhu wa rasuuluh, radhiitu billaahi rabban wa bi-Muhammadin rasuulan wa bil-islaami diinaa.",
    translation:{en:"I bear witness that there is no god but Allah alone without partner, and that Muhammad is His servant and messenger. I am pleased with Allah as Lord, Muhammad as Messenger, and Islam as religion.",fr:"J'atteste qu'il n'y a pas de divinité sauf Allah seul sans associé, et que Muhammad est Son serviteur et messager. Je suis satisfait d'Allah comme Seigneur, de Muhammad comme messager et de l'Islam comme religion.",de:"Ich bezeuge, dass es keinen Gott außer Allah gibt ohne Partner, und dass Muhammad Sein Diener und Gesandter ist. Ich bin zufrieden mit Allah als Herrn, Muhammad als Gesandten und dem Islam als Religion."}, benefit:{en:"Whoever says this after the Adhan will be forgiven his sins.",fr:"Celui qui dit cela après l'Adhan sera pardonné pour ses péchés.",de:"Wer dies nach dem Adhan sagt, dem werden seine Sünden vergeben."}, source:["Sahih Muslim"] },

  { id:78, catId:"adhan", type:"dua", order:3, title:{en:"After Adhan – Shahada (Version 2)",fr:"Après l'Adhan – Shahada (Version 2)",de:"Nach dem Adhan – Schahada (Version 2)"}, arabic:"وَأَنَا أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ", transliteration:"Wa ana ashhadu an laa ilaaha illallaah wahdahu laa syariika lahu wa anna Muhammadan 'abduhu wa rasuuluh.",
    translation:{en:"And I bear witness that there is no god but Allah alone without partner, and that Muhammad is His servant and messenger.",fr:"Et j'atteste qu'il n'y a pas de divinité sauf Allah seul sans associé, et que Muhammad est Son serviteur et messager.",de:"Und ich bezeuge, dass es keinen Gott außer Allah gibt ohne Partner, und dass Muhammad Sein Diener und Gesandter ist."}, source:["Sahih Muslim"] },

  { id:79, catId:"adhan", type:"dua", order:4, title:{en:"After Adhan – Shahada (Version 3)",fr:"Après l'Adhan – Shahada (Version 3)",de:"Nach dem Adhan – Schahada (Version 3)"}, arabic:"وَأَنَا أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، إِلَهًا وَاحِدًا أَحَدًا صَمَدًا لَمْ يَتَّخِذْ صَاحِبَةً وَلَا وَلَدًا", transliteration:"Wa ana ashhadu an laa ilaaha illallaah wahdahu laa syariika lahu, ilaahan waahidan ahadan shamadan lam yattakhidz shaahiibatan wa laa waladaa.",
    translation:{en:"And I bear witness that there is no god but Allah alone without partner – One God, Unique, Eternal, Who took no wife and no son.",fr:"Et j'atteste qu'il n'y a pas de divinité sauf Allah seul sans associé – Un Dieu unique, Éternel, qui n'a pris ni épouse ni enfant.",de:"Und ich bezeuge, dass es keinen Gott außer Allah gibt ohne Partner – Ein Gott, Einzig, Ewig, Der keine Gattin und kein Kind genommen hat."}, source:["Abu Dawud","Authenticated"] },

  { id:80, catId:"adhan", type:"dua", order:5, title:{en:"After Adhan – Salawat",fr:"Après l'Adhan – Salawat",de:"Nach dem Adhan – Salawat"}, arabic:"اَللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ", transliteration:"Allaahumma shalli 'alaa Muhammad.",
    translation:{en:"O Allah, send prayers upon Muhammad.",fr:"Ô Allah, envoie Ta prière sur Muhammad.",de:"O Allah, sende Gebete auf Muhammad."}, benefit:{en:"Whoever sends salawat on the Prophet ﷺ once, Allah sends ten blessings upon him.",fr:"Celui qui envoie une fois la salawat sur le Prophète ﷺ, Allah lui envoie dix bénédictions.",de:"Wer einmal Salawat auf den Propheten ﷺ sendet, sendet Allah zehnmal Segnungen auf ihn."}, source:["Sahih Muslim"] },

  { id:81, catId:"adhan", type:"dua", order:6, title:{en:"After Adhan – Wasilah Dua",fr:"Après l'Adhan – Invocation de la Wasilah",de:"Nach dem Adhan – Wasilah Dua"}, arabic:"اَللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ", transliteration:"Allaahumma rabba haadzihid-da'watit-taammah wash-shalaatil qaa'imah, aati Muhammadanil wasiilata wal fadhiilah, wab'ath-hu maqaaman mahmuudanil ladzii wa'adtah.",
    translation:{en:"O Allah, Lord of this perfect call and established prayer, grant Muhammad the highest rank and honor, and raise him to the praised station which You have promised him.",fr:"Ô Allah, Seigneur de cet appel parfait et de la prière établie, accorde à Muhammad le rang élevé et l'honneur, et élève-le au rang loué que Tu lui as promis.",de:"O Allah, Herr dieses vollkommenen Rufes und des Gebets, gewähre Muhammad die höchste Stellung und Ehre, und erhebe ihn zur gelobten Station, die Du ihm versprochen hast."}, benefit:{en:"Whoever says this after the Adhan, my intercession will be guaranteed for him on the Day of Resurrection. (Prophet ﷺ)",fr:"Celui qui dit cela après l'Adhan, mon intercession lui est garantie le Jour de la Résurrection. (Prophète ﷺ)",de:"Wer dies nach dem Adhan sagt, dem ist meine Fürsprache am Tag der Auferstehung garantiert. (Prophet ﷺ)"}, source:["Sahih Bukhari"] },

  { id:82, catId:"adhan", type:"info", order:7, title:{en:"Dua after Adhan – Personal Supplication",fr:"Invocation après l'Adhan – Supplication personnelle",de:"Dua nach dem Adhan – Persönliches Bittgebet"}, content:{en:"After saying the dua for the Wasilah, one may make any personal dua. The time between the Adhan and the Iqamah is a time when supplications are not rejected. One may ask Allah for anything they need.",fr:"Après avoir dit la dua de la Wasilah, on peut faire n'importe quelle dua personnelle. Le moment entre l'Adhan et l'Iqama est un moment où les supplications ne sont pas rejetées.",de:"Nach dem Wasilah-Dua kann man jedes persönliche Dua sprechen. Die Zeit zwischen Adhan und Iqama ist eine Zeit, in der Bittgebete nicht abgelehnt werden."}, source:["Abu Dawud","At-Tirmidhi"] },

  { id:83, catId:"adhan", type:"info", order:8, title:{en:"Virtue of Responding to the Adhan",fr:"Vertu de répondre à l'Adhan",de:"Tugend des Antwortens auf den Adhan"}, content:{en:"The Prophet ﷺ said: 'Whoever says after hearing the Adhan: 'I am pleased with Allah as Lord, with Muhammad as Messenger, and with Islam as religion' – his sins will be forgiven.' This shows the great reward for engaging with the Adhan attentively.",fr:"Le Prophète ﷺ a dit : 'Celui qui dit après avoir entendu l'Adhan : 'Je suis satisfait d'Allah comme Seigneur, de Muhammad comme messager et de l'Islam comme religion' – ses péchés lui seront pardonnés.'",de:"Der Prophet ﷺ sagte: 'Wer nach dem Hören des Adhan sagt: 'Ich bin zufrieden mit Allah als Herrn, Muhammad als Gesandten und dem Islam als Religion' – dem werden seine Sünden vergeben.'"}, source:["Sahih Muslim"] },

  // ── CATEGORY: WEATHER ──
  
  { id:84, catId:"weather", type:"dua", order:1, title:{en:"Dua when strong wind blows",fr:"Invocation lors d'un vent fort",de:"Dua bei starkem Wind"}, arabic:"اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ خَيْرَهَا وَأَعُوْذُ بِكَ مِنْ شَرِّهَا", transliteration:"Allaahumma innii as-aluka khayrahaa wa a'uudhu bika min sharrihaa.",
    translation:{en:"O Allah, I ask You for the good of this wind and I seek refuge in You from its evil.",fr:"Ô Allah, je Te demande le bien de ce vent et je cherche refuge auprès de Toi contre son mal.",de:"O Allah, ich bitte Dich um das Gute dieses Windes und ich suche Zuflucht bei Dir vor seinem Übel."}, source:["Sahih Muslim"] },

  { id:85, catId:"weather", type:"dua", order:2, title:{en:"Dua when wind blows (long version)",fr:"Invocation lors du vent (version longue)",de:"Dua bei Wind (lange Version)"}, arabic:"اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا فِيْهَا وَخَيْرَ مَا أُرْسِلَتْ بِهِ، وَأَعُوْذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا فِيْهَا وَشَرِّ مَا أُرْسِلَتْ بِهِ", transliteration:"Allaahumma innii as-aluka khayrahaa wa khayra maa fiihaa wa khayra maa ursilat bihi, wa a'uudhu bika min sharrihaa wa sharri maa fiihaa wa sharri maa ursilat bihi.",
    translation:{en:"O Allah, I ask You for the good of this wind, the good within it, and the good it was sent with. I seek refuge in You from its evil, the evil within it, and the evil it was sent with.",fr:"Ô Allah, je Te demande le bien de ce vent, le bien qu'il contient et le bien avec lequel il a été envoyé. Et je cherche refuge auprès de Toi contre son mal, le mal qu'il contient et le mal avec lequel il a été envoyé.",de:"O Allah, ich bitte Dich um das Gute dieses Windes, das Gute das in ihm ist und das Gute womit er gesandt wurde. Und ich suche Zuflucht bei Dir vor seinem Übel, dem Übel in ihm und dem Übel womit er gesandt wurde."}, source:["Sahih Muslim"] },

  { id:86, catId:"weather", type:"dua", order:3, title:{en:"Dua when hearing thunder",fr:"Invocation en entendant le tonnerre",de:"Dua beim Hören von Donner"}, arabic:"سُبْحَانَ الَّذِيْ يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ، وَالْمَلَائِكَةُ مِنْ خِيفَتِهِ", transliteration:"Subhaanalladzii yusabbihur-ra'du bihamdihi wal malaaikatu min khiifatihi.",
    translation:{en:"Glory be to the One whom the thunder glorifies with His praise, and so do the angels out of fear of Him.",fr:"Gloire à Celui que le tonnerre glorifie par Sa louange, ainsi que les anges par crainte de Lui.",de:"Gepriesen sei Derjenige, den der Donner mit Seinem Lob preist, ebenso die Engel aus Furcht vor Ihm."}, source:["Al-Muwatta","Authenticated"] },

  { id:87, catId:"weather", type:"dua", order:4, title:{en:"Short thunder remembrance",fr:"Dhikr court lors du tonnerre",de:"Kurzer Dhikr beim Donner"}, arabic:"سُبْحَانَ الَّذِي سَبَّحَتْ لَهُ", transliteration:"Subhaanalladzii sabbahat lahu.",
    translation:{en:"Glory be to Allah, to Whom everything gives praise.",fr:"Gloire à Allah, à qui toute chose rend louange.",de:"Gepriesen sei Allah, dem alles Lobpreisung darbringt."}, source:["Hasan"] },

  { id:89, catId:"weather", type:"dua", order:5, title:{en:"Dua for rain (full)",fr:"Invocation pour la pluie (complète)",de:"Dua für Regen (vollständig)"}, arabic:"اَللَّهُمَّ اسْقِنَا غَيْثًا مُغِيْثًا، مَرِيْئًا، مَرِيْعًا، نَافِعًا غَيْرَ ضَارٍّ", transliteration:"Allaahummas-qinaa ghaythan mughiithan marii'an marii'an naafi'an ghayra daarr.",
    translation:{en:"O Allah, send us beneficial, nourishing, and abundant rain that brings no harm.",fr:"Ô Allah, accorde-nous une pluie bénéfique, abondante et nourrissante sans nuisance.",de:"O Allah, schenke uns nützlichen, reichlichen und wohltuenden Regen ohne Schaden."}, source:["Abu Dawud","Authenticated"] },

  { id:90, catId:"weather", type:"dua", order:6, title:{en:"Dua asking for rain",fr:"Invocation pour demander la pluie",de:"Dua um Regen zu erbitten"}, arabic:"اَللَّهُمَّ أَغِثْنَا", transliteration:"Allaahumma aghithnaa.",
    translation:{en:"O Allah, send us rain.",fr:"Ô Allah, accorde-nous la pluie.",de:"O Allah, schenke uns Regen."}, benefit:{en:"Repeated three times.",fr:"Répété trois fois.",de:"Dreimal wiederholt."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:91, catId:"weather", type:"dua", order:7, title:{en:"Short dua for rain",fr:"Courte invocation pour la pluie",de:"Kurzes Dua für Regen"}, arabic:"اَللَّهُمَّ اسْقِنَا", transliteration:"Allaahummas-qinaa.",
    translation:{en:"O Allah, give us rain.",fr:"Ô Allah, donne-nous la pluie.",de:"O Allah, gib uns Regen."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:92, catId:"weather", type:"dua", order:8, title:{en:"Dua for rain for all creation",fr:"Invocation pour la pluie pour toute la création",de:"Dua für Regen für alle Schöpfung"}, arabic:"اَللَّهُمَّ اسْقِ عِبَادَكَ وَبَهَائِمَكَ، وَانْشُرْ رَحْمَتَكَ، وَأَحْيِ بَلَدَكَ الْمَيِّتَ", transliteration:"Allaahummas-qi 'ibaadaka wa bahaa-imaka, wanshur rahmataka, wa ahyi baladakal mayyit.",
    translation:{en:"O Allah, give water to Your servants and Your animals, spread Your mercy, and revive Your dead land.",fr:"Ô Allah, abreuve Tes serviteurs et Tes bêtes, répands Ta miséricorde et fais revivre Ta terre morte.",de:"O Allah, gib Deinen Dienern und Deinen Tieren Wasser, verbreite Deine Barmherzigkeit und belebe Dein totes Land."}, source:["Abu Dawud","Hasan"] },

  { id:93, catId:"weather", type:"dua", order:9, title:{en:"Long dua for rain",fr:"Invocation longue pour la pluie",de:"Langes Dua für Regen"}, arabic:"اَلْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، الرَّحْمَنِ الرَّحِيمِ، مَالِكِ يَوْمِ الدِّينِ، لَا إِلَهَ إِلَّا اللَّهُ، يَفْعَلُ مَا يُرِيدُ، اَللَّهُمَّ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ، أَنْزِلْ عَلَيْنَا الْغَيْثَ", transliteration:"Alhamdulillaahi rabbil aalamiin, ar-rahmaanir-rahiim, maaliki yawmid-diin, laa ilaaha illallaah, yaf-alu maa yuriid. Allaahumma antal-laahu laa ilaaha illaa anta, anzil alaynal-ghayth.",
    translation:{en:"All praise is due to Allah, Lord of the worlds, the Most Merciful, the Most Compassionate, Master of the Day of Judgment. There is no deity except Allah, He does what He wills. O Allah, You are Allah, there is no deity except You – send down rain upon us.",fr:"Toute louange appartient à Allah, Seigneur des mondes, le Tout Miséricordieux, le Très Miséricordieux, Maître du Jour du Jugement. Il ny a de divinité quAllah, Il fait ce quIl veut. Ô Allah, Tu es Allah, il ny a de divinité que Toi – fais descendre la pluie sur nous.",de:"Alles Lob gebührt Allah, dem Herrn der Welten, dem Allerbarmer, dem Barmherzigen, dem Herrscher am Tag des Gerichts. Es gibt keinen Gott außer Allah, Er tut was Er will. O Allah, Du bist Allah, es gibt keinen Gott außer Dir – sende Regen auf uns herab."}, source:["Abu Dawud","Hasan"] },

  { id:94, catId:"weather", type:"dua", order:10, title:{en:"Dua when rain falls",fr:"Invocation quand il pleut",de:"Dua wenn es regnet"}, arabic:"اَللَّهُمَّ صَيِّبًا نَافِعًا", transliteration:"Allaahumma shoyyiban naafi'an.",
    translation:{en:"O Allah, make it beneficial rain.",fr:"Ô Allah, fais que cette pluie soit bénéfique.",de:"O Allah, mache diesen Regen nützlich."}, source:["Sahih Bukhari"] },

  { id:95, catId:"weather", type:"dua", order:11, title:{en:"Dua when rain falls (variant)",fr:"Invocation quand il pleut (variante)",de:"Dua wenn es regnet (Variante)"}, arabic:"اَللَّهُمَّ اجْعَلْهُ صَيِّبًا نَافِعًا", transliteration:"Allaahummaj'alhu shoyyiban naafi'an.",
    translation:{en:"O Allah, make this rain beneficial.",fr:"Ô Allah, fais que cette pluie soit bénéfique.",de:"O Allah, mache diesen Regen nützlich."}, source:["Sahih Bukhari"] },

  { id:96, catId:"weather", type:"dua", order:12, title:{en:"Pleasant rain dua",fr:"Invocation pour une pluie agréable",de:"Dua für angenehmen Regen"}, arabic:"اَللَّهُمَّ صَيِّبًا هَنِيئًا", transliteration:"Allaahumma shoyyiban hanii-an.",
    translation:{en:"O Allah, make it pleasant rain.",fr:"Ô Allah, fais que cette pluie soit agréable.",de:"O Allah, mache diesen Regen angenehm."}, source:["Authenticated"] },

  { id:97, catId:"weather", type:"dua", order:13, title:{en:"Pleasant rain dua (variant)",fr:"Invocation pour une pluie agréable (variante)",de:"Dua für angenehmen Regen (Variante)"}, arabic:"اَللَّهُمَّ اجْعَلْهُ صَيِّبًا هَنِيئًا", transliteration:"Allaahummaj'alhu shoyyiban hanii-an.",
    translation:{en:"O Allah, make this rain pleasant.",fr:"Ô Allah, fais que cette pluie soit agréable.",de:"O Allah, mache diesen Regen angenehm."}, source:["Authenticated"] },

  { id:98, catId:"weather", type:"dua", order:14, title:{en:"Short remembrance during rain",fr:"Court dhikr pendant la pluie",de:"Kurzer Dhikr während des Regens"}, arabic:"رَحْمَة", transliteration:"Rahmah.",
    translation:{en:"Mercy.",fr:"Miséricorde.",de:"Barmherzigkeit."}, benefit:{en:"Said during rain as a reminder that rain is a mercy from Allah.",fr:"Dit pendant la pluie pour rappeler que la pluie est une misericorde dAllah.",de:"Gesagt während des Regens als Erinnerung daran, dass Regen eine Barmherzigkeit Allahs ist."}, source:["Authenticated"] },

  { id:99, catId:"weather", type:"dua", order:15, title:{en:"After rain dua",fr:"Invocation après la pluie",de:"Dua nach dem Regen"}, arabic:"مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ", transliteration:"Mutirnaa bifadhlillaahi wa rahmatih.",
    translation:{en:"We have been given rain by the grace and mercy of Allah.",fr:"Nous avons reçu la pluie par la grâce et la misericorde dAllah.",de:"Wir haben Regen durch die Gnade und Barmherzigkeit Allahs erhalten."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:100, catId:"weather", type:"dua", order:16, title:{en:"After rain dua (variant)",fr:"Invocation après la pluie (variante)",de:"Dua nach dem Regen (Variante)"}, arabic:"مُطِرْنَا بِرَحْمَةِ اللَّهِ وَبِرِزْقِ اللَّهِ وَبِفَضْلِ اللَّهِ", transliteration:"Mutirnaa birahmatillaahi wa birizqillaahi wa bifadhlillaah.",
    translation:{en:"We have been given rain through Allah's mercy, provision, and grace.",fr:"Nous avons reçu la pluie par la misericorde, la subsistance et la grace dAllah.",de:"Wir haben Regen durch Allahs Barmherzigkeit, Versorgung und Gnade erhalten."}, source:["Authenticated"] },

  { id:101, catId:"weather", type:"dua", order:17, title:{en:"Dua to stop harmful rain",fr:"Invocation pour arrêter une pluie nuisible",de:"Dua um schädlichen Regen zu stoppen"}, arabic:"اَللَّهُمَّ حَوَالَيْنَا وَلَا عَلَيْنَا", transliteration:"Allaahumma hawaalainaa wa laa 'alainaa.",
    translation:{en:"O Allah, let the rain fall around us and not upon us.",fr:"Ô Allah, fais tomber la pluie autour de nous et non sur nous.",de:"O Allah, lasse den Regen um uns herum fallen und nicht auf uns."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:102, catId:"weather", type:"dua", order:18, title:{en:"Dua during heavy rain",fr:"Invocation lors de fortes pluies",de:"Dua bei starkem Regen"}, arabic:"اَللَّهُمَّ حَوَالَيْنَا وَلَا عَلَيْنَا، اَللَّهُمَّ عَلَى الْآكَامِ وَالظِّرَابِ وَبُطُونِ الْأَوْدِيَةِ وَمَنَابِتِ الشَّجَرِ", transliteration:"Allaahumma hawaalainaa wa laa 'alainaa, Allaahumma 'alal-aakaami wazh-zhiraabi wa buthuunil-awdiyati wa manaabitis-shajar.",
    translation:{en:"O Allah, let the rain fall around us and not upon us. O Allah, let it fall on hills, valleys and trees.",fr:"Ô Allah, fais tomber la pluie autour de nous et non sur nous. Ô Allah, fais-la tomber sur les collines, vallées et arbres.",de:"O Allah, lasse den Regen um uns herum fallen und nicht auf uns. O Allah, lasse ihn auf Hügel, Täler und Bäume fallen."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:103, catId:"weather", type:"dua", order:19, title:{en:"Heavy rain dua (extended)",fr:"Invocation pluie forte (version étendue)",de:"Starkregen Dua (erweiterte Version)"}, arabic:"اَللَّهُمَّ حَوَالَيْنَا وَلَا عَلَيْنَا، اَللَّهُمَّ عَلَى الْآكَامِ وَالْجِبَالِ وَالظِّرَابِ وَبُطُونِ الْأَوْدِيَةِ", transliteration:"Allaahumma hawaalainaa wa laa 'alainaa, Allaahumma 'alal-aakaami wal-jibaali wazh-zhiraabi wa buthuunil-awdiyah.",
    translation:{en:"O Allah, let the rain fall on mountains, hills and valleys, not on us.",fr:"Ô Allah, fais tomber la pluie sur les montagnes, collines et vallées, pas sur nous.",de:"O Allah, lasse den Regen auf Berge, Hügel und Täler fallen, nicht auf uns."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:104, catId:"weather", type:"dua", order:20, title:{en:"Full heavy rain dua",fr:"Invocation complète pour fortes pluies",de:"Vollständiges Starkregen Dua"}, arabic:"اَللَّهُمَّ حَوَالَيْنَا وَلَا عَلَيْنَا، اَللَّهُمَّ عَلَى الْآكَامِ وَالْجِبَالِ وَالْآجَامِ وَالظِّرَابِ وَالْأَوْدِيَةِ وَمَنَابِتِ الشَّجَرِ", transliteration:"Allaahumma hawaalainaa wa laa 'alainaa, Allaahumma 'alal-aakaami wal-jibaali wal-aajaami wazh-zhiraabi wal-awdiyati wa manaabitis-shajar.",
    translation:{en:"O Allah, let the rain fall on mountains, forests, hills, valleys and trees, not on us.",fr:"Ô Allah, fais tomber la pluie sur les montagnes, forêts, collines, vallées et arbres, pas sur nous.",de:"O Allah, lasse den Regen auf Berge, Wälder, Hügel, Täler und Bäume fallen, nicht auf uns."}, source:["Sahih Bukhari","Sahih Muslim"] },

  // ── CATEGORY: SICK ──
  
  { id:107, catId:"sick", type:"dua", order:1, title:{en:"Dua for pain on the body",fr:"Invocation pour la douleur corporelle",de:"Dua bei Körperschmerzen"}, instruction:{en:"Place your hand on the painful area and say Bismillah 3 times, then recite 7 times:",fr:"Pose ta main sur la zone douloureuse et dis Bismillah 3 fois, puis récite 7 fois :",de:"Lege deine Hand auf die schmerzende Stelle und sage Bismillah 3-mal, dann rezitiere 7-mal:"}, arabic:"بِسْمِ اللَّهِ (٣×) أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ (٧×)", transliteration:"Bismillaah (3x). A'uudzu billaahi wa qudrotihi min syarri maa ajidu wa uhaadzir (7x).",
    translation:{en:"In the name of Allah (3 times). I seek refuge in Allah and His power from the evil of what I feel and what I fear (7 times).",fr:"Au nom d'Allah (3 fois). Je cherche refuge auprès d'Allah et de Sa puissance contre le mal que je ressens et que je crains (7 fois).",de:"Im Namen Allahs (3×). Ich suche Zuflucht bei Allah und Seiner Macht vor dem Übel das ich spüre und vor dem ich mich fürchte (7×)."}, source:["Sahih Muslim"] },

  { id:108, catId:"sick", type:"dua", order:2, title:{en:"Ruqyah – Earth and saliva healing",fr:"Ruqyah – Guérison par la terre et la salive",de:"Ruqyah – Heilung durch Erde und Speichel"}, arabic:"بِسْمِ اللَّهِ تُرْبَةُ أَرْضِنَا بِرِيْقَةِ بَعْضِنَا يُشْفَى بِهِ سَقِيْمُنَا بِإِذْنِ رَبِّنَا", transliteration:"Bismillaah, turbatu ardhinaa, biriiqoti badhhinaa, yusyfaa bihi saqiimunaa, bi-idzni robbinaa.",
    translation:{en:"In the name of Allah. The soil of our land mixed with the saliva of some of us – by it our sick is healed, by the permission of our Lord.",fr:"Au nom d'Allah. La terre de notre pays mélangée à la salive de certains d'entre nous – par cela notre malade est guéri, par la permission de notre Seigneur.",de:"Im Namen Allahs. Die Erde unseres Landes, vermischt mit etwas Speichel von uns – dadurch wird unser Kranker geheilt, mit der Erlaubnis unseres Herrn."}, benefit:{en:"The Prophet ﷺ used this ruqyah for the sick. It is performed by touching the ground with a finger and reciting.",fr:"Le Prophète ﷺ utilisait cette ruqyah pour les malades. Elle est effectuée en touchant le sol avec un doigt et en récitant.",de:"Der Prophet ﷺ verwendete diese Ruqyah für Kranke. Sie wird durchgeführt, indem man den Boden mit einem Finger berührt und rezitiert."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:109, catId:"sick", type:"dua", order:3, title:{en:"Dua of Prophet Ayyub (Job) – Relief from suffering",fr:"Invocation du Prophète Ayyub – Soulagement de la souffrance",de:"Dua des Propheten Ayyub – Erleichterung vom Leid"}, arabic:"رَبِّ إِنِّي مَسَّنِيَ الضُّرُّ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", transliteration:"Robbi innii massaniyadh-dhurru wa anta arhamur-roohimiin.",
    translation:{en:"My Lord, indeed harm has touched me, and You are the Most Merciful of those who show mercy.",fr:"Mon Seigneur, le mal m'a touché, et Tu es le Plus Miséricordieux des miséricordieux.",de:"Mein Herr, mich hat gewiss das Leid getroffen, und Du bist der Barmherzigste der Barmherzigen."}, benefit:{en:"This is the dua of Prophet Ayyub عليه السلام when he was struck with severe illness. Allah answered his call and removed his suffering.",fr:"C'est l'invocation du Prophète Ayyub عليه السلام quand il fut frappé d'une maladie grave. Allah exauça son appel et mit fin à ses souffrances.",de:"Dies ist das Dua des Propheten Ayyub عليه السلام als er von schwerer Krankheit getroffen wurde. Allah erhörte seinen Ruf und entfernte sein Leid."}, source:["Quran 21:83"] },

  { id:110, catId:"sick", type:"dua", order:4, title:{en:"Dua when death may be near",fr:"Invocation quand la mort peut être proche",de:"Dua wenn der Tod nahe sein könnte"}, arabic:"اَللَّهُمَّ إِنْ كَانَ أَجَلِيْ قَدْ حَضَرَ فَأَرِحْنِيْ، وَإِنْ كَانَ مُتَأَخِّرًا فَارْفَعْهُ عَنِّيْ، وَإِنْ كَانَ بَلَاءً فَصَبِّرْنِيْ", transliteration:"Allaahumma in kaana ajalii qod hadhoro fa-arihnii, wa in kaana muta-akh-khiron farfa'hu 'annii, wa in kaana balaa-an fashobbirnii.",
    translation:{en:"O Allah, if my time has come then grant me relief. If it is delayed, then remove this illness from me. And if it is a trial, then grant me patience.",fr:"Ô Allah, si mon terme est arrivé, accorde-moi le repos. S'il est retardé, éloigne cette maladie de moi. Et si c'est une épreuve, accorde-moi la patience.",de:"O Allah, wenn meine Zeit gekommen ist gewähre mir Erleichterung. Wenn sie noch nicht gekommen ist nimm diese Krankheit von mir. Und wenn es eine Prüfung ist gib mir Geduld."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:111, catId:"sick", type:"surah", order:5, title:{en:"Al-Muawwidzat – Three Protective Surahs",fr:"Al-Muawwidzat – Trois Sourates Protectrices",de:"Al-Muawwidzat – Drei Schutz-Suren"}, instruction:{en:"Recite Surah Al-Ikhlas, Al-Falaq and An-Nas, then blow lightly into your hands and wipe over your body. Repeat 3 times.",fr:"Récitez la sourate Al-Ikhlas, Al-Falaq et An-Nas, puis soufflez légèrement dans vos mains et passez-les sur votre corps. Répétez 3 fois.",de:"Rezitiere die Sure Al-Ikhlas, Al-Falaq und An-Nas, dann blase leicht in deine Hände und streiche über deinen Körper. 3-mal wiederholen."}, surahs:[{name:{en:"Al-Ikhlas + Al-Falaq + An-Nas",fr:"Al-Ikhlas + Al-Falaq + An-Nas",de:"Al-Ikhlas + Al-Falaq + An-Nas"},ref:"112, 113, 114",arabic:"قُلْ هُوَ ٱللَّهُ أَحَدٌ ۝ ٱللَّهُ ٱلصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌ ۝۝ قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ ٱلنَّفَّـٰثَـٰتِ فِى ٱلْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ۝۝ قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ ۝ مَلِكِ ٱلنَّاسِ ۝ إِلَـٰهِ ٱلنَّاسِ ۝ مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ ۝ ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ ۝ مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ",note:{en:"Recite all three then wipe over body (3x)",fr:"Réciter les trois puis passer sur le corps (3x)",de:"Alle drei rezitieren dann über den Körper streichen (3x)"}}], benefits:{en:["The Prophet ﷺ used to recite these three surahs and wipe over his body when sick.","Aisha reported that when the Prophet ﷺ was ill, he would recite these and wipe over himself."],fr:["Le Prophète ﷺ récitait ces trois sourates et les passait sur son corps quand il était malade.","Aïcha rapporta que lorsque le Prophète ﷺ était malade, il récitait celles-ci et se passait dessus."],de:["Der Prophet ﷺ pflegte diese drei Suren zu rezitieren und über seinen Körper zu streichen wenn er krank war.","Aisha berichtete dass der Prophet ﷺ bei Krankheit diese rezitierte und sich damit über den Körper strich."]}, source:["Sahih Bukhari","Sahih Muslim"] },

  // ── CATEGORY: VISITING SICK ── 
  { id:112, catId:"visiting_sick", type:"info", order:1, title:{en:"Virtue of visiting the sick",fr:"Vertu de rendre visite aux malades",de:"Tugend des Krankenbesuchs"}, content:{en:"The Messenger of Allah ﷺ said: 'When a person visits his sick Muslim brother, it is as if he walks in the gardens of Paradise until he sits. When he sits, mercy descends upon him abundantly. If he visits in the morning, seventy thousand angels pray for him until the evening. And if he visits in the evening, seventy thousand angels pray for him until the morning.'",fr:"Le Messager d'Allah ﷺ a dit : 'Lorsqu'un homme rend visite à son frère musulman malade, c'est comme s'il marchait dans les jardins du Paradis jusqu'à ce qu'il s'assoie. Lorsqu'il s'assoit, la miséricorde descend abondamment sur lui. S'il visite le matin, soixante-dix mille anges prient pour lui jusqu'au soir. Et s'il visite le soir, soixante-dix mille anges prient pour lui jusqu'au matin.'",de:"Der Gesandte Allahs ﷺ sagte: 'Wenn ein Mensch seinen kranken muslimischen Bruder besucht, ist es als würde er in den Gärten des Paradieses gehen bis er sich setzt. Wenn er sich setzt, wird reichlich Barmherzigkeit auf ihn herabgesandt. Wenn er ihn morgens besucht, bitten siebzigtausend Engel für ihn bis zum Abend. Und wenn er ihn abends besucht, bitten siebzigtausend Engel für ihn bis zum Morgen.'"}, source:["At-Tirmidhi","Ibn Majah","Sahih"] },

  { id:113, catId:"visiting_sick", type:"dua", order:2, title:{en:"Words of comfort for the sick",fr:"Paroles de réconfort pour le malade",de:"Trostworte für den Kranken"}, arabic:"لاَ بَأْسَ طَهُوْرٌ إِنْ شَاءَ اللَّهُ", transliteration:"Laa ba'sa, thohuurun in syaa-allaah.",
    translation:{en:"No harm, it is a purification (of sins), if Allah wills.",fr:"Il n'y a pas de mal, c'est une purification (des péchés), si Allah le veut.",de:"Kein Problem, es ist eine Reinigung (der Sünden), so Allah will."}, benefit:{en:"The Prophet ﷺ said this when visiting the sick. It reassures the sick person and reminds them that illness erases sins.",fr:"Le Prophète ﷺ disait cela en rendant visite aux malades. Cela rassure le malade et lui rappelle que la maladie efface les péchés.",de:"Der Prophet ﷺ sagte dies beim Besuch von Kranken. Es beruhigt den Kranken und erinnert ihn daran, dass Krankheit Sünden tilgt."}, source:["Sahih Bukhari"] },

  { id:114, catId:"visiting_sick", type:"dua", order:3, title:{en:"Dua for the sick (1)",fr:"Invocation pour le malade (1)",de:"Dua für den Kranken (1)"}, arabic:"اَللَّهُمَّ رَبَّ النَّاسِ، أَذْهِبِ البَاسَ، اِشْفِ، أَنْتَ الشَّافِي، لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ، شِفَاءً لاَ يُغَادِرُ سَقَمًا", transliteration:"Allaahumma robban-naas, adz-hibil baas, isyfi, antasy-syaafii, laa syifaa-a illaa syifaa-uka, syifaa-an laa yughaadiru saqoman.",
