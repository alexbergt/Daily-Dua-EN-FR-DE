      en: "The Prophet said Allahu Akbar with each of the small stones he threw at all three Jamarat. After the first and second Jamarat he would stand facing the qibla with hands raised and make dua for a long time. At Jamarat Aqabah (the large one) he would throw the stones, say takbir and leave without stopping to make dua.",
      fr: "Le Prophète disait Allahu Akbar avec chacune des petites pierres qu'il lançait aux trois Jamarat. Après les première et deuxième Jamarat il se tenait face à la qibla, mains levées, et faisait une longue dua. À Jamarat Aqabah il lançait les pierres, disait takbir et repartait sans s'arrêter pour faire dua.",
      de: "Der Prophet sagte Allahu Akbar bei jedem der kleinen Steine die er bei allen drei Jamarat warf. Nach dem ersten und zweiten Jamarat stand er mit erhobenen Händen zur Qibla gewandt und machte lange Dua. Bei Jamarat Aqabah warf er die Steine sagte Takbir und ging ohne anzuhalten für Dua." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 387, catId: "hajj", type: "dua", order: 9,
    title: { en: "Dua on the Days of Tashriq (11th, 12th, 13th Dhul Hijjah)", fr: "Invocation pendant les Jours de Tashriq (11, 12, 13 Dhul Hijjah)", de: "Dua an den Tashriq-Tagen (11., 12., 13. Dhul Hijjah)" },
    arabic: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً، وَفِي الْآخِرَةِ حَسَنَةً، وَقِنَا عَذَابَ النَّارِ",
    transliteration: "Robbanaa aatinaa fid-dunyaa hasanah, wa fil aakhiroti hasanah, wa qinaa adzaaban-naar.",
    translation: {
      en: "Our Lord, give us good in this world and good in the Hereafter and protect us from the punishment of the Fire.",
      fr: "Notre Seigneur, donne-nous le bien en ce monde et le bien dans l'au-delà et protège-nous du châtiment du Feu.",
      de: "Unser Herr gib uns Gutes in dieser Welt und Gutes im Jenseits und schütze uns vor der Strafe des Feuers." },
    benefit: {
      en: "The scholars of the salaf recommended abundantly reciting this dua on the Days of Tashriq (11th, 12th and 13th of Dhul Hijjah). Dua on these days is not rejected. Allah says in Quran 2:200-201: remember Allah as you remember your forefathers or even more – and the best of those who remember is the one who asks for good in both worlds.",
      fr: "Les savants du salaf recommandaient de réciter abondamment ce dua pendant les Jours de Tashriq. La dua pendant ces jours n'est pas rejetée.",
      de: "Die Gelehrten des Salaf empfahlen dieses Dua an den Tashriq-Tagen reichlich zu rezitieren. Dua an diesen Tagen wird nicht abgelehnt." },
    source: ["Quran 2:200-201", "Rumaysho"] },

  // ── CATEGORY: SUJUD TILAWAH ──
  { id: 388, catId: "sujud_tilawah", type: "dua", order: 1,
    title: { en: "Dua of prostration of recitation 1", fr: "Invocation de la prosternation de récitation 1", de: "Dua der Rezitationsprostration 1" },
    arabic: "سَجَدَ وَجْهِيَ لِلَّذِيْ خَلَقَهُ وَشَقَّ سَمْعَهُ وَبَصَرَهُ بِحَوْلِهِ وَقُوَّتِهِ، فَتَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِيْنَ",
    transliteration: "Sajada wajhiya lilladzii kholaqohu wa syaqqo sam-ahu wa bashorohu bihaulihi wa quwwatih, fatabaarokallaahu ahsanul khooliqiin.",
    translation: {
      en: "My face has prostrated to the One who created it and formed its hearing and sight by His might and power. Blessed be Allah, the best of creators.",
      fr: "Mon visage s'est prosterné devant Celui qui l'a créé et qui a formé son ouïe et sa vue par Sa puissance et Sa force. Béni soit Allah, le meilleur des créateurs.",
      de: "Mein Gesicht hat sich vor Demjenigen niedergeworfen der es erschaffen und sein Gehör und seinen Blick durch Seine Macht und Kraft geformt hat. Gepriesen sei Allah der beste der Schöpfer." },
    benefit: {
      en: "Sujud Tilawah is a prostration performed when reciting or hearing certain verses of the Quran (the 15 sajdah verses). The one who prostrates says this dua in the sujud position.",
      fr: "Le Sujud Tilawah est une prosternation effectuée en récitant ou entendant certains versets du Coran (les 15 versets de sajdah). Celui qui se prosterne dit ce dua en position de sujud.",
      de: "Sujud Tilawah ist eine Prostration die bei der Rezitation oder dem Hören bestimmter Quran-Verse (die 15 Sajdah-Verse) durchgeführt wird. Der Prostrate sagt dieses Dua in der Sujud-Position." },
    source: ["At-Tirmidhi", "Ahmad", "Al-Hakim", "Sahih"] },

  { id: 389, catId: "sujud_tilawah", type: "dua", order: 2,
    title: { en: "Dua of prostration of recitation 2 – as accepted from Dawud", fr: "Invocation de la prosternation de récitation 2 – comme accepté de Dawud", de: "Dua der Rezitationsprostration 2 – wie von Dawud angenommen" },
    arabic: "اَللَّهُمَّ اكْتُبْ لِيْ بِهَا عِنْدَكَ أَجْرًا، وَضَعْ عَنِّيْ بِهَا وِزْرًا، وَاجْعَلْهَا لِيْ عِنْدَكَ ذُخْرًا، وَتَقَبَّلْهَا مِنِّيْ كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ",
    transliteration: "Allaahummaktub lii bihaa indaka ajron, wa dho-annii bihaa wizron, waj-alhaa lii indaka dzukhron, wa taqobbalhaa minnii kamaa taqobbaltahaa min abdika daawuud.",
    translation: {
      en: "O Allah, record for me with it a reward with You, remove from me a sin because of it, store it for me with You as a treasure, and accept it from me as You accepted it from Your servant Dawud.",
      fr: "Ô Allah, inscris pour moi par elle une récompense auprès de Toi, retire de moi par elle un péché, fais-en un trésor pour moi auprès de Toi, et accepte-la de moi comme Tu l'as acceptée de Ton serviteur Dawud.",
      de: "O Allah verzeichne für mich dadurch eine Belohnung bei Dir nimm mir dadurch eine Sünde ab mache es für mich bei Dir zu einem Schatz und nimm es von mir an wie Du es von Deinem Diener Dawud angenommen hast." },
    benefit: {
      en: "A beautiful dua that connects the one prostrating to Prophet Dawud (David) who was known for his intense worship and sujud. Asking Allah to accept this prostration in the same way He accepted those of His beloved prophet.",
      fr: "Un beau dua qui relie celui qui se prosterne au Prophète Dawud connu pour son adoration intense et ses prosternations. On demande à Allah d'accepter cette prosternation comme Il a accepté celles de Son prophète bien-aimé.",
      de: "Ein schönes Dua das den Prostrates mit dem Propheten Dawud verbindet der für seine intensive Anbetung und Prostration bekannt war. Allah wird gebeten diese Prostration so anzunehmen wie Er die seines geliebten Propheten angenommen hat." },
    source: ["At-Tirmidhi", "Al-Hakim", "Sahih"] },

  // ── CATEGORY: DUAS RELATED TO PRAYER ──
  { id: 390, catId: "salah_duas", type: "dua", order: 1,
    title: { en: "Dua Qunut Witr 1 – taught by the Prophet to Al-Hasan", fr: "Dua Qunut Witr 1 – enseignée par le Prophète à Al-Hasan", de: "Dua Qunut Witr 1 – vom Propheten an Al-Hasan gelehrt" },
    arabic: "اَللَّهُمَّ اهْدِنِيْ فِيْمَنْ هَدَيْتَ، وَعَافِنِيْ فِيْمَنْ عَافَيْتَ، وَتَوَلَّنِيْ فِيْمَنْ تَوَلَّيْتَ، وَبَارِكْ لِيْ فِيْمَا أَعْطَيْتَ، وَقِنِيْ شَرَّ مَا قَضَيْتَ، فَإِنَّكَ تَقْضِيْ وَلاَ يُقْضَى عَلَيْكَ، وَإِنَّهُ لاَ يَذِلُّ مَنْ وَالَيْتَ، وَلاَ يَعِزُّ مَنْ عَادَيْتَ، تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ",
    transliteration: "Allaahummah-dinii fiiman hadait, wa afinii fiiman aafait, wa tawallanii fiiman tawallait, wa baarik lii fiimaa a-thoit, wa qinii syarro maa qodhoit, fa-innaka taqdhii wa laa yuqdhoo alaik, wa innahu laa yadzillu man waalait, wa laa ya-izzu man aadait, tabaarokta robbanaa wa ta-aalait.",
    translation: {
      en: "O Allah, guide me among those You have guided, grant me well-being among those You have granted well-being, take me into Your care among those You have taken care of, bless for me what You have given me, protect me from the evil of what You have decreed. For indeed You decree and none can decree over You. Whoever You have befriended is never humiliated, and whoever You have opposed is never honoured. Blessed are You our Lord and Exalted.",
      fr: "Ô Allah, guide-moi parmi ceux que Tu as guidés, accorde-moi le bien-être parmi ceux à qui Tu as accordé le bien-être, prends-moi en charge parmi ceux que Tu as pris en charge, bénis pour moi ce que Tu m'as donné, protège-moi du mal de ce que Tu as décrété. Car Tu décèdes et nul ne peut décréter sur Toi. Celui que Tu as pris comme allié n'est jamais humilié, et celui que Tu as combattu n'est jamais honoré. Tu es béni notre Seigneur et Exalté.",
      de: "O Allah leite mich unter denen die Du geleitet hast gewähre mir Wohlergehen unter denen denen Du Wohlergehen gewährt hast nimm mich in Deine Obhut unter denen die Du in Obhut genommen hast segne mir was Du mir gegeben hast schütze mich vor dem Bösen dessen was Du bestimmt hast. Denn Du bestimmst und niemand kann über Dich bestimmen. Wen Du beschützt wird nie erniedrigt und wen Du bekämpft wird nie geehrt. Gepriesen bist Du unser Herr und Erhaben." },
    benefit: {
      en: "The Prophet taught this to his grandson Al-Hasan bin Ali to say in the Qunut of Witr prayer. It is the most authentic dua for Qunut Witr and covers guidance, well-being, care, blessings and protection from evil decrees.",
      fr: "Le Prophète a enseigné cela à son petit-fils Al-Hasan bin Ali pour le dire dans le Qunut de la prière Witr. C'est la dua la plus authentique pour le Qunut Witr.",
      de: "Der Prophet lehrte dies seinem Enkel Al-Hasan bin Ali um es im Qunut des Witr-Gebets zu sagen. Es ist das authentischste Dua für den Qunut Witr." },
    source: ["Abu Dawud", "At-Tirmidhi", "An-Nasai", "Ibn Majah", "Sahih"] },

  { id: 391, catId: "salah_duas", type: "dua", order: 2,
    title: { en: "Dua Qunut Witr 2 – from Umar and the companions", fr: "Dua Qunut Witr 2 – d'Umar et des compagnons", de: "Dua Qunut Witr 2 – von Umar und den Gefährten" },
    arabic: "اَللَّهُمَّ إِيَّاكَ نَعْبُدُ، وَلَكَ نُصَلِّيْ وَنَسْجُدُ، وَإِلَيْكَ نَسْعَى وَنَحْفِدُ، نَرْجُوْ رَحْمَتَكَ، وَنَخْشَى عَذَابَكَ، إِنَّ عَذَابَكَ بِالْكَافِرِيْنَ مُلْحِقٌ. اَللَّهُمَّ إِنَّا نَسْتَعِيْنُكَ وَنَسْتَغْفِرُكَ، وَنُثْنِيْ عَلَيْكَ الْخَيْرَ، وَلاَ نَكْفُرُكَ، وَنُؤْمِنُ بِكَ، وَنَخْضَعُ لَكَ، وَنَخْلَعُ مَنْ يَكْفُرُكَ",
    transliteration: "Allaahumma iyyaaka na-budu, wa laka nushollii wa nasjudu, wa ilaika nas-aa wa nahfidu, narjuu rohmataka, wa nakhsyaa adzaabaka, inna adzaabaka bilkaafiriina mulhiq. Allaahumma innaa nasta-iinuka wa nastaghfiruka, wa nutsnii alaikal khoiro, wa laa nakfuruka, wa nu-minu bika, wa nakh-dho-u laka, wa nakhla-u man yakfuruk.",
    translation: {
      en: "O Allah, You alone we worship, for You we pray and prostrate, toward You we strive and serve. We hope for Your mercy and fear Your punishment – indeed Your punishment reaches the disbelievers. O Allah, we seek Your help and Your forgiveness, we praise You with good praise, we do not deny You, we believe in You, we submit to You, and we disavow those who disbelieve in You.",
      fr: "Ô Allah, Toi seul nous adorons, pour Toi nous prions et nous prosternons, vers Toi nous nous efforçons et servons. Nous espérons Ta miséricorde et craignons Ton châtiment – certes Ton châtiment atteint les mécréants. Ô Allah, nous cherchons Ton aide et Ton pardon, nous Te louons d'une bonne louange, nous ne Te renions pas, nous croyons en Toi, nous nous soumettons à Toi.",
      de: "O Allah Dich allein verehren wir für Dich beten und prostratieren wir zu Dir streben und dienen wir. Wir hoffen auf Deine Barmherzigkeit und fürchten Deine Strafe – wahrlich Deine Strafe trifft die Ungläubigen. O Allah wir suchen Deine Hilfe und Vergebung wir loben Dich mit gutem Lob wir leugnen Dich nicht wir glauben an Dich wir unterwerfen uns Dir." },
    benefit: {
      en: "This Qunut was used by Umar ibn al-Khattab and has a sound chain. It can be combined with the first Qunut or used separately. Many mosques in Ramadan use both of these Qunut duas together in Witr.",
      fr: "Ce Qunut était utilisé par Umar ibn al-Khattab et a une chaîne authentique. Il peut être combiné avec le premier Qunut ou utilisé séparément.",
      de: "Dieser Qunut wurde von Umar ibn al-Khattab verwendet und hat eine authentische Kette. Er kann mit dem ersten Qunut kombiniert oder separat verwendet werden." },
    source: ["Al-Baihaqi", "Sahih chain", "Al-Albani"] },

  { id: 392, catId: "salah_duas", type: "dua", order: 3,
    title: { en: "Dua at the end of Witr prayer – I cannot enumerate Your praise", fr: "Invocation à la fin de la prière Witr – je ne peux pas dénombrer Tes louanges", de: "Dua am Ende des Witr-Gebets – ich kann Dein Lob nicht zählen" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِرِضَاكَ مِنْ سَخَطِكَ، وَبِمُعَافَاتِكَ مِنْ عُقُوْبَتِكَ، وَأَعُوْذُ بِكَ مِنْكَ، لاَ أُحْصِيْ ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ",
    transliteration: "Allaahumma innii a-uudzu biridhooka min sakhothika, wa bimu-aafaatika min uquubatika, wa a-uudzu bika minka, laa uhshii tsanaa-an alaika, anta kamaa ats-naita alaa nafsik.",
    translation: {
      en: "O Allah, I seek refuge in Your pleasure from Your anger, and in Your pardon from Your punishment, and I seek refuge in You from You. I cannot enumerate Your praise – You are as You have praised Yourself.",
      fr: "Ô Allah, je cherche refuge dans Ta satisfaction contre Ta colère, dans Ton pardon contre Ton châtiment, et je cherche refuge auprès de Toi contre Toi-même. Je ne peux pas dénombrer Tes louanges – Tu es tel que Tu T'es Toi-même loué.",
      de: "O Allah ich suche Zuflucht in Deinem Wohlgefallen vor Deinem Zorn und in Deiner Vergebung vor Deiner Strafe und ich suche Zuflucht bei Dir vor Dir. Ich kann Dein Lob nicht aufzählen – Du bist so wie Du Dich selbst gelobt hast." },
    benefit: {
      en: "The most beautiful dua of praise in the Sunnah. I seek refuge in You from You – meaning: from Your justice, seeking Your mercy. I cannot enumerate Your praise – admitting that no matter how much one praises Allah it will never be enough. Said after Witr or in sujud.",
      fr: "La plus belle dua de louange dans la Sunna. Je cherche refuge auprès de Toi contre Toi – c'est-à-dire contre Ta justice en cherchant Ta miséricorde. Je ne peux pas dénombrer Tes louanges – admettant que peu importe combien on loue Allah ce ne sera jamais suffisant.",
      de: "Das schönste Lob-Dua in der Sunnah. Ich suche Zuflucht bei Dir vor Dir – bedeutet: vor Deiner Gerechtigkeit und Deine Barmherzigkeit suchend. Ich kann Dein Lob nicht aufzählen – zugebend dass egal wie viel man Allah lobt es nie genug sein wird." },
    source: ["An-Nasai", "Abu Dawud", "At-Tirmidhi", "Sahih"] },

  { id: 393, catId: "salah_duas", type: "dua", order: 4,
    title: { en: "After Witr prayer – Subhanal Malikil Quddus (3x)", fr: "Après la prière Witr – Subhanal Malikil Quddus (3x)", de: "Nach dem Witr-Gebet – Subhanal Malikil Quddus (3x)" },
    arabic: "سُبْحَانَ الْمَلِكِ الْقُدُّوْسِ (3×)، رَبِّ الْمَلاَئِكَةِ وَالرُّوْحِ",
    transliteration: "Subhaanal malikil qudduus (3x), robbil malaa-ikati war-ruuh.",
    translation: {
      en: "Glory be to the Sovereign, the Most Holy (3 times – the third said loudly and elongated), Lord of the angels and the Spirit (Jibril).",
      fr: "Gloire au Souverain, le Très Saint (3 fois – la troisième dite à voix haute et prolongée), Seigneur des anges et de l'Esprit (Jibril).",
      de: "Gepriesen sei der Herrscher der Allerheiligste (3-mal – das dritte laut und gedehnt gesagt) Herr der Engel und des Geistes (Jibril)." },
    benefit: {
      en: "Said immediately after the salam of Witr prayer, three times. The third time is said loudly and with a long elongation of the word. There is no specific dua after Tarawih – this is the established dua after Witr only.",
      fr: "Dit immédiatement après le salam de la prière Witr, trois fois. La troisième fois est dite à voix haute avec une longue élongation du mot.",
      de: "Sofort nach dem Salam des Witr-Gebets dreimal gesagt. Das dritte Mal wird laut und mit langer Dehnung des Wortes gesagt." },
    source: ["An-Nasai", "Ad-Daruquthni", "Sahih"] },

  { id: 394, catId: "salah_duas", type: "dua", order: 5,
    title: { en: "Dua Istikharah 1 – seeking Allah's choice (for religion, livelihood and outcome)", fr: "Dua Istikharah 1 – demander le choix d'Allah (pour la religion, les moyens de vie et le résultat)", de: "Dua Istikhara 1 – Allahs Wahl erbitten (für Religion, Lebensunterhalt und Ergebnis)" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَسْتَخِيْرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيْمِ، فَإِنَّكَ تَقْدِرُ وَلاَ أَقْدِرُ، وَتَعْلَمُ وَلاَ أَعْلَمُ، وَأَنْتَ عَلاَّمُ الْغُيُوْبِ، اَللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَـٰذَا اْلأَمْرَ خَيْرٌ لِيْ فِيْ دِيْنِيْ وَمَعَاشِيْ وَعَاقِبَةِ أَمْرِيْ، فَاقْدُرْهُ لِيْ وَيَسِّرْهُ لِيْ ثُمَّ بَارِكْ لِيْ فِيْهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَـٰذَا اْلأَمْرَ شَرٌّ لِيْ فِيْ دِيْنِيْ وَمَعَاشِيْ وَعَاقِبَةِ أَمْرِيْ، فَاصْرِفْهُ عَنِّيْ وَاصْرِفْنِيْ عَنْهُ، وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ ثُمَّ أَرْضِنِيْ بِهِ",
    transliteration: "Allaahumma innii asta-khiiruka bi-ilmika, wa astaqdiruka biqudrotika, wa as-aluka min fadh-likal azhiim, fa-innaka taqdiru wa laa aqdiru, wa ta-lamu wa laa a-lamu, wa anta allaamul ghuyuub. Allaahumma in kunta ta-lamu anna haadzal amro khoirun lii fii diinii wa ma-aasyii wa aaqibati amrii, faqdurhu lii wa yassirhu lii tsumma baarik lii fiihi, wa in kunta ta-lamu anna haadzal amro syarrun lii fii diinii wa ma-aasyii wa aaqibati amrii, fash-rif-hu annii wash-rifnii anhu, waqdur liyal khoiro haitsu kaana tsumma ardhinii bih.",
    translation: {
      en: "O Allah, I seek Your guidance by Your knowledge, Your capability by Your power, and I ask You from Your great bounty. You are capable and I am not, You know and I do not, and You know the unseen. O Allah, if You know this matter is good for me in my religion, livelihood and the outcome of my affair, then decree it for me, make it easy for me, then bless me in it. But if You know this matter is bad for me in my religion, livelihood and the outcome of my affair, then keep it away from me and me away from it, and decree better for me wherever it may be, then make me content with it.",
      fr: "Ô Allah, je cherche Ta guidance par Ta connaissance, Ta capacité par Ta puissance, et je Te demande de Ta grande générosité. Tu es capable et je ne le suis pas, Tu sais et je ne sais pas, et Tu connais l'invisible. Ô Allah, si Tu sais que cette affaire m'est bonne pour ma religion, mes moyens de vie et le résultat de mon affaire, décrète-la pour moi, facilite-la pour moi puis bénis-moi en elle. Mais si Tu sais qu'elle m'est mauvaise, éloigne-la de moi et moi d'elle.",
      de: "O Allah ich suche Deine Führung durch Dein Wissen Deine Fähigkeit durch Deine Macht und ich bitte Dich um Deine große Gunst. Du bist fähig und ich nicht Du weißt und ich nicht und Du kennst das Verborgene. O Allah wenn Du weißt dass diese Angelegenheit gut für mich ist in meiner Religion meinem Lebensunterhalt und dem Ergebnis meiner Angelegenheit dann bestimme sie für mich erleichtere sie mir und segne mich darin. Wenn sie aber schlecht für mich ist halte sie von mir fern." },
    benefit: {
      en: "Prayed after 2 rakats of any voluntary prayer, raising hands and naming the specific matter. The answer is not in a dream but in what becomes easy or difficult afterward. Whatever Allah decrees after Istikhara is the best for you – be content with it.",
      fr: "Prié après 2 rakats de toute prière volontaire, en levant les mains et en nommant l'affaire spécifique. La réponse n'est pas dans un rêve mais dans ce qui devient facile ou difficile ensuite.",
      de: "Nach 2 Rakats eines freiwilligen Gebets mit erhobenen Händen und Nennung der spezifischen Angelegenheit gebetet. Die Antwort liegt nicht in einem Traum sondern darin was danach leicht oder schwierig wird." },
    source: ["Sahih Bukhari"] },

  { id: 395, catId: "salah_duas", type: "dua", order: 6,
    title: { en: "Dua Istikharah 2 – variant (for near and far matters)", fr: "Dua Istikharah 2 – variante (pour les affaires proches et lointaines)", de: "Dua Istikhara 2 – Variante (für nahe und ferne Angelegenheiten)" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَسْتَخِيْرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ الْعَظِيْمِ، فَإِنَّكَ تَقْدِرُ وَلاَ أَقْدِرُ، وَتَعْلَمُ وَلاَ أَعْلَمُ، وَأَنْتَ عَلاَّمُ الْغُيُوْبِ، اَللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَـٰذَا اْلأَمْرَ خَيْرٌ لِيْ فِيْ عَاجِلِ أَمْرِيْ وَآجِلِهِ، فَاقْدُرْهُ لِيْ وَيَسِّرْهُ لِيْ ثُمَّ بَارِكْ لِيْ فِيْهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَـٰذَا اْلأَمْرَ شَرٌّ لِيْ فِيْ عَاجِلِ أَمْرِيْ وَآجِلِهِ، فَاصْرِفْهُ عَنِّيْ وَاصْرِفْنِيْ عَنْهُ، وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ ثُمَّ أَرْضِنِيْ بِهِ",
    transliteration: "Allaahumma innii asta-khiiruka bi-ilmika, wa astaqdiruka biqudrotika, wa as-aluka min fadh-likal azhiim, fa-innaka taqdiru wa laa aqdiru, wa ta-lamu wa laa a-lamu, wa anta allaamul ghuyuub. Allaahumma in kunta ta-lamu anna haadzal amro khoirun lii fii aajili amrii wa aajilih, faqdurhu lii wa yassirhu lii tsumma baarik lii fiihi, wa in kunta ta-lamu anna haadzal amro syarrun lii fii aajili amrii wa aajilih, fash-rif-hu annii wash-rifnii anhu, waqdur liyal khoiro haitsu kaana tsumma ardhinii bih.",
    translation: {
      en: "O Allah, I seek Your guidance by Your knowledge, Your capability by Your power, and I ask You from Your great bounty. You are capable and I am not, You know and I do not, and You know the unseen. O Allah, if You know this matter is good for me in my near and far affairs, then decree it for me, make it easy for me, then bless me in it. But if You know this matter is bad for me in my near and far affairs, then keep it away from me and me away from it, and decree better for me wherever it may be, then make me content with it.",
      fr: "Similaire au premier Istikhara mais au lieu de mentionner la religion, les moyens de vie et le résultat, il dit: dans mes affaires immédiates et futures. Les deux versions sont authentiques et peuvent être utilisées.",
      de: "Ähnlich wie die erste Istikhara aber anstatt Religion Lebensunterhalt und Ergebnis zu nennen sagt er: in meinen nahen und fernen Angelegenheiten. Beide Versionen sind authentisch und können verwendet werden." },
    benefit: {
      en: "A slight variant of the first Istikhara. Instead of mentioning religion, livelihood and the outcome – it says near and far matters. Both versions are authentic and can be used interchangeably.",
      fr: "Une légère variante du premier Istikhara. Les deux versions sont authentiques et peuvent être utilisées indifféremment.",
      de: "Eine leichte Variante der ersten Istikhara. Beide Versionen sind authentisch und können austauschbar verwendet werden." },
    source: ["Ahmad", "Sahih Bukhari", "Ibn Hibban", "Al-Baihaqi"] },

  { id: 396, catId: "salah_duas", type: "dua", order: 7,
    title: { en: "Dua after Dhuha prayer 1 – said 100 times", fr: "Invocation après la prière Doha 1 – dite 100 fois", de: "Dua nach dem Duha-Gebet 1 – 100-mal gesagt" },
    arabic: "اَللَّهُمَّ اغْفِرْ لِي وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ",
    transliteration: "Allaahummagh-fir lii wa tub alayya, innaka antat-tawwaabur-rohiim. (100x)",
    translation: {
      en: "O Allah, forgive me and accept my repentance. Indeed You are the Accepter of repentance, the Most Merciful. (100 times)",
      fr: "Ô Allah, pardonne-moi et accepte mon repentir. Tu es certes Celui qui accepte le repentir, le Très Miséricordieux. (100 fois)",
      de: "O Allah vergib mir und nimm meine Reue an. Wahrlich Du bist der Reue-Annehmende der Barmherzige. (100 Mal)" },
    benefit: {
      en: "Aisha said: The Prophet performed Dhuha prayer and then repeated this dua 100 times. A powerful practice combining Dhuha prayer with 100 repetitions of Istighfar.",
      fr: "Aisha a dit : Le Prophète a accompli la prière Doha puis a répété ce dua 100 fois. Une pratique puissante combinant la prière Doha avec 100 répétitions d'Istighfar.",
      de: "Aisha sagte: Der Prophet verrichtete das Duha-Gebet und wiederholte dann dieses Dua 100-mal. Eine kraftvolle Praxis die das Duha-Gebet mit 100 Wiederholungen des Istighfar verbindet." },
    source: ["Al-Bukhari in Al-Adab Al-Mufrad", "Sahih Al-Albani"] },

  { id: 397, catId: "salah_duas", type: "dua", order: 8,
    title: { en: "Dua after Dhuha prayer 2 – said 100 times (variant)", fr: "Invocation après la prière Doha 2 – dite 100 fois (variante)", de: "Dua nach dem Duha-Gebet 2 – 100-mal gesagt (Variante)" },
    arabic: "اَللَّهُمَّ اغْفِرْ لِي وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الْغَفُورُ",
    transliteration: "Allaahummagh-fir lii wa tub alayya, innaka antat-tawwaabul ghofuur. (100x)",
    translation: {
      en: "O Allah, forgive me and accept my repentance. Indeed You are the Accepter of repentance, the Most Forgiving. (100 times)",
      fr: "Ô Allah, pardonne-moi et accepte mon repentir. Tu es certes Celui qui accepte le repentir, le Très Pardonneur. (100 fois)",
      de: "O Allah vergib mir und nimm meine Reue an. Wahrlich Du bist der Reue-Annehmende der Vergebende. (100 Mal)" },
    benefit: {
      en: "A variant of the previous dua with Al-Ghafoor instead of Ar-Raheem. A companion heard the Prophet saying this during Dhuha 100 times. The difference: Ar-Raheem emphasizes mercy, Al-Ghafoor emphasizes forgiveness. Both are authentic.",
      fr: "Une variante de la dua précédente avec Al-Ghafoor au lieu de Ar-Raheem. Un compagnon entendit le Prophète dire cela pendant Doha 100 fois.",
      de: "Eine Variante des vorherigen Duas mit Al-Ghafoor statt Ar-Raheem. Ein Gefährte hörte den Propheten dies während Duha 100-mal sagen." },
    source: ["An-Nasai in As-Sunan Al-Kubra"] },

  // ── CATEGORY: PRAYER ETIQUETTE & RULINGS ──
  { id: 398, catId: "salah_etiquette", type: "info", order: 1,
    title: { en: "The correct pronunciation of Allahu Akbar", fr: "La prononciation correcte de Allahu Akbar", de: "Die korrekte Aussprache von Allahu Akbar" },
    content: {
      en: "The correct way is: Allaahu Akbar – only the word Allah is elongated, Akbar is short. Common errors: 1) Aallahu (elongating Aal) = means: Is Allah the Greatest? – a statement of doubt. 2) Aakbar (elongating Aak) = same wrong meaning. 3) Akbaar (elongating baar) = Akbaar means a large drum – so it would mean Allah is a drum. All these mispronunciations change the meaning to something impermissible or even kufr. Pronounce carefully: Al-LAAH-u Ak-bar.",
      fr: "La manière correcte est : Allaahu Akbar – seul le mot Allah est allongé, Akbar est court. Erreurs courantes : 1) Aallahu (allonger Aal) = signifie : Est-ce qu'Allah est le Plus Grand ? – une déclaration de doute. 2) Akbaar (allonger baar) = Akbaar signifie un grand tambour – donc cela signifierait qu'Allah est un tambour. Toutes ces prononciations incorrectes changent le sens en quelque chose d'interdit.",
      de: "Die korrekte Weise ist: Allaahu Akbar – nur das Wort Allah wird gedehnt Akbar ist kurz. Häufige Fehler: 1) Aallahu (Aal dehnen) = bedeutet: Ist Allah der Größte? – eine zweifelhafte Aussage. 2) Akbaar (baar dehnen) = Akbaar bedeutet eine große Trommel – also würde es bedeuten Allah ist eine Trommel. Alle diese Fehlaussprachen ändern die Bedeutung in etwas Unerlaubtes." },
    source: ["carasholat.com"] },

  { id: 399, catId: "salah_etiquette", type: "info", order: 2,
    title: { en: "The correct pronunciation of Ameen and its virtues", fr: "La prononciation correcte de Ameen et ses vertus", de: "Die korrekte Aussprache von Ameen und seine Tugenden" },
    content: {
      en: "Permitted: Aamiin (long hamza) or Amiin (short hamza). Disputed and likely invalidates prayer: Aammiin (long hamza + tashdid on mim), Aamin (long hamza, no ya). Unanimously invalidates prayer: Aammin, Ammin, Amin (various combinations of short/missing letters). Meaning of Ameen: O Allah answer our dua. Virtues: 1) When your Ameen coincides with the angels' Ameen, past sins are forgiven. 2) It causes the dua to be accepted. 3) The Jews envied Muslims nothing more than the greeting of Salam and the saying of Ameen.",
      fr: "Permis : Aamiin (hamza long) ou Amiin (hamza court). Contesté et invalide probablement la prière : Aammiin (hamza long + tashdid sur mim). Invalide unanimement la prière : Aammin, Ammin, Amin. Signification : Ô Allah exauce notre dua. Vertus : 1) Quand ton Ameen coïncide avec celui des anges les péchés passés sont pardonnés. 2) Les Juifs nous enviaient rien plus que le salam et le Ameen.",
      de: "Erlaubt: Aamiin (langer Hamza) oder Amiin (kurzer Hamza). Umstritten und ungültig macht wahrscheinlich das Gebet: Aammiin (langer Hamza + Tashdid auf Mim). Macht einstimmig das Gebet ungültig: Aammin Ammin Amin. Bedeutung: O Allah erhöre unser Dua. Tugenden: 1) Wenn dein Ameen mit dem der Engel zusammenfällt werden vergangene Sünden vergeben. 2) Die Juden beneideten uns um nichts mehr als den Salam und das Ameen." },
    source: ["Sahih Bukhari", "Sahih Muslim", "Ibn Khuzaymah"] },

  // ── CATEGORY: ISTIFTAH (OPENING DUA OF PRAYER) ──
  { id: 400, catId: "istiftah", type: "dua", order: 1,
    title: { en: "Istiftah 1 – Cleanse me as a white garment is cleansed", fr: "Istiftah 1 – Purifiez-moi comme on purifie un vêtement blanc", de: "Istiftah 1 – Reinige mich wie ein weißes Gewand gereinigt wird" },
    arabic: "اَللَّهُمَّ بَاعِدْ بَيْنِيْ وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اَللَّهُمَّ نَقِّنِيْ مِنْ خَطَايَايَ كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اَللَّهُمَّ اغْسِلْنِيْ مِنْ خَطَايَايَ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ",
    transliteration: "Allaahumma baa-id bainii wa baina khothooyaaya kamaa baa-adta bainal masyriqi wal maghrib. Allaahumma naqqinii min khothooyaaya kamaa yunaqqots-tsaubul abyadhu minad-danas. Allaahummaghsilnii min khothooyaaya bil maa-i wats-tsalji wal barod.",
    translation: {
      en: "O Allah, put a great distance between me and my sins as You have put a great distance between the East and West. O Allah, cleanse me of my sins as a white garment is cleansed of dirt. O Allah, wash away my sins with water, snow and hail.",
      fr: "Ô Allah, mets une grande distance entre moi et mes péchés comme Tu as mis une grande distance entre l'Est et l'Ouest. Ô Allah, purifie-moi de mes péchés comme un vêtement blanc est purifié de la saleté. Ô Allah, lave mes péchés avec de l'eau, de la neige et de la grêle.",
      de: "O Allah setze eine große Distanz zwischen mich und meine Sünden wie Du eine große Distanz zwischen Ost und West gesetzt hast. O Allah reinige mich von meinen Sünden wie ein weißes Gewand von Schmutz gereinigt wird. O Allah wasche meine Sünden mit Wasser Schnee und Hagel weg." },
    benefit: {
      en: "The most common Istiftah in the obligatory prayers. The three images are beautiful: distance like East-West, cleansing like white cloth, washing with water, snow and hail – complete purification.",
      fr: "L'Istiftah le plus courant dans les prières obligatoires. Les trois images sont belles : distance comme Est-Ouest, purification comme tissu blanc, lavage avec eau, neige et grêle.",
      de: "Der häufigste Istiftah in den Pflichtgebeten. Die drei Bilder sind schön: Distanz wie Ost-West, Reinigung wie weißes Tuch, Waschen mit Wasser Schnee und Hagel." },
    source: ["Sahih Bukhari 744", "Sahih Muslim 1353"] },

  { id: 401, catId: "istiftah", type: "dua", order: 2,
    title: { en: "Istiftah 2 – Subhanakallahumma wa bihamdik", fr: "Istiftah 2 – Subhanakallahumma wa bihamdik", de: "Istiftah 2 – Subhanakallahumma wa bihamdik" },
    arabic: "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلاَ إِلَـٰهَ غَيْرُكَ",
    transliteration: "Subhaanakallaahumma wa bihamdika, wa tabaarokasmuka, wa ta-aalaa jadduka, wa laa ilaaha ghairuk.",
    translation: {
      en: "Glory be to You O Allah and with Your praise. Blessed is Your Name, Exalted is Your Majesty, and there is no deity worthy of worship except You.",
      fr: "Gloire à Toi ô Allah et par Ta louange. Béni soit Ton Nom, Exaltée est Ta Majesté, et il n'y a pas de divinité digne d'adoration sauf Toi.",
      de: "Gepriesen seist Du o Allah und mit Deinem Lob. Gesegnet ist Dein Name Erhaben ist Deine Majestät und es gibt keine Gottheit außer Dir." },
    benefit: {
      en: "A well-known Istiftah that is brief and complete. Widely used and known. It was recorded from the four Sunan collections.",
      fr: "Un Istiftah bien connu, bref et complet. Largement utilisé. Il a été enregistré dans les quatre collections de Sunan.",
      de: "Ein bekannter Istiftah der kurz und vollständig ist. Weit verbreitet und bekannt. Er wurde in den vier Sunan-Sammlungen überliefert." },
    source: ["Abu Dawud", "At-Tirmidhi", "An-Nasai", "Ibn Majah", "Sahih"] },

  { id: 402, catId: "istiftah", type: "dua", order: 3,
    title: { en: "Istiftah 3 – 12 angels competed to record it", fr: "Istiftah 3 – 12 anges ont rivalisé pour l'enregistrer", de: "Istiftah 3 – 12 Engel wetteiferten es aufzuzeichnen" },
    arabic: "اَلْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ",
    transliteration: "Alhamdulillaahi hamdan katsiiron thoyyiban mubaarokan fiih.",
    translation: {
      en: "All praise be to Allah, praise that is abundant, good and blessed.",
      fr: "Toute louange à Allah, une louange abondante, bonne et bénie.",
      de: "Aller Lob gebührt Allah Lob das reichlich gut und gesegnet ist." },
    benefit: {
      en: "A man arrived out of breath and said this. After prayer the Prophet asked who said it. The man answered. The Prophet said: I saw 12 angels racing to record it first. Short but so weighty that angels competed over it.",
      fr: "Un homme arriva essoufflé et dit cela. Après la prière le Prophète demanda qui l'avait dit. L'homme répondit. Le Prophète dit : J'ai vu 12 anges se précipiter pour l'enregistrer en premier.",
      de: "Ein Mann kam außer Atem und sagte dies. Nach dem Gebet fragte der Prophet wer es gesagt hatte. Der Prophet sagte: Ich sah 12 Engel wetteifern es zuerst aufzuzeichnen." },
    source: ["Sahih Muslim 600"] },

  { id: 403, catId: "istiftah", type: "dua", order: 4,
    title: { en: "Istiftah 4 – Gates of heaven opened for it", fr: "Istiftah 4 – Les portes du ciel s'ouvrirent pour lui", de: "Istiftah 4 – Die Tore des Himmels öffneten sich dafür" },
    arabic: "اَللَّهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلًا",
    transliteration: "Allaahu akbar kabiiroo, wal hamdulillaahi katsiiroo, wa subhaanallaahi bukrataw-wa ashiilaa.",
    translation: {
      en: "Allah is the Greatest, most Great. All praise to Allah in abundance. Glory to Allah in the morning and evening.",
      fr: "Allah est le Plus Grand, très Grand. Toute louange à Allah en abondance. Gloire à Allah le matin et le soir.",
      de: "Allah ist der Größte sehr groß. Aller Lob sei Allah in Fülle. Gepriesen sei Allah morgens und abends." },
    benefit: {
      en: "Ibn Umar heard someone say this in prayer. The Prophet asked who said it and said: I was amazed – the gates of heaven were opened for it. Ibn Umar said he never abandoned this dua after hearing that.",
      fr: "Ibn Umar entendit quelqu'un dire cela en prière. Le Prophète demanda qui l'avait dit et dit : J'étais émerveillé – les portes du ciel s'ouvrirent pour lui.",
      de: "Ibn Umar hörte jemanden dies im Gebet sagen. Der Prophet fragte wer es gesagt hatte und sagte: Ich war erstaunt – die Tore des Himmels öffneten sich dafür." },
    source: ["Sahih Muslim 943"] },

  { id: 404, catId: "istiftah", type: "dua", order: 5,
    title: { en: "Istiftah 5 – Allahu Akbar 3x, Owner of Dominion and Might", fr: "Istiftah 5 – Allahu Akbar 3x, Possesseur de Royauté et de Puissance", de: "Istiftah 5 – Allahu Akbar 3x, Besitzer von Herrschaft und Macht" },
    arabic: "اَللَّهُ أَكْبَرُ (3×)، ذُو الْمَلَكُوتِ، وَالْجَبَرُوتِ، وَالْكِبْرِيَاءِ، وَالْعَظَمَةِ",
    transliteration: "Allaahu akbar (3x), dzul malakuuti, wal jabaruuti, wal kibriyaa-i, wal azhomah.",
    translation: {
      en: "Allah is the Greatest (3 times), Possessor of the dominion, might, grandeur and majesty.",
      fr: "Allah est le Plus Grand (3 fois), Possesseur du règne, de la puissance, de la grandeur et de la majesté.",
      de: "Allah ist der Größte (3-mal) Besitzer der Herrschaft der Macht der Größe und der Majestät." },
    benefit: {
      en: "A powerful Istiftah combining three repetitions of Takbir with four of Allah's attributes: Malakut (Kingdom), Jabarut (Power), Kibriya (Grandeur) and Adhama (Majesty).",
      fr: "Un Istiftah puissant combinant trois répétitions de Takbir avec quatre attributs d'Allah: Malakut, Jabarut, Kibriya et Adhama.",
      de: "Ein kraftvoller Istiftah der drei Wiederholungen des Takbir mit vier Attributen Allahs kombiniert: Malakut Jabarut Kibriya und Adhama." },
    source: ["At-Tayalisi", "Al-Baihaqi"] },

  { id: 405, catId: "istiftah", type: "dua", order: 6,
    title: { en: "Istiftah 6 – 10x each phrase + protection from distress on Day of Judgment", fr: "Istiftah 6 – 10x chaque phrase + protection de la détresse au Jour du Jugement", de: "Istiftah 6 – 10x jede Phrase + Schutz vor Not am Jüngsten Tag" },
    arabic: "اَللَّهُ أَكْبَرُ (10×)، اَلْحَمْدُ لِلَّهِ (10×)، سُبْحَانَ اللَّهِ (10×)، لاَ إِلَـٰهَ إِلاَّ اللَّهُ (10×)، أَسْتَغْفِرُ اللَّهَ (10×)، اَللَّهُمَّ اغْفِرْ لِيْ وَاهْدِنِيْ وَارْزُقْنِيْ وَعَافِنِيْ (10×)، اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الضِّيْقِ يَوْمَ الْحِسَابِ (10×)",
    transliteration: "Allaahu akbar (10x), Alhamdulillaah (10x), Subhanallaah (10x), Laa ilaaha illallaah (10x), Astaghfirullaah (10x). Allaahummaghfir lii wahdinii warzuqnii wa afinii (10x). Allaahumma innii a-uudzu bika minadh-dhiiqi yaumal hisaab (10x).",
    translation: {
      en: "Allah is Greatest (10x), All praise to Allah (10x), Glory to Allah (10x), No deity except Allah (10x), I seek Allah's forgiveness (10x). O Allah forgive me, guide me, provide for me and grant me well-being (10x). O Allah I seek refuge in You from distress on the Day of Reckoning (10x).",
      fr: "Allah est le Plus Grand (10x), Toute louange à Allah (10x), Gloire à Allah (10x), Pas de divinité sauf Allah (10x), Je demande pardon à Allah (10x). Ô Allah pardonne-moi, guide-moi, pourvois à mes besoins et accorde-moi le bien-être (10x). Ô Allah je cherche refuge auprès de Toi contre la détresse au Jour du Jugement (10x).",
      de: "Allah ist der Größte (10x), Aller Lob Allah (10x), Gepriesen sei Allah (10x), Keine Gottheit außer Allah (10x), Ich suche Allahs Vergebung (10x). O Allah vergib mir leite mich versorge mich und gewähre mir Wohlergehen (10x). O Allah ich suche Zuflucht bei Dir vor Not am Tag der Abrechnung (10x)." },
    benefit: {
      en: "A comprehensive Istiftah from Aisha. The last phrase – seeking refuge from distress on the Day of Reckoning – is unique to this version. Said 10 times each before Fatiha.",
      fr: "Un Istiftah complet d'Aisha. La dernière phrase – chercher refuge contre la détresse au Jour du Jugement – est unique à cette version.",
      de: "Ein umfassender Istiftah von Aisha. Die letzte Phrase – Zuflucht suchen vor Not am Tag der Abrechnung – ist einzigartig für diese Version." },
    source: ["Ahmad 6/143", "At-Tabarani Al-Awsat", "Sahih Al-Albani"] },

  { id: 406, catId: "istiftah", type: "dua", order: 7,
    title: { en: "Istiftah 7 – I turn my face to the Creator – full version", fr: "Istiftah 7 – Je tourne mon visage vers le Créateur – version complète", de: "Istiftah 7 – Ich wende mein Gesicht dem Schöpfer zu – vollständige Version" },
    arabic: "وَجَّهْتُ وَجْهِيَ لِلَّذِيْ فَطَرَ السَّمَاوَاتِ وَاْلأَرْضَ حَنِيْفًا وَمَا أَنَا مِنَ الْمُشْرِكِيْنَ. إِنَّ صَلاَتِيْ وَنُسُكِيْ وَمَحْيَايَ وَمَمَاتِيْ لِلَّهِ رَبِّ الْعَالَمِيْنَ لاَ شَرِيْكَ لَهُ. وَبِذَالِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِيْنَ. اَللَّهُمَّ أَنْتَ الْمَلِكُ لاَ إِلَـٰهَ إِلاَّ أَنْتَ. أَنْتَ رَبِّيْ وَأَنَا عَبْدُكَ. ظَلَمْتُ نَفْسِيْ وَاعْتَرَفْتُ بِذَنْبِيْ. فَاغْفِرْ لِيْ ذُنُوْبِيْ جَمِيْعًا إِنَّهُ لاَ يَغْفِرُ الذُّنُوْبَ إِلاَّ أَنْتَ. وَاهْدِنِيْ لِأَحْسَنِ اْلأَخْلاَقِ لاَ يَهْدِيْ لِأَحْسَنِهَا إِلاَّ أَنْتَ. وَاصْرِفْ عَنِّيْ سَيِّئَهَا لاَ يَصْرِفُ عَنِّيْ سَيِّئَهَا إِلاَّ أَنْتَ. لَبَّيْكَ وَسَعْدَيْكَ وَالْخَيْرُ كُلُّهُ بِيَدَيْكَ وَالشَّرُّ لَيْسَ إِلَيْكَ. أَنَا بِكَ وَإِلَيْكَ. تَبَارَكْتَ وَتَعَالَيْتَ أَسْتَغْفِرُكَ وَأَتُوْبُ إِلَيْكَ",
    transliteration: "Wajjahtu wajhiya lilladzii fathoros-samaawaati wal ardhi haniifan wa maa anaa minal musyrikiin. Inna sholaatii wa nusukii wa mahyaaya wa mamaatii lillaahi robbil aalamiin laa syariika lah. Wa bidzaalika umirtu wa anaa minal muslimiin. Allaahumma antal maliku laa ilaaha illaa anta. Anta robbii wa anaa abduk. Zholamtu nafsii wa-taroftu bidzanbii. Faghfir lii dzunuubii jamii-an innahu laa yaghfirudz-dzunuuba illaa anta. Wahdinii li-ahsanil akhlaaqi laa yahdii li-ahsanihaa illaa anta. Washrif annii sayyi-ahaa laa yashrifu annii sayyi-ahaa illaa anta. Labbaika wa sa-daika walkhoiru kulluhu biyadaika wasy-syarru laisa ilaik. Anaa bika wa ilaik. Tabaarokta wa ta-aalaita astaghfiruka wa atuubu ilaik.",
    translation: {
      en: "I turn my face to the One Who created the heavens and earth, as a sincere believer, and I am not of the polytheists. My prayer, my worship, my life and my death are all for Allah, Lord of the worlds, Who has no partner. Thus I am commanded and I am of the Muslims. O Allah, You are the King, there is no deity except You. You are my Lord and I am Your servant. I have wronged myself and I acknowledge my sin. Forgive all my sins – none forgives sins except You. Guide me to the best of character – none guides to the best of it except You. Turn away from me its evil – none turns it away except You. I answer Your call, I seek Your aid, all good is in Your hands, evil is not from You. I am by You and to You. Blessed and Exalted are You, I seek Your forgiveness and repent to You.",
      fr: "Je tourne mon visage vers Celui qui a créé les cieux et la terre, sincèrement croyant, et je ne suis pas des polythéistes. Ma prière, mon adoration, ma vie et ma mort sont pour Allah Seigneur des mondes sans associé. Ainsi j'ai été commandé et je suis des musulmans. Ô Allah Tu es le Roi, pas de divinité sauf Toi. Tu es mon Seigneur et je suis Ton serviteur. J'ai opprimé mon âme et j'avoue mon péché. Pardonne tous mes péchés – nul ne pardonne sauf Toi.",
      de: "Ich wende mein Gesicht dem zu der Himmel und Erde erschaffen hat als aufrichtiger Gläubiger und ich bin nicht von den Polytheisten. Mein Gebet meine Verehrung mein Leben und mein Tod gehören Allah dem Herrn der Welten ohne Partner. So wurde ich befohlen und ich bin von den Muslimen. O Allah Du bist der König keine Gottheit außer Dir. Du bist mein Herr und ich bin Dein Diener. Ich habe mir selbst Unrecht getan und bekenne meine Sünde. Vergib alle meine Sünden – niemand vergibt außer Dir." },
    benefit: {
      en: "One of the most comprehensive Istiftah – covering declaration of faith, complete surrender, acknowledgment of sin, and requesting guidance in character. Used in both obligatory and voluntary prayers.",
      fr: "L'un des Istiftah les plus complets – couvrant la déclaration de foi, la reddition complète, l'aveu du péché et la demande de guidance dans le caractère.",
      de: "Einer der umfassendsten Istiftah – umfasst Glaubensbekenntnis vollständige Hingabe Sündenanerkenntnis und Bitte um Führung im Charakter." },
    source: ["Sahih Muslim 1/534"] },

  { id: 407, catId: "istiftah", type: "dua", order: 8,
    title: { en: "Istiftah 8 – I turn my face – shorter version with hanifan musliman", fr: "Istiftah 8 – Je tourne mon visage – version plus courte avec hanifan musliman", de: "Istiftah 8 – Ich wende mein Gesicht – kürzere Version mit hanifan musliman" },
    arabic: "وَجَّهْتُ وَجْهِيَ لِلَّذِيْ فَطَرَ السَّمَوَاتِ وَالْأَرْضَ حَنِيفًا مُسْلِمًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ. إِنَّ صَلَاتِيْ وَنُسُكِيْ وَمَحْيَايَ وَمَمَاتِيْ لِلَّهِ رَبِّ الْعَالَمِيْنَ لَا شَرِيْكَ لَهُ. وَبِذَالِكَ أُمِرْتُ وَأَنَا أَوَّلُ الْمُسْلِمِيْنَ. اَللَّهُمَّ أَنْتَ الْمَلِكُ لَا إِلَـٰهَ إِلَّا أَنْتَ. سُبْحَانَكَ وَبِحَمْدِكَ",
    transliteration: "Wajjahtu wajhiya lilladzii fathoros-samaawaati wal ardhi haniifan musliman wa maa anaa minal musyrikiin. Inna sholaatii wa nusukii wa mahyaaya wa mamaatii lillaahi robbil aalamiin laa syariika lah. Wa bidzaalika umirtu wa anaa awwalul muslimiin. Allaahumma antal maliku laa ilaaha illaa anta. Subhaanaka wa bihamdik.",
    translation: {
      en: "I turn my face to the One Who created the heavens and earth, as a sincere Muslim, and I am not of the polytheists. My prayer, my worship, my life and my death are all for Allah, Lord of the worlds, without partner. Thus I am commanded and I am the first of the Muslims. O Allah, You are the King, there is no deity except You. Glory be to You and praise.",
      fr: "Je tourne mon visage vers Celui qui a créé les cieux et la terre, sincèrement musulman, et je ne suis pas des polythéistes. Ma prière, mon adoration, ma vie et ma mort sont pour Allah Seigneur des mondes sans associé. Ainsi j'ai été commandé et je suis le premier des musulmans. Ô Allah Tu es le Roi, pas de divinité sauf Toi. Gloire à Toi et louange.",
      de: "Ich wende mein Gesicht dem zu der Himmel und Erde erschaffen hat als aufrichtiger Muslim und ich bin nicht von den Polytheisten. Mein Gebet Verehrung Leben und Tod gehören Allah dem Herrn der Welten ohne Partner. So wurde ich befohlen und ich bin der Erste der Muslime. O Allah Du bist der König keine Gottheit außer Dir. Gepriesen seist Du und Lob Dir." },
    benefit: {
      en: "A shorter variant of Istiftah 7. Ends with Subhanaka wa bihamdik instead of the longer dua. The phrase I am the first of the Muslims means first in my household or community.",
      fr: "Une variante plus courte de l'Istiftah 7. Se termine par Subhanaka wa bihamdik au lieu de la dua plus longue.",
      de: "Eine kürzere Variante von Istiftah 7. Endet mit Subhanaka wa bihamdik anstatt der längeren Dua." },
    source: ["An-Nasai 1/143", "Sahih Al-Albani"] },

  { id: 408, catId: "istiftah", type: "dua", order: 9,
    title: { en: "Istiftah 9 – Guide me to the best deeds and best character", fr: "Istiftah 9 – Guide-moi vers les meilleures actions et le meilleur caractère", de: "Istiftah 9 – Leite mich zu den besten Taten und dem besten Charakter" },
    arabic: "إِنَّ صَلَاتِيْ وَنُسُكِيْ وَمَحْيَايَ وَمَمَاتِيْ لِلَّهِ رَبِّ الْعَالَمِيْنَ لَا شَرِيْكَ لَهُ. وَبِذَالِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِيْنَ. اَللَّهُمَّ اهْدِنِيْ لِأَحْسَنِ الْأَعْمَالِ وَأَحْسَنِ الْأَخْلَاقِ لَا يَهْدِيْ لِأَحْسَنِهَا إِلَّا أَنْتَ. وَقِنِيْ سَيِّئَ الْأَعْمَالِ وَسَيِّئَ الْأَخْلَاقِ لَا يَقِيْ سَيِّئَهَا إِلَّا أَنْتَ",
    transliteration: "Inna sholaatii wa nusukii wa mahyaaya wa mamaatii lillaahi robbil aalamiin laa syariika lah. Wa bidzaalika umirtu wa anaa minal muslimiin. Allaahummahdinii li-ahsanil a-maali wa ahsanil akhlaaqi laa yahdii li-ahsanihaa illaa anta. Waqinii sayyi-al a-maali wa sayyi-al akhlaaqi laa yaqii sayyi-ahaa illaa anta.",
    translation: {
      en: "My prayer, my worship, my life and my death are all for Allah, Lord of the worlds, without partner. Thus I am commanded and I am of the Muslims. O Allah, guide me to the best deeds and the best character – none guides to the best of them except You. Protect me from evil deeds and bad character – none protects from their evil except You.",
      fr: "Ma prière, mon adoration, ma vie et ma mort sont pour Allah Seigneur des mondes sans associé. Ainsi j'ai été commandé et je suis des musulmans. Ô Allah guide-moi vers les meilleures actions et le meilleur caractère – nul ne guide vers leur meilleur sauf Toi. Protège-moi des mauvaises actions et du mauvais caractère.",
      de: "Mein Gebet Verehrung Leben und Tod gehören Allah dem Herrn der Welten ohne Partner. So wurde ich befohlen und ich bin von den Muslimen. O Allah leite mich zu den besten Taten und dem besten Charakter – niemand leitet zu ihrem Besten außer Dir. Schütze mich vor schlechten Taten und schlechtem Charakter." },
    benefit: {
      en: "A focused Istiftah asking specifically for guidance in deeds and character – acknowledging that good character is entirely from Allah's guidance.",
      fr: "Un Istiftah ciblé demandant spécifiquement la guidance dans les actions et le caractère – reconnaissant que le bon caractère vient entièrement de la guidance d'Allah.",
      de: "Ein fokussierter Istiftah der speziell um Führung in Taten und Charakter bittet – anerkennend dass guter Charakter vollständig aus Allahs Führung kommt." },
    source: ["An-Nasai 1/141", "Ad-Daruquthni 112"] },

  { id: 409, catId: "istiftah", type: "dua", order: 10,
    title: { en: "Istiftah 10 – Night prayer – O Allah Lord of Jibril, Mikail and Israfil", fr: "Istiftah 10 – Prière de nuit – Ô Allah Seigneur de Jibril, Mikail et Israfil", de: "Istiftah 10 – Nachtgebet – O Allah Herr von Jibril, Mikail und Israfil" },
    arabic: "اَللَّهُمَّ رَبَّ جِبْرَائِيْلَ وَمِيْكَائِيْلَ وَإِسْرَافِيْلَ فَاطِرَ السَّمَاوَاتِ وَاْلأَرْضِ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيْمَا كَانُوْا فِيْهِ يَخْتَلِفُوْنَ. اِهْدِنِيْ لِمَا اخْتُلِفَ فِيْهِ مِنَ الْحَقِّ بِإِذْنِكَ إِنَّكَ تَهْدِيْ مَنْ تَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيْمٍ",
    transliteration: "Allaahumma robba jibroo-iil wa miikaa-iil wa isroofiil. Faathiros-samaawaati wal ardh. Aalimal ghoibi wasy-syahaadati. Anta tahkumu baina ibaadika fiimaa kaanuu fiihi yakhtalifuun. Ihdinii limakh-tulifa fiihi minal haqqi bi-idznik. Innaka tahdii man tasyaa-u ilaa shirootim-mustaqiim.",
    translation: {
      en: "O Allah, Lord of Jibril, Mikail and Israfil, Creator of the heavens and earth, Knower of the unseen and witnessed. You judge between Your servants concerning what they used to differ in. Guide me to the truth in what has been differed about, by Your permission. Indeed You guide whom You will to the straight path.",
      fr: "Ô Allah, Seigneur de Jibril, Mikail et Israfil, Créateur des cieux et de la terre, Connaisseur de l'invisible et du témoigné. Tu juges entre Tes serviteurs concernant ce en quoi ils différaient. Guide-moi vers la vérité dans ce qui a été controversé, avec Ta permission.",
      de: "O Allah Herr von Jibril Mikail und Israfil Schöpfer der Himmel und Erde Wissender des Verborgenen und Bezeugten. Du richtest zwischen Deinen Dienern über das worin sie sich unterschieden. Leite mich zur Wahrheit in dem was umstritten war mit Deiner Erlaubnis." },
    benefit: {
      en: "The Prophet frequently used this in night prayers. Mentioning the three major angels shows the grandeur of the One being asked. Permissible in obligatory prayers too.",
      fr: "Le Prophète utilisait fréquemment cela dans les prières de nuit. Mentionner les trois grands anges montre la grandeur de Celui à qui on demande.",
      de: "Der Prophet verwendete dies häufig in Nachtgebeten. Die Erwähnung der drei großen Engel zeigt die Größe Dessen dem man bittet." },
    source: ["Sahih Muslim 1/534"] },

  { id: 410, catId: "istiftah", type: "dua", order: 11,
    title: { en: "Istiftah 11 – Night prayer – O Allah all praise is Yours, You are the Truth", fr: "Istiftah 11 – Prière de nuit – Ô Allah toute louange T'appartient, Tu es la Vérité", de: "Istiftah 11 – Nachtgebet – O Allah aller Lob gehört Dir Du bist die Wahrheit" },
    arabic: "اَللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ قَيِّمُ السَّمَاوَاتِ وَاْلأَرْضِ وَمَنْ فِيْهِنَّ. وَلَكَ الْحَمْدُ أَنْتَ نُوْرُ السَّمَاوَاتِ وَاْلأَرْضِ. وَلَكَ الْحَمْدُ أَنْتَ الْحَقُّ وَوَعْدُكَ الْحَقُّ وَلِقَاؤُكَ حَقٌّ وَقَوْلُكَ حَقٌّ وَالْجَنَّةُ حَقٌّ وَالنَّارُ حَقٌّ وَالنَّبِيُّوْنَ حَقٌّ وَمُحَمَّدٌ حَقٌّ وَالسَّاعَةُ حَقٌّ. اَللَّهُمَّ لَكَ أَسْلَمْتُ وَبِكَ آمَنْتُ وَعَلَيْكَ تَوَكَّلْتُ وَإِلَيْكَ أَنَبْتُ وَبِكَ خَاصَمْتُ وَإِلَيْكَ حَاكَمْتُ. فَاغْفِرْ لِيْ مَا قَدَّمْتُ وَمَا أَخَّرْتُ وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ. أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ لاَ إِلَـٰهَ إِلَّا أَنْتَ",
    transliteration: "Allaahumma lakal hamdu anta qoyyimus-samaawaati wal ardhi wa man fiihinn. Wa lakal hamdu anta nuurus-samaawaati wal ardhi. Wa lakal hamdu antal haqq wa wa-dukal haqq wa liqoo-ukal haqq wa qouluka haqq wal jannatu haqq wan-naaru haqq wan-nabiyyuuna haqq wa muhammadun haqq was-saa-atu haqq. Allaahumma laka aslamtu wa bika aamantu wa alaika tawakkaltu wa ilaika anabtu wa bika khooshomtu wa ilaika haakamtu. Faghfir lii maa qoddamtu wa maa akh-khortu wa maa asrortu wa maa a-lantu. Antal muqoddimu wa antal mu-akh-khiru laa ilaaha illaa anta.",
    translation: {
      en: "O Allah, all praise is Yours – You are the Sustainer of the heavens and earth and all in them. All praise is Yours – You are the Light of the heavens and earth. All praise is Yours – You are the Truth, Your promise is truth, meeting You is truth, Your word is truth, Paradise is truth, Hell is truth, the Prophets are truth, Muhammad is truth, the Hour is truth. O Allah, to You I have submitted, in You I have believed, upon You I have relied, to You I have turned in repentance, with You I have disputed, to You I have referred for judgment. Forgive me what I have done before and after, what I have hidden and what I have disclosed. You are Al-Muqaddim and Al-Muakhkhir. There is no deity except You.",
      fr: "Ô Allah toute louange T'appartient – Tu es le Soutien des cieux et de la terre. Toute louange – Tu es la Lumière des cieux et de la terre. Toute louange – Tu es la Vérité, Ta promesse est vérité, Te rencontrer est vérité, Ta parole est vérité, le Paradis est vérité, l'Enfer est vérité, les Prophètes sont vérité, Muhammad est vérité, l'Heure est vérité. Ô Allah je me suis soumis à Toi, j'ai cru en Toi, je me suis fié à Toi. Pardonne-moi ce que j'ai fait avant et après, en secret et publiquement.",
      de: "O Allah aller Lob gehört Dir – Du bist der Erhalter der Himmel und Erde. Aller Lob – Du bist das Licht der Himmel und Erde. Aller Lob – Du bist die Wahrheit Dein Versprechen ist Wahrheit Dich zu treffen ist Wahrheit Dein Wort ist Wahrheit das Paradies ist Wahrheit die Hölle ist Wahrheit die Propheten sind Wahrheit Muhammad ist Wahrheit die Stunde ist Wahrheit. O Allah Dir habe ich mich ergeben in Dir habe ich geglaubt auf Dir habe ich vertraut zu Dir habe ich mich gewandt. Vergib mir was ich früher und später getan habe im Verborgenen und Offensichtlichen." },
    benefit: {
      en: "The longest and most majestic Istiftah – used by the Prophet in night prayer. Declares 9 truths including Paradise, Hell, the Prophets, Muhammad and the Hour. Then surrenders everything to Allah.",
      fr: "Le plus long et le plus majestueux Istiftah – utilisé par le Prophète dans la prière de nuit. Déclare 9 vérités dont le Paradis, l'Enfer, les Prophètes, Muhammad et l'Heure.",
      de: "Der längste und majestätischste Istiftah – vom Propheten im Nachtgebet verwendet. Erklärt 9 Wahrheiten einschließlich Paradies Hölle Propheten Muhammad und die Stunde." },
    source: ["Sahih Bukhari 2/3", "Sahih Muslim 2/184"] },

  { id: 411, catId: "istiftah", type: "dua", order: 12,
    title: { en: "Istiftah 12 – Night prayer – Subhanakallahumma + La ilaha illallah 3x + Allahu Akbar 3x", fr: "Istiftah 12 – Prière de nuit – Subhanakallahumma + La ilaha illallah 3x + Allahu Akbar 3x", de: "Istiftah 12 – Nachtgebet – Subhanakallahumma + La ilaha illallah 3x + Allahu Akbar 3x" },
    arabic: "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبَارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلاَ إِلَـٰهَ غَيْرُكَ، لاَ إِلَـٰهَ إِلاَّ اللَّهُ (3×)، اَللَّهُ أَكْبَر كَبِيْرًا (3×)",
    transliteration: "Subhaanakallaahumma wa bihamdika, wa tabaarokasmuka, wa ta-aalaa jadduka, wa laa ilaaha ghairuka. Laa ilaaha illallaah (3x). Allaahu akbar kabiiroo (3x).",
    translation: {
      en: "Glory be to You O Allah and with Your praise. Blessed is Your Name, Exalted is Your Majesty, and there is no deity except You. There is no deity except Allah (3 times). Allah is the Greatest, most Great (3 times).",
      fr: "Gloire à Toi ô Allah et par Ta louange. Béni soit Ton Nom, Exaltée est Ta Majesté, et il n'y a pas de divinité sauf Toi. Il n'y a pas de divinité sauf Allah (3 fois). Allah est le Plus Grand, très Grand (3 fois).",
      de: "Gepriesen seist Du o Allah und mit Deinem Lob. Gesegnet ist Dein Name Erhaben ist Deine Majestät keine Gottheit außer Dir. Keine Gottheit außer Allah (3x). Allah ist der Größte sehr groß (3x)." },
    benefit: {
      en: "Combines Istiftah 2 with triple repetitions of Tahlil and Takbir. Specifically transmitted for night prayer but permissible in all prayers.",
      fr: "Combine l'Istiftah 2 avec des répétitions triples de Tahlil et Takbir. Spécifiquement transmis pour la prière de nuit mais permis dans toutes les prières.",
      de: "Kombiniert Istiftah 2 mit dreifachen Wiederholungen von Tahlil und Takbir. Speziell für das Nachtgebet überliefert aber in allen Gebeten erlaubt." },
    source: ["Abu Dawud 775", "Sahih Abu Dawud"] },

  // ── CATEGORY: TA'AWUDZ ──
  { id: 412, catId: "taawudz", type: "dua", order: 1,
    title: { en: "Ta'awudz 1 – with As-Sami Al-Alim", fr: "Ta'awudz 1 – avec As-Sami Al-Alim", de: "Ta'awudz 1 – mit As-Sami Al-Alim" },
    arabic: "أَعُوذُ بِاللَّهِ السَّمِيعِ الْعَلِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ مِنْ هَمْزِهِ وَنَفْخِهِ وَنَفْثِهِ",
    transliteration: "A-uudzu billaahis-samii-il aliim, minasy-syaithoonir-rojiim, min hamzihi wa naf-khihi wa naf-tsih.",
    translation: {
      en: "I seek refuge in Allah the All-Hearing the All-Knowing from the accursed Satan – from his madness, his arrogance and his evil poetry.",
      fr: "Je cherche refuge auprès d'Allah l'Omniaudient l'Omniscient contre Satan le maudit – contre sa folie, son arrogance et sa mauvaise poésie.",
      de: "Ich suche Zuflucht bei Allah dem Allhörenden dem Allwissenden vor dem verfluchten Satan – vor seinem Wahnsinn seiner Arroganz und seiner bösen Dichtung." },
    benefit: {
      en: "Read in the first rakat after Istiftah and before Al-Fatiha. According to the stronger opinion it is only in the first rakat. Hamzuhu means madness, naf-khuhu means arrogance, naf-tsuhu means evil whisperings or poetry.",
      fr: "Lu dans le premier rakat après l'Istiftah et avant Al-Fatiha. Selon l'opinion la plus forte, seulement dans le premier rakat. Hamzuhu signifie folie, naf-khuhu arrogance, naf-tsuhu mauvais murmures.",
      de: "Im ersten Rakat nach dem Istiftah und vor Al-Fatiha gelesen. Nach der stärkeren Meinung nur im ersten Rakat. Hamzuhu bedeutet Wahnsinn naf-khuhu Arroganz naf-tsuhu böse Einflüsterungen." },
    source: ["Abu Dawud 775", "At-Tirmidhi 242", "Hasan"] },

  { id: 413, catId: "taawudz", type: "dua", order: 2,
    title: { en: "Ta'awudz 2 – without As-Sami Al-Alim", fr: "Ta'awudz 2 – sans As-Sami Al-Alim", de: "Ta'awudz 2 – ohne As-Sami Al-Alim" },
    arabic: "أَعُوْذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيْمِ مِنْ هَمْزِهِ وَنَفْخِهِ وَنَفْثِهِ",
    transliteration: "A-uudzu billaahi minasy-syaithoonir-rojiim, min hamzihi wa naf-khihi wa naf-tsih.",
    translation: {
      en: "I seek refuge in Allah from the accursed Satan – from his madness, his arrogance and his evil poetry.",
      fr: "Je cherche refuge auprès d'Allah contre Satan le maudit – contre sa folie, son arrogance et sa mauvaise poésie.",
      de: "Ich suche Zuflucht bei Allah vor dem verfluchten Satan – vor seinem Wahnsinn seiner Arroganz und seiner bösen Dichtung." },
    benefit: {
      en: "A shorter version without the names As-Sami Al-Alim. Both versions are authentic and can be used alternately.",
      fr: "Une version plus courte sans les noms As-Sami Al-Alim. Les deux versions sont authentiques et peuvent être utilisées alternativement.",
      de: "Eine kürzere Version ohne die Namen As-Sami Al-Alim. Beide Versionen sind authentisch und können abwechselnd verwendet werden." },
    source: ["Ibn Abi Shaybah", "At-Tabarani", "Sahih Al-Albani 342"] },

  { id: 414, catId: "taawudz", type: "dua", order: 3,
    title: { en: "Ta'awudz 3 – short form (also permissible)", fr: "Ta'awudz 3 – forme courte (également permise)", de: "Ta'awudz 3 – Kurzform (ebenfalls erlaubt)" },
    arabic: "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ",
    transliteration: "A-uudzu billaahi minasy-syaithoonir-rojiim.",
    translation: {
      en: "I seek refuge in Allah from the accursed Satan.",
      fr: "Je cherche refuge auprès d'Allah contre Satan le maudit.",
      de: "Ich suche Zuflucht bei Allah vor dem verfluchten Satan." },
    benefit: {
      en: "The shortest form of Ta'awudz. Permissible based on the general Quranic command: When you recite the Quran seek refuge in Allah from Shaytan the accursed (An-Nahl 98). Ibn Taimiyah: if one forgets Ta'awudz in the first rakat, read it in the second.",
      fr: "La forme la plus courte de Ta'awudz. Permise selon le commandement coranique général : Quand tu récites le Coran cherche refuge en Allah contre Shaytan le maudit (An-Nahl 98).",
      de: "Die kürzeste Form des Ta'awudz. Erlaubt basierend auf dem allgemeinen Quranbefehl: Wenn du den Quran rezitierst suche Zuflucht bei Allah vor dem verfluchten Shaytan (An-Nahl 98)." },
    source: ["Quran 16:98", "Rumaysho"] },

  // ── CATEGORY: DUAS OF RUKU ──
  { id: 415, catId: "ruku", type: "dua", order: 1,
    title: { en: "Ruku dua 1 – Subhana Rabbiyal Adhim (3x)", fr: "Dua du Ruku 1 – Subhana Rabbiyal Adhim (3x)", de: "Ruku Dua 1 – Subhana Rabbiyal Adhim (3x)" },
    arabic: "سُبْحَانَ رَبِّيَ الْعَظِيْمِ",
    transliteration: "Subhaana robbiyal azhiim. (3x)",
    translation: {
      en: "Glory be to my Lord the Most Great. (3 times)",
      fr: "Gloire à mon Seigneur le Très Grand. (3 fois)",
      de: "Gepriesen sei mein Herr der Allerhöchste. (3 Mal)" },
    benefit: {
      en: "The most common and well-known dua of Ruku. Said minimum 3 times. The Prophet said: make this your ruku when the verse was revealed: Glorify the name of your Lord the Most Great.",
      fr: "La dua la plus courante du Ruku. Dite au minimum 3 fois. Le Prophète dit : faites-en votre ruku quand le verset fut révélé : Glorifiez le nom de votre Seigneur le Très Grand.",
      de: "Das häufigste und bekannteste Dua des Ruku. Mindestens 3-mal gesagt. Der Prophet sagte: Macht das zu eurem Ruku als der Vers offenbart wurde: Verherrlicht den Namen eures Herrn des Allerhöchsten." },
    source: ["Abu Dawud", "At-Tirmidhi", "An-Nasai", "Ahmad", "Sahih"] },

  { id: 416, catId: "ruku", type: "dua", order: 2,
    title: { en: "Ruku dua 2 – Subhana Rabbiyal Adhim wa bihamdih (3x)", fr: "Dua du Ruku 2 – Subhana Rabbiyal Adhim wa bihamdih (3x)", de: "Ruku Dua 2 – Subhana Rabbiyal Adhim wa bihamdih (3x)" },
    arabic: "سُبْحَانَ رَبِّيَ الْعَظِيْمِ وَبِحَمْدِهِ",
    transliteration: "Subhaana robbiyal azhiimi wa bihamdih. (3x)",
    translation: {
      en: "Glory be to my Lord the Most Great and with His praise. (3 times)",
      fr: "Gloire à mon Seigneur le Très Grand et par Sa louange. (3 fois)",
      de: "Gepriesen sei mein Herr der Allerhöchste und mit Seinem Lob. (3 Mal)" },
    benefit: {
      en: "An extended version adding praise (bihamdih) to the standard Ruku dua. Both versions are authentic and can be alternated.",
      fr: "Une version étendue ajoutant la louange (bihamdih) au dua standard du Ruku. Les deux versions sont authentiques.",
      de: "Eine erweiterte Version die Lob (bihamdih) zum Standard-Ruku-Dua hinzufügt. Beide Versionen sind authentisch." },
    source: ["Abu Dawud 870", "Sahih Al-Albani", "Ad-Daruquthni", "Ahmad"] },

  { id: 417, catId: "ruku", type: "dua", order: 3,
    title: { en: "Ruku dua 3 – Glory be to You O Allah and with Your praise, forgive me", fr: "Dua du Ruku 3 – Gloire à Toi ô Allah et par Ta louange, pardonne-moi", de: "Ruku Dua 3 – Gepriesen seist Du o Allah und mit Deinem Lob vergib mir" },
    arabic: "سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اَللَّهُمَّ اغْفِرْ لِيْ",
    transliteration: "Subhaanakallaahumma robbanaa wa bihamdika, allaahummagh-fir lii.",
    translation: {
      en: "Glory be to You O Allah our Lord and with Your praise. O Allah, forgive me.",
      fr: "Gloire à Toi ô Allah notre Seigneur et par Ta louange. Ô Allah, pardonne-moi.",
      de: "Gepriesen seist Du o Allah unser Herr und mit Deinem Lob. O Allah vergib mir." },
    benefit: {
      en: "Aisha said the Prophet abundantly recited this in ruku and sujud – it was his explanation of the verse: Glorify the name of your Lord the Most Great. This combines glorification, praise and seeking forgiveness in one.",
      fr: "Aisha dit que le Prophète récitait abondamment cela en ruku et sujud – c'était son explication du verset. Cela combine glorification, louange et demande de pardon en un.",
      de: "Aisha sagte der Prophet rezitierte dies reichlich in Ruku und Sujud – es war seine Erklärung des Verses. Es kombiniert Verherrlichung Lob und Vergebungsbitte in einem." },
    source: ["Sahih Bukhari 817", "Sahih Muslim 484"] },

  { id: 418, catId: "ruku", type: "dua", order: 4,
    title: { en: "Ruku dua 4 – Glory to the Owner of Power, Kingdom and Majesty", fr: "Dua du Ruku 4 – Gloire au Possesseur de Puissance, Royauté et Majesté", de: "Ruku Dua 4 – Gepriesen sei der Besitzer von Macht Herrschaft und Majestät" },
    arabic: "سُبْحَانَ ذِي الْجَبَرُوْتِ وَالْمَلَكُوْتِ وَالْكِبْرِيَاءِ وَالْعَظَمَةِ",
    transliteration: "Subhaana dzil jabaruuti, wal malakuuti, wal kibriyaa-i, wal azhomah.",
    translation: {
      en: "Glory be to the Possessor of Power, Dominion, Majesty and Greatness.",
      fr: "Gloire au Possesseur de la Puissance, du Règne, de la Majesté et de la Grandeur.",
      de: "Gepriesen sei der Besitzer der Macht der Herrschaft der Majestät und der Größe." },
    benefit: {
      en: "Four of Allah's most majestic attributes mentioned in one ruku dua. Combining this with other ruku duas shows the diversity of what the Prophet said.",
      fr: "Quatre des attributs les plus majestueux d'Allah mentionnés dans un seul dua du ruku.",
      de: "Vier der majestätischsten Attribute Allahs in einem einzigen Ruku-Dua erwähnt." },
    source: ["Abu Dawud 1/230", "An-Nasai", "Ahmad", "Hasan"] },

  { id: 419, catId: "ruku", type: "dua", order: 5,
    title: { en: "Ruku dua 5 – Subbuuhun Qudduusun, Lord of the angels and Jibril", fr: "Dua du Ruku 5 – Subbuuhun Qudduusun, Seigneur des anges et de Jibril", de: "Ruku Dua 5 – Subbuuhun Qudduusun Herr der Engel und Jibril" },
    arabic: "سُبُّوْحٌ قُدُّوْسٌ رَبُّ الْمَلَائِكَةِ وَالرُّوْحِ",
    transliteration: "Subbuuhun, qudduusun, robbul malaa-ikati war-ruuh.",
    translation: {
      en: "The Most Glorified, the Most Holy, Lord of the angels and the Spirit (Jibril).",
      fr: "Le Plus Glorifié, le Très Saint, Seigneur des anges et de l'Esprit (Jibril).",
      de: "Der Allverherrlichte der Allerheiligste Herr der Engel und des Geistes (Jibril)." },
    benefit: {
      en: "Same as the dua said after Witr prayer – connecting the ruku to the grandest forms of Allah's praise. Subbuuhun and Qudduusun are intensive forms of holiness and glorification.",
      fr: "Identique au dua dit après la prière Witr – reliant le ruku aux formes les plus grandioses de louange d'Allah.",
      de: "Identisch mit dem Dua nach dem Witr-Gebet – verbindet den Ruku mit den erhabensten Formen von Allahs Lob." },
    source: ["Sahih Muslim 1/353", "Abu Dawud 1/230"] },

  { id: 420, catId: "ruku", type: "dua", order: 6,
    title: { en: "Ruku dua 6 – O Allah for You I bowed, my hearing and sight submit", fr: "Dua du Ruku 6 – Ô Allah pour Toi je me suis incliné, mon ouïe et ma vue se soumettent", de: "Ruku Dua 6 – O Allah für Dich habe ich mich verneigt mein Gehör und Sehvermögen unterwerfen sich" },
    arabic: "اَللَّهُمَّ لَكَ رَكَعْتُ وَبِكَ آمَنْتُ وَلَكَ أَسْلَمْتُ خَشَعَ لَكَ سَمْعِيْ وَبَصَرِيْ وَمُخِّيْ وَعَظْمِيْ وَعَصَبِيْ وَمَا اسْتَقَلَّ بِهِ قَدَمِيْ",
    transliteration: "Allaahumma laka roka-tu wa bika aamantu wa laka aslamtu khosya-a laka sam-ii wa bashorii wa mukh-khii wa azhmii wa ashobii wa mastaqolla bihi qodamii.",
    translation: {
      en: "O Allah, for You I have bowed, in You I have believed, to You I have submitted. My hearing, sight, brain, bones, nerves and what my feet bear – all submit to You.",
      fr: "Ô Allah, pour Toi je me suis incliné, en Toi j'ai cru, à Toi je me suis soumis. Mon ouïe, ma vue, mon cerveau, mes os, mes nerfs et ce que portent mes pieds – tout se soumet à Toi.",
      de: "O Allah für Dich habe ich mich verneigt in Dir habe ich geglaubt Dir habe ich mich ergeben. Mein Gehör Sehvermögen Gehirn Knochen Nerven und was meine Füße tragen – alles unterwirft sich Dir." },
    benefit: {
      en: "A comprehensive ruku dua – the entire body submits: hearing, sight, brain, bones, nerves, feet. Complete surrender of body and soul in the ruku position.",
      fr: "Un dua du ruku complet – le corps entier se soumet : ouïe, vue, cerveau, os, nerfs, pieds. Reddition complète du corps et de l'âme en position de ruku.",
      de: "Ein umfassendes Ruku-Dua – der gesamte Körper unterwirft sich: Gehör Sehvermögen Gehirn Knochen Nerven Füße. Vollständige Hingabe von Körper und Seele in der Ruku-Position." },
    source: ["Sahih Muslim 1/534", "The four Sunan collectors", "Ahmad"] },

  { id: 421, catId: "ruku", type: "dua", order: 7,
    title: { en: "Ruku dua 7 – You are my Lord, to Allah Lord of the worlds (extended)", fr: "Dua du Ruku 7 – Tu es mon Seigneur, à Allah Seigneur des mondes (étendu)", de: "Ruku Dua 7 – Du bist mein Herr Allah dem Herrn der Welten (erweitert)" },
    arabic: "اَللَّهُمَّ لَكَ رَكَعْتُ وَبِكَ آمَنْتُ وَلَكَ أَسْلَمْتُ أَنْتَ رَبِّيْ خَشَعَ سَمْعِيْ وَبَصَرِيْ وَمُخِّيْ وَعَظَمِيْ وَعَصَبِيْ وَمَا اسْتَقَلَّتْ بِهِ قَدَمِيْ لِلَّهِ رَبِّ الْعَالَمِيْنَ",
    transliteration: "Allaahumma laka roka-tu wa bika aamantu wa laka aslamtu anta robbii khosya-a sam-ii wa bashorii wa mukh-khii wa azhoii wa ashobii wa mastaqollat bihi qodamii lillaahi robbil aalamiin.",
    translation: {
      en: "O Allah, for You I have bowed, in You I have believed, to You I have submitted – You are my Lord. My hearing, sight, brain, bones, nerves and what my feet bear submit to Allah, Lord of the worlds.",
      fr: "Ô Allah, pour Toi je me suis incliné, en Toi j'ai cru, à Toi je me suis soumis – Tu es mon Seigneur. Mon ouïe, ma vue, mon cerveau, mes os, mes nerfs et ce que portent mes pieds se soumettent à Allah Seigneur des mondes.",
      de: "O Allah für Dich habe ich mich verneigt in Dir habe ich geglaubt Dir habe ich mich ergeben – Du bist mein Herr. Mein Gehör Sehvermögen Gehirn Knochen Nerven und was meine Füße tragen unterwerfen sich Allah dem Herrn der Welten." },
    benefit: {
      en: "Extended version of dua 6 – adds You are my Lord and ends with to Allah Lord of the worlds instead of just to You. Authenticated by scholars above the standard of Muslim.",
      fr: "Version étendue du dua 6 – ajoute Tu es mon Seigneur et se termine par à Allah Seigneur des mondes.",
      de: "Erweiterte Version von Dua 6 – fügt Du bist mein Herr hinzu und endet mit Allah dem Herrn der Welten." },
    source: ["At-Tahawi", "Ad-Daraquthni", "Al-Baihaqi", "Ahmad 1/119", "Sahih"] },

  { id: 422, catId: "ruku", type: "dua", order: 8,
    title: { en: "Ruku dua 8 – including blood and flesh, with tawakkul", fr: "Dua du Ruku 8 – incluant sang et chair, avec tawakkul", de: "Ruku Dua 8 – einschließlich Blut und Fleisch mit Tawakkul" },
    arabic: "اَللَّهُمَّ لَكَ رَكَعْتُ وَبِكَ آمَنْتُ وَلَكَ أَسْلَمْتُ وَعَلَيْكَ تَوَكَّلْتُ أَنْتَ رَبِّيْ خَشَعَ سَمْعِيْ وَبَصَرِيْ وَدَمِيْ وَلَحْمِيْ وَعَظَمِيْ وَعَصَبِيْ لِلَّهِ رَبِّ الْعَالَمِيْنَ",
    transliteration: "Allaahumma laka roka-tu wa bika aamantu wa laka aslamtu wa alaika tawakkaltu anta robbii khosya-a sam-ii wa bashorii wa damii wa lahmii wa azhoii wa ashobii lillaahi robbil aalamiin.",
    translation: {
      en: "O Allah, for You I have bowed, in You I have believed, to You I have submitted, and upon You I have relied – You are my Lord. My hearing, sight, blood, flesh, bones and nerves submit to Allah, Lord of the worlds.",
      fr: "Ô Allah, pour Toi je me suis incliné, en Toi j'ai cru, à Toi je me suis soumis, et sur Toi je me suis fié – Tu es mon Seigneur. Mon ouïe, ma vue, mon sang, ma chair, mes os et mes nerfs se soumettent à Allah Seigneur des mondes.",
      de: "O Allah für Dich habe ich mich verneigt in Dir habe ich geglaubt Dir habe ich mich ergeben und auf Dir habe ich vertraut – Du bist mein Herr. Mein Gehör Sehvermögen Blut Fleisch Knochen und Nerven unterwerfen sich Allah dem Herrn der Welten." },
    benefit: {
      en: "The most complete ruku dua – adds tawakkul (reliance) to the declaration, and includes blood and flesh alongside the other body parts. From the hadith of Jabir bin Abdillah.",
      fr: "Le dua du ruku le plus complet – ajoute le tawakkul à la déclaration et inclut sang et chair aux autres parties du corps.",
      de: "Das vollständigste Ruku-Dua – fügt Tawakkul zur Erklärung hinzu und schließt Blut und Fleisch neben den anderen Körperteilen ein." },
    source: ["An-Nasai 1051", "Sahih An-Nasai"] },

  // ── CATEGORY: RISING FROM RUKU & I'TIDAL ──
  { id: 423, catId: "itidal", type: "dua", order: 1,
    title: { en: "When rising from Ruku – Sami Allahu liman hamidah", fr: "En se redressant du Ruku – Sami Allahu liman hamidah", de: "Beim Aufstehen vom Ruku – Sami Allahu liman hamidah" },
    arabic: "سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ",
    transliteration: "Sami-allaahu liman hamidah.",
    translation: {
      en: "Allah hears whoever praises Him.",
      fr: "Allah entend celui qui Le loue.",
      de: "Allah hört denjenigen der Ihn lobt." },
    benefit: {
      en: "Said by the imam and the praying person alone when rising from ruku. The congregation responds with Rabbana wa lakal hamd. This is the transition dua between ruku and the standing position (i'tidal).",
      fr: "Dit par l'imam et celui qui prie seul en se relevant du ruku. La congrégation répond par Rabbana wa lakal hamd. C'est la dua de transition entre le ruku et la position debout.",
      de: "Vom Imam und dem Alleinbetenden beim Aufstehen vom Ruku gesagt. Die Gemeinde antwortet mit Rabbana wa lakal hamd. Dies ist das Übergangs-Dua zwischen Ruku und der stehenden Position." },
    source: ["Sahih Bukhari 2/282"] },

  { id: 424, catId: "itidal", type: "dua", order: 2,
    title: { en: "I'tidal 1 – Rabbana wa lakal hamd (with waw)", fr: "I'tidal 1 – Rabbana wa lakal hamd (avec waw)", de: "I'tidal 1 – Rabbana wa lakal hamd (mit Waw)" },
    arabic: "رَبَّنَا وَلَكَ الْحَمْدُ",
    transliteration: "Robbanaa wa lakal hamdu.",
    translation: {
      en: "Our Lord, and to You belongs all praise.",
      fr: "Notre Seigneur, et à Toi toute louange.",
      de: "Unser Herr und Dir gehört aller Lob." },
    benefit: {
      en: "The most common i'tidal dua. The waw (and) at the beginning connects it to Sami Allahu liman hamidah. Both with and without waw are authentic and can be alternated.",
      fr: "La dua i'tidal la plus courante. Le waw du début la connecte à Sami Allahu liman hamidah. Avec et sans waw sont authentiques.",
      de: "Das häufigste I'tidal-Dua. Das Waw am Anfang verbindet es mit Sami Allahu liman hamidah. Beide mit und ohne Waw sind authentisch." },
    source: ["Sahih Bukhari 732", "Sahih Muslim 866"] },

  { id: 425, catId: "itidal", type: "dua", order: 3,
    title: { en: "I'tidal 2 – Rabbana lakal hamd (without waw)", fr: "I'tidal 2 – Rabbana lakal hamd (sans waw)", de: "I'tidal 2 – Rabbana lakal hamd (ohne Waw)" },
    arabic: "رَبَّنَا لَكَ الْحَمْدُ",
    transliteration: "Robbanaa lakal hamdu.",
    translation: {
      en: "Our Lord, to You belongs all praise.",
      fr: "Notre Seigneur, à Toi toute louange.",
      de: "Unser Herr Dir gehört aller Lob." },
    benefit: {
      en: "Variant without the waw. Imam An-Nawawi: both with and without waw are permitted without one being preferred over the other. It is recommended to alternate between all variants to keep the heart present.",
      fr: "Variante sans le waw. L'imam An-Nawawi : les deux avec et sans waw sont permis sans qu'aucun ne soit préféré. Il est recommandé d'alterner entre toutes les variantes.",
      de: "Variante ohne das Waw. Imam An-Nawawi: Beide mit und ohne Waw sind erlaubt ohne dass eines bevorzugt wird. Es wird empfohlen zwischen allen Varianten zu wechseln." },
    source: ["Sahih Bukhari 789"] },

  { id: 426, catId: "itidal", type: "dua", order: 4,
    title: { en: "I'tidal 3 – Allahumma Rabbana wa lakal hamd (with Allahumma)", fr: "I'tidal 3 – Allahumma Rabbana wa lakal hamd (avec Allahumma)", de: "I'tidal 3 – Allahumma Rabbana wa lakal hamd (mit Allahumma)" },
    arabic: "اَللَّهُمَّ رَبَّنَا وَلَكَ الْحَمْدُ",
    transliteration: "Allaahumma robbanaa wa lakal hamdu.",
    translation: {
      en: "O Allah our Lord, and to You belongs all praise.",
      fr: "Ô Allah notre Seigneur, et à Toi toute louange.",
      de: "O Allah unser Herr und Dir gehört aller Lob." },
    benefit: {
      en: "Adds Allahumma at the beginning. The Prophet alternated between different forms of this dua. Varying between them is Sunnah and keeps the heart engaged.",
      fr: "Ajoute Allahumma au début. Le Prophète alternait entre différentes formes de ce dua. Varier entre elles est Sunna.",
      de: "Fügt Allahumma am Anfang hinzu. Der Prophet wechselte zwischen verschiedenen Formen dieses Duas. Abwechseln zwischen ihnen ist Sunnah." },
    source: ["Sahih Bukhari 795"] },

  { id: 427, catId: "itidal", type: "dua", order: 5,
    title: { en: "I'tidal 4 – Allahumma Rabbana lakal hamd (without waw)", fr: "I'tidal 4 – Allahumma Rabbana lakal hamd (sans waw)", de: "I'tidal 4 – Allahumma Rabbana lakal hamd (ohne Waw)" },
    arabic: "اَللَّهُمَّ رَبَّنَا لَكَ الْحَمْدُ",
    transliteration: "Allaahumma robbanaa lakal hamdu.",
    translation: {
      en: "O Allah our Lord, to You belongs all praise.",
      fr: "Ô Allah notre Seigneur, à Toi toute louange.",
      de: "O Allah unser Herr Dir gehört aller Lob." },
    benefit: {
      en: "Fourth variant – Allahumma without waw. Three benefits of alternating: 1) Preserving the Sunnah. 2) Following the Sunnah. 3) Keeping the heart present and attentive.",
      fr: "Quatrième variante – Allahumma sans waw. Trois avantages d'alterner : 1) Préserver la Sunna. 2) Suivre la Sunna. 3) Garder le coeur présent et attentif.",
      de: "Vierte Variante – Allahumma ohne Waw. Drei Vorteile des Abwechselns: 1) Sunnah bewahren. 2) Sunnah befolgen. 3) Herz präsent und aufmerksam halten." },
    source: ["Sahih Muslim 902"] },

  { id: 428, catId: "itidal", type: "dua", order: 6,
    title: { en: "I'tidal 5 – Filling the heavens and earth addition", fr: "I'tidal 5 – Ajout de remplissant les cieux et la terre", de: "I'tidal 5 – Erweiterung füllend Himmel und Erde" },
    arabic: "مِلْءَ السَّمَاوَاتِ وَمِلْءَ الْأَرْضِ وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ",
    transliteration: "Mil-as-samaawaati wa mil-al ardhi, wa mil-a maa syi-ta min syai-in ba-du.",
    translation: {
      en: "Filling the heavens and filling the earth and filling whatever You will of things beyond.",
      fr: "Remplissant les cieux et remplissant la terre et remplissant ce que Tu veux des choses au-delà.",
      de: "Füllend die Himmel und füllend die Erde und füllend was Du willst von den Dingen darüber hinaus." },
    benefit: {
      en: "Said after one of I'tidal variants 1-4. This addition expresses the immensity of the praise – filling all of creation. The Prophet sometimes added this extension.",
      fr: "Dit après l'une des variantes I'tidal 1-4. Cet ajout exprime l'immensité de la louange – remplissant toute la création.",
