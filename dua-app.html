      fr: "Je me contente d'Allah comme mon Seigneur, de l'Islam comme ma religion, et de Muhammad (paix sur lui) comme mon Prophète. (3 fois)",
      de: "Ich bin zufrieden mit Allah als meinem Herrn mit dem Islam als meiner Religion und mit Muhammad (Friede sei auf ihm) als meinem Propheten. (3 Mal)" },
    benefit: {
      en: "Whoever says this 3 times morning and evening – Allah has an obligation to make them content on the Day of Judgment. Three declarations of faith: in Allah as Lord, Islam as way of life, Muhammad as the final Prophet.",
      fr: "Quiconque dit cela 3 fois matin et soir – Allah a l'obligation de le satisfaire au Jour du Jugement.",
      de: "Wer dies 3-mal morgens und abends sagt – Allah hat die Pflicht ihn am Tag des Gerichts zufrieden zu stellen." },
    source: ["Ahmad 4/337", "An-Nasai Amal Al-Yawm 4", "Abu Dawud 4/418", "Hasan Ibn Baz"] },

  { id: 513, catId: "morning_dhikr", type: "dua", order: 14,
    title: { en: "O Ever-Living O Self-Sustaining – by Your mercy I seek help, rectify all my affairs", fr: "Ô Vivant Ô Subsistant – par Ta miséricorde je cherche de l'aide, rectifie toutes mes affaires", de: "O Ewig Lebender O Beständiger – durch Deine Barmherzigkeit suche ich Hilfe richte alle meine Angelegenheiten" },
    arabic: "يَا حَيُّ يَا قَيُّوْمُ بِرَحْمَتِكَ أَسْتَغِيْثُ أَصْلِحْ لِيْ شَأْنِيْ كُلَّهُ وَلاَ تَكِلْنِيْ إِلَى نَفْسِيْ طَرْفَةَ عَيْنٍ",
    transliteration: "Yaa hayyu yaa qoyyuum birohmatika astaghiits ashlih lii sya-nii kullah wa laa takilnii ilaa nafsii thorfata ain.",
    translation: {
      en: "O Ever-Living O Self-Sustaining, by Your mercy I seek relief. Rectify all my affairs and do not leave me to myself even for the blink of an eye.",
      fr: "Ô Vivant Ô Subsistant, par Ta miséricorde je cherche du secours. Rectifie toutes mes affaires et ne me laisse pas à moi-même ne serait-ce qu'un clin d'oeil.",
      de: "O Ewig Lebender O Beständiger durch Deine Barmherzigkeit suche ich Hilfe. Richte alle meine Angelegenheiten und lass mich nicht mir selbst überlassen auch nicht für den Bruchteil eines Augenblicks." },
    benefit: {
      en: "The Prophet advised Fatimah to say this morning and evening. Al-Hayy (Ever-Living) and Al-Qayyum (Self-Sustaining) are two of the greatest names of Allah. Do not leave me to myself for a blink of an eye – acknowledging total dependence on Allah.",
      fr: "Le Prophète conseilla à Fatimah de dire cela matin et soir. Al-Hayy et Al-Qayyum sont deux des plus grands noms d'Allah.",
      de: "Der Prophet riet Fatimah dies morgens und abends zu sagen. Al-Hayy und Al-Qayyum sind zwei der größten Namen Allahs." },
    source: ["An-Nasai Al-Kubra", "Al-Hakim Al-Mustadrak", "Al-Baihaqi", "Sahih Al-Albani 227"] },

  { id: 514, catId: "morning_dhikr", type: "dua", order: 15,
    title: { en: "We are upon the fitrah of Islam, word of sincerity, religion of our Prophet and Ibrahim", fr: "Nous sommes sur la fitrah de l'Islam, la parole de sincérité, la religion de notre Prophète et Ibrahim", de: "Wir sind auf der Fitrah des Islam dem Wort der Aufrichtigkeit der Religion unseres Propheten und Ibrahim" },
    arabic: "أَصْبَحْنَا عَلَى فِطْرَةِ اْلإِسْلاَمِ وَعَلَى كَلِمَةِ اْلإِخْلاَصِ وَعَلَى دِيْنِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَعَلَى مِلَّةِ أَبِيْنَا إِبْرَاهِيْمَ حَنِيْفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِيْنَ",
    transliteration: "Ash-bahnaa alaa fithrotil islaam wa alaa kalimatil ikhlaash wa alaa diini nabiyyinaa muhammadin shollallaahu alaihi wa sallam wa alaa millati abiinaa ibroohiim haniifan musliman wa maa kaana minal musyrikiin.",
    translation: {
      en: "We have entered the morning upon the natural disposition of Islam, upon the word of sincerity, upon the religion of our Prophet Muhammad and upon the way of our father Ibrahim – upright as a Muslim and not among the polytheists.",
      fr: "Nous avons accueilli le matin sur la fitrah de l'Islam, sur la parole de sincérité, sur la religion de notre Prophète Muhammad et sur la voie de notre père Ibrahim – droit en tant que musulman et non parmi les polythéistes.",
      de: "Wir haben den Morgen begrüßt auf der Fitrah des Islam auf dem Wort der Aufrichtigkeit auf der Religion unseres Propheten Muhammad und auf dem Weg unseres Vaters Ibrahim – aufrecht als Muslim und nicht unter den Polytheisten." },
    benefit: {
      en: "Renewing faith at the start of every day. The word of sincerity refers to the two shahadahs. The natural disposition (fitrah) of Islam is the true religion. Following both Muhammad and Ibrahim affirms the unbroken chain of monotheism.",
      fr: "Renouveler la foi au début de chaque jour. La parole de sincérité fait référence aux deux shahadahs.",
      de: "Den Glauben zu Beginn eines jeden Tages erneuern. Das Wort der Aufrichtigkeit bezieht sich auf die beiden Schahadas." },
    source: ["Ahmad 3/406-407", "Ahmad 5/123", "Sahih Al-Jami 4/290", "Ibn Al-Sunni 34"] },

  { id: 515, catId: "morning_dhikr", type: "dua", order: 16,
    title: { en: "La ilaha illallah wahdahu – 10x morning (or 1x if lazy) – protection from Shaytan all day", fr: "La ilaha illallah wahdahu – 10x le matin (ou 1x si paresseux) – protection de Shaytan toute la journée", de: "La ilaha illallah wahdahu – 10x morgens (oder 1x wenn faul) – Schutz vor Shaytan den ganzen Tag" },
    arabic: "لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيْكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ",
    transliteration: "Laa ilaaha illallaah wahdahu laa syariika lah lahul mulku wa lahul hamdu wa huwa alaa kulli syai-in qodiir. (10x or 1x)",
    translation: {
      en: "There is no deity except Allah alone without partner. To Him belongs the dominion and all praise. And He is over all things capable. (10 times in the morning, or 1 time if lazy)",
      fr: "Il n'y a pas de divinité sauf Allah seul sans associé. À Lui le règne et toute louange. Il est sur toute chose Puissant. (10 fois le matin, ou 1 fois si paresseux)",
      de: "Es gibt keine Gottheit außer Allah allein ohne Partner. Ihm gehört die Herrschaft und aller Lob. Er ist über alle Dinge mächtig. (10-mal morgens oder 1-mal wenn faul)" },
    benefit: {
      en: "Said 1x: equivalent to freeing a slave from descendants of Ismail, 10 good deeds recorded, 10 sins erased, rank raised 10 degrees, protected from Shaytan until evening. Said 10x: equivalent to freeing 4 slaves, 10 good deeds, 10 sins erased, rank raised 10 degrees, protected until evening.",
      fr: "Dit 1x: équivalent à libérer un esclave des descendants d'Ismail, 10 bonnes actions, 10 péchés effacés, rang élevé de 10 degrés, protégé de Shaytan jusqu'au soir. Dit 10x: équivalent à libérer 4 esclaves.",
      de: "1-mal gesagt: entspricht der Befreiung eines Sklaven aus den Nachkommen Ismaels 10 gute Taten 10 Sünden getilgt Rang um 10 Stufen erhöht vor Shaytan bis zum Abend geschützt. 10-mal gesagt: entspricht 4 Sklaven." },
    source: ["Abu Dawud 4/319", "Ibn Majah", "Ahmad 4/60", "Sahih Al-Albani"] },

  { id: 516, catId: "morning_dhikr", type: "dua", order: 17,
    title: { en: "La ilaha illallah wahdahu – 100x in a day – best reward on Day of Judgment", fr: "La ilaha illallah wahdahu – 100x par jour – meilleure récompense au Jour du Jugement", de: "La ilaha illallah wahdahu – 100x am Tag – beste Belohnung am Tag des Gerichts" },
    arabic: "لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيْكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ",
    transliteration: "Laa ilaaha illallaah wahdahu laa syariika lah lahul mulku wa lahul hamdu wa huwa alaa kulli syai-in qodiir. (100x)",
    translation: {
      en: "There is no deity except Allah alone without partner. To Him belongs the dominion and all praise. And He is over all things capable. (100 times per day)",
      fr: "Il n'y a pas de divinité sauf Allah seul sans associé. À Lui le règne et toute louange. Il est sur toute chose Puissant. (100 fois par jour)",
      de: "Es gibt keine Gottheit außer Allah allein ohne Partner. Ihm gehört die Herrschaft und aller Lob. Er ist über alle Dinge mächtig. (100-mal pro Tag)" },
    benefit: {
      en: "Whoever says this 100 times in a day: equivalent to freeing 10 slaves, 100 good deeds recorded, 100 sins erased, protected from Shaytan all day, and no one on the Day of Judgment will bring better reward – unless they said it more.",
      fr: "Quiconque dit cela 100 fois par jour: équivalent à libérer 10 esclaves, 100 bonnes actions, 100 péchés effacés, protégé de Shaytan toute la journée.",
      de: "Wer dies 100-mal am Tag sagt: entspricht der Befreiung von 10 Sklaven 100 gute Taten 100 Sünden getilgt vor Shaytan den ganzen Tag geschützt." },
    source: ["Sahih Bukhari 4/95", "Sahih Muslim 4/2071"] },

  { id: 517, catId: "morning_dhikr", type: "dua", order: 18,
    title: { en: "Subhanallah wa bihamdih – as numerous as His creation, pleasing to Him – 3x", fr: "Subhanallah wa bihamdih – aussi nombreux que Sa création, à Sa satisfaction – 3x", de: "Subhanallah wa bihamdih – so zahlreich wie Seine Schöpfung zu Seiner Zufriedenheit – 3x" },
    arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ وَرِضَا نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ",
    transliteration: "Subhaanallaahi wa bihamdihi adada kholqih wa ridhoo nafsih wa zinata arsyih wa midaada kalimaatih. (3x)",
    translation: {
      en: "Glory be to Allah and all praise is His – as numerous as His creation, to the extent of His pleasure, as heavy as His Throne, and as plentiful as the ink of His words. (3 times)",
      fr: "Gloire à Allah et toute louange Lui appartient – aussi nombreux que Sa création, à la mesure de Sa satisfaction, aussi lourd que Son Trône, aussi abondant que l'encre de Ses paroles. (3 fois)",
      de: "Gepriesen sei Allah und aller Lob gehört Ihm – so zahlreich wie Seine Schöpfung zu Seiner Zufriedenheit so schwer wie Sein Thron und so reichlich wie die Tinte Seiner Worte. (3 Mal)" },
    benefit: {
      en: "The Prophet found Juwairiyah still in her prayer place at Duha time and said: I said 4 phrases 3 times that would outweigh all the dhikr you have been doing since Fajr – then he taught her this. The most weighty dhikr per word in Islam.",
      fr: "Le Prophète trouva Juwairiyah encore en prière à l'heure du Duha et dit : J'ai dit 4 phrases 3 fois qui surpasseraient tout le dhikr que tu as fait depuis Fajr.",
      de: "Der Prophet fand Juwairiyah noch beim Gebet zur Duha-Zeit und sagte: Ich habe 4 Phrasen 3-mal gesagt die den ganzen Dhikr den du seit Fajr getan hast überwiegen würden." },
    source: ["Sahih Muslim 2726"] },

  { id: 518, catId: "morning_dhikr", type: "dua", order: 19,
    title: { en: "O Allah I ask for beneficial knowledge good provision and accepted deeds – after Fajr", fr: "Ô Allah je demande une connaissance utile bonne provision et actes acceptés – après Fajr", de: "O Allah ich bitte um nützliches Wissen gute Versorgung angenommene Taten – nach Fajr" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلاً مُتَقَبَّلاً",
    transliteration: "Allaahumma innii as-aluka ilman naafi-an wa rizqon thoyyiban wa amalan mutaqobbalan.",
    translation: {
      en: "O Allah I ask You for beneficial knowledge, good and lawful provision, and accepted deeds.",
      fr: "Ô Allah je Te demande une connaissance utile, une provision bonne et licite, et des actes acceptés.",
      de: "O Allah ich bitte Dich um nützliches Wissen gute und rechtmäßige Versorgung und angenommene Taten." },
    benefit: {
      en: "Umm Salamah narrated that the Prophet said this after the salam of Fajr prayer every morning. Three keys for a Muslim's day: knowledge to guide decisions, provision to sustain life, and deeds that are accepted by Allah.",
      fr: "Umm Salamah rapporta que le Prophète disait cela après le salam du Fajr chaque matin. Trois clés pour la journée d'un musulman.",
      de: "Umm Salamah berichtete dass der Prophet dies jeden Morgen nach dem Salam des Fajr sagte. Drei Schlüssel für den Tag eines Muslims." },
    source: ["Ibn Al-Sunni Amal Al-Yawm 54", "Ibn Majah 925", "Hasan Al-Arnaouth"] },

  { id: 519, catId: "morning_dhikr", type: "dua", order: 20,
    title: { en: "Subhanallah wa bihamdih – 100x morning and evening – greatest reward", fr: "Subhanallah wa bihamdih – 100x matin et soir – plus grande récompense", de: "Subhanallah wa bihamdih – 100x morgens und abends – größte Belohnung" },
    arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",
    transliteration: "Subhaanallaahi wa bihamdih. (100x)",
    translation: {
      en: "Glory be to Allah and all praise is His. (100 times)",
      fr: "Gloire à Allah et toute louange Lui appartient. (100 fois)",
      de: "Gepriesen sei Allah und aller Lob gehört Ihm. (100 Mal)" },
    benefit: {
      en: "Whoever says this 100 times morning and evening – no one on the Day of Judgment will bring better reward except someone who said the same or more. Also: whoever says it 100 times in a day sins are erased even if as much as the foam of the sea.",
      fr: "Quiconque dit cela 100 fois matin et soir – nul au Jour du Jugement ne viendra avec une meilleure récompense sauf quelqu'un qui a dit pareil ou plus.",
      de: "Wer dies 100-mal morgens und abends sagt – niemand am Tag des Gerichts wird eine bessere Belohnung bringen außer jemand der dasselbe oder mehr gesagt hat." },
    source: ["Sahih Muslim 2692", "Sahih Bukhari 6405", "Sahih Muslim 484"] },

  { id: 520, catId: "morning_dhikr", type: "dua", order: 21,
    title: { en: "Astaghfirullah wa atubu ilayh – 100x per day – the Prophet's own practice", fr: "Astaghfirullah wa atubu ilayh – 100x par jour – la pratique propre du Prophète", de: "Astaghfirullah wa atubu ilayh – 100x am Tag – die eigene Praxis des Propheten" },
    arabic: "أَسْتَغْفِرُ اللَّهَ وَأَتُوْبُ إِلَيْهِ",
    transliteration: "Astaghfirullaaha wa atuubu ilaih. (100x)",
    translation: {
      en: "I seek Allah's forgiveness and repent to Him. (100 times)",
      fr: "Je demande pardon à Allah et me repens à Lui. (100 fois)",
      de: "Ich bitte Allah um Vergebung und wende mich reuig an Ihn. (100 Mal)" },
    benefit: {
      en: "The Prophet himself said: O people repent to Allah! I repent to Him 100 times a day. The Prophet was protected from sin yet repented constantly to teach his Ummah. The shortest and most comprehensive form of tawbah.",
      fr: "Le Prophète lui-même dit : Ô gens repentez-vous à Allah ! Je me repens à Lui 100 fois par jour. Le Prophète était protégé du péché mais se repentait constamment pour enseigner à sa communauté.",
      de: "Der Prophet selbst sagte: O Menschen bereut zu Allah! Ich bereue zu Ihm 100-mal am Tag. Der Prophet war vor Sünden geschützt aber bereute ständig um seine Ummah zu lehren." },
    source: ["Sahih Bukhari 11/101", "Sahih Muslim 4/2075"] },

  // ── CATEGORY: EVENING DHIKR ──
  { id: 521, catId: "evening_dhikr", type: "dua", order: 1,
    title: { en: "Ta'awudz – seeking refuge from Shaytan", fr: "Ta'awudz – chercher refuge contre Shaytan", de: "Ta'awudz – Zuflucht vor Shaytan suchen" },
    arabic: "أَعُوْذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيْمِ",
    transliteration: "A-uudzu billaahi minasy-syaithoonir-rojiim.",
    translation: {
      en: "I seek refuge in Allah from the accursed Shaytan.",
      fr: "Je cherche refuge auprès d'Allah contre le Shaytan maudit.",
      de: "Ich suche Zuflucht bei Allah vor dem verfluchten Shaytan." },
    benefit: {
      en: "The evening dhikr also begins with seeking refuge from Shaytan before reciting Quran and other remembrances. The evening is a time when Shaytan and his forces are especially active.",
      fr: "Le dhikr du soir commence aussi par chercher refuge contre Shaytan avant de réciter le Coran et autres invocations.",
      de: "Der Abend-Dhikr beginnt ebenfalls damit Zuflucht vor Shaytan zu suchen bevor man den Quran und andere Erinnerungen rezitiert." },
    source: ["Hisnul Muslim"] },

  { id: 522, catId: "evening_dhikr", type: "dua", order: 2,
    title: { en: "Ayat Al-Kursi – protected from jinn until morning", fr: "Ayat Al-Kursi – protégé des djinns jusqu'au matin", de: "Ayat Al-Kursi – vor Dschinn bis zum Morgen geschützt" },
    arabic: "اللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ الْحَىُّ الْقَيُّومُ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ لَّهُۥ مَا فِى السَّمَاوَاتِ وَمَا فِى الْأَرْضِ مَن ذَا الَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُۥ حِفْظُهُمَا وَهُوَ الْعَلِىُّ الْعَظِيمُ",
    transliteration: "Allaahu laa ilaaha illaa huwal hayyul qayyuum. Laa ta-khudhuhu sinatun wa laa naum. Lahu maa fis-samaawaati wa maa fil ardh. Man dzal ladzii yasyfa-u indahu illaa bi-idznih. Ya-lamu maa baina aydiihim wa maa khalfahum. Wa laa yuhiithuuna bisyai-in min ilmihi illaa bimaa syaa-a. Wasi-a kursiyyuhus-samaawaati wal ardh. Wa laa ya-uuduhu hifdhuhumaa. Wa huwal aliyyul azhiim.",
    translation: {
      en: "Allah – there is no deity except Him the Ever-Living the Sustainer. Neither drowsiness nor sleep overtakes Him. To Him belongs what is in the heavens and earth. Who can intercede except by His permission? He knows what is before and behind them. They encompass nothing of His knowledge except what He wills. His Kursi extends over the heavens and earth. He is the Most High the Most Great. (Al-Baqarah 2:255)",
      fr: "Allah – pas de divinité sauf Lui le Vivant le Subsistant. Ni somnolence ni sommeil ne Le saisissent. Son Trône s'étend sur les cieux et la terre. Il est le Très-Haut le Très-Grand. (Al-Baqarah 2:255)",
      de: "Allah – keine Gottheit außer Ihm dem Ewig Lebenden dem Beständigen. Kein Schlummer kein Schlaf überkommt Ihn. Sein Thron erstreckt sich über Himmel und Erde. Er ist der Allerhöchste der Allergrößte. (Al-Baqarah 2:255)" },
    benefit: {
      en: "Whoever recites this in the evening is protected from jinn until the morning. The same dua said in the morning protects until evening. Confirmed by a jinn to the companion Ubay ibn Ka'ab.",
      fr: "Quiconque le récite le soir est protégé des djinns jusqu'au matin.",
      de: "Wer dies abends rezitiert ist bis zum Morgen vor Dschinn geschützt." },
    source: ["Al-Hakim 1/562", "Sahih At-Targhib 1/273", "An-Nasai", "At-Tabarani"] },

  { id: 523, catId: "evening_dhikr", type: "dua", order: 3,
    title: { en: "Surah Al-Ikhlas 3x – evening", fr: "Sourate Al-Ikhlas 3x – soir", de: "Sure Al-Ikhlas 3x – Abend" },
    arabic: "بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ قُلْ هُوَ اللَّهُ أَحَدٌ اللَّهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ",
    transliteration: "Bismillaahir-rahmaanir-rahiim. Qul huwallaahu ahad. Allaahus-somad. Lam yalid wa lam yuulad. Wa lam yakun lahu kufuwan ahad. (3x)",
    translation: {
      en: "In the name of Allah. Say: He is Allah the One. Allah the Eternal Refuge. He neither begets nor was begotten. And there is none comparable to Him. (Al-Ikhlas 112:1-4) – 3 times",
      fr: "Au nom d'Allah. Dis : Il est Allah l'Unique. Allah l'Éternel Refuge. Il n'a pas engendré et n'a pas été engendré. Nul ne Lui est comparable. (3 fois)",
      de: "Im Namen Allahs. Sag: Er ist Allah der Eine. Allah der Ewige. Er hat nicht gezeugt und ist nicht gezeugt worden. Niemand ist Ihm gleich. (3 Mal)" },
    benefit: {
      en: "Said 3 times morning and evening – sufficient protection from everything. Together with Al-Falaq and An-Nas these three surahs form complete spiritual protection for the believer's day and night.",
      fr: "Dite 3 fois matin et soir – protection suffisante contre tout. Avec Al-Falaq et An-Nas ces trois sourates forment une protection spirituelle complète.",
      de: "3-mal morgens und abends gesagt – ausreichender Schutz vor allem. Zusammen mit Al-Falaq und An-Nas bilden diese drei Suren vollständigen spirituellen Schutz." },
    source: ["Abu Dawud 4/322", "At-Tirmidhi 5/567", "Sahih At-Tirmidhi 3/182"] },

  { id: 524, catId: "evening_dhikr", type: "dua", order: 4,
    title: { en: "Surah Al-Falaq 3x – evening", fr: "Sourate Al-Falaq 3x – soir", de: "Sure Al-Falaq 3x – Abend" },
    arabic: "بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ النَّفَّاثَاتِ فِى الْعُقَدِ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",
    transliteration: "Bismillaahir-rahmaanir-rahiim. Qul a-uudzu birobbil falaq. Min syarri maa kholaq. Wa min syarri ghoo-siqin idzaa waqob. Wa min syarrin-naffaatsaati fil uqod. Wa min syarri haasidin idzaa hasad. (3x)",
    translation: {
      en: "In the name of Allah. Say: I seek refuge with the Lord of the daybreak – from the evil of what He created, the evil of darkness, the evil of the blowers in knots, the evil of an envier. (Al-Falaq 113:1-5) – 3 times",
      fr: "Au nom d'Allah. Dis : Je cherche refuge auprès du Seigneur de l'aube – contre le mal de Sa création, l'obscurité, les souffleuses, l'envieux. (3 fois)",
      de: "Im Namen Allahs. Sag: Ich suche Zuflucht beim Herrn des Morgengrauens – vor dem Bösen seiner Schöpfung Dunkelheit Bläserinnen Neider. (3 Mal)" },
    benefit: {
      en: "The evening is particularly a time for protection from darkness and its evils. Al-Falaq specifically mentions the evil of darkness when it settles – making it especially relevant for the evening dhikr.",
      fr: "Le soir est particulièrement un moment de protection contre l'obscurité et ses maux. Al-Falaq mentionne spécifiquement le mal de l'obscurité quand elle s'installe.",
      de: "Der Abend ist besonders eine Zeit für Schutz vor Dunkelheit und ihren Übeln. Al-Falaq erwähnt speziell das Böse der Dunkelheit wenn sie hereinbricht." },
    source: ["Abu Dawud 4/322", "At-Tirmidhi 5/567", "Sahih At-Tirmidhi 3/182"] },

  { id: 525, catId: "evening_dhikr", type: "dua", order: 5,
    title: { en: "Surah An-Nas 3x – evening", fr: "Sourate An-Nas 3x – soir", de: "Sure An-Nas 3x – Abend" },
    arabic: "بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ النَّاسِ مَلِكِ النَّاسِ إِلَـٰهِ النَّاسِ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ الَّذِى يُوَسْوِسُ فِى صُدُورِ النَّاسِ مِنَ الْجِنَّةِ وَالنَّاسِ",
    transliteration: "Bismillaahir-rahmaanir-rahiim. Qul a-uudzu birobbin-naas. Malikin-naas. Ilaahin-naas. Min syarril waswaasil khonnaas. Alladzii yuwaswisu fii shuduurin-naas. Minal jinnati wan-naas. (3x)",
    translation: {
      en: "In the name of Allah. Say: I seek refuge with the Lord of mankind – the King of mankind the God of mankind – from the whisperer who whispers in the hearts of mankind from jinn and mankind. (An-Nas 114:1-6) – 3 times",
      fr: "Au nom d'Allah. Dis : Je cherche refuge auprès du Seigneur des hommes – le Roi des hommes le Dieu des hommes – contre le tentateur furtif qui souffle dans les coeurs des hommes parmi les djinns et les hommes. (3 fois)",
      de: "Im Namen Allahs. Sag: Ich suche Zuflucht beim Herrn der Menschen – dem König dem Gott der Menschen – vor dem Einflüsterer der in die Herzen der Menschen einflüstert aus Dschinn und Menschen. (3 Mal)" },
    benefit: {
      en: "The evening is a prime time for Shaytan's whispers as distractions increase. An-Nas specifically protects from waswas entering the heart. Said 3 times morning and evening – sufficient from everything.",
      fr: "Le soir est le moment principal pour les murmures de Shaytan. An-Nas protège spécifiquement contre le waswas entrant dans le coeur.",
      de: "Der Abend ist eine Hauptzeit für Shaytans Einflüsterungen. An-Nas schützt speziell vor Waswas das ins Herz eindringt." },
    source: ["Abu Dawud 4/322", "At-Tirmidhi 5/567", "Sahih At-Tirmidhi 3/182"] },

  { id: 526, catId: "evening_dhikr", type: "dua", order: 6,
    title: { en: "We have entered the evening – dominion belongs to Allah, seeking good of this night", fr: "Nous avons accueilli le soir – le règne appartient à Allah, demander le bien de cette nuit", de: "Wir haben den Abend begrüßt – die Herrschaft gehört Allah das Gute dieser Nacht erbitten" },
    arabic: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيْكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ رَبِّ أَسْأَلُكَ خَيْرَ مَا فِيْ هَـٰذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا وَأَعُوْذُ بِكَ مِنْ شَرِّ مَا فِيْ هَـٰذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا رَبِّ أَعُوْذُ بِكَ مِنَ الْكَسَلِ وَسُوْءِ الْكِبَرِ رَبِّ أَعُوْذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",
    transliteration: "Amsainaa wa amsal mulku lillaah wal hamdulillaah laa ilaaha illallaah wahdahu laa syariika lah lahul mulku wa lahul hamd wa huwa alaa kulli syai-in qodiir. Robbi as-aluka khoiro maa fii haadzihil-lailati wa khoiro maa ba-dahaa wa a-uudzu bika min syarri maa fii haadzihil-lailati wa syarri maa ba-dahaa. Robbi a-uudzu bika minal kasali wa suu-il kibar. Robbi a-uudzu bika min adzaabin fin-naari wa adzaabin fil qobr.",
    translation: {
      en: "We have entered the evening and the dominion belongs to Allah. All praise to Allah. There is no deity except Allah alone without partner. My Lord I ask You for the good of this night and the good after it. I seek refuge from the evil of this night and the evil after it. My Lord I seek refuge from laziness and the evil of old age. My Lord I seek refuge from punishment in the Fire and the grave.",
      fr: "Nous avons accueilli le soir et le règne appartient à Allah. Mon Seigneur je Te demande le bien de cette nuit et le bien après elle. Je cherche refuge contre le mal de cette nuit et le mal après elle. Contre la paresse et le mal de la vieillesse. Contre le châtiment du Feu et de la tombe.",
      de: "Wir haben den Abend begrüßt und die Herrschaft gehört Allah. Mein Herr ich bitte Dich um das Gute dieser Nacht und das Gute danach. Ich suche Zuflucht vor dem Bösen dieser Nacht und dem Bösen danach. Vor Faulheit dem Bösen des Alters. Vor der Strafe des Feuers und des Grabes." },
    benefit: {
      en: "The evening version of the morning dua. Says amsayna (we entered the evening) instead of asbahnaa. Asks for the good of this night instead of this day. Ibn Masud narrated the Prophet said this every evening.",
      fr: "La version du soir du dua du matin. Dit amsayna au lieu de asbahnaa. Demande le bien de cette nuit au lieu de ce jour.",
      de: "Die Abendversion des Morgen-Duas. Sagt amsayna statt asbahnaa. Bittet um das Gute dieser Nacht statt dieses Tages." },
    source: ["Sahih Muslim 4/2088"] },

  { id: 527, catId: "evening_dhikr", type: "dua", order: 7,
    title: { en: "O Allah by You we enter the evening – and to You is the return", fr: "Ô Allah c'est par Toi que nous entrons dans le soir – et à Toi est le retour", de: "O Allah durch Dich begrüßen wir den Abend – und zu Dir ist die Rückkehr" },
    arabic: "اَللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوْتُ وَإِلَيْكَ الْمَصِيْرُ",
    transliteration: "Allaahumma bika amsainaa wa bika ash-bahnaa wa bika nahyaa wa bika namuutu wa ilaikal mashiir.",
    translation: {
      en: "O Allah, by Your grace we enter the evening and by Your grace we enter the morning. By Your grace we live and by Your will we die. And to You is the return.",
      fr: "Ô Allah, c'est par Ta grâce que nous entrons dans le soir et par Ta grâce dans le matin. C'est par Ta grâce que nous vivons et par Ta volonté que nous mourons. Et c'est vers Toi le retour.",
      de: "O Allah durch Deine Gnade begrüßen wir den Abend und durch Deine Gnade den Morgen. Durch Deine Gnade leben wir und durch Deinen Willen sterben wir. Und zu Dir ist die Rückkehr." },
    benefit: {
      en: "Evening version says bika amsayna (by You we enter the evening) first, then bika asbahnaa. Ends with ilaikal maseer (to You is the return) instead of ilaikal nushur (the resurrection) – the evening reminds of returning to Allah.",
      fr: "La version du soir dit bika amsayna en premier. Se termine par ilaikal maseer (vers Toi le retour) au lieu de ilaikal nushur.",
      de: "Die Abendversion sagt zuerst bika amsayna. Endet mit ilaikal maseer (zu Dir die Rückkehr) statt ilaikal nushur." },
    source: ["At-Tirmidhi 3391", "Sahih Al-Albani"] },

  { id: 528, catId: "evening_dhikr", type: "dua", order: 8,
    title: { en: "Sayyid Al-Istighfar – whoever says it in the evening and dies that night enters Paradise", fr: "Sayyid Al-Istighfar – quiconque le dit le soir et meurt cette nuit entre au Paradis", de: "Sayyid Al-Istighfar – wer es abends sagt und diese Nacht stirbt betritt das Paradies" },
    arabic: "اَللَّهُمَّ أَنْتَ رَبِّيْ لاَ إِلَـٰهَ إِلاَّ أَنْتَ خَلَقْتَنِيْ وَأَنَا عَبْدُكَ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوْذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ أَبُوْءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوْءُ لَكَ بِذَنْبِيْ فَاغْفِرْ لِيْ فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوْبَ إِلاَّ أَنْتَ",
    transliteration: "Allaahumma anta robbii laa ilaaha illaa anta kholaqtanii wa anaa abduka wa anaa alaa ahdika wa wa-dika mas-tatho-tu a-uudzu bika min syarri maa shona-tu abuu-u laka bini-matika alayya wa abuu-u laka bi-dzanbii faghfir lii fa-innahu laa yagh-firudz-dzunuuba illaa anta.",
    translation: {
      en: "O Allah You are my Lord. There is no deity except You. You created me and I am Your servant. I will uphold my covenant and promise to You as best I can. I seek refuge from the evil of what I have done. I acknowledge Your blessing upon me and I acknowledge my sin. So forgive me for none forgives sins except You.",
      fr: "Ô Allah Tu es mon Seigneur. Pas de divinité sauf Toi. Tu m'as créé et je suis Ton serviteur. Je maintiendrai mon pacte envers Toi. Je reconnais Ta bénédiction et je reconnais mon péché. Pardonne-moi car nul ne pardonne sauf Toi.",
      de: "O Allah Du bist mein Herr. Keine Gottheit außer Dir. Du hast mich erschaffen und ich bin Dein Diener. Ich werde meinen Bund einhalten. Ich anerkenne Deine Gnade und meine Sünde. Vergib mir denn niemand vergibt außer Dir." },
    benefit: {
      en: "Whoever says Sayyid Al-Istighfar in the evening with certainty and dies before morning is from the people of Paradise. The evening saying is especially powerful as it closes the day with complete repentance and acknowledgment.",
      fr: "Quiconque dit le Sayyid Al-Istighfar le soir avec certitude et meurt avant le matin est parmi les gens du Paradis.",
      de: "Wer Sayyid Al-Istighfar abends mit Gewissheit sagt und vor dem Morgen stirbt gehört zu den Menschen des Paradieses." },
    source: ["Sahih Bukhari 5522", "Sahih Bukhari 6306", "At-Tirmidhi 3393"] },

  { id: 529, catId: "evening_dhikr", type: "dua", order: 9,
    title: { en: "O Allah grant well-being to my body, hearing and sight – 3x (evening)", fr: "Ô Allah accorde le bien-être à mon corps, mon ouïe et ma vue – 3x (soir)", de: "O Allah gewähre meinem Körper Gehör und Sehvermögen Wohlergehen – 3x (Abend)" },
    arabic: "اَللَّهُمَّ عَافِنِيْ فِيْ بَدَنِيْ اَللَّهُمَّ عَافِنِيْ فِيْ سَمْعِيْ اَللَّهُمَّ عَافِنِيْ فِيْ بَصَرِيْ لاَ إِلَـٰهَ إِلاَّ أَنْتَ اَللَّهُمَّ إِنِّي أَعُوْذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ اَللَّهُمَّ إِنِّي أَعُوْذُ بِكَ مِنْ عَذَابِ الْقَبْرِ لاَ إِلَـٰهَ إِلاَّ أَنْتَ",
    transliteration: "Allaahumma afinii fii badanii. Allaahumma afinii fii sam-ii. Allaahumma afinii fii bashorii. Laa ilaaha illaa anta. Allaahumma innii a-uudzu bika minal kufri wal faqr. Allaahumma innii a-uudzu bika min adzaabil qobr. Laa ilaaha illaa anta. (3x)",
    translation: {
      en: "O Allah grant well-being to my body. To my hearing. To my sight. There is no deity except You. O Allah I seek refuge from disbelief and poverty. From the punishment of the grave. There is no deity except You. (3 times)",
      fr: "Ô Allah accorde le bien-être à mon corps, à mon ouïe, à ma vue. Pas de divinité sauf Toi. Je cherche refuge contre l'incroyance et la pauvreté. Contre le châtiment de la tombe. (3 fois)",
      de: "O Allah gewähre meinem Körper Wohlergehen. Meinem Gehör. Meinem Sehvermögen. Keine Gottheit außer Dir. Ich suche Zuflucht vor Unglaube und Armut. Vor der Grabstrafe. (3 Mal)" },
    benefit: {
      en: "Said 3 times every morning and 3 times every evening. The companion Abu Bakrah practiced this so consistently that his son asked why – he said: I heard the Prophet say it and I love to follow his Sunnah.",
      fr: "Dit 3 fois chaque matin et 3 fois chaque soir. Le compagnon Abu Bakrah pratiquait cela si régulièrement que son fils demanda pourquoi.",
      de: "3-mal jeden Morgen und 3-mal jeden Abend gesagt. Der Gefährte Abu Bakrah praktizierte dies so konsequent dass sein Sohn fragte warum." },
    source: ["Abu Dawud 4/324", "Ahmad 5/42", "An-Nasai Amal Al-Yawm 22", "Hasan"] },

  { id: 530, catId: "evening_dhikr", type: "dua", order: 10,
    title: { en: "O Allah I ask for pardon and well-being in religion, world, family and wealth (evening)", fr: "Ô Allah je demande pardon et bien-être dans la religion, le monde, la famille et les biens (soir)", de: "O Allah ich bitte um Vergebung und Wohlergehen in Religion Welt Familie und Vermögen (Abend)" },
    arabic: "اَللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ اَللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي اَللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي اَللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي",
    transliteration: "Allaahumma innii as-alukal afwa wal aafiyata fid-dunyaa wal aakhiroh. Allaahumma innii as-alukal afwa wal aafiyata fii dinii wa dunyaaya wa ahlii wa maalii. Allaahummas-tur aurootii wa aamin rou-aatii. Allaahummah-fazhnii min baini yadayya wa min kholfii wa an yamiinii wa an syimaalii wa min fauqii wa a-uudzu bi-azhomatika an ugh-taala min tahtii.",
    translation: {
      en: "O Allah I ask You for pardon and well-being in this world and the next. O Allah I ask for pardon and well-being in my religion, worldly life, family and wealth. O Allah conceal my faults and calm my fears. O Allah protect me from front, behind, right, left, above – and I seek refuge in Your greatness from being struck from below.",
      fr: "Ô Allah je Te demande le pardon et le bien-être en ce monde et dans l'au-delà. Dans ma religion, ma vie mondaine, ma famille et mes biens. Couvre mes défauts et calme mes craintes. Protège-moi de toutes les directions.",
      de: "O Allah ich bitte Dich um Vergebung und Wohlergehen in dieser Welt und im Jenseits. In meiner Religion meinem Leben meiner Familie und meinem Vermögen. Verberge meine Fehler und beruhige meine Ängste. Schütze mich von allen Richtungen." },
    benefit: {
      en: "Ibn Umar never abandoned this dua morning and evening until his death. It is the dua of al-aafiyah – comprehensive well-being. The Prophet told his uncle Abbas: There is nothing better to ask for than al-aafiyah.",
      fr: "Ibn Umar n'abandonna jamais ce dua matin et soir jusqu'à sa mort. C'est le dua de al-aafiyah – le bien-être complet.",
      de: "Ibn Umar gab dieses Dua morgens und abends nie auf bis zu seinem Tod. Es ist das Dua der al-aafiyah – umfassendes Wohlergehen." },
    source: ["Abu Dawud", "Ibn Majah", "Sahih Al-Albani"] },

  { id: 531, catId: "evening_dhikr", type: "dua", order: 11,
    title: { en: "O Allah Knower of unseen and witnessed – refuge from evil of soul and Shaytan (evening)", fr: "Ô Allah Connaisseur du caché et du témoigné – refuge du mal de l'âme et de Shaytan (soir)", de: "O Allah Wissender des Verborgenen und Bezeugten – Zuflucht vor dem Bösen der Seele und Shaytans (Abend)" },
    arabic: "اَللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَاْلأَرْضِ رَبَّ كُلِّ شَيْءٍ وَمَلِيْكَهُ أَشْهَدُ أَنْ لاَ إِلَـٰهَ إِلاَّ أَنْتَ أَعُوْذُ بِكَ مِنْ شَرِّ نَفْسِيْ وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ وَأَنْ أَقْتَرِفَ عَلَى نَفْسِيْ سُوْءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ",
    transliteration: "Allaahumma aalimal ghoibi wasy-syahaadati faathiros-samaawaati wal ardh robba kulli syai-in wa maliikahu asyhadu al-laa ilaaha illaa anta a-uudzu bika min syarri nafsii wa min syarrisy-syaithooni wa syirkih wa an aqtarifa alaa nafsii suu-an au ajurrohu ilaa muslim.",
    translation: {
      en: "O Allah Knower of the unseen and witnessed Creator of the heavens and earth Lord and Sovereign of all things – I bear witness that there is no deity except You. I seek refuge from the evil of my soul from the evil of Shaytan and his polytheism and from committing evil against myself or bringing it upon a Muslim.",
      fr: "Ô Allah Connaisseur du caché et du témoigné Créateur des cieux et de la terre Seigneur et Souverain de toute chose – je témoigne pas de divinité sauf Toi. Je cherche refuge contre le mal de mon âme de Shaytan et son polythéisme et contre commettre un mal contre moi-même ou l'infliger à un musulman.",
      de: "O Allah Wissender des Verborgenen und Bezeugten Schöpfer der Himmel und Erde Herr und Souverän aller Dinge – ich bezeuge keine Gottheit außer Dir. Ich suche Zuflucht vor dem Bösen meiner Seele Shaytans und seinem Polytheismus und davor ein Böses gegen mich oder einen Muslim zu begehen." },
    benefit: {
      en: "Said morning, evening and before sleep. Abu Bakr As-Siddiq himself asked the Prophet for this dua. Two sources of evil: the nafs and Shaytan. Two impacts: harm to self and harm to others. A complete protection dua.",
      fr: "Dit matin soir et avant de dormir. Abu Bakr As-Siddiq lui-même demanda ce dua au Prophète.",
      de: "Morgens abends und vor dem Schlafen gesagt. Abu Bakr As-Siddiq selbst bat den Propheten um dieses Dua." },
    source: ["At-Tirmidhi", "Abu Dawud", "Sahih At-Tirmidhi 3/142"] },

  { id: 532, catId: "evening_dhikr", type: "dua", order: 12,
    title: { en: "In the name of Allah with Whose name nothing harms – 3x (evening)", fr: "Au nom d'Allah avec Dont le nom rien ne nuit – 3x (soir)", de: "Im Namen Allahs mit Dessen Namen nichts schadet – 3x (Abend)" },
    arabic: "بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي اْلأَرْضِ وَلاَ فِي السَّمَاءِ وَهُوَ السَّمِيْعُ الْعَلِيْمُ",
    transliteration: "Bismillaahil-ladzii laa yadhurru ma-as-mihi syai-un fil ardhi wa laa fis-samaa wa huwas-samii-ul aliim. (3x)",
    translation: {
      en: "In the name of Allah with Whose name nothing on earth or in the heavens can cause harm and He is the All-Hearing the All-Knowing. (3 times)",
      fr: "Au nom d'Allah avec Dont le nom rien dans la terre ni dans les cieux ne peut nuire et Il est l'Omniaudient l'Omniscient. (3 fois)",
      de: "Im Namen Allahs mit Dessen Namen nichts auf der Erde noch im Himmel schaden kann und Er ist der Allhörende der Allwissende. (3 Mal)" },
    benefit: {
      en: "Whoever says this 3 times morning and evening – nothing will harm him. Aban ibn Uthman was paralyzed the day he forgot. Imam Al-Qurtubi: A scorpion stung me in Madinah and I remembered I had forgotten this dhikr that morning.",
      fr: "Quiconque dit cela 3 fois matin et soir – rien ne lui nuira. Aban ibn Uthman fut paralysé le jour où il oublia.",
      de: "Wer dies 3-mal morgens und abends sagt – nichts wird ihm schaden. Aban ibn Uthman war gelähmt an dem Tag an dem er es vergaß." },
    source: ["Abu Dawud 4/323", "At-Tirmidhi 5/465", "Ibn Majah", "Ahmad", "Hasan"] },

  { id: 533, catId: "evening_dhikr", type: "dua", order: 13,
    title: { en: "I am content with Allah as Lord, Islam as religion, Muhammad as Prophet – 3x (evening)", fr: "Je me contente d'Allah comme Seigneur, Islam comme religion, Muhammad comme Prophète – 3x (soir)", de: "Ich bin zufrieden mit Allah als Herrn Islam als Religion Muhammad als Propheten – 3x (Abend)" },
    arabic: "رَضِيْتُ بِاللَّهِ رَبًّا وَبِاْلإِسْلاَمِ دِيْنًا وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا",
    transliteration: "Rodhiitu billaahi robbaa wa bil islaami diinaa wa bimuhammadin shollallaahu alaihi wa sallama nabiyyaa. (3x)",
    translation: {
      en: "I am content with Allah as my Lord, with Islam as my religion, and with Muhammad (peace be upon him) as my Prophet. (3 times)",
      fr: "Je me contente d'Allah comme mon Seigneur, de l'Islam comme ma religion, et de Muhammad comme mon Prophète. (3 fois)",
      de: "Ich bin zufrieden mit Allah als meinem Herrn mit dem Islam als meiner Religion und mit Muhammad als meinem Propheten. (3 Mal)" },
    benefit: {
      en: "Whoever says this 3 times morning and evening – Allah obligates Himself to make them content on the Day of Judgment. Renewing the three declarations of faith at the end of the day is a beautiful way to close it.",
      fr: "Quiconque dit cela 3 fois matin et soir – Allah s'oblige à le satisfaire au Jour du Jugement. Renouveler les trois déclarations de foi à la fin de la journée.",
      de: "Wer dies 3-mal morgens und abends sagt – Allah verpflichtet sich ihn am Tag des Gerichts zufrieden zu stellen. Die drei Glaubenserklärungen am Ende des Tages erneuern." },
    source: ["Ahmad 4/337", "An-Nasai Amal Al-Yawm 4", "Abu Dawud 4/418", "Hasan Ibn Baz"] },

  { id: 534, catId: "evening_dhikr", type: "dua", order: 14,
    title: { en: "O Ever-Living O Self-Sustaining – by Your mercy I seek help (evening)", fr: "Ô Vivant Ô Subsistant – par Ta miséricorde je cherche de l'aide (soir)", de: "O Ewig Lebender O Beständiger – durch Deine Barmherzigkeit suche ich Hilfe (Abend)" },
    arabic: "يَا حَيُّ يَا قَيُّوْمُ بِرَحْمَتِكَ أَسْتَغِيْثُ أَصْلِحْ لِيْ شَأْنِيْ كُلَّهُ وَلاَ تَكِلْنِيْ إِلَى نَفْسِيْ طَرْفَةَ عَيْنٍ",
    transliteration: "Yaa hayyu yaa qoyyuum birohmatika astaghiits ashlih lii sya-nii kullah wa laa takilnii ilaa nafsii thorfata ain.",
    translation: {
      en: "O Ever-Living O Self-Sustaining, by Your mercy I seek relief. Rectify all my affairs and do not leave me to myself even for the blink of an eye.",
      fr: "Ô Vivant Ô Subsistant, par Ta miséricorde je cherche du secours. Rectifie toutes mes affaires et ne me laisse pas à moi-même un instant.",
      de: "O Ewig Lebender O Beständiger durch Deine Barmherzigkeit suche ich Hilfe. Richte alle meine Angelegenheiten und lass mich nicht mir selbst überlassen auch nicht für einen Augenblick." },
    benefit: {
      en: "The Prophet advised Fatimah to say this every morning and evening. In the evening it closes the day by entrusting all affairs to Allah. Do not leave me to myself – acknowledging complete dependence on Allah through the night.",
      fr: "Le Prophète conseilla à Fatimah de dire cela chaque matin et soir. Le soir cela ferme la journée en confiant toutes les affaires à Allah.",
      de: "Der Prophet riet Fatimah dies jeden Morgen und Abend zu sagen. Abends schließt es den Tag damit alle Angelegenheiten Allah anvertraut werden." },
    source: ["An-Nasai Al-Kubra", "Al-Hakim Al-Mustadrak", "Al-Baihaqi", "Sahih Al-Albani 227"] },

  { id: 535, catId: "evening_dhikr", type: "dua", order: 15,
    title: { en: "We are upon the fitrah of Islam – evening version (amsayna)", fr: "Nous sommes sur la fitrah de l'Islam – version du soir (amsayna)", de: "Wir sind auf der Fitrah des Islam – Abendversion (amsayna)" },
    arabic: "أَمْسَيْنَا عَلَى فِطْرَةِ اْلإِسْلاَمِ وَعَلَى كَلِمَةِ اْلإِخْلاَصِ وَعَلَى دِيْنِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَعَلَى مِلَّةِ أَبِيْنَا إِبْرَاهِيْمَ حَنِيْفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِيْنَ",
    transliteration: "Amsainaa alaa fithrotil islaam wa alaa kalimatil ikhlaash wa alaa diini nabiyyinaa muhammadin shollallaahu alaihi wa sallam wa alaa millati abiinaa ibroohiim haniifan musliman wa maa kaana minal musyrikiin.",
    translation: {
      en: "We have entered the evening upon the natural disposition of Islam, upon the word of sincerity, upon the religion of our Prophet Muhammad and upon the way of our father Ibrahim – upright as a Muslim and not among the polytheists.",
      fr: "Nous avons accueilli le soir sur la fitrah de l'Islam, sur la parole de sincérité, sur la religion de notre Prophète Muhammad et sur la voie de notre père Ibrahim – droit en tant que musulman.",
      de: "Wir haben den Abend begrüßt auf der Fitrah des Islam auf dem Wort der Aufrichtigkeit auf der Religion unseres Propheten Muhammad und auf dem Weg unseres Vaters Ibrahim – aufrecht als Muslim." },
    benefit: {
      en: "Evening version says amsayna (we entered the evening) instead of asbahnaa. Renewing faith at the close of every day – declaring Islam, tawhid, and the path of the Prophets before the night begins.",
      fr: "Version du soir dit amsayna au lieu de asbahnaa. Renouveler la foi à la fermeture de chaque journée avant que la nuit commence.",
      de: "Abendversion sagt amsayna statt asbahnaa. Erneuerung des Glaubens am Ende jedes Tages bevor die Nacht beginnt." },
    source: ["Ahmad 3/406-407", "Ahmad 5/123", "Sahih Al-Jami 4/290"] },

  { id: 536, catId: "evening_dhikr", type: "dua", order: 16,
    title: { en: "La ilaha illallah wahdahu – 10x evening (or 1x if lazy) – protected until morning", fr: "La ilaha illallah wahdahu – 10x le soir (ou 1x si paresseux) – protégé jusqu'au matin", de: "La ilaha illallah wahdahu – 10x abends (oder 1x wenn faul) – bis zum Morgen geschützt" },
    arabic: "لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيْكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ",
    transliteration: "Laa ilaaha illallaah wahdahu laa syariika lah lahul mulku wa lahul hamdu wa huwa alaa kulli syai-in qodiir. (10x or 1x)",
    translation: {
      en: "There is no deity except Allah alone without partner. To Him belongs the dominion and all praise. And He is over all things capable. (10 times in the evening, or 1 time if lazy)",
      fr: "Il n'y a pas de divinité sauf Allah seul sans associé. À Lui le règne et toute louange. Il est sur toute chose Puissant. (10 fois le soir, ou 1 fois si paresseux)",
      de: "Es gibt keine Gottheit außer Allah allein ohne Partner. Ihm gehört die Herrschaft und aller Lob. Er ist über alle Dinge mächtig. (10-mal abends oder 1-mal wenn faul)" },
    benefit: {
      en: "Whoever says this after Maghrib 10 times is protected from Shaytan until morning. Whoever says it once is equivalent to freeing a slave from the descendants of Ismail – 10 good deeds, 10 sins erased, rank raised 10 degrees.",
      fr: "Quiconque dit cela après Maghrib 10 fois est protégé de Shaytan jusqu'au matin. Dit une fois: équivalent à libérer un esclave.",
      de: "Wer dies nach Maghrib 10-mal sagt ist vor Shaytan bis zum Morgen geschützt. 1-mal gesagt: entspricht der Befreiung eines Sklaven." },
    source: ["Abu Dawud 4/319", "Ibn Majah", "Ahmad 4/60", "Sahih Al-Albani"] },

  { id: 537, catId: "evening_dhikr", type: "dua", order: 17,
    title: { en: "La ilaha illallah wahdahu – 100x per day (evening counting)", fr: "La ilaha illallah wahdahu – 100x par jour (comptage du soir)", de: "La ilaha illallah wahdahu – 100x pro Tag (Abend-Zählung)" },
    arabic: "لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيْكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ",
    transliteration: "Laa ilaaha illallaah wahdahu laa syariika lah lahul mulku wa lahul hamdu wa huwa alaa kulli syai-in qodiir. (100x)",
    translation: {
      en: "There is no deity except Allah alone without partner. To Him belongs the dominion and all praise. And He is over all things capable. (100 times per day)",
      fr: "Il n'y a pas de divinité sauf Allah seul sans associé. À Lui le règne et toute louange. Il est sur toute chose Puissant. (100 fois par jour)",
      de: "Es gibt keine Gottheit außer Allah allein ohne Partner. Ihm gehört die Herrschaft und aller Lob. Er ist über alle Dinge mächtig. (100-mal pro Tag)" },
    benefit: {
      en: "Whoever says this 100 times in a day: equivalent to freeing 10 slaves, 100 good deeds, 100 sins erased, and no one brings better reward on the Day of Judgment except those who said it more. An-Nawawi: Can be split between morning and evening.",
      fr: "Quiconque dit cela 100 fois par jour: équivalent à libérer 10 esclaves, 100 bonnes actions, 100 péchés effacés. An-Nawawi : peut être réparti entre le matin et le soir.",
      de: "Wer dies 100-mal am Tag sagt: entspricht der Befreiung von 10 Sklaven 100 gute Taten 100 Sünden getilgt. An-Nawawi: Kann auf Morgen und Abend aufgeteilt werden." },
    source: ["Sahih Bukhari 4/95", "Sahih Muslim 4/2071"] },

  { id: 538, catId: "evening_dhikr", type: "dua", order: 18,
    title: { en: "Subhanallah wa bihamdih – 100x evening – greatest reward", fr: "Subhanallah wa bihamdih – 100x soir – plus grande récompense", de: "Subhanallah wa bihamdih – 100x abends – größte Belohnung" },
    arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",
    transliteration: "Subhaanallaahi wa bihamdih. (100x)",
    translation: {
      en: "Glory be to Allah and all praise is His. (100 times)",
      fr: "Gloire à Allah et toute louange Lui appartient. (100 fois)",
      de: "Gepriesen sei Allah und aller Lob gehört Ihm. (100 Mal)" },
    benefit: {
      en: "Whoever says this 100 times morning and evening – no one brings better reward on the Day of Judgment unless they said the same or more. Also erases sins even as numerous as the foam of the sea. Short but enormously rewarding.",
      fr: "Quiconque dit cela 100 fois matin et soir – nul ne viendra avec une meilleure récompense sauf quelqu'un qui a dit pareil ou plus. Efface aussi les péchés.",
      de: "Wer dies 100-mal morgens und abends sagt – niemand bringt eine bessere Belohnung außer jemand der dasselbe oder mehr gesagt hat. Löscht auch Sünden." },
    source: ["Sahih Muslim 2692", "Sahih Bukhari 6405", "Sahih Muslim 484"] },

  { id: 539, catId: "evening_dhikr", type: "dua", order: 19,
    title: { en: "Astaghfirullah wa atubu ilayh – 100x per day (evening)", fr: "Astaghfirullah wa atubu ilayh – 100x par jour (soir)", de: "Astaghfirullah wa atubu ilayh – 100x pro Tag (Abend)" },
    arabic: "أَسْتَغْفِرُ اللَّهَ وَأَتُوْبُ إِلَيْهِ",
    transliteration: "Astaghfirullaaha wa atuubu ilaih. (100x)",
    translation: {
      en: "I seek Allah's forgiveness and repent to Him. (100 times)",
      fr: "Je demande pardon à Allah et me repens à Lui. (100 fois)",
      de: "Ich bitte Allah um Vergebung und wende mich reuig an Ihn. (100 Mal)" },
    benefit: {
      en: "Closing the evening and day with 100 times of repentance. The Prophet repented 100 times a day despite being protected from sin – teaching the Ummah the habit of continuous tawbah. Ending the day with tawbah is a beautiful practice.",
      fr: "Fermer la soirée et la journée avec 100 fois de repentir. Le Prophète se repentait 100 fois par jour malgré sa protection du péché.",
      de: "Den Abend und Tag mit 100-maliger Reue abschließen. Der Prophet bereute 100-mal täglich obwohl er vor Sünden geschützt war." },
    source: ["Sahih Bukhari 11/101", "Sahih Muslim 4/2075"] },

  { id: 540, catId: "evening_dhikr", type: "dua", order: 20,
    title: { en: "I seek refuge in the perfect words of Allah from the evil of His creation – 3x evening", fr: "Je cherche refuge dans les paroles parfaites d'Allah contre le mal de Sa création – 3x soir", de: "Ich suche Zuflucht in den vollkommenen Worten Allahs vor dem Bösen Seiner Schöpfung – 3x Abend" },
    arabic: "أَعُوْذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",
    transliteration: "A-uudzu bi kalimaatillaahit-taammaati min syarri maa khalaq. (3x)",
    translation: {
      en: "I seek refuge in the perfect words of Allah from the evil of what He has created. (3 times)",
      fr: "Je cherche refuge dans les paroles parfaites d'Allah contre le mal de ce qu'Il a créé. (3 fois)",
      de: "Ich suche Zuflucht in den vollkommenen Worten Allahs vor dem Bösen dessen was Er erschaffen hat. (3 Mal)" },
    benefit: {
      en: "Whoever says this 3 times every evening – no creature will harm him that night. A man was stung by a scorpion and the Prophet said: If you had said this in the evening it would not have harmed you. Suhail's family practiced this every evening and were always protected.",
      fr: "Quiconque dit cela 3 fois chaque soir – aucune créature ne lui nuira cette nuit. Un homme fut piqué par un scorpion et le Prophète dit : Si tu avais dit cela le soir cela ne t'aurait pas nui.",
      de: "Wer dies 3-mal jeden Abend sagt – keine Kreatur wird ihm diese Nacht schaden. Ein Mann wurde von einem Skorpion gestochen und der Prophet sagte: Wenn du dies abends gesagt hättest hätte es dir nicht geschadet." },
    source: ["Ahmad 2/290", "An-Nasai Amal Al-Yawm 590", "Sahih At-Tirmidhi 3/187", "Sahih Ibn Majah 2/266"] },

  // ── CATEGORY: WEDDING ──
  
  { id:88, catId:"wedding", type:"dua", order:1, title:{en:"Wedding Dua (1) – Blessing",fr:"Invocation de mariage (1) – Bénédiction",de:"Hochzeits-Dua (1) – Segen"}, arabic:"بَارَكَ اللَّهُ لَكَ وَبَارَكَ عَلَيْكَ وَجَمَعَ بَيْنَكُمَا فِيْ خَيْرٍ", transliteration:"Baarokallaahu laka wa baaroka 'alaika wa jama'a bainakumaa fii khoirin.",
    translation:{en:"May Allah bless you, shower His blessings upon you, and unite both of you in goodness.",fr:"Qu'Allah te bénisse, répande Ses bénédictions sur toi et vous unisse tous les deux dans le bien.",de:"Möge Allah dich segnen, Seine Segnungen über dich bringen und euch beide im Guten vereinen."}, source:["Abu Dawud","At-Tirmidhi","Ibn Majah","Sahih"] },

  { id:105, catId:"wedding", type:"dua", order:2, title:{en:"Wedding Dua (2) – For the bride",fr:"Invocation de mariage (2) – Pour la mariée",de:"Hochzeits-Dua (2) – Für die Braut"}, arabic:"اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا جَبَلْتَهَا عَلَيْهِ، وَأَعُوْذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا جَبَلْتَهَا عَلَيْهِ", transliteration:"Allaahumma innii as-aluka khoirohaa, wa khoiro maa jabaltahaa 'alaihi, wa a'uudzu bika min syarrihaa, wa syarri maa jabaltahaa 'alaihi.",
    translation:{en:"O Allah, I ask You for her goodness and the goodness upon which You created her, and I seek refuge in You from her evil and the evil upon which You created her.",fr:"Ô Allah, je Te demande son bien et le bien sur lequel Tu l'as créée, et je cherche protection auprès de Toi contre son mal et le mal sur lequel Tu l'as créée.",de:"O Allah, ich bitte Dich um ihr Gutes und das Gute auf dem Du sie erschaffen hast, und ich suche Zuflucht bei Dir vor ihrem Schlechten und dem Schlechten auf dem Du sie erschaffen hast."}, source:["Abu Dawud","Ibn Majah","Sahih"] },

  { id:106, catId:"wedding", type:"dua", order:3, title:{en:"Wedding Dua (3) – Before intimacy",fr:"Invocation de mariage (3) – Avant l'intimité",de:"Hochzeits-Dua (3) – Vor der Intimität"}, arabic:"بِسْمِ اللَّهِ، اَللَّهُمَّ جَنِّبْنَا الشَّيْطَانَ وَجَنِّبِ الشَّيْطَانَ مَا رَزَقْتَنَا", transliteration:"Bismillaah. Allaahumma jannibnasy-syaithoona wa jannibisy-syaithoona maa rozaqtanaa.",
    translation:{en:"In the name of Allah. O Allah, keep us away from Satan and keep Satan away from what You have provided us.",fr:"Au nom d'Allah. Ô Allah, éloigne-nous du diable et éloigne le diable de ce que Tu nous as accordé.",de:"Im Namen Allahs. O Allah, halte uns vom Satan fern und halte den Satan fern von dem, was Du uns gegeben hast."}, benefit:{en:"The Prophet said: if a child is born from this union, Satan will never harm that child.",fr:"Le Prophète a dit : si un enfant naît de cette union, Satan ne nuira jamais à cet enfant.",de:"Der Prophet sagte: Wenn aus dieser Vereinigung ein Kind geboren wird, wird der Satan diesem Kind niemals schaden."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:53, catId:"house", type:"dua", order:1, title:{en:"Leaving the House (1)",fr:"Quitter la maison (1)",de:"Das Haus verlassen (1)"}, arabic:"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ", transliteration:"Bismillaah, tawakkaltu 'alallaah, laa haula wa laa quwwata illaa billaah.",
    translation:{en:"In the name of Allah, I place my trust in Allah. There is no power and no strength except with Allah.",fr:"Au nom d'Allah, je place ma confiance en Allah. Il n'y a de force ni de puissance qu'avec Allah.",de:"Im Namen Allahs, ich vertraue auf Allah. Es gibt keine Kraft und keine Macht außer durch Allah."}, benefit:{en:"Whoever says this when leaving the house will be guided, protected and sufficed.",fr:"Celui qui dit cela en quittant la maison sera guidé, protégé et pourvu.",de:"Wer dies beim Verlassen des Hauses sagt, wird geleitet, beschützt und versorgt."}, source:["Abu Dawud","At-Tirmidhi"] },

  { id:54, catId:"house", type:"dua", order:2, title:{en:"Leaving the House (2)",fr:"Quitter la maison (2)",de:"Das Haus verlassen (2)"}, arabic:"اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ، أَوْ أَزِلَّ أَوْ أُزَلَّ، أَوْ أَظْلِمَ أَوْ أُظْلَمَ، أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَيَّ", transliteration:"Allaahumma inni a'uudzu bika an adhilla au udholla, au azilla au uzalla, au azhlima au uzhlama, au ajhala au yujhala 'alayya.",
    translation:{en:"O Allah, I seek refuge in You lest I go astray or be led astray, slip or be made to slip, oppress or be oppressed, or act ignorantly or be treated ignorantly.",fr:"Ô Allah, je cherche refuge auprès de Toi contre le fait de m'égarer ou d'être égaré, de commettre une erreur ou qu'on m'y pousse, d'être injuste ou victime d'injustice, ou d'agir avec ignorance ou d'en être victime.",de:"O Allah, ich suche Zuflucht bei Dir, dass ich irregehe oder irregeführt werde, einen Fehler begehe oder dazu gebracht werde, Unrecht tue oder mir Unrecht geschieht, oder mich unwissend verhalte oder so behandelt werde."}, source:["Abu Dawud","An-Nasai","Ibn Majah"] },

  { id:55, catId:"house", type:"dua", order:3, title:{en:"Entering the House – Bismillah",fr:"Entrer dans la maison – Bismillah",de:"Das Haus betreten – Bismillah"}, arabic:"بِسْمِ اللَّهِ", transliteration:"Bismillaah.",
    translation:{en:"In the name of Allah.",fr:"Au nom d'Allah.",de:"Im Namen Allahs."}, benefit:{en:"Mentioning Allah when entering the house prevents Shaytan from entering and staying. If Allah is mentioned when entering and eating, Shaytan has no place to stay or eat.",fr:"Mentionner Allah en entrant dans la maison empêche le Shaytan d'entrer et de rester. Si Allah est mentionné en entrant et en mangeant, le Shaytan n'a nulle part où rester ou manger.",de:"Das Erwähnen Allahs beim Betreten des Hauses hindert den Shaytan daran, einzutreten und zu bleiben. Wenn Allah beim Eintreten und Essen erwähnt wird, hat der Shaytan keinen Platz zum Bleiben oder Essen."}, source:["Sahih Muslim"] },

  { id:56, catId:"house", type:"dua", order:4, title:{en:"Entering the House – Salam",fr:"Entrer dans la maison – Salam",de:"Das Haus betreten – Salam"}, arabic:"اَلسَّلَامُ عَلَيْكُمْ", transliteration:"As-salaamu 'alaikum.",
    translation:{en:"Peace be upon you.",fr:"Que la paix soit sur vous.",de:"Friede sei mit euch."}, benefit:{en:"Giving salam when entering the house brings blessings to you and your family. It is recommended to greet even your own household – this is a sunnah often overlooked.",fr:"Donner le salam en entrant dans la maison apporte la bénédiction sur vous et votre famille. Il est recommandé de saluer même votre propre foyer – c'est une sunna souvent négligée.",de:"Das Aussprechen des Salams beim Betreten des Hauses bringt Segen auf dich und deine Familie. Es ist empfohlen, sogar den eigenen Haushalt zu grüßen – eine oft vergessene Sunnah."}, source:["Quran 24:61","Authenticated"] },

  { id:57, catId:"house", type:"dua", order:5, title:{en:"Entering the House – If Empty",fr:"Entrer dans la maison – Si vide",de:"Das Haus betreten – Wenn leer"}, arabic:"اَلسَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ", transliteration:"As-salaamu 'alainaa wa 'alaa 'ibaadillaahis shaalihiin.",
    translation:{en:"Peace be upon us and upon the righteous servants of Allah.",fr:"Que la paix soit sur nous et sur les pieux serviteurs d'Allah.",de:"Friede sei auf uns und auf den rechtschaffenen Dienern Allahs."}, source:["Abu Dawud","Authenticated"] },

  { id:58, catId:"house", type:"info", order:6, title:{en:"How to drive Shaytan from the house",fr:"Comment chasser le Shaytan de la maison",de:"Wie man den Shaytan aus dem Haus vertreibt"}, content:{en:"Reciting Surah Al-Baqarah in the house drives Shaytan away. The Prophet ﷺ said: 'Shaytan flees from a house where Surah Al-Baqarah is recited.' Important: it must be recited by a person – audio recordings alone do not have the same effect according to scholars.",fr:"Réciter la sourate Al-Baqara dans la maison chasse le Shaytan. Le Prophète ﷺ a dit : 'Le Shaytan fuit la maison où la sourate Al-Baqara est récitée.' Important : elle doit être récitée par une personne – les enregistrements audio seuls n'ont pas le même effet selon les savants.",de:"Das Rezitieren der Sure Al-Baqara im Haus vertreibt den Shaytan. Der Prophet ﷺ sagte: 'Der Shaytan flieht aus einem Haus, in dem die Sure Al-Baqara rezitiert wird.' Wichtig: Sie muss von einer Person rezitiert werden – Audioaufnahmen allein haben nach Gelehrtenmeinung nicht denselben Effekt."}, source:["Sahih Muslim"] },

  { id:59, catId:"house", type:"info", order:7, title:{en:"Weak Dua for Entering the House ⚠️",fr:"Invocation faible pour entrer dans la maison ⚠️",de:"Schwaches Dua beim Hauseintreten ⚠️"}, content:{en:"⚠️ Weak Dua: 'Allahumma inni as'aluka khayral mawlaji wa khayral makhraji, bismillahi walajnaa wa bismillahi kharajnaa, wa 'alallahi rabbinaa tawakkalnaa' – This hadith is weak (da'if) and should not be established as regular sunnah.",fr:"⚠️ Invocation faible : 'Allahumma inni as'aluka khayral mawlaji...' – Ce hadith est faible (da'if) et ne doit pas être établi comme une sunna régulière.",de:"⚠️ Schwaches Dua: 'Allahumma inni as'aluka khayral mawlaji...' – Dieser Hadith ist schwach (da'if) und sollte nicht als reguläre Sunnah etabliert werden."}, source:["Classified da'if by scholars"] },

  // ── CATEGORY: FOOD ──
  
  { id:24, catId:"food", type:"dua", order:1, title:{en:"Before Eating",fr:"Avant de manger",de:"Vor dem Essen"}, arabic:"بِسْمِ اللَّهِ", transliteration:"Bismillaah.",
    translation:{en:"In the name of Allah.",fr:"Au nom d'Allah.",de:"Im Namen Allahs."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:25, catId:"food", type:"dua", order:2, title:{en:"If Forgot Before Eating (1)",fr:"Si on a oublié avant de manger (1)",de:"Falls man vor dem Essen vergessen hat (1)"}, arabic:"بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ", transliteration:"Bismillaahi awwalahu wa aakhirohu.",
    translation:{en:"In the name of Allah at its beginning and its end.",fr:"Au nom d'Allah au début et à la fin.",de:"Im Namen Allahs am Anfang und am Ende."}, source:["Abu Dawud","At-Tirmidhi"] },

  { id:26, catId:"food", type:"dua", order:3, title:{en:"If Forgot Before Eating (2)",fr:"Si on a oublié avant de manger (2)",de:"Falls man vor dem Essen vergessen hat (2)"}, arabic:"بِسْمِ اللَّهِ فِيْ أَوَّلِهِ وَآخِرِهِ", transliteration:"Bismillaahi fii awwalihi wa aakhirihi.",
    translation:{en:"In the name of Allah at its beginning and its end.",fr:"Au nom d'Allah au début et à la fin.",de:"Im Namen Allahs am Anfang und am Ende."}, source:["Abu Dawud"] },

  { id:27, catId:"food", type:"dua", order:4, title:{en:"When Given Food",fr:"Quand on reçoit de la nourriture",de:"Wenn man Essen bekommt"}, arabic:"اَللَّهُمَّ بَارِكْ لَنَا فِيْهِ، وَأَطْعِمْنَا خَيْرًا مِنْهُ", transliteration:"Allahumma baarik lanaa fiihi, wa ath'imnaa khayran minhu.",
    translation:{en:"O Allah, bless it for us and feed us better than it.",fr:"Ô Allah, bénis-le pour nous et nourris-nous de meilleur.",de:"O Allah, segne es für uns und gib uns Besseres davon."}, source:["Sahih Muslim"] },

  { id:28, catId:"food", type:"dua", order:5, title:{en:"Drinking Milk",fr:"En buvant du lait",de:"Beim Trinken von Milch"}, arabic:"اَللَّهُمَّ بَارِكْ لَنَا فِيْهِ، وَزِدْنَا مِنْهُ", transliteration:"Allahumma baarik lanaa fiihi, wa zidnaa minhu.",
    translation:{en:"O Allah, bless it for us and increase us in it.",fr:"Ô Allah, bénis-le pour nous et augmente-nous en cela.",de:"O Allah, segne es für uns und mehre uns darin."}, source:["Abu Dawud","At-Tirmidhi"] },

  { id:29, catId:"food", type:"dua", order:6, title:{en:"After Eating (1)",fr:"Après avoir mangé (1)",de:"Nach dem Essen (1)"}, arabic:"اَلْحَمْدُ لِلَّهِ الَّذِيْ أَطْعَمَنِيْ هَذَا وَرَزَقَنِيْهِ، مِنْ غَيْرِ حَوْلٍ مِنِّيْ وَلَا قُوَّةٍ", transliteration:"Alhamdulillaahil-ladzii ath'amanii haadzaa wa razaqanii-hi min ghayri hawlin minnii wa laa quwwah.",
    translation:{en:"All praise is for Allah who fed me this and provided it for me without any power or strength from myself.",fr:"Louange à Allah qui m'a nourri de ceci et me l'a accordé sans aucune force ni puissance de ma part.",de:"Alles Lob gebührt Allah, der mir dies zu essen gab und es mir ohne eigene Kraft oder Macht gewährte."}, benefit:{en:"Whoever says this after eating will be forgiven his past sins.",fr:"Celui qui dit cela après avoir mangé sera pardonné pour ses péchés passés.",de:"Wer dies nach dem Essen spricht, dem werden seine vergangenen Sünden vergeben."}, source:["Abu Dawud","At-Tirmidhi","Ibn Majah"] },

  { id:30, catId:"food", type:"dua", order:7, title:{en:"After Eating (2)",fr:"Après avoir mangé (2)",de:"Nach dem Essen (2)"}, arabic:"اَلْحَمْدُ لِلَّهِ حَمْدًا كَثِيْرًا طَيِّبًا مُبَارَكًا فِيْهِ، غَيْرَ مَكْفِيٍّ وَلَا مُوَدَّعٍ، وَلَا مُسْتَغْنًى عَنْهُ رَبَّنَا", transliteration:"Alhamdulillaahi hamdan kathiiran tayyiban mubaarakan fiih, ghayra makfiyyin wa laa muwadda'in, wa laa mustaghnan 'anhu rabbanaa.",
    translation:{en:"All praise is for Allah, abundant, pure and blessed praise – praise that is never exhausted, never abandoned, and from which we are never independent, O our Lord.",fr:"Louange à Allah, abondante, pure et bénie – une louange qui n'est jamais épuisée, jamais abandonnée, et dont nous ne nous passons jamais, ô notre Seigneur.",de:"Alles Lob gebührt Allah – reichlich, rein und gesegnet, niemals erschöpft, niemals aufgegeben, und davon sind wir niemals unabhängig, o unser Herr."}, source:["Sahih Bukhari"] },

  { id:31, catId:"food", type:"dua", order:8, title:{en:"After Eating (Short)",fr:"Après avoir mangé (court)",de:"Nach dem Essen (kurz)"}, arabic:"اَلْحَمْدُ لِلَّهِ", transliteration:"Alhamdulillaah.",
    translation:{en:"All praise is for Allah.",fr:"Louange à Allah.",de:"Alles Lob gebührt Allah."}, source:["Sahih Muslim"] },

  { id:32, catId:"food", type:"dua", order:9, title:{en:"Dua for the Host (1)",fr:"Invocation pour l'hôte (1)",de:"Dua für den Gastgeber (1)"}, arabic:"اَللَّهُمَّ أَطْعِمْ مَنْ أَطْعَمَنِيْ، وَاسْقِ مَنْ سَقَانِيْ", transliteration:"Allahumma ath'im man ath'amanii, wasqi man saqoonii.",
    translation:{en:"O Allah, feed the one who fed me and give drink to the one who gave me drink.",fr:"Ô Allah, nourris celui qui m'a nourri et abreuve celui qui m'a abreuvé.",de:"O Allah, speise den, der mich gespeist hat, und gib zu trinken dem, der mir zu trinken gab."}, source:["Sahih Muslim"] },

  { id:33, catId:"food", type:"dua", order:10, title:{en:"Dua for the Host (2)",fr:"Invocation pour l'hôte (2)",de:"Dua für den Gastgeber (2)"}, arabic:"اَللَّهُمَّ بَارِكْ لَهُمْ فِيْمَا رَزَقْتَهُمْ، وَاغْفِرْ لَهُمْ، وَارْحَمْهُمْ", transliteration:"Allahumma baarik lahum fiimaa razaqtahum, waghfir lahum, warhamhum.",
    translation:{en:"O Allah, bless what You have provided them, forgive them and have mercy on them.",fr:"Ô Allah, bénis ce que Tu leur as accordé, pardonne-leur et fais-leur miséricorde.",de:"O Allah, segne das, was Du ihnen gegeben hast, vergib ihnen und erbarme Dich ihrer."}, source:["Sahih Muslim"] },

  // ── CATEGORY: FASTING ──
  
  { id:34, catId:"fasting", type:"dua", order:1, title:{en:"Breaking Fast (1)",fr:"Rupture du jeûne (1)",de:"Fastenbrechen (1)"}, arabic:"ذَهَبَ الظَّمَأُ، وَابْتَلَّتِ الْعُرُوْقُ، وَثَبَتَ اْلأَجْرُ، إِنْ شَاءَ اللَّهُ", transliteration:"Dhahaba adh-dhama'u, wabtallatil 'urooqu, wa thabata al-ajru, in shaa Allah.",
    translation:{en:"The thirst has gone, the veins are moistened, and the reward is confirmed, if Allah wills.",fr:"La soif est partie, les veines sont abreuvées et la récompense est assurée, si Allah le veut.",de:"Der Durst ist vergangen, die Adern sind befeuchtet und der Lohn ist bestätigt, so Allah will."}, source:["Abu Dawud","Sahih Al-Albani"] },

  { id:35, catId:"fasting", type:"dua", order:2, title:{en:"Breaking Fast (2)",fr:"Rupture du jeûne (2)",de:"Fastenbrechen (2)"}, arabic:"اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ بِرَحْمَتِكَ الَّتِيْ وَسِعَتْ كُلَّ شَيْءٍ أَنْ تَغْفِرَ لِيْ", transliteration:"Allahumma inni as'aluka bi-rahmatikal-latii wasi'at kulla shay'in an taghfira lii.",
    translation:{en:"O Allah, I ask You by Your mercy which encompasses all things, that You forgive me.",fr:"Ô Allah, je Te demande par Ta miséricorde qui englobe toute chose de me pardonner.",de:"O Allah, ich bitte Dich bei Deiner Barmherzigkeit, die alles umfasst, dass Du mir vergibst."}, source:["Ibn Majah","Hasan"] },

  { id:36, catId:"fasting", type:"dua", order:3, title:{en:"Breaking Fast at Someone's Place",fr:"Rompre le jeûne chez quelqu'un",de:"Fastenbrechen bei jemandem"}, arabic:"أَفْطَرَ عِنْدَكُمُ الصَّائِمُوْنَ، وَأَكَلَ طَعَامَكُمُ اْلأَبْرَارُ، وَصَلَّتْ عَلَيْكُمُ الْمَلاَئِكَةُ", transliteration:"Aftara 'indakumus-saa'imuun, wa akala ta'aamakumul abraar, wa sallat 'alaykumul malaa'ikah.",
    translation:{en:"Those who fast have broken their fast with you, the righteous have eaten your food, and the angels have prayed for you.",fr:"Ceux qui jeûnent ont rompu leur jeûne chez vous, les pieux ont mangé votre nourriture, et les anges ont prié pour vous.",de:"Die Fastenden haben bei euch ihr Fasten gebrochen, die Rechtschaffenen haben euer Essen gegessen, und die Engel haben für euch gebetet."}, source:["Abu Dawud","Ibn Majah","Sahih Al-Albani"] },

  { id:37, catId:"fasting", type:"dua", order:4, title:{en:"When Insulted While Fasting",fr:"Quand on est insulté en jeûnant",de:"Wenn man beim Fasten beleidigt wird"}, arabic:"إِنِّيْ صَائِمٌ، إِنِّيْ صَائِمٌ", transliteration:"Innii saa'im, innii saa'im.",
    translation:{en:"Indeed, I am fasting. Indeed, I am fasting.",fr:"Je suis en jeûne. Je suis en jeûne.",de:"Ich faste. Ich faste."}, benefit:{en:"The Prophet ﷺ instructed: if someone insults or fights you while fasting, say this – to remind yourself and cool the situation.",fr:"Le Prophète ﷺ a enseigné : si quelqu'un vous insulte pendant le jeûne, dites cela – pour vous rappeler et calmer la situation.",de:"Der Prophet ﷺ lehrte: Wenn jemand dich beim Fasten beleidigt, sage dies – um dich zu erinnern und die Situation zu beruhigen."}, source:["Sahih Bukhari","Sahih Muslim"] },

  // ── CATEGORY: RAMADAN ── 
  { id:38, catId:"ramadan", type:"info", order:1, title:{en:"No specific dua for welcoming Ramadan",fr:"Pas d'invocation spécifique pour accueillir le Ramadan",de:"Kein spezifisches Dua zur Begrüßung des Ramadan"}, content:{en:"There is no authentic fixed dua from the Prophet ﷺ specifically for welcoming Ramadan. One may make general dua asking Allah to allow them to reach and benefit from Ramadan.",fr:"Il n'existe pas d'invocation fixe et authentique du Prophète ﷺ spécifiquement pour accueillir le Ramadan. On peut faire des invocations générales demandant à Allah de permettre d'atteindre et de profiter du Ramadan.",de:"Es gibt kein authentisches, festes Dua vom Propheten ﷺ speziell zur Begrüßung des Ramadan. Man kann allgemeine Duas sprechen und Allah bitten, den Ramadan zu erreichen und davon zu profitieren."}, source:["Scholars consensus"] },

  { id:39, catId:"ramadan", type:"info", order:2, title:{en:"No fixed dua between Tarawih units",fr:"Pas d'invocation fixe entre les unités de Tarawih",de:"Kein festes Dua zwischen den Tarawih-Einheiten"}, content:{en:"No authentic fixed dua is established between Tarawih units. Weak reports should not be treated as regular practice. One may make any personal dua during the breaks.",fr:"Aucune invocation fixe et authentique n'est établie entre les unités de Tarawih. Les rapports faibles ne doivent pas être traités comme une pratique régulière.",de:"Kein authentisches, festes Dua ist zwischen den Tarawih-Einheiten belegt. Schwache Überlieferungen sollten nicht als reguläre Praxis behandelt werden."}, source:["Scholars consensus"] },

  { id:40, catId:"ramadan", type:"dua", order:3, title:{en:"Qunut Witr in Ramadan",fr:"Qunut Witr en Ramadan",de:"Qunut Witr im Ramadan"}, arabic:"اَللَّهُمَّ إِيَّاكَ نَعْبُدُ، وَلَكَ نُصَلِّي وَنَسْجُدُ، وَإِلَيْكَ نَسْعَى وَنَحْفِدُ، وَنَرْجُو رَحْمَتَكَ رَبَّنَا، وَنَخَافُ عَذَابَكَ الْجِدَّ، إِنَّ عَذَابَكَ لِمَنْ عَادَيْتَ مُلْحِقٌ", transliteration:"Allahumma iyyaaka na'budu, wa laka nusalli wa nasjudu, wa ilaika nas'aa wa nahfid, wa narjuu rahmataka rabbanaa, wa nakhaafu 'adhaabakal jidd, inna 'adhaabaka liman 'aadaita mulhiq.",
    translation:{en:"O Allah, You alone we worship, for You we pray and prostrate, and towards You we strive. We hope for Your mercy, O our Lord, and we fear Your severe punishment. Indeed Your punishment will reach those who oppose You.",fr:"Ô Allah, Toi seul nous adorons, pour Toi nous prions et prosternons, et vers Toi nous nous efforçons. Nous espérons Ta miséricorde, ô notre Seigneur, et nous craignons Ton sévère châtiment.",de:"O Allah, nur Dich beten wir an, für Dich beten und werfen wir uns nieder, und zu Dir streben wir. Wir hoffen auf Deine Barmherzigkeit und fürchten Deine schwere Strafe."}, source:["Al-Bayhaqi","Authenticated by scholars"] },

  { id:41, catId:"ramadan", type:"dua", order:4, title:{en:"Laylatul Qadr Dua",fr:"Invocation de la Nuit du Destin",de:"Dua der Nacht Al-Qadr"}, arabic:"اَللَّهُمَّ إِنَّكَ عَفُوٌّ، تُحِبُّ العَفْوَ فَاعْفُ عَنِّي", transliteration:"Allahumma innaka 'afuwwun, tuhibbul 'afwa fa'fu 'annii.",
    translation:{en:"O Allah, You are the Pardoner, You love to pardon, so pardon me.",fr:"Ô Allah, Tu es le Pardonneur, Tu aimes pardonner, pardonne-moi donc.",de:"O Allah, Du bist der Vergebende, Du liebst die Vergebung, also vergib mir."}, benefit:{en:"Aisha رضي الله عنها asked what to say on Laylatul Qadr – this is what the Prophet ﷺ taught her. Note: 'Kareem' is not part of the authentic wording.",fr:"Aïcha رضي الله عنها a demandé quoi dire la nuit du Qadr. Note : 'Kareem' ne fait pas partie du texte authentique.",de:"Aisha رضي الله عنها fragte was man in der Laylatul Qadr sagen soll. Hinweis: 'Kareem' ist nicht Teil des authentischen Wortlauts."}, source:["At-Tirmidhi","Ibn Majah","Sahih"] },

  { id:42, catId:"ramadan", type:"dua", order:5, title:{en:"Laylatul Qadr – Alternative Dua",fr:"Nuit du Destin – Invocation alternative",de:"Laylatul Qadr – Alternatives Dua"}, arabic:"اَللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ", transliteration:"Allahumma innii as'alukal 'afwa wal 'aafiyah.",
    translation:{en:"O Allah, I ask You for pardon and wellbeing.",fr:"Ô Allah, je Te demande le pardon et la santé.",de:"O Allah, ich bitte Dich um Vergebung und Wohlbefinden."}, benefit:{en:"A comprehensive dua recommended for all times, especially Laylatul Qadr.",fr:"Une invocation complète recommandée en tout temps, spécialement pendant la Nuit du Destin.",de:"Ein umfassendes Dua, das zu jeder Zeit empfohlen wird, besonders in der Laylatul Qadr."}, source:["Ahmad","Ibn Majah","Authenticated"] },

  { id:43, catId:"ramadan", type:"info", order:6, title:{en:"Best times for dua in Ramadan",fr:"Meilleurs moments pour les invocations en Ramadan",de:"Beste Zeiten für Duas im Ramadan"}, content:{en:"Three especially powerful times for dua in Ramadan: 1. Last third of the night / Suhoor time – Allah descends and asks: 'Who calls upon Me?' 2. While fasting – the dua of the fasting person is not rejected. 3. At the moment of breaking the fast (Iftar) – the fasting person has a dua that is answered.",fr:"Trois moments particulièrement puissants pour les invocations en Ramadan : 1. Le dernier tiers de la nuit / Suhoor – Allah descend et demande : 'Qui M'appelle ?' 2. Pendant le jeûne – l'invocation du jeûneur n'est pas rejetée. 3. Au moment de l'Iftar – le jeûneur a une invocation exaucée.",de:"Drei besonders kraftvolle Zeiten für Duas im Ramadan: 1. Letztes Drittel der Nacht / Suhoor-Zeit. 2. Während des Fastens – das Dua des Fastenden wird nicht abgelehnt. 3. Beim Fastenbrechen (Iftar)."}, source:["Sahih Bukhari","At-Tirmidhi"] },

  { id:44, catId:"ramadan", type:"info", order:7, title:{en:"Rajab Dua – Weak Hadith ⚠️",fr:"Invocation de Rajab – Hadith faible ⚠️",de:"Rajab Dua – Schwacher Hadith ⚠️"}, content:{en:"⚠️ Weak Dua: 'Allahumma baarik lanaa fii Rajab wa Sha'ban wa ballighnaa Ramadhan' is a weak hadith and should not be presented as an established sunnah. One may make general dua to reach Ramadan using other authentic wordings.",fr:"⚠️ Invocation faible : 'Allahumma baarik lanaa fii Rajab...' est un hadith faible et ne doit pas être présenté comme une sunna établie.",de:"⚠️ Schwaches Dua: 'Allahumma baarik lanaa fii Rajab...' ist ein schwacher Hadith und sollte nicht als etablierte Sunnah dargestellt werden."}, source:["Classified weak by scholars"] },

  // ── CATEGORY: EID ──
  
  { id:45, catId:"eid", type:"dua", order:1, title:{en:"Eid Takbir – Ibn Mas'ud Version 1",fr:"Takbir de l'Aïd – Ibn Mas'ud Version 1",de:"Eid Takbir – Ibn Mas'ud Version 1"}, arabic:"اَللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ، لَا إِلَـٰهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ وَلِلَّهِ الْحَمْدُ", transliteration:"Allaahu Akbar, Allaahu Akbar, Laa ilaaha illallaah, wallaahu Akbar, Allaahu Akbar wa lillaahil hamd.",
    translation:{en:"Allah is the Greatest, Allah is the Greatest. There is no god but Allah. Allah is the Greatest, Allah is the Greatest, and to Allah belongs all praise.",fr:"Allah est le Plus Grand, Allah est le Plus Grand. Il n'y a pas de dieu sauf Allah. Allah est le Plus Grand, Allah est le Plus Grand, et à Allah appartient toute louange.",de:"Allah ist der Größte, Allah ist der Größte. Es gibt keinen Gott außer Allah. Allah ist der Größte, Allah ist der Größte, und Allah gebührt alles Lob."}, benefit:{en:"The repetition may be 2x or 3x. From the practice of Ibn Mas'ud رضي الله عنه.",fr:"La répétition peut être 2x ou 3x. De la pratique d'Ibn Mas'ud رضي الله عنه.",de:"Die Wiederholung kann 2x oder 3x sein. Aus der Praxis von Ibn Mas'ud رضي الله عنه."}, source:["Ibn Mas'ud – Sahabi practice","Al-Bayhaqi"] },

  { id:46, catId:"eid", type:"dua", order:2, title:{en:"Eid Takbir – Ibn Mas'ud Version 2",fr:"Takbir de l'Aïd – Ibn Mas'ud Version 2",de:"Eid Takbir – Ibn Mas'ud Version 2"}, arabic:"اَللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ، لَا إِلَـٰهَ إِلَّا اللَّهُ، اَللَّهُ أَكْبَرُ وَلِلَّهِ الْحَمْدُ", transliteration:"Allaahu Akbar, Allaahu Akbar, Allaahu Akbar, Laa ilaaha illallaah, Allaahu Akbar wa lillaahil hamd.",
    translation:{en:"Allah is the Greatest, Allah is the Greatest, Allah is the Greatest. There is no god but Allah. Allah is the Greatest, and to Allah belongs all praise.",fr:"Allah est le Plus Grand, Allah est le Plus Grand, Allah est le Plus Grand. Il n'y a pas de dieu sauf Allah. Allah est le Plus Grand, et à Allah appartient toute louange.",de:"Allah ist der Größte, Allah ist der Größte, Allah ist der Größte. Es gibt keinen Gott außer Allah. Allah ist der Größte, und Allah gebührt alles Lob."}, source:["Ibn Mas'ud – Sahabi practice"] },
