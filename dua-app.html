      de: "Nach einer der I'tidal-Varianten 1-4 gesagt. Diese Erweiterung drückt die Unermesslichkeit des Lobes aus – die gesamte Schöpfung füllend." },
    source: ["Sahih Muslim 1067"] },

  { id: 429, catId: "itidal", type: "dua", order: 7,
    title: { en: "I'tidal 6 – filling heavens and earth + worthy of praise and glory", fr: "I'tidal 6 – remplissant cieux et terre + digne de louange et de gloire", de: "I'tidal 6 – Himmel und Erde füllend + würdig des Lobes und der Herrlichkeit" },
    arabic: "مِلْءَ السَّمَاوَاتِ وَمِلْءَ الْأَرْضِ وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ أَهْلَ الثَّنَاءِ وَالْمَجْدِ لَا مَانِعَ لِمَا أَعْطَيْتَ وَلَا مُعْطِيَ لِمَا مَنَعْتَ وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ",
    transliteration: "Mil-as-samaawaati wa mil-al ardhi wa mil-a maa syi-ta min syai-in ba-du ahlats-tsanaa-i wal majdi laa maani-a limaa a-thoita wa laa mu-thiya limaa mana-ta wa laa yanfa-u dzal jaddi minkal jadd.",
    translation: {
      en: "Filling the heavens and earth and whatever You will beyond. You are worthy of praise and glory. None can withhold what You give, and none can give what You withhold. No wealth or status benefits its owner against You.",
      fr: "Remplissant les cieux et la terre et ce que Tu veux au-delà. Tu es digne de louange et de gloire. Nul ne peut retenir ce que Tu donnes, et nul ne peut donner ce que Tu retiens. Aucune richesse ne profite à son possesseur contre Toi.",
      de: "Füllend die Himmel und Erde und was Du willst darüber hinaus. Du bist würdig des Lobes und der Herrlichkeit. Niemand kann zurückhalten was Du gibst und niemand kann geben was Du zurückhältst. Kein Reichtum nützt seinem Besitzer gegen Dich." },
    source: ["Sahih Muslim", "An-Nasai", "Ibn Hibban"] },

  { id: 430, catId: "itidal", type: "dua", order: 8,
    title: { en: "I'tidal 7 – with addition of what is between heavens and earth", fr: "I'tidal 7 – avec ajout de ce qui est entre les cieux et la terre", de: "I'tidal 7 – mit Zusatz was zwischen Himmel und Erde ist" },
    arabic: "مِلْءَ السَّمَاوَاتِ وَمِلْءَ الْأَرْضِ وَمَا بَيْنَهُمَا وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ أَهْلَ الثَّنَاءِ وَالْمَجْدِ لَا مَانِعَ لِمَا أَعْطَيْتَ وَلَا مُعْطِيَ لِمَا مَنَعْتَ وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ",
    transliteration: "Mil-as-samaawaati wa mil-al ardhi wa maa bainahumaa wa mil-a maa syi-ta min syai-in ba-du ahlats-tsanaa-i wal majdi laa maani-a limaa a-thoita wa laa mu-thiya limaa mana-ta wa laa yanfa-u dzal jaddi minkal jadd.",
    translation: {
      en: "Filling the heavens and earth and what is between them and whatever You will beyond. You are worthy of praise and glory. None can withhold what You give, and none can give what You withhold. No wealth benefits its owner against You.",
      fr: "Remplissant les cieux, la terre et ce qui est entre eux et ce que Tu veux au-delà. Tu es digne de louange et de gloire. Nul ne peut retenir ce que Tu donnes, et nul ne peut donner ce que Tu retiens.",
      de: "Füllend die Himmel die Erde und was zwischen ihnen ist und was Du willst darüber hinaus. Du bist würdig des Lobes und der Herrlichkeit. Niemand kann zurückhalten was Du gibst und niemand kann geben was Du zurückhältst." },
    source: ["Sahih Muslim 1072"] },

  { id: 431, catId: "itidal", type: "dua", order: 9,
    title: { en: "I'tidal 8 – most worthy words a servant can say", fr: "I'tidal 8 – les paroles les plus méritoires qu'un serviteur puisse dire", de: "I'tidal 8 – die würdigsten Worte die ein Diener sagen kann" },
    arabic: "مِلْءَ السَّمَاوَاتِ وَمِلْءَ الْأَرْضِ وَمَا بَيْنَهُمَا وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ أَهْلَ الثَّنَاءِ وَالْمَجْدِ أَحَقُّ مَا قَالَ الْعَبْدُ وَكُلُّنَا لَكَ عَبْدٌ اَللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ وَلَا مُعْطِيَ لِمَا مَنَعْتَ وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ",
    transliteration: "Mil-as-samaawaati wa mil-al ardhi wa maa bainahumaa wa mil-a maa syi-ta min syai-in ba-du ahlats-tsanaa-i wal majdi ahaqqu maa qoolal abdu wa kullunaa laka abdun allaahumma laa maani-a limaa a-thoita wa laa mu-thiya limaa mana-ta wa laa yanfa-u dzal jaddi minkal jadd.",
    translation: {
      en: "Filling the heavens, earth and what is between them and whatever You will beyond. You are worthy of praise and glory – the most worthy words a servant can say, and all of us are Your servants. O Allah, none can withhold what You give, none can give what You withhold. No wealth benefits its owner against You.",
      fr: "Remplissant les cieux, la terre et ce qui est entre eux et ce que Tu veux au-delà. Tu es digne de louange et de gloire – les paroles les plus méritoires qu'un serviteur puisse dire, et nous sommes tous Tes serviteurs. Ô Allah, nul ne peut retenir ce que Tu donnes.",
      de: "Füllend die Himmel die Erde und was zwischen ihnen ist und was Du willst darüber hinaus. Du bist würdig des Lobes und der Herrlichkeit – die würdigsten Worte die ein Diener sagen kann und wir alle sind Deine Diener. O Allah niemand kann zurückhalten was Du gibst." },
    source: ["Sahih Muslim 1/346"] },

  { id: 432, catId: "itidal", type: "dua", order: 10,
    title: { en: "I'tidal 9 – filling heavens and earth, worthy of praise", fr: "I'tidal 9 – remplissant cieux et terre, digne de louange", de: "I'tidal 9 – Himmel und Erde füllend würdig des Lobes" },
    arabic: "مِلْءَ السَّمَاوَاتِ وَالْأَرْضِ وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ أَهْلَ الثَّنَاءِ وَالْمَجْدِ أَحَقُّ مَا قَالَ الْعَبْدُ وَكُلُّنَا لَكَ عَبْدٌ اَللَّهُمَّ لَا مَانِعَ لِمَا أَعْطَيْتَ وَلَا مُعْطِيَ لِمَا مَنَعْتَ وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ",
    transliteration: "Mil-as-samaawaati wal ardhi wa mil-a maa syi-ta min syai-in ba-du ahlats-tsanaa-i wal majdi ahaqqu maa qoolal abdu wa kullunaa laka abdun allaahumma laa maani-a limaa a-thoita wa laa mu-thiya limaa mana-ta wa laa yanfa-u dzal jaddi minkal jadd.",
    translation: {
      en: "Filling the heavens and earth and whatever You will beyond. You are worthy of praise and glory – the most worthy words a servant can say, and all of us are Your servants. O Allah, none can withhold what You give, none can give what You withhold. No wealth benefits its owner against You.",
      fr: "Remplissant les cieux et la terre et ce que Tu veux au-delà. Tu es digne de louange et de gloire – les paroles les plus méritoires qu'un serviteur puisse dire, et nous sommes tous Tes serviteurs. Ô Allah, nul ne peut retenir ce que Tu donnes.",
      de: "Füllend die Himmel und Erde und was Du willst darüber hinaus. Du bist würdig des Lobes und der Herrlichkeit – die würdigsten Worte die ein Diener sagen kann und wir alle sind Deine Diener. O Allah niemand kann zurückhalten was Du gibst." },
    source: ["Sahih Muslim 1071"] },

  { id: 433, catId: "itidal", type: "dua", order: 11,
    title: { en: "I'tidal 10 – 30 angels raced to record it – abundant blessed praise", fr: "I'tidal 10 – 30 anges ont rivalisé pour l'enregistrer – louange abondante et bénie", de: "I'tidal 10 – 30 Engel wetteiferten es aufzuzeichnen – reichliches gesegnetes Lob" },
    arabic: "رَبَّنَا وَلَكَ الْحَمْدُ حَمْدًا كَثِيْرًا طَيِّبًا مُبَارَكًا فِيْهِ",
    transliteration: "Robbanaa wa lakal hamdu hamdan katsiron thoyyiban mubaarokan fiihi.",
    translation: {
      en: "Our Lord, and to You belongs all praise – praise that is abundant, good and blessed.",
      fr: "Notre Seigneur, et à Toi toute louange – une louange abondante, bonne et bénie.",
      de: "Unser Herr und Dir gehört aller Lob – Lob das reichlich gut und gesegnet ist." },
    benefit: {
      en: "A man said this after Sami Allahu liman hamidah. After prayer the Prophet asked who said it and said: I saw more than 30 angels racing to see who would record it first. The same dua said in the Istiftah position.",
      fr: "Un homme dit cela après Sami Allahu liman hamidah. Le Prophète dit : J'ai vu plus de 30 anges se précipiter pour voir qui l'enregistrerait en premier.",
      de: "Ein Mann sagte dies nach Sami Allahu liman hamidah. Der Prophet sagte: Ich sah mehr als 30 Engel wetteifern wer es zuerst aufzeichnen würde." },
    source: ["Sahih Bukhari 799"] },

  { id: 434, catId: "itidal", type: "dua", order: 12,
    title: { en: "I'tidal 11 – as our Lord loves and is pleased with", fr: "I'tidal 11 – comme notre Seigneur aime et est satisfait", de: "I'tidal 11 – wie unser Herr liebt und zufrieden ist" },
    arabic: "رَبَّنَا وَلَكَ الْحَمْدُ حَمْدًا كَثِيْرًا طَيِّبًا مُبَارَكًا فِيْهِ مُبَارَكًا عَلَيْهِ كَمَا يُحِبُّ رَبُّنَا وَيَرْضَى",
    transliteration: "Robbanaa wa lakal hamdu hamdan katsiron thoyyiban mubaarokan fiihi mubaarokan alaihi kamaa yuhibbu robbunaa wa yardhoo.",
    translation: {
      en: "Our Lord, and to You belongs all praise – praise that is abundant, good and blessed in it, blessed upon it, as our Lord loves and is pleased with.",
      fr: "Notre Seigneur, et à Toi toute louange – une louange abondante, bonne et bénie en elle, bénie sur elle, comme notre Seigneur aime et est satisfait.",
      de: "Unser Herr und Dir gehört aller Lob – Lob das reichlich gut und gesegnet darin ist gesegnet darauf so wie unser Herr es liebt und damit zufrieden ist." },
    benefit: {
      en: "Extended version of I'tidal 10 – adds blessed upon it and as our Lord loves and is pleased with. Also caused 30+ angels to race to record it. A complete and beautiful expression of praise.",
      fr: "Version étendue de I'tidal 10 – ajoute bénie sur elle et comme notre Seigneur aime et est satisfait. A aussi causé la course de 30+ anges.",
      de: "Erweiterte Version von I'tidal 10 – fügt gesegnet darauf und wie unser Herr es liebt und damit zufrieden ist hinzu. Verursachte auch das Wetteifern von 30+ Engeln." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 435, catId: "itidal", type: "dua", order: 13,
    title: { en: "I'tidal 12 – Li Rabbiyal hamd (only for my Lord is praise)", fr: "I'tidal 12 – Li Rabbiyal hamd (seulement pour mon Seigneur est la louange)", de: "I'tidal 12 – Li Rabbiyal hamd (nur meinem Herrn gehört das Lob)" },
    arabic: "لِرَبِّيَ الْحَمْدُ، لِرَبِّيَ الْحَمْدُ",
    transliteration: "Li robbiyal hamdu, li robbiyal hamdu.",
    translation: {
      en: "To my Lord belongs all praise, to my Lord belongs all praise.",
      fr: "A mon Seigneur appartient toute louange, à mon Seigneur appartient toute louange.",
      de: "Meinem Herrn gehört aller Lob meinem Herrn gehört aller Lob." },
    benefit: {
      en: "The Prophet repeatedly said this in night prayer, standing so long in i'tidal that it equaled the length of his ruku – and his ruku was as long as his first standing when he recited Al-Baqarah. Repeated continuously as a form of extended praise.",
      fr: "Le Prophète répétait cela dans la prière de nuit, debout si longtemps en i'tidal que cela égalait la durée de son ruku – et son ruku était aussi long que son premier débout où il récitait Al-Baqarah.",
      de: "Der Prophet sagte dies wiederholt im Nachtgebet so lange im I'tidal stehend dass es der Länge seines Ruku entsprach – und sein Ruku war so lang wie sein erstes Stehen beim Rezitieren von Al-Baqarah." },
    source: ["Abu Dawud 874", "Sahih Abu Dawud", "Al-Irwa 335"] },

  // ── CATEGORY: DUAS OF SUJUD ──
  { id: 436, catId: "sujud", type: "dua", order: 1,
    title: { en: "Sujud dua 1 – Subhana Rabbiyal A'la (3x)", fr: "Dua du Sujud 1 – Subhana Rabbiyal A'la (3x)", de: "Sujud Dua 1 – Subhana Rabbiyal A'la (3x)" },
    arabic: "سُبْحَانَ رَبِّيَ اْلأَعْلَى",
    transliteration: "Subhaana robbiyal a-laa. (3x)",
    translation: {
      en: "Glory be to my Lord the Most High. (3 times)",
      fr: "Gloire à mon Seigneur le Très-Haut. (3 fois)",
      de: "Gepriesen sei mein Herr der Allerhöchste. (3 Mal)" },
    benefit: {
      en: "The most common and well-known sujud dua. Said minimum 3 times. The Prophet said: make this your sujud when the verse was revealed: Glorify the name of your Lord the Most High (Al-A'la 87:1).",
      fr: "La dua du sujud la plus courante. Dite au minimum 3 fois. Le Prophète dit : faites-en votre sujud quand le verset fut révélé : Glorifiez le nom de votre Seigneur le Très-Haut.",
      de: "Das häufigste und bekannteste Sujud-Dua. Mindestens 3-mal gesagt. Der Prophet sagte: Macht das zu eurem Sujud als der Vers offenbart wurde: Verherrlicht den Namen eures Herrn des Allerhöchsten." },
    source: ["Abu Dawud", "At-Tirmidhi", "An-Nasai", "Ahmad", "Sahih"] },

  { id: 437, catId: "sujud", type: "dua", order: 2,
    title: { en: "Sujud dua 2 – Subhana Rabbiyal A'la wa bihamdih (3x)", fr: "Dua du Sujud 2 – Subhana Rabbiyal A'la wa bihamdih (3x)", de: "Sujud Dua 2 – Subhana Rabbiyal A'la wa bihamdih (3x)" },
    arabic: "سُبْحَانَ رَبِّيَ اْلأَعْلَى وَبِحَمْدِهِ",
    transliteration: "Subhaana robbiyal a-laa wa bihamdih. (3x)",
    translation: {
      en: "Glory be to my Lord the Most High and with His praise. (3 times)",
      fr: "Gloire à mon Seigneur le Très-Haut et par Sa louange. (3 fois)",
      de: "Gepriesen sei mein Herr der Allerhöchste und mit Seinem Lob. (3 Mal)" },
    benefit: {
      en: "Extended version adding praise (wa bihamdih). Both versions are authentic. It is Sunnah to alternate between them.",
      fr: "Version étendue ajoutant la louange (wa bihamdih). Les deux versions sont authentiques. Il est Sunna d'alterner entre elles.",
      de: "Erweiterte Version die Lob (wa bihamdih) hinzufügt. Beide Versionen sind authentisch. Es ist Sunnah zwischen ihnen zu wechseln." },
    source: ["Abu Dawud 870", "Sahih"] },

  { id: 438, catId: "sujud", type: "dua", order: 3,
    title: { en: "Sujud dua 3 – Glory be to You O Allah forgive me", fr: "Dua du Sujud 3 – Gloire à Toi ô Allah pardonne-moi", de: "Sujud Dua 3 – Gepriesen seist Du o Allah vergib mir" },
    arabic: "سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ اَللَّهُمَّ اغْفِرْ لِيْ",
    transliteration: "Subhaanakallaahumma robbanaa wa bihamdika allaahummagh-fir lii.",
    translation: {
      en: "Glory be to You O Allah our Lord and with Your praise. O Allah, forgive me.",
      fr: "Gloire à Toi ô Allah notre Seigneur et par Ta louange. Ô Allah, pardonne-moi.",
      de: "Gepriesen seist Du o Allah unser Herr und mit Deinem Lob. O Allah vergib mir." },
    benefit: {
      en: "Aisha said the Prophet abundantly recited this in ruku and sujud as an explanation of the verse. Combines glorification, praise and seeking forgiveness.",
      fr: "Aisha dit que le Prophète récitait abondamment cela en ruku et sujud comme explication du verset.",
      de: "Aisha sagte der Prophet rezitierte dies reichlich in Ruku und Sujud als Erklärung des Verses." },
    source: ["Sahih Bukhari 817", "Sahih Muslim 484"] },

  { id: 439, catId: "sujud", type: "dua", order: 4,
    title: { en: "Sujud dua 4 – Glory to the Owner of Power and Kingdom", fr: "Dua du Sujud 4 – Gloire au Possesseur de Puissance et de Royaume", de: "Sujud Dua 4 – Gepriesen sei der Besitzer von Macht und Herrschaft" },
    arabic: "سُبْحَانَ ذِي الْجَبَرُوْتِ وَالْمَلَكُوْتِ وَالْكِبْرِيَاءِ وَالْعَظَمَةِ",
    transliteration: "Subhaana dzil jabaruuti, wal malakuuti, wal kibriyaa-i, wal azhomah.",
    translation: {
      en: "Glory be to the Possessor of Power, Dominion, Majesty and Greatness.",
      fr: "Gloire au Possesseur de la Puissance, du Règne, de la Majesté et de la Grandeur.",
      de: "Gepriesen sei der Besitzer der Macht der Herrschaft der Majestät und der Größe." },
    benefit: {
      en: "Same as said in Ruku. Four of Allah's most majestic attributes. The sujud is the most humble position for the servant, making it fitting to glorify Allah's greatest attributes.",
      fr: "Identique à ce qui est dit en Ruku. Quatre des attributs les plus majestueux d'Allah. Le sujud est la position la plus humble.",
      de: "Identisch mit dem im Ruku Gesagten. Vier der majestätischsten Attribute Allahs. Der Sujud ist die demütigste Position für den Diener." },
    source: ["Abu Dawud 1/230", "An-Nasai", "Ahmad", "Sahih Al-Albani"] },

  { id: 440, catId: "sujud", type: "dua", order: 5,
    title: { en: "Sujud dua 5 – Subbuuhun Qudduusun Lord of angels and Jibril", fr: "Dua du Sujud 5 – Subbuuhun Qudduusun Seigneur des anges et de Jibril", de: "Sujud Dua 5 – Subbuuhun Qudduusun Herr der Engel und Jibril" },
    arabic: "سُبُّوْحٌ قُدُّوْسٌ رَبُّ الْمَلَائِكَةِ وَالرُّوْحِ",
    transliteration: "Subbuuhun, qudduusun, robbul malaa-ikati war-ruuh.",
    translation: {
      en: "The Most Glorified, the Most Holy, Lord of the angels and the Spirit (Jibril).",
      fr: "Le Plus Glorifié, le Très Saint, Seigneur des anges et de l'Esprit (Jibril).",
      de: "Der Allverherrlichte der Allerheiligste Herr der Engel und des Geistes (Jibril)." },
    benefit: {
      en: "Same as the Ruku dua and the post-Witr dua. In sujud – the closest position to Allah – using the most exalted forms of praise is especially beautiful.",
      fr: "Identique au dua du Ruku et du post-Witr. En sujud – la position la plus proche d'Allah – utiliser les formes les plus exaltées de louange est particulièrement beau.",
      de: "Identisch mit dem Ruku-Dua und dem Post-Witr-Dua. Im Sujud – der Allah nächsten Position – ist die Verwendung der erhabensten Lobformen besonders schön." },
    source: ["Sahih Muslim 1/533"] },

  { id: 441, catId: "sujud", type: "dua", order: 6,
    title: { en: "Sujud dua 6 – O Allah forgive all my sins great and small", fr: "Dua du Sujud 6 – Ô Allah pardonne tous mes péchés grands et petits", de: "Sujud Dua 6 – O Allah vergib alle meine Sünden groß und klein" },
    arabic: "اَللَّهُمَّ اغْفِرْ لِيْ ذَنْبِيْ كُلَّهُ دِقَّهُ وَجِلَّهُ وَأَوَّلَهُ وَآخِرَهُ وَعَلاَنِيَّتَهُ وَسِرَّهُ",
    transliteration: "Allaahummagh-fir lii dzanbii kullahu diqqohu wa jillahu wa awwalahu wa aakhirohu wa alaaniyyatahu wa sirroh.",
    translation: {
      en: "O Allah, forgive me all my sins – the small and the great, the first and the last, the open and the secret.",
      fr: "Ô Allah, pardonne-moi tous mes péchés – les petits et les grands, les premiers et les derniers, les publics et les secrets.",
      de: "O Allah vergib mir alle meine Sünden – die kleinen und die großen die ersten und die letzten die offenen und die verborgenen." },
    benefit: {
      en: "A comprehensive forgiveness dua covering every category of sin. The sujud is the best position for dua and forgiveness – make abundant dua in it.",
      fr: "Un dua de pardon complet couvrant chaque catégorie de péché. Le sujud est la meilleure position pour la dua et le pardon.",
      de: "Ein umfassendes Vergebungs-Dua das jede Kategorie von Sünden abdeckt. Der Sujud ist die beste Position für Dua und Vergebung." },
    source: ["Sahih Muslim 1/350"] },

  { id: 442, catId: "sujud", type: "dua", order: 7,
    title: { en: "Sujud dua 7 – for You I prostrate, my face prostrates to its Creator", fr: "Dua du Sujud 7 – pour Toi je me prosterne, mon visage se prosterne devant son Créateur", de: "Sujud Dua 7 – für Dich werfe ich mich nieder mein Gesicht wirft sich vor seinem Schöpfer nieder" },
    arabic: "اَللَّهُمَّ لَكَ سَجَدْتُ وَبِكَ آمَنْتُ وَلَكَ أَسْلَمْتُ وَأَنْتَ رَبِّيْ سَجَدَ وَجْهِيْ لِلَّذِيْ خَلَقَهُ وَصَوَّرَهُ فَأَحْسَنَ صُوَرَهُ وَشَقَّ سَمْعَهُ وَبَصَرَهُ تَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِيْنَ",
    transliteration: "Allaahumma laka sajadtu wa bika aamantu wa laka aslamtu wa anta robbii sajada wajhii lilladzii kholaqohu wa showwarohu fa-ahsana shuwarohu wa syaqqo sam-ahu wa bashorohu tabaarokallaahu ahsanul khooliqiin.",
    translation: {
      en: "O Allah, for You I have prostrated, in You I have believed, to You I have submitted, and You are my Lord. My face has prostrated to the One Who created it and fashioned it – making it the best of forms – and Who opened its hearing and sight. Blessed is Allah, the best of creators.",
      fr: "Ô Allah, pour Toi je me suis prosterné, en Toi j'ai cru, à Toi je me suis soumis, et Tu es mon Seigneur. Mon visage s'est prosterné devant Celui qui l'a créé et formé – en faisant la meilleure des formes – et qui a ouvert son ouïe et sa vue. Béni soit Allah, le meilleur des créateurs.",
      de: "O Allah für Dich habe ich mich niedergeworfen in Dir habe ich geglaubt Dir habe ich mich ergeben und Du bist mein Herr. Mein Gesicht hat sich vor dem niedergeworfen der es erschaffen und geformt hat – in der besten Form – und der sein Gehör und Sehvermögen geöffnet hat. Gepriesen sei Allah der beste der Schöpfer." },
    benefit: {
      en: "From the hadith of Ali bin Abi Talib. One of the most complete sujud duas – acknowledging belief, submission, the creation of the body and its faculties. Combines humility with gratitude.",
      fr: "Du hadith d'Ali bin Abi Talib. L'une des duas de sujud les plus complètes – reconnaissant la foi, la soumission, la création du corps et ses facultés.",
      de: "Aus dem Hadith von Ali bin Abi Talib. Eines der vollständigsten Sujud-Duas – Glauben Hingabe die Erschaffung des Körpers und seiner Fähigkeiten anerkennend." },
    source: ["At-Tirmidhi 3423", "At-Tahawi", "Ad-Daraquthni", "Hasan Sahih"] },

  { id: 443, catId: "sujud", type: "dua", order: 8,
    title: { en: "Sujud dua 8 – O Allah make light in my heart, tongue, hearing, sight all around me", fr: "Dua du Sujud 8 – Ô Allah mets de la lumière dans mon coeur, ma langue, mon ouïe, ma vue tout autour de moi", de: "Sujud Dua 8 – O Allah mache Licht in meinem Herzen meiner Zunge meinem Gehör meinem Sehvermögen überall um mich" },
    arabic: "اَللَّهُمَّ اجْعَلْ فِي قَلْبِي نُوْرًا وَفِي لِسَانِي نُوْرًا وَاجْعَلْ فِي سَمْعِي نُورًا وَاجْعَلْ فِي بَصَرِيْ نُوْرًا وَاجْعَلْ مِنْ تَحْتِي نُوْرًا وَاجْعَلْ مِنْ فَوْقِي نُوْرًا وَعَنْ يَمِيْنِي نُوْرًا وَعَنْ يَسَارِي نُوْرًا وَاجْعَلْ أَمَامِي نُوْرًا وَاجْعَلْ خَلْفِي نُوْرًا وَاجْعَلْ فِي نَفْسِيْ نُوْرًا وَأَعْظِمْ لِي نُوْرًا",
    transliteration: "Allaahummaj-al fii qolbii nuuron wa fii lisaanii nuuron waj-al fii sam-ii nuuron waj-al fii bashorii nuuron waj-al min tahtii nuuron waj-al min fauqii nuuron wa an yamiinii nuuron wa an yasaarii nuuron waj-al amaamii nuuron waj-al kholfii nuuron waj-al fii nafsii nuuron wa a-zhim lii nuuron.",
    translation: {
      en: "O Allah, place light in my heart, light in my tongue, light in my hearing, light in my sight, light below me, light above me, light to my right, light to my left, light before me, light behind me, light in my soul, and make the light great for me.",
      fr: "Ô Allah, place de la lumière dans mon coeur, de la lumière dans ma langue, de la lumière dans mon ouïe, de la lumière dans ma vue, de la lumière en dessous de moi, de la lumière au-dessus de moi, de la lumière à ma droite, de la lumière à ma gauche, de la lumière devant moi, de la lumière derrière moi, de la lumière dans mon âme, et rends la lumière grande pour moi.",
      de: "O Allah lege Licht in mein Herz Licht in meine Zunge Licht in mein Gehör Licht in mein Sehvermögen Licht unter mir Licht über mir Licht zu meiner Rechten Licht zu meiner Linken Licht vor mir Licht hinter mir Licht in meine Seele und mache das Licht groß für mich." },
    benefit: {
      en: "Ibn Abbas observed the Prophet saying this in sujud during night prayer. Light is requested in 12 dimensions surrounding the person completely. The same dua can be said after prayer as well.",
      fr: "Ibn Abbas observa le Prophète dire cela en sujud pendant la prière de nuit. La lumière est demandée dans 12 dimensions entourant complètement la personne.",
      de: "Ibn Abbas beobachtete den Propheten dies im Sujud während des Nachtgebets sagen. Licht wird in 12 Dimensionen um die Person herum erbeten." },
    source: ["Sahih Muslim 1791", "An-Nasai 1121"] },

  { id: 444, catId: "sujud", type: "dua", order: 9,
    title: { en: "Sujud dua 9 – Glory be to You O Allah and praise, no deity but You", fr: "Dua du Sujud 9 – Gloire à Toi ô Allah et louange, pas de divinité sauf Toi", de: "Sujud Dua 9 – Gepriesen seist Du o Allah und Lob keine Gottheit außer Dir" },
    arabic: "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ لاَ إِلَـٰهَ إِلاَّ أَنْتَ",
    transliteration: "Subhaanakallaahumma wa bihamdika laa ilaaha illaa anta.",
    translation: {
      en: "Glory be to You O Allah and with Your praise, there is no deity worthy of worship except You.",
      fr: "Gloire à Toi ô Allah et par Ta louange, il n'y a pas de divinité digne d'adoration sauf Toi.",
      de: "Gepriesen seist Du o Allah und mit Deinem Lob es gibt keine Gottheit außer Dir." },
    benefit: {
      en: "Aisha narrated: she looked for the Prophet in the dark and found him in ruku or sujud saying this. A dua combining glorification, praise and tawhid.",
      fr: "Aisha raconta : elle chercha le Prophète dans l'obscurité et le trouva en ruku ou sujud disant cela. Une dua combinant glorification, louange et tawhid.",
      de: "Aisha erzählte: Sie suchte den Propheten im Dunkeln und fand ihn in Ruku oder Sujud dies sagend. Ein Dua das Verherrlichung Lob und Tauhid kombiniert." },
    source: ["Sahih Muslim 1089"] },

  { id: 445, catId: "sujud", type: "dua", order: 10,
    title: { en: "Sujud dua 10 – O Allah forgive what I have hidden and what I have revealed", fr: "Dua du Sujud 10 – Ô Allah pardonne ce que j'ai caché et ce que j'ai révélé", de: "Sujud Dua 10 – O Allah vergib was ich verborgen und was ich offenbart habe" },
    arabic: "اَللَّهُمَّ اغْفِرْ لِي مَا أَسْرَرْتُ وَمَا أَعْلَنْتُ",
    transliteration: "Allaahummagh-fir lii maa asrortu wa maa a-lantu.",
    translation: {
      en: "O Allah, forgive me what I have hidden and what I have revealed.",
      fr: "Ô Allah, pardonne-moi ce que j'ai caché et ce que j'ai révélé.",
      de: "O Allah vergib mir was ich verborgen und was ich offenbart habe." },
    benefit: {
      en: "A concise forgiveness dua covering both hidden and open sins. From the hadith of Aisha. Short but comprehensive – ideal for sujud.",
      fr: "Un dua de pardon concis couvrant les péchés cachés et ouverts. Du hadith d'Aisha. Court mais complet – idéal pour le sujud.",
      de: "Ein prägnantes Vergebungs-Dua das sowohl verborgene als auch offene Sünden abdeckt. Aus dem Hadith von Aisha. Kurz aber umfassend – ideal für den Sujud." },
    source: ["An-Nasai 1124", "Sahih An-Nasai"] },

  { id: 446, catId: "sujud", type: "dua", order: 11,
    title: { en: "Sujud dua 11 – I cannot enumerate Your praise, You are as You praised Yourself", fr: "Dua du Sujud 11 – Je ne peux pas dénombrer Tes louanges, Tu es tel que Tu T'es loué", de: "Sujud Dua 11 – Ich kann Dein Lob nicht zählen Du bist so wie Du Dich gelobt hast" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِرِضَاكَ مِنْ سَخَطِكَ وَبِمُعَافَاتِكَ مِنْ عُقُوْبَتِكَ وَأَعُوْذُ بِكَ مِنْكَ لاَ أُحْصِيْ ثَنَاءً عَلَيْكَ أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ",
    transliteration: "Allaahumma innii a-uudzu biridhooka min sakhothika wa bimu-aafaatika min uquubatika wa a-uudzu bika minka laa uhshii tsanaa-an alaika anta kamaa ats-naita alaa nafsik.",
    translation: {
      en: "O Allah, I seek refuge in Your pleasure from Your anger, in Your pardon from Your punishment, and I seek refuge in You from You. I cannot enumerate Your praise – You are as You have praised Yourself.",
      fr: "Ô Allah, je cherche refuge dans Ta satisfaction contre Ta colère, dans Ton pardon contre Ton châtiment, et je cherche refuge auprès de Toi contre Toi. Je ne peux pas dénombrer Tes louanges – Tu es tel que Tu T'es Toi-même loué.",
      de: "O Allah ich suche Zuflucht in Deinem Wohlgefallen vor Deinem Zorn in Deiner Vergebung vor Deiner Strafe und ich suche Zuflucht bei Dir vor Dir. Ich kann Dein Lob nicht aufzählen – Du bist so wie Du Dich selbst gelobt hast." },
    benefit: {
      en: "The most beautiful praise dua in Islam. Said in sujud and also after Witr. I seek refuge in You from You means: from Your justice, seeking Your mercy. I cannot enumerate Your praise – no matter how much one praises Allah it will never be sufficient.",
      fr: "La plus belle dua de louange en Islam. Dite en sujud et aussi après le Witr. Je cherche refuge auprès de Toi contre Toi signifie : contre Ta justice en cherchant Ta miséricorde.",
      de: "Das schönste Lob-Dua im Islam. Im Sujud und auch nach dem Witr gesagt. Ich suche Zuflucht bei Dir vor Dir bedeutet: vor Deiner Gerechtigkeit und Deine Barmherzigkeit suchend." },
    source: ["Sahih Muslim 1/532"] },

  // ── CATEGORY: DUA BETWEEN TWO PROSTRATIONS ──
  { id: 447, catId: "between_sujud", type: "dua", order: 1,
    title: { en: "Between two sajdahs 1 – Rabbi ighfir li (repeated)", fr: "Entre deux sajdas 1 – Rabbi ighfir li (répété)", de: "Zwischen zwei Sajdas 1 – Rabbi ighfir li (wiederholt)" },
    arabic: "رَبِّ اغْفِرْ لِيْ رَبِّ اغْفِرْ لِيْ",
    transliteration: "Robbigh-fir lii, robbigh-fir lii.",
    translation: {
      en: "My Lord, forgive me. My Lord, forgive me.",
      fr: "Mon Seigneur, pardonne-moi. Mon Seigneur, pardonne-moi.",
      de: "Mein Herr vergib mir. Mein Herr vergib mir." },
    benefit: {
      en: "The shortest and simplest dua between the two prostrations. Repeated twice. The repetition shows the urgency and sincerity of seeking forgiveness.",
      fr: "La dua la plus courte et la plus simple entre les deux prosternations. Répétée deux fois. La répétition montre l'urgence et la sincérité de la recherche du pardon.",
      de: "Das kürzeste und einfachste Dua zwischen den zwei Niederwerfungen. Zweimal wiederholt. Die Wiederholung zeigt die Dringlichkeit und Aufrichtigkeit der Vergebungssuche." },
    source: ["Abu Dawud 1/231", "Sahih Ibn Majah 1/148"] },

  { id: 448, catId: "between_sujud", type: "dua", order: 2,
    title: { en: "Between two sajdahs 2 – 7 requests: forgive, have mercy, mend, raise, guide, protect, provide", fr: "Entre deux sajdas 2 – 7 demandes: pardonne, miséricorde, répare, élève, guide, protège, pourvois", de: "Zwischen zwei Sajdas 2 – 7 Bitten: vergib erbarme heile erhebe leite schütze versorge" },
    arabic: "اَللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَاجْبُرْنِي وَارْفَعْنِي وَاهْدِنِي وَعَافِنِي وَارْزُقْنِي",
    transliteration: "Allaahummagh-fir lii warhamnii wajburnii warfa-nii wahdinii wa afinii warzuqnii.",
    translation: {
      en: "O Allah, forgive me, have mercy on me, mend my affairs, raise my rank, guide me, grant me well-being and provide for me.",
      fr: "Ô Allah, pardonne-moi, fais-moi miséricorde, répare mes affaires, élève mon rang, guide-moi, accorde-moi le bien-être et pourvois à mes besoins.",
      de: "O Allah vergib mir erbarme Dich meiner heile meine Angelegenheiten erhebe meinen Rang leite mich gewähre mir Wohlergehen und versorge mich." },
    benefit: {
      en: "Seven comprehensive requests in one brief dua. Imam An-Nawawi recommended saying all seven. The word wajburnii means to fill what is lacking and to mend what is broken. Also valid to say Rabbi instead of Allahumma.",
      fr: "Sept demandes complètes en un bref dua. Imam An-Nawawi recommanda de dire les sept. Le mot wajburnii signifie combler ce qui manque et réparer ce qui est cassé.",
      de: "Sieben umfassende Bitten in einem kurzen Dua. Imam An-Nawawi empfahl alle sieben zu sagen. Das Wort wajburnii bedeutet zu füllen was fehlt und zu heilen was gebrochen ist." },
    source: ["Abu Dawud 850", "At-Tirmidhi 284", "Ibn Majah 898", "Al-Hakim", "Sahih Al-Albani"] },

  { id: 449, catId: "between_sujud", type: "dua", order: 3,
    title: { en: "Between two sajdahs 3 – 7 requests in different order", fr: "Entre deux sajdas 3 – 7 demandes dans un ordre différent", de: "Zwischen zwei Sajdas 3 – 7 Bitten in anderer Reihenfolge" },
    arabic: "اَللَّهُمَّ اغْفِرْ لِيْ وَارْحَمْنِيْ وَاهْدِنِيْ وَاجْبُرْنِيْ وَعَافِنِيْ وَارْزُقْنِيْ وَارْفَعْنِي",
    transliteration: "Allaahummagh-fir lii warhamnii wahdinii wajburnii wa afinii warzuqnii warfa-nii.",
    translation: {
      en: "O Allah, forgive me, have mercy on me, guide me, mend my affairs, grant me well-being, provide for me and raise my rank.",
      fr: "Ô Allah, pardonne-moi, fais-moi miséricorde, guide-moi, répare mes affaires, accorde-moi le bien-être, pourvois à mes besoins et élève mon rang.",
      de: "O Allah vergib mir erbarme Dich meiner leite mich heile meine Angelegenheiten gewähre mir Wohlergehen versorge mich und erhebe meinen Rang." },
    benefit: {
      en: "Same seven requests as dua 2 but in a different order. Both are authentic from Ibn Abbas. It is Sunnah to alternate between the authentic variants.",
      fr: "Les mêmes sept demandes que la dua 2 mais dans un ordre différent. Les deux sont authentiques d'Ibn Abbas. Il est Sunna d'alterner entre les variantes authentiques.",
      de: "Dieselben sieben Bitten wie Dua 2 aber in anderer Reihenfolge. Beide sind authentisch von Ibn Abbas. Es ist Sunnah zwischen den authentischen Varianten zu wechseln." },
    source: ["Abu Dawud", "At-Tirmidhi", "Ibn Majah", "Sahih At-Tirmidhi 1/90"] },

  { id: 450, catId: "between_sujud", type: "dua", order: 4,
    title: { en: "Between two sajdahs 4 – Rabbi version of 6 requests", fr: "Entre deux sajdas 4 – version Rabbi de 6 demandes", de: "Zwischen zwei Sajdas 4 – Rabbi-Version mit 6 Bitten" },
    arabic: "رَبِّ اغْفِرْ لِي وَارْحَمْنِي وَاجْبُرْنِي وَارْفَعْنِي وَارْزُقْنِي وَاهْدِنِي",
    transliteration: "Robbigh-fir lii warhamnii wajburnii warfa-nii warzuqnii wahdinii.",
    translation: {
      en: "My Lord, forgive me, have mercy on me, mend my affairs, raise my rank, provide for me and guide me.",
      fr: "Mon Seigneur, pardonne-moi, fais-moi miséricorde, répare mes affaires, élève mon rang, pourvois à mes besoins et guide-moi.",
      de: "Mein Herr vergib mir erbarme Dich meiner heile meine Angelegenheiten erhebe meinen Rang versorge mich und leite mich." },
    benefit: {
      en: "Uses Rabbi (My Lord) instead of Allahumma. From the hadith of Ibn Abbas. Six of the seven requests. An-Nawawi said using Allahumma or Rabbi both are correct.",
      fr: "Utilise Rabbi (Mon Seigneur) au lieu d'Allahumma. Du hadith d'Ibn Abbas. Six des sept demandes.",
      de: "Verwendet Rabbi (Mein Herr) statt Allahumma. Aus dem Hadith von Ibn Abbas. Sechs der sieben Bitten." },
    source: ["Ahmad 1/371", "Hasan Al-Arnauth"] },

  { id: 451, catId: "between_sujud", type: "dua", order: 5,
    title: { en: "Between two sajdahs 5 – 7 requests with ajirni (grant reward)", fr: "Entre deux sajdas 5 – 7 demandes avec ajirni (accorder récompense)", de: "Zwischen zwei Sajdas 5 – 7 Bitten mit ajirni (Belohnung gewähren)" },
    arabic: "اَللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَعَافِنِي وَأَجِرْنِي وَارْفَعْنِي وَاهْدِنِي وَارْزُقْنِي",
    transliteration: "Allaahummagh-fir lii warhamnii wa afinii wa ajirnii warfa-nii wahdinii warzuqnii.",
    translation: {
      en: "O Allah, forgive me, have mercy on me, grant me well-being, grant me reward, raise my rank, guide me and provide for me.",
      fr: "Ô Allah, pardonne-moi, fais-moi miséricorde, accorde-moi le bien-être, accorde-moi une récompense, élève mon rang, guide-moi et pourvois à mes besoins.",
      de: "O Allah vergib mir erbarme Dich meiner gewähre mir Wohlergehen gewähre mir Belohnung erhebe meinen Rang leite mich und versorge mich." },
    benefit: {
      en: "Variant replacing wajburnii (mend) with ajirnii (grant reward/protect). Ajirni means both to grant reward and to protect from harm. All five variants are authentic and can be used alternately.",
      fr: "Variante remplaçant wajburnii (réparer) par ajirnii (accorder récompense/protéger). Ajirni signifie à la fois accorder une récompense et protéger du mal.",
      de: "Variante die wajburnii (heilen) durch ajirnii (Belohnung gewähren/schützen) ersetzt. Ajirni bedeutet sowohl Belohnung gewähren als auch vor Schaden schützen." },
    source: ["Al-Majmu Sharh Al-Muhadhdh ab 3/437"] },

  // ── CATEGORY: TASYAHHUD ──
  { id: 452, catId: "tasyahhud", type: "dua", order: 1,
    title: { en: "Tasyahhud 1 – from Ibn Masud (most common)", fr: "Tasyahhud 1 – de Ibn Masud (le plus courant)", de: "Tasyahhud 1 – von Ibn Masud (am häufigsten)" },
    arabic: "اَلتَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ اَلسَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ اَلسَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِيْنَ أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُوْلُهُ",
    transliteration: "At-tahiyyaatu lillaah wash-sholawaatu wath-thoyyibaat. As-salaamu alaika ayyuhan-nabiyyu wa rohmatullaahi wa barokaatuh. As-salaamu alainaa wa alaa ibaadillaahish-shoolihiin. Asyhadu al-laa ilaaha illallaah wa asyhadu anna muhammadan abduhu wa rosuuluh.",
    translation: {
      en: "All greetings, prayers and good things belong to Allah. Peace be upon you O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no deity worthy of worship except Allah, and I bear witness that Muhammad is His servant and messenger.",
      fr: "Tous les hommages, prières et bonnes choses appartiennent à Allah. Que la paix soit sur toi ô Prophète, ainsi que la miséricorde d'Allah et Ses bénédictions. Que la paix soit sur nous et sur les serviteurs vertueux d'Allah. Je témoigne qu'il n'y a pas de divinité sauf Allah, et je témoigne que Muhammad est Son serviteur et Son messager.",
      de: "Alle Grüße Gebete und guten Dinge gehören Allah. Friede sei auf dir o Prophet und die Barmherzigkeit Allahs und Seine Segnungen. Friede sei auf uns und auf den rechtschaffenen Dienern Allahs. Ich bezeuge dass es keine Gottheit außer Allah gibt und ich bezeuge dass Muhammad Sein Diener und Gesandter ist." },
    benefit: {
      en: "The most famous tasyahhud – from Ibn Masud who said the Prophet taught it to him as he taught him the Quran. Used in both the first and final tasyahhud. The Prophet taught many variants – it is Sunnah to alternate between them.",
      fr: "Le tasyahhud le plus célèbre – d'Ibn Masud qui dit que le Prophète le lui enseigna comme il lui enseigna le Coran. Utilisé dans les deux tasyahhud.",
      de: "Der bekannteste Tasyahhud – von Ibn Masud der sagte der Prophet lehrte ihn ihn wie er ihn den Quran lehrte. In beiden Tasyahhud verwendet." },
    source: ["Sahih Bukhari 1/13", "Sahih Muslim 1/301"] },

  { id: 453, catId: "tasyahhud", type: "dua", order: 2,
    title: { en: "Tasyahhud 2 – from Ibn Abbas (with mubaraakat)", fr: "Tasyahhud 2 – de Ibn Abbas (avec mubaraakat)", de: "Tasyahhud 2 – von Ibn Abbas (mit mubaraakat)" },
    arabic: "اَلتَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ اَلسَّلَامُ عَلَيْكَ أَيُّهَا النَّبِىُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ اَلسَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ",
    transliteration: "At-tahiyyaatul mubaarokaatush-sholawaatuth-thoyyibaatu lillaah. As-salaamu alaika ayyuhan-nabiyyu wa rohmatullaahi wa barokaatuh. As-salaamu alainaa wa alaa ibaadillaahish-shoolihiin. Asyhadu al-laa ilaaha illallaah wa asyhadu anna muhammadar-rosuulullaah.",
    translation: {
      en: "All blessed greetings, prayers and good things belong to Allah. Peace be upon you O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no deity worthy of worship except Allah, and I bear witness that Muhammad is the messenger of Allah.",
      fr: "Tous les hommages bénis, prières et bonnes choses appartiennent à Allah. Que la paix soit sur toi ô Prophète, ainsi que la miséricorde et les bénédictions d'Allah. Que la paix soit sur nous et sur les serviteurs vertueux d'Allah. Je témoigne qu'il n'y a pas de divinité sauf Allah, et je témoigne que Muhammad est le messager d'Allah.",
      de: "Alle gesegneten Grüße Gebete und guten Dinge gehören Allah. Friede sei auf dir o Prophet und die Barmherzigkeit Allahs und Seine Segnungen. Friede sei auf uns und auf den rechtschaffenen Dienern Allahs. Ich bezeuge dass es keine Gottheit außer Allah gibt und dass Muhammad der Gesandte Allahs ist." },
    benefit: {
      en: "From Ibn Abbas. Adds Al-Mubaraakat (the blessed) to the list. Also says Rasulullah (Messenger of Allah) instead of Abduhu wa Rasuluh (His servant and messenger).",
      fr: "D'Ibn Abbas. Ajoute Al-Mubaraakat (les bénies) à la liste. Dit aussi Rasulullah au lieu de Abduhu wa Rasuluh.",
      de: "Von Ibn Abbas. Fügt Al-Mubaraakat (die Gesegneten) zur Liste hinzu. Sagt auch Rasulullah statt Abduhu wa Rasuluh." },
    source: ["Sahih Muslim 403"] },

  { id: 454, catId: "tasyahhud", type: "dua", order: 3,
    title: { en: "Tasyahhud 3 – from Ibn Umar (with wahdahu la sharika lah)", fr: "Tasyahhud 3 – de Ibn Umar (avec wahdahu la sharika lah)", de: "Tasyahhud 3 – von Ibn Umar (mit wahdahu la sharika lah)" },
    arabic: "اَلتَّحِيَّاتُ لِلَّهِ الصَّلَوَاتُ الطَّيِّبَاتُ اَلسَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ اَلسَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِيْنَ أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيْكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُوْلُهُ",
    transliteration: "At-tahiyyaatu lillaahish-sholawaatuth-thoyyibaat. As-salaamu alaika ayyuhan-nabiyyu wa rohmatullaahi wa barokaatuh. As-salaamu alainaa wa alaa ibaadillaahish-shoolihiin. Asyhadu al-laa ilaaha illallaah wahdahu laa syariika lah wa asyhadu anna muhammadan abduhu wa rosuuluh.",
    translation: {
      en: "All greetings, prayers and good things belong to Allah. Peace be upon you O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no deity worthy of worship except Allah, alone without partner, and I bear witness that Muhammad is His servant and messenger.",
      fr: "Tous les hommages, prières et bonnes choses appartiennent à Allah. Que la paix soit sur toi ô Prophète. Que la paix soit sur nous et sur les serviteurs vertueux d'Allah. Je témoigne qu'il n'y a pas de divinité sauf Allah, seul sans associé, et que Muhammad est Son serviteur et messager.",
      de: "Alle Grüße Gebete und guten Dinge gehören Allah. Friede sei auf dir o Prophet. Friede sei auf uns und auf den rechtschaffenen Dienern Allahs. Ich bezeuge dass es keine Gottheit außer Allah allein ohne Partner gibt und dass Muhammad Sein Diener und Gesandter ist." },
    benefit: {
      en: "From Ibn Umar. Adds wahdahu la sharika lah (alone without partner) to the shahada – emphasizing tawhid more explicitly.",
      fr: "D'Ibn Umar. Ajoute wahdahu la sharika lah (seul sans associé) à la shahada – soulignant le tawhid plus explicitement.",
      de: "Von Ibn Umar. Fügt wahdahu la sharika lah (allein ohne Partner) zur Shahada hinzu – betont Tauhid expliziter." },
    source: ["Abu Dawud", "Sahih Al-Albani"] },

  { id: 455, catId: "tasyahhud", type: "dua", order: 4,
    title: { en: "Tasyahhud 4 – from Umar ibn al-Khattab (with az-zakiyat)", fr: "Tasyahhud 4 – de Umar ibn al-Khattab (avec az-zakiyat)", de: "Tasyahhud 4 – von Umar ibn al-Khattab (mit az-zakiyat)" },
    arabic: "اَلتَّحِيَّاتُ لِلَّهِ اَلزَّاكِيَاتُ لِلَّهِ اَلطَّيِّبَاتُ الصَّلَوَاتُ لِلَّهِ اَلسَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ اَلسَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِيْنَ أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُ اللَّهِ وَرَسُوْلُهُ",
    transliteration: "At-tahiyyaatu lillaah az-zaakiyaatu lillaah ath-thoyyibaatush-sholawaatu lillaah. As-salaamu alaika ayyuhan-nabiyyu wa rohmatullaah. As-salaamu alainaa wa alaa ibaadillaahish-shoolihiin. Asyhadu al-laa ilaaha illallaah wa asyhadu anna muhammadan abdullaahi wa rosuuluh.",
    translation: {
      en: "All greetings belong to Allah. All pure deeds belong to Allah. All good things and prayers belong to Allah. Peace be upon you O Prophet and the mercy of Allah. Peace be upon us and the righteous servants of Allah. I bear witness that there is no deity except Allah and that Muhammad is the servant of Allah and His messenger.",
      fr: "Tous les hommages appartiennent à Allah. Tous les actes purs appartiennent à Allah. Toutes les bonnes choses et prières appartiennent à Allah. Que la paix soit sur toi ô Prophète et la miséricorde d'Allah. Que la paix soit sur nous et les serviteurs vertueux d'Allah. Je témoigne qu'il n'y a pas de divinité sauf Allah et que Muhammad est le serviteur d'Allah et Son messager.",
      de: "Alle Grüße gehören Allah. Alle reinen Taten gehören Allah. Alle guten Dinge und Gebete gehören Allah. Friede sei auf dir o Prophet und die Barmherzigkeit Allahs. Friede sei auf uns und den rechtschaffenen Dienern Allahs. Ich bezeuge dass es keine Gottheit außer Allah gibt und dass Muhammad der Diener Allahs und Sein Gesandter ist." },
    benefit: {
      en: "Taught by Caliph Umar ibn al-Khattab in a sermon. Adds Az-Zakiyat (pure deeds). Does not include wa barakatuh after wa rahmatullahi. Says Abdullahi (servant of Allah) instead of Abduhu.",
      fr: "Enseigné par le calife Umar ibn al-Khattab dans un sermon. Ajoute Az-Zakiyat (actes purs). N'inclut pas wa barakatuh.",
      de: "Vom Kalifen Umar ibn al-Khattab in einer Predigt gelehrt. Fügt Az-Zakiyat (reine Taten) hinzu. Enthält kein wa barakatuh." },
    source: ["Malik in Al-Muwatta", "Ibn Abi Shaybah", "Sahih Al-Albani"] },

  { id: 456, catId: "tasyahhud", type: "dua", order: 5,
    title: { en: "Tasyahhud 5 – from Abu Musa Al-Ashari", fr: "Tasyahhud 5 – de Abu Musa Al-Ashari", de: "Tasyahhud 5 – von Abu Musa Al-Ashari" },
    arabic: "اَلتَّحِيَّاتُ الطَّيِّبَاتُ الصَّلَوَاتُ لِلَّهِ اَلسَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ اَلسَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِيْنَ أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُوْلُهُ",
    transliteration: "At-tahiyyaatuth-thoyyibaatush-sholawaatu lillaah. As-salaamu alaika ayyuhan-nabiyyu wa rohmatullaahi wa barokaatuh. As-salaamu alainaa wa alaa ibaadillaahish-shoolihiin. Asyhadu al-laa ilaaha illallaah wa asyhadu anna muhammadan abduhu wa rosuuluh.",
    translation: {
      en: "All good greetings and prayers belong to Allah. Peace be upon you O Prophet and the mercy of Allah and His blessings. Peace be upon us and the righteous servants of Allah. I bear witness that there is no deity except Allah and that Muhammad is His servant and messenger.",
      fr: "Tous les bons hommages et prières appartiennent à Allah. Que la paix soit sur toi ô Prophète et la miséricorde d'Allah et Ses bénédictions. Que la paix soit sur nous et les serviteurs vertueux d'Allah. Je témoigne qu'il n'y a pas de divinité sauf Allah et que Muhammad est Son serviteur et messager.",
      de: "Alle guten Grüße und Gebete gehören Allah. Friede sei auf dir o Prophet und die Barmherzigkeit Allahs und Seine Segnungen. Friede sei auf uns und den rechtschaffenen Dienern Allahs. Ich bezeuge dass es keine Gottheit außer Allah gibt und dass Muhammad Sein Diener und Gesandter ist." },
    benefit: {
      en: "From Abu Musa Al-Ashari. The Prophet said: When you sit for tasyahhud let the first thing you say be this. Slightly different word order from the Ibn Masud version.",
      fr: "D'Abu Musa Al-Ashari. Le Prophète dit : Quand vous vous asseyez pour le tasyahhud que la première chose que vous disiez soit ceci.",
      de: "Von Abu Musa Al-Ashari. Der Prophet sagte: Wenn ihr euch für den Tasyahhud setzt lasst das Erste was ihr sagt dies sein." },
    source: ["Sahih Muslim 902"] },

  { id: 457, catId: "tasyahhud", type: "dua", order: 6,
    title: { en: "Tasyahhud 6 – from Aisha (with az-zakiyat, salam upon the Prophet)", fr: "Tasyahhud 6 – de Aisha (avec az-zakiyat, salam sur le Prophète)", de: "Tasyahhud 6 – von Aisha (mit az-zakiyat Friede dem Propheten)" },
    arabic: "اَلتَّحِيَّاتُ الطَّيِّبَاتُ الصَّلَوَاتُ الزَّاكِيَاتُ لِلَّهِ اَلسَّلَامُ عَلَى النَّبِيِّ وَرَحْمَةُ اللَّهِ اَلسَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِيْنَ أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُوْلُهُ",
    transliteration: "At-tahiyyaatuth-thoyyibaatush-sholawaatuz-zaakiyaatu lillaah. As-salaamu alan-nabiyyi wa rohmatullaah. As-salaamu alainaa wa alaa ibaadillaahish-shoolihiin. Asyhadu al-laa ilaaha illallaah wa asyhadu anna muhammadan abduhu wa rosuuluh.",
    translation: {
      en: "All good greetings, prayers and pure deeds belong to Allah. Peace be upon the Prophet and the mercy of Allah. Peace be upon us and the righteous servants of Allah. I bear witness that there is no deity except Allah and that Muhammad is His servant and messenger.",
      fr: "Tous les bons hommages, prières et actes purs appartiennent à Allah. Que la paix soit sur le Prophète et la miséricorde d'Allah. Que la paix soit sur nous et les serviteurs vertueux d'Allah. Je témoigne qu'il n'y a pas de divinité sauf Allah et que Muhammad est Son serviteur et messager.",
      de: "Alle guten Grüße Gebete und reinen Taten gehören Allah. Friede sei auf dem Propheten und die Barmherzigkeit Allahs. Friede sei auf uns und den rechtschaffenen Dienern Allahs. Ich bezeuge dass es keine Gottheit außer Allah gibt und dass Muhammad Sein Diener und Gesandter ist." },
    benefit: {
      en: "From Aisha – taught by her to Al-Qasim ibn Muhammad. Says As-salamu alan-nabiyyi (peace upon the Prophet) in third person instead of alaika (upon you). Adds Az-Zakiyat.",
      fr: "D'Aisha – enseigné par elle à Al-Qasim ibn Muhammad. Dit As-salamu alan-nabiyyi (paix sur le Prophète) à la troisième personne au lieu de alaika (sur toi).",
      de: "Von Aisha – von ihr an Al-Qasim ibn Muhammad gelehrt. Sagt As-salamu alan-nabiyyi (Friede dem Propheten) in dritter Person statt alaika (auf dir)." },
    source: ["Ibn Abi Shaybah Al-Musannaf", "Sahih Al-Albani"] },

  { id: 458, catId: "tasyahhud", type: "dua", order: 7,
    title: { en: "Tasyahhud 7 – from Aisha (shahada before salam, ends with as-salamu alaykum)", fr: "Tasyahhud 7 – de Aisha (shahada avant salam, se termine par as-salamu alaykum)", de: "Tasyahhud 7 – von Aisha (Shahada vor Salam endet mit as-salamu alaykum)" },
    arabic: "اَلتَّحِيَّاتُ الطَّيِّبَاتُ الصَّلَوَاتُ الزَّاكِيَاتُ لِلَّهِ أَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيْكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُوْلُهُ اَلسَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ اَلسَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِيْنَ اَلسَّلَامُ عَلَيْكُمْ",
    transliteration: "At-tahiyyaatuth-thoyyibaatush-sholawaatuz-zaakiyaatu lillaah. Asyhadu al-laa ilaaha illallaah wahdahu laa syariika lah wa asyhadu anna muhammadan abduhu wa rosuuluh. As-salaamu alaika ayyuhan-nabiyyu wa rohmatullaahi wa barokaatuh. As-salaamu alainaa wa alaa ibaadillaahish-shoolihiin. As-salaamu alaikum.",
    translation: {
      en: "All good greetings, prayers and pure deeds belong to Allah. I bear witness that there is no deity except Allah alone without partner, and that Muhammad is His servant and messenger. Peace be upon you O Prophet and the mercy of Allah and His blessings. Peace be upon us and the righteous servants of Allah. Peace be upon you all.",
      fr: "Tous les bons hommages, prières et actes purs appartiennent à Allah. Je témoigne qu'il n'y a pas de divinité sauf Allah seul sans associé, et que Muhammad est Son serviteur et messager. Que la paix soit sur toi ô Prophète et la miséricorde et les bénédictions d'Allah. Que la paix soit sur nous et les serviteurs vertueux d'Allah. Que la paix soit sur vous tous.",
      de: "Alle guten Grüße Gebete und reinen Taten gehören Allah. Ich bezeuge dass es keine Gottheit außer Allah allein ohne Partner gibt und dass Muhammad Sein Diener und Gesandter ist. Friede sei auf dir o Prophet und die Barmherzigkeit Allahs und Seine Segnungen. Friede sei auf uns und den rechtschaffenen Dienern Allahs. Friede sei auf euch allen." },
    benefit: {
      en: "Unique variant from Aisha – the shahada comes BEFORE the salam on the Prophet instead of after. Ends with As-salamu alaykum addressing the congregation. From Malik's Muwatta.",
      fr: "Variante unique d'Aisha – la shahada vient AVANT le salam sur le Prophète au lieu d'après. Se termine par As-salamu alaykum s'adressant à la congrégation.",
      de: "Einzigartige Variante von Aisha – die Shahada kommt VOR dem Salam auf den Propheten statt danach. Endet mit As-salamu alaykum an die Gemeinde gerichtet." },
    source: ["Malik Al-Muwatta 209"] },

  // ── CATEGORY: SALAWAT AFTER TASYAHHUD ──
  { id: 459, catId: "shalawat", type: "dua", order: 1,
    title: { en: "Salawat 1 – from Ka'ab ibn Ujrah (most common)", fr: "Salawat 1 – de Ka'ab ibn Ujrah (le plus courant)", de: "Salawat 1 – von Ka'ab ibn Ujrah (am häufigsten)" },
    arabic: "اَللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيْمَ وَعَلَى آلِ إِبْرَاهِيْمَ إِنَّكَ حَمِيْدٌ مَجِيْدٌ اَللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيْمَ وَعَلَى آلِ إِبْرَاهِيْمَ إِنَّكَ حَمِيْدٌ مَجِيْدٌ",
    transliteration: "Allaahumma sholli alaa muhammad wa alaa aali muhammad kamaa shollaita alaa ibroohiim wa alaa aali ibroohiim innaka hamiidun majiid. Allaahumma baarik alaa muhammad wa alaa aali muhammad kamaa baarokta alaa ibroohiim wa alaa aali ibroohiim innaka hamiidun majiid.",
    translation: {
      en: "O Allah, send blessings upon Muhammad and the family of Muhammad, as You sent blessings upon Ibrahim and the family of Ibrahim. Indeed You are Praiseworthy and Glorious. O Allah, bless Muhammad and the family of Muhammad, as You blessed Ibrahim and the family of Ibrahim. Indeed You are Praiseworthy and Glorious.",
      fr: "Ô Allah, envoie des bénédictions sur Muhammad et la famille de Muhammad, comme Tu en as envoyé sur Ibrahim et la famille d'Ibrahim. Tu es certes Louable et Glorieux. Ô Allah, bénis Muhammad et la famille de Muhammad, comme Tu as béni Ibrahim et la famille d'Ibrahim. Tu es certes Louable et Glorieux.",
      de: "O Allah sende Segnungen auf Muhammad und die Familie Muhammads wie Du Segnungen auf Ibrahim und die Familie Ibrahims gesandt hast. Wahrlich Du bist Lobenswert und Glorreich. O Allah segne Muhammad und die Familie Muhammads wie Du Ibrahim und die Familie Ibrahims gesegnet hast. Wahrlich Du bist Lobenswert und Glorreich." },
    benefit: {
      en: "The most famous salawat – from Ka'ab ibn Ujrah. Includes both Ibrahim and the family of Ibrahim. This is the Ibrahimiyya salawat – said after the final tasyahhud before salam. The Prophet taught many variants and it is Sunnah to alternate.",
      fr: "Le salawat le plus célèbre – de Ka'ab ibn Ujrah. Inclut à la fois Ibrahim et la famille d'Ibrahim. C'est le salawat Ibrahimiyya – dit après le dernier tasyahhud avant le salam.",
      de: "Der bekannteste Salawat – von Ka'ab ibn Ujrah. Umfasst sowohl Ibrahim als auch die Familie Ibrahims. Dies ist der Ibrahimiyya-Salawat – nach dem letzten Tasyahhud vor dem Salam gesagt." },
    source: ["Sahih Bukhari 6/408", "Sahih Muslim"] },

  { id: 460, catId: "shalawat", type: "dua", order: 2,
    title: { en: "Salawat 2 – from Abu Masud Al-Anshari (with fil alameen)", fr: "Salawat 2 – de Abu Masud Al-Anshari (avec fil alameen)", de: "Salawat 2 – von Abu Masud Al-Anshari (mit fil alameen)" },
    arabic: "اَللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى آلِ إِبْرَاهِيمَ وَبَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيمَ فِي الْعَالَمِينَ إِنَّكَ حَمِيدٌ مَجِيدٌ",
    transliteration: "Allaahumma sholli alaa muhammad wa alaa aali muhammad kamaa shollaita alaa aali ibroohiim. Wa baarik alaa muhammad wa alaa aali muhammad kamaa baarokta alaa aali ibroohiim. Fil aalamiin innaka hamiidun majiid.",
    translation: {
      en: "O Allah, send blessings upon Muhammad and the family of Muhammad as You sent blessings upon the family of Ibrahim. And bless Muhammad and the family of Muhammad as You blessed the family of Ibrahim – among all the worlds. Indeed You are Praiseworthy and Glorious.",
      fr: "Ô Allah, envoie des bénédictions sur Muhammad et la famille de Muhammad comme Tu en as envoyé sur la famille d'Ibrahim. Et bénis Muhammad et la famille de Muhammad comme Tu as béni la famille d'Ibrahim – parmi tous les mondes. Tu es certes Louable et Glorieux.",
      de: "O Allah sende Segnungen auf Muhammad und die Familie Muhammads wie Du Segnungen auf die Familie Ibrahims gesandt hast. Und segne Muhammad und die Familie Muhammads wie Du die Familie Ibrahims gesegnet hast – unter allen Welten. Wahrlich Du bist Lobenswert und Glorreich." },
    benefit: {
      en: "Adds fil alameen (among all the worlds) before the final praise. Says ala ali Ibrahim (upon the family of Ibrahim) instead of ala Ibrahim wa ala ali Ibrahim.",
      fr: "Ajoute fil alameen (parmi tous les mondes) avant la louange finale. Dit ala ali Ibrahim au lieu de ala Ibrahim wa ala ali Ibrahim.",
      de: "Fügt fil alameen (unter allen Welten) vor dem abschließenden Lob hinzu. Sagt ala ali Ibrahim statt ala Ibrahim wa ala ali Ibrahim." },
    source: ["Malik Al-Muwatta", "Ahmad", "An-Nasai", "Sahih Al-Arnauth"] },

  { id: 461, catId: "shalawat", type: "dua", order: 3,
    title: { en: "Salawat 3 – from Abu Masud (with an-nabiyyil ummiyyi)", fr: "Salawat 3 – de Abu Masud (avec an-nabiyyil ummiyyi)", de: "Salawat 3 – von Abu Masud (mit an-nabiyyil ummiyyi)" },
    arabic: "اَللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ النَّبِيِّ الأُمِّيِّ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى آلِ إِبْرَاهِيمَ وَبَارِكْ عَلَى مُحَمَّدٍ النَّبِيِّ الأُمِّيِّ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيمَ فِي الْعَالَمِينَ إِنَّكَ حَمِيدٌ مَجِيدٌ",
    transliteration: "Allaahumma sholli alaa muhammad an-nabiyyil ummiyyi wa alaa aali muhammad kamaa shollaita alaa aali ibroohiim. Wa baarik alaa muhammad an-nabiyyil ummiyyi wa alaa aali muhammad kamaa baarokta alaa aali ibroohiim. Fil aalamiin innaka hamiidun majiid.",
    translation: {
      en: "O Allah, send blessings upon Muhammad the unlettered Prophet and the family of Muhammad as You sent blessings upon the family of Ibrahim. And bless Muhammad the unlettered Prophet and the family of Muhammad as You blessed the family of Ibrahim – among all the worlds. Indeed You are Praiseworthy and Glorious.",
      fr: "Ô Allah, envoie des bénédictions sur Muhammad le Prophète illettré et la famille de Muhammad comme Tu en as envoyé sur la famille d'Ibrahim. Et bénis Muhammad le Prophète illettré et la famille de Muhammad. Tu es certes Louable et Glorieux.",
      de: "O Allah sende Segnungen auf Muhammad den ungelehrten Propheten und die Familie Muhammads wie Du Segnungen auf die Familie Ibrahims gesandt hast. Und segne Muhammad den ungelehrten Propheten und die Familie Muhammads. Wahrlich Du bist Lobenswert und Glorreich." },
    benefit: {
      en: "Adds an-nabiyyil ummiyyi (the unlettered Prophet) as a title for the Prophet. The unlettered (ummi) means he did not read or write – emphasizing that the Quran is a miracle, not from human learning.",
      fr: "Ajoute an-nabiyyil ummiyyi (le Prophète illettré) comme titre pour le Prophète. L'illettré signifie qu'il ne lisait ni n'écrivait – soulignant que le Coran est un miracle.",
      de: "Fügt an-nabiyyil ummiyyi (der ungelehrte Prophet) als Titel für den Propheten hinzu. Ungelehrt bedeutet er konnte nicht lesen oder schreiben – betont dass der Quran ein Wunder ist." },
    source: ["Carasholat.com", "Abu Masud Al-Anshari"] },

  { id: 462, catId: "shalawat", type: "dua", order: 4,
    title: { en: "Salawat 4 – from Abu Talha (combined salli and barik)", fr: "Salawat 4 – de Abu Talha (salli et barik combinés)", de: "Salawat 4 – von Abu Talha (salli und barik kombiniert)" },
    arabic: "اَللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ وَبَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ وَبَارَكْتَ عَلَى إِبْرَاهِيمَ وَآلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ",
    transliteration: "Allaahumma sholli alaa muhammad wa alaa aali muhammad wa baarik alaa muhammad wa alaa aali muhammad kamaa shollaita wa baarokta alaa ibroohiim wa aali ibroohiim innaka hamiidun majiid.",
    translation: {
      en: "O Allah, send blessings upon Muhammad and the family of Muhammad and bless Muhammad and the family of Muhammad, as You sent blessings and blessed Ibrahim and the family of Ibrahim. Indeed You are Praiseworthy and Glorious.",
      fr: "Ô Allah, envoie des bénédictions sur Muhammad et la famille de Muhammad et bénis Muhammad et la famille de Muhammad, comme Tu as envoyé des bénédictions et béni Ibrahim et la famille d'Ibrahim. Tu es certes Louable et Glorieux.",
      de: "O Allah sende Segnungen auf Muhammad und die Familie Muhammads und segne Muhammad und die Familie Muhammads wie Du Segnungen gesandt und Ibrahim und die Familie Ibrahims gesegnet hast. Wahrlich Du bist Lobenswert und Glorreich." },
    benefit: {
      en: "Unique structure – first mentions salli and barik for Muhammad, then combines both kamaa shollaita wa barakta for Ibrahim in one phrase. From Abu Talha.",
      fr: "Structure unique – mentionne d'abord salli et barik pour Muhammad, puis combine les deux kamaa shollaita wa barakta pour Ibrahim en une phrase.",
      de: "Einzigartige Struktur – erwähnt zuerst salli und barik für Muhammad dann kombiniert beide kamaa shollaita wa barakta für Ibrahim in einem Satz." },
    source: ["An-Nasai", "At-Tahawi", "Sahih chain"] },

  { id: 463, catId: "shalawat", type: "dua", order: 5,
    title: { en: "Salawat 5 – upon Muhammad, his wives and descendants", fr: "Salawat 5 – sur Muhammad, ses épouses et ses descendants", de: "Salawat 5 – auf Muhammad seine Frauen und Nachkommen" },
    arabic: "اَللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى أَزْوَاجِهِ وَذُرِّيَّتِهِ كَمَا صَلَّيْتَ عَلَى آلِ إِبْرَاهِيْمَ وَبَارِكْ عَلَى مُحَمَّدٍ وَعَلَى أَزْوَاجِهِ وَذُرِّيَّتِهِ كَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيْمَ إِنَّكَ حَمِيْدٌ مَجِيْدٌ",
    transliteration: "Allaahumma sholli alaa muhammad wa alaa azwaajihi wa dzurriyyatihi kamaa shollaita alaa aali ibroohiim. Wa baarik alaa muhammad wa alaa azwaajihi wa dzurriyyatihi kamaa baarokta alaa aali ibroohiim innaka hamiidun majiid.",
    translation: {
      en: "O Allah, send blessings upon Muhammad and his wives and descendants as You sent blessings upon the family of Ibrahim. And bless Muhammad and his wives and descendants as You blessed the family of Ibrahim. Indeed You are Praiseworthy and Glorious.",
      fr: "Ô Allah, envoie des bénédictions sur Muhammad et ses épouses et descendants comme Tu en as envoyé sur la famille d'Ibrahim. Et bénis Muhammad et ses épouses et descendants comme Tu as béni la famille d'Ibrahim. Tu es certes Louable et Glorieux.",
      de: "O Allah sende Segnungen auf Muhammad und seine Frauen und Nachkommen wie Du Segnungen auf die Familie Ibrahims gesandt hast. Und segne Muhammad und seine Frauen und Nachkommen wie Du die Familie Ibrahims gesegnet hast. Wahrlich Du bist Lobenswert und Glorreich." },
    benefit: {
      en: "Specifically mentions azwajihi (his wives) and dhurriyyatihi (his descendants) instead of the general ali Muhammad (family of Muhammad). More specific in its scope.",
      fr: "Mentionne spécifiquement azwajihi (ses épouses) et dhurriyyatihi (ses descendants) au lieu du général ali Muhammad.",
      de: "Erwähnt speziell azwajihi (seine Frauen) und dhurriyyatihi (seine Nachkommen) statt des allgemeinen ali Muhammad." },
    source: ["Sahih Bukhari 6/407", "Sahih Muslim 1/306"] },

  { id: 464, catId: "shalawat", type: "dua", order: 6,
    title: { en: "Salawat 6 – from Amr ibn Hazm (wives, descendants and household)", fr: "Salawat 6 – de Amr ibn Hazm (épouses, descendants et maisonnée)", de: "Salawat 6 – von Amr ibn Hazm (Frauen Nachkommen und Haushalt)" },
    arabic: "اَللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى أَهْلِ بَيْتِهِ وَعَلَى أَزْوَاجِهِ وَذُرِّيَّتِهِ كَمَا صَلَّيْتَ عَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ وَبَارِكْ عَلَى مُحَمَّدٍ وَعَلَى أَهْلِ بَيْتِهِ وَعَلَى أَزْوَاجِهِ وَذُرِّيَّتِهِ كَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ",
    transliteration: "Allaahumma sholli alaa muhammad wa alaa ahli baitihi wa alaa azwaajihi wa dzurriyyatihi kamaa shollaita alaa aali ibroohiim innaka hamiidun majiid. Wa baarik alaa muhammad wa alaa ahli baitihi wa alaa azwaajihi wa dzurriyyatihi kamaa baarokta alaa aali ibroohiim innaka hamiidun majiid.",
    translation: {
      en: "O Allah, send blessings upon Muhammad and his household and his wives and descendants as You sent blessings upon the family of Ibrahim. Indeed You are Praiseworthy and Glorious. And bless Muhammad and his household and his wives and descendants as You blessed the family of Ibrahim. Indeed You are Praiseworthy and Glorious.",
      fr: "Ô Allah, envoie des bénédictions sur Muhammad et sa maisonnée et ses épouses et descendants comme Tu en as envoyé sur la famille d'Ibrahim. Tu es certes Louable et Glorieux. Et bénis Muhammad et sa maisonnée et ses épouses et descendants comme Tu as béni la famille d'Ibrahim. Tu es certes Louable et Glorieux.",
      de: "O Allah sende Segnungen auf Muhammad und seinen Haushalt und seine Frauen und Nachkommen wie Du Segnungen auf die Familie Ibrahims gesandt hast. Wahrlich Du bist Lobenswert und Glorreich. Und segne Muhammad und seinen Haushalt und seine Frauen und Nachkommen. Wahrlich Du bist Lobenswert und Glorreich." },
    benefit: {
      en: "The most inclusive salawat – adds ahl al-bait (household) alongside wives and descendants. The innaka hameedun majeed appears twice – after salli and after barik. From Amr ibn Hazm.",
      fr: "Le salawat le plus inclusif – ajoute ahl al-bait (maisonnée) aux côtés des épouses et descendants. Innaka hameedun majeed apparaît deux fois.",
      de: "Der umfassendste Salawat – fügt ahl al-bait (Haushalt) neben Frauen und Nachkommen hinzu. Innaka hameedun majeed erscheint zweimal." },
    source: ["Ahmad", "Abdurrazzaq Al-Musannaf", "At-Tahawi", "Sahih chain"] },

  // ── CATEGORY: DUAS AFTER FINAL TASYAHHUD BEFORE SALAM ──
  { id: 465, catId: "before_salam", type: "dua", order: 1,
    title: { en: "Protection from 4 things – grave, hell, life/death trials, Dajjal (version 1)", fr: "Protection contre 4 choses – tombe, enfer, épreuves vie/mort, Dajjal (version 1)", de: "Schutz vor 4 Dingen – Grab Hölle Lebens/Todesprüfungen Dajjal (Version 1)" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنْ عَذَابِ الْقَبْرِ وَمِنْ عَذَابِ جَهَنَّمَ وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ وَمِنْ شَرِّ فِتْنَةِ الْمَسِيْحِ الدَّجَّالِ",
    transliteration: "Allaahumma innii a-uudzu bika min adzaabil qobr wa min adzaabi jahannam wa min fitnatil mahyaa wal mamaat wa min syarri fitnatil masiihid-dajjaal.",
    translation: {
      en: "O Allah, I seek refuge in You from the punishment of the grave, from the punishment of Hellfire, from the trials of life and death, and from the evil of the trial of the False Messiah (Dajjal).",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre le châtiment de la tombe, contre le châtiment de l'Enfer, contre les épreuves de la vie et de la mort, et contre le mal de l'épreuve du faux Messie (Dajjal).",
      de: "O Allah ich suche Zuflucht bei Dir vor der Strafe des Grabes vor der Höllenstrafe vor den Prüfungen des Lebens und des Todes und vor dem Bösen der Prüfung des falschen Messias (Dajjal)." },
    benefit: {
      en: "The Prophet commanded: When one of you finishes tasyahhud, seek refuge from four things. This is the best time for dua in prayer – the end of the final tasyahhud before salam.",
      fr: "Le Prophète a commandé : Quand l'un de vous termine le tasyahhud, cherchez refuge contre quatre choses. C'est le meilleur moment pour la dua en prière.",
      de: "Der Prophet befahl: Wenn einer von euch den Tasyahhud beendet sucht Zuflucht vor vier Dingen. Dies ist der beste Zeitpunkt für Dua im Gebet." },
    source: ["Sahih Bukhari 2/102", "Sahih Muslim 1/412"] },

  { id: 466, catId: "before_salam", type: "dua", order: 2,
    title: { en: "Protection from 4 things – hell first (version 2)", fr: "Protection contre 4 choses – enfer en premier (version 2)", de: "Schutz vor 4 Dingen – Hölle zuerst (Version 2)" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ وَمِنْ عَذَابِ الْقَبْرِ وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ وَمِنْ شَرِّ فِتْنَةِ الْمَسِيْحِ الدَّجَّالِ",
    transliteration: "Allaahumma innii a-uudzu bika min adzaabi jahannam wa min adzaabil qobr wa min fitnatil mahyaa wal mamaat wa min syarri fitnatil masiihid-dajjaal.",
    translation: {
      en: "O Allah, I seek refuge in You from the punishment of Hellfire, from the punishment of the grave, from the trials of life and death, and from the evil of the trial of the False Messiah (Dajjal).",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre le châtiment de l'Enfer, contre le châtiment de la tombe, contre les épreuves de la vie et de la mort, et contre le mal du faux Messie (Dajjal).",
      de: "O Allah ich suche Zuflucht bei Dir vor der Höllenstrafe vor der Strafe des Grabes vor den Prüfungen des Lebens und des Todes und vor dem Bösen des falschen Messias (Dajjal)." },
    benefit: {
      en: "Variant with Hellfire mentioned first before the grave. Both orders are authentic – the Prophet mentioned these in different sequences. It is Sunnah to alternate between variants.",
      fr: "Variante avec l'Enfer mentionné en premier avant la tombe. Les deux ordres sont authentiques.",
      de: "Variante mit der Hölle zuerst vor dem Grab erwähnt. Beide Reihenfolgen sind authentisch." },
    source: ["Sahih Muslim 588"] },

  { id: 467, catId: "before_salam", type: "dua", order: 3,
    title: { en: "Protection from 4 things – concise version (version 3)", fr: "Protection contre 4 choses – version concise (version 3)", de: "Schutz vor 4 Dingen – knappe Version (Version 3)" },
    arabic: "اَللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ وَعَذَابِ النَّارِ وَفِتْنَةِ الْمَحْيَا وَالْمَمَاتِ وَشَرِّ الْمَسِيحِ الدَّجَّالِ",
    transliteration: "Allaahumma innii a-uudzu bika min adzaabil qobr wa adzaabin-naar wa fitnatil mahyaa wal mamaat wa syarril masiihid-dajjaal.",
    translation: {
      en: "O Allah, I seek refuge in You from the punishment of the grave, the punishment of the Fire, the trials of life and death, and the evil of the False Messiah.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre le châtiment de la tombe, le châtiment du Feu, les épreuves de la vie et de la mort, et le mal du faux Messie.",
      de: "O Allah ich suche Zuflucht bei Dir vor der Strafe des Grabes der Strafe des Feuers den Prüfungen des Lebens und des Todes und dem Bösen des falschen Messias." },
    benefit: {
      en: "More concise version – drops min before some items and shortens the last phrase. Says an-naar (the fire) instead of jahannam. All three versions of the four protection duas are authentic.",
      fr: "Version plus concise. Dit an-naar (le feu) au lieu de jahannam. Les trois versions sont authentiques.",
      de: "Knappere Version. Sagt an-naar (das Feuer) statt jahannam. Alle drei Versionen sind authentisch." },
    source: ["Sahih Muslim 588"] },

  { id: 468, catId: "before_salam", type: "dua", order: 4,
    title: { en: "Protection from grave, Dajjal, life/death + sins and debts", fr: "Protection contre tombe, Dajjal, vie/mort + péchés et dettes", de: "Schutz vor Grab Dajjal Leben/Tod + Sünden und Schulden" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنْ عَذَابِ الْقَبْرِ وَأَعُوْذُ بِكَ مِنْ فِتْنَةِ الْمَسِيْحِ الدَّجَّالِ وَأَعُوْذُ بِكَ مِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْمَأْثَمِ وَالْمَغْرَمِ",
    transliteration: "Allaahumma innii a-uudzu bika min adzaabil qobr wa a-uudzu bika min fitnatil masiihid-dajjaal wa a-uudzu bika min fitnatil mahyaa wal mamaat. Allaahumma innii a-uudzu bika minal ma-tsami wal maghrom.",
    translation: {
      en: "O Allah, I seek refuge in You from the punishment of the grave, I seek refuge in You from the trial of the False Messiah, I seek refuge in You from the trials of life and death. O Allah, I seek refuge in You from sin and debt.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre le châtiment de la tombe, contre l'épreuve du faux Messie, contre les épreuves de la vie et de la mort. Ô Allah, je cherche refuge auprès de Toi contre le péché et la dette.",
      de: "O Allah ich suche Zuflucht bei Dir vor der Strafe des Grabes vor der Prüfung des falschen Messias vor den Prüfungen des Lebens und des Todes. O Allah ich suche Zuflucht bei Dir vor Sünde und Schulden." },
    benefit: {
      en: "Adds a fifth protection – from sin (maan) and debt (maghram). When asked why he sought refuge from debt, the Prophet said: When a person is in debt he tells lies and breaks promises.",
      fr: "Ajoute une cinquième protection – contre le péché et la dette. Quand on lui demanda pourquoi il cherchait refuge contre la dette, le Prophète dit : Quand une personne est endettée elle ment et rompt ses promesses.",
      de: "Fügt einen fünften Schutz hinzu – vor Sünde und Schulden. Als man fragte warum er Zuflucht vor Schulden suche sagte der Prophet: Wenn eine Person Schulden hat lügt sie und bricht Versprechen." },
    source: ["Sahih Bukhari 1/202", "Sahih Muslim 1/412"] },

  { id: 469, catId: "before_salam", type: "dua", order: 5,
    title: { en: "I have wronged myself greatly – Abu Bakr's dua", fr: "Je me suis grandement injustié – la dua d'Abu Bakr", de: "Ich habe mir selbst großes Unrecht getan – Abu Bakrs Dua" },
    arabic: "اَللَّهُمَّ إِنِّيْ ظَلَمْتُ نَفْسِيْ ظُلْمًا كَثِيْرًا وَلاَ يَغْفِرُ الذُّنُوْبَ إِلاَّ أَنْتَ فَاغْفِرْ لِيْ مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِيْ إِنَّكَ أَنْتَ الْغَفُوْرُ الرَّحِيْمُ",
    transliteration: "Allaahumma innii zholamtu nafsii zhulman katsiiron wa laa yaghfirudz-dzunuuba illaa anta faghfir lii maghfirotan min indika warhamnii innaka antal ghofuurur-rohiim.",
    translation: {
      en: "O Allah, I have greatly wronged myself and none forgives sins except You. So grant me forgiveness from Yourself and have mercy on me. Indeed You are the Forgiving, the Merciful.",
      fr: "Ô Allah, je me suis grandement injustié et personne ne pardonne les péchés sauf Toi. Accorde-moi donc le pardon de Ta part et fais-moi miséricorde. Tu es certes le Pardonneur, le Miséricordieux.",
      de: "O Allah ich habe mir selbst großes Unrecht getan und niemand vergibt Sünden außer Dir. So gewähre mir Vergebung von Dir und erbarme Dich meiner. Wahrlich Du bist der Vergebende der Barmherzige." },
    benefit: {
      en: "Abu Bakr As-Siddiq asked the Prophet to teach him a dua to say in prayer. The Prophet taught him this. One of the most heartfelt forgiveness duas – acknowledging complete personal failure and total dependence on Allah's mercy.",
      fr: "Abu Bakr As-Siddiq a demandé au Prophète de lui enseigner une dua à dire en prière. Le Prophète lui a enseigné cela.",
      de: "Abu Bakr As-Siddiq bat den Propheten ihm ein Dua für das Gebet zu lehren. Der Prophet lehrte ihm dies." },
    source: ["Sahih Bukhari 8/168", "Sahih Muslim 4/2078"] },

  { id: 470, catId: "before_salam", type: "dua", order: 6,
    title: { en: "O Allah I ask You by Your being the One the Eternal – forgive my sins", fr: "Ô Allah je Te demande par Ton être l'Unique l'Éternel – pardonne mes péchés", de: "O Allah ich bitte Dich durch Dein Sein der Eine der Ewige – vergib meine Sünden" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ يَا اَللَّهُ بِأَنَّكَ الْوَاحِدُ اْلأَحَدُ الصَّمَدُ الَّذِيْ لَمْ يَلِدْ وَلَمْ يُوْلَدْ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ أَنْ تَغْفِرَ لِيْ ذُنُوْبِيْ إِنَّكَ أَنْتَ الْغَفُوْرُ الرَّحِيْمُ",
    transliteration: "Allaahumma innii as-aluka yaa allaah bi-annakal waahidul ahadush-shomad alladzii lam yalid wa lam yuulad wa lam yakun lahu kufuwan ahad an taghfiro lii dzunuubii innaka antal ghofuurur-rohiim.",
    translation: {
      en: "O Allah, I ask You O Allah, bearing witness that You are the One, the Unique, the Eternal Who neither begets nor was begotten and there is none comparable to Him – to forgive my sins. Indeed You are the Forgiving, the Merciful.",
      fr: "Ô Allah, je Te demande ô Allah, en témoignant que Tu es l'Unique, l'Un, l'Éternel qui n'engendre pas et n'a pas été engendré et nul n'est comparable à Lui – de pardonner mes péchés. Tu es certes le Pardonneur, le Miséricordieux.",
      de: "O Allah ich bitte Dich o Allah bezeugend dass Du der Eine der Einzige der Ewige bist der weder zeugt noch gezeugt wurde und dem niemand gleich ist – meine Sünden zu vergeben. Wahrlich Du bist der Vergebende der Barmherzige." },
    benefit: {
      en: "The Prophet heard a man saying this in tasyahhud and said three times: He has been forgiven, he has been forgiven, he has been forgiven. Based on Surah Al-Ikhlas – asking by Allah's attributes of perfect oneness.",
      fr: "Le Prophète entendit un homme dire cela en tasyahhud et dit trois fois : Il a été pardonné, il a été pardonné, il a été pardonné. Basé sur Sourate Al-Ikhlas.",
      de: "Der Prophet hörte einen Mann dies im Tasyahhud sagen und sagte dreimal: Er wurde vergeben er wurde vergeben er wurde vergeben. Basiert auf Sure Al-Ikhlas." },
    source: ["An-Nasai 3/52", "Ahmad 4/338", "Sahih Al-Albani"] },

  { id: 471, catId: "before_salam", type: "dua", order: 7,
    title: { en: "O Allah all praise is Yours – al-Mannan, Ya Hayyu Ya Qayyum – Paradise and refuge from Fire", fr: "Ô Allah toute louange T'appartient – al-Mannan, Ya Hayyu Ya Qayyum – Paradis et refuge du Feu", de: "O Allah aller Lob gehört Dir – al-Mannan Ya Hayyu Ya Qayyum – Paradies und Schutz vor dem Feuer" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ بِأَنَّ لَكَ الْحَمْدَ لاَ إِلَـٰهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيْكَ لَكَ اَلْمَنَّانُ يَا بَدِيْعَ السَّمَاوَاتِ وَاْلأَرْضِ يَا ذَا الْجَلاَلِ وَاْلإِكْرَامِ يَا حَيُّ يَا قَيُّوْمُ إِنِّيْ أَسْأَلُكَ الْجَنَّةَ وَأَعُوْذُ بِكَ مِنَ النَّارِ",
    transliteration: "Allaahumma innii as-aluka bi-anna lakal hamda laa ilaaha illaa anta wahdaka laa syariika lak al mannaan yaa badii-as-samaawaati wal ardh yaa dzal jalaali wal ikroom yaa hayyu yaa qoyyuum innii as-alukal jannah wa a-uudzu bika minan-naar.",
    translation: {
      en: "O Allah I ask You – for all praise belongs to You, there is no deity except You alone without partner, the Bestower of blessings, O Originator of the heavens and earth, O Possessor of Majesty and Honor, O Ever-Living O Sustainer – I ask You for Paradise and seek refuge in You from the Fire.",
      fr: "Ô Allah je Te demande – car toute louange T'appartient, il n'y a pas de divinité sauf Toi seul sans associé, le Grand Bienfaiteur, Ô Créateur des cieux et de la terre, Ô Possesseur de Majesté et d'Honneur, Ô Vivant Ô Subsistant – je Te demande le Paradis et cherche refuge contre le Feu.",
      de: "O Allah ich bitte Dich – denn aller Lob gehört Dir es gibt keine Gottheit außer Dir allein ohne Partner der große Wohltäter o Schöpfer der Himmel und Erde o Besitzer der Majestät und Ehre o Ewig Lebender o Beständiger – ich bitte Dich um das Paradies und suche Zuflucht vor dem Feuer." },
    benefit: {
      en: "Contains multiple of Allah's greatest names. Al-Mannan means the Bestower of great favors. The scholars say this dua contains the Ism Al-Adhm (Greatest Name of Allah) – when asked by it Allah grants.",
      fr: "Contient plusieurs des plus grands noms d'Allah. Al-Mannan signifie le Grand Bienfaiteur. Les savants disent que ce dua contient l'Ism Al-Adhm.",
