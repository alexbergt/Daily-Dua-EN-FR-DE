      de: "Enthält mehrere der größten Namen Allahs. Al-Mannan bedeutet der große Wohltäter. Die Gelehrten sagen dieses Dua enthält den Ism Al-Adhm." },
    source: ["The four Sunan collectors", "Sahih Ibn Majah 2/329"] },

  { id: 472, catId: "before_salam", type: "dua", order: 8,
    title: { en: "O Allah forgive my past and future sins, hidden and open", fr: "Ô Allah pardonne mes péchés passés et futurs, cachés et ouverts", de: "O Allah vergib meine vergangenen und zukünftigen Sünden verborgene und offene" },
    arabic: "اَللَّهُمَّ اغْفِرْ لِيْ مَا قَدَّمْتُ وَمَا أَخَّرْتُ وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ وَمَا أَسْرَفْتُ وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّيْ أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ لاَ إِلَـٰهَ إِلاَّ أَنْتَ",
    transliteration: "Allaahummagh-fir lii maa qoddamtu wa maa akh-khortu wa maa asrortu wa maa a-lantu wa maa asroftu wa maa anta a-lamu bihi minnii. Antal muqoddimu wa antal mu-akh-khiru laa ilaaha illaa anta.",
    translation: {
      en: "O Allah, forgive me what I have done before and after, what I have hidden and what I have revealed, what I have exceeded in, and what You know better than me. You are Al-Muqaddim and Al-Muakhkhir. There is no deity except You.",
      fr: "Ô Allah, pardonne-moi ce que j'ai fait avant et après, ce que j'ai caché et ce que j'ai révélé, ce en quoi j'ai été excessif, et ce que Tu connais mieux que moi. Tu es Al-Muqaddim et Al-Muakhkhir. Il n'y a pas de divinité sauf Toi.",
      de: "O Allah vergib mir was ich früher und später getan habe was ich verborgen und offenbart habe was ich übertrieben habe und was Du besser weißt als ich. Du bist Al-Muqaddim und Al-Muakhkhir. Es gibt keine Gottheit außer Dir." },
    benefit: {
      en: "Six categories of forgiveness requested. Al-Muqaddim means the One who brings forward, Al-Muakhkhir means the One who delays. This dua is also in the night prayer Istiftah (Dua 11).",
      fr: "Six catégories de pardon demandées. Al-Muqaddim signifie Celui qui fait avancer, Al-Muakhkhir Celui qui retarde.",
      de: "Sechs Kategorien von Vergebung erbeten. Al-Muqaddim bedeutet der der voranstellt Al-Muakhkhir der der verzögert." },
    source: ["Sahih Muslim 1/534"] },

  { id: 473, catId: "before_salam", type: "dua", order: 9,
    title: { en: "O Allah help me to remember You, be grateful and worship You well", fr: "Ô Allah aide-moi à Te rappeler, être reconnaissant et T'adorer bien", de: "O Allah hilf mir Dich zu gedenken dankbar zu sein und Dich gut zu verehren" },
    arabic: "اَللَّهُمَّ أَعِنِّيْ عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ",
    transliteration: "Allaahumma a-innii alaa dzikrika wa syukrika wa husni ibaadatik.",
    translation: {
      en: "O Allah, help me to remember You, to be grateful to You, and to worship You in the best manner.",
      fr: "Ô Allah, aide-moi à me souvenir de Toi, à T'être reconnaissant et à T'adorer de la meilleure façon.",
      de: "O Allah hilf mir Dich zu gedenken Dir dankbar zu sein und Dich auf die beste Art zu verehren." },
    benefit: {
      en: "The Prophet taught this specifically to Muadh ibn Jabal and commanded him to say it after every prayer. Three beautiful requests: dhikr (remembrance), shukr (gratitude) and husn al-ibadah (excellence in worship).",
      fr: "Le Prophète l'a enseigné spécifiquement à Muadh ibn Jabal et lui a commandé de le dire après chaque prière.",
      de: "Der Prophet lehrte dies speziell Muadh ibn Jabal und befahl ihm es nach jedem Gebet zu sagen. Drei schöne Bitten: Dhikr Shukr und Husn al-Ibadah." },
    source: ["Abu Dawud 2/86", "An-Nasai 3/53", "Sahih Al-Albani"] },

  { id: 474, catId: "before_salam", type: "dua", order: 10,
    title: { en: "Protection from cowardice, senility, worldly trials and grave punishment", fr: "Protection contre la lâcheté, la sénilité, les épreuves mondiales et le châtiment de la tombe", de: "Schutz vor Feigheit Senilität weltlichen Prüfungen und Grabstrafe" },
    arabic: "اَللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنَ الْجُبْنِ وَأَعُوذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ",
    transliteration: "Allaahumma innii a-uudzu bika minal jubni wa a-uudzu bika an urodda ilaa ar-dzalil umuri wa a-uudzu bika min fitnatid-dunyaa wa a-uudzu bika min adzaabil qobr.",
    translation: {
      en: "O Allah, I seek refuge in You from cowardice, I seek refuge in You from being returned to the worst of ages (extreme old age with loss of faculties), I seek refuge in You from the trials of this world, and I seek refuge in You from the punishment of the grave.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre la lâcheté, contre le fait d'être renvoyé au pire des âges (vieillesse extrême avec perte des facultés), contre les épreuves de ce monde, et contre le châtiment de la tombe.",
      de: "O Allah ich suche Zuflucht bei Dir vor Feigheit vor dem Zurückkehren in das schlimmste Alter (hohes Alter mit Verlust der Fähigkeiten) vor den Prüfungen dieser Welt und vor der Strafe des Grabes." },
    benefit: {
      en: "Sa'd ibn Abi Waqqas taught this dua to his son and said the Prophet used to recite it after prayer. Jubun (cowardice) means failing to act righteously when it matters. Ardhali al-umur means senility and loss of mental faculties.",
      fr: "Sa'd ibn Abi Waqqas enseignait ce dua à son fils et dit que le Prophète le récitait après la prière. Jubun (lâcheté) signifie échouer à agir vertueusement quand il le faut.",
      de: "Sa'd ibn Abi Waqqas lehrte dieses Dua seinem Sohn und sagte der Prophet rezitierte es nach dem Gebet. Jubun (Feigheit) bedeutet es zu versäumen rechtschaffen zu handeln wenn es darauf ankommt." },
    source: ["Sahih Bukhari 2822"] },

  { id: 475, catId: "before_salam", type: "dua", order: 11,
    title: { en: "Protection from miserliness, cowardice, senility, worldly trials and grave", fr: "Protection contre l'avarice, la lâcheté, la sénilité, les épreuves mondiales et la tombe", de: "Schutz vor Geiz Feigheit Senilität weltlichen Prüfungen und Grab" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْبُخْلِ وَأَعُوْذُ بِكَ مِنَ الْجُبْنِ وَأَعُوْذُ بِكَ مِنْ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ وَأَعُوْذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا وَعَذَابِ الْقَبْرِ",
    transliteration: "Allaahumma innii a-uudzu bika minal bukhli wa a-uudzu bika minal jubni wa a-uudzu bika min an urodda ilaa ar-dzalil umuri wa a-uudzu bika min fitnatid-dunyaa wa adzaabil qobr.",
    translation: {
      en: "O Allah, I seek refuge in You from miserliness, from cowardice, from being returned to the worst of ages, from the trials of this world and the punishment of the grave.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre l'avarice, la lâcheté, le fait d'être renvoyé au pire des âges, les épreuves de ce monde et le châtiment de la tombe.",
      de: "O Allah ich suche Zuflucht bei Dir vor Geiz vor Feigheit vor dem Zurückkehren in das schlimmste Alter vor den Prüfungen dieser Welt und der Strafe des Grabes." },
    benefit: {
      en: "Extended version of dua 10 – adds bukhl (miserliness) at the beginning. Five protections. The Prophet linked miserliness with cowardice as spiritual diseases that weaken the believer.",
      fr: "Version étendue du dua 10 – ajoute bukhl (avarice) au début. Cinq protections.",
      de: "Erweiterte Version von Dua 10 – fügt bukhl (Geiz) am Anfang hinzu. Fünf Schutzbitten." },
    source: ["Sahih Bukhari 6/35"] },

  { id: 476, catId: "before_salam", type: "dua", order: 12,
    title: { en: "O Allah I ask You for Paradise and seek refuge from Fire", fr: "Ô Allah je Te demande le Paradis et cherche refuge contre le Feu", de: "O Allah ich bitte Dich um das Paradies und suche Zuflucht vor dem Feuer" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ الْجَنَّةَ وَأَعُوْذُ بِكَ مِنَ النَّارِ",
    transliteration: "Allaahumma innii as-alukal jannah wa a-uudzu bika minan-naar.",
    translation: {
      en: "O Allah, I ask You for Paradise and seek refuge in You from the Fire.",
      fr: "Ô Allah, je Te demande le Paradis et cherche refuge auprès de Toi contre le Feu.",
      de: "O Allah ich bitte Dich um das Paradies und suche Zuflucht bei Dir vor dem Feuer." },
    benefit: {
      en: "The simplest and most direct dua – the core of every believer's request. The Prophet said: Whoever asks Allah for Paradise three times, Paradise says: O Allah admit him. And whoever seeks refuge from Fire three times, the Fire says: O Allah protect him.",
      fr: "La dua la plus simple et la plus directe – le coeur de la demande de chaque croyant.",
      de: "Das einfachste und direkteste Dua – das Herzstück jeder Bitte des Gläubigen." },
    source: ["Abu Dawud", "Sahih Ibn Majah 2/328"] },

  { id: 477, catId: "before_salam", type: "dua", order: 13,
    title: { en: "O Allah by Your knowledge of the unseen – keep me alive if good, take me if better – the great comprehensive dua", fr: "Ô Allah par Ta connaissance de l'invisible – garde-moi en vie si bon, prends-moi si mieux – le grand dua complet", de: "O Allah durch Dein Wissen des Verborgenen – lass mich leben wenn gut nimm mich wenn besser – das große umfassende Dua" },
    arabic: "اَللَّهُمَّ بِعِلْمِكَ الْغَيْبَ وَقُدْرَتِكَ عَلَى الْخَلْقِ أَحْيِنِيْ مَا عَلِمْتَ الْحَيَاةَ خَيْرًا لِيْ وَتَوَفَّنِيْ إِذَا عَلِمْتَ الْوَفَاةَ خَيْرًا لِيْ اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ وَأَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الرِّضَا وَالْغَضَبِ وَأَسْأَلُكَ الْقَصْدَ فِي الْغِنَى وَالْفَقْرِ وَأَسْأَلُكَ نَعِيْمًا لاَ يَنْفَدُ وَأَسْأَلُكَ قُرَّةَ عَيْنٍ لاَ يَنْقَطِعُ وَأَسْأَلُكَ الرِّضَا بَعْدَ الْقَضَاءِ وَأَسْأَلُكَ بَرْدَ الْعَيْشِ بَعْدَ الْمَوْتِ وَأَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ وَالشَّوْقَ إِلَى لِقَائِكَ فِيْ غَيْرِ ضَرَّاءَ مُضِرَّةٍ وَلاَ فِتْنَةٍ مُضِلَّةٍ اَللَّهُمَّ زَيِّنَّا بِزِيْنَةِ اْلإِيْمَانِ وَاجْعَلْنَا هُدَاةً مُهْتَدِيْنَ",
    transliteration: "Allaahumma bi-ilmikal ghoiba wa qudrotika alal kholqi ahyinii maa alimtal hayaata khoiron lii wa tawaffanii idzaa alimtal wafaata khoiron lii. Allaahumma innii as-aluka khosy-yataka fil ghoibi wasy-syahaadati wa as-aluka kalimatal haqqi fir-ridhoo wal ghodhobi wa as-alukal qoshda fil ghinaa wal faqri wa as-aluka na-iimaan laa yanfadu wa as-aluka qurrota ainin laa yanqothi-i wa as-alukar-ridhoo ba-dal qodhoo-i wa as-aluka bardal ayish ba-dal mauti wa as-aluka ladz-dzatan-nazhori ilaa wajhika wasy-syauqo ilaa liqoo-ika fii ghoiri dhorroo-a mudhirratin wa laa fitnatin mudhillatin. Allaahumma zayyannaa biziinatil iimaani waj-alnaa hudaatan muhtadiin.",
    translation: {
      en: "O Allah, by Your knowledge of the unseen and Your power over creation – keep me alive as long as You know life is good for me, and take my soul when You know death is better for me. O Allah, I ask You for Your fear in private and public, for the word of truth in contentment and anger, for moderation in wealth and poverty, for blessings that never end, for joy of the eyes that never ceases, for contentment after Your decree, for the coolness of life after death, for the pleasure of gazing at Your face and the longing to meet You without harmful trial or misguiding temptation. O Allah, adorn us with the adornment of faith and make us guiding guides who are guided.",
      fr: "Ô Allah, par Ta connaissance de l'invisible et Ta puissance sur la création – garde-moi en vie tant que Tu sais que la vie m'est bénéfique, et prends mon âme quand Tu sais que la mort m'est meilleure. Ô Allah, je Te demande Ta crainte en privé et en public, la parole de vérité dans la satisfaction et la colère, la modération dans la richesse et la pauvreté, des bénédictions sans fin, une joie des yeux ininterrompue, la satisfaction après Ton décret, la fraîcheur de la vie après la mort, le plaisir de contempler Ton visage et l'ardent désir de Te rencontrer sans épreuve nuisible ni tentation égarante. Ô Allah, pare-nous de la parure de la foi.",
      de: "O Allah durch Dein Wissen des Verborgenen und Deine Macht über die Schöpfung – erhalte mein Leben solange Du weißt dass das Leben gut für mich ist und nimm meine Seele wenn Du weißt dass der Tod besser für mich ist. O Allah ich bitte Dich um Deine Furcht im Verborgenen und Offensichtlichen um das Wort der Wahrheit in Zufriedenheit und Zorn um Mäßigung in Reichtum und Armut um nie endende Segnungen um nie aufhörende Augenfreude um Zufriedenheit nach Deinem Urteil um die Frische des Lebens nach dem Tod um die Freude des Blickens auf Dein Angesicht und die Sehnsucht Dich zu treffen ohne schädliche Prüfung." },
    benefit: {
      en: "One of the most comprehensive duas in Islam covering this life, death, afterlife and Paradise. Requests fear of Allah, truthfulness, moderation, eternal blessing, contentment, coolness after death, and the ultimate joy – seeing Allah's face.",
      fr: "L'une des duas les plus complètes en Islam couvrant cette vie, la mort, l'au-delà et le Paradis.",
      de: "Eines der umfassendsten Duas im Islam das dieses Leben Tod Jenseits und Paradies abdeckt." },
    source: ["An-Nasai 3/54-55", "Ahmad 4/364", "Sahih Al-Albani"] },

  { id: 478, catId: "before_salam", type: "dua", order: 14,
    title: { en: "O Allah I ask You by Your being Allah, Al-Ahad, Al-Samad – forgive me", fr: "Ô Allah je Te demande par Ton être Allah, Al-Ahad, Al-Samad – pardonne-moi", de: "O Allah ich bitte Dich durch Dein Sein Allah Al-Ahad Al-Samad – vergib mir" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ بِأَنِّيْ أَشْهَدُ أَنَّكَ أَنْتَ اللَّهُ لاَ إِلَـٰهَ إِلاَّ أَنْتَ اْلأَحَدُ الصَّمَدُ الَّذِيْ لَمْ يَلِدْ وَلَمْ يُوْلَدْ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ",
    transliteration: "Allaahumma innii as-aluka bi-annii asyhadu annaka antallaah laa ilaaha illaa antal ahadush-shomadul-ladzii lam yalid wa lam yuulad wa lam yakun lahu kufuwan ahad.",
    translation: {
      en: "O Allah, I ask You bearing witness that You are Allah, there is no deity except You, Al-Ahad (the One), Al-Samad (the Eternal Refuge), Who neither begets nor was begotten, and there is none comparable to Him.",
      fr: "Ô Allah, je Te demande en témoignant que Tu es Allah, il n'y a pas de divinité sauf Toi, Al-Ahad (l'Un), Al-Samad (le Refuge Éternel), qui n'engendre pas et n'a pas été engendré, et nul n'est comparable à Lui.",
      de: "O Allah ich bitte Dich bezeugend dass Du Allah bist es gibt keine Gottheit außer Dir Al-Ahad (der Eine) Al-Samad (die Ewige Zuflucht) der weder zeugt noch gezeugt wurde und dem niemand gleich ist." },
    benefit: {
      en: "Based entirely on Surah Al-Ikhlas. The Prophet said this dua contains the Ism Al-Adhm (Greatest Name of Allah) – when Allah is asked by it He gives, when called by it He answers. Slightly different wording from dua 6.",
      fr: "Entièrement basé sur Sourate Al-Ikhlas. Le Prophète dit que ce dua contient l'Ism Al-Adhm.",
      de: "Vollständig basierend auf Sure Al-Ikhlas. Der Prophet sagte dieses Dua enthält den Ism Al-Adhm – wenn Allah damit gebeten wird gibt Er wenn damit angerufen wird antwortet Er." },
    source: ["Abu Dawud 2/62", "At-Tirmidhi 5/515", "Ibn Majah 2/1267", "Sahih"] },

  // ── CATEGORY: SALAM IN PRAYER ──
  { id: 479, catId: "salam", type: "dua", order: 1,
    title: { en: "Salam 1 – full salam both sides (wa barakatuh both)", fr: "Salam 1 – salam complet des deux côtés (wa barakatuh les deux)", de: "Salam 1 – vollständiger Salam auf beiden Seiten (wa barakatuh beide)" },
    arabic: "اَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ",
    transliteration: "As-salaamu alaikum wa rohmatullaahi wa barokaatuh. (both right and left)",
    translation: {
      en: "Peace be upon you and the mercy of Allah and His blessings. (Said to both right and left)",
      fr: "Que la paix soit sur vous ainsi que la miséricorde d'Allah et Ses bénédictions. (Dit des deux côtés)",
      de: "Friede sei auf euch und die Barmherzigkeit Allahs und Seine Segnungen. (Auf beiden Seiten gesagt)" },
    benefit: {
      en: "The complete salam with wa barakatuh said to both sides. Ibn Masud and Ammar ibn Yasir narrated that the Prophet raised his voice for both salams. The salam is a rukun of prayer – without it prayer is invalid.",
      fr: "Le salam complet avec wa barakatuh dit des deux côtés. Le salam est un pilier de la prière – sans lui la prière est invalide.",
      de: "Der vollständige Salam mit wa barakatuh auf beiden Seiten gesagt. Der Salam ist eine Pflicht des Gebets – ohne ihn ist das Gebet ungültig." },
    source: ["Abdurrazzaq Al-Musannaf 3129"] },

  { id: 480, catId: "salam", type: "dua", order: 2,
    title: { en: "Salam 2 – full salam right, shorter left (most common)", fr: "Salam 2 – salam complet à droite, plus court à gauche (le plus courant)", de: "Salam 2 – vollständiger Salam rechts kürzerer links (am häufigsten)" },
    arabic: "اَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ — اَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ",
    transliteration: "Right: As-salaamu alaikum wa rohmatullaahi wa barokaatuh. Left: As-salaamu alaikum wa rohmatullaah.",
    translation: {
      en: "Right side: Peace be upon you and the mercy of Allah and His blessings. Left side: Peace be upon you and the mercy of Allah.",
      fr: "Côté droit : Que la paix soit sur vous et la miséricorde d'Allah et Ses bénédictions. Côté gauche : Que la paix soit sur vous et la miséricorde d'Allah.",
      de: "Rechte Seite: Friede sei auf euch und die Barmherzigkeit Allahs und Seine Segnungen. Linke Seite: Friede sei auf euch und die Barmherzigkeit Allahs." },
    benefit: {
      en: "The most commonly used variant – full salam to the right (with wa barakatuh) and shorter to the left (without wa barakatuh). From the hadith of Wail ibn Hujr.",
      fr: "La variante la plus couramment utilisée – salam complet à droite (avec wa barakatuh) et plus court à gauche (sans wa barakatuh).",
      de: "Die am häufigsten verwendete Variante – vollständiger Salam rechts (mit wa barakatuh) und kürzer links (ohne wa barakatuh)." },
    source: ["Abu Dawud 997", "Sahih Al-Albani"] },

  { id: 481, catId: "salam", type: "dua", order: 3,
    title: { en: "Salam 3 – wa rahmatullah both sides (without barakatuh)", fr: "Salam 3 – wa rahmatullah des deux côtés (sans barakatuh)", de: "Salam 3 – wa rahmatullah auf beiden Seiten (ohne barakatuh)" },
    arabic: "اَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ",
    transliteration: "As-salaamu alaikum wa rohmatullaah. (both right and left)",
    translation: {
      en: "Peace be upon you and the mercy of Allah. (Said to both right and left)",
      fr: "Que la paix soit sur vous et la miséricorde d'Allah. (Dit des deux côtés)",
      de: "Friede sei auf euch und die Barmherzigkeit Allahs. (Auf beiden Seiten gesagt)" },
    benefit: {
      en: "Both salams without wa barakatuh. From Ibn Masud who reported the Prophet turned so far that the whiteness of his cheeks was visible. This is how he described the Prophet's salam.",
      fr: "Les deux salams sans wa barakatuh. D'Ibn Masud qui rapporta que le Prophète se tourna tellement que la blancheur de ses joues était visible.",
      de: "Beide Salams ohne wa barakatuh. Von Ibn Masud der berichtete der Prophet drehte sich so weit dass die Weiße seiner Wangen sichtbar war." },
    source: ["An-Nasai", "Abu Dawud", "Sahih Al-Albani"] },

  { id: 482, catId: "salam", type: "dua", order: 4,
    title: { en: "Salam 4 – wa rahmatullah right, shorter left", fr: "Salam 4 – wa rahmatullah à droite, plus court à gauche", de: "Salam 4 – wa rahmatullah rechts kürzer links" },
    arabic: "اَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ — اَلسَّلَامُ عَلَيْكُمْ",
    transliteration: "Right: As-salaamu alaikum wa rohmatullaah. Left: As-salaamu alaikum.",
    translation: {
      en: "Right side: Peace be upon you and the mercy of Allah. Left side: Peace be upon you.",
      fr: "Côté droit : Que la paix soit sur vous et la miséricorde d'Allah. Côté gauche : Que la paix soit sur vous.",
      de: "Rechte Seite: Friede sei auf euch und die Barmherzigkeit Allahs. Linke Seite: Friede sei auf euch." },
    benefit: {
      en: "From Ibn Umar's description of the Prophet's prayer. Different lengths for right and left – the first salam is the pillar of prayer, the second is Sunnah.",
      fr: "De la description d'Ibn Umar de la prière du Prophète. Longueurs différentes pour droite et gauche.",
      de: "Aus Ibn Umars Beschreibung des Propheten-Gebets. Unterschiedliche Längen für rechts und links." },
    source: ["An-Nasai", "Sahih Al-Arnauth"] },

  { id: 483, catId: "salam", type: "dua", order: 5,
    title: { en: "Salam 5 – once only (As-salamu alaykum)", fr: "Salam 5 – une seule fois (As-salamu alaykum)", de: "Salam 5 – nur einmal (As-salamu alaykum)" },
    arabic: "اَلسَّلَامُ عَلَيْكُمْ",
    transliteration: "As-salaamu alaikum. (once, turning right)",
    translation: {
      en: "Peace be upon you. (Said once, turning to the right)",
      fr: "Que la paix soit sur vous. (Dit une fois, en se tournant vers la droite)",
      de: "Friede sei auf euch. (Einmal gesagt beim Drehen nach rechts)" },
    benefit: {
      en: "Aisha narrated the Prophet sometimes said salam only once, raising his voice and waking those who were sleeping. Also narrated that he sometimes turned just slightly to the right saying one salam. Valid but less common than two salams.",
      fr: "Aisha rapporta que le Prophète disait parfois le salam une seule fois, élevant sa voix et réveillant ceux qui dormaient.",
      de: "Aisha berichtete der Prophet sagte manchmal den Salam nur einmal seine Stimme erhebend und diejenigen aufweckend die schliefen." },
    source: ["Ahmad", "Sahih Al-Arnauth", "Ad-Daruquthni", "Al-Hakim"] },

  // ── CATEGORY: DHIKR AFTER OBLIGATORY PRAYER ──
  { id: 484, catId: "after_prayer", type: "dua", order: 1,
    title: { en: "Istighfar 3x + O Allah You are As-Salam", fr: "Istighfar 3x + Ô Allah Tu es As-Salam", de: "Istighfar 3x + O Allah Du bist As-Salam" },
    arabic: "أَسْتَغْفِرُ اللَّهَ (3×) اَللَّهُمَّ أَنْتَ السَّلاَمُ وَمِنْكَ السَّلاَمُ تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَاْلإِكْرَامِ",
    transliteration: "Astaghfirullaah (3x). Allaahumma antas-salaam wa minkas-salaam tabaarokta yaa dzal jalaali wal ikroom.",
    translation: {
      en: "I seek Allah's forgiveness (3 times). O Allah, You are As-Salam (the Source of Peace) and from You comes peace. Blessed are You O Possessor of Majesty and Honor.",
      fr: "Je demande pardon à Allah (3 fois). Ô Allah, Tu es As-Salam et de Toi vient la paix. Béni sois-Tu ô Possesseur de Majesté et d'Honneur.",
      de: "Ich suche Allahs Vergebung (3 Mal). O Allah Du bist As-Salam und von Dir kommt der Friede. Gesegnet bist Du o Besitzer der Majestät und Ehre." },
    benefit: {
      en: "The first dhikr after salam. The Prophet said Astaghfirullah three times immediately after finishing prayer, then said this. He was asked: O Messenger of Allah, why do you seek forgiveness after prayer? He said: Perhaps I exceeded the limits in prayer.",
      fr: "Le premier dhikr après le salam. Le Prophète disait Astaghfirullah trois fois immédiatement après avoir terminé la prière, puis disait cela.",
      de: "Der erste Dhikr nach dem Salam. Der Prophet sagte Astaghfirullah dreimal unmittelbar nach dem Gebet dann sagte er dies." },
    source: ["Sahih Muslim 1/414"] },

  { id: 485, catId: "after_prayer", type: "dua", order: 2,
    title: { en: "La ilaha illallah wahdahu + O Allah none can withhold what You give (1x)", fr: "La ilaha illallah wahdahu + Ô Allah nul ne peut retenir ce que Tu donnes (1x)", de: "La ilaha illallah wahdahu + O Allah niemand kann zurückhalten was Du gibst (1x)" },
    arabic: "لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيْكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ اَللَّهُمَّ لاَ مَانِعَ لِمَا أَعْطَيْتَ وَلاَ مُعْطِيَ لِمَا مَنَعْتَ وَلاَ يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ",
    transliteration: "Laa ilaaha illallaah wahdahu laa syariika lah lahul mulku wa lahul hamd wa huwa alaa kulli syai-in qodiir. Allaahumma laa maani-a limaa a-thoita wa laa mu-thiya limaa mana-ta wa laa yanfa-u dzal jaddi minkal jadd.",
    translation: {
      en: "There is no deity except Allah alone without partner, to Him belongs the dominion and all praise, and He is over all things capable. O Allah, none can withhold what You give, and none can give what You withhold. No wealth or status benefits its owner against You.",
      fr: "Il n'y a pas de divinité sauf Allah seul sans associé, à Lui le règne et toute louange, Il est sur toute chose Puissant. Ô Allah, nul ne peut retenir ce que Tu donnes et nul ne peut donner ce que Tu retiens. Aucune richesse ne profite à son possesseur contre Toi.",
      de: "Es gibt keine Gottheit außer Allah allein ohne Partner Ihm gehört die Herrschaft und aller Lob und Er ist über alle Dinge mächtig. O Allah niemand kann zurückhalten was Du gibst und niemand kann geben was Du zurückhältst. Kein Reichtum nützt seinem Besitzer gegen Dich." },
    benefit: {
      en: "Said once after every prayer. Combines declaration of tawhid with acknowledgment that all giving and withholding belongs to Allah alone.",
      fr: "Dit une fois après chaque prière. Combine la déclaration de tawhid avec la reconnaissance que tout donner et retenir appartient à Allah seul.",
      de: "Einmal nach jedem Gebet gesagt. Kombiniert Tauhid-Erklärung mit der Anerkennung dass alles Geben und Zurückhalten nur Allah gehört." },
    source: ["Sahih Bukhari 1/255", "Sahih Muslim 1/414"] },

  { id: 486, catId: "after_prayer", type: "dua", order: 3,
    title: { en: "La ilaha illallah + La hawla + sincerely for Allah despite disbelievers (1x)", fr: "La ilaha illallah + La hawla + sincèrement pour Allah malgré les mécréants (1x)", de: "La ilaha illallah + La hawla + aufrichtig für Allah trotz der Ungläubigen (1x)" },
    arabic: "لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيْكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَلاَ نَعْبُدُ إِلاَّ إِيَّاهُ لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ لاَ إِلَـٰهَ إِلاَّ اللَّهُ مُخْلِصِيْنَ لَهُ الدِّيْنَ وَلَوْ كَرِهَ الْكَافِرُوْنَ",
    transliteration: "Laa ilaaha illallaah wahdahu laa syariika lah lahul mulku wa lahul hamd wa huwa alaa kulli syai-in qodiir. Laa haula wa laa quwwata illaa billaah. Laa ilaaha illallaah wa laa na-budu illaa iyyaah. Lahun-ni-matu wa lahul fadhlu wa lahuts-tsanaa-ul hasan. Laa ilaaha illallaah mukhlishiina lahud-diin wa lau karihal kaafiruun.",
    translation: {
      en: "There is no deity except Allah alone without partner, to Him belongs the dominion and all praise, and He is over all things capable. There is no power except through Allah. There is no deity except Allah and we worship none but Him. To Him belongs all blessing, grace and beautiful praise. There is no deity except Allah – sincere in religion for Him even if the disbelievers hate it.",
      fr: "Il n'y a pas de divinité sauf Allah seul sans associé. Pas de puissance sauf par Allah. Pas de divinité sauf Allah et nous n'adorons que Lui. À Lui toute bénédiction grâce et belle louange. Pas de divinité sauf Allah sincères en religion pour Lui même si les mécréants le détestent.",
      de: "Es gibt keine Gottheit außer Allah allein ohne Partner. Keine Macht außer durch Allah. Keine Gottheit außer Allah und wir verehren nur Ihn. Ihm gehört alle Gnade Gunst und schönes Lob. Keine Gottheit außer Allah aufrichtig in der Religion für Ihn auch wenn die Ungläubigen es hassen." },
    benefit: {
      en: "A comprehensive post-prayer dhikr covering tawhid, tawakkul, exclusive worship and sincerity. The phrase even if the disbelievers hate it affirms the believer's conviction.",
      fr: "Un dhikr post-prière complet couvrant le tawhid, le tawakkul, l'adoration exclusive et la sincérité.",
      de: "Ein umfassender Post-Gebet-Dhikr der Tauhid Tawakkul ausschließliche Verehrung und Aufrichtigkeit abdeckt." },
    source: ["Sahih Muslim 1/415"] },

  { id: 487, catId: "after_prayer", type: "dua", order: 4,
    title: { en: "La ilaha illallah wahdahu with yuhyi wa yumit – 10x after Maghrib and Fajr", fr: "La ilaha illallah wahdahu avec yuhyi wa yumit – 10x après Maghrib et Fajr", de: "La ilaha illallah wahdahu mit yuhyi wa yumit – 10x nach Maghrib und Fajr" },
    arabic: "لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيْكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِيْ وَيُمِيْتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ",
    transliteration: "Laa ilaaha illallaah wahdahu laa syariika lah lahul mulku wa lahul hamd yuhyii wa yumiit wa huwa alaa kulli syai-in qodiir. (10x after Maghrib and Fajr)",
    translation: {
      en: "There is no deity except Allah alone without partner, to Him belongs the dominion and all praise, He gives life and causes death, and He is over all things capable. (10 times after Maghrib and Fajr)",
      fr: "Il n'y a pas de divinité sauf Allah seul sans associé, à Lui le règne et toute louange, Il donne la vie et cause la mort, Il est sur toute chose Puissant. (10 fois après Maghrib et Fajr)",
      de: "Es gibt keine Gottheit außer Allah allein ohne Partner Ihm gehört die Herrschaft und aller Lob Er gibt Leben und verursacht den Tod und Er ist über alle Dinge mächtig. (10-mal nach Maghrib und Fajr)" },
    benefit: {
      en: "Adds yuhyi wa yumit (He gives life and causes death). Said 10 times specifically after Maghrib and Fajr prayers. These two prayers mark the transition between day and night – reminding of Allah's power over life and death.",
      fr: "Ajoute yuhyi wa yumit (Il donne la vie et cause la mort). Dit 10 fois spécifiquement après Maghrib et Fajr.",
      de: "Fügt yuhyi wa yumit (Er gibt Leben und verursacht den Tod) hinzu. 10-mal speziell nach Maghrib und Fajr gesagt." },
    source: ["At-Tirmidhi 5/515", "Ahmad 4/227"] },

  { id: 488, catId: "after_prayer", type: "dua", order: 5,
    title: { en: "O Allah help me to remember You, be grateful and worship You well (also before salam)", fr: "Ô Allah aide-moi à Te rappeler, être reconnaissant et T'adorer bien (aussi avant le salam)", de: "O Allah hilf mir Dich zu gedenken dankbar zu sein und Dich gut zu verehren (auch vor Salam)" },
    arabic: "اَللَّهُمَّ أَعِنِّيْ عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ",
    transliteration: "Allaahumma a-innii alaa dzikrika wa syukrika wa husni ibaadatik.",
    translation: {
      en: "O Allah, help me to remember You, to be grateful to You, and to worship You in the best manner.",
      fr: "Ô Allah, aide-moi à me souvenir de Toi, à T'être reconnaissant et à T'adorer de la meilleure façon.",
      de: "O Allah hilf mir Dich zu gedenken Dir dankbar zu sein und Dich auf die beste Art zu verehren." },
    benefit: {
      en: "Taught by the Prophet to Muadh ibn Jabal to say after every prayer. Can also be said before salam (in tasyahhud). Three requests covering the inner dimensions of worship: dhikr, shukr and husn al-ibadah.",
      fr: "Enseigné par le Prophète à Muadh ibn Jabal à dire après chaque prière. Peut aussi être dit avant le salam.",
      de: "Vom Propheten an Muadh ibn Jabal gelehrt nach jedem Gebet zu sagen. Kann auch vor dem Salam gesagt werden." },
    source: ["Abu Dawud 1522", "An-Nasai 3/53", "Ahmad 5/244"] },

  { id: 489, catId: "after_prayer", type: "dua", order: 6,
    title: { en: "Tasbih 33x + Tahmid 33x + Takbir 33x + La ilaha illallah (version 1 – 99+1)", fr: "Tasbih 33x + Tahmid 33x + Takbir 33x + La ilaha illallah (version 1 – 99+1)", de: "Tasbih 33x + Tahmid 33x + Takbir 33x + La ilaha illallah (Version 1 – 99+1)" },
    arabic: "سُبْحَانَ اللَّهِ (33×) اَلْحَمْدُ لِلَّهِ (33×) اَللَّهُ أَكْبَرُ (33×) لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيْكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ",
    transliteration: "Subhaanallaah (33x). Alhamdulillaah (33x). Allaahu akbar (33x). Laa ilaaha illallaah wahdahu laa syariika lah lahul mulku wa lahul hamd wa huwa alaa kulli syai-in qodiir.",
    translation: {
      en: "Glory be to Allah (33x). All praise to Allah (33x). Allah is the Greatest (33x). There is no deity except Allah alone without partner, to Him belongs the dominion and all praise, and He is over all things capable.",
      fr: "Gloire à Allah (33x). Toute louange à Allah (33x). Allah est le Plus Grand (33x). Il n'y a pas de divinité sauf Allah seul sans associé, à Lui le règne et toute louange, Il est sur toute chose Puissant.",
      de: "Gepriesen sei Allah (33x). Aller Lob sei Allah (33x). Allah ist der Größte (33x). Es gibt keine Gottheit außer Allah allein ohne Partner Ihm gehört die Herrschaft und aller Lob und Er ist über alle Dinge mächtig." },
    benefit: {
      en: "The Prophet said: Whoever says this after every prayer will have their sins forgiven even if they were as much as the foam of the sea. It is recommended to alternate between all variants. The best practice is to use different versions on different days.",
      fr: "Le Prophète dit : Quiconque dit cela après chaque prière verra ses péchés pardonnés même s'ils étaient aussi nombreux que l'écume de la mer.",
      de: "Der Prophet sagte: Wer dies nach jedem Gebet sagt dem werden seine Sünden vergeben auch wenn sie so zahlreich wären wie der Schaum des Meeres." },
    source: ["Sahih Muslim 597"] },

  { id: 490, catId: "after_prayer", type: "dua", order: 7,
    title: { en: "Tasbih 33x + Tahmid 33x + Takbir 34x (version 2 – total 100)", fr: "Tasbih 33x + Tahmid 33x + Takbir 34x (version 2 – total 100)", de: "Tasbih 33x + Tahmid 33x + Takbir 34x (Version 2 – gesamt 100)" },
    arabic: "سُبْحَانَ اللَّهِ (33×) اَلْحَمْدُ لِلَّهِ (33×) اَللَّهُ أَكْبَرُ (34×)",
    transliteration: "Subhaanallaah (33x). Alhamdulillaah (33x). Allaahu akbar (34x).",
    translation: {
      en: "Glory be to Allah (33x). All praise to Allah (33x). Allah is the Greatest (34x). Total: 100.",
      fr: "Gloire à Allah (33x). Toute louange à Allah (33x). Allah est le Plus Grand (34x). Total : 100.",
      de: "Gepriesen sei Allah (33x). Aller Lob sei Allah (33x). Allah ist der Größte (34x). Gesamt: 100." },
    benefit: {
      en: "The Prophet said: These good companions – whoever says them after every obligatory prayer will not lose out. Takbir is 34 instead of 33 to make the total exactly 100 without needing an additional phrase.",
      fr: "Le Prophète dit : Ces bons compagnons – quiconque les dit après chaque prière obligatoire ne perdra rien. Le Takbir est 34 au lieu de 33 pour faire exactement 100.",
      de: "Der Prophet sagte: Diese guten Begleiter – wer sie nach jedem Pflichtgebet sagt wird nicht verlieren. Takbir ist 34 statt 33 um genau 100 zu ergeben." },
    source: ["Sahih Muslim 596"] },

  { id: 491, catId: "after_prayer", type: "dua", order: 8,
    title: { en: "Tasbih + Tahmid + Takbir combined 33x (version 3)", fr: "Tasbih + Tahmid + Takbir combinés 33x (version 3)", de: "Tasbih + Tahmid + Takbir kombiniert 33x (Version 3)" },
    arabic: "سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَاللَّهُ أَكْبَرُ (33×)",
    transliteration: "Subhaanallaah wal hamdulillaah wallaahu akbar. (33x)",
    translation: {
      en: "Glory be to Allah, all praise to Allah, Allah is the Greatest. (33 times)",
      fr: "Gloire à Allah, toute louange à Allah, Allah est le Plus Grand. (33 fois)",
      de: "Gepriesen sei Allah aller Lob sei Allah Allah ist der Größte. (33 Mal)" },
    benefit: {
      en: "The three phrases combined into one said 33 times. The Prophet taught this to the poor companions who felt they could not compete with the wealthy in charity. He said this would make them surpass everyone – until the wealthy started doing it too.",
      fr: "Les trois phrases combinées en une dite 33 fois. Le Prophète l'enseigna aux compagnons pauvres qui pensaient ne pas pouvoir rivaliser avec les riches en charité.",
      de: "Die drei Phrasen zu einer kombiniert 33-mal gesagt. Der Prophet lehrte dies den armen Gefährten die dachten sie könnten nicht mit den Reichen in Wohltätigkeit mithalten." },
    source: ["Sahih Bukhari 843", "Sahih Muslim 595"] },

  { id: 492, catId: "after_prayer", type: "dua", order: 9,
    title: { en: "Tasbih 10x + Tahmid 10x + Takbir 10x (version 4 – total 30)", fr: "Tasbih 10x + Tahmid 10x + Takbir 10x (version 4 – total 30)", de: "Tasbih 10x + Tahmid 10x + Takbir 10x (Version 4 – gesamt 30)" },
    arabic: "سُبْحَانَ اللَّهِ (10×) اَلْحَمْدُ لِلَّهِ (10×) اَللَّهُ أَكْبَرُ (10×)",
    transliteration: "Subhaanallaah (10x). Alhamdulillaah (10x). Allaahu akbar (10x).",
    translation: {
      en: "Glory be to Allah (10x). All praise to Allah (10x). Allah is the Greatest (10x). Total: 30.",
      fr: "Gloire à Allah (10x). Toute louange à Allah (10x). Allah est le Plus Grand (10x). Total : 30.",
      de: "Gepriesen sei Allah (10x). Aller Lob sei Allah (10x). Allah ist der Größte (10x). Gesamt: 30." },
    benefit: {
      en: "A shorter version of the tasbih-tahmid-takbir dhikr said 10 times each. Same hadith context as version 3 but narrated with 10 instead of 33. All versions are authentic and it is Sunnah to alternate.",
      fr: "Une version plus courte du dhikr tasbih-tahmid-takbir dit 10 fois chacun. Même contexte hadith que la version 3 mais narré avec 10 au lieu de 33.",
      de: "Eine kürzere Version des Tasbih-Tahmid-Takbir-Dhikrs 10-mal gesagt. Gleicher Hadith-Kontext wie Version 3 aber mit 10 statt 33 überliefert." },
    source: ["Sahih Bukhari 6329"] },

  { id: 493, catId: "after_prayer", type: "dua", order: 10,
    title: { en: "Tasbih 11x + Tahmid 11x + Takbir 11x (version 5 – total 33)", fr: "Tasbih 11x + Tahmid 11x + Takbir 11x (version 5 – total 33)", de: "Tasbih 11x + Tahmid 11x + Takbir 11x (Version 5 – gesamt 33)" },
    arabic: "سُبْحَانَ اللَّهِ (11×) اَلْحَمْدُ لِلَّهِ (11×) اَللَّهُ أَكْبَرُ (11×)",
    transliteration: "Subhaanallaah (11x). Alhamdulillaah (11x). Allaahu akbar (11x).",
    translation: {
      en: "Glory be to Allah (11x). All praise to Allah (11x). Allah is the Greatest (11x). Total: 33.",
      fr: "Gloire à Allah (11x). Toute louange à Allah (11x). Allah est le Plus Grand (11x). Total : 33.",
      de: "Gepriesen sei Allah (11x). Aller Lob sei Allah (11x). Allah ist der Größte (11x). Gesamt: 33." },
    benefit: {
      en: "From a narration by Suhail who added: each is 11 times making the total 33. An addition found within the same chain as Muslim 595. All versions are authentic and should be alternated.",
      fr: "D'une narration de Suhail qui ajouta : chacun est 11 fois faisant un total de 33. Un ajout trouvé dans la même chaîne que Muslim 595.",
      de: "Aus einer Überlieferung von Suhail der hinzufügte: jedes 11-mal macht insgesamt 33. Ein Zusatz in derselben Kette wie Muslim 595." },
    source: ["Sahih Muslim 595"] },

  { id: 494, catId: "after_prayer", type: "dua", order: 11,
    title: { en: "Tasbih + Tahmid + Tahlil + Takbir 25x each (version 6 – total 100)", fr: "Tasbih + Tahmid + Tahlil + Takbir 25x chacun (version 6 – total 100)", de: "Tasbih + Tahmid + Tahlil + Takbir 25x je (Version 6 – gesamt 100)" },
    arabic: "سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلاَ إِلَـٰهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ (25×)",
    transliteration: "Subhaanallaah wal hamdulillaah wa laa ilaaha illallaah wallaahu akbar. (25x)",
    translation: {
      en: "Glory be to Allah, all praise to Allah, there is no deity except Allah, Allah is the Greatest. (25 times) Total: 100.",
      fr: "Gloire à Allah, toute louange à Allah, pas de divinité sauf Allah, Allah est le Plus Grand. (25 fois) Total : 100.",
      de: "Gepriesen sei Allah aller Lob sei Allah keine Gottheit außer Allah Allah ist der Größte. (25 Mal) Gesamt: 100." },
    benefit: {
      en: "Based on a dream of an Ansari companion which the Prophet approved. Adds La ilaha illallah making it four phrases. Said 25 times each to make exactly 100. A beautiful comprehensive dhikr.",
      fr: "Basé sur un rêve d'un compagnon Ansari que le Prophète approuva. Ajoute La ilaha illallah en faisant quatre phrases. Dit 25 fois chacun pour faire exactement 100.",
      de: "Basierend auf einem Traum eines Ansari-Gefährten den der Prophet billigte. Fügt La ilaha illallah hinzu und macht vier Phrasen. 25-mal gesagt um genau 100 zu ergeben." },
    source: ["An-Nasai 1351"] },

  { id: 495, catId: "after_prayer", type: "dua", order: 12,
    title: { en: "Surah Al-Ikhlas (1x after every prayer)", fr: "Sourate Al-Ikhlas (1x après chaque prière)", de: "Sure Al-Ikhlas (1x nach jedem Gebet)" },
    arabic: "بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ قُلْ هُوَ اللَّهُ أَحَدٌ اللَّهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ",
    transliteration: "Bismillaahir-rahmaanir-rahiim. Qul huwallaahu ahad. Allaahus-somad. Lam yalid wa lam yuulad. Wa lam yakun lahu kufuwan ahad.",
    translation: {
      en: "In the name of Allah the Most Gracious the Most Merciful. Say: He is Allah the One. Allah the Eternal Refuge. He neither begets nor was begotten. And there is none comparable to Him. (Al-Ikhlas 112:1-4)",
      fr: "Au nom d'Allah le Tout Miséricordieux le Très Miséricordieux. Dis : Il est Allah l'Unique. Allah l'Éternel Refuge. Il n'a pas engendré et n'a pas été engendré. Et il n'est personne qui Lui soit comparable. (Al-Ikhlas 112:1-4)",
      de: "Im Namen Allahs des Allbarmherzigen des Barmherzigen. Sag: Er ist Allah der Eine. Allah der Ewige. Er hat nicht gezeugt und ist nicht gezeugt worden. Und niemand ist Ihm gleich. (Al-Ikhlas 112:1-4)" },
    benefit: {
      en: "The three surahs Al-Ikhlas Al-Falaq and An-Nas are called Al-Muwwidhat (the protective surahs). Said once after each prayer. After Fajr and Maghrib said three times. Whoever recites them after every prayer nothing will harm him.",
      fr: "Les trois sourates Al-Ikhlas, Al-Falaq et An-Nas sont appelées Al-Muwwidhat (les sourates protectrices). Dites une fois après chaque prière. Après Fajr et Maghrib trois fois.",
      de: "Die drei Suren Al-Ikhlas Al-Falaq und An-Nas heißen Al-Muwwidhat (die Schutz-Suren). Einmal nach jedem Gebet gesagt. Nach Fajr und Maghrib dreimal." },
    source: ["Abu Dawud 2/86", "An-Nasai 3/68", "Sahih At-Tirmidhi 2/8"] },

  { id: 496, catId: "after_prayer", type: "dua", order: 13,
    title: { en: "Surah Al-Falaq (1x after every prayer)", fr: "Sourate Al-Falaq (1x après chaque prière)", de: "Sure Al-Falaq (1x nach jedem Gebet)" },
    arabic: "بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ النَّفَّاثَاتِ فِى الْعُقَدِ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",
    transliteration: "Bismillaahir-rahmaanir-rahiim. Qul a-uudzu birobbil falaq. Min syarri maa kholaq. Wa min syarri ghoo-siqin idzaa waqob. Wa min syarrin-naffaatsaati fil uqod. Wa min syarri haasidin idzaa hasad.",
    translation: {
      en: "In the name of Allah the Most Gracious the Most Merciful. Say: I seek refuge with the Lord of the daybreak. From the evil of what He has created. And from the evil of darkness when it settles. And from the evil of the blowers in knots. And from the evil of an envier when he envies. (Al-Falaq 113:1-5)",
      fr: "Au nom d'Allah le Tout Miséricordieux le Très Miséricordieux. Dis : Je cherche refuge auprès du Seigneur de l'aube naissante. Contre le mal de ce qu'Il a créé. Contre le mal de l'obscurité quand elle s'installe. Contre le mal des souffleuses dans les noeuds. Et contre le mal de l'envieux quand il envie. (Al-Falaq 113:1-5)",
      de: "Im Namen Allahs des Allbarmherzigen des Barmherzigen. Sag: Ich suche Zuflucht beim Herrn des Morgengrauens. Vor dem Bösen dessen was Er erschaffen hat. Vor dem Bösen der Dunkelheit wenn sie hereinbricht. Vor dem Bösen der Bläserinnen in Knoten. Vor dem Bösen eines Neiders wenn er neidet. (Al-Falaq 113:1-5)" },
    benefit: {
      en: "Second of the three protective surahs (Al-Muwwidhat). Protects from evil of creation, darkness, magic and envy. Said after every prayer once, after Fajr and Maghrib three times.",
      fr: "Deuxième des trois sourates protectrices. Protège du mal de la création, de l'obscurité, de la magie et de l'envie.",
      de: "Zweite der drei Schutz-Suren. Schützt vor dem Bösen der Schöpfung Dunkelheit Magie und Neid." },
    source: ["Abu Dawud 2/86", "An-Nasai 3/68", "Sahih At-Tirmidhi 2/8"] },

  { id: 497, catId: "after_prayer", type: "dua", order: 14,
    title: { en: "Surah An-Nas (1x after every prayer)", fr: "Sourate An-Nas (1x après chaque prière)", de: "Sure An-Nas (1x nach jedem Gebet)" },
    arabic: "بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ النَّاسِ مَلِكِ النَّاسِ إِلَـٰهِ النَّاسِ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ الَّذِى يُوَسْوِسُ فِى صُدُورِ النَّاسِ مِنَ الْجِنَّةِ وَالنَّاسِ",
    transliteration: "Bismillaahir-rahmaanir-rahiim. Qul a-uudzu birobbin-naas. Malikin-naas. Ilaahin-naas. Min syarril waswaasil khonnaas. Alladzii yuwaswisu fii shuduurin-naas. Minal jinnati wan-naas.",
    translation: {
      en: "In the name of Allah the Most Gracious the Most Merciful. Say: I seek refuge with the Lord of mankind. The King of mankind. The God of mankind. From the evil of the retreating whisperer. Who whispers in the breasts of mankind. From among the jinn and mankind. (An-Nas 114:1-6)",
      fr: "Au nom d'Allah le Tout Miséricordieux le Très Miséricordieux. Dis : Je cherche refuge auprès du Seigneur des hommes. Le Roi des hommes. Le Dieu des hommes. Contre le mal du tentateur furtif. Celui qui souffle le mal dans les coeurs des hommes. Parmi les djinns et les hommes. (An-Nas 114:1-6)",
      de: "Im Namen Allahs des Allbarmherzigen des Barmherzigen. Sag: Ich suche Zuflucht beim Herrn der Menschen. Dem König der Menschen. Dem Gott der Menschen. Vor dem Bösen des sich zurückziehenden Einflüsterers. Der in die Herzen der Menschen einflüstert. Aus den Dschinn und den Menschen. (An-Nas 114:1-6)" },
    benefit: {
      en: "Third and last of the protective surahs. Specifically protects from waswas (whispering of Shaytan) which enters the heart. Together with Al-Ikhlas and Al-Falaq these three surahs are sufficient protection for the believer.",
      fr: "Troisième et dernière des sourates protectrices. Protège spécifiquement contre le waswas (murmures de Shaytan) qui pénètre le coeur.",
      de: "Dritte und letzte der Schutz-Suren. Schützt speziell vor Waswas (Einflüsterungen Shaytans) die ins Herz eindringen." },
    source: ["Abu Dawud 2/86", "An-Nasai 3/68", "Sahih At-Tirmidhi 2/8"] },

  { id: 498, catId: "after_prayer", type: "dua", order: 15,
    title: { en: "Ayat Al-Kursi (1x after every prayer – nothing prevents you from Paradise except death)", fr: "Ayat Al-Kursi (1x après chaque prière – rien ne t'empêche d'entrer au Paradis sauf la mort)", de: "Ayat Al-Kursi (1x nach jedem Gebet – nichts hindert dich am Paradies außer dem Tod)" },
    arabic: "اللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ الْحَىُّ الْقَيُّومُ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ لَّهُۥ مَا فِى السَّمَاوَاتِ وَمَا فِى الْأَرْضِ مَن ذَا الَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُۥ حِفْظُهُمَا وَهُوَ الْعَلِىُّ الْعَظِيمُ",
    transliteration: "Allaahu laa ilaaha illaa huwal hayyul qayyuum. Laa ta-khudhuhu sinatun wa laa naum. Lahu maa fis-samaawaati wa maa fil ardh. Man dzal ladzii yasyfa-u indahu illaa bi-idznih. Ya-lamu maa baina aydiihim wa maa khalfahum. Wa laa yuhiithuuna bisyai-in min ilmihi illaa bimaa syaa-a. Wasi-a kursiyyuhus-samaawaati wal ardh. Wa laa ya-uuduhu hifdhuhumaa. Wa huwal aliyyul azhiim.",
    translation: {
      en: "Allah – there is no deity except Him, the Ever-Living the Sustainer of existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is before them and what will be after them. And they encompass not a thing of His knowledge except for what He wills. His Kursi extends over the heavens and the earth and their preservation tires Him not. And He is the Most High the Most Great. (Al-Baqarah 2:255)",
      fr: "Allah – pas de divinité sauf Lui, le Vivant le Subsistant. Ni la somnolence ni le sommeil ne Le saisissent. À Lui appartient ce qui est dans les cieux et sur la terre. Qui peut intercéder auprès de Lui sans Sa permission ? Il sait ce qui est devant eux et derrière eux. Ils n'embrassent rien de Sa science sauf ce qu'Il veut. Son Trône s'étend sur les cieux et la terre et leur garde ne Lui pèse pas. Il est le Très-Haut le Très-Grand. (Al-Baqarah 2:255)",
      de: "Allah – keine Gottheit außer Ihm dem Ewig Lebenden dem Beständigen. Weder Schlummer noch Schlaf überkommt Ihn. Ihm gehört was in den Himmeln und auf der Erde ist. Wer kann bei Ihm ohne Seine Erlaubnis Fürbitte einlegen? Er weiß was vor ihnen und hinter ihnen ist. Sein Thron erstreckt sich über Himmel und Erde. (Al-Baqarah 2:255)" },
    benefit: {
      en: "The greatest verse in the Quran. Whoever recites it after every obligatory prayer – nothing prevents him from entering Paradise except death. Contains the greatest description of Allah in the entire Quran.",
      fr: "Le plus grand verset du Coran. Quiconque le récite après chaque prière obligatoire – rien ne l'empêche d'entrer au Paradis sauf la mort.",
      de: "Der größte Vers im Quran. Wer ihn nach jedem Pflichtgebet rezitiert – nichts hindert ihn am Eintreten ins Paradies außer dem Tod." },
    source: ["An-Nasai Amal Al-Yawm 100", "Ibn Al-Sunni 121", "Sahih Al-Albani"] },

  { id: 499, catId: "after_prayer", type: "dua", order: 16,
    title: { en: "O Allah I ask You for beneficial knowledge, good provision and accepted deeds – after Fajr", fr: "Ô Allah je Te demande une connaissance utile, une bonne provision et des actes acceptés – après Fajr", de: "O Allah ich bitte Dich um nützliches Wissen gute Versorgung und angenommene Taten – nach Fajr" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلاً مُتَقَبَّلاً",
    transliteration: "Allaahumma innii as-aluka ilman naafi-an wa rizqon thoyyiban wa amalan mutaqobbalan.",
    translation: {
      en: "O Allah, I ask You for beneficial knowledge, good and lawful provision, and accepted deeds.",
      fr: "Ô Allah, je Te demande une connaissance utile, une provision bonne et licite, et des actes acceptés.",
      de: "O Allah ich bitte Dich um nützliches Wissen gute und rechtmäßige Versorgung und angenommene Taten." },
    benefit: {
      en: "Said specifically after Fajr prayer. Three beautiful requests that cover the most important aspects of a Muslim's day: knowledge to guide, provision to sustain, and deeds accepted by Allah.",
      fr: "Dit spécifiquement après la prière Fajr. Trois belles demandes couvrant les aspects les plus importants de la journée d'un musulman : la connaissance pour guider, la provision pour soutenir, et les actes acceptés.",
      de: "Speziell nach dem Fajr-Gebet gesagt. Drei schöne Bitten die die wichtigsten Aspekte des Tages eines Muslims abdecken: Wissen zum Leiten Versorgung zum Erhalten und von Allah angenommene Taten." },
    source: ["Ibn Majah", "Sahih Ibn Majah 1/152"] },

  // ── CATEGORY: MORNING DHIKR ──
  { id: 500, catId: "morning_dhikr", type: "dua", order: 1,
    title: { en: "Ta'awudz – seeking refuge from Shaytan", fr: "Ta'awudz – chercher refuge contre Shaytan", de: "Ta'awudz – Zuflucht vor Shaytan suchen" },
    arabic: "أَعُوْذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيْمِ",
    transliteration: "A-uudzu billaahi minasy-syaithoonir-rojiim.",
    translation: {
      en: "I seek refuge in Allah from the accursed Shaytan.",
      fr: "Je cherche refuge auprès d'Allah contre le Shaytan maudit.",
      de: "Ich suche Zuflucht bei Allah vor dem verfluchten Shaytan." },
    benefit: {
      en: "The morning dhikr begins with seeking refuge from Shaytan before reciting Quran and other remembrances. Starting the day by acknowledging the enemy and seeking Allah's protection sets the right intention.",
      fr: "Le dhikr du matin commence par chercher refuge contre Shaytan avant de réciter le Coran et autres invocations.",
      de: "Der Morgen-Dhikr beginnt damit Zuflucht vor Shaytan zu suchen bevor man den Quran und andere Erinnerungen rezitiert." },
    source: ["Hisnul Muslim"] },

  { id: 501, catId: "morning_dhikr", type: "dua", order: 2,
    title: { en: "Ayat Al-Kursi – protected from jinn until evening", fr: "Ayat Al-Kursi – protégé des djinns jusqu'au soir", de: "Ayat Al-Kursi – vor Dschinn bis zum Abend geschützt" },
    arabic: "اللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ الْحَىُّ الْقَيُّومُ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ لَّهُۥ مَا فِى السَّمَاوَاتِ وَمَا فِى الْأَرْضِ مَن ذَا الَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُۥ حِفْظُهُمَا وَهُوَ الْعَلِىُّ الْعَظِيمُ",
    transliteration: "Allaahu laa ilaaha illaa huwal hayyul qayyuum. Laa ta-khudhuhu sinatun wa laa naum. Lahu maa fis-samaawaati wa maa fil ardh. Man dzal ladzii yasyfa-u indahu illaa bi-idznih. Ya-lamu maa baina aydiihim wa maa khalfahum. Wa laa yuhiithuuna bisyai-in min ilmihi illaa bimaa syaa-a. Wasi-a kursiyyuhus-samaawaati wal ardh. Wa laa ya-uuduhu hifdhuhumaa. Wa huwal aliyyul azhiim.",
    translation: {
      en: "Allah – there is no deity except Him the Ever-Living the Sustainer. Neither drowsiness nor sleep overtakes Him. To Him belongs what is in the heavens and earth. Who can intercede except by His permission? He knows what is before and behind them. They encompass nothing of His knowledge except what He wills. His Kursi extends over the heavens and earth and their preservation does not tire Him. He is the Most High the Most Great. (Al-Baqarah 2:255)",
      fr: "Allah – pas de divinité sauf Lui le Vivant le Subsistant. Ni somnolence ni sommeil ne Le saisissent. À Lui ce qui est dans les cieux et la terre. Qui peut intercéder sans Sa permission ? Son Trône s'étend sur les cieux et la terre. (Al-Baqarah 2:255)",
      de: "Allah – keine Gottheit außer Ihm dem Ewig Lebenden dem Beständigen. Kein Schlummer kein Schlaf überkommt Ihn. Ihm gehört was in den Himmeln und auf der Erde ist. Sein Thron erstreckt sich über Himmel und Erde. (Al-Baqarah 2:255)" },
    benefit: {
      en: "Whoever recites this in the morning is protected from jinn until the evening. Whoever recites it in the evening is protected until the morning. A Jinn himself confirmed this to the companion Ubay ibn Ka'ab and the Prophet said: The wicked creature spoke the truth.",
      fr: "Quiconque le récite le matin est protégé des djinns jusqu'au soir. Un djinn lui-même le confirma au compagnon Ubay ibn Ka'ab et le Prophète dit : La créature mauvaise a dit la vérité.",
      de: "Wer dies morgens rezitiert ist bis zum Abend vor Dschinn geschützt. Ein Dschinn selbst bestätigte dies dem Gefährten Ubay ibn Ka'ab und der Prophet sagte: Die böse Kreatur sprach die Wahrheit." },
    source: ["Al-Hakim 1/562", "Sahih At-Targhib 1/273", "An-Nasai", "At-Tabarani"] },

  { id: 502, catId: "morning_dhikr", type: "dua", order: 3,
    title: { en: "Surah Al-Ikhlas 3x – sufficient protection from everything", fr: "Sourate Al-Ikhlas 3x – protection suffisante contre tout", de: "Sure Al-Ikhlas 3x – ausreichender Schutz vor allem" },
    arabic: "بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ قُلْ هُوَ اللَّهُ أَحَدٌ اللَّهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ",
    transliteration: "Bismillaahir-rahmaanir-rahiim. Qul huwallaahu ahad. Allaahus-somad. Lam yalid wa lam yuulad. Wa lam yakun lahu kufuwan ahad. (3x)",
    translation: {
      en: "In the name of Allah the Most Gracious the Most Merciful. Say: He is Allah the One. Allah the Eternal Refuge. He neither begets nor was begotten. And there is none comparable to Him. (Al-Ikhlas 112:1-4) – 3 times",
      fr: "Au nom d'Allah. Dis : Il est Allah l'Unique. Allah l'Éternel Refuge. Il n'a pas engendré et n'a pas été engendré. Nul ne Lui est comparable. (Al-Ikhlas 112:1-4) – 3 fois",
      de: "Im Namen Allahs. Sag: Er ist Allah der Eine. Allah der Ewige. Er hat nicht gezeugt und ist nicht gezeugt worden. Niemand ist Ihm gleich. (Al-Ikhlas 112:1-4) – 3 Mal" },
    benefit: {
      en: "Whoever recites the three protective surahs (Al-Ikhlas Al-Falaq An-Nas) 3 times each morning and evening – they are sufficient for him from everything. Said 3 times in the morning and evening.",
      fr: "Quiconque récite les trois sourates protectrices 3 fois chaque matin et soir – elles lui suffisent contre tout.",
      de: "Wer die drei Schutz-Suren 3-mal jeden Morgen und Abend rezitiert – sie reichen ihm gegen alles aus." },
    source: ["Abu Dawud 4/322", "At-Tirmidhi 5/567", "Sahih At-Tirmidhi 3/182"] },

  { id: 503, catId: "morning_dhikr", type: "dua", order: 4,
    title: { en: "Surah Al-Falaq 3x", fr: "Sourate Al-Falaq 3x", de: "Sure Al-Falaq 3x" },
    arabic: "بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ النَّفَّاثَاتِ فِى الْعُقَدِ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",
    transliteration: "Bismillaahir-rahmaanir-rahiim. Qul a-uudzu birobbil falaq. Min syarri maa kholaq. Wa min syarri ghoo-siqin idzaa waqob. Wa min syarrin-naffaatsaati fil uqod. Wa min syarri haasidin idzaa hasad. (3x)",
    translation: {
      en: "In the name of Allah the Most Gracious the Most Merciful. Say: I seek refuge with the Lord of the daybreak – from the evil of what He created, from the evil of darkness when it settles, from the evil of the blowers in knots, from the evil of an envier when he envies. (Al-Falaq 113:1-5) – 3 times",
      fr: "Au nom d'Allah. Dis : Je cherche refuge auprès du Seigneur de l'aube naissante – contre le mal de ce qu'Il a créé, de l'obscurité qui s'installe, des souffleuses dans les noeuds, de l'envieux qui envie. (Al-Falaq 113:1-5) – 3 fois",
      de: "Im Namen Allahs. Sag: Ich suche Zuflucht beim Herrn des Morgengrauens – vor dem Bösen seiner Schöpfung vor der Dunkelheit wenn sie hereinbricht vor den Bläserinnen in Knoten vor dem Neid des Neiders. (Al-Falaq 113:1-5) – 3 Mal" },
    benefit: {
      en: "Second of the three protective surahs. Said 3 times morning and evening. Together with Al-Ikhlas and An-Nas they provide complete protection from all evil with Allah's permission.",
      fr: "Deuxième des trois sourates protectrices. Dite 3 fois matin et soir. Avec Al-Ikhlas et An-Nas elles offrent une protection complète contre tout mal.",
      de: "Zweite der drei Schutz-Suren. 3-mal morgens und abends gesagt. Zusammen mit Al-Ikhlas und An-Nas bieten sie vollständigen Schutz vor allem Bösen." },
    source: ["Abu Dawud 4/322", "At-Tirmidhi 5/567", "Sahih At-Tirmidhi 3/182"] },

  { id: 504, catId: "morning_dhikr", type: "dua", order: 5,
    title: { en: "Surah An-Nas 3x", fr: "Sourate An-Nas 3x", de: "Sure An-Nas 3x" },
    arabic: "بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ النَّاسِ مَلِكِ النَّاسِ إِلَـٰهِ النَّاسِ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ الَّذِى يُوَسْوِسُ فِى صُدُورِ النَّاسِ مِنَ الْجِنَّةِ وَالنَّاسِ",
    transliteration: "Bismillaahir-rahmaanir-rahiim. Qul a-uudzu birobbin-naas. Malikin-naas. Ilaahin-naas. Min syarril waswaasil khonnaas. Alladzii yuwaswisu fii shuduurin-naas. Minal jinnati wan-naas. (3x)",
    translation: {
      en: "In the name of Allah the Most Gracious the Most Merciful. Say: I seek refuge with the Lord of mankind – the King of mankind, the God of mankind – from the evil of the retreating whisperer who whispers in the breasts of mankind from among jinn and mankind. (An-Nas 114:1-6) – 3 times",
      fr: "Au nom d'Allah. Dis : Je cherche refuge auprès du Seigneur des hommes – le Roi des hommes, le Dieu des hommes – contre le tentateur furtif qui souffle le mal dans les coeurs des hommes parmi les djinns et les hommes. (An-Nas 114:1-6) – 3 fois",
      de: "Im Namen Allahs. Sag: Ich suche Zuflucht beim Herrn der Menschen – dem König der Menschen dem Gott der Menschen – vor dem sich zurückziehenden Einflüsterer der in die Herzen der Menschen einflüstert aus Dschinn und Menschen. (An-Nas 114:1-6) – 3 Mal" },
    benefit: {
      en: "Third of the three protective surahs. Specifically protects from the whispering of Shaytan in the heart. Said 3 times morning and evening. These three surahs together are sufficient protection from all harm.",
      fr: "Troisième des trois sourates protectrices. Protège spécifiquement des murmures de Shaytan dans le coeur. Dite 3 fois matin et soir.",
      de: "Dritte der drei Schutz-Suren. Schützt speziell vor den Einflüsterungen Shaytans im Herzen. 3-mal morgens und abends gesagt." },
    source: ["Abu Dawud 4/322", "At-Tirmidhi 5/567", "Sahih At-Tirmidhi 3/182"] },

  { id: 505, catId: "morning_dhikr", type: "dua", order: 6,
    title: { en: "We have entered the morning – dominion belongs to Allah, seeking good of this day", fr: "Nous avons accueilli le matin – le règne appartient à Allah, demander le bien de ce jour", de: "Wir haben den Morgen begrüßt – die Herrschaft gehört Allah das Gute dieses Tages erbitten" },
    arabic: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيْكَ لَهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ رَبِّ أَسْأَلُكَ خَيْرَ مَا فِيْ هَـٰذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ وَأَعُوْذُ بِكَ مِنْ شَرِّ مَا فِيْ هَـٰذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ رَبِّ أَعُوْذُ بِكَ مِنَ الْكَسَلِ وَسُوْءِ الْكِبَرِ رَبِّ أَعُوْذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",
    transliteration: "Ash-bahnaa wa ash-bahal mulku lillaah wal hamdulillaah laa ilaaha illallaah wahdahu laa syariika lah lahul mulku wa lahul hamd wa huwa alaa kulli syai-in qodiir. Robbi as-aluka khoiro maa fii haadzal yaumi wa khoiro maa ba-dahu wa a-uudzu bika min syarri maa fii haadzal yaumi wa syarri maa ba-dahu. Robbi a-uudzu bika minal kasali wa suu-il kibar. Robbi a-uudzu bika min adzaabin fin-naari wa adzaabin fil qobr.",
    translation: {
      en: "We have entered the morning and the dominion belongs to Allah. All praise to Allah. There is no deity except Allah alone without partner – to Him belongs the dominion and all praise and He is over all things capable. My Lord I ask You for the good of this day and the good after it. I seek refuge in You from the evil of this day and the evil after it. My Lord I seek refuge in You from laziness and the evil of old age. My Lord I seek refuge in You from punishment in the Fire and punishment in the grave.",
      fr: "Nous avons accueilli le matin et le règne appartient à Allah. Toute louange à Allah. Pas de divinité sauf Allah seul sans associé. Mon Seigneur je Te demande le bien de ce jour et le bien après lui. Je cherche refuge contre le mal de ce jour et le mal après lui. Mon Seigneur je cherche refuge contre la paresse et le mal de la vieillesse. Mon Seigneur je cherche refuge contre le châtiment du Feu et le châtiment de la tombe.",
      de: "Wir haben den Morgen begrüßt und die Herrschaft gehört Allah. Aller Lob sei Allah. Keine Gottheit außer Allah allein ohne Partner. Mein Herr ich bitte Dich um das Gute dieses Tages und das Gute danach. Ich suche Zuflucht vor dem Bösen dieses Tages und dem Bösen danach. Mein Herr ich suche Zuflucht vor Faulheit und dem Bösen des Alters. Mein Herr ich suche Zuflucht vor der Strafe des Feuers und der Strafe des Grabes." },
    benefit: {
      en: "A comprehensive morning opening dua. From Ibn Masud – the Prophet said this every evening (and the morning version in the morning). It covers tawhid, praise, request for good, protection from evil, laziness, bad old age, Fire and grave.",
      fr: "Une dua d'ouverture matinale complète. D'Ibn Masud – le Prophète disait cela chaque soir.",
      de: "Ein umfassendes morgendliches Eröffnungs-Dua. Von Ibn Masud – der Prophet sagte dies jeden Abend." },
    source: ["Sahih Muslim 4/2088"] },

  { id: 506, catId: "morning_dhikr", type: "dua", order: 7,
    title: { en: "O Allah by You we enter the morning – and to You is the resurrection", fr: "Ô Allah c'est par Toi que nous entrons dans le matin – et à Toi est la résurrection", de: "O Allah durch Dich begrüßen wir den Morgen – und zu Dir ist die Auferstehung" },
    arabic: "اَللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوْتُ وَإِلَيْكَ النُّشُوْرُ",
    transliteration: "Allaahumma bika ash-bahnaa wa bika amsainaa wa bika nahyaa wa bika namuutu wa ilaikan-nusyuur.",
    translation: {
      en: "O Allah, by Your grace we enter the morning and by Your grace we enter the evening. By Your grace we live and by Your will we die. And to You is the resurrection.",
      fr: "Ô Allah, c'est par Ta grâce que nous entrons dans le matin et par Ta grâce dans le soir. C'est par Ta grâce que nous vivons et par Ta volonté que nous mourons. Et c'est vers Toi la résurrection.",
      de: "O Allah durch Deine Gnade begrüßen wir den Morgen und durch Deine Gnade den Abend. Durch Deine Gnade leben wir und durch Deinen Willen sterben wir. Und zu Dir ist die Auferstehung." },
    benefit: {
      en: "Every morning the Prophet said this, and every evening he changed ash-bahnaa to amsainaa and an-nushur to al-maseer. Complete surrender to Allah in all stages: morning, evening, life, death and resurrection.",
      fr: "Chaque matin le Prophète disait cela et chaque soir il changeait ash-bahnaa en amsainaa et an-nushur en al-maseer.",
      de: "Jeden Morgen sagte der Prophet dies und jeden Abend änderte er ash-bahnaa in amsainaa und an-nushur in al-maseer." },
    source: ["At-Tirmidhi 3391", "Sahih Al-Albani"] },

  { id: 507, catId: "morning_dhikr", type: "dua", order: 8,
    title: { en: "Sayyid Al-Istighfar – the Master of Seeking Forgiveness", fr: "Sayyid Al-Istighfar – le Maître de la Demande de Pardon", de: "Sayyid Al-Istighfar – der Meister der Vergebungsbitte" },
    arabic: "اَللَّهُمَّ أَنْتَ رَبِّيْ لاَ إِلَـٰهَ إِلاَّ أَنْتَ خَلَقْتَنِيْ وَأَنَا عَبْدُكَ وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ أَعُوْذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ أَبُوْءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوْءُ لَكَ بِذَنْبِيْ فَاغْفِرْ لِيْ فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوْبَ إِلاَّ أَنْتَ",
    transliteration: "Allaahumma anta robbii laa ilaaha illaa anta kholaqtanii wa anaa abduka wa anaa alaa ahdika wa wa-dika mas-tatho-tu a-uudzu bika min syarri maa shona-tu abuu-u laka bini-matika alayya wa abuu-u laka bi-dzanbii faghfir lii fa-innahu laa yagh-firudz-dzunuuba illaa anta.",
    translation: {
      en: "O Allah You are my Lord. There is no deity except You. You created me and I am Your servant. I will uphold my covenant and promise to You as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your blessing upon me and I acknowledge my sin. So forgive me for none forgives sins except You.",
      fr: "Ô Allah Tu es mon Seigneur. Pas de divinité sauf Toi. Tu m'as créé et je suis Ton serviteur. Je maintiendrai mon pacte et ma promesse envers Toi de mon mieux. Je cherche refuge contre le mal de ce que j'ai fait. Je reconnais Ta bénédiction sur moi et je reconnais mon péché. Pardonne-moi car nul ne pardonne les péchés sauf Toi.",
      de: "O Allah Du bist mein Herr. Keine Gottheit außer Dir. Du hast mich erschaffen und ich bin Dein Diener. Ich werde meinen Bund und mein Versprechen an Dich nach besten Kräften einhalten. Ich suche Zuflucht vor dem Bösen was ich getan habe. Ich anerkenne Deine Gnade auf mir und anerkenne meine Sünde. Vergib mir denn niemand vergibt Sünden außer Dir." },
    benefit: {
      en: "Called Sayyid Al-Istighfar – the greatest form of seeking forgiveness. Whoever says it in the morning with certainty and dies before evening is from the people of Paradise. And whoever says it in the evening with certainty and dies before morning is from the people of Paradise.",
      fr: "Appelé Sayyid Al-Istighfar – la plus grande forme de demande de pardon. Quiconque le dit le matin avec certitude et meurt avant le soir est parmi les gens du Paradis.",
      de: "Sayyid Al-Istighfar genannt – die größte Form der Vergebungsbitte. Wer es morgens mit Gewissheit sagt und vor dem Abend stirbt gehört zu den Menschen des Paradieses." },
    source: ["Sahih Bukhari 5522", "Sahih Bukhari 6306", "At-Tirmidhi 3393"] },

  { id: 508, catId: "morning_dhikr", type: "dua", order: 9,
    title: { en: "O Allah grant well-being to my body, hearing and sight – 3x", fr: "Ô Allah accorde le bien-être à mon corps, mon ouïe et ma vue – 3x", de: "O Allah gewähre meinem Körper Gehör und Sehvermögen Wohlergehen – 3x" },
    arabic: "اَللَّهُمَّ عَافِنِيْ فِيْ بَدَنِيْ اَللَّهُمَّ عَافِنِيْ فِيْ سَمْعِيْ اَللَّهُمَّ عَافِنِيْ فِيْ بَصَرِيْ لاَ إِلَـٰهَ إِلاَّ أَنْتَ اَللَّهُمَّ إِنِّي أَعُوْذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ اَللَّهُمَّ إِنِّي أَعُوْذُ بِكَ مِنْ عَذَابِ الْقَبْرِ لاَ إِلَـٰهَ إِلاَّ أَنْتَ",
    transliteration: "Allaahumma afinii fii badanii. Allaahumma afinii fii sam-ii. Allaahumma afinii fii bashorii. Laa ilaaha illaa anta. Allaahumma innii a-uudzu bika minal kufri wal faqr. Allaahumma innii a-uudzu bika min adzaabil qobr. Laa ilaaha illaa anta. (3x)",
    translation: {
      en: "O Allah grant well-being to my body. O Allah grant well-being to my hearing. O Allah grant well-being to my sight. There is no deity except You. O Allah I seek refuge in You from disbelief and poverty. O Allah I seek refuge in You from the punishment of the grave. There is no deity except You. (3 times)",
      fr: "Ô Allah accorde le bien-être à mon corps. À mon ouïe. À ma vue. Pas de divinité sauf Toi. Ô Allah je cherche refuge contre l'incroyance et la pauvreté. Contre le châtiment de la tombe. Pas de divinité sauf Toi. (3 fois)",
      de: "O Allah gewähre meinem Körper Wohlergehen. Meinem Gehör Wohlergehen. Meinem Sehvermögen Wohlergehen. Keine Gottheit außer Dir. O Allah ich suche Zuflucht vor Unglaube und Armut. Vor der Strafe des Grabes. Keine Gottheit außer Dir. (3 Mal)" },
    benefit: {
      en: "Abu Bakrah narrated that his father Abu Bakrah (the companion) said: I heard the Prophet say this 3 times every morning and 3 times every evening. The separate mention of hearing and sight shows their special importance as the gateways to knowledge.",
      fr: "Abu Bakrah rapporta que son père disait : J'ai entendu le Prophète dire cela 3 fois chaque matin et 3 fois chaque soir. La mention séparée de l'ouïe et de la vue montre leur importance particulière.",
      de: "Abu Bakrah berichtete dass sein Vater sagte: Ich hörte den Propheten dies 3-mal jeden Morgen und 3-mal jeden Abend sagen. Die separate Erwähnung von Gehör und Sehvermögen zeigt ihre besondere Wichtigkeit." },
    source: ["Abu Dawud 4/324", "Ahmad 5/42", "An-Nasai Amal Al-Yawm 22", "Hasan"] },

  { id: 509, catId: "morning_dhikr", type: "dua", order: 10,
    title: { en: "O Allah I ask for pardon and well-being in this world and the next – protected from all 6 directions", fr: "Ô Allah je demande pardon et bien-être en ce monde et dans l'au-delà – protégé de toutes les 6 directions", de: "O Allah ich bitte um Vergebung und Wohlergehen in dieser Welt und im Jenseits – von allen 6 Richtungen geschützt" },
    arabic: "اَللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ اَللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي اَللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي اَللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي",
    transliteration: "Allaahumma innii as-alukal afwa wal aafiyata fid-dunyaa wal aakhiroh. Allaahumma innii as-alukal afwa wal aafiyata fii dinii wa dunyaaya wa ahlii wa maalii. Allaahummas-tur aurootii wa aamin rou-aatii. Allaahummah-fazhnii min baini yadayya wa min kholfii wa an yamiinii wa an syimaalii wa min fauqii wa a-uudzu bi-azhomatika an ugh-taala min tahtii.",
    translation: {
      en: "O Allah I ask You for pardon and well-being in this world and the next. O Allah I ask You for pardon and well-being in my religion, my worldly life, my family and my wealth. O Allah conceal my faults and calm my fears. O Allah protect me from in front, from behind, from my right, from my left, from above – and I seek refuge in Your greatness from being struck down from below.",
      fr: "Ô Allah je Te demande le pardon et le bien-être en ce monde et dans l'au-delà. Ô Allah je Te demande le pardon et le bien-être dans ma religion, ma vie mondaine, ma famille et mes biens. Ô Allah couvre mes défauts et calme mes craintes. Ô Allah protège-moi de devant, de derrière, de droite, de gauche, d'en haut – et je cherche refuge dans Ta grandeur d'être frappé d'en bas.",
      de: "O Allah ich bitte Dich um Vergebung und Wohlergehen in dieser Welt und im Jenseits. In meiner Religion meinem weltlichen Leben meiner Familie und meinem Vermögen. O Allah verberge meine Fehler und beruhige meine Ängste. O Allah beschütze mich von vorne von hinten von rechts von links von oben – und ich suche Zuflucht in Deiner Größe davor von unten getroffen zu werden." },
    benefit: {
      en: "Ibn Umar said: The Prophet never abandoned this dua morning and evening until he died. Al-Aafiyah means comprehensive well-being – freedom from all troubles. The Prophet said to his uncle Abbas: Ask Allah for al-aafiyah – there is nothing better to ask for.",
      fr: "Ibn Umar dit : Le Prophète n'abandonna jamais ce dua matin et soir jusqu'à sa mort. Al-Aafiyah signifie bien-être complet – liberté de tous les ennuis.",
      de: "Ibn Umar sagte: Der Prophet gab dieses Dua morgens und abends nie auf bis er starb. Al-Aafiyah bedeutet umfassendes Wohlergehen – Freiheit von allen Problemen." },
    source: ["Abu Dawud", "Ibn Majah", "Sahih Al-Albani"] },

  { id: 510, catId: "morning_dhikr", type: "dua", order: 11,
    title: { en: "O Allah Knower of unseen and witnessed – refuge from the evil of my soul and Shaytan", fr: "Ô Allah Connaisseur de l'invisible et du témoigné – refuge du mal de mon âme et de Shaytan", de: "O Allah Wissender des Verborgenen und Bezeugten – Zuflucht vor dem Bösen meiner Seele und Shaytans" },
    arabic: "اَللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَاْلأَرْضِ رَبَّ كُلِّ شَيْءٍ وَمَلِيْكَهُ أَشْهَدُ أَنْ لاَ إِلَـٰهَ إِلاَّ أَنْتَ أَعُوْذُ بِكَ مِنْ شَرِّ نَفْسِيْ وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ وَأَنْ أَقْتَرِفَ عَلَى نَفْسِيْ سُوْءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ",
    transliteration: "Allaahumma aalimal ghoibi wasy-syahaadati faathiros-samaawaati wal ardh robba kulli syai-in wa maliikahu asyhadu al-laa ilaaha illaa anta a-uudzu bika min syarri nafsii wa min syarrisy-syaithooni wa syirkih wa an aqtarifa alaa nafsii suu-an au ajurrohu ilaa muslim.",
    translation: {
      en: "O Allah Knower of the unseen and the witnessed Creator of the heavens and earth Lord of all things and their Sovereign – I bear witness that there is no deity except You. I seek refuge in You from the evil of my own soul from the evil of Shaytan and his polytheism and from committing evil against myself or bringing it upon a Muslim.",
      fr: "Ô Allah Connaisseur de l'invisible et du témoigné Créateur des cieux et de la terre Seigneur de toute chose et leur Souverain – je témoigne qu'il n'y a pas de divinité sauf Toi. Je cherche refuge contre le mal de mon âme contre le mal de Shaytan et son polythéisme et contre commettre un mal contre moi-même ou l'infliger à un musulman.",
      de: "O Allah Wissender des Verborgenen und Bezeugten Schöpfer der Himmel und Erde Herr aller Dinge und ihr Souverän – ich bezeuge dass es keine Gottheit außer Dir gibt. Ich suche Zuflucht vor dem Bösen meiner Seele vor dem Bösen Shaytans und seinem Polytheismus und davor ein Böses gegen mich selbst zu begehen oder es einem Muslim zuzufügen." },
    benefit: {
      en: "Abu Bakr As-Siddiq asked the Prophet to teach him a dua for morning evening and before sleep. The Prophet taught him this. Said 3 times morning 3 times evening and once before sleep. Two sources of evil: the nafs and Shaytan. Two impacts: harm to self and harm to others.",
      fr: "Abu Bakr As-Siddiq demanda au Prophète de lui enseigner un dua pour le matin le soir et avant de dormir. Le Prophète lui enseigna cela.",
      de: "Abu Bakr As-Siddiq bat den Propheten ihm ein Dua für Morgen Abend und vor dem Schlafen zu lehren. Der Prophet lehrte ihm dies." },
    source: ["At-Tirmidhi", "Abu Dawud", "Sahih At-Tirmidhi 3/142"] },

  { id: 511, catId: "morning_dhikr", type: "dua", order: 12,
    title: { en: "In the name of Allah with Whose name nothing harms – 3x", fr: "Au nom d'Allah avec Dont le nom rien ne nuit – 3x", de: "Im Namen Allahs mit Dessen Namen nichts schadet – 3x" },
    arabic: "بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي اْلأَرْضِ وَلاَ فِي السَّمَاءِ وَهُوَ السَّمِيْعُ الْعَلِيْمُ",
    transliteration: "Bismillaahil-ladzii laa yadhurru ma-as-mihi syai-un fil ardhi wa laa fis-samaa wa huwas-samii-ul aliim. (3x)",
    translation: {
      en: "In the name of Allah with Whose name nothing on earth or in the heavens can cause harm, and He is the All-Hearing the All-Knowing. (3 times)",
      fr: "Au nom d'Allah avec Dont le nom rien dans la terre ni dans les cieux ne peut nuire, et Il est l'Omniaudient l'Omniscient. (3 fois)",
      de: "Im Namen Allahs mit Dessen Namen nichts auf der Erde noch im Himmel schaden kann und Er ist der Allhörende der Allwissende. (3 Mal)" },
    benefit: {
      en: "Whoever says this 3 times morning and evening – nothing will harm him. Aban ibn Uthman was paralyzed one day and admitted he forgot to say it that day. Imam Al-Qurtubi said: I have always practiced this and nothing harmful reached me except when I forgot – once in Madinah a scorpion stung me and I remembered I had forgotten the dhikr.",
      fr: "Quiconque dit cela 3 fois matin et soir – rien ne lui nuira. Aban ibn Uthman fut paralysé un jour et admit avoir oublié de le dire ce jour-là. Imam Al-Qurtubi dit : J'ai toujours pratiqué cela et rien de nuisible ne m'a atteint sauf quand j'oubliais.",
      de: "Wer dies 3-mal morgens und abends sagt – nichts wird ihm schaden. Aban ibn Uthman war eines Tages gelähmt und gab zu es an diesem Tag vergessen zu haben. Imam Al-Qurtubi sagte: Ich habe dies immer praktiziert und nichts Schädliches traf mich außer wenn ich es vergaß." },
    source: ["Abu Dawud 4/323", "At-Tirmidhi 5/465", "Ibn Majah", "Ahmad", "Hasan"] },

  { id: 512, catId: "morning_dhikr", type: "dua", order: 13,
    title: { en: "I am content with Allah as Lord, Islam as religion, Muhammad as Prophet – 3x", fr: "Je me contente d'Allah comme Seigneur, de l'Islam comme religion, de Muhammad comme Prophète – 3x", de: "Ich bin zufrieden mit Allah als Herrn Islam als Religion Muhammad als Propheten – 3x" },
    arabic: "رَضِيْتُ بِاللَّهِ رَبًّا وَبِاْلإِسْلاَمِ دِيْنًا وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا",
    transliteration: "Rodhiitu billaahi robbaa wa bil islaami diinaa wa bimuhammadin shollallaahu alaihi wa sallama nabiyyaa. (3x)",
    translation: {
      en: "I am content with Allah as my Lord, with Islam as my religion, and with Muhammad (peace be upon him) as my Prophet. (3 times)",
