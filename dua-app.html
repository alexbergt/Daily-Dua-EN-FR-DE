    arabic: "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلاَةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ",
    transliteration: "Robbij-alnii muqiimash-sholaati wa min dzurriyyatii, robbanaa wa taqobbal du-aa.",
    translation: {
      en: "My Lord, make me an establisher of prayer, and also from my descendants. Our Lord, accept my supplication.",
      fr: "Seigneur, fais de moi quelqu'un qui accomplit la priere ainsi que ma descendance. Notre Seigneur, accepte mon invocation.",
      de: "Mein Herr, mache mich zu einem der das Gebet verrichtet, und ebenso meine Nachkommen. Unser Herr, nimm mein Bittgebet an." },
    source: ["Quran 14:40"] },

  { id: 234, catId: "goodness", type: "dua", order: 2,
    title: { en: "Gratitude, righteousness and entry among the righteous (Quran 27:19)", fr: "Gratitude, vertu et entree parmi les vertueux (Coran 27:19)", de: "Dankbarkeit, Rechtschaffenheit und Aufnahme unter die Frommen (Quran 27:19)" },
    arabic: "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ",
    transliteration: "Robbi auzi-nii an asykuro ni-matakallatii an-amta alayya wa alaa waalidayya wa an a-mala shoolihan tardhoohu, wa adkhilnii birohmatika fii ibaadikash-shoolihiin.",
    translation: {
      en: "My Lord, enable me to be grateful for Your favor which You have bestowed upon me and upon my parents, and to do righteousness that You approve of, and admit me by Your mercy among Your righteous servants.",
      fr: "Seigneur, inspire-moi a etre reconnaissant pour Tes bienfaits envers moi et mes parents, et a accomplir de bonnes oeuvres que Tu agrees. Et fais-moi entrer, par Ta misericorde, parmi Tes serviteurs vertueux.",
      de: "Mein Herr, veranlasse mich dankbar fuer Deine Gunst zu sein die Du mir und meinen Eltern erwiesen hast, und rechtschaffene Taten zu tun die Dir gefallen. Und nimm mich durch Deine Barmherzigkeit unter Deine rechtschaffenen Diener auf." },
    source: ["Quran 27:19"] },

  { id: 235, catId: "goodness", type: "dua", order: 3,
    title: { en: "Guidance, piety, chastity and self-sufficiency", fr: "Guidee, piete, chastete et autosuffisance", de: "Rechtleitung, Gottesfurcht, Enthaltsamkeit und Genügsamkeit" },
    arabic: "اَللَّهُمَّ إنِّي أَسْأَلُكَ الهُدَى، وَالتُّقَى، وَالعَفَافَ، وَالغِنَى",
    transliteration: "Allaahumma innii as-alukal hudaa, wat-tuqoo, wal afaaf, wal ghinaa.",
    translation: {
      en: "O Allah, I ask You for guidance, piety, chastity, and self-sufficiency.",
      fr: "O Allah, je Te demande la guidee, la piete, la chastete et l'autosuffisance.",
      de: "O Allah, ich bitte Dich um Rechtleitung, Gottesfurcht, Enthaltsamkeit und innere Genuegsamkeit." },
    benefit: {
      en: "Four comprehensive requests covering every dimension of a good life: right path (huda), fear of Allah (taqwa), protection from temptation (afaf), and freedom from need of others (ghina).",
      fr: "Quatre demandes couvrant toutes les dimensions d'une bonne vie : bon chemin, crainte d'Allah, protection des tentations et independance des autres.",
      de: "Vier umfassende Bitten die jede Dimension eines guten Lebens abdecken: richtiger Weg, Gottesscheu, Schutz vor Versuchung und Unabhaengigkeit von anderen." },
    source: ["Sahih Muslim"] },

  { id: 236, catId: "goodness", type: "dua", order: 4,
    title: { en: "Grant my soul piety and purify it", fr: "Accorde a mon ame sa piete et purifie-la", de: "Schenke meiner Seele Gottesfurcht und reinige sie" },
    arabic: "اَللَّهُمَّ آتِ نَفْسِيْ تَقْوَاهَا، وَزَكِّهَا، أَنْتَ خَيْرُ مَنْ زَكَّاهَا، أَنْتَ وَلِيُّهَا وَمَوْلَاهَا",
    transliteration: "Allaahumma aati nafsii taqwaahaa wazakkihaa, anta khairu man zakkaahaa, anta waliyyuhaa wa maulaahaa.",
    translation: {
      en: "O Allah, grant my soul its piety and purify it. You are the best to purify it. You are its protector and guardian.",
      fr: "O Allah, accorde a mon ame sa piete et purifie-la. Tu es le meilleur pour la purifier. Tu es son Protecteur et son Maitre.",
      de: "O Allah, schenke meiner Seele Gottesfurcht und reinige sie. Du bist der Beste der sie reinigen kann. Du bist ihr Beschuetzer und Herr." },
    benefit: {
      en: "The Prophet said this dua every morning and evening. It acknowledges that purification of the soul (tazkiyya) is entirely in Allah's hands, not ours alone.",
      fr: "Le Prophete disait ce dua chaque matin et soir. Il reconnait que la purification de l'ame est entierement entre les mains d'Allah.",
      de: "Der Prophet sprach dieses Dua jeden Morgen und Abend. Es anerkennt dass die Reinigung der Seele voellig in Allahs Haenden liegt." },
    source: ["Sahih Muslim"] },

  { id: 237, catId: "goodness", type: "dua", order: 5,
    title: { en: "Dua of Prophet Musa - expand my chest (Quran 20:25-28)", fr: "Invocation du Prophete Musa - ouvre ma poitrine (Coran 20:25-28)", de: "Dua des Propheten Musa - weite meine Brust (Quran 20:25-28)" },
    arabic: "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي يَفْقَهُوا قَوْلِي",
    transliteration: "Robbisy-roh lii shodrii, wa yassir lii amrii, wahlul uqdatan min lisaanii, yafqohuu qoulii.",
    translation: {
      en: "My Lord, expand for me my chest, ease for me my task, and untie the knot from my tongue so that they may understand my speech.",
      fr: "Seigneur, ouvre ma poitrine, facilite ma tache et denoue la difficulte de ma langue afin qu'ils comprennent mes paroles.",
      de: "Mein Herr, weite mir meine Brust, erleichtere mir meine Aufgabe und loese die Verkrampfung meiner Zunge damit sie meine Worte verstehen." },
    benefit: {
      en: "The dua of Prophet Musa before speaking to Pharaoh. Excellent to say before any important speech, presentation, teaching or difficult conversation.",
      fr: "L'invocation du Prophete Musa avant de parler a Pharaon. Excellent a dire avant tout discours, presentation ou conversation difficile.",
      de: "Das Dua des Propheten Musa vor dem Sprechen mit Pharao. Ausgezeichnet vor wichtigen Reden, Prasentationen oder schwierigen Gespraechen." },
    source: ["Quran 20:25-28"] },

  { id: 238, catId: "goodness", type: "dua", order: 6,
    title: { en: "Set right my religion, world and hereafter", fr: "Ameliore ma religion, ma vie et mon au-dela", de: "Verbessere meine Religion, mein Leben und mein Jenseits" },
    arabic: "اَللَّهُمَّ أَصْلِحْ لِى دِينِىَ الَّذِى هُوَ عِصْمَةُ أَمْرِى، وَأَصْلِحْ لِى دُنْيَاىَ الَّتِى فِيهَا مَعَاشِى، وَأَصْلِحْ لِى آخِرَتِى الَّتِى فِيهَا مَعَادِى، وَاجْعَلِ الْحَيَاةَ زِيَادَةً لِى فِى كُلِّ خَيْرٍ، وَاجْعَلِ الْمَوْتَ رَاحَةً لِى مِنْ كُلِّ شَرٍّ",
    transliteration: "Allaahumma ashlih lii diiniyal-ladzii huwa ishmatu amrii, wa ashlih lii dunyaayaa, wa ashlih lii aakhirotii, waj-alil hayaata ziyaadatan lii fii kulli khoir, waj-alil mauta roohatan lii min kulli syarr.",
    translation: {
      en: "O Allah, set right my religion which is the safeguard of my affairs, set right my worldly life in which is my livelihood, set right my hereafter to which is my return. Make my life an increase in all good and make death a relief for me from all evil.",
      fr: "O Allah, ameliore ma religion qui est la protection de mes affaires, ameliore ma vie ici-bas et mon au-dela. Fais de ma vie une augmentation de bien et de ma mort un repos contre tout mal.",
      de: "O Allah, verbessere meine Religion die der Schutz meiner Angelegenheiten ist, verbessere mein Diesseits und mein Jenseits. Mache mein Leben zu einer Mehrung an Gutem und den Tod zu einer Erleichterung von allem Uebel." },
    benefit: {
      en: "One of the most comprehensive duas covering all three dimensions of existence: religion, worldly life, and hereafter. The Prophet said it regularly.",
      fr: "L'une des invocations les plus completes couvrant les trois dimensions de l'existence : religion, vie mondaine et au-dela.",
      de: "Eines der umfassendsten Duas das alle drei Dimensionen der Existenz abdeckt: Religion, Weltleben und Jenseits." },
    source: ["Sahih Muslim"] },

  { id: 239, catId: "goodness", type: "dua", order: 7,
    title: { en: "Dua when seeing the new crescent moon", fr: "Invocation a la vue du nouveau croissant", de: "Dua beim Sehen der neuen Mondsichel" },
    arabic: "اَللَّهُ أَكْبَرُ، اَللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالأَمْنِ وَالإِيْمَانِ، وَالسَّلَامَةِ وَالإِسْلَامِ، وَالتَّوْفِيقِ لِمَا تُحِبُّ وَتَرْضَى، رَبُّنَا وَرَبُّكَ اللَّهُ",
    transliteration: "Allaahu akbar, allaahumma ahillahu alainaa bil amni wal iimaan, was-salaamati wal islaam, wat-taufiiqi limaa tuhibbu wa tardhoo, robbunaa wa robbukallaah.",
    translation: {
      en: "Allah is the Greatest. O Allah, bring this crescent upon us with security, faith, safety, Islam, and success in what You love and are pleased with. Our Lord and your Lord is Allah.",
      fr: "Allah est le Plus Grand. O Allah, fais apparaitre ce croissant avec securite, foi, paix et islam, et reussite dans ce que Tu aimes. Notre Seigneur et ton Seigneur est Allah.",
      de: "Allah ist der Groesste. O Allah, lasse diese Mondsichel ueber uns erscheinen mit Sicherheit, Glauben, Wohlbefinden und Islam sowie Erfolg in dem was Du liebst. Unser Herr und dein Herr ist Allah." },
    instruction: {
      en: "Said when seeing the new crescent moon at the start of each Islamic month.",
      fr: "Dit en voyant le nouveau croissant au debut de chaque mois islamique.",
      de: "Gesagt beim Sehen der neuen Mondsichel zu Beginn jeden islamischen Monats." },
    source: ["At-Tirmidhi", "Sahih"] },

  { id: 240, catId: "goodness", type: "dua", order: 8,
    title: { en: "Bless our fruits, city and provisions", fr: "Benis nos fruits, notre ville et nos provisions", de: "Segne unsere Fruechte, Stadt und Versorgung" },
    arabic: "اَللَّهُمَّ بَارِكْ لَنَا فِيْ ثَمَرِنَا، وَبَارِكْ لَنَا فِيْ مَدِيْنَتِنَا، وَبَارِكْ لَنَا فِيْ صَاعِنَا، وَبَارِكْ لَنَا فِيْ مُدِّنَا",
    transliteration: "Allaahumma baarik lanaa fii tsamarinaa, wa baarik lanaa fii madiinatinaa, wa baarik lanaa fii shoo-inaa, wa baarik lanaa fii muddinaa.",
    translation: {
      en: "O Allah, bless our fruits, our city, our measures, and our provisions.",
      fr: "O Allah, benis nos fruits, notre ville, nos mesures et nos provisions.",
      de: "O Allah, segne unsere Fruechte, unsere Stadt, unsere Masse und unsere Versorgung." },
    benefit: {
      en: "The Prophet said this dua specifically for Madinah. Scholars say it applies to any city or home where a Muslim lives. Ask Allah to bless your local food, community and provisions.",
      fr: "Le Prophete a dit ce dua specifiquement pour Medine. Les savants disent qu'il s'applique a toute ville ou foyer musulman.",
      de: "Der Prophet sprach dieses Dua speziell fuer Medina. Gelehrte sagen es gilt fuer jede Stadt oder jeden Haushalt eines Muslims." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 241, catId: "goodness", type: "dua", order: 9,
    title: { en: "Call me to account with an easy reckoning", fr: "Fais-moi rendre des comptes avec facilite", de: "Rechne mich mit einer leichten Abrechnung ab" },
    arabic: "اَللَّهُمَّ حَاسِبْنِى حِسَابًا يَسِيرًا",
    transliteration: "Allaahumma haasibnii hisaaban yasiiron.",
    translation: {
      en: "O Allah, call me to account with an easy reckoning.",
      fr: "O Allah, fais-moi rendre des comptes avec facilite.",
      de: "O Allah, rechne mich mit einer leichten Abrechnung ab." },
    benefit: {
      en: "The Prophet said whoever is subjected to a strict reckoning on the Day of Judgment will be ruined. Aisha asked what an easy reckoning means - he said it is when Allah merely shows a person their deeds without holding them strictly accountable.",
      fr: "Le Prophete a dit que celui qui subit un jugement strict le Jour du Jugement sera perdu. Aisha demanda ce que signifie un jugement facile - il dit que c'est quand Allah montre simplement a une personne ses actes.",
      de: "Der Prophet sagte wer am Jenseitstag einer strengen Abrechnung unterzogen wird ist verloren. Aisha fragte was eine leichte Abrechnung bedeutet - er sagte es ist wenn Allah einer Person einfach ihre Taten zeigt." },
    source: ["Ahmad", "Authenticated"] },

  { id: 242, catId: "goodness", type: "dua", order: 10,
    title: { en: "The word of truth in anger and in pleasure", fr: "La parole de verite dans la colere et la satisfaction", de: "Das Wort der Wahrheit im Zorn und in Zufriedenheit" },
    arabic: "اَللَّهُمَّ إِنِّى أَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الْغَضَبِ وَالرِّضَى",
    transliteration: "Allaahumma innii as-aluka kalimatal haqqi fil ghodhobi war-ridhoo.",
    translation: {
      en: "O Allah, I ask You for the word of truth in anger and in pleasure.",
      fr: "O Allah, je Te demande la parole de verite dans la colere et dans la satisfaction.",
      de: "O Allah, ich bitte Dich um das Wort der Wahrheit im Zorn und in Zufriedenheit." },
    benefit: {
      en: "It is easy to speak truth when relaxed. The real test is saying what is right when angry or pleased. This dua asks for consistency in honesty regardless of emotional state.",
      fr: "Il est facile de dire la verite quand on est calme. Le vrai test est de dire ce qui est juste en etant en colere ou content. Ce dua demande la coherence dans l'honnetete.",
      de: "Es ist leicht die Wahrheit zu sagen wenn man entspannt ist. Der echte Test ist das Richtige zu sagen wenn man wuetend oder erfreut ist." },
    source: ["An-Nasai", "Authenticated"] },

  { id: 243, catId: "goodness", type: "dua", order: 11,
    title: { en: "Delight of seeing Allah's Face without harm", fr: "Plaisir de contempler le Visage d'Allah sans epreuve", de: "Freude am Anblick von Allahs Antlitz ohne Schaden" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ، وَالشَّوْقَ إِلَى لِقَائِكَ فِي غَيْرِ ضَرَّاءَ مُضِرَّةٍ وَلَا فِتْنَةٍ مُضِلَّةٍ",
    transliteration: "Allaahumma innii as-aluka ladz-dzatan-nazhori ilaa wajhika, wasy-syauqo ilaa liqoo-ika fii ghoiri dhorroo-a mudhirrotin wa laa fitnatin mudhillah.",
    translation: {
      en: "O Allah, I ask You for the delight of looking at Your Face and the longing to meet You, without harmful hardship or misleading trials.",
      fr: "O Allah, je Te demande le plaisir de contempler Ton Visage et le desir de Te rencontrer sans epreuve nuisible ni tentation egarante.",
      de: "O Allah, ich bitte Dich um die Freude Dein Angesicht zu sehen und die Sehnsucht nach der Begegnung mit Dir ohne schaedliches Leid oder irrefuehrende Pruefungen." },
    benefit: {
      en: "Seeing Allah's Face is the greatest reward of Paradise. This dua asks for that longing and preparation for it, while being protected from trials that could derail one from the path.",
      fr: "Voir le Visage d'Allah est la plus grande recompense du Paradis. Ce dua demande ce desir et sa preparation, tout en etant protege des epreuves.",
      de: "Allahs Antlitz zu sehen ist die groesste Belohnung des Paradieses. Dieses Dua bittet um diese Sehnsucht und Vorbereitung dafuer." },
    source: ["An-Nasai", "Authenticated"] },

  { id: 244, catId: "goodness", type: "dua", order: 12,
    title: { en: "Your love, love of those who love You, love of deeds near You", fr: "Ton amour, l'amour de ceux qui T'aiment, l'amour des actes qui rapprochent", de: "Deine Liebe, Liebe der Liebenden, Liebe zu naeherbringenden Taten" },
    arabic: "اَللَّهُمَّ إِنِّى أَسْأَلُكَ حُبَّكَ، وَحُبَّ مَنْ يُحِبُّكَ، وَحُبَّ عَمَلٍ يُقَرِّبُ إِلَى حُبِّكَ",
    transliteration: "Allaahumma innii as-aluka hubbaka, wa hubba man yuhibbuka, wa hubba amlalin yuqorribu ilaa hubbika.",
    translation: {
      en: "O Allah, I ask You for Your love, the love of those who love You, and the love of deeds that bring me closer to Your love.",
      fr: "O Allah, je Te demande Ton amour, l'amour de ceux qui T'aiment et l'amour des actions qui me rapprochent de Ton amour.",
      de: "O Allah, ich bitte Dich um Deine Liebe, die Liebe derjenigen die Dich lieben, und die Liebe zu Taten die mich Deiner Liebe naeherbringen." },
    source: ["At-Tirmidhi", "Sahih"] },

  { id: 245, catId: "goodness", type: "dua", order: 13,
    title: { en: "Make Your love more beloved to me than myself and cold water", fr: "Rends Ton amour plus cher que moi-meme et l'eau fraiche", de: "Mache Deine Liebe mir lieber als mich selbst und kaltes Wasser" },
    arabic: "اَللَّهُمَّ إِنِّى أَسْأَلُكَ حُبَّكَ، وَحُبَّ مَنْ يُحِبُّكَ، وَالْعَمَلَ الَّذِى يُبَلِّغُنِى حُبَّكَ، اَللَّهُمَّ اجْعَلْ حُبَّكَ أَحَبَّ إِلَىَّ مِنْ نَفْسِى، وَأَهْلِى، وَمِنَ الْمَاءِ الْبَارِدِ",
    transliteration: "Allaahumma innii as-aluka hubbaka, wa hubba man yuhibbuka, wal amala-ladzii yuballighunii hubbaka. Allaahummaj-al hubbaka ahabba ilayya min nafsii wa ahlii wa minal maa-il baarid.",
    translation: {
      en: "O Allah, I ask You for Your love, the love of those who love You, and deeds that bring me closer to Your love. O Allah, make Your love more beloved to me than myself, my family, and cold water.",
      fr: "O Allah, je Te demande Ton amour, l'amour de ceux qui T'aiment et les actions qui me rapprochent de Ton amour. O Allah, rends Ton amour plus cher pour moi que moi-meme, ma famille et l'eau fraiche.",
      de: "O Allah, ich bitte Dich um Deine Liebe, die Liebe derjenigen die Dich lieben, und Taten die mich Deiner Liebe naeherbringen. O Allah, mache Deine Liebe mir lieber als mich selbst, meine Familie und kaltes Wasser." },
    benefit: {
      en: "Cold water in the Arabian heat was the most refreshing and beloved thing imaginable. The Prophet used this vivid comparison to express the ultimate degree of love for Allah that a believer should seek.",
      fr: "L'eau froide dans la chaleur arabique etait la chose la plus rafraichissante imaginable. Le Prophete a utilise cette comparaison pour exprimer le degre ultime d'amour pour Allah.",
      de: "Kaltes Wasser in der arabischen Hitze war das Erfrischendste vorstellbare. Der Prophet nutzte diesen lebhaften Vergleich um den hoechsten Grad der Liebe zu Allah auszudruecken." },
    source: ["At-Tirmidhi", "Authenticated"] },

  { id: 246, catId: "goodness", type: "dua", order: 14,
    title: { en: "Comprehensive dua – unseen knowledge to adornment of faith", fr: "Invocation complete – science cachee jusqu'a la parure de la foi", de: "Umfassendes Dua – verborgenes Wissen bis Schmuck des Glaubens" },
    arabic: "اَللَّهُمَّ بِعِلْمِكَ الْغَيْبِ وَقُدْرَتِكَ عَلَى الْخَلْقِ، أَحْيِنِي مَا عَلِمْتَ الْحَيَاةَ خَيْرًا لِي، وَتَوَفَّنِي إِذَا عَلِمْتَ الْوَفَاةَ خَيْرًا لِي، اَللَّهُمَّ وَأَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ، وَأَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الرِّضَا وَالْغَضَبِ، وَأَسْأَلُكَ الْقَصْدَ فِي الْفَقْرِ وَالْغِنَى، وَأَسْأَلُكَ نَعِيمًا لَا يَنْفَدُ، وَأَسْأَلُكَ قُرَّةَ عَيْنٍ لَا تَنْقَطِعُ، وَأَسْأَلُكَ الرِّضَا بَعْدَ الْقَضَاءِ، وَأَسْأَلُكَ بَرْدَ الْعَيْشِ بَعْدَ الْمَوْتِ، وَأَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ، وَالشَّوْقَ إِلَى لِقَائِكَ فِي غَيْرِ ضَرَّاءٍ مُضِرَّةٍ وَلَا فِتْنَةٍ مُضِلَّةٍ، اَللَّهُمَّ زَيِّنَّا بِزِينَةِ الْإِيمَانِ وَاجْعَلْنَا هُدَاةً مُهْتَدِينَ",
    transliteration: "Allaahumma bi-ilmikal ghoibi wa qudrotika alal kholqi, ahyinii maa alimtal hayaata khoiran lii, wa tawaffanii idzaa alimtal wafaata khoiran lii. Allaahumma wa as-aluka khosyataka fil ghoibi wash-shahaadati, wa as-aluka kalimatal haqqi fir-ridhoo wal ghodhob, wa as-aluka al-qoshda fil faqri wal ghinaa, wa as-aluka na-iiman laa yanfad, wa as-aluka qurrata ainin laa tanqothi, wa as-aluka ar-ridhoo ba-dal qodhoo, wa as-aluka barodal ayshi ba-dal maut, wa as-aluka ladz-dzatan-nazhori ilaa wajhika, wasy-syauqo ilaa liqoo-ika fii ghoiri dhorroo-in mudhirrotin wa laa fitnatin mudhillah. Allaahumma zayyinnaa bizizanatil iimaani waj-alnaa hudaatan muhtadiin.",
    translation: {
      en: "O Allah, by Your knowledge of the unseen and Your power over creation – keep me alive as long as life is good for me, and take me when death is better for me. O Allah, I ask You for Your fear in secret and in public, the word of truth in contentment and in anger, moderation in poverty and wealth, unending bliss, endless joy, contentment after Your decree, the coolness of life after death, the delight of seeing Your Face, and longing to meet You without harm or misguidance. O Allah, adorn us with the adornment of faith and make us guides who are guided.",
      fr: "O Allah, par Ta science de l'invisible et Ta puissance sur la creation – garde-moi en vie tant que la vie m'est benefique, et fais-moi mourir quand la mort m'est meilleure. O Allah, je Te demande Ta crainte en secret et en public, la parole de verite dans la satisfaction et la colere, la moderation dans la pauvrete et la richesse, une felicite sans fin, une joie perpetuelle, la satisfaction apres Ton decret, la fraicheur de la vie apres la mort, le plaisir de voir Ton Visage et le desir de Te rencontrer sans epreuve ni egare. O Allah, pare-nous de la parure de la foi et fais de nous des guides bien guides.",
      de: "O Allah, durch Dein Wissen uber das Verborgene und Deine Macht uber die Schopfung – lass mich leben solange das Leben gut fur mich ist, und nimm mich wenn der Tod besser fur mich ist. O Allah, ich bitte Dich um Deine Furcht im Verborgenen und in der Offentlichkeit, das Wort der Wahrheit in Zufriedenheit und Zorn, Massigung in Armut und Reichtum, unvergangliche Glueckseligkeit, unendliche Freude, Zufriedenheit nach Deinem Beschluss, die Kuehle des Lebens nach dem Tod, die Freude Dein Angesicht zu sehen und die Sehnsucht Dich zu treffen ohne Schaden oder Irrefuhrung. O Allah, schmucke uns mit dem Schmuck des Glaubens und mache uns zu geleiteten Fuhrern." },
    benefit: {
      en: "One of the most comprehensive duas the Prophet taught. It covers 10 major requests in one supplication, from life and death to seeing Allah's Face. Memorize and say it regularly.",
      fr: "L'une des invocations les plus completes que le Prophete a enseignees. Elle couvre 10 demandes majeures en une seule supplication.",
      de: "Eines der umfassendsten Duas die der Prophet lehrte. Es deckt 10 grosse Bitten in einer einzigen Bittrede ab." },
    source: ["An-Nasai", "Authenticated"] },

  { id: 247, catId: "goodness", type: "dua", order: 15,
    title: { en: "Accept from us – Dua of Ibrahim (Quran 2:127)", fr: "Accepte de nous – Invocation d'Ibrahim (Coran 2:127)", de: "Nimm von uns an – Dua Ibrahims (Quran 2:127)" },
    arabic: "رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ، وَتُبْ عَلَيْنَا إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ",
    transliteration: "Robbanaa taqobbal minnaa innaka antas-samii-ul aliim, wa tub alainaa innaka antat-tawwaabur-rohiim.",
    translation: {
      en: "Our Lord, accept from us. Indeed You are the Hearing, the Knowing. And accept our repentance. Indeed You are the Accepting of repentance, the Merciful.",
      fr: "Notre Seigneur, accepte de nous. Tu es certes l'Audient, l'Omniscient. Et accepte notre repentir. Tu es certes Celui qui accepte le repentir, le Misericordieux.",
      de: "Unser Herr, nimm von uns an. Du bist wahrlich der Alles Horende, Allwissende. Und nimm unsere Reue an. Du bist wahrlich der Reue-Annehmende, der Barmherzige." },
    benefit: {
      en: "The dua of Prophet Ibrahim and his son Ismail as they built the Kaaba. Say it after every good deed and act of worship, asking Allah to accept it.",
      fr: "L'invocation du Prophete Ibrahim et de son fils Ismail en construisant la Kaaba. La dire apres chaque bonne action et acte d'adoration.",
      de: "Das Dua des Propheten Ibrahim und seines Sohnes Ismail wahrend sie die Kaaba bauten. Nach jeder guten Tat und jedem Gottesdienst sprechen." },
    source: ["Quran 2:127-128"] },

  { id: 248, catId: "goodness", type: "dua", order: 16,
    title: { en: "Wisdom, good mention and Garden of Delight (Quran 26:83-85)", fr: "Sagesse, bonne mention et Jardin des Delices (Coran 26:83-85)", de: "Weisheit, gutes Andenken und Garten der Wonnen (Quran 26:83-85)" },
    arabic: "رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ، وَاجْعَلْ لِي لِسَانَ صِدْقٍ فِي الْآخِرِينَ، وَاجْعَلْنِي مِنْ وَرَثَةِ جَنَّةِ النَّعِيمِ",
    transliteration: "Robbi hab lii hukman wa alhiqnii bish-shoolihiin, waj-al lii lisaana shidqin fil aakhiriin, waj-alnii min warotsati jannatun na-iim.",
    translation: {
      en: "My Lord, grant me wisdom and join me with the righteous. And grant me a reputation of honor among later generations. And place me among the inheritors of the Garden of Delight.",
      fr: "Seigneur, accorde-moi la sagesse et fais-moi rejoindre les vertueux. Accorde-moi une bonne mention parmi les generations futures. Et fais de moi l'un des heritiers du Jardin des Delices.",
      de: "Mein Herr, gib mir Weisheit und fuege mich zu den Rechtschaffenen. Gewahre mir ein ehrenvolles Andenken bei spateren Generationen. Und mache mich zu einem der Erben des Gartens der Wonnen." },
    benefit: {
      en: "The dua of Prophet Ibrahim encompassing three profound requests: wisdom to judge rightly, a good legacy that lasts, and ultimately Paradise.",
      fr: "L'invocation du Prophete Ibrahim couvrant trois demandes profondes : sagesse, bonne memoire durable et finalement le Paradis.",
      de: "Das Dua des Propheten Ibrahim mit drei tiefgrunndigen Bitten: Weisheit, gutes Erbe und schliesslich das Paradies." },
    source: ["Quran 26:83-85"] },

  { id: 249, catId: "goodness", type: "dua", order: 17,
    title: { en: "Write us among the witnesses (Quran 5:83)", fr: "Inscris-nous parmi les temoins (Coran 5:83)", de: "Schreibe uns unter die Zeugen (Quran 5:83)" },
    arabic: "رَبَّنَا آمَنَّا فَاكْتُبْنَا مَعَ الشَّاهِدِينَ",
    transliteration: "Robbanaa aamannaa fak-tubnaa ma-ash-shaahidiin.",
    translation: {
      en: "Our Lord, we have believed, so write us among the witnesses.",
      fr: "Notre Seigneur, nous avons cru, alors inscris-nous parmi les temoins.",
      de: "Unser Herr, wir haben geglaubt, so schreibe uns unter die Zeugen." },
    benefit: {
      en: "The dua of the people of the Gospel when they heard the Quran and accepted Islam. They asked to be recorded as witnesses to the truth. A beautiful dua to affirm one's faith.",
      fr: "L'invocation des gens de l'Evangile quand ils entendirent le Coran et accepterent l'Islam. Ils demandaient a etre enregistres comme temoins de la verite.",
      de: "Das Dua der Leute des Evangeliums als sie den Quran horten und den Islam annahmen. Sie baten darum als Zeugen der Wahrheit aufgezeichnet zu werden." },
    source: ["Quran 5:83"] },

  { id: 250, catId: "goodness", type: "dua", order: 18,
    title: { en: "Upon You we rely, to You we return (Quran 60:4)", fr: "En Toi nous avons confiance, vers Toi nous retournons (Coran 60:4)", de: "Auf Dich vertrauen wir, zu Dir kehren wir zuruck (Quran 60:4)" },
    arabic: "رَبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ الْمَصِيرُ",
    transliteration: "Robbanaa alaika tawakkalnaa wa ilaika anabnaa wa ilaikal mashiir.",
    translation: {
      en: "Our Lord, upon You we have relied, and to You we have returned, and to You is the final destination.",
      fr: "Notre Seigneur, en Toi nous avons place notre confiance, vers Toi nous nous sommes repentis et vers Toi est le retour final.",
      de: "Unser Herr, auf Dich haben wir uns verlassen, zu Dir haben wir uns gewandt und zu Dir ist die endgultige Ruckkehr." },
    source: ["Quran 60:4"] },

  { id: 251, catId: "goodness", type: "dua", order: 19,
    title: { en: "Allah is sufficient for me (Quran 9:129)", fr: "Allah me suffit (Coran 9:129)", de: "Allah genuegt mir (Quran 9:129)" },
    arabic: "حَسْبِيَ اللَّهُ لَا إِلَـٰهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",
    transliteration: "Hasbiyallaahu laa ilaaha illaa huwa alaihi tawakkaltu wa huwa rabbul arshil azhiim.",
    translation: {
      en: "Allah is sufficient for me. There is no deity except Him. Upon Him I have relied, and He is the Lord of the Magnificent Throne.",
      fr: "Allah me suffit. Il n'y a pas de divinite sauf Lui. Je m'en remets a Lui et Il est le Seigneur du Trone Majestueux.",
      de: "Allah genuegt mir. Es gibt keinen Gott ausser Ihm. Auf Ihn verlasse ich mich und Er ist der Herr des gewaltigen Thrones." },
    benefit: {
      en: "The Prophet said: whoever says this seven times morning and evening, Allah will suffice him in whatever worries him. A powerful statement of complete reliance on Allah.",
      fr: "Le Prophete a dit : celui qui dit cela sept fois le matin et le soir, Allah lui suffira dans ce qui l'inquiete.",
      de: "Der Prophet sagte: Wer dies siebenmal morgens und abends sagt, wird Allah ihm genugen in dem was ihn besorgt." },
    source: ["Quran 9:129", "Abu Dawud", "Authenticated"] },

  { id: 252, catId: "goodness", type: "dua", order: 20,
    title: { en: "Do not let our hearts deviate (Quran 3:8)", fr: "Ne laisse pas nos coeurs devier (Coran 3:8)", de: "Lass unsere Herzen nicht abweichen (Quran 3:8)" },
    arabic: "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ",
    transliteration: "Robbanaa laa tuzigh quluubanaa ba-da idz hadaitanaa wa hab lanaa min ladunka rohmatan innaka antal wahhaab.",
    translation: {
      en: "Our Lord, do not let our hearts deviate after You have guided us, and grant us from Yourself mercy. Indeed, You are the Giver.",
      fr: "Notre Seigneur, ne laisse pas nos coeurs devier apres que Tu nous as guides, et accorde-nous de Ta part une misericorde. Tu es certes le Grand Donateur.",
      de: "Unser Herr, lass unsere Herzen nicht abweichen nachdem Du uns rechtgeleitet hast, und gewahre uns von Dir Barmherzigkeit. Du bist wahrlich der Geber." },
    benefit: {
      en: "Those with deep knowledge fear misguidance most. This dua asks Allah to keep hearts firm on guidance after receiving it – the most critical protection.",
      fr: "Ceux qui ont une connaissance profonde craignent le plus l'egarement. Ce dua demande a Allah de maintenir les coeurs fermes sur la guidee.",
      de: "Jene mit tiefem Wissen furchten am meisten die Irrefuhrung. Dieses Dua bittet Allah die Herzen nach der Rechtleitung fest zu halten." },
    source: ["Quran 3:8"] },

  { id: 253, catId: "goodness", type: "dua", order: 21,
    title: { en: "Grant us mercy and prepare us rightly (Quran 18:10)", fr: "Accorde-nous misericorde et prepare-nous bien (Coran 18:10)", de: "Gewahre uns Barmherzigkeit und bereite uns recht vor (Quran 18:10)" },
    arabic: "رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا",
    transliteration: "Robbanaa aatinaa min ladunka rohmatan wa hayyi-lana min amrinaa rasyadaa.",
    translation: {
      en: "Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance.",
      fr: "Notre Seigneur, accorde-nous une misericorde de Ta part et prepare pour nous dans notre situation la bonne direction.",
      de: "Unser Herr, gewahre uns Barmherzigkeit von Dir und bereite uns in unserer Angelegenheit die rechte Leitung vor." },
    benefit: {
      en: "The dua of the People of the Cave (Ashab al-Kahf) who fled persecution for their faith. A powerful dua when facing hardship or uncertainty.",
      fr: "L'invocation des Gens de la Caverne qui ont fui la persecution pour leur foi. Une puissante invocation face aux difficultes.",
      de: "Das Dua der Bewohner der Hohle die vor Verfolgung wegen ihres Glaubens flohen. Ein kraftvolles Dua bei Schwierigkeiten oder Ungewissheit." },
    source: ["Quran 18:10"] },

  { id: 254, catId: "goodness", type: "dua", order: 22,
    title: { en: "You are my protector – let me die as a Muslim (Quran 12:101)", fr: "Tu es mon Protecteur – fais-moi mourir en musulman (Coran 12:101)", de: "Du bist mein Beschutzer – lass mich als Muslim sterben (Quran 12:101)" },
    arabic: "أَنتَ وَلِيِّي فِي الدُّنْيَا وَالْآخِرَةِ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ",
    transliteration: "Anta waliyyii fid-dunyaa wal aakhirah, tawaffanii musliman wa alhiqnii bish-shoolihiin.",
    translation: {
      en: "You are my protector in this world and the Hereafter. Let me die as a Muslim and join me with the righteous.",
      fr: "Tu es mon Protecteur en ce monde et dans l'au-dela. Fais-moi mourir en musulman et fais-moi rejoindre les vertueux.",
      de: "Du bist mein Beschutzer in dieser Welt und im Jenseits. Lass mich als Muslim sterben und fuege mich zu den Rechtschaffenen." },
    benefit: {
      en: "The dua of Prophet Yusuf (Joseph) after being reunited with his family and attaining power. Even at the peak of success he asked for a good death and to be with the righteous.",
      fr: "L'invocation du Prophete Yusuf apres ses retrouvailles avec sa famille. Meme au sommet du succes il demanda une bonne mort.",
      de: "Das Dua des Propheten Yusuf nach der Reunion mit seiner Familie. Selbst auf dem Hohepunkt des Erfolgs bat er um einen guten Tod." },
    source: ["Quran 12:101"] },

  { id: 255, catId: "goodness", type: "dua", order: 23,
    title: { en: "Our Lord, grant us good in this world and the Hereafter (Quran 2:201)", fr: "Notre Seigneur, accorde-nous le bien ici-bas et dans l'au-dela (Coran 2:201)", de: "Unser Herr, gewahre uns Gutes diesseits und jenseits (Quran 2:201)" },
    arabic: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
    transliteration: "Robbanaa aatinaa fid-dunyaa hasanatan wa fil aakhirati hasanatan wa qinaa adzaaban-naar.",
    translation: {
      en: "Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.",
      fr: "Notre Seigneur, accorde-nous le bien en ce monde et le bien dans l'au-dela, et protege-nous du chatiment du Feu.",
      de: "Unser Herr, gib uns Gutes in dieser Welt und Gutes im Jenseits und bewahre uns vor der Strafe des Feuers." },
    benefit: {
      en: "The Prophet said this dua so often that it became the most frequently recited of all duas. It covers everything a believer could want in three requests.",
      fr: "Le Prophete disait ce dua si souvent qu'il est devenu le plus recite de toutes les invocations. Il couvre tout ce qu'un croyant pourrait vouloir.",
      de: "Der Prophet sprach dieses Dua so oft dass es das am haufigsten rezitierte aller Duas wurde. Es deckt alles ab was ein Glaubiger wollen konnte." },
    source: ["Quran 2:201", "Sahih Bukhari", "Sahih Muslim"] },

  { id: 256, catId: "goodness", type: "dua", order: 24,
    title: { en: "Guide me and make me upright", fr: "Guide-moi et affermis-moi dans la droiture", de: "Leite mich und mache mich aufrecht" },
    arabic: "اَللَّهُمَّ اهْدِنِيْ وَسَدِّدْنِي",
    transliteration: "Allaahummahdinii wa saddidnii.",
    translation: {
      en: "O Allah, guide me and make me upright.",
      fr: "O Allah, guide-moi et affermis-moi dans la droiture.",
      de: "O Allah, leite mich und mache mich aufrecht." },
    benefit: {
      en: "Guidance (huda) is for the heart and saddid means to hit the mark – to do things correctly and precisely. A short but complete dua for direction and accuracy in all matters.",
      fr: "La guidee est pour le coeur et saddid signifie atteindre la cible – faire les choses correctement. Une invocation courte mais complete.",
      de: "Rechtleitung ist fur das Herz und saddid bedeutet das Ziel treffen – Dinge korrekt und prazise tun. Ein kurzes aber vollstandiges Dua." },
    source: ["Sahih Muslim"] },

  { id: 257, catId: "goodness", type: "dua", order: 25,
    title: { en: "Pour patience upon us and let us die as Muslims (Quran 7:126)", fr: "Deverse sur nous la patience et fais-nous mourir en musulmans (Coran 7:126)", de: "Schutte Geduld uber uns aus und lass uns als Muslime sterben (Quran 7:126)" },
    arabic: "رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ",
    transliteration: "Robbanaa afrigh alainaa shobran wa tawaffanaa muslimiin.",
    translation: {
      en: "Our Lord, pour upon us patience and let us die as Muslims in submission to You.",
      fr: "Notre Seigneur, deverse sur nous la patience et fais-nous mourir en musulmans soumis a Toi.",
      de: "Unser Herr, schutte Geduld uber uns aus und lass uns als Muslime in Unterwerfung unter Dich sterben." },
    benefit: {
      en: "The dua of the sorcerers of Pharaoh after they believed in Moses and were threatened with death. They asked for patience to face execution and a good death – an extraordinary example of faith.",
      fr: "L'invocation des magiciens de Pharaon apres qu'ils ont cru en Moise et ont ete menaces de mort. Une extraordinaire example de foi.",
      de: "Das Dua der Zauberer des Pharao nachdem sie an Musa glaubten und mit dem Tod bedroht wurden. Ein ausserordentliches Beispiel von Glauben." },
    source: ["Quran 7:126"] },

  { id: 258, catId: "goodness", type: "dua", order: 26,
    title: { en: "Keep me alive if good, take me if better", fr: "Garde-moi en vie si c'est mieux, prends-moi si c'est mieux", de: "Lass mich leben wenn gut, nimm mich wenn besser" },
    arabic: "اَللَّهُمَّ أَحْيِنِي مَا كَانَتِ الحَيَاةُ خَيْرًا لِي، وَتَوَفَّنِي إِذَا كَانَتِ الوَفَاةُ خَيْرًا لِي",
    transliteration: "Allaahumma ahyinii maa kaanatil hayaatu khoiran lii, wa tawaffanii idzaa kaanatil wafaatu khoiran lii.",
    translation: {
      en: "O Allah, keep me alive as long as life is good for me, and cause me to die when death is better for me.",
      fr: "O Allah, maintiens-moi en vie tant que la vie m'est benefique, et fais-moi mourir quand la mort m'est meilleure.",
      de: "O Allah, lass mich am Leben solange das Leben gut fur mich ist, und lass mich sterben wenn der Tod besser fur mich ist." },
    benefit: {
      en: "The Prophet taught that a believer should not long for death due to hardship, but should entrust the timing to Allah. This dua perfectly expresses that trust.",
      fr: "Le Prophete a enseigne qu'un croyant ne doit pas desirer la mort a cause des difficultes, mais confier le moment a Allah.",
      de: "Der Prophet lehrte dass ein Glaubiger den Tod nicht wegen Schwierigkeiten herbeisehnen sollte, sondern den Zeitpunkt Allah uberlassen." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 259, catId: "goodness", type: "dua", order: 27,
    title: { en: "Make me firm and a guided guide", fr: "Affermis-moi et fais de moi un guide bien guide", de: "Mache mich fest und zu einem geleiteten Fuhrer" },
    arabic: "اَللَّهُمَّ ثَبِّتْنِي، وَاجْعَلْنِي هَادِيًا مَهْدِيًّا",
    transliteration: "Allaahumma tsabbitnii, waj-alnii haadiyam mahdiyyaa.",
    translation: {
      en: "O Allah, make me firm and make me a guide who is himself guided.",
      fr: "O Allah, affermis-moi et fais de moi un guide qui est lui-meme bien guide.",
      de: "O Allah, mache mich fest und mache mich zu einem Fuhrer der selbst geleitet ist." },
    benefit: {
      en: "Not only to be guided but to guide others – while being guided oneself. A leader or teacher who is himself lost is dangerous. This dua asks for both personal firmness and the ability to lead others rightly.",
      fr: "Non seulement etre guide mais guider les autres tout en etant soi-meme bien guide. Un chef ou enseignant qui est lui-meme egare est dangereux.",
      de: "Nicht nur geleitet sein sondern andere leiten wahrend man selbst geleitet ist. Ein Fuhrer oder Lehrer der selbst verloren ist ist gefahrlich." },
    source: ["Sahih Bukhari"] },

  { id: 260, catId: "goodness", type: "dua", order: 28,
    title: { en: "Our Lord, we have wronged ourselves (Quran 7:23)", fr: "Notre Seigneur, nous nous sommes fait du tort (Coran 7:23)", de: "Unser Herr, wir haben uns Unrecht getan (Quran 7:23)" },
    arabic: "رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ",
    transliteration: "Robbanaa zholamnaa anfusanaa wa in lam taghfir lanaa wa tarhamnaa lanakuunanna minal khoosiriin.",
    translation: {
      en: "Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.",
      fr: "Notre Seigneur, nous nous sommes fait du tort, et si Tu ne nous pardonnes pas et ne nous fais pas misericorde, nous serons certes parmi les perdants.",
      de: "Unser Herr, wir haben uns selbst Unrecht getan, und wenn Du uns nicht vergibst und Dich unser nicht erbarmst werden wir gewiss zu den Verlierenden gehoren." },
    benefit: {
      en: "The first dua taught by Allah to Adam and Hawwa after their mistake in Paradise. The model of sincere repentance: full acknowledgment with no excuses, and complete dependence on Allah.",
      fr: "La premiere invocation enseignee par Allah a Adam et Hawwa. Le modele du repentir sincere : pleine reconnaissance sans excuses.",
      de: "Das erste Dua das Allah Adam und Hawwa lehrte. Das Modell aufrichtiger Reue: vollstandige Anerkennung ohne Ausreden." },
    source: ["Quran 7:23"] },

  { id: 261, catId: "goodness", type: "dua", order: 29,
    title: { en: "O Protector of Islam – keep me on Islam until I meet You", fr: "O Protecteur de l'Islam – maintiens-moi dans l'Islam jusqu'a Ta rencontre", de: "O Beschutzer des Islam – erhalte mich im Islam bis ich Dich treffe" },
    arabic: "يَا وَلِيَّ الْإِسْلَامِ وَأَهْلِهِ، مَسِّكْنِي الْإِسْلَامَ، حَتَّى أَلْقَاكَ عَلَيْهِ",
    transliteration: "Yaa waliyyal islaami wa ahlih, massiknil islaam, hattaa alqaaka alaih.",
    translation: {
      en: "O Protector of Islam and its people, keep me firm in Islam until I meet You upon it.",
      fr: "O Protecteur de l'Islam et de ses fideles, maintiens-moi ferme dans l'Islam jusqu'a ce que je Te rencontre avec lui.",
      de: "O Beschutzer des Islam und seiner Anhanger, halte mich fest im Islam bis ich Dich damit treffe." },
    benefit: {
      en: "To die upon Islam (husn al-khatima) is the ultimate goal. This dua asks Allah by His own attribute as Protector of Islam to protect us in it until our last breath.",
      fr: "Mourir dans l'Islam est le but ultime. Ce dua demande a Allah par Son propre attribut de Protecteur de l'Islam de nous y proteger jusqu'au dernier souffle.",
      de: "Im Islam zu sterben ist das oberste Ziel. Dieses Dua bittet Allah durch Sein eigenes Attribut als Beschutzer des Islam uns darin bis zum letzten Atemzug zu schuetzen." },
    source: ["At-Tabarani", "Authenticated"] },

  { id: 262, catId: "goodness", type: "dua", order: 30,
    title: { en: "Unwavering faith, endless bliss and companionship of the Prophet", fr: "Foi ferme, bonheur sans fin et compagnie du Prophete", de: "Unerschutterlicher Glaube, unendliche Glueckseligkeit und Begleitung des Propheten" },
    arabic: "اَللَّهُمَّ إِنِّي أَسْأَلُكَ إِيْمَانًا لَا يَرْتَدُّ، وَنَعِيْمًا لَا يَنْفَدُ، وَمُرَافَقَةَ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي أَعْلَى جَنَّةِ الْخُلْدِ",
    transliteration: "Allaahumma innii as-aluka iimaanan laa yartadd, wa na-iiman laa yanfad, wa muraafaqata muhammadin shallallaahu alaihi wa sallama fii aAlaa jannatul khuld.",
    translation: {
      en: "O Allah, I ask You for faith that does not waver, bliss that does not end, and the companionship of Muhammad ﷺ in the highest level of eternal Paradise.",
      fr: "O Allah, je Te demande une foi qui ne vacille pas, une felicite qui ne s'epuise pas, et la compagnie de Muhammad ﷺ dans les plus hauts niveaux du Paradis eternel.",
      de: "O Allah, ich bitte Dich um Glauben der nicht wankt, Glueckseligkeit die nicht endet, und die Begleitung von Muhammad ﷺ in der hochsten Stufe des ewigen Paradieses." },
    benefit: {
      en: "A dua that combines the three ultimate desires of a believer: firm faith, eternal bliss, and being with the Prophet ﷺ in Paradise. The highest aspiration a Muslim can have.",
      fr: "Un dua qui combine les trois desirs ultimes d'un croyant : foi ferme, felicite eternelle et etre avec le Prophete au Paradis.",
      de: "Ein Dua das die drei ultimativen Wunsche eines Glaubigen verbindet: fester Glaube, ewige Glueckseligkeit und beim Propheten im Paradies zu sein." },
    source: ["At-Tabarani", "Authenticated"] },

  { id: 263, catId: "goodness", type: "dua", order: 31,
    title: { en: "Make me content with what You have given", fr: "Rends-moi content de ce que Tu m'as donne", de: "Mache mich zufrieden mit dem was Du mir gegeben hast" },
    arabic: "اَللَّهُمَّ قَنِّعْنِيْ بِمَا رَزَقْتَنِيْ، وَبَارِكْ لِيْ فِيهِ، وَاخْلُفْ عَلَى كُلِّ غَائِبَةٍ لِيْ بِخَيْرٍ",
    transliteration: "Allaahumma qonni-nii bimaa rozaqtanii, wa baarik lii fiihi, wakh-luf alaa kulli ghoo-ibatin lii bikhoirin.",
    translation: {
      en: "O Allah, make me content with what You have provided me, bless it for me, and replace with good everything that is absent from me.",
      fr: "O Allah, rends-moi satisfait de ce que Tu m'as accorde, benis-le pour moi et remplace par du bien tout ce qui me manque.",
      de: "O Allah, mache mich zufrieden mit dem was Du mir gegeben hast, segne es mir und ersetze alles was mir fehlt durch etwas Gutes." },
    benefit: {
      en: "Contentment (qana'a) is a treasure. This dua asks for three things: satisfaction with current provision, blessing in it, and replacement of anything missing with something better.",
      fr: "La contentement est un tresor. Ce dua demande trois choses : satisfaction de la provision actuelle, benediction et remplacement de ce qui manque.",
      de: "Zufriedenheit ist ein Schatz. Dieses Dua bittet um drei Dinge: Zufriedenheit mit der aktuellen Versorgung, Segen darin und Ersatz fur alles Fehlende." },
    source: ["Al-Hakim", "Authenticated"] },

  { id: 264, catId: "goodness", type: "dua", order: 32,
    title: { en: "Our Lord, accept our repentance (Quran 2:128)", fr: "Notre Seigneur, accepte notre repentir (Coran 2:128)", de: "Unser Herr, nimm unsere Reue an (Quran 2:128)" },
    arabic: "رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِنْ ذُرِّيَّتِنَا أُمَّةً مُسْلِمَةً لَكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ",
    transliteration: "Robbanaa waj-alnaa muslimaini laka wa min dzurriyyatinaa ummatan muslimatan laka wa arinaa manaasikanaa wa tub alainaa innaka antat-tawwaabur-rohiim.",
    translation: {
      en: "Our Lord, make us Muslims submissive to You, and from our descendants a Muslim nation submissive to You. And show us our rites and accept our repentance. Indeed You are the Accepting of repentance, the Merciful.",
      fr: "Notre Seigneur, fais de nous des musulmans soumis a Toi, et parmi notre descendance une communaute soumise a Toi. Montre-nous nos rites et accepte notre repentir. Tu es certes Celui qui accepte le repentir, le Misericordieux.",
      de: "Unser Herr, mache uns zu dir unterworfenen Muslimen und aus unserer Nachkommenschaft eine dir unterworfene muslimische Gemeinschaft. Zeige uns unsere Riten und nimm unsere Reue an. Du bist wahrlich der Reue-Annehmende, der Barmherzige." },
    benefit: {
      en: "The continuation of the dua of Ibrahim when building the Kaaba. He asked not only for himself but for his descendants to be a Muslim nation – the origin of the Muslim Ummah.",
      fr: "La suite du dua d'Ibrahim en construisant la Kaaba. Il demandait non seulement pour lui-meme mais pour que ses descendants forment une nation musulmane.",
      de: "Die Fortsetzung von Ibrahims Dua beim Bau der Kaaba. Er bat nicht nur fur sich selbst sondern dass seine Nachkommen eine muslimische Nation bilden." },
    source: ["Quran 2:128"] },

  { id: 265, catId: "goodness", type: "dua", order: 33,
    title: { en: "I am truly in need of whatever good You send (Quran 28:24)", fr: "J'ai grand besoin du bien que Tu m'envoies (Coran 28:24)", de: "Ich bin wahrlich bedurftig von jedem Guten das Du sendest (Quran 28:24)" },
    arabic: "رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ",
    transliteration: "Robbi innii limaa anzalta ilayya min khoirin faqiir.",
    translation: {
      en: "My Lord, I am truly in need of whatever good You send down to me.",
      fr: "Seigneur, j'ai grandement besoin de tout bien que Tu fais descendre vers moi.",
      de: "Mein Herr, ich bin wahrlich bedurftig von jedem Guten das Du zu mir herabsendest." },
    benefit: {
      en: "The dua of Prophet Musa after he fled Egypt with nothing and sat exhausted at the well of Madyan. He expressed complete dependence on Allah. Shortly after, Allah sent him help through the two daughters of Shuaib. A reminder that sincere need expressed to Allah brings immediate relief.",
      fr: "L'invocation du Prophete Musa apres avoir fui l'Egypte sans rien et s'etre assis epuise au puits de Madyan. Il exprima sa complete dependance envers Allah. Peu apres Allah lui envoya de l'aide.",
      de: "Das Dua des Propheten Musa nachdem er ohne nichts aus Agypten geflohen war und erschopft am Brunnen von Madyan sass. Er druckte vollstandige Abhangigkeit von Allah aus. Kurz danach sandte Allah Hilfe." },
    source: ["Quran 28:24"] },

  // ── CATEGORY: PROTECTION FROM EVIL ──
  { id: 266, catId: "evil", type: "dua", order: 1,
    title: { en: "I believe in Allah – He is the First and the Last (Quran 57:3)", fr: "Je crois en Allah – Il est le Premier et le Dernier (Coran 57:3)", de: "Ich glaube an Allah – Er ist der Erste und Letzte (Quran 57:3)" },
    arabic: "آمَنْتُ بِاللَّهِ وَرُسُلِهِ، هُوَ الْأَوَّلُ وَالْآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ",
    transliteration: "Aamantu billaahi wa rusulih, huwal awwalu wal aakhiru wadh-zhaahiru wal baathinu wa huwa bikulli syai-in aliim.",
    translation: {
      en: "I believe in Allah and His messengers. He is the First and the Last, the Apparent and the Hidden, and He has knowledge of all things.",
      fr: "Je crois en Allah et en Ses messagers. Il est le Premier et le Dernier, l'Apparent et le Caché, et Il a connaissance de toute chose.",
      de: "Ich glaube an Allah und Seine Gesandten. Er ist der Erste und der Letzte, der Offenbare und der Verborgene, und Er hat Kenntnis von allen Dingen." },
    benefit: {
      en: "The Prophet said to say this when confused or troubled by conflicting thoughts or whispers of Shaytan. Affirming belief in Allah and His names brings clarity and dispels confusion.",
      fr: "Le Prophète a dit de dire cela quand on est confus ou troublé par des pensées conflictuelles ou les murmures de Shaytan.",
      de: "Der Prophet sagte dies zu sagen wenn man verwirrt oder von widersprüchlichen Gedanken oder Shaytans Flüstern beunruhigt ist." },
    source: ["Sahih Muslim", "Quran 57:3"] },

  { id: 267, catId: "evil", type: "dua", order: 2,
    title: { en: "No omen except Yours, no good except Yours", fr: "Pas de présage sauf le Tien, pas de bien sauf le Tien", de: "Kein Vorzeichen außer Deinem, kein Gutes außer Deinem" },
    arabic: "اَللَّهُمَّ لاَ طَيْرَ إِلاَّ طَيْرُكَ، وَلاَ خَيْرَ إِلاَّ خَيْرُكَ، وَلاَ إِلَـٰهَ غَيْرُكَ",
    transliteration: "Allaahumma laa thoiro illaa thoiruk, wa laa khoiro illaa khoiruk, wa laa ilaaha ghairuk.",
    translation: {
      en: "O Allah, there is no omen except Your omen, no good except Your good, and there is no deity except You.",
      fr: "Ô Allah, il n'y a pas de présage sauf le Tien, pas de bien sauf le Tien, et il n'y a pas de divinité sauf Toi.",
      de: "O Allah, es gibt kein Vorzeichen außer Deinem, kein Gutes außer Deinem, und es gibt keinen Gott außer Dir." },
    benefit: {
      en: "Said when one sees a bad omen or feels superstitious fear. Islam forbids acting on omens (tiyara). This dua rejects the omen and reaffirms that only Allah controls all affairs.",
      fr: "Dit quand on voit un mauvais présage ou ressent une peur superstitieuse. L'Islam interdit d'agir sur les présages. Ce dua rejette le présage et réaffirme qu'Allah contrôle tout.",
      de: "Gesagt wenn man ein schlechtes Vorzeichen sieht oder abergläubische Angst empfindet. Der Islam verbietet das Handeln auf Vorzeichen. Dieses Dua lehnt das Vorzeichen ab." },
    source: ["Ahmad", "Authenticated"] },

  { id: 268, catId: "evil", type: "dua", order: 3,
    title: { en: "Refuge from loss of blessings, hardship and sudden misfortune", fr: "Refuge contre la perte des bienfaits et le malheur soudain", de: "Zuflucht vor dem Verlust der Gaben und plötzlichem Unheil" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ، وَتَحَوُّلِ عَافِيَتِكَ، وَفُجَاءَةِ نِقْمَتِكَ، وَجَمِيعِ سَخَطِكَ",
    transliteration: "Allaahumma innii a-uudzu bika min zawaali ni-matika, wa tahawwuli aafiyatika, wa fujaa-ati niqmatika, wa jamii-i sakhotik.",
    translation: {
      en: "O Allah, I seek refuge in You from the removal of Your blessing, the change of Your protection, the sudden onset of Your punishment, and all forms of Your displeasure.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre la disparition de Tes bienfaits, le changement de Ta protection, la survenue soudaine de Ton châtiment et toutes les formes de Ton mécontentement.",
      de: "O Allah, ich suche Zuflucht bei Dir vor dem Entzug Deiner Gaben, dem Wechsel Deines Schutzes, dem plötzlichen Eintreten Deiner Strafe und allen Formen Deines Missfallens." },
    benefit: {
      en: "The Prophet said this dua regularly. It covers four fears: losing blessings, losing wellbeing, sudden punishment, and any form of Allah's displeasure.",
      fr: "Le Prophète disait ce dua régulièrement. Il couvre quatre craintes : perte des bénédictions, perte du bien-être, punition soudaine et mécontentement d'Allah.",
      de: "Der Prophet sprach dieses Dua regelmäßig. Es deckt vier Ängste ab: Verlust der Segnungen, Verlust des Wohlbefindens, plötzliche Strafe und Allahs Missfallen." },
    source: ["Sahih Muslim"] },

  { id: 269, catId: "evil", type: "dua", order: 4,
    title: { en: "Refuge from severe trials, misery and bad destiny", fr: "Refuge contre les épreuves sévères et le mauvais destin", de: "Zuflucht vor schweren Prüfungen und schlechtem Schicksal" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوْذُ بِكَ مِنْ جَهْدِ الْبَلاَءِ، وَدَرَكِ الشَّقَاءِ، وَسُوءِ الْقَضَاءِ، وَشَمَاتَةِ الأَعْدَاءِ",
    transliteration: "Allaahumma innii a-uudzu bika min jahdil balaa-i, wa darakisy-syaqoo-i, wa suu-il qodhoo-i, wa syamaatatil a-daa-i.",
    translation: {
      en: "O Allah, I seek refuge in You from severe affliction, from wretchedness, from a bad destiny, and from the gloating of enemies.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre les épreuves sévères, la misère, le mauvais destin et la joie malveillante des ennemis.",
      de: "O Allah, ich suche Zuflucht bei Dir vor schwerer Prüfung, vor Elend, vor schlechtem Schicksal und vor der Schadenfreude der Feinde." },
    benefit: {
      en: "Four comprehensive protections. The last – protection from enemies gloating over one's misfortune – shows the Prophet's concern for the honor and dignity of believers.",
      fr: "Quatre protections complètes. La dernière – protection contre la joie malveillante des ennemis – montre l'attention du Prophète pour l'honneur des croyants.",
      de: "Vier umfassende Schutzbitten. Die letzte – Schutz vor Schadenfreude der Feinde – zeigt die Sorge des Propheten um Ehre und Würde der Gläubigen." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 270, catId: "evil", type: "info", order: 5,
    title: { en: "Protection from the evil eye – say Masha Allah", fr: "Protection contre le mauvais oeil – dire Masha Allah", de: "Schutz vor dem bösen Blick – Masha Allah sagen" },
    content: {
      en: "When you see something admirable in yourself, others, or your possessions – say Masha Allah (what Allah wills) and ask Allah to bless it. The Prophet said: if you see something you admire in yourself or others, invoke blessings upon it, for the evil eye is real. Saying Masha Allah La Quwwata Illa Billah (Quran 18:39) protects against the evil eye.",
      fr: "Quand tu vois quelque chose d'admirable en toi, en d'autres ou dans tes biens – dis Masha Allah et demande la bénédiction d'Allah. Le Prophète a dit : si tu vois quelque chose que tu admires, invoque des bénédictions dessus, car le mauvais oeil est réel.",
      de: "Wenn du etwas Bewundernswertes an dir, anderen oder deinem Besitz siehst – sage Masha Allah und bitte Allah um Segen. Der Prophet sagte: Wenn du etwas Bewundernswertes siehst, rufe Segnungen darüber an, denn der böse Blick ist real." },
    source: ["Ibn Majah", "Malik", "Authenticated"] },

  { id: 271, catId: "evil", type: "info", order: 6,
    title: { en: "Protection of the household at night – restrain children and say Bismillah", fr: "Protection du foyer la nuit – retenir les enfants et dire Bismillah", de: "Schutz des Hauses bei Nacht – Kinder schützen und Bismillah sagen" },
    content: {
      en: "The Prophet said: When night falls, restrain your children for the devils spread out at that time. After an hour of the night has passed you may let them free. Close your doors and mention the name of Allah, for Shaytan does not open a closed door. Tie the mouths of your water skins and mention the name of Allah. Cover your vessels and mention the name of Allah.",
      fr: "Le Prophète a dit : Quand la nuit tombe, retenez vos enfants car les diables se répandent à ce moment. Après une heure de nuit vous pouvez les laisser aller. Fermez vos portes et mentionnez le nom d'Allah car Shaytan n'ouvre pas une porte fermée. Attachez vos outres et mentionnez le nom d'Allah. Couvrez vos ustensiles et mentionnez le nom d'Allah.",
      de: "Der Prophet sagte: Wenn die Nacht hereinbricht, haltet eure Kinder zurück denn die Teufel verbreiten sich zu dieser Zeit. Nach einer Stunde der Nacht könnt ihr sie freilassen. Schließt eure Türen und nennt den Namen Allahs denn Shaytan öffnet keine geschlossene Tür. Bindet eure Wasserschläuche und nennt den Namen Allahs. Bedeckt eure Gefäße und nennt den Namen Allahs." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 272, catId: "evil", type: "dua", order: 7,
    title: { en: "Refuge from poverty, humiliation and being overpowered", fr: "Refuge contre la pauvreté, l'humiliation et être dominé", de: "Zuflucht vor Armut, Erniedrigung und Überwältigung" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْفَقْرِ، وَالْقِلَّةِ، وَالذِّلَّةِ، وَأَعُوذُ بِكَ مِنْ أَنْ أَظْلِمَ أَوْ أُظْلَمَ",
    transliteration: "Allaahumma innii a-uudzu bika minal faqri, wal qillati, wadz-dzillati, wa a-uudzu bika min an azhlima au uzhlam.",
    translation: {
      en: "O Allah, I seek refuge in You from poverty, scarcity, humiliation, and I seek refuge in You from wronging others or being wronged.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre la pauvreté, le manque, l'humiliation, et je cherche refuge contre le fait d'oppresser ou d'être oppressé.",
      de: "O Allah, ich suche Zuflucht bei Dir vor Armut, Mangel und Erniedrigung, und ich suche Zuflucht davor anderen Unrecht zu tun oder selbst Unrecht zu erleiden." },
    source: ["Abu Dawud", "An-Nasai", "Authenticated"] },

  { id: 273, catId: "evil", type: "dua", order: 8,
    title: { en: "Refuge from laziness, cowardice, miserliness and senility", fr: "Refuge contre la paresse, la lâcheté, l'avarice et la sénilité", de: "Zuflucht vor Faulheit, Feigheit, Geiz und Altersschwäche" },
    arabic: "اَللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنَ الْكَسَلِ، وَالْهَرَمِ، وَالْمَأْثَمِ، وَالْمَغْرَمِ، وَمِنْ فِتْنَةِ الْقَبْرِ، وَعَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ النَّارِ وَعَذَابِ النَّارِ، وَمِنْ شَرِّ فِتْنَةِ الْغِنَى، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الْفَقْرِ",
    transliteration: "Allaahumma innii a-uudzu bika minal kasali, wal haromi, wal ma-tsami, wal maghrom, wa min fitnatil qobri, wa adzaabil qobri, wa min fitnatinnaari wa adzaabin-naar, wa min syarri fitnatil ghina, wa a-uudzu bika min fitnatil faqr.",
    translation: {
      en: "O Allah, I seek refuge in You from laziness, senility, sin, debt, the trial of the grave, the punishment of the grave, the trial of the Fire, the punishment of the Fire, the evil trial of wealth, and I seek refuge in You from the trial of poverty.",
      fr: "Ô Allah, je cherche refuge contre la paresse, la sénilité, le péché, les dettes, l'épreuve de la tombe, le châtiment de la tombe, l'épreuve du Feu, le châtiment du Feu, la mauvaise épreuve de la richesse, et contre l'épreuve de la pauvreté.",
      de: "O Allah, ich suche Zuflucht vor Faulheit, Altersschwäche, Sünde, Schulden, der Prüfung des Grabes, der Strafe des Grabes, der Prüfung des Feuers, der Strafe des Feuers, der üblen Prüfung des Reichtums, und ich suche Zuflucht vor der Prüfung der Armut." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 274, catId: "evil", type: "dua", order: 9,
    title: { en: "Refuge from weakness, laziness, cowardice and debt", fr: "Refuge contre la faiblesse, la paresse, la lâcheté et les dettes", de: "Zuflucht vor Schwäche, Faulheit, Feigheit und Schulden" },
    arabic: "اَللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَالْجُبْنِ وَالْبُخْلِ وَالْهَرَمِ، وَعَذَابِ الْقَبْرِ",
    transliteration: "Allaahumma innii a-uudzu bika minal ajzi wal kasali, wal jubni wal bukhli wal haromi, wa adzaabil qobr.",
    translation: {
      en: "O Allah, I seek refuge in You from weakness, laziness, cowardice, miserliness, senility, and the punishment of the grave.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre la faiblesse, la paresse, la lâcheté, l'avarice, la sénilité et le châtiment de la tombe.",
      de: "O Allah, ich suche Zuflucht bei Dir vor Schwäche, Faulheit, Feigheit, Geiz, Altersschwäche und der Strafe des Grabes." },
    benefit: {
      en: "A shorter version of entry 8. Six spiritual diseases in one dua. The Prophet said these are characteristics that prevent a believer from being productive and honorable.",
      fr: "Une version plus courte de l'entrée 8. Six maladies spirituelles en un dua.",
      de: "Eine kürzere Version von Eintrag 8. Sechs spirituelle Krankheiten in einem Dua." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 275, catId: "evil", type: "dua", order: 10,
    title: { en: "Refuge from the trial of the Antichrist and grave", fr: "Refuge contre l'épreuve de l'Antéchrist et de la tombe", de: "Zuflucht vor der Prüfung des Dajjal und des Grabes" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، وَأَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ، وَعَذَابٍ فِي الْقَبْرِ",
    transliteration: "Allaahumma innii a-uudzu bika minal kasali wa suu-il kibari, wa a-uudzu bika min adzaabin fin-naar, wa adzaabin fil qobr.",
    translation: {
      en: "O Allah, I seek refuge in You from laziness and the evil of old age, and I seek refuge in You from punishment in the Fire and punishment in the grave.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre la paresse et les maux de la vieillesse, et je cherche refuge contre le châtiment du Feu et le châtiment de la tombe.",
      de: "O Allah, ich suche Zuflucht bei Dir vor Faulheit und dem Bösen des Alterns, und ich suche Zuflucht vor Strafe im Feuer und Strafe im Grab." },
    source: ["Sahih Bukhari"] },

  { id: 276, catId: "evil", type: "dua", order: 11,
    title: { en: "Refuge from cowardice, worst age, world trials and grave punishment", fr: "Refuge contre la lâcheté, l'âge misérable, les épreuves du monde et du tombeau", de: "Zuflucht vor Feigheit, elendim Alter, Weltprüfungen und Grabstrafe" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوْذُ بِكَ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوْذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا، وَأَعُوْذُ بِكَ مِنْ عَذَابِ الْقَبْرِ",
    transliteration: "Allaahumma innii a-uudzu bika minal jubni, wa a-uudzu bika an urdda ilaa ardzalil umuri, wa a-uudzu bika min fitnatid-dunyaa, wa a-uudzu bika min adzaabil qobr.",
    translation: {
      en: "O Allah, I seek refuge in You from cowardice, from being returned to the worst age, from the trials of this world, and from the punishment of the grave.",
      fr: "Ô Allah, je cherche refuge contre la lâcheté, le retour à un âge misérable, les épreuves de ce monde et le châtiment de la tombe.",
      de: "O Allah, ich suche Zuflucht bei Dir vor Feigheit, vor einem elenden Alter, vor den Prüfungen dieser Welt und vor der Strafe im Grab." },
    source: ["Sahih Bukhari"] },

  { id: 277, catId: "evil", type: "dua", order: 12,
    title: { en: "Refuge from evil of what I have done and not done", fr: "Refuge contre le mal de ce que j'ai fait et n'ai pas fait", de: "Zuflucht vor dem Bösen was ich getan und nicht getan habe" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنْ شَرِّ مَا عَمِلْتُ، وَشَرِّ مَا لَمْ أَعْمَلْ",
    transliteration: "Allaahumma innii a-uudzu bika min syarri maa amiltu, wa syarri maa lam a-mal.",
    translation: {
      en: "O Allah, I seek refuge in You from the evil of what I have done and from the evil of what I have not done.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre le mal de ce que j'ai fait et contre le mal de ce que je n'ai pas fait.",
      de: "O Allah, ich suche Zuflucht bei Dir vor dem Bösen von dem was ich getan habe und vor dem Bösen von dem was ich nicht getan habe." },
    benefit: {
      en: "A profound dua covering two dimensions of sin: sins of commission (what we did wrong) and sins of omission (good we failed to do). Both can harm the soul.",
      fr: "Un dua profond couvrant deux dimensions du péché : les péchés de commission et les péchés d'omission. Les deux peuvent nuire à l'âme.",
      de: "Ein tiefgründiges Dua das zwei Dimensionen der Sünde abdeckt: Sünden des Tuns und Sünden der Unterlassung. Beide können der Seele schaden." },
    source: ["Sahih Muslim"] },

  { id: 278, catId: "evil", type: "dua", order: 13,
    title: { en: "Do not make our calamity in our religion or make this world our greatest concern", fr: "Ne fais pas de notre religion notre épreuve ni du monde notre plus grande préoccupation", de: "Mache unsere Prüfung nicht in unserer Religion und die Welt nicht zu unserer größten Sorge" },
    arabic: "اَللَّهُمَّ لَا تَجْعَلْ مُصِيْبَتَنَا فِي دِيْنِنَا، وَلَا تَجْعَلِ الدُّنْيَا أَكْبَرَ هَمِّنَا، وَلَا مَبْلَغَ عِلْمِنَا",
    transliteration: "Allaahumma laa taj-al mushiibatanaa fii diininaa, wa laa taj-alid-dunyaa akbara hamminaa, wa laa mablagha ilminaa.",
    translation: {
      en: "O Allah, do not make our trial in our religion, do not make this world our greatest concern, and do not make it the extent of our knowledge.",
      fr: "Ô Allah, ne fais pas de notre religion notre épreuve, ne fais pas de ce monde notre plus grande préoccupation et ne le fais pas l'étendue de notre savoir.",
      de: "O Allah, mache unsere Prüfung nicht in unserer Religion, mache diese Welt nicht zu unserer größten Sorge und mache sie nicht zum Ausmaß unseres Wissens." },
    benefit: {
      en: "The greatest calamity is to lose one's religion. This dua asks that our trials never be in our deen, and that we never become so attached to this world that it becomes our main focus.",
      fr: "La plus grande calamité est de perdre sa religion. Ce dua demande que nos épreuves ne touchent jamais notre religion et que nous ne soyons jamais trop attachés à ce monde.",
      de: "Die größte Prüfung ist den Glauben zu verlieren. Dieses Dua bittet dass unsere Prüfungen nie in unserer Religion liegen und wir nie so sehr an dieser Welt hängen." },
    source: ["At-Tirmidhi", "Authenticated"] },

  { id: 279, catId: "evil", type: "dua", order: 14,
    title: { en: "Refuge from the evil of hearing, sight, tongue, heart and desires", fr: "Refuge contre le mal de l'ouïe, de la vue, de la langue, du cœur et des désirs", de: "Zuflucht vor dem Bösen von Gehör, Sehen, Zunge, Herz und Begierden" },
    arabic: "اَللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنْ شَرِّ سَمْعِى، وَمِنْ شَرِّ بَصَرِى، وَمِنْ شَرِّ لِسَانِى، وَمِنْ شَرِّ قَلْبِى، وَمِنْ شَرِّ مَنِيِّى",
    transliteration: "Allaahumma innii a-uudzu bika min syarri sam-ii, wa min syarri bashorii, wa min syarri lisaanii, wa min syarri qolbii, wa min syarri maniyyii.",
    translation: {
      en: "O Allah, I seek refuge in You from the evil of my hearing, from the evil of my sight, from the evil of my tongue, from the evil of my heart, and from the evil of my desires.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre le mal de mon ouïe, de ma vue, de ma langue, de mon cœur et de mes désirs.",
      de: "O Allah, ich suche Zuflucht bei Dir vor dem Bösen meines Gehörs, meines Sehens, meiner Zunge, meines Herzens und meiner Begierden." },
    benefit: {
      en: "Five gateways to sin: ears that hear haraam, eyes that see haraam, a tongue that speaks haraam, a heart that harbors evil, and desires that lead to haraam. This dua asks for protection from all five.",
      fr: "Cinq portes du péché : des oreilles qui entendent le haraam, des yeux qui voient le haraam, une langue qui parle le haraam, un cœur qui nourrit le mal et des désirs qui mènent au haraam.",
      de: "Fünf Tore zur Sünde: Ohren die Haraam hören, Augen die Haraam sehen, eine Zunge die Haraam spricht, ein Herz das Böses hegt und Begierden die zu Haraam führen." },
    source: ["Abu Dawud", "At-Tirmidhi", "Authenticated"] },

  { id: 280, catId: "evil", type: "dua", order: 15,
    title: { en: "Refuge from four things – stinginess, cowardice, dotage and worldliness", fr: "Refuge contre quatre choses – avarice, lâcheté, sénilité et mondanité", de: "Zuflucht vor vier Dingen – Geiz, Feigheit, Gebrechlichkeit und Weltlichkeit" },
    arabic: "أَعُوذُ بِاللَّهِ مِنَ الشُّحِّ، وَأَعُوذُ بِاللَّهِ مِنَ الْجُبْنِ، وَأَعُوذُ بِاللَّهِ مِنْ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِاللَّهِ مِنْ فِتْنَةِ الدُّنْيَا",
    transliteration: "A-uudzu billaahi minasy-syuhhi, wa a-uudzu billaahi minal jubni, wa a-uudzu billaahi min an urdda ilaa ardzalil umuri, wa a-uudzu billaahi min fitnatid-dunyaa.",
    translation: {
      en: "I seek refuge in Allah from stinginess, I seek refuge in Allah from cowardice, I seek refuge in Allah from being returned to the worst age, and I seek refuge in Allah from the trial of this world.",
      fr: "Je cherche refuge auprès d'Allah contre l'avarice, je cherche refuge auprès d'Allah contre la lâcheté, je cherche refuge contre un retour au pire âge, et contre l'épreuve de ce monde.",
      de: "Ich suche Zuflucht bei Allah vor Geiz, ich suche Zuflucht vor Feigheit, ich suche Zuflucht davor in das elendste Alter zurückzukehren, und ich suche Zuflucht vor der Prüfung dieser Welt." },
    source: ["Abu Dawud", "Authenticated"] },

  { id: 281, catId: "evil", type: "dua", order: 16,
    title: { en: "Refuge from anxiety, sorrow, weakness, laziness, debt and oppression", fr: "Refuge contre l'anxiété, la tristesse, la faiblesse, la paresse, les dettes et l'oppression", de: "Zuflucht vor Angst, Trauer, Schwäche, Faulheit, Schulden und Unterdrückung" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ",
    transliteration: "Allaahumma innii a-uudzu bika minal hammi wal hazani, wal ajzi wal kasali, wal bukhli wal jubni, wa dhola-id-daini wa gholabatir-rijaal.",
    translation: {
      en: "O Allah, I seek refuge in You from anxiety and sorrow, from weakness and laziness, from miserliness and cowardice, from the burden of debt and from being overpowered by people.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre l'anxiété et la tristesse, la faiblesse et la paresse, l'avarice et la lâcheté, le fardeau des dettes et d'être dominé par les gens.",
      de: "O Allah, ich suche Zuflucht bei Dir vor Angst und Trauer, vor Schwäche und Faulheit, vor Geiz und Feigheit, vor der Last der Schulden und davor von Menschen überwältigt zu werden." },
    benefit: {
      en: "One of the most comprehensive duas the Prophet taught. Eight spiritual diseases in four pairs. The Prophet recommended saying it morning and evening.",
      fr: "L'un des duas les plus complets que le Prophète enseigna. Huit maladies spirituelles en quatre paires. Recommandé matin et soir.",
      de: "Eines der umfassendsten Duas die der Prophet lehrte. Acht spirituelle Krankheiten in vier Paaren. Empfohlen morgens und abends." },
    source: ["Sahih Bukhari"] },

  { id: 282, catId: "evil", type: "dua", order: 17,
    title: { en: "Refuge from four harmful things – ignorance, immorality, bad character", fr: "Refuge contre quatre choses nuisibles – ignorance, immoralité, mauvais caractère", de: "Zuflucht vor vier schädlichen Dingen – Unwissenheit, Unmoral, schlechter Charakter" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الأَرْبَعِ: مِنَ الْعِلْمِ الَّذِي لَا يَنْفَعُ، وَمِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ دُعَاءٍ لَا يُسْمَعُ",
    transliteration: "Allaahumma innii a-uudzu bika minal arba-i: minal ilmil-ladzii laa yanfa, wa min qolbin laa yakhsya, wa min nafsin laa tasyba, wa min du-aa-in laa yusma.",
    translation: {
      en: "O Allah, I seek refuge in You from four things: knowledge that does not benefit, a heart that does not humble itself, a soul that is never satisfied, and a supplication that is not heard.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre quatre choses : un savoir inutile, un cœur qui ne s'humilie pas, une âme jamais satisfaite et une invocation qui n'est pas entendue.",
      de: "O Allah, ich suche Zuflucht bei Dir vor vier Dingen: Wissen das keinen Nutzen bringt, einem Herzen das sich nicht demütigt, einer Seele die nie zufrieden ist, und einem Bittgebet das nicht gehört wird." },
    source: ["Sahih Muslim"] },

  { id: 283, catId: "evil", type: "dua", order: 18,
    title: { en: "Refuge from Fire trials and harm of wealth and poverty", fr: "Refuge contre les épreuves du Feu et les méfaits de la richesse et de la pauvreté", de: "Zuflucht vor Feuerprüfungen und dem Schaden von Reichtum und Armut" },
    arabic: "اَللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنْ فِتْنَةِ النَّارِ وَعَذَابِ النَّارِ، وَمِنْ شَرِّ الْغِنَى وَالْفَقْرِ",
    transliteration: "Allaahumma innii a-uudzu bika min fitnatinnaari wa adzaabinnaari, wa min syarril ghina wal faqr.",
    translation: {
      en: "O Allah, I seek refuge in You from the trial of the Fire and its punishment, and from the harm of wealth and the harm of poverty.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre l'épreuve du Feu et son châtiment, et contre le mal de la richesse et de la pauvreté.",
      de: "O Allah, ich suche Zuflucht bei Dir vor der Prüfung des Feuers und seiner Strafe, und vor dem Schaden des Reichtums und der Armut." },
    benefit: {
      en: "Both extremes of wealth are dangerous: too much wealth leads to arrogance and heedlessness, too little leads to desperation and crime. This dua asks for protection from both.",
      fr: "Les deux extrêmes de la richesse sont dangereux : trop de richesse mène à l'arrogance, trop peu mène au désespoir. Ce dua demande protection contre les deux.",
      de: "Beide Extreme des Reichtums sind gefährlich: zu viel führt zu Hochmut, zu wenig zu Verzweiflung. Dieses Dua bittet um Schutz vor beiden." },
    source: ["Abu Dawud", "Authenticated"] },

  { id: 284, catId: "evil", type: "dua", order: 19,
    title: { en: "O Allah, suffice me against them however You will", fr: "Ô Allah, protège-moi d'eux comme Tu le veux", de: "O Allah, schütze mich vor ihnen wie Du willst" },
    arabic: "اَللَّهُمَّ اكْفِنِيْهِمْ بِمَا شِئْتَ",
    transliteration: "Allaahummak-finiihim bimaa syi-ta.",
    translation: {
      en: "O Allah, suffice me against them however You will.",
      fr: "Ô Allah, protège-moi d'eux comme Tu le veux.",
      de: "O Allah, schütze mich vor ihnen wie Du willst." },
    benefit: {
      en: "Said when facing those who harm or oppress. It delegates the matter entirely to Allah without specifying how He should deal with the oppressors – a profound act of tawakkul.",
      fr: "Dit face à ceux qui nuisent ou oppriment. Il confie entièrement l'affaire à Allah sans préciser comment Il doit agir – un acte profond de tawakkul.",
      de: "Gesagt wenn man denen begegnet die schaden oder unterdrücken. Es übergibt die Angelegenheit vollständig Allah ohne zu spezifizieren wie Er handeln soll – ein tiefgründiger Akt des Tawakkul." },
    source: ["Sahih Muslim"] },

  { id: 285, catId: "evil", type: "dua", order: 20,
    title: { en: "Refuge in Allah's perfect words from devils and evil eye", fr: "Refuge dans les paroles parfaites d'Allah contre les démons et le mauvais œil", de: "Zuflucht in Allahs vollkommenen Worten vor Teufeln und bösem Blick" },
    arabic: "أَعُوْذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ",
    transliteration: "A-uudzu bikalimaatillaahit-taammah, min kulli syaithoonin wa haammah, wa min kulli ainin laammah.",
    translation: {
      en: "I seek refuge in the perfect words of Allah from every devil, every harmful creature, and every evil eye.",
      fr: "Je cherche refuge dans les paroles parfaites d'Allah contre tout démon, toute créature nuisible et le mauvais œil.",
      de: "Ich suche Zuflucht in den vollkommenen Worten Allahs vor jedem Teufel, jedem schädlichen Wesen und jedem bösen Blick." },
    benefit: {
      en: "The Prophet would say this for Al-Hasan and Al-Husain. He said: Your father Ibrahim used to seek protection for Ismail and Isaac with these words. Say it for children and for yourself at night.",
      fr: "Le Prophète disait cela pour Al-Hasan et Al-Husain. Il dit : Votre père Ibrahim cherchait protection pour Ismail et Isaac avec ces paroles. Le dire pour les enfants et pour soi la nuit.",
      de: "Der Prophet sprach dies für Al-Hasan und Al-Husain. Er sagte: Euer Vater Ibrahim suchte mit diesen Worten Schutz für Ismail und Isaak. Für Kinder und sich selbst nachts sagen." },
    source: ["Sahih Bukhari"] },

  { id: 286, catId: "evil", type: "dua", order: 21,
    title: { en: "Refuge from bad neighbour, harmful spouse, disobedient child and treacherous friend", fr: "Refuge contre mauvais voisin, conjoint nuisible, enfant rebelle et ami traitre", de: "Zuflucht vor schlechtem Nachbarn, schädigender Ehefrau, widerspenstigem Kind und hinterhältigem Freund" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنْ جَارِ السُّوْءِ، وَمِنْ زَوْجٍ تُشَيِّبُنِيْ قَبْلَ المَشِيْبِ، وَمِنْ وَلَدٍ يَكُوْنُ عَلَيَّ رَبًّا، وَمِنْ مَالٍ يَكُوْنُ عَلَيَّ عَذَابًا، وَمِنْ خَلِيْلٍ مَاكِرٍ عَيْنُهُ تَرَانِيْ وَقَلْبُهُ يَرْعَانِيْ، إِنْ رَأَى حَسَنَةً دَفَنَهَا وَإِذَا رَأَى سَيِّئَةً أَذَاعَهَا",
    transliteration: "Allaahumma innii a-uudzu bika min jaaris-suu, wa min zaujin tusyayyibunii qoblal masyiib, wa min waladin yakuunu alayya robban, wa min maalin yakuunu alayya adzaaban, wa min kholiilin maakirin, ainuhu taaronii, wa qolbuhu yar-aanil, in ro-aa hasanatan dafanahaa, wa idzaa ro-aa sayyiatan adzaa-ahaa.",
    translation: {
      en: "O Allah, I seek refuge in You from a bad neighbour, from a spouse who makes me age before my time, from a child who becomes a master over me, from wealth that becomes a punishment for me, and from a treacherous friend whose eye watches me and whose heart monitors me – if he sees good he buries it, and if he sees bad he spreads it.",
