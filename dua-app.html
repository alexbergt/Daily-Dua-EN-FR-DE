    title: { en: "The encouragement to make Istighfar at the time of Suhoor", fr: "L'encouragement à faire l'Istighfar à l'heure du Suhoor", de: "Die Ermutigung zur Zeit des Suhoor Istighfar zu sprechen" },
    content: {
      en: "Allah describes the people of Paradise: They were patient, truthful, devout, charitable and they sought forgiveness at the time of Suhoor (dawn). (Quran 3:17). Every night in the last third, Allah descends to the lowest heaven and says: Who calls upon Me that I may answer? Who asks of Me that I may give? Who seeks My forgiveness that I may forgive? Do not waste this time. Use the moments after Suhoor for abundant Istighfar.",
      fr: "Allah décrit les gens du Paradis : Ils étaient patients, véridiques, dévoués, charitables et ils cherchaient le pardon à l'heure du Suhoor. (Coran 3:17). Chaque nuit dans le dernier tiers, Allah descend au ciel le plus bas et dit : Qui M'appelle pour que je réponde? Qui Me demande pour que je donne? Qui cherche Mon pardon pour que je pardonne? Ne gaspillez pas ce temps.",
      de: "Allah beschreibt die Menschen des Paradieses: Sie waren geduldig ehrlich fromm wohltätig und sie suchten Vergebung zur Zeit des Suhoor. (Quran 3:17). Jede Nacht im letzten Drittel steigt Allah zum untersten Himmel hinab und sagt: Wer ruft Mich damit ich antworte? Wer bittet Mich damit ich gebe? Wer sucht Meine Vergebung damit ich vergebe? Verschwendet diese Zeit nicht." },
    source: ["Quran 3:17", "Sahih Bukhari", "Sahih Muslim"] },

  { id: 339, catId: "istighfar", type: "dua", order: 4,
    title: { en: "Istighfar / Tawbah 1 – the one who fled from battle is forgiven", fr: "Istighfar / Tawbah 1 – même celui qui a fui la bataille est pardonné", de: "Istighfar / Tawbah 1 – sogar wer aus der Schlacht floh wird vergeben" },
    arabic: "أَسْتَغْفِرُ اللَّهَ الْعَظِيْمَ الَّذِيْ لاَ إِلَـٰهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّوْمُ وَأَتُوْبُ إِلَيْهِ",
    transliteration: "Astaghfirullaahal azhiimal-ladzii laa ilaaha illaa huwal hayyul qoyyuum, wa atuubu ilaih.",
    translation: {
      en: "I seek forgiveness from Allah the Magnificent, there is no deity worthy of worship except Him, the Ever-Living, the Sustainer of existence, and I repent to Him.",
      fr: "Je demande pardon à Allah le Magnifique, il n'y a pas de divinité digne d'adoration sauf Lui, le Vivant, le Subsistant, et je me repens à Lui.",
      de: "Ich suche Vergebung bei Allah dem Erhabenen es gibt keine Gottheit die der Anbetung würdig ist außer Ihm dem Ewig Lebenden dem Beständigen und ich bereue zu Ihm." },
    benefit: {
      en: "The Prophet said: Whoever says this, Allah will forgive him even if he fled from the battlefield. One of the most powerful formulas of Istighfar – it includes Allah's greatest Name Al-Hayy Al-Qayyum.",
      fr: "Le Prophète a dit : Quiconque dit cela, Allah lui pardonnera même s'il a fui le champ de bataille. L'une des formules d'Istighfar les plus puissantes – elle inclut le plus grand Nom d'Allah Al-Hayy Al-Qayyum.",
      de: "Der Prophet sagte: Wer dies sagt wird Allah vergeben auch wenn er vom Schlachtfeld geflohen ist. Eine der kraftvollsten Istighfar-Formeln – sie enthält Allahs größten Namen Al-Hayy Al-Qayyum." },
    source: ["Abu Dawud", "At-Tirmidhi", "Al-Hakim", "Sahih"] },

  { id: 340, catId: "istighfar", type: "dua", order: 5,
    title: { en: "Istighfar / Tawbah 2 – I have wronged myself greatly", fr: "Istighfar / Tawbah 2 – J'ai commis beaucoup d'injustice envers moi-même", de: "Istighfar / Tawbah 2 – Ich habe mir selbst großes Unrecht getan" },
    arabic: "اَللَّهُمَّ إِنِّيْ ظَلَمْتُ نَفْسِيْ ظُلْمًا كَثِيْرًا، وَلاَ يَغْفِرُ الذُّنُوْبَ إِلاَّ أَنْتَ، فَاغْفِرْ لِيْ مَغْفِرَةً مِنْ عِنْدِكَ، وَارْحَمْنِيْ، إِنَّكَ أَنْتَ الْغَفُوْرُ الرَّحِيْمُ",
    transliteration: "Allaahumma innii zholamtu nafsii zhulman katsiiron, wa laa yaghfirudz-dzunuuba illaa anta, faghfir lii maghfirotan min indika, warhamnii, innaka antal ghofuurur-rohiim.",
    translation: {
      en: "O Allah, I have greatly wronged myself and no one forgives sins but You. So grant me forgiveness from Yourself and have mercy on me. Indeed You are the Forgiving, the Merciful.",
      fr: "Ô Allah, je me suis grandement injustié et personne ne pardonne les péchés sauf Toi. Accorde-moi donc le pardon de Ta part et fais-moi miséricorde. Tu es certes le Pardonneur, le Miséricordieux.",
      de: "O Allah ich habe mir selbst großes Unrecht getan und niemand vergibt Sünden außer Dir. So gewähre mir Vergebung von Dir und erbarme Dich meiner. Wahrlich Du bist der Vergebende der Barmherzige." },
    benefit: {
      en: "The dua Abu Bakr As-Siddiq asked the Prophet to teach him to say in his prayer. The Prophet taught him this. It is from the duas in the Tashahhud position and one of the most heartfelt expressions of seeking forgiveness.",
      fr: "Le dua qu'Abu Bakr As-Siddiq a demandé au Prophète de lui apprendre à dire dans sa prière. C'est l'une des invocations les plus sincères pour chercher le pardon.",
      de: "Das Dua das Abu Bakr As-Siddiq den Propheten bat ihm für sein Gebet zu lehren. Es ist eine der aufrichtigsten Ausdrucksformen der Vergebungsbitte." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 341, catId: "istighfar", type: "dua", order: 6,
    title: { en: "Istighfar / Tawbah 3 – O Lord forgive me and accept my repentance", fr: "Istighfar / Tawbah 3 – Seigneur pardonne-moi et accepte mon repentir", de: "Istighfar / Tawbah 3 – Herr vergib mir und nimm meine Reue an" },
    arabic: "رَبِّ اغْفِرْ لِيْ وَتُبْ عَلَىَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيْمُ",
    transliteration: "Robbighfir lii wa tub alayya, innaka antat-tawwaabur-rohiim.",
    translation: {
      en: "My Lord, forgive me and accept my repentance. Indeed You are the Accepter of repentance, the Most Merciful.",
      fr: "Mon Seigneur, pardonne-moi et accepte mon repentir. Tu es certes Celui qui accepte le repentir, le Très Miséricordieux.",
      de: "Mein Herr vergib mir und nimm meine Reue an. Wahrlich Du bist der Reue-Annehmende der Barmherzige." },
    benefit: {
      en: "The Prophet used to say this 100 times in a single sitting. Simple, powerful and complete. It combines forgiveness (maghfira) with repentance (tawba) – both are needed: forgiveness for past sins, and acceptance of the turning back to Allah.",
      fr: "Le Prophète disait cela 100 fois en une seule séance. Simple, puissant et complet. Il combine pardon et repentir – les deux sont nécessaires.",
      de: "Der Prophet sagte dies 100-mal in einer einzigen Sitzung. Einfach kraftvoll und vollständig. Es verbindet Vergebung und Reue – beides ist notwendig." },
    source: ["Ahmad", "At-Tirmidhi", "Abu Dawud", "Sahih"] },

  // ── CATEGORY: VIRTUES OF DHIKR ──
  { id: 342, catId: "dhikr_virtue", type: "info", order: 1,
    title: { en: "Virtues of Dhikr – the remembrance of Allah", fr: "Vertus du Dhikr – le souvenir d'Allah", de: "Tugenden des Dhikr – das Gedenken Allahs" },
    content: {
      en: "The Prophet said: The example of one who remembers Allah compared to one who does not is like the living compared to the dead. Shall I tell you the best of your deeds, most pleasing to your King, highest in your ranks, better than spending gold and silver, and better than meeting your enemy? The companions said: Yes! He said: The remembrance of Allah the Exalted. Allah says: Remember Me and I will remember you. Whoever sits in a gathering without remembering Allah will have regret on the Day of Judgment. Keep your tongue moist with the remembrance of Allah. No deed saves a person from the punishment of Allah more than the remembrance of Allah.",
      fr: "Le Prophète a dit : L'exemple de celui qui se souvient d'Allah par rapport à celui qui ne le fait pas est comme le vivant par rapport au mort. Dois-je vous indiquer la meilleure de vos actions? Le dhikr d'Allah l'Exalté. Allah dit : Souvenez-vous de Moi et Je me souviendrai de vous. Quiconque s'assoit dans un rassemblement sans se souvenir d'Allah aura des regrets le Jour du Jugement. Gardez votre langue humide par le souvenir d'Allah.",
      de: "Der Prophet sagte: Das Gleichnis desjenigen der Allah gedenkt im Vergleich zu dem der es nicht tut ist wie der Lebende im Vergleich zum Toten. Soll ich euch die beste eurer Taten nennen? Das Gedenken Allahs des Erhabenen. Allah sagt: Gedenkt Meiner und Ich werde eurer gedenken. Wer in einer Versammlung sitzt ohne Allah zu gedenken wird am Jüngsten Tag Reue empfinden. Haltet eure Zunge feucht mit dem Gedenken Allahs." },
    source: ["Sahih Bukhari", "Sahih Muslim", "At-Tirmidhi", "Abu Dawud", "Quran 2:152", "Quran 33:35"] },

  { id: 343, catId: "dhikr_virtue", type: "info", order: 2,
    title: { en: "The criteria of one who makes much Dhikr", fr: "Les critères de celui qui fait beaucoup de Dhikr", de: "Die Kriterien desjenigen der viel Dhikr macht" },
    content: {
      en: "Allah says: Men and women who remember Allah much – Allah has prepared for them forgiveness and a great reward. (Quran 33:35). Ibn Abbas explained: those who remember Allah after every prayer, every morning and evening, when lying down and rising, when leaving the house. Mujahid said: A person is not considered one who makes much dhikr until he remembers Allah standing, sitting and lying down. Ibn Salah said: When a person habitually performs the authentic dhikrs every morning and evening and at various times day and night from a book of daily supplications – then he deserves to be called one who makes much dhikr.",
      fr: "Allah dit : Les hommes et les femmes qui invoquent beaucoup Allah – Allah leur a préparé un pardon et une grande récompense. (Coran 33:35). Ibn Abbas expliqua : ceux qui se souviennent d'Allah après chaque prière, chaque matin et soir, en se couchant et en se levant, en quittant la maison. Mujahid dit : Une personne n'est pas considérée comme faisant beaucoup de dhikr jusqu'à ce qu'elle se souvienne d'Allah debout, assis et couché.",
      de: "Allah sagt: Männer und Frauen die Allah viel gedenken – Allah hat für sie Vergebung und eine große Belohnung bereitet. (Quran 33:35). Ibn Abbas erklärte: jene die Allah nach jedem Gebet jeden Morgen und Abend beim Hinlegen und Aufstehen beim Verlassen des Hauses gedenken. Mujahid sagte: Eine Person gilt erst als jemand der viel Dhikr macht wenn sie Allah stehend sitzend und liegend gedenkt." },
    source: ["Quran 33:35", "Al-Adhkar An-Nawawi"] },

  { id: 344, catId: "dhikr_virtue", type: "info", order: 3,
    title: { en: "Examples of the companions who made much Dhikr", fr: "Exemples des compagnons qui faisaient beaucoup de Dhikr", de: "Beispiele der Gefährten die viel Dhikr machten" },
    content: {
      en: "Abu Darda said he counted 100,000 tasbih per day. Abu Hurairah made 12,000 tasbih daily and said: This is my ransom to free myself from Hell. Khalid ibn Madan, a Tabi'i scholar, made 14,000 tasbih daily in addition to his Quran recitation. Abu Bakr an-Nablisi continued making dhikr even while being tortured – his skin was cut from head to chest and he kept remembering Allah until his heart was pierced. He died a martyr. How much time do we waste in our cars, at work, online – talking for hours about worldly matters but so stingy with dhikr and Quran.",
      fr: "Abu Darda faisait 100 000 tasbih par jour. Abu Hurairah faisait 12 000 tasbih quotidiens et disait : C'est ma rançon pour me libérer de l'Enfer. Khalid ibn Madan faisait 14 000 tasbih par jour en plus de la récitation du Coran. Abu Bakr an-Nablisi continua à faire dhikr même en étant torturé – sa peau fut découpée de la tête jusqu'à la poitrine et il continua à se souvenir d'Allah jusqu'à ce que son coeur soit transpercé.",
      de: "Abu Darda machte täglich 100.000 Tasbih. Abu Hurairah machte täglich 12.000 Tasbih und sagte: Das ist mein Lösegeld um mich aus der Hölle zu befreien. Khalid ibn Madan ein Tabi'i-Gelehrter machte täglich 14.000 Tasbih zusätzlich zu seiner Quran-Rezitation. Abu Bakr an-Nablisi machte weiter Dhikr während er gefoltert wurde – seine Haut wurde vom Kopf bis zur Brust aufgeschnitten und er gedachte weiter Allahs bis sein Herz durchbohrt wurde." },
    source: ["Namadzij min Hayatis Salaf"] },

  { id: 345, catId: "dhikr_virtue", type: "info", order: 4,
    title: { en: "The way the Prophet made Dhikr – counting on fingers", fr: "La façon dont le Prophète faisait le Dhikr – compter sur les doigts", de: "Die Art des Propheten Dhikr zu machen – an den Fingern zählen" },
    content: {
      en: "The Prophet counted his dhikr on his fingers – not with beads or pebbles. Abdullah ibn Amr said: I saw the Messenger of Allah counting his tasbih with his hand. The Prophet also told the women companions: Count with your fingers, for the fingers will be asked and made to speak. The correct method: use the right hand (preferred) though using both hands is permitted. The Prophet loved to start with the right side in all good things. Counting on fingers keeps the heart present with every dhikr and is the established Sunnah.",
      fr: "Le Prophète comptait son dhikr sur ses doigts – pas avec des perles ou des cailloux. Abdullah ibn Amr dit : J'ai vu le Messager d'Allah compter son tasbih avec sa main. Le Prophète dit aussi aux femmes compagnons : Comptez avec vos doigts car les doigts seront interrogés et feront parler. La méthode correcte : utiliser la main droite de préférence bien qu'utiliser les deux mains soit permis.",
      de: "Der Prophet zählte seinen Dhikr an seinen Fingern – nicht mit Perlen oder Kieselsteinen. Abdullah ibn Amr sagte: Ich sah den Gesandten Allahs seinen Tasbih mit seiner Hand zählen. Der Prophet sagte auch den Gefährtinnen: Zählt mit euren Fingern denn die Finger werden befragt und zum Sprechen gebracht werden. Die korrekte Methode: die rechte Hand verwenden obwohl beide Hände erlaubt sind." },
    source: ["Ahmad", "Abu Dawud", "At-Tirmidhi", "Sahih Bukhari"] },

  { id: 346, catId: "dhikr_virtue", type: "info", order: 5,
    title: { en: "The power of morning and evening Dhikr", fr: "La puissance du Dhikr du matin et du soir", de: "Die Kraft des Morgen- und Abend-Dhikr" },
    content: {
      en: "Among the most consistent practices of the Prophet were the morning and evening dhikrs. Allah commanded: O believers, remember Allah abundantly and glorify Him morning and evening. (Quran 33:42-43). Morning time: after Fajr until sunrise. Evening time: after Asr until sunset. Allah also says: Glorify Allah before sunrise and before sunset. (Quran 50:39). If you miss the time, you may still perform the morning dhikrs after sunrise and the evening dhikrs after sunset.",
      fr: "Parmi les pratiques les plus constantes du Prophète figuraient les adhkar du matin et du soir. Allah a ordonné : O croyants, invoquez beaucoup Allah et glorifiez-Le matin et soir. (Coran 33:42-43). Heure du matin : après le Fajr jusqu'au lever du soleil. Heure du soir : après l'Asr jusqu'au coucher du soleil.",
      de: "Zu den beständigsten Praktiken des Propheten gehörten die Morgen- und Abend-Adhkar. Allah befahl: O Gläubige gedenkt Allahs viel und verherrlicht Ihn morgens und abends. (Quran 33:42-43). Morgenzeit: nach dem Fajr bis zum Sonnenaufgang. Abendzeit: nach dem Asr bis zum Sonnenuntergang." },
    source: ["Quran 33:42-43", "Quran 50:39", "Sahih Bukhari", "Sahih Muslim"] },

  // ── CATEGORY: DHIKR PHRASES & VIRTUES ──
  { id: 347, catId: "dhikr_phrases", type: "dua", order: 1,
    title: { en: "Subhanallahi wa bihamdih – 100x erases sins", fr: "Subhanallahi wa bihamdih – 100x efface les péchés", de: "Subhanallahi wa bihamdih – 100x tilgt Sünden" },
    arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",
    transliteration: "Subhaanallaahi wa bihamdih.",
    translation: {
      en: "Glory be to Allah and praise be to Him.",
      fr: "Gloire à Allah et louange à Lui.",
      de: "Gepriesen sei Allah und Lob sei Ihm." },
    benefit: {
      en: "The Prophet said: Whoever says this 100 times a day will have his sins erased even if they were as much as the foam of the sea.",
      fr: "Le Prophète a dit : Quiconque dit cela 100 fois par jour verra ses péchés effacés même s'ils étaient aussi nombreux que l'écume de la mer.",
      de: "Der Prophet sagte: Wer dies 100-mal täglich sagt dem werden seine Sünden getilgt auch wenn sie so zahlreich wären wie der Schaum des Meeres." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 348, catId: "dhikr_phrases", type: "dua", order: 2,
    title: { en: "Subhanallahi wa bihamdih – the Tasbih of the angels", fr: "Subhanallahi wa bihamdih – le Tasbih des anges", de: "Subhanallahi wa bihamdih – der Tasbih der Engel" },
    arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",
    transliteration: "Subhaanallaahi wa bihamdih.",
    translation: {
      en: "Glory be to Allah and praise be to Him.",
      fr: "Gloire à Allah et louange à Lui.",
      de: "Gepriesen sei Allah und Lob sei Ihm." },
    benefit: {
      en: "From Abu Dharr: The Prophet was asked: Which words are most noble? He said: What Allah chose for His angels and His servants – Subhanallahi wa bihamdih. This is how the angels make tasbih as mentioned in Quran 2:30.",
      fr: "D'Abu Dharr : Le Prophète fut interrogé : Quelles paroles sont les plus nobles? Il dit : Ce qu'Allah a choisi pour Ses anges et Ses serviteurs – Subhanallahi wa bihamdih.",
      de: "Von Abu Dharr: Der Prophet wurde gefragt: Welche Worte sind die edelsten? Er sagte: Was Allah für Seine Engel und Seine Diener ausgewählt hat – Subhanallahi wa bihamdih." },
    source: ["Sahih Muslim"] },

  { id: 349, catId: "dhikr_phrases", type: "dua", order: 3,
    title: { en: "Two phrases – light on tongue, heavy on scales", fr: "Deux phrases – légères sur la langue, lourdes dans la balance", de: "Zwei Phrasen – leicht auf der Zunge, schwer auf der Waage" },
    arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيْمِ",
    transliteration: "Subhaanallaahi wa bihamdih, subhaanallaahil azhiim.",
    translation: {
      en: "Glory be to Allah and praise be to Him. Glory be to Allah the Magnificent.",
      fr: "Gloire à Allah et louange à Lui. Gloire à Allah le Magnifique.",
      de: "Gepriesen sei Allah und Lob sei Ihm. Gepriesen sei Allah der Erhabene." },
    benefit: {
      en: "The Prophet said: Two phrases that are light on the tongue, heavy on the scales on the Day of Judgment, and beloved to the Most Merciful. One of the most concise and powerful dhikrs in Islam.",
      fr: "Le Prophète a dit : Deux phrases légères sur la langue, lourdes dans la balance au Jour du Jugement, et chères au Très Miséricordieux.",
      de: "Der Prophet sagte: Zwei Phrasen die leicht auf der Zunge liegen am Jüngsten Tag schwer auf der Waage sind und dem Barmherzigsten geliebt sind." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 350, catId: "dhikr_phrases", type: "dua", order: 4,
    title: { en: "Subhanallahil Adhimi wa bihamdih – a palm tree in Paradise", fr: "Subhanallahil Adhimi wa bihamdih – un palmier au Paradis", de: "Subhanallahil Adhimi wa bihamdih – eine Palme im Paradies" },
    arabic: "سُبْحَانَ اللَّهِ الْعَظِيْمِ وَبِحَمْدِهِ",
    transliteration: "Subhaanallaahil azhiimi wa bihamdih.",
    translation: {
      en: "Glory be to Allah the Magnificent and praise be to Him.",
      fr: "Gloire à Allah le Magnifique et louange à Lui.",
      de: "Gepriesen sei Allah der Erhabene und Lob sei Ihm." },
    benefit: {
      en: "The Prophet said: Whoever says this will have a palm tree planted for him in Paradise.",
      fr: "Le Prophète a dit : Quiconque dit cela se verra planter un palmier au Paradis.",
      de: "Der Prophet sagte: Wer dies sagt dem wird eine Palme im Paradies gepflanzt." },
    source: ["At-Tirmidhi", "Al-Hakim", "Sahih"] },

  { id: 351, catId: "dhikr_phrases", type: "dua", order: 5,
    title: { en: "Subhanallah, Alhamdulillah, La ilaha illallah, Allahu Akbar – dearer than all the world", fr: "Subhanallah, Alhamdulillah, La ilaha illallah, Allahu Akbar – plus précieux que tout le monde", de: "Subhanallah, Alhamdulillah, La ilaha illallah, Allahu Akbar – teurer als die ganze Welt" },
    arabic: "سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلاَ إِلَـٰهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ",
    transliteration: "Subhaanallaah, wal hamdulillaah, wa laa ilaaha illallaah, wallaahu akbar.",
    translation: {
      en: "Glory be to Allah, all praise is for Allah, there is no deity worthy of worship except Allah, Allah is the Greatest.",
      fr: "Gloire à Allah, toute louange est pour Allah, il n'y a pas de divinité digne d'adoration sauf Allah, Allah est le Plus Grand.",
      de: "Gepriesen sei Allah, aller Lob gebührt Allah, es gibt keine Gottheit außer Allah, Allah ist der Größte." },
    benefit: {
      en: "The Prophet said: Saying this is more beloved to me than everything the sun rises over. These four phrases are the foundation of all Islamic remembrance.",
      fr: "Le Prophète a dit : Dire cela m'est plus cher que tout ce sur quoi le soleil se lève.",
      de: "Der Prophet sagte: Dies zu sagen ist mir lieber als alles worüber die Sonne aufgeht." },
    source: ["Sahih Muslim"] },

  { id: 352, catId: "dhikr_phrases", type: "dua", order: 6,
    title: { en: "The four phrases most beloved to Allah", fr: "Les quatre phrases les plus aimées d'Allah", de: "Die vier Allah liebsten Phrasen" },
    arabic: "سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلاَ إِلَـٰهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ",
    transliteration: "Subhaanallaah, wal hamdulillaah, wa laa ilaaha illallaah, wallaahu akbar.",
    translation: {
      en: "Glory be to Allah, all praise is for Allah, there is no deity worthy of worship except Allah, Allah is the Greatest.",
      fr: "Gloire à Allah, toute louange est pour Allah, il n'y a pas de divinité digne d'adoration sauf Allah, Allah est le Plus Grand.",
      de: "Gepriesen sei Allah, aller Lob gebührt Allah, es gibt keine Gottheit außer Allah, Allah ist der Größte." },
    benefit: {
      en: "The Prophet said: The most beloved words to Allah are four – it does not matter which one you begin with. These are the baaqiyatus salihaat – the enduring righteous deeds.",
      fr: "Le Prophète a dit : Les paroles les plus aimées d'Allah sont quatre – peu importe laquelle vous commencez.",
      de: "Der Prophet sagte: Die Allah liebsten Worte sind vier – es spielt keine Rolle mit welchem man beginnt." },
    source: ["Sahih Muslim"] },

  { id: 353, catId: "dhikr_phrases", type: "dua", order: 7,
    title: { en: "The five good phrases including La hawla wa la quwwata", fr: "Les cinq bonnes phrases incluant La hawla wa la quwwata", de: "Die fünf guten Phrasen einschließlich La hawla wa la quwwata" },
    arabic: "سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلاَ إِلَـٰهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ",
    transliteration: "Subhaanallaah, wal hamdulillaah, wa laa ilaaha illallaah, wallaahu akbar, wa laa haula wa laa quwwata illaa billaah.",
    translation: {
      en: "Glory be to Allah, all praise is for Allah, there is no deity worthy of worship except Allah, Allah is the Greatest, there is no power and no strength except through Allah.",
      fr: "Gloire à Allah, toute louange est pour Allah, il n'y a pas de divinité sauf Allah, Allah est le Plus Grand, il n'y a pas de puissance ni de force sauf par Allah.",
      de: "Gepriesen sei Allah, aller Lob gebührt Allah, es gibt keine Gottheit außer Allah, Allah ist der Größte, es gibt keine Macht und Kraft außer durch Allah." },
    benefit: {
      en: "La hawla wa la quwwata illa billah is a treasure from the treasures of Paradise. Adding it to the four great phrases makes this one of the most comprehensive dhikrs. These are the good enduring words.",
      fr: "La hawla wa la quwwata illa billah est un trésor parmi les trésors du Paradis. L'ajouter aux quatre grandes phrases en fait l'un des dhikrs les plus complets.",
      de: "La hawla wa la quwwata illa billah ist ein Schatz unter den Schätzen des Paradieses. Es zu den vier großen Phrasen hinzuzufügen macht dies zu einem der umfassendsten Dhikrs." },
    source: ["Ahmad", "Sahih", "Ibn Hibban"] },

  { id: 354, catId: "dhikr_phrases", type: "dua", order: 8,
    title: { en: "Subhanallah 100x – 1000 good deeds in one sitting", fr: "Subhanallah 100x – 1000 bonnes actions en une séance", de: "Subhanallah 100x – 1000 gute Taten in einer Sitzung" },
    arabic: "سُبْحَانَ اللَّهِ",
    transliteration: "Subhaanallaah (100x).",
    translation: {
      en: "Glory be to Allah. (100 times)",
      fr: "Gloire à Allah. (100 fois)",
      de: "Gepriesen sei Allah. (100 Mal)" },
    benefit: {
      en: "The Prophet said: Is one of you unable to earn 1000 good deeds every day? Someone asked: How can one of us earn 1000 good deeds? He said: Say Subhanallah 100 times – 1000 good deeds will be written for him, or 1000 sins will be erased.",
      fr: "Le Prophète a dit : L'un de vous est-il incapable de gagner 1000 bonnes actions chaque jour? Quelqu'un demanda : Comment l'un d'entre nous peut-il gagner 1000 bonnes actions? Il dit : Dis Subhanallah 100 fois – 1000 bonnes actions seront écrites pour lui ou 1000 péchés effacés.",
      de: "Der Prophet sagte: Ist einer von euch nicht in der Lage täglich 1000 gute Taten zu verdienen? Jemand fragte: Wie kann einer von uns 1000 gute Taten verdienen? Er sagte: Sag Subhanallah 100-mal – 1000 gute Taten werden für ihn aufgeschrieben oder 1000 Sünden getilgt." },
    source: ["Sahih Muslim"] },

  { id: 355, catId: "dhikr_phrases", type: "dua", order: 9,
    title: { en: "La hawla wa la quwwata – a treasure of Paradise", fr: "La hawla wa la quwwata – un trésor du Paradis", de: "La hawla wa la quwwata – ein Schatz des Paradieses" },
    arabic: "لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ",
    transliteration: "Laa haula wa laa quwwata illaa billaah.",
    translation: {
      en: "There is no power and no strength except through Allah.",
      fr: "Il n'y a pas de puissance ni de force sauf par Allah.",
      de: "Es gibt keine Macht und Kraft außer durch Allah." },
    benefit: {
      en: "The Prophet said to Abdullah bin Qays: Shall I show you a treasure from the treasures of Paradise? He said: Yes! The Prophet said: Say La hawla wa la quwwata illa billah. This phrase is said when one is overwhelmed and needs to surrender control to Allah.",
      fr: "Le Prophète dit à Abdullah bin Qays : Dois-je te montrer un trésor parmi les trésors du Paradis? Il dit : Oui! Le Prophète dit : Dis La hawla wa la quwwata illa billah.",
      de: "Der Prophet sagte zu Abdullah bin Qays: Soll ich dir einen Schatz aus den Schätzen des Paradieses zeigen? Er sagte: Ja! Der Prophet sagte: Sprich La hawla wa la quwwata illa billah." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 356, catId: "dhikr_phrases", type: "dua", order: 10,
    title: { en: "La ilaha illallah wahdahu – like freeing four slaves", fr: "La ilaha illallah wahdahu – comme affranchir quatre esclaves", de: "La ilaha illallah wahdahu – wie vier Sklaven befreien" },
    arabic: "لَا إِلَـٰهَ إِلَّا اللَّهُ، وَحْدَهُ لَا شَرِيْكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ",
    transliteration: "Laa ilaaha illallaah, wahdahu laa syariika lah, lahul mulku wa lahul hamdu, wa huwa alaa kulli syai-in qodiir.",
    translation: {
      en: "There is no deity worthy of worship except Allah, alone without partner, to Him belongs the dominion and to Him belongs all praise, and He is over all things capable.",
      fr: "Il n'y a pas de divinité digne d'adoration sauf Allah, seul sans associé, à Lui appartient le règne et à Lui toute louange, et Il est sur toute chose Puissant.",
      de: "Es gibt keine Gottheit außer Allah allein ohne Partner Ihm gehört die Herrschaft und Ihm gehört aller Lob und Er ist über alle Dinge mächtig." },
    benefit: {
      en: "The Prophet said: Whoever says this 10 times is like one who freed four slaves from the descendants of Ismail. Said after every prayer and 100 times a day it has even greater rewards.",
      fr: "Le Prophète a dit : Quiconque dit cela 10 fois est comme celui qui a affranchi quatre esclaves descendants d'Ismail.",
      de: "Der Prophet sagte: Wer dies 10-mal sagt ist wie einer der vier Sklaven aus den Nachkommen Ismaels befreit hat." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 357, catId: "dhikr_phrases", type: "dua", order: 11,
    title: { en: "Comprehensive dhikr and dua for the Bedouin – hands full of goodness", fr: "Dhikr et dua complets pour le Bédouin – mains pleines de bien", de: "Umfassender Dhikr und Dua für den Beduinen – Hände voller Güte" },
    arabic: "لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيْكَ لَهُ، اَللَّهُ أَكْبَرُ كَبِيْرًا، وَالْحَمْدُ لِلَّهِ كَثِيْرًا، سُبْحَانَ اللَّهِ رَبِّ الْعَالَمِيْنَ، لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ الْعَزِيْزِ الْحَكِيْمِ، اَللَّهُمَّ اغْفِرْ لِيْ وَارْحَمْنِيْ وَاهْدِنِيْ وَارْزُقْنِيْ",
    transliteration: "Laa ilaaha illallaah, wahdahu laa syariika lah, allaahu akbar kabiiron, wal hamdulillaahi katsiiron, subhaanallaahi robbil aalamiin, laa haula wa laa quwwata illaa billaahil aziizil hakiim. Allaahummaghfir lii warhamnii wahdinii warzuqnii.",
    translation: {
      en: "There is no deity except Allah alone without partner. Allah is the Greatest, most great. All praise to Allah, in abundance. Glory be to Allah, Lord of the worlds. There is no power except through Allah the Almighty the Wise. O Allah forgive me, have mercy on me, guide me and provide for me.",
      fr: "Il n'y a pas de divinité sauf Allah seul sans associé. Allah est le Plus Grand. Toute louange à Allah abondamment. Gloire à Allah Seigneur des mondes. Pas de puissance sauf par Allah le Puissant le Sage. Ô Allah pardonne-moi, fais-moi miséricorde, guide-moi et pourvois à mes besoins.",
      de: "Es gibt keine Gottheit außer Allah allein ohne Partner. Allah ist der Größte sehr groß. Aller Lob sei Allah reichlich. Gepriesen sei Allah Herr der Welten. Keine Macht außer durch Allah den Allmächtigen den Weisen. O Allah vergib mir erbarme Dich meiner leite mich und versorge mich." },
    benefit: {
      en: "A Bedouin came to the Prophet and asked to be taught dhikr. After the Prophet taught him these words he asked: And what is for me? The Prophet taught him the dua part. When the Bedouin left the Prophet said: He has filled both his hands with goodness.",
      fr: "Un Bédouin vint au Prophète et demanda qu'on lui apprenne le dhikr. Après que le Prophète lui eut enseigné ces mots il demanda : Et qu'est-ce qui est pour moi? Le Prophète lui apprit la partie dua. Quand le Bédouin repartit le Prophète dit : Il a rempli ses deux mains de bien.",
      de: "Ein Beduine kam zum Propheten und bat ihn ihm Dhikr beizubringen. Nachdem der Prophet ihn diese Worte lehrte fragte er: Und was ist für mich? Der Prophet lehrte ihn den Dua-Teil. Als der Beduine ging sagte der Prophet: Er hat beide Hände mit Güte gefüllt." },
    source: ["Sahih Muslim", "Abu Dawud"] },

  { id: 358, catId: "dhikr_phrases", type: "dua", order: 12,
    title: { en: "The best dua and the best dhikr", fr: "La meilleure invocation et le meilleur dhikr", de: "Die beste Dua und der beste Dhikr" },
    arabic: "اَلْحَمْدُ لِلَّهِ — لاَ إِلَـٰهَ إِلاَّ اللَّهُ",
    transliteration: "Alhamdulillaah — Laa ilaaha illallaah.",
    translation: {
      en: "All praise is for Allah. (best dua) — There is no deity worthy of worship except Allah. (best dhikr)",
      fr: "Toute louange est pour Allah. (meilleure dua) — Il n'y a pas de divinité sauf Allah. (meilleur dhikr)",
      de: "Aller Lob gebührt Allah. (beste Dua) — Es gibt keine Gottheit außer Allah. (bester Dhikr)" },
    benefit: {
      en: "The Prophet said: The best dua is Alhamdulillah. And the best dhikr is La ilaha illallah. Alhamdulillah is dua because it is praise of Allah which brings nearness to Him and is answered. La ilaha illallah is the word of tawhid – the greatest remembrance.",
      fr: "Le Prophète a dit : La meilleure dua est Alhamdulillah. Et le meilleur dhikr est La ilaha illallah.",
      de: "Der Prophet sagte: Die beste Dua ist Alhamdulillah. Und der beste Dhikr ist La ilaha illallah." },
    source: ["At-Tirmidhi", "Ibn Majah", "Al-Hakim", "Sahih"] },

  { id: 359, catId: "dhikr_phrases", type: "info", order: 13,
    title: { en: "Subhanallah wal hamdulillah – fills between heaven and earth", fr: "Subhanallah wal hamdulillah – remplit entre ciel et terre", de: "Subhanallah wal hamdulillah – füllt zwischen Himmel und Erde" },
    content: {
      en: "The Prophet said: Purification is half of faith. Alhamdulillah fills the scale. Subhanallah and Alhamdulillah together fill what is between the heavens and the earth. Most scholars say the faith here refers to prayer – purification is half of prayer since it is a condition for prayer's validity. As for Alhamdulillah filling the scale – this means the dhikr of praise is so weighty with Allah that it fills the scale of deeds on the Day of Judgment.",
      fr: "Le Prophète a dit : La purification est la moitié de la foi. Alhamdulillah remplit la balance. Subhanallah et Alhamdulillah ensemble remplissent ce qui est entre les cieux et la terre. La majorité des savants disent que la foi ici désigne la prière – la purification est la moitié de la prière.",
      de: "Der Prophet sagte: Reinigung ist die Hälfte des Glaubens. Alhamdulillah füllt die Waage. Subhanallah und Alhamdulillah zusammen füllen was zwischen Himmel und Erde ist. Die meisten Gelehrten sagen dass Glaube hier das Gebet meint – Reinigung ist die Hälfte des Gebets." },
    source: ["Sahih Muslim"] },

  { id: 360, catId: "dhikr_phrases", type: "dua", order: 14,
    title: { en: "Hasbunallahu wa nimal wakil – the dua of Ibrahim and the Prophet", fr: "Hasbunallahu wa nimal wakil – la dua d'Ibrahim et du Prophète", de: "Hasbunallahu wa nimal wakil – das Dua Ibrahims und des Propheten" },
    arabic: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",
    transliteration: "Hasbunallaahu wa ni-mal wakiil.",
    translation: {
      en: "Allah is sufficient for us and He is the best Disposer of affairs.",
      fr: "Allah nous suffit et Il est le meilleur Garant.",
      de: "Allah genuegt uns und Er ist der beste Verwalter der Angelegenheiten." },
    benefit: {
      en: "Ibrahim said this when thrown into the fire – and Allah made the fire cool and safe. The Prophet and companions said it when warned of an army gathering against them – and Allah turned the army away. Say it whenever facing any overwhelming difficulty. Its meaning: Allah alone is enough for me, I put my full trust in Him.",
      fr: "Ibrahim dit cela quand on le jeta dans le feu – et Allah rendit le feu frais et sûr. Le Prophète et les compagnons le dirent quand on les avertit d'une armée – et Allah détourna l'armée. Le dire face à toute difficulté écrasante.",
      de: "Ibrahim sprach dies als er ins Feuer geworfen wurde – und Allah machte das Feuer kühl und sicher. Der Prophet und die Gefährten sprachen es als eine Armee gegen sie zusammengestellt wurde – und Allah wendete die Armee ab. Bei jeder überwältigenden Schwierigkeit sprechen." },
    source: ["Sahih Bukhari", "Quran 3:173"] },

  { id: 361, catId: "dhikr_phrases", type: "dua", order: 15,
    title: { en: "Alhamdulillah and Subhanallah to the count of all creation", fr: "Alhamdulillah et Subhanallah au nombre de toute la création", de: "Alhamdulillah und Subhanallah in der Zahl aller Schöpfung" },
    arabic: "اَلْحَمْدُ لِلَّهِ عَدَدَ مَا خَلَقَ، وَالْحَمْدُ لِلَّهِ مِلْءَ مَا خَلَقَ، وَالْحَمْدُ لِلَّهِ عَدَدَ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ، وَالْحَمْدُ لِلَّهِ عَدَدَ مَا أَحْصَى كِتَابُهُ، وَالْحَمْدُ لِلَّهِ مِلْءَ كُلِّ شَيْءٍ، سُبْحَانَ اللَّهِ عَدَدَ مَا خَلَقَ، وَسُبْحَانَ اللَّهِ مِلْءَ مَا خَلَقَ، وَسُبْحَانَ اللَّهِ عَدَدَ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ، وَسُبْحَانَ اللَّهِ عَدَدَ مَا أَحْصَى كِتَابُهُ، وَسُبْحَانَ اللَّهِ مِلْءَ كُلِّ شَيْءٍ",
    transliteration: "Alhamdulillaahi adada maa kholaq, wal hamdulillaahi mil-a maa kholaq, wal hamdulillaahi adada maa fis-samaawaati wa maa fil ardh, wal hamdulillaahi adada maa ahshoo kitaabuh, wal hamdulillaahi mil-a kulli syai-in. Subhaanallaahi adada maa kholaq, wa subhaanallaahi mil-a maa kholaq, wa subhaanallaahi adada maa fis-samaawaati wa maa fil ardh, wa subhaanallaahi adada maa ahshoo kitaabuh, wa subhaanallaahi mil-a kulli syai-in.",
    translation: {
      en: "All praise to Allah to the number of what He created, filling what He created, to the number of what is in the heavens and earth, to the number of what His Book has counted, filling every thing. Glory to Allah to the number of what He created, filling what He created, to the number of what is in the heavens and earth, to the number of what His Book has counted, filling every thing.",
      fr: "Toute louange à Allah au nombre de ce qu'Il a créé, remplissant ce qu'Il a créé, au nombre de ce qui est dans les cieux et la terre, au nombre de ce que Son Livre a dénombré, remplissant toute chose. Gloire à Allah au nombre de ce qu'Il a créé, remplissant toute chose.",
      de: "Aller Lob sei Allah in der Zahl dessen was Er erschaffen hat füllend was Er erschaffen hat in der Zahl dessen was in Himmeln und Erde ist in der Zahl dessen was Sein Buch gezählt hat jede Sache füllend. Gepriesen sei Allah in der Zahl dessen was Er erschaffen hat jede Sache füllend." },
    benefit: {
      en: "The Prophet saw Abu Umamah moving his lips and asked what he was saying. He said: I am making dhikr. The Prophet said: Shall I show you a dhikr whose reward is greater than your dhikr for an entire day and night? He then taught him this. The Prophet said: Teach it to those after you.",
      fr: "Le Prophète vit Abu Umamah bouger les lèvres et lui demanda ce qu'il disait. Il dit : Je fais dhikr. Le Prophète dit : Dois-je te montrer un dhikr dont la récompense est plus grande que ton dhikr pendant toute une journée et nuit? Il lui apprit alors ceci.",
      de: "Der Prophet sah Abu Umamah die Lippen bewegen und fragte was er sagte. Er sagte: Ich mache Dhikr. Der Prophet sagte: Soll ich dir einen Dhikr zeigen dessen Belohnung größer ist als dein Dhikr einen ganzen Tag und eine Nacht? Er lehrte ihn dann dies." },
    source: ["An-Nasai", "Ibn Khuzaymah", "At-Tabarani", "Sahih Al-Albani"] },

  // ── CATEGORY: DUAS FOR GATHERINGS ──
  { id: 362, catId: "gatherings", type: "dua", order: 1,
    title: { en: "Khutbat al-Hajah – opening of a gathering or sermon", fr: "Khutbat al-Hajah – ouverture d'une réunion ou d'un sermon", de: "Khutbat al-Hajah – Eröffnung einer Versammlung oder Predigt" },
    arabic: "إِنَّ الْحَمْدَ لِلَّهِ، نَحْمَدُهُ وَنَسْتَعِينُهُ وَنَسْتَغْفِرُهُ، وَنَعُوذُ بِاللَّهِ مِنْ شُرُورِ أَنْفُسِنَا، وَمِنْ سَيِّئَاتِ أَعْمَالِنَا، مَنْ يَهْدِهِ اللَّهُ فَلَا مُضِلَّ لَهُ، وَمَنْ يُضْلِلْ فَلَا هَادِيَ لَهُ، وَأَشْهَدُ أَنْ لَا إِلَـٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيْكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ",
    transliteration: "Innal hamdalillaah, nahmaduhu, wa nasta-iinuhu, wa nastagh-firuh. Wa na-uudzu billaahi min syuruuri anfusinaa, wa min sayyi-aati a-maalinaa. Man yahdihillaahu falaa mudhilla lah, wa man yudh-lil falaa haadiya lah. Wa asyhadu al-laa ilaaha illallaah, wahdahu laa syariika lah, wa asyhadu anna muhammadan abduhu wa rosuuluh.",
    translation: {
      en: "Indeed all praise belongs to Allah. We praise Him, seek His help and forgiveness, and seek refuge in Allah from the evil of our souls and the evil of our deeds. Whoever Allah guides none can misguide, and whoever Allah misguides none can guide. I bear witness that there is no deity worthy of worship except Allah alone without partner, and I bear witness that Muhammad is His servant and Messenger.",
      fr: "Certes toute louange appartient à Allah. Nous Le louons, cherchons Son aide et Son pardon, et cherchons refuge en Allah contre le mal de nos âmes et le mal de nos actes. Quiconque Allah guide nul ne peut l'égarer, et quiconque Allah égare nul ne peut le guider. Je témoigne qu'il n'y a pas de divinité digne d'adoration sauf Allah seul sans associé, et je témoigne que Muhammad est Son serviteur et Messager.",
      de: "Wahrlich aller Lob gebührt Allah. Wir loben Ihn suchen Seine Hilfe und Vergebung und suchen Zuflucht bei Allah vor dem Bösen unserer Seelen und unserer Taten. Wen Allah leitet den kann niemand irreführen und wen Allah irreführt den kann niemand leiten. Ich bezeuge dass es keine Gottheit außer Allah allein ohne Partner gibt und ich bezeuge dass Muhammad Sein Diener und Gesandter ist." },
    benefit: {
      en: "Said at the opening of any important gathering, sermon, wedding, Friday khutbah or teaching circle. Imam Al-Albani said: This is read as the opening of every khutbah – not only the wedding sermon. It includes three Quranic verses (3:102, 4:1, 33:70-71) and ends with: The best speech is the Book of Allah and the best guidance is that of Muhammad.",
      fr: "Dit à l'ouverture de toute réunion importante, sermon, mariage, khutbah du vendredi ou cercle d'enseignement. L'imam Al-Albani a dit : Ceci est lu comme ouverture de chaque khutbah – pas seulement le sermon de mariage.",
      de: "Gesagt zur Eröffnung jeder wichtigen Versammlung, Predigt, Hochzeit, Freitagskhutbah oder Lehrkreis. Imam Al-Albani sagte: Dies wird als Eröffnung jeder Khutbah gelesen – nicht nur der Hochzeitspredigt." },
    source: ["Sahih Muslim", "An-Nasai", "Shahih Nasai 1331"] },

  { id: 363, catId: "gatherings", type: "dua", order: 2,
    title: { en: "Dua during a gathering – said 100 times before leaving", fr: "Invocation pendant une réunion – dite 100 fois avant de partir", de: "Dua während einer Versammlung – 100x vor dem Gehen gesagt" },
    arabic: "رَبِّ اغْفِرْ لِيْ وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الْغَفُوْرُ",
    transliteration: "Robbighfir lii wa tub alayya, innaka antat-tawwaabul ghofuur.",
    translation: {
      en: "My Lord, forgive me and accept my repentance. Indeed You are the Accepter of repentance, the Most Forgiving.",
      fr: "Mon Seigneur, pardonne-moi et accepte mon repentir. Tu es certes Celui qui accepte le repentir, le Très Pardonneur.",
      de: "Mein Herr vergib mir und nimm meine Reue an. Wahrlich Du bist der Reue-Annehmende der Vergebende." },
    benefit: {
      en: "Ibn Umar counted that the Prophet said this 100 times before getting up from a gathering. The Prophet never left a gathering without seeking forgiveness. This shows the humility of the Prophet even in blessed gatherings.",
      fr: "Ibn Umar a compté que le Prophète disait cela 100 fois avant de se lever d'une réunion. Le Prophète ne quittait jamais une réunion sans demander pardon.",
      de: "Ibn Umar zählte dass der Prophet dies 100-mal sagte bevor er von einer Versammlung aufstand. Der Prophet verließ nie eine Versammlung ohne Vergebung zu suchen." },
    source: ["At-Tirmidhi", "Ibn Majah", "Sahih"] },

  { id: 364, catId: "gatherings", type: "dua", order: 3,
    title: { en: "Dua of the speaker for himself and the gathering", fr: "Invocation du conférencier pour lui-même et l'assemblée", de: "Dua des Redners für sich selbst und die Versammlung" },
    arabic: "اَللَّهُمَّ اقْسِمْ لَنَا مِنْ خَشْيَتِكَ مَا يَحُولُ بَيْنَنَا وَبَيْنَ مَعَاصِيكَ، وَمِنْ طَاعَتِكَ مَا تُبَلِّغُنَا بِهِ جَنَّتَكَ، وَمِنَ الْيَقِينِ مَا تُهَوِّنُ بِهِ عَلَيْنَا مُصِيبَاتِ الدُّنْيَا، وَمَتِّعْنَا بِأَسْمَاعِنَا وَأَبْصَارِنَا وَقُوَّتِنَا مَا أَحْيَيْتَنَا، وَاجْعَلْهُ الْوَارِثَ مِنَّا، وَاجْعَلْ ثَأْرَنَا عَلَى مَنْ ظَلَمَنَا، وَانْصُرْنَا عَلَى مَنْ عَادَانَا، وَلَا تَجْعَلْ مُصِيبَتَنَا فِي دِينِنَا، وَلَا تَجْعَلِ الدُّنْيَا أَكْبَرَ هَمِّنَا وَلَا مَبْلَغَ عِلْمِنَا، وَلَا تُسَلِّطْ عَلَيْنَا مَنْ لَا يَرْحَمُنَا",
    transliteration: "Allaahummaqsim lanaa min khosy-yatika maa yahuulu bainanaa wa baina ma-aashiik, wa min thoo-atika maa tuballighunaa bihi jannatak, wa minal yaqiini maa tuhawwinu bihi alainaa mushiibaatid-dunyaa, wa matti-naa bi-asmaa-inaa wa ab-shoorinaa wa quwwatinaa maa ah-yaytanaa, waj-alhul waari-tsa minnaa, waj-al tsa-ronaa alaa man zholamanaa, wan-shurnaa alaa man aadaanaa, wa laa taj-al mushiibatanaa fii diininaa, wa laa taj-alid-dunyaa akbaro hamminaa wa laa mablagho ilminaa, wa laa tusallith alainaa man laa yarhamunaa.",
    translation: {
      en: "O Allah, grant us such fear of You as will stand between us and disobeying You, and such obedience to You as will bring us to Your Paradise, and such certainty as will make the calamities of this world easy for us. Grant us enjoyment of our hearing, sight and strength as long as You keep us alive, and make it the inheritor from us. Make our revenge against those who wrong us, help us against those who are hostile to us, do not make our calamity in our religion, do not make this world our greatest concern or the limit of our knowledge, and do not give power over us to those who show us no mercy.",
      fr: "Ô Allah, accorde-nous une telle crainte de Toi qui nous sépare de Tes désobéissances, une telle obéissance à Toi qui nous mène à Ton Paradis, et une telle certitude qui allège pour nous les calamités de ce monde. Donne-nous la jouissance de notre ouïe, de notre vue et de notre force tant que Tu nous maintiens en vie. Fais que notre vengeance soit sur ceux qui nous ont oppressés, aide-nous contre ceux qui nous sont hostiles, ne fais pas que notre calamité soit dans notre religion, ne fais pas du monde notre plus grand souci ni le but de notre savoir, et ne donne pas pouvoir sur nous à ceux qui ne nous font pas miséricorde.",
      de: "O Allah gewähre uns solche Furcht vor Dir die zwischen uns und Deiner Ungehorsam steht solchen Gehorsam Dir gegenüber der uns zu Deinem Paradies führt und solche Gewissheit die uns die Prüfungen dieser Welt erleichtert. Lass uns Gehör Sehvermögen und Kraft genießen solange Du uns am Leben erhältst. Lass unsere Vergeltung über die sein die uns Unrecht taten hilf uns gegen unsere Feinde mache unsere Prüfung nicht in unserer Religion mache die Welt nicht unser größtes Anliegen und gib keine Macht über uns denen die kein Erbarmen mit uns haben." },
    benefit: {
      en: "Ibn Umar said: Rarely did the Prophet stand up from a gathering without making this dua for his companions. It is one of the most comprehensive duas covering fear of Allah, obedience, certainty, health, justice, religion and leadership.",
      fr: "Ibn Umar dit : Rarement le Prophète se levait-il d'une réunion sans faire cette dua pour ses compagnons. C'est l'une des duas les plus complètes.",
      de: "Ibn Umar sagte: Selten stand der Prophet von einer Versammlung auf ohne dieses Dua für seine Gefährten zu machen. Es ist eines der umfassendsten Duas." },
    source: ["At-Tirmidhi", "Sahih Al-Albani"] },

  { id: 365, catId: "gatherings", type: "dua", order: 4,
    title: { en: "Kaffaratul Majlis – expiation of the gathering (said at the end)", fr: "Kaffaratul Majlis – expiation de la réunion (dit à la fin)", de: "Kaffaratul Majlis – Sühne der Versammlung (am Ende gesagt)" },
    arabic: "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لاَ إِلَـٰهَ إِلاَّ أَنْتَ، أَسْتَغْفِرُكَ، وَأَتُوْبُ إِلَيْكَ",
    transliteration: "Subhaanakallaahumma wa bihamdika, asyhadu al-laa ilaaha illaa anta, astaghfiruka, wa atuubu ilaik.",
    translation: {
      en: "Glory be to You O Allah and with Your praise, I bear witness that there is no deity worthy of worship except You, I seek Your forgiveness and I repent to You.",
      fr: "Gloire à Toi ô Allah et par Ta louange, je témoigne qu'il n'y a pas de divinité digne d'adoration sauf Toi, je Te demande pardon et je me repens à Toi.",
      de: "Gepriesen seist Du o Allah und mit Deinem Lob ich bezeuge dass es keine Gottheit außer Dir gibt ich suche Deine Vergebung und bereue zu Dir." },
    benefit: {
      en: "The Prophet said: Whoever sits in a gathering where there was much idle talk, and says this before getting up – it will be an expiation for what occurred in that gathering. Ibn Rajab said: The Prophet ended every gathering with this and commanded that all gatherings be ended with it. Even the best gatherings benefit from ending with it.",
      fr: "Le Prophète a dit : Quiconque s'assoit dans une réunion où il y avait beaucoup de paroles vaines, et dit cela avant de se lever – ce sera une expiation pour ce qui s'est passé dans cette réunion.",
      de: "Der Prophet sagte: Wer in einer Versammlung sitzt wo viel leeres Gerede war und dies vor dem Aufstehen sagt – es wird Sühne sein für das was in dieser Versammlung geschah." },
    source: ["At-Tirmidhi", "Abu Dawud", "Sahih"] },

  // ── CATEGORY: FACING ENEMIES & RULERS ──
  { id: 366, catId: "enemies", type: "dua", order: 1,
    title: { en: "Facing an enemy – O Allah place yourself at their throats", fr: "Face à un ennemi – O Allah mets-Toi à leurs gorges", de: "Feind begegnen – O Allah stelle Dich an ihre Kehlen" },
    arabic: "اَللَّهُمَّ إِنَّا نَجْعَلُكَ فِيْ نُحُوْرِهِمْ وَنَعُوْذُ بِكَ مِنْ شُرُوْرِهِمْ",
    transliteration: "Allaahumma innaa naj-aluka fii nuhuurihim, wa na-uudzu bika min syuruurihim.",
    translation: {
      en: "O Allah, we place You at their throats and seek refuge in You from their evil.",
      fr: "Ô Allah, nous Te plaçons à leurs gorges et cherchons refuge auprès de Toi contre leur mal.",
      de: "O Allah wir stellen Dich an ihre Kehlen und suchen Zuflucht bei Dir vor ihrem Bösen." },
    benefit: {
      en: "Placing Allah at the throat of the enemy means asking Allah to render their power ineffective against us. A dua from the battlefield tradition – but applies to any enemy, human or spiritual.",
      fr: "Placer Allah à la gorge de l'ennemi signifie demander à Allah de rendre leur pouvoir inefficace contre nous.",
      de: "Allah an die Kehle des Feindes stellen bedeutet Allah zu bitten ihre Macht gegen uns unwirksam zu machen." },
    source: ["Abu Dawud", "Al-Hakim", "Sahih"] },

  { id: 367, catId: "enemies", type: "dua", order: 2,
    title: { en: "O Allah You are my strength – with You I move and fight", fr: "O Allah Tu es ma force – avec Toi je me déplace et je combats", de: "O Allah Du bist meine Stärke – mit Dir bewege ich mich und kämpfe" },
    arabic: "اَللَّهُمَّ أَنْتَ عَضُدِيْ، وَأَنْتَ نَصِيْرِيْ، بِكَ أَجُوْلُ، وَبِكَ أَصُوْلُ، وَبِكَ أُقَاتِلُ",
    transliteration: "Allaahumma anta adhudii, wa anta nashiirii, bika ajuulu, wa bika ashuulu, wa bika uqootil.",
    translation: {
      en: "O Allah, You are my arm (my support) and You are my helper. Through You I move, through You I attack and through You I fight.",
      fr: "Ô Allah, Tu es mon bras (mon soutien) et Tu es mon aide. Par Toi je me déplace, par Toi j'attaque et par Toi je combats.",
      de: "O Allah Du bist mein Arm (meine Stütze) und Du bist mein Helfer. Durch Dich bewege ich mich durch Dich greife ich an und durch Dich kämpfe ich." },
    benefit: {
      en: "Complete reliance on Allah in facing any difficulty or enemy. Every movement, every effort and every struggle is through Allah's power and support – not one's own.",
      fr: "Confiance totale en Allah face à toute difficulté ou ennemi. Chaque mouvement, chaque effort et chaque lutte se fait par la puissance d'Allah.",
      de: "Vollständiges Vertrauen auf Allah beim Begegnen jeder Schwierigkeit oder jeden Feindes. Jede Bewegung jede Anstrengung und jeder Kampf geschieht durch Allahs Kraft." },
    source: ["Abu Dawud", "At-Tirmidhi", "Sahih"] },

  { id: 368, catId: "enemies", type: "dua", order: 3,
    title: { en: "Allah is sufficient – Hasbunallahu wa nimal wakil", fr: "Allah nous suffit – Hasbunallahu wa nimal wakil", de: "Allah genuegt uns – Hasbunallahu wa nimal wakil" },
    arabic: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",
    transliteration: "Hasbunallaahu wa ni-mal wakiil.",
    translation: {
      en: "Allah is sufficient for us and He is the best Disposer of affairs.",
      fr: "Allah nous suffit et Il est le meilleur Garant.",
      de: "Allah genuegt uns und Er ist der beste Verwalter der Angelegenheiten." },
    benefit: {
      en: "Said when facing any overwhelming threat or powerful enemy. This was the saying of Ibrahim when thrown into fire and of the Prophet when warned of an army. Allah made the fire cool for Ibrahim and turned the army away from the Prophet.",
      fr: "Dit face à toute menace écrasante ou ennemi puissant. C'est ce qu'a dit Ibrahim quand on le jeta dans le feu et ce qu'a dit le Prophète quand on l'avertit d'une armée.",
      de: "Gesagt bei jeder überwältigenden Bedrohung oder jedem mächtigen Feind. Dies war Ibrahims Aussage als er ins Feuer geworfen wurde und die des Propheten als eine Armee gegen ihn gewarnt wurde." },
    source: ["Sahih Bukhari", "Quran 3:173"] },

  { id: 369, catId: "enemies", type: "dua", order: 4,
    title: { en: "Fearing an unjust ruler – O Allah be my protector", fr: "Craindre un dirigeant injuste – O Allah sois mon protecteur", de: "Ungerechten Herrscher fürchten – O Allah sei mein Beschützer" },
    arabic: "اَللَّهُمَّ رَبَّ السَّمَاوَاتِ السَّبْعِ، وَرَبَّ الْعَرْشِ الْعَظِيْمِ، كُنْ لِيْ جَارًا مِنْ فُلاَنٍ بْنِ فُلاَنٍ، وَأَحْزَابِهِ مِنْ خَلاَئِقِكَ، أَنْ يَفْرُطَ عَلَيَّ أَحَدٌ مِنْهُمْ أَوْ يَطْغَى، عَزَّ جَارُكَ، وَجَلَّ ثَنَاؤُكَ، وَلاَ إِلَـٰهَ إِلاَّ أَنْتَ",
    transliteration: "Allaahumma robbas-samaawaatis-sab-i, wa robbal arsyil azhiim, kun lii jaaron min fulaanibni fulaan, wa ahzaabihi min kholaa-iqika, an yafrutho alayya ahadun minhum au yath-ghoo, azza jaaruka, wa jalla tsanaa-uka, wa laa ilaaha illa anta.",
    translation: {
      en: "O Allah, Lord of the seven heavens, Lord of the Magnificent Throne, be my protector against so-and-so and his groups from among Your creatures, lest any of them attack me or transgress against me. Mighty is Your protection, Majestic is Your praise, and there is no deity worthy of worship except You.",
      fr: "Ô Allah, Seigneur des sept cieux, Seigneur du Trône Majestueux, sois mon protecteur contre untel et ses groupes parmi Tes créatures, afin qu'aucun d'eux ne m'attaque ou ne transgresse contre moi. Puissante est Ta protection, Majestueuse est Ta louange, et il n'y a pas de divinité digne d'adoration sauf Toi.",
      de: "O Allah Herr der sieben Himmel Herr des erhabenen Thrones sei mein Beschützer gegen diesen und jenen und seine Gruppen unter Deinen Geschöpfen damit keiner von ihnen mich angreift oder gegen mich übertritt. Mächtig ist Dein Schutz majestätisch ist Dein Lob und es gibt keine Gottheit außer Dir." },
    instruction: {
      en: "Replace 'so-and-so' with the name of the person you fear.",
      fr: "Remplacez 'untel' par le nom de la personne que vous craignez.",
      de: "Ersetze 'dieser und jener' durch den Namen der Person die du fürchtest." },
    source: ["Al-Bukhari in Al-Adabul Mufrad", "Sahih Al-Albani"] },

  { id: 370, catId: "enemies", type: "dua", order: 5,
    title: { en: "Fearing an unjust ruler – Allah is greater than all I fear (said 3x)", fr: "Craindre un dirigeant injuste – Allah est plus grand que tout ce que je crains (dit 3x)", de: "Ungerechten Herrscher fürchten – Allah ist größer als alles was ich fürchte (3x)" },
    arabic: "اَللَّهُ أَكْبَرُ، اَللَّهُ أَعَزُّ مِنْ خَلْقِهِ جَمِيْعًا، اَللَّهُ أَعَزُّ مِمَّا أَخَافُ وَأَحْذَرُ، وَأَعُوْذُ بِاللَّهِ الَّذِيْ لاَ إِلَـٰهَ إِلاَّ هُوَ الْمُمْسِكِ السَّمَاوَاتِ السَّبْعِ أَنْ يَقَعْنَ عَلَى اْلأَرْضِ إِلاَّ بِإِذْنِهِ، مِنْ شَرِّ عَبْدِكَ فُلاَنٍ وَجُنُوْدِهِ وَأَتْبَاعِهِ وَأَشْيَاعِهِ، مِنَ الْجِنِّ وَاْلإِنْسِ، اَللَّهُمَّ كُنْ لِيْ جَارًا مِنْ شَرِّهِمْ، وَجَلَّ ثَنَاؤُكَ وَعَزَّ جَارُكَ وَتَبَارَكَ اسْمُكَ، وَلاَ إِلَـٰهَ غَيْرُكَ",
    transliteration: "Allaahu akbar, allaahu a-azzu min kholqihi jamii-an, allaahu a-azzu mimmaa akhoofu wa ahdzar, wa a-uudzu billaahil-ladzii laa ilaaha illaa huu, al mumsikis-samaawaatis-sab-i an yaqa-na alal ardhi illaa bi-idznih, min syarri abdika fulaan wa junuudihi wa atbaa-ihi wa asy-yaa-ih, minal jinni wal ins. Allaahumma kun lii jaaron min syarrihim, wa jalla tsanaa-uka wa azza jaaruka wa tabaarokasmuka, wa laa ilaaha ghoiruk. (3x)",
    translation: {
      en: "Allah is the Greatest. Allah is mightier than all His creation. Allah is mightier than what I fear and dread. I seek refuge in Allah, besides Whom there is no deity, Who holds the seven heavens from falling on the earth except by His permission, from the evil of Your servant so-and-so and his soldiers, followers and supporters from among jinn and mankind. O Allah, be my protector against their evil. Majestic is Your praise, mighty is Your protection, Blessed is Your Name, and there is no deity except You. (3 times)",
      fr: "Allah est le Plus Grand. Allah est plus puissant que toute Sa création. Allah est plus puissant que ce que je crains et redoute. Je cherche refuge auprès d'Allah, en dehors duquel il n'y a pas de divinité, Qui tient les sept cieux de ne pas tomber sur la terre sauf par Sa permission, contre le mal de Ton serviteur untel et ses soldats, partisans et soutiens parmi les djinns et les hommes. (3 fois)",
      de: "Allah ist der Größte. Allah ist mächtiger als all Seine Schöpfung. Allah ist mächtiger als das was ich fürchte und scheue. Ich suche Zuflucht bei Allah neben dem es keine Gottheit gibt der die sieben Himmel hält nicht auf die Erde zu fallen außer mit Seiner Erlaubnis vor dem Bösen Deines Dieners diesem und jenem und seinen Soldaten Anhängern und Unterstützern unter Dschinn und Menschen. (3x)" },
    instruction: {
      en: "Replace 'so-and-so' with the name. Say the full dua 3 times.",
      fr: "Remplacez 'untel' par le nom. Dire le dua complet 3 fois.",
      de: "Ersetze 'dieser und jener' durch den Namen. Das vollständige Dua 3-mal sprechen." },
    source: ["Al-Bukhari in Al-Adabul Mufrad", "Sahih Al-Albani"] },

  { id: 371, catId: "enemies", type: "dua", order: 6,
    title: { en: "Dua to defeat the enemy – O Allah scatter their ranks", fr: "Invocation pour vaincre l'ennemi – O Allah disperse leurs rangs", de: "Dua um den Feind zu besiegen – O Allah zerstreue ihre Reihen" },
    arabic: "اَللَّهُمَّ مُنْزِلَ الْكِتَابِ، سَرِيْعَ الْحِسَابِ، اِهْزِمِ اْلأَحْزَابَ، اَللَّهُمَّ اهْزِمْهُمْ وَزَلْزِلْهُمْ",
    transliteration: "Allaahumma munzilal kitaab, sarii-al hisaab, ihzimil ahzaab, allaahummah-zimhum wa zalzilhum.",
    translation: {
      en: "O Allah, Revealer of the Book, Swift in reckoning, defeat the confederates. O Allah, defeat them and shake them.",
      fr: "Ô Allah, Révélateur du Livre, Prompt dans le jugement, défais les coalisés. Ô Allah, défais-les et secoue-les.",
      de: "O Allah Offenbarer des Buches Schneller in der Abrechnung besiege die Verbündeten. O Allah besiege sie und erschüttere sie." },
    benefit: {
      en: "The Prophet said this on the day of the Battle of the Confederates (Al-Ahzab). The enemies had gathered a massive coalition against the Muslims. Allah scattered them without a major battle.",
      fr: "Le Prophète a dit cela le jour de la Bataille des Coalisés (Al-Ahzab). Les ennemis avaient rassemblé une grande coalition contre les musulmans. Allah les dispersa sans grande bataille.",
      de: "Der Prophet sprach dies am Tag der Grabenschlacht (Al-Ahzab). Die Feinde hatten eine massive Koalition gegen die Muslime gesammelt. Allah zerstreute sie ohne eine große Schlacht." },
    source: ["Sahih Muslim"] },

  { id: 372, catId: "enemies", type: "dua", order: 7,
    title: { en: "Dua to defeat the enemy and seek victory", fr: "Invocation pour vaincre l'ennemi et demander la victoire", de: "Dua um den Feind zu besiegen und Sieg zu erbitten" },
    arabic: "اَللَّهُمَّ مُنْزِلَ الْكِتَابِ، وَمُجْرِيَ السَّحَابِ، وَهَازِمَ الأَحْزَابِ، اِهْزِمْهُمْ، وَانْصُرْنَا عَلَيْهِمْ",
    transliteration: "Allaahumma munzilal kitaab, wa mujriyas-sahaab, wa haazimal ahzaab, ihzimhum, wan-shurnaa alaihim.",
    translation: {
      en: "O Allah, Revealer of the Book, Mover of the clouds, Defeater of the confederates – defeat them and grant us victory over them.",
      fr: "Ô Allah, Révélateur du Livre, Celui qui fait avancer les nuages, Vainqueur des coalisés – défais-les et accorde-nous la victoire sur eux.",
      de: "O Allah Offenbarer des Buches Beweger der Wolken Besieger der Verbündeten – besiege sie und gib uns Sieg über sie." },
    benefit: {
      en: "A slightly more complete version than entry 6, adding the attribute of Allah moving the clouds. Allah who controls the clouds, the sky and all natural forces is the one being asked for victory.",
      fr: "Une version légèrement plus complète que l'entrée 6, ajoutant l'attribut d'Allah qui fait avancer les nuages.",
      de: "Eine etwas vollständigere Version als Eintrag 6 mit dem Attribut Allahs der die Wolken bewegt." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 373, catId: "enemies", type: "dua", order: 8,
    title: { en: "When fearing a people – O Allah suffice me against them", fr: "Quand on craint un peuple – O Allah suffit-moi contre eux", de: "Wenn man ein Volk fürchtet – O Allah genuege mir gegen sie" },
    arabic: "اَللَّهُمَّ اكْفِنِيْهِمْ بِمَا شِئْتَ",
    transliteration: "Allaahummak-finiihim bimaa syi-ta.",
    translation: {
      en: "O Allah, suffice me against them with whatever You will.",
      fr: "Ô Allah, suffit-moi contre eux avec ce que Tu veux.",
      de: "O Allah genuege mir gegen sie mit was immer Du willst." },
    benefit: {
      en: "A short but powerful dua of complete tawakkul. By saying whatever You will, the believer leaves the method entirely to Allah – not specifying how Allah should deal with the threat. Complete surrender of the matter to Allah.",
      fr: "Un dua court mais puissant de tawakkul complet. En disant ce que Tu veux, le croyant laisse la méthode entièrement à Allah.",
      de: "Ein kurzes aber kraftvolles Dua vollständigen Tawakkuls. Mit was immer Du willst überlässt der Gläubige die Methode vollständig Allah." },
    source: ["Sahih Muslim"] },

  // ── CATEGORY: PROTECTION FROM OPPRESSORS ──
  { id: 374, catId: "oppressors", type: "dua", order: 1,
    title: { en: "Save me from the oppressive people – Dua of Prophet Musa (Quran 28:21)", fr: "Sauve-moi du peuple oppresseur – Invocation du Prophète Musa (Coran 28:21)", de: "Rette mich vom ungerechten Volk – Dua des Propheten Musa (Quran 28:21)" },
    arabic: "رَبِّ نَجِّنِي مِنَ الْقَوْمِ الظَّالِمِينَ",
    transliteration: "Robbi najjinii minal qoumizh-zhoolimiin.",
    translation: {
      en: "My Lord, save me from the oppressive people.",
      fr: "Mon Seigneur, sauve-moi du peuple oppresseur.",
      de: "Mein Herr rette mich vor dem ungerechten Volk." },
    benefit: {
      en: "The dua of Prophet Musa when he fled from Egypt after accidentally killing a man. He was fleeing from Pharaoh's oppressive regime. Said when escaping from any unjust situation, authority or people.",
      fr: "L'invocation du Prophète Musa quand il fuit l'Égypte après avoir accidentellement tué un homme. Il fuyait le régime oppresseur de Pharaon. À dire quand on fuit toute situation, autorité ou peuple injuste.",
      de: "Das Dua des Propheten Musa als er aus Ägypten floh nachdem er versehentlich einen Mann getötet hatte. Er floh vor Pharaos unterdrückerischem Regime. Gesagt wenn man vor einer ungerechten Situation Autorität oder Menschen flieht." },
    source: ["Quran 28:21"] },

  { id: 375, catId: "oppressors", type: "dua", order: 2,
    title: { en: "Do not place us with the oppressive people (Quran 7:47)", fr: "Ne nous place pas parmi le peuple oppresseur (Coran 7:47)", de: "Setze uns nicht mit dem ungerechten Volk (Quran 7:47)" },
    arabic: "رَبَّنَا لَا تَجْعَلْنَا مَعَ الْقَوْمِ الظَّالِمِينَ",
    transliteration: "Robbanaa laa taj-alnaa ma-al qoumizh-zhoolimiin.",
    translation: {
      en: "Our Lord, do not place us together with the oppressive people.",
      fr: "Notre Seigneur, ne nous place pas avec le peuple oppresseur.",
      de: "Unser Herr setze uns nicht zusammen mit dem ungerechten Volk." },
    benefit: {
      en: "Said by the people of the Heights on the Day of Judgment, asking Allah not to be grouped with the wrongdoers. A dua to say in this life too – asking not to be associated with oppressors in any way.",
      fr: "Dit par les gens des Hauteurs le Jour du Jugement, demandant à Allah de ne pas être regroupés avec les injustes. Un dua à dire aussi dans cette vie.",
      de: "Von den Menschen der Höhen am Jüngsten Tag gesagt und Allah gebeten nicht mit den Ungerechten gruppiert zu werden. Auch in diesem Leben zu sagen." },
    source: ["Quran 7:47"] },

  { id: 376, catId: "oppressors", type: "dua", order: 3,
    title: { en: "Help me against the corrupt people – Dua of Prophet Lut (Quran 29:30)", fr: "Aide-moi contre le peuple corrupteur – Invocation du Prophète Lut (Coran 29:30)", de: "Hilf mir gegen das verderbte Volk – Dua des Propheten Lut (Quran 29:30)" },
    arabic: "رَبِّ انْصُرْنِي عَلَى الْقَوْمِ الْمُفْسِدِينَ",
    transliteration: "Robbin-shurnii alal qoumil mufsidiin.",
    translation: {
      en: "My Lord, help me against the corrupt, corrupting people.",
      fr: "Mon Seigneur, aide-moi contre le peuple corrupteur.",
      de: "Mein Herr hilf mir gegen das korrupte verderbliche Volk." },
    benefit: {
      en: "The dua of Prophet Lut when his people refused all guidance and persisted in their corruption. Allah answered by sending angels to destroy them. Said when facing people who spread corruption and harm.",
      fr: "L'invocation du Prophète Lut quand son peuple refusa toute guidance et persista dans sa corruption. Allah répondit en envoyant des anges pour les détruire.",
      de: "Das Dua des Propheten Lut als sein Volk jede Führung ablehnte und in seiner Korruption beharrte. Allah antwortete indem Er Engel sandte um sie zu vernichten." },
    source: ["Quran 29:30"] },

  { id: 377, catId: "oppressors", type: "dua", order: 4,
    title: { en: "Do not make us a trial for disbelievers – Dua of Ibrahim (Quran 60:5)", fr: "Ne fais pas de nous une épreuve pour les mécréants – Invocation d'Ibrahim (Coran 60:5)", de: "Mache uns nicht zur Prüfung für die Ungläubigen – Dua Ibrahims (Quran 60:5)" },
    arabic: "رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِلَّذِينَ كَفَرُوا وَاغْفِرْ لَنَا رَبَّنَا إِنَّكَ أَنْتَ الْعَزِيزُ الْحَكِيمُ",
    transliteration: "Robbanaa laa taj-alnaa fitnatan lilladziina kafaruu, wagh-fir lanaa robbanaa, innaka antal aziizul hakiim.",
    translation: {
      en: "Our Lord, do not make us a trial for those who disbelieve and forgive us, our Lord. Indeed it is You who is the Exalted in Might, the Wise.",
      fr: "Notre Seigneur, ne fais pas de nous une épreuve pour les mécréants et pardonne-nous, notre Seigneur. Tu es certes le Puissant, le Sage.",
      de: "Unser Herr mache uns nicht zur Prüfung für die Ungläubigen und vergib uns unser Herr. Wahrlich Du bist der Allmächtige der Weise." },
    benefit: {
      en: "The dua of Prophet Ibrahim and his companions. Being a fitna for disbelievers means: giving them an excuse to mock Islam, or becoming weak that they dominate and oppress Muslims. This dua asks Allah to protect the Muslim community from weakness and humiliation.",
      fr: "L'invocation du Prophète Ibrahim et de ses compagnons. Être une fitna pour les mécréants signifie : leur donner une excuse pour se moquer de l'Islam, ou devenir si faible qu'ils dominent les musulmans.",
      de: "Das Dua des Propheten Ibrahim und seiner Gefährten. Eine Fitna für Ungläubige zu sein bedeutet: ihnen einen Grund zu geben den Islam zu verspotten oder so schwach zu werden dass sie Muslime dominieren." },
    source: ["Quran 60:5"] },

  { id: 378, catId: "oppressors", type: "dua", order: 5,
    title: { en: "Do not make us a trial for oppressors – save us from disbelievers (Quran 10:85-86)", fr: "Ne fais pas de nous une épreuve pour les oppresseurs – sauve-nous des mécréants (Coran 10:85-86)", de: "Mache uns nicht zur Prüfung für Unterdrücker – rette uns vor den Ungläubigen (Quran 10:85-86)" },
    arabic: "رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِلْقَوْمِ الظَّالِمِينَ وَنَجِّنَا بِرَحْمَتِكَ مِنَ الْقَوْمِ الْكَافِرِينَ",
    transliteration: "Robbanaa laa taj-alnaa fitnatan lilqoumizh-zhoolimiin, wa najjinaa birohmatika minal qoumil kaafiriin.",
    translation: {
      en: "Our Lord, do not make us a trial for the oppressive people, and save us by Your mercy from the disbelieving people.",
      fr: "Notre Seigneur, ne fais pas de nous une épreuve pour le peuple oppresseur, et sauve-nous par Ta miséricorde du peuple mécréant.",
      de: "Unser Herr mache uns nicht zur Prüfung für das ungerechte Volk und rette uns durch Deine Barmherzigkeit vor dem ungläubigen Volk." },
    benefit: {
      en: "The dua of the believers among the people of Pharaoh after they declared faith in Moses. They immediately feared Pharaoh's retaliation and turned to Allah. Two requests: not to become a tool for oppressors, and to be saved by Allah's mercy.",
      fr: "L'invocation des croyants parmi le peuple de Pharaon après avoir déclaré leur foi en Moise. Ils craignirent immédiatement les représailles de Pharaon et se tournèrent vers Allah.",
      de: "Das Dua der Gläubigen unter dem Volk des Pharao nachdem sie ihren Glauben an Musa erklärt hatten. Sie fürchteten sofort Pharaos Vergeltung und wandten sich an Allah." },
    source: ["Quran 10:85-86"] },

  // ── CATEGORY: HAJJ & UMRAH ──
  { id: 379, catId: "hajj", type: "dua", order: 1,
    title: { en: "Talbiyah – the call of the pilgrim", fr: "Talbiyah – l'appel du pèlerin", de: "Talbiyah – der Ruf des Pilgers" },
    arabic: "لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لاَ شَرِيْكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ لاَ شَرِيْكَ لَكَ",
    transliteration: "Labbaikallaahumma labbaik, labbaika laa syariika laka labbaik, innal hamda wan-ni-mata laka wal mulk, laa syariika lak.",
    translation: {
      en: "Here I am O Allah, here I am. Here I am, You have no partner, here I am. Indeed all praise, grace and sovereignty belong to You. You have no partner.",
      fr: "Me voici ô Allah, me voici. Me voici, Tu n'as pas d'associé, me voici. Certes toute louange, grâce et souveraineté T'appartiennent. Tu n'as pas d'associé.",
      de: "Hier bin ich o Allah hier bin ich. Hier bin ich Du hast keinen Partner hier bin ich. Wahrlich aller Lob Gnade und Herrschaft gehören Dir. Du hast keinen Partner." },
    benefit: {
      en: "The Talbiyah is said from the moment of entering Ihram until the first stone is thrown at Jamarat on Eid day. It is the pilgrim's answer to Allah's call to Hajj. The Prophet said to raise the voice with it.",
      fr: "La Talbiyah est dite depuis le moment d'entrer en Ihram jusqu'au premier jet de pierre à Jamarat le jour de l'Aïd. C'est la réponse du pèlerin à l'appel d'Allah au Hajj.",
      de: "Die Talbiyah wird vom Moment des Eintretens in den Ihram bis zum ersten Steinwurf bei Jamarat am Eid-Tag gesagt. Es ist die Antwort des Pilgers auf Allahs Ruf zum Hadsch." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 380, catId: "hajj", type: "info", order: 2,
    title: { en: "Say Takbir at the Black Stone during Tawaf", fr: "Dire Takbir à la Pierre Noire pendant le Tawaf", de: "Takbir beim Schwarzen Stein während des Tawaf sagen" },
    content: {
      en: "The Prophet performed tawaf around the Kaaba on his camel. Every time he came to the Black Stone (Hajar Aswad) he would point to it with whatever he held and say Allahu Akbar. This is the Sunnah at each of the seven circuits – say Takbir when passing or touching the Black Stone.",
      fr: "Le Prophète effectua le tawaf autour de la Kaaba sur son chameau. Chaque fois qu'il arrivait à la Pierre Noire il pointait vers elle avec ce qu'il tenait et disait Allahu Akbar. C'est la Sunna à chacun des sept circuits.",
      de: "Der Prophet führte Tawaf um die Kaaba auf seinem Kamel durch. Jedes Mal wenn er zum Schwarzen Stein kam zeigte er mit dem was er hielt darauf und sagte Allahu Akbar. Dies ist die Sunnah bei jedem der sieben Runden." },
    source: ["Sahih Bukhari"] },

  { id: 381, catId: "hajj", type: "dua", order: 3,
    title: { en: "Dua between Rukn Yamani and the Black Stone", fr: "Invocation entre le Rukn Yamani et la Pierre Noire", de: "Dua zwischen Rukn Yamani und dem Schwarzen Stein" },
    arabic: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي اْلآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
    transliteration: "Robbanaa aatinaa fid-dunyaa hasanah, wa fil aakhiroti hasanah, wa qinaa adzaaban-naar.",
    translation: {
      en: "Our Lord, give us good in this world and good in the Hereafter and protect us from the punishment of the Fire.",
      fr: "Notre Seigneur, donne-nous le bien en ce monde et le bien dans l'au-delà et protège-nous du châtiment du Feu.",
      de: "Unser Herr gib uns Gutes in dieser Welt und Gutes im Jenseits und schütze uns vor der Strafe des Feuers." },
    benefit: {
      en: "Said specifically in the section between Rukn Yamani (the Yemeni corner) and the Black Stone during each circuit of Tawaf. The Prophet recited this dua in this specific section.",
      fr: "Dit spécifiquement dans la section entre Rukn Yamani et la Pierre Noire lors de chaque circuit du Tawaf.",
      de: "Speziell im Abschnitt zwischen Rukn Yamani und dem Schwarzen Stein bei jedem Tawaf-Rundgang gesagt." },
    source: ["Abu Dawud", "Ahmad", "Hasan"] },

  { id: 382, catId: "hajj", type: "info", order: 4,
    title: { en: "Recitation when approaching Mount Safa", fr: "Récitation en approchant du Mont Safa", de: "Rezitation beim Annähern an den Berg Safa" },
    content: {
      en: "When the Prophet approached Mount Safa he recited: Indeed As-Safa and Al-Marwah are among the symbols of Allah (Quran 2:158). Then he said: I begin with what Allah began with. Then he climbed Safa until he could see the Kaaba, faced the qibla, said the declaration of tawhid, made takbir and supplicated.",
      fr: "Quand le Prophète s'approchait du Mont Safa il récitait : Certes As-Safa et Al-Marwah sont parmi les symboles d'Allah (Coran 2:158). Puis il disait : Je commence par ce qu'Allah a commencé. Puis il montait Safa jusqu'à voir la Kaaba, faisait face à la qibla, disait la déclaration de tawhid et suppliait.",
      de: "Als der Prophet sich dem Berg Safa näherte rezitierte er: Wahrlich As-Safa und Al-Marwah gehören zu den Zeichen Allahs (Quran 2:158). Dann sagte er: Ich beginne mit dem womit Allah begann. Dann bestieg er Safa bis er die Kaaba sehen konnte wandte sich zur Qibla und betete." },
    source: ["Sahih Muslim"] },

  { id: 383, catId: "hajj", type: "dua", order: 5,
    title: { en: "Dua on top of Mount Safa and Marwah (said 3 times)", fr: "Invocation au sommet des Monts Safa et Marwah (dite 3 fois)", de: "Dua auf dem Gipfel der Berge Safa und Marwah (3x gesagt)" },
    arabic: "لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيْكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ، لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ أَنْجَزَ وَعْدَهُ وَنَصَرَ عَبْدَهُ وَهَزَمَ اْلأَحْزَابَ وَحْدَهُ",
    transliteration: "Laa ilaaha illallaah, wahdahu laa syariika lah, lahul mulku wa lahul hamd, wa huwa alaa kulli syai-in qodiir. Laa ilaaha illallaahu wahdah, anjaza wa-dah, wa nashoro abdah, wa hazamal ahzaaba wahdah.",
    translation: {
      en: "There is no deity worthy of worship except Allah, alone without partner, to Him belongs the dominion and all praise, and He is over all things capable. There is no deity except Allah alone, He fulfilled His promise, gave victory to His servant and defeated the confederates alone.",
      fr: "Il n'y a pas de divinité sauf Allah, seul sans associé, à Lui le règne et toute louange, Il est sur toute chose Puissant. Il n'y a pas de divinité sauf Allah seul, Il a accompli Sa promesse, donné la victoire à Son serviteur et vaincu les coalisés seul.",
      de: "Es gibt keine Gottheit außer Allah allein ohne Partner Ihm gehört die Herrschaft und aller Lob und Er ist über alle Dinge mächtig. Es gibt keine Gottheit außer Allah allein Er erfüllte Sein Versprechen gab Seinem Diener Sieg und besiegte die Verbündeten allein." },
    benefit: {
      en: "Said 3 times on each of Safa and Marwah. Between each repetition the pilgrim makes personal dua. This was the complete practice of the Prophet on Safa and Marwah during Sa'i.",
      fr: "Dit 3 fois sur chacun de Safa et Marwah. Entre chaque répétition le pèlerin fait une dua personnelle.",
      de: "3-mal auf jedem der Berge Safa und Marwah gesagt. Zwischen jeder Wiederholung macht der Pilger persönliche Dua." },
    source: ["Sahih Muslim"] },

  { id: 384, catId: "hajj", type: "dua", order: 6,
    title: { en: "Dua on the Day of Arafah – the best dua", fr: "Invocation le Jour d'Arafah – la meilleure invocation", de: "Dua am Tag von Arafah – die beste Dua" },
    arabic: "لَا إِلَـٰهَ إِلَّا اللَّهُ، وَحْدَهُ لَا شَرِيْكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ",
    transliteration: "Laa ilaaha illallaah, wahdahu laa syariika lah, lahul mulku wa lahul hamdu, wa huwa alaa kulli syai-in qodiir.",
    translation: {
      en: "There is no deity worthy of worship except Allah, alone without partner, to Him belongs the dominion and all praise, and He is over all things capable.",
      fr: "Il n'y a pas de divinité digne d'adoration sauf Allah, seul sans associé, à Lui le règne et toute louange, Il est sur toute chose Puissant.",
      de: "Es gibt keine Gottheit außer Allah allein ohne Partner Ihm gehört die Herrschaft und aller Lob und Er ist über alle Dinge mächtig." },
    benefit: {
      en: "The Prophet said: The best dua is the dua of the Day of Arafah. And the best of what I and the Prophets before me have said is: La ilaha illallah wahdahu la sharika lah... The Day of Arafah is the peak of Hajj – Allah frees the most people from Hell on this day.",
      fr: "Le Prophète a dit : La meilleure dua est la dua du Jour d'Arafah. Et le meilleur de ce que moi et les Prophètes avant moi ont dit est : La ilaha illallah... Le Jour d'Arafah est le sommet du Hajj.",
      de: "Der Prophet sagte: Die beste Dua ist die Dua des Tages von Arafah. Und das Beste was ich und die Propheten vor mir gesagt haben ist: La ilaha illallah... Der Tag von Arafah ist der Höhepunkt des Hadsch." },
    source: ["At-Tirmidhi", "Hasan", "Al-Albani"] },

  { id: 385, catId: "hajj", type: "info", order: 7,
    title: { en: "Dhikr at Mash'ar Al-Haram (Muzdalifah)", fr: "Dhikr à Mash'ar Al-Haram (Muzdalifah)", de: "Dhikr bei Mash'ar Al-Haram (Muzdalifah)" },
    content: {
      en: "The Prophet rode his she-camel Al-Qaswa until he reached Mash'ar Al-Haram (in Muzdalifah). He then faced the qibla, supplicated to Allah, made takbir, tahlil and recited the declaration of tawhid. He kept supplicating until the dawn broke, then departed before sunrise.",
      fr: "Le Prophète chevaucha sa chamelle Al-Qaswa jusqu'à Mash'ar Al-Haram (à Muzdalifah). Il fit face à la qibla, supplia Allah, fit takbir, tahlil et récita la déclaration de tawhid. Il continua à supplier jusqu'à l'aube puis repartit avant le lever du soleil.",
      de: "Der Prophet ritt auf seiner Kamelstute Al-Qaswa bis zu Mash'ar Al-Haram in Muzdalifa. Er wandte sich zur Qibla flehte zu Allah machte Takbir Tahlil und rezitierte die Tauhid-Erklärung. Er betete weiter bis die Morgendämmerung anbrach und brach dann vor Sonnenaufgang auf." },
    source: ["Sahih Muslim"] },

  { id: 386, catId: "hajj", type: "info", order: 8,
    title: { en: "Say Takbir at each stone thrown at Jamarat", fr: "Dire Takbir à chaque pierre lancée à Jamarat", de: "Takbir bei jedem Steinwurf bei Jamarat sagen" },
    content: {
