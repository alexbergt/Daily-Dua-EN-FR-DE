      fr: "O Allah, je cherche refuge auprès de Toi contre un mauvais voisin, contre une épouse qui me fait vieillir prématurément, contre un enfant qui devient un maître sur moi, contre une richesse qui devient un châtiment, et contre un ami traître dont l'oeil me surveille et le coeur m'observe – s'il voit du bien il l'enterre, s'il voit du mal il le propage.",
      de: "O Allah, ich suche Zuflucht bei Dir vor einem schlechten Nachbarn, vor einer Ehefrau die mich vorzeitig altern lässt, vor einem Kind das mich beherrscht, vor einem Vermögen das mir zur Strafe wird, und vor einem hinterlistigen Freund dessen Auge mich beobachtet und Herz mich überwacht – sieht er Gutes verbirgt er es, sieht er Schlechtes verbreitet er es." },
    source: ["At-Tabarani", "Authenticated"] },

  { id: 287, catId: "evil", type: "dua", order: 22,
    title: { en: "Refuge from a bad day, night, hour, companion and neighbour", fr: "Refuge contre un mauvais jour, nuit, heure, compagnon et voisin", de: "Zuflucht vor einem schlechten Tag, Nacht, Stunde, Gefährten und Nachbarn" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ يَوْمِ السُّوءِ، وَمِنْ لَيْلَةِ السُّوءِ، وَمِنْ سَاعَةِ السُّوءِ، وَمِنْ صَاحِبِ السُّوءِ، وَمِنْ جَارِ السُّوءِ فِي دَارِ الْمُقَامَةِ",
    transliteration: "Allaahumma innii a-uudzu bika min yaumis-suu, wa min lailatis-suu, wa min saa-atis-suu, wa min shoohibis-suu, wa min jaaris-suu-i fii daaril muqoomah.",
    translation: {
      en: "O Allah, I seek refuge in You from a bad day, a bad night, a bad hour, a bad companion, and a bad neighbour in the permanent dwelling.",
      fr: "O Allah, je cherche refuge auprès de Toi contre un mauvais jour, une mauvaise nuit, une mauvaise heure, un mauvais compagnon et un mauvais voisin dans le lieu de résidence permanent.",
      de: "O Allah, ich suche Zuflucht bei Dir vor einem schlechten Tag, einer schlechten Nacht, einer schlechten Stunde, einem schlechten Gefährten und einem schlechten Nachbarn an meinem dauerhaften Wohnort." },
    benefit: {
      en: "The phrase permanent dwelling distinguishes from temporary neighbours in travel or short stays. The permanent neighbour affects your daily life most.",
      fr: "L'expression demeure permanente distingue des voisins temporaires en voyage. Le voisin permanent affecte le plus votre vie quotidienne.",
      de: "Der Begriff dauerhafter Wohnort unterscheidet von vorübergehenden Nachbarn auf Reisen. Der permanente Nachbar beeinflusst das tägliche Leben am meisten." },
    source: ["At-Tabarani", "Authenticated"] },

  { id: 288, catId: "evil", type: "dua", order: 23,
    title: { en: "Refuge from a bad permanent neighbour", fr: "Refuge contre un mauvais voisin permanent", de: "Zuflucht vor einem schlechten dauerhaften Nachbarn" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ جَارِ السُّوءِ فِي دَارِ الْمُقَامَةِ، فَإِنَّ جَارَ الْبَادِيَةِ يَتَحَوَّلُ",
    transliteration: "Allaahumma innii a-uudzu bika min jaaris-suu-i fii daaril-muqoomah, fa-inna jaarol baadiyati yatahawwal.",
    translation: {
      en: "O Allah, I seek refuge in You from a bad neighbour in the permanent dwelling, for the nomadic neighbour moves on.",
      fr: "O Allah, je cherche refuge auprès de Toi contre un mauvais voisin dans la demeure permanente, car le voisin nomade s'en va.",
      de: "O Allah, ich suche Zuflucht bei Dir vor einem schlechten Nachbarn am dauerhaften Wohnort, denn der nomadische Nachbar zieht weiter." },
    source: ["Ibn Hibban", "Authenticated"] },

  { id: 289, catId: "evil", type: "dua", order: 24,
    title: { en: "Refuge from a bad neighbour – worldly neighbours change", fr: "Refuge contre un mauvais voisin – les voisins mondains changent", de: "Zuflucht vor schlechtem Nachbarn – weltliche Nachbarn wechseln" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ جَارِ السُّوءِ فِي دَارِ الْمُقَامِ، فَإِنَّ جَارَ الدُّنْيَا يَتَحَوَّلُ",
    transliteration: "Allaahumma innii a-uudzu bika min jaaris-suu-i fii daaril-muqoom, fa-inna jaarod-dunyaa yatahawwal.",
    translation: {
      en: "O Allah, I seek refuge in You from a bad neighbour in the permanent dwelling, for the neighbour of this world moves on.",
      fr: "O Allah, je cherche refuge auprès de Toi contre un mauvais voisin dans la demeure permanente, car le voisin de ce monde change.",
      de: "O Allah, ich suche Zuflucht bei Dir vor einem schlechten Nachbarn am Wohnort, denn die Nachbarn dieser Welt wechseln." },
    benefit: {
      en: "A slight variation of entry 23. Both emphasize that the real danger is the permanent neighbour – the one you cannot easily escape from. The neighbour of the Hereafter (in the grave and in Paradise) cannot be changed.",
      fr: "Une légère variation de l'entrée 23. Les deux soulignent que le vrai danger est le voisin permanent. Le voisin de l'au-delà ne peut pas être changé.",
      de: "Eine leichte Variation von Eintrag 23. Beide betonen dass der echte Nachbar der dauerhafte ist – dem man nicht leicht entkommen kann." },
    source: ["An-Nasai", "Authenticated"] },

  { id: 290, catId: "evil", type: "dua", order: 25,
    title: { en: "Refuge from hunger and treachery", fr: "Refuge contre la faim et la trahison", de: "Zuflucht vor Hunger und Verrat" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْجُوعِ، فَإِنَّهُ بِئْسَ الضَّجِيعُ، وَأَعُوذُ بِكَ مِنَ الْخِيَانَةِ، فَإِنَّهَا بِئْسَتِ الْبِطَانَةُ",
    transliteration: "Allaahumma innii a-uudzu bika minal juu-i, fa-innahu bi-sadh-dhojii-u, wa a-uudzu bika minal khiyaanati, fa-innahaa bi-satil bithoonah.",
    translation: {
      en: "O Allah, I seek refuge in You from hunger, for it is a terrible bedfellow, and I seek refuge in You from treachery, for it is a terrible inner companion.",
      fr: "O Allah, je cherche refuge auprès de Toi contre la faim, car c'est un terrible compagnon de lit, et je cherche refuge contre la trahison, car c'est un terrible compagnon intérieur.",
      de: "O Allah, ich suche Zuflucht bei Dir vor Hunger, denn er ist ein schrecklicher Begleiter, und ich suche Zuflucht vor Verrat, denn er ist ein äußerst schlechter innerer Gefährte." },
    benefit: {
      en: "Hunger weakens the body and Shaytan uses physical weakness. Treachery destroys trust and relationships. Both are internal enemies – one of the body, one of character.",
      fr: "La faim affaiblit le corps et Shaytan utilise la faiblesse physique. La trahison détruit la confiance. Les deux sont des ennemis internes.",
      de: "Hunger schwächt den Körper und Shaytan nutzt körperliche Schwäche. Verrat zerstört Vertrauen. Beide sind innere Feinde – einer des Körpers, einer des Charakters." },
    source: ["Abu Dawud", "Authenticated"] },

  { id: 291, catId: "evil", type: "dua", order: 26,
    title: { en: "Allah is sufficient for us – the best Disposer of affairs (Quran 3:173)", fr: "Allah nous suffit – le meilleur Garant (Coran 3:173)", de: "Allah genuegt uns – der beste Verwalter (Quran 3:173)" },
    arabic: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ، عَلَى اللَّهِ تَوَكَّلْنَا",
    transliteration: "Hasbunallaahu wa ni-mal wakiil, alal-laahi tawakkalnaa.",
    translation: {
      en: "Allah is sufficient for us, and He is the best Disposer of affairs. In Allah we place our trust.",
      fr: "Allah nous suffit et Il est le meilleur Garant. En Allah nous plaçons notre confiance.",
      de: "Allah genuegt uns und Er ist der beste Verwalter der Angelegenheiten. Auf Allah vertrauen wir." },
    benefit: {
      en: "Said by Ibrahim when thrown into the fire – Allah made it cool. Said by the Prophet and companions when warned of a great army gathering against them. Allah then turned that army away. Say it when facing any overwhelming threat.",
      fr: "Dit par Ibrahim quand on le jeta dans le feu – Allah le rendit frais. Dit par le Prophète quand il fut averti d'une grande armée. Dire face à toute menace écrasante.",
      de: "Von Ibrahim gesagt als er ins Feuer geworfen wurde – Allah machte es kühl. Vom Propheten gesagt als er vor einer großen Armee gewarnt wurde. Bei jeder überwältigenden Bedrohung sprechen." },
    source: ["Quran 3:173", "Sahih Bukhari"] },

  { id: 292, catId: "evil", type: "dua", order: 27,
    title: { en: "Refuge from poverty, disbelief, sin, hypocrisy and showing off", fr: "Refuge contre pauvreté, incroyance, péché, hypocrisie et ostentation", de: "Zuflucht vor Armut, Unglauben, Sünde, Heuchelei und Prahlerei" },
    arabic: "اَللَّهُمَّ إِنِّى أَعُوْذُ بِكَ مِنَ الْفَقْرِ، وَالْكُفْرِ، وَالْفُسُوْقِ، وَالشِّقَاقِ، وَالنِّفَاقِ، وَالسُّمْعَةِ، وَالرِّيَاءِ",
    transliteration: "Allaahumma innii a-uudzu bika minal faqri, wal kufri, wal fusuuqi, wasy-syiqooqi, wan-nifaaqi, was-sum-ati, war-riyaa-i.",
    translation: {
      en: "O Allah, I seek refuge in You from poverty, disbelief, sinfulness, discord, hypocrisy, seeking fame, and showing off.",
      fr: "O Allah, je cherche refuge auprès de Toi contre la pauvreté, l'incroyance, la débauche, la discorde, l'hypocrisie, la recherche de la renommée et l'ostentation.",
      de: "O Allah, ich suche Zuflucht bei Dir vor Armut, Unglauben, Sündhaftigkeit, Zwietracht, Heuchelei, Ruhmssucht und Prahlerei." },
    benefit: {
      en: "Seven spiritual diseases in one dua. Riya (showing off) and sum-a (doing good to be heard of) are forms of hidden shirk that invalidate deeds. This dua asks protection from both.",
      fr: "Sept maladies spirituelles en un dua. Riya et sum-a sont des formes de shirk caché qui invalident les actes. Ce dua demande protection contre les deux.",
      de: "Sieben spirituelle Krankheiten in einem Dua. Riya und Sum-a sind Formen des verborgenen Shirk die Taten ungültig machen. Dieses Dua bittet um Schutz vor beiden." },
    source: ["Abu Dawud", "Authenticated"] },

  { id: 293, catId: "evil", type: "dua", order: 28,
    title: { en: "Refuge from disbelief, poverty and grave punishment", fr: "Refuge contre l'incroyance, la pauvreté et le châtiment de la tombe", de: "Zuflucht vor Unglauben, Armut und Grabstrafe" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَـٰهَ إِلَّا أَنْتَ",
    transliteration: "Allaahumma innii a-uudzu bika minal kufri wal faqri, allaahumma innii a-uudzu bika min adzaabil qobri, laa ilaaha illaa anta.",
    translation: {
      en: "O Allah, I seek refuge in You from disbelief and poverty. O Allah, I seek refuge in You from the punishment of the grave. There is no deity except You.",
      fr: "O Allah, je cherche refuge auprès de Toi contre l'incroyance et la pauvreté. O Allah, je cherche refuge contre le châtiment de la tombe. Il n'y a pas de divinité sauf Toi.",
      de: "O Allah, ich suche Zuflucht bei Dir vor Unglauben und Armut. O Allah, ich suche Zuflucht vor der Strafe des Grabes. Es gibt keinen Gott außer Dir." },
    source: ["Abu Dawud", "Authenticated"] },

  { id: 294, catId: "evil", type: "dua", order: 29,
    title: { en: "Refuge from vitiligo, madness, leprosy and terrible diseases", fr: "Refuge contre le vitiligo, la folie, la lèpre et les maladies terribles", de: "Zuflucht vor Vitiligo, Wahnsinn, Lepra und schrecklichen Krankheiten" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوْذُ بِكَ مِنَ الْبَرَصِ، وَالْجُنُوْنِ، وَالْجُذَامِ، وَمِنْ سَيِّئِ الْأَسْقَامِ",
    transliteration: "Allaahumma innii a-uudzu bika minal baroshi, wal junuuni, wal judzaami, wa min sayyi-il asqoom.",
    translation: {
      en: "O Allah, I seek refuge in You from vitiligo, madness, leprosy, and from terrible diseases.",
      fr: "O Allah, je cherche refuge auprès de Toi contre le vitiligo, la folie, la lèpre et les maladies terribles.",
      de: "O Allah, ich suche Zuflucht bei Dir vor Vitiligo, Wahnsinn, Lepra und schrecklichen Krankheiten." },
    benefit: {
      en: "The Prophet specifically mentioned these four because in his time they were the most feared and socially isolating conditions. Today the dua extends to any severe disease – physical or mental.",
      fr: "Le Prophète a mentionné ces quatre maladies car elles étaient les plus redoutées et les plus isolantes socialement. Aujourd'hui le dua s'étend à toute maladie grave.",
      de: "Der Prophet nannte diese vier weil sie in seiner Zeit die am meisten gefürchteten und sozial isolierenden Zustände waren. Heute erstreckt sich das Dua auf jede schwere Krankheit." },
    source: ["Abu Dawud", "An-Nasai", "Authenticated"] },

  { id: 295, catId: "evil", type: "dua", order: 30,
    title: { en: "Refuge from poverty, scarcity, humiliation and injustice", fr: "Refuge contre la pauvreté, le manque, l'humiliation et l'injustice", de: "Zuflucht vor Armut, Mangel, Erniedrigung und Ungerechtigkeit" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْفَقْرِ، وَالْقِلَّةِ، وَالذِّلَّةِ، وَأَعُوْذُ بِكَ مِنْ أَنْ أَظْلِمَ أَوْ أُظْلَمَ",
    transliteration: "Allaahumma innii a-uudzu bika minal faqri, wal qillati, wadz-dzillati, wa a-uudzu bika min an azhlima au uzhlam.",
    translation: {
      en: "O Allah, I seek refuge in You from poverty, scarcity, and humiliation, and I seek refuge in You from wronging others or being wronged.",
      fr: "O Allah, je cherche refuge auprès de Toi contre la pauvreté, le manque et l'humiliation, et je cherche refuge contre le fait d'oppresser ou d'être oppressé.",
      de: "O Allah, ich suche Zuflucht bei Dir vor Armut, Mangel und Erniedrigung, und ich suche Zuflucht davor anderen Unrecht zu tun oder selbst Unrecht zu erleiden." },
    source: ["Abu Dawud", "An-Nasai", "Authenticated"] },

  { id: 296, catId: "evil", type: "dua", order: 31,
    title: { en: "Refuge from Fire, grave, wealth, poverty and Dajjal", fr: "Refuge contre le Feu, la tombe, la richesse, la pauvreté et le Dajjal", de: "Zuflucht vor Feuer, Grab, Reichtum, Armut und Dajjal" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنْ فِتْنَةِ النَّارِ وَمِنْ عَذَابِ النَّارِ، وَأَعُوْذُ بِكَ مِنْ فِتْنَةِ الْقَبْرِ، وَأَعُوْذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَأَعُوْذُ بِكَ مِنْ فِتْنَةِ الْغِنَى، وَأَعُوْذُ بِكَ مِنْ فِتْنَةِ الْفَقْرِ، وَأَعُوْذُ بِكَ مِنْ فِتْنَةِ الْمَسِيْحِ الدَّجَّالِ",
    transliteration: "Allaahumma innii a-uudzu bika min fitnatinnaari wa min adzaabinnaari, wa a-uudzu bika min fitnatil qobri, wa a-uudzu bika min adzaabil qobri, wa a-uudzu bika min fitnatil ghinaa, wa a-uudzu bika min fitnatil faqri, wa a-uudzu bika min fitnatil masiihid-dajjaal.",
    translation: {
      en: "O Allah, I seek refuge in You from the trial of the Fire and the punishment of the Fire. I seek refuge in You from the trial of the grave. I seek refuge in You from the punishment of the grave. I seek refuge in You from the trial of wealth. I seek refuge in You from the trial of poverty. And I seek refuge in You from the trial of Al-Masih Ad-Dajjal.",
      fr: "O Allah, je cherche refuge auprès de Toi contre l'épreuve du Feu et le châtiment du Feu. Je cherche refuge contre l'épreuve de la tombe. Je cherche refuge contre le châtiment de la tombe. Je cherche refuge contre l'épreuve de la richesse. Je cherche refuge contre l'épreuve de la pauvreté. Et je cherche refuge contre l'épreuve d'Al-Masih Ad-Dajjal.",
      de: "O Allah, ich suche Zuflucht bei Dir vor der Prüfung des Feuers und der Strafe des Feuers. Ich suche Zuflucht vor der Prüfung des Grabes. Ich suche Zuflucht vor der Strafe des Grabes. Ich suche Zuflucht vor der Prüfung des Reichtums. Ich suche Zuflucht vor der Prüfung der Armut. Und ich suche Zuflucht vor der Prüfung von Al-Masih Ad-Dajjal." },
    benefit: {
      en: "A comprehensive dua covering the six greatest trials a believer can face: Fire trial and punishment, grave trial and punishment, the trial of wealth, the trial of poverty, and the greatest trial of all – the Dajjal. Say it after every Tashahhud in prayer.",
      fr: "Un dua complet couvrant les six plus grandes épreuves: le Feu, la tombe, la richesse, la pauvreté et le Dajjal – la plus grande épreuve. Dire après chaque Tashahhud.",
      de: "Ein umfassendes Dua das die sechs größten Prüfungen abdeckt: Feuer, Grab, Reichtum, Armut und den Dajjal – die größte Prüfung aller. Nach jedem Tashahhud im Gebet sprechen." },
    source: ["Sahih Bukhari"] },

  // ── CATEGORY: GOOD & PROTECTION FROM EVIL ──
  { id: 297, catId: "good_evil", type: "dua", order: 1,
    title: { en: "Good in this world and the Hereafter (Quran 2:201)", fr: "Le bien ici-bas et dans l'au-delà (Coran 2:201)", de: "Gutes diesseits und jenseits (Quran 2:201)" },
    arabic: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً، وَفِي الْآخِرَةِ حَسَنَةً، وَقِنَا عَذَابَ النَّارِ",
    transliteration: "Robbanaa aatinaa fid-dunyaa hasanah, wa fil aakhiroti hasanah, wa qinaa adzaaban-naar.",
    translation: {
      en: "Our Lord, grant us good in this world and good in the Hereafter and protect us from the punishment of the Fire.",
      fr: "Seigneur, accorde-nous le bien ici-bas et le bien dans l'au-delà et protège-nous du châtiment du Feu.",
      de: "Unser Herr, gib uns Gutes in dieser Welt und Gutes im Jenseits und bewahre uns vor der Strafe des Feuers." },
    benefit: {
      en: "The most frequently recited dua of the Prophet. It covers everything: good in this life, good in the next, and protection from Hell. Three requests encompassing the entire deen.",
      fr: "L'invocation la plus fréquemment récitée par le Prophète. Elle couvre tout : le bien dans cette vie, le bien dans la prochaine et la protection de l'Enfer.",
      de: "Das am häufigsten rezitierte Dua des Propheten. Es deckt alles ab: Gutes in diesem Leben, Gutes im nächsten und Schutz vor der Hölle." },
    source: ["Quran 2:201", "Sahih Bukhari", "Sahih Muslim"] },

  { id: 298, catId: "good_evil", type: "dua", order: 2,
    title: { en: "Make the end of all our affairs good", fr: "Rends bonne la fin de toutes nos affaires", de: "Mache das Ende all unserer Angelegenheiten gut" },
    arabic: "اَللَّهمَّ أَحْسِنْ عَاقِبَتَنَا فِي الأُمُورِ كُلِّهَا، وَأَجِرْنَا مِنْ خِزْيِ الدُّنْيَا وَعَذَابِ الآخِرَةِ",
    transliteration: "Allaahumma ahsin aaqibatanaa fil umuuri kullihaa, wa ajirnaa min khizyid-dunyaa wa adzaabil aakhiroh.",
    translation: {
      en: "O Allah, make the end of all our affairs good and protect us from disgrace in this world and punishment in the Hereafter.",
      fr: "Ô Allah, rends bonne la fin de toutes nos affaires et protège-nous de l'humiliation ici-bas et du châtiment dans l'au-delà.",
      de: "O Allah, mache das Ende all unserer Angelegenheiten gut und bewahre uns vor der Schande im Diesseits und der Strafe im Jenseits." },
    benefit: {
      en: "A good ending (husn al-khatima) is the ultimate goal. This dua asks that every single affair – small and large, personal and worldly – ends well.",
      fr: "Une bonne fin est le but ultime. Ce dua demande que chaque affaire – petite et grande – se termine bien.",
      de: "Ein gutes Ende ist das oberste Ziel. Dieses Dua bittet dass jede einzelne Angelegenheit – groß und klein – gut endet." },
    source: ["Ahmad", "Ibn Hibban", "Authenticated"] },

  { id: 299, catId: "good_evil", type: "info", order: 3,
    title: { en: "When hearing a rooster – ask for Allah's bounty", fr: "En entendant un coq – demander la grâce d'Allah", de: "Beim Hören eines Hahns – um Allahs Gunst bitten" },
    content: {
      en: "The Prophet said: When you hear the rooster crowing, ask Allah for His bounty for it has seen an angel. When you hear a donkey braying, seek refuge in Allah from Shaytan for it has seen a devil. (Sahih Bukhari, Sahih Muslim)",
      fr: "Le Prophète a dit : Quand vous entendez le chant du coq, demandez à Allah Sa grâce car il a vu un ange. Quand vous entendez un âne braire, cherchez refuge auprès d'Allah contre Shaytan car il a vu un diable.",
      de: "Der Prophet sagte: Wenn ihr den Hahn krähen hört, bittet Allah um Seine Gunst denn er hat einen Engel gesehen. Wenn ihr einen Esel schreien hört sucht Zuflucht bei Allah vor Shaytan denn er hat einen Teufel gesehen." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 300, catId: "good_evil", type: "info", order: 4,
    title: { en: "When hearing dogs barking or donkeys braying – seek refuge", fr: "En entendant les chiens ou les ânes – chercher refuge", de: "Beim Hören von Hunden oder Eseln – Zuflucht suchen" },
    content: {
      en: "The Prophet said: When you hear dogs barking or donkeys braying at night, seek refuge in Allah from them for they see what you do not see. (Abu Dawud, Authenticated)",
      fr: "Le Prophète a dit : Quand vous entendez la nuit des chiens aboyer ou des ânes braire, cherchez refuge auprès d'Allah car ils voient ce que vous ne voyez pas.",
      de: "Der Prophet sagte: Wenn ihr nachts Hunde bellen oder Esel schreien hört, sucht Zuflucht bei Allah vor ihnen denn sie sehen was ihr nicht seht." },
    source: ["Abu Dawud", "Authenticated"] },

  { id: 301, catId: "good_evil", type: "dua", order: 5,
    title: { en: "Pour patience upon us, make our steps firm, grant us victory (Quran 2:250)", fr: "Déverse sur nous la patience, affermis nos pas, accorde-nous la victoire (Coran 2:250)", de: "Schuette Geduld ueber uns, festige unsere Schritte, gib uns Sieg (Quran 2:250)" },
    arabic: "رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",
    transliteration: "Robbanaa afrigh alainaa shobron, wa tsabbit aqdaamanaa, wan-shurnaa alal qoumil kaafiriin.",
    translation: {
      en: "Our Lord, pour upon us patience, make our steps firm, and grant us victory over the disbelieving people.",
      fr: "Seigneur, déverse sur nous la patience, affermis nos pas et accorde-nous la victoire sur les mécréants.",
      de: "Unser Herr, gieße Geduld über uns aus, festige unsere Schritte und hilf uns gegen das ungläubige Volk." },
    benefit: {
      en: "The dua of Talut's army before facing Goliath. They were few against many. Allah gave them victory. Say it when outnumbered, facing overwhelming odds or needing perseverance.",
      fr: "L'invocation de l'armée de Talut avant d'affronter Goliath. Ils étaient peu nombreux. Allah leur accorda la victoire. Dire quand on est dépassé en nombre.",
      de: "Das Dua der Armee von Talut vor dem Kampf gegen Goliath. Sie waren wenige gegen viele. Allah gab ihnen Sieg. Sagen wenn man zahlenmäßig unterlegen ist." },
    source: ["Quran 2:250"] },

  { id: 302, catId: "good_evil", type: "dua", order: 6,
    title: { en: "Do not let our hearts deviate after guidance (Quran 3:8)", fr: "Ne laisse pas nos cœurs dévier après la guidée (Coran 3:8)", de: "Lass unsere Herzen nicht abweichen nach der Rechtleitung (Quran 3:8)" },
    arabic: "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ",
    transliteration: "Robbanaa laa tuzigh quluubanaa ba-da idz hadaitanaa, wa hab lanaa mil-ladunka rohmah, innaka antal wahhaab.",
    translation: {
      en: "Our Lord, do not let our hearts deviate after You have guided us and grant us mercy from Yourself. Indeed, You are the Bestower.",
      fr: "Seigneur, ne fais pas dévier nos cœurs après nous avoir guidés et accorde-nous Ta miséricorde. Tu es le Donateur.",
      de: "Unser Herr, lasse unsere Herzen nicht abweichen nachdem Du uns rechtgeleitet hast, und schenke uns Barmherzigkeit von Dir. Du bist der Schenkende." },
    benefit: {
      en: "Those firm in knowledge fear misguidance most. This is the dua of deep believers who know that guidance is Allah's gift and can be taken away. Say it constantly to stay on the straight path.",
      fr: "Ceux qui sont fermes dans la connaissance craignent le plus l'égarement. C'est le dua des croyants profonds qui savent que la guidée est un don d'Allah.",
      de: "Jene mit tiefem Wissen fürchten die Irrefuhrung am meisten. Dies ist das Dua tiefer Gläubiger die wissen dass Rechtleitung Allahs Gabe ist und weggenommen werden kann." },
    source: ["Quran 3:8"] },

  { id: 303, catId: "good_evil", type: "dua", order: 7,
    title: { en: "Good deeds, avoiding evil, love of the poor – take me before the trial", fr: "Bonnes actions, éviter le mal, amour des pauvres – prends-moi avant l'épreuve", de: "Gute Taten, Böses meiden, Liebe der Armen – nimm mich vor der Prüfung" },
    arabic: "اَللَّهُمَّ إِنِّى أَسْأَلُكَ فِعْلَ الْخَيْرَاتِ، وَتَرْكَ الْمُنْكَرَاتِ، وَحُبَّ الْمَسَاكِينِ، وَإِذَا أَرَدْتَ بِعِبَادِكَ فِتْنَةً، فَاقْبِضْنِى إِلَيْكَ غَيْرَ مَفْتُونٍ",
    transliteration: "Allaahumma innii as-aluka fi-lal khoiroot, wa tarkal munkaroot, wa hubbal masaakiin, wa idzaa arodta bi-ibaadika fitnatan faqbidnii ilaika ghaira maftuun.",
    translation: {
      en: "O Allah, I ask You for doing good deeds, avoiding evil deeds and loving the poor. And if You intend a trial for Your servants, then take me to You without being tested.",
      fr: "Ô Allah, je Te demande de faire le bien, d'éviter le mal et d'aimer les pauvres. Et si Tu veux éprouver Tes serviteurs, fais-moi mourir sans être éprouvé.",
      de: "O Allah, ich bitte Dich um gute Taten, das Meiden von schlechten Taten und die Liebe zu den Armen. Und wenn Du Deine Diener einer Prüfung aussetzen willst, dann nimm mich zu Dir ohne dass ich davon betroffen bin." },
    benefit: {
      en: "The Prophet taught this dua to Muadh ibn Jabal and told him to say it after every prayer. The request to be taken before a great trial shows profound wisdom – better to die in faith than to be corrupted by fitna.",
      fr: "Le Prophète enseigna ce dua à Muadh ibn Jabal et lui dit de le dire après chaque prière. La demande d'être pris avant une grande épreuve montre une sagesse profonde.",
      de: "Der Prophet lehrte dieses Dua Muadh ibn Jabal und sagte ihm es nach jedem Gebet zu sprechen. Die Bitte vor einer großen Prüfung genommen zu werden zeigt tiefe Weisheit." },
    source: ["At-Tirmidhi", "Authenticated"] },

  { id: 304, catId: "good_evil", type: "dua", order: 8,
    title: { en: "Good deeds, avoiding evil, forgiveness – take me before the people's trial", fr: "Bonnes actions, éviter le mal, pardon – prends-moi avant l'épreuve du peuple", de: "Gute Taten, Böses meiden, Vergebung – nimm mich vor der Völkerprüfung" },
    arabic: "اَللَّهُمَّ إِنِّى أَسْأَلُكَ فِعْلَ الْخَيْرَاتِ، وَتَرْكَ الْمُنْكَرَاتِ، وَحُبَّ الْمَسَاكِينِ، وَأَنْ تَغْفِرَ لِى وَتَرْحَمَنِى، وَإِذَا أَرَدْتَ فِتْنَةَ قَوْمٍ فَتَوَفَّنِى غَيْرَ مَفْتُونٍ",
    transliteration: "Allaahumma innii as-aluka fi-lal khoiroot, wa tarkal munkaroot, wa hubbal masaakiin, wa an taghfiralii wa tarhamanii, wa idzaa arodta fitnata qoumin fatawaffanii ghaira maftuun.",
    translation: {
      en: "O Allah, I ask You for doing good deeds, avoiding evil deeds and loving the poor. Forgive me and have mercy on me. And if You intend a trial for a people, then take me to You without being tested.",
      fr: "Ô Allah, je Te demande de faire le bien, d'éviter le mal et d'aimer les pauvres. Pardonne-moi et fais-moi miséricorde. Et si Tu veux éprouver un peuple, fais-moi mourir sans être éprouvé.",
      de: "O Allah, ich bitte Dich um gute Taten, das Meiden von schlechten Taten und die Liebe zu den Armen. Vergib mir und erbarme Dich meiner. Und wenn Du ein Volk prüfst, dann nimm mich zu Dir ohne dass ich davon betroffen bin." },
    benefit: {
      en: "A longer version of entry 7, adding forgiveness and mercy. Two versions of this dua exist in the authentic narrations – both are valid to say after prayer.",
      fr: "Une version plus longue de l'entrée 7, ajoutant pardon et miséricorde. Deux versions de ce dua existent dans les narrations authentiques.",
      de: "Eine längere Version von Eintrag 7 mit zusätzlicher Bitte um Vergebung und Barmherzigkeit. Zwei Versionen dieses Duas existieren in den authentischen Überlieferungen." },
    source: ["At-Tirmidhi", "Authenticated"] },

  { id: 305, catId: "good_evil", type: "dua", order: 9,
    title: { en: "All good and all refuge – the Prophet's comprehensive dua", fr: "Tout le bien et tout refuge – le dua complet du Prophète", de: "Alles Gute und Zuflucht – das umfassende Dua des Propheten" },
    arabic: "اَللَّهُمَّ إِنِّي أَسْأَلُكَ مِنَ الْخَيْرِ كُلِّهِ عَاجِلِهِ وَآجِلِهِ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ، وَأَعُوذُ بِكَ مِنَ الشَّرِّ كُلِّهِ عَاجِلِهِ وَآجِلِهِ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ، اَللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ عَبْدُكَ وَنَبِيُّكَ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا عَاذَ بِهِ عَبْدُكَ وَنَبِيُّكَ، اَللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ، وَأَعُوذُ بِكَ مِنَ النَّارِ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ، وَأَسْأَلُكَ أَنْ تَجْعَلَ كُلَّ قَضَاءٍ قَضَيْتَهُ لِي خَيْرًا",
    transliteration: "Allaahumma innii as-aluka minal khoiri kullihi aajilihi wa aajilihi, maa alimtu minhu wa maa lam a-lam, wa a-uudzu bika minasy-syarri kullihi aajilihi wa aajilihi, maa alimtu minhu wa maa lam a-lam. Allaahumma innii as-aluka min khoiri maa sa-alaka abduka wa nabiyyuka, wa a-uudzu bika min syarri maa aadza bihi abduka wa nabiyyuka. Allaahumma innii as-alukal jannata wa maa qorroba ilaihaa min qoulin au amal, wa a-uudzu bika minan-naari wa maa qorroba ilaihaa min qoulin au amal, wa as-aluka an taj-ala kulla qodhoo-in qodhoitahu lii khoiron.",
    translation: {
      en: "O Allah, I ask You for all good, immediate and delayed, what I know of it and what I do not know. And I seek refuge in You from all evil, immediate and delayed, what I know and what I do not know. O Allah, I ask You for the good that Your servant and Prophet asked You for, and I seek refuge from the evil from which Your servant and Prophet sought refuge. O Allah, I ask You for Paradise and everything that brings one closer to it in word or deed, and I seek refuge from the Fire and everything that brings one closer to it. And I ask You to make every decree You decree for me good.",
      fr: "Ô Allah, je Te demande tout le bien, immédiat et futur, que je connais et que je ne connais pas. Je cherche refuge contre tout le mal, immédiat et futur. Ô Allah, je Te demande le bien que Ton serviteur et Prophète T'ont demandé, et je cherche refuge contre le mal contre lequel ils ont cherché refuge. Je Te demande le Paradis et tout ce qui en rapproche, et je cherche refuge contre le Feu. Et je Te demande de faire que tout décret soit un bien pour moi.",
      de: "O Allah, ich bitte Dich um alles Gute, das unmittelbare und das spätere, das ich kenne und das ich nicht kenne. Ich suche Zuflucht vor allem Schlechten. O Allah, ich bitte Dich um das Gute um das Dein Diener und Prophet Dich baten, und suche Zuflucht vor dem Schlechten. Ich bitte Dich um das Paradies und alles was dorthin näherbringt, und suche Zuflucht vor dem Feuer. Und ich bitte Dich alles was Du für mich bestimmt hast zu etwas Gutem zu machen." },
    benefit: {
      en: "One of the most comprehensive duas ever taught. It asks for ALL good – known and unknown, immediate and future – and seeks refuge from ALL evil. Then it adds the Prophet's own duas and ends with Paradise, protection from Fire, and asking that all decrees be good.",
      fr: "L'un des duas les plus complets jamais enseignés. Il demande tout le bien – connu et inconnu – et cherche refuge contre tout le mal.",
      de: "Eines der umfassendsten Duas überhaupt. Es bittet um ALLES Gute – bekanntes und unbekanntes, unmittelbares und zukünftiges – und sucht Zuflucht vor ALLEM Bösen." },
    source: ["Ibn Majah", "Authenticated"] },

  { id: 306, catId: "good_evil", type: "dua", order: 10,
    title: { en: "Dua of Prophet Nuh – refuge from asking without knowledge (Quran 11:47)", fr: "Invocation du Prophète Nuh – refuge contre demander sans savoir (Coran 11:47)", de: "Dua des Propheten Nuh – Zuflucht vor Bitten ohne Wissen (Quran 11:47)" },
    arabic: "رَبِّ إِنِّي أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ وَإِلَّا تَغْفِرْ لِي وَتَرْحَمْنِي أَكُنْ مِنَ الْخَاسِرِينَ",
    transliteration: "Robbi innii a-uudzu bika an as-alaka maa laisa lii bihi ilmun, wa illaa tagh-fir lii, wa tarhamnii, akun minal khoosiriin.",
    translation: {
      en: "My Lord, I seek refuge in You from asking You for that of which I have no knowledge. And unless You forgive me and have mercy on me, I will be among the losers.",
      fr: "Seigneur, je cherche refuge auprès de Toi contre le fait de Te demander ce dont je n'ai aucune connaissance. Et si Tu ne me pardonnes pas et ne me fais pas miséricorde, je serai parmi les perdants.",
      de: "Mein Herr, ich suche Zuflucht bei Dir davor Dich um etwas zu bitten worüber ich kein Wissen habe. Und wenn Du mir nicht vergibst und Dich meiner nicht erbarmst werde ich zu den Verlierern gehören." },
    benefit: {
      en: "Prophet Nuh said this after Allah told him his son was not among the righteous and would not be saved. He had asked for his son's salvation. A profound lesson: we should not ask Allah for things that go against His wisdom.",
      fr: "Le Prophète Nuh a dit cela après qu'Allah lui a dit que son fils n'était pas parmi les vertueux. Une leçon profonde : nous ne devons pas demander à Allah des choses contraires à Sa sagesse.",
      de: "Prophet Nuh sprach dies nachdem Allah ihm sagte dass sein Sohn nicht zu den Rechtschaffenen gehörte. Eine tiefe Lektion: Wir sollten Allah nicht um Dinge bitten die gegen Seine Weisheit gehen." },
    source: ["Quran 11:47"] },

  { id: 307, catId: "good_evil", type: "dua", order: 11,
    title: { en: "Do not hold us accountable, do not burden us beyond our capacity (Quran 2:286)", fr: "Ne nous tiens pas rigueur, ne nous charge pas au-delà de nos capacités (Coran 2:286)", de: "Halte uns nicht verantwortlich, belaste uns nicht über unsere Kraft (Quran 2:286)" },
    arabic: "رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",
    transliteration: "Robbanaa laa tu-aakhidz-naa in nasiinaa au akh-tho-na, robbanaa wa laa tahmil alainaa ish-ron kamaa hamaltahu alalladziina min qoblinaa, robbanaa wa laa tuhammilnaa maa laa thooqota lanaa bih, wa-fu annaa, wagh-fir lanaa, warhamnaa, anta maulaanaa, fan-shurnaa alal qoumil kaafiriin.",
    translation: {
      en: "Our Lord, do not hold us accountable if we forget or make a mistake. Our Lord, do not place upon us a burden as You placed upon those before us. Our Lord, do not burden us with what we have no strength to bear. Pardon us, forgive us, and have mercy upon us. You are our Protector, so help us against the disbelieving people.",
      fr: "Seigneur, ne nous tiens pas rigueur si nous oublions ou commettons une erreur. Seigneur, ne fais pas peser sur nous un fardeau comme Tu l'as fait peser sur ceux qui nous ont précédés. Seigneur, ne nous charge pas de ce que nous n'avons pas la force de porter. Pardonne-nous, absous-nous et fais-nous miséricorde. Tu es notre Protecteur, accorde-nous la victoire sur le peuple mécréant.",
      de: "Unser Herr, bestrafe uns nicht wenn wir vergessen oder einen Fehler machen. Unser Herr lege uns keine schwere Last auf wie Du sie denen vor uns auferlegt hast. Unser Herr bürde uns nicht auf was wir nicht zu tragen vermögen. Verzeihe uns, vergib uns und erbarme Dich unser. Du bist unser Schutzherr so hilf uns gegen das ungläubige Volk." },
    benefit: {
      en: "The last verse of Surah Al-Baqarah. The Prophet said: Whoever recites the last two verses of Surah Al-Baqarah at night, they will be sufficient for him. It ends with five requests: pardon, forgiveness, mercy, protection and victory.",
      fr: "Le dernier verset de la Sourate Al-Baqara. Le Prophète a dit : Quiconque récite les deux derniers versets de Al-Baqara la nuit, ils lui suffiront.",
      de: "Der letzte Vers der Sure Al-Baqara. Der Prophet sagte: Wer die letzten zwei Verse der Sure Al-Baqara nachts rezitiert dem werden sie ausreichen." },
    source: ["Quran 2:286", "Sahih Bukhari", "Sahih Muslim"] },

  { id: 308, catId: "good_evil", type: "dua", order: 12,
    title: { en: "Make this land secure and keep us from idols – Dua of Ibrahim (Quran 14:35)", fr: "Sécurise cette cité et éloigne-nous des idoles – Invocation d'Ibrahim (Coran 14:35)", de: "Mache dieses Land sicher und halte uns von Götzen fern – Dua Ibrahims (Quran 14:35)" },
    arabic: "رَبِّ اجْعَلْ هَـٰذَا الْبَلَدَ آمِنًا وَاجْنُبْنِي وَبَنِيَّ أَنْ نَعْبُدَ الْأَصْنَامَ",
    transliteration: "Robbij-al haadzal balada aaminaa, wajnubnii wa baniyya an na-budal ash-naam.",
    translation: {
      en: "My Lord, make this land secure and keep me and my children away from worshipping idols.",
      fr: "Seigneur, fais de cette cité un lieu sûr et éloigne-moi, ainsi que mes descendants, de l'adoration des idoles.",
      de: "Mein Herr, mache dieses Land sicher und halte mich und meine Nachkommen davon fern Götzen anzubeten." },
    benefit: {
      en: "The dua of Prophet Ibrahim for Makkah. Shirk was his greatest fear for his family. This dua reminds us that the greatest gift we can ask for our children is to be protected from shirk in all its forms.",
      fr: "L'invocation du Prophète Ibrahim pour La Mecque. Le shirk était sa plus grande crainte pour sa famille. Ce dua nous rappelle que le plus grand cadeau pour nos enfants est la protection contre le shirk.",
      de: "Das Dua des Propheten Ibrahim für Mekka. Shirk war seine größte Angst für seine Familie. Dieses Dua erinnert uns dass das größte Geschenk für unsere Kinder der Schutz vor Shirk ist." },
    source: ["Quran 14:35"] },

  { id: 309, catId: "good_evil", type: "dua", order: 13,
    title: { en: "Unite hearts, guide to peace, remove darkness, bless family", fr: "Unis les coeurs, guide vers la paix, chasse les ténèbres, bénis la famille", de: "Herzen vereinen, zum Frieden leiten, Dunkelheit entfernen, Familie segnen" },
    arabic: "اَللَّهُمَّ أَلِّفْ بَيْنَ قُلُوبِنَا، وَأَصْلِحْ ذَاتَ بَيْنِنَا، وَاهْدِنَا سُبُلَ السَّلاَمِ، وَنَجِّنَا مِنَ الظُّلُمَاتِ إِلَى النُّورِ، وَجَنِّبْنَا الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ، وَبَارِكْ لَنَا فِى أَسْمَاعِنَا، وَأَبْصَارِنَا، وَقُلُوبِنَا، وَأَزْوَاجِنَا، وَذُرِّيَّاتِنَا، وَتُبْ عَلَيْنَا، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ، وَاجْعَلْنَا شَاكِرِينَ لِنِعْمَتِكَ، مُثْنِينَ بِهَا قَابِلِيهَا، وَأَتِمَّهَا عَلَيْنَا",
    transliteration: "Allaahumma allif baina quluubinaa, wa ashlih dzaata baininaa, wahdinaa subulas-salaam, wa najjinaa minazh-zhulumaati ilan-nuur, wa jannibnal fawaahisya maa zhoharo minhaa wa maa bathon, wa baarik lanaa fii asmaa-inaa, wa ab-shoorinaa, wa quluubinaa, wa azwaajinaa, wa dzurriyyaatinaa, wa tub alainaa, innaka antat-tawwaabur-rohiim, waj-alnaa syaakiriina lini-matik, muts-niina bihaa qoobiliihaa, wa atimmahaa alainaa.",
    translation: {
      en: "O Allah, unite our hearts, set right our affairs, guide us to the paths of peace, bring us from darkness into light, keep us from indecencies outward and inward. Bless our hearing, sight, hearts, spouses and offspring. Accept our repentance – You are the Accepter of repentance, the Most Merciful. Make us grateful for Your blessing, praising it, accepting it, and complete it upon us.",
      fr: "Ô Allah, unis nos coeurs, améliore notre situation, guide-nous vers les voies de la paix, fais-nous sortir des ténèbres vers la lumière, éloigne-nous des turpitudes apparentes et cachées. Bénis notre ouïe, notre vue, nos coeurs, nos épouses et nos descendants. Accepte notre repentir – Tu es Celui qui accueille le repentir, le Très Miséricordieux. Fais de nous des reconnaissants pour Tes bienfaits et parachève-les pour nous.",
      de: "O Allah, vereine unsere Herzen, ordne unsere Angelegenheiten, leite uns auf die Wege des Friedens und rette uns aus den Finsternissen ins Licht. Halte uns fern von Schändlichkeiten dem Offenen wie dem Verborgenen. Segne unser Gehör, Augenlicht, Herzen, Ehepartner und Nachkommen. Nimm unsere Reue an – Du bist der Reue-Annehmende, der Barmherzige. Mache uns zu Dankbaren für Deine Gnade und vollende sie an uns." },
    benefit: {
      en: "A remarkably comprehensive dua covering unity, guidance, purification, blessings on the whole family, repentance and gratitude – all in one supplication. A masterpiece of Islamic prayer.",
      fr: "Un dua remarquablement complet couvrant l'unité, la guidance, la purification, les bénédictions sur toute la famille, le repentir et la gratitude – tout en une seule supplication.",
      de: "Ein bemerkenswert umfassendes Dua das Einheit, Rechtleitung, Reinigung, Segen für die ganze Familie, Reue und Dankbarkeit abdeckt – alles in einer Bittrede." },
    source: ["Abu Dawud", "Authenticated"] },

  { id: 310, catId: "good_evil", type: "dua", order: 14,
    title: { en: "Make faith beloved, make disbelief and sin hateful", fr: "Rends la foi aimée, rends l'incroyance et le péché détestables", de: "Mache den Glauben geliebt, mache Unglauben und Sünde verhasst" },
    arabic: "اَللَّهُمَّ حَبِّبْ إِلَيْنَا الْإِيمَانَ، وَزَيِّنْهُ فِى قُلُوبِنَا، وَكَرِّهْ إِلَيْنَا الْكُفْرَ، وَالْفُسُوقَ، وَالْعِصْيَانَ، وَاجْعَلْنَا مِنَ الرَّاشِدِينَ",
    transliteration: "Allaahumma habbib ilainal iimaan, wa zayyinhu fii quluubinaa, wa karrih ilainal kufro, wal fusuuqo, wal ish-yaana, waj-alnaa minar-roosyidiin.",
    translation: {
      en: "O Allah, make faith beloved to us and beautify it in our hearts. Make disbelief, wickedness, and disobedience hateful to us, and make us among the rightly guided.",
      fr: "Ô Allah, rends-nous la foi aimée et embellis-la dans nos coeurs. Fais-nous détester la mécréance, la perversité et la désobéissance, et fais de nous des bien-guidés.",
      de: "O Allah, mache uns den Glauben lieb und schmücke ihn in unseren Herzen. Mache uns den Unglauben, die Frevelhaftigkeit und den Ungehorsam verhasst und zähle uns zu den Rechtgeleiteten." },
    benefit: {
      en: "The love of faith and hatred of sin are not guaranteed – they are gifts from Allah. This dua asks Allah to shape our hearts so that faith feels natural and beloved, and sin feels repulsive.",
      fr: "L'amour de la foi et la haine du péché ne sont pas garantis – ce sont des dons d'Allah. Ce dua demande à Allah de former nos coeurs pour que la foi semble naturelle et aimée.",
      de: "Die Liebe zum Glauben und der Hass auf die Sünde sind keine Garantie – sie sind Geschenke Allahs. Dieses Dua bittet Allah unsere Herzen so zu formen dass der Glaube natürlich und geliebt erscheint." },
    source: ["Ahmad", "Authenticated"] },

  { id: 311, catId: "good_evil", type: "dua", order: 15,
    title: { en: "I submit, believe and rely – refuge from being led astray", fr: "Je me soumets, crois et me confie – refuge contre l'égarement", de: "Ich ergebe mich, glaube und vertraue – Zuflucht vor Irrefuhrung" },
    arabic: "اَللَّهُمَّ لَكَ أَسْلَمْتُ، وَبِكَ آمَنْتُ، وَعَلَيْكَ تَوَكَّلْتُ، وَإِلَيْكَ أَنَبْتُ، وَبِكَ خَاصَمْتُ، اَللَّهُمَّ إِنِّى أَعُوذُ بِعِزَّتِكَ، لَا إِلَـٰهَ إِلَّا أَنْتَ، أَنْ تُضِلَّنِى، أَنْتَ الْحَىُّ الَّذِى لَا يَمُوتُ، وَالْجِنُّ وَالْإِنْسُ يَمُوتُونَ",
    transliteration: "Allaahumma laka aslamtu, wa bika aamantu, wa alaika tawakkaltu, wa ilaika anabtu, wa bika khoo-shomtu. Allaahumma innii a-uudzu bi-izzatika, laa ilaaha illaa anta, an tudhillanii. Antal hayyulladzii laa yamuutu, wal jinnu wal insu yamuutuun.",
    translation: {
      en: "O Allah, to You I have submitted, in You I have believed, upon You I have relied, to You I have turned in repentance, and by You I argue. O Allah, I seek refuge in Your might – there is no deity except You – from letting me go astray. You are the Ever-Living who never dies, while jinn and humankind die.",
      fr: "Ô Allah, à Toi je me suis soumis, en Toi j'ai cru, sur Toi j'ai placé ma confiance, vers Toi je suis revenu repentant, et c'est par Toi que je plaide. Ô Allah, je cherche refuge auprès de Ta puissance – il n'y a de divinité qu'en Toi – contre le fait que Tu me laisses m'égarer. Tu es le Vivant qui ne meurt pas, tandis que les djinns et les humains meurent.",
      de: "O Allah, Dir habe ich mich ergeben, an Dich glaube ich, auf Dich vertraue ich, zu Dir kehre ich reumütig zurück, und mit Deiner Hilfe führe ich meinen Streit. O Allah, ich suche Zuflucht bei Deiner Macht – es gibt keinen Gott außer Dir – davor dass Du mich in die Irre gehen lässt. Du bist der Lebendige der nicht stirbt während die Dschinn und die Menschen sterben." },
    benefit: {
      en: "Said before sleeping. It combines a declaration of complete submission to Allah with a powerful seeking of refuge from misguidance. The reminder that Allah is the Ever-Living while all else dies brings deep peace before sleep.",
      fr: "Dit avant de dormir. Il combine une déclaration de soumission complète à Allah avec une puissante demande de refuge contre l'égarement.",
      de: "Vor dem Schlafen gesagt. Es verbindet eine Erklärung vollständiger Unterwerfung unter Allah mit einer kraftvollen Zufluchtsuche vor Irrefuhrung." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  // ── CATEGORY: WHEN AMAZED ──
  { id: 312, catId: "amazed", type: "dua", order: 1,
    title: { en: "Subhanallah – Glory be to Allah", fr: "Subhanallah – Gloire à Allah", de: "Subhanallah – Gepriesen sei Allah" },
    arabic: "سُبْحَانَ اللَّهِ",
    transliteration: "Subhaanallaah.",
    translation: {
      en: "Glory be to Allah. Allah is free of all imperfection.",
      fr: "Gloire à Allah. Allah est exempt de toute imperfection.",
      de: "Gepriesen sei Allah. Allah ist frei von jeglicher Unvollkommenheit." },
    benefit: {
      en: "Said when seeing or hearing something amazing, beautiful or surprising. It redirects wonder toward the Creator. The Prophet said: The most beloved words to Allah are four: Subhanallah, Alhamdulillah, La ilaha illallah and Allahu Akbar.",
      fr: "Dit en voyant ou entendant quelque chose d'étonnant, de beau ou de surprenant. Cela redirige l'émerveillement vers le Créateur.",
      de: "Gesagt wenn man etwas Erstaunliches, Schönes oder Überraschendes sieht oder hört. Es lenkt das Staunen auf den Schöpfer um." },
    source: ["Sahih Muslim"] },

  { id: 313, catId: "amazed", type: "dua", order: 2,
    title: { en: "Allahu Akbar – Allah is the Greatest", fr: "Allahu Akbar – Allah est le Plus Grand", de: "Allahu Akbar – Allah ist der Größte" },
    arabic: "اَللَّهُ أَكْبَرُ",
    transliteration: "Allaahu akbar.",
    translation: {
      en: "Allah is the Greatest.",
      fr: "Allah est le Plus Grand.",
      de: "Allah ist der Größte." },
    benefit: {
      en: "Said when something great, powerful or overwhelming is witnessed. It puts everything in perspective – no matter how amazing something is, Allah is greater. Also said when going uphill, when receiving good news, and in many acts of worship.",
      fr: "Dit quand on est témoin de quelque chose de grand, de puissant ou d'écrasant. Cela remet les choses en perspective – aussi étonnant que soit quelque chose, Allah est plus grand.",
      de: "Gesagt wenn man etwas Großes, Mächtiges oder Überwältigendes erlebt. Es setzt alles in Perspektive – so erstaunlich etwas auch ist, Allah ist größer." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 314, catId: "amazed", type: "dua", order: 3,
    title: { en: "Masha Allah – What Allah wills happens", fr: "Masha Allah – Ce qu'Allah veut se réalise", de: "Masha Allah – Was Allah will geschieht" },
    arabic: "مَا شَاءَ اللَّهُ",
    transliteration: "Maa syaa-allaah.",
    translation: {
      en: "What Allah wills happens. Allah has willed it to be so.",
      fr: "Ce qu'Allah veut se réalise. Allah l'a ainsi voulu.",
      de: "Was Allah will geschieht. Allah hat es so gewollt." },
    benefit: {
      en: "Said when seeing something beautiful or admirable – in oneself, others, or one's possessions. It is a protection against the evil eye and an acknowledgment that all blessings come from Allah. The Prophet said to say it to ward off the evil eye.",
      fr: "Dit en voyant quelque chose de beau ou d'admirable. C'est une protection contre le mauvais oeil et une reconnaissance que toutes les bénédictions viennent d'Allah.",
      de: "Gesagt wenn man etwas Schönes oder Bewundernswertes sieht – an sich selbst, anderen oder eigenem Besitz. Es schützt vor dem bösen Blick und erkennt an dass alle Segnungen von Allah kommen." },
    source: ["Ibn Majah", "Authenticated"] },

  { id: 315, catId: "amazed", type: "dua", order: 4,
    title: { en: "Masha Allah La Quwwata Illa Billah (Quran 18:39)", fr: "Masha Allah La Quwwata Illa Billah (Coran 18:39)", de: "Masha Allah La Quwwata Illa Billah (Quran 18:39)" },
    arabic: "مَا شَاءَ اللَّهُ، لَا قُوَّةَ إِلَّا بِاللَّهِ",
    transliteration: "Maa syaa-allaah, laa quwwata illaa billaah.",
    translation: {
      en: "What Allah wills happens. There is no power except with Allah.",
      fr: "Ce qu'Allah veut se réalise. Il n'y a de puissance qu'avec Allah.",
      de: "Was Allah will geschieht. Es gibt keine Kraft außer durch Allah." },
    benefit: {
      en: "From Surah Al-Kahf (18:39) – said by the righteous man to the arrogant man who was boasting about his garden. Scholars say: whoever sees something admirable in himself or his wealth, let him say this to ward off the evil eye from himself.",
      fr: "De la Sourate Al-Kahf – dit par l'homme vertueux à l'homme arrogant qui se vantait de son jardin. Les savants disent : quiconque voit quelque chose d'admirable en lui, qu'il dise cela pour se protéger du mauvais oeil.",
      de: "Aus Sure Al-Kahf – gesagt vom rechtschaffenen Mann zum arroganten Mann der sich seines Gartens rühmte. Gelehrte sagen: Wer etwas Bewundernswertes an sich sieht soll dies sagen um sich vor dem bösen Blick zu schützen." },
    source: ["Quran 18:39"] },

  { id: 316, catId: "amazed", type: "dua", order: 5,
    title: { en: "Labbayk – when amazed by worldly things", fr: "Labbayk – quand les choses mondaines émerveillent", de: "Labbayk – wenn Weltliches beeindruckt" },
    arabic: "لَبَّيْكَ، إِنَّ الْعَيْشَ عَيْشُ الْآخِرَةِ",
    transliteration: "Labbaik, innal aisya aisyul aakhiroh.",
    translation: {
      en: "Here I am responding to You, O Allah. Indeed, the true life is the life of the Hereafter.",
      fr: "Me voici (je réponds à Ton appel, ô Allah). En vérité, la vraie vie est celle de l'au-delà.",
      de: "Hier bin ich o Allah. Wahrlich das wahre Leben ist das Leben im Jenseits." },
    benefit: {
      en: "Said when something of this world amazes or impresses you, to remind yourself that the Hereafter is the true and permanent life. The Prophet said this when he saw the beauty and provisions of this world. It refocuses the heart.",
      fr: "Dit quand quelque chose de ce monde vous impressionne, pour se rappeler que l'au-delà est la vraie vie permanente.",
      de: "Gesagt wenn etwas aus dieser Welt beeindruckt oder fasziniert, um sich daran zu erinnern dass das Jenseits das wahre und dauerhafte Leben ist." },
    source: ["Sahih Bukhari"] },

  { id: 317, catId: "amazed", type: "dua", order: 6,
    title: { en: "O Allah, bless it – when admiring something", fr: "Ô Allah, bénis-le – quand on admire quelque chose", de: "O Allah, segne es – wenn man etwas bewundert" },
    arabic: "اللَّهُمَّ بَارِكْ فِيهِ",
    transliteration: "Allaahumma baarik fiih.",
    translation: {
      en: "O Allah, bless it.",
      fr: "Ô Allah, bénis-le.",
      de: "O Allah, segne es." },
    benefit: {
      en: "Said when admiring something beautiful – a person, child, possession or blessing. Asking for Allah's blessing in what you admire is a form of protection against the evil eye and a beautiful act of generosity. Change the ending according to what you admire: fiihaa for feminine, fiihim for people.",
      fr: "Dit en admirant quelque chose de beau – une personne, un enfant, un bien ou une bénédiction. Changer la fin selon ce qu'on admire : fiihaa pour le féminin, fiihim pour les personnes.",
      de: "Gesagt wenn man etwas Schönes bewundert – eine Person, ein Kind, Besitz oder eine Segnung. Endung je nach was man bewundert anpassen: fiihaa für feminin, fiihim für Personen." },
    source: ["Ibn Majah", "Authenticated"] },

  // ── CATEGORY: ETIQUETTE & VIRTUES ──
  { id: 318, catId: "etiquette", type: "info", order: 1,
    title: { en: "Etiquette of Dua – How to make supplication correctly", fr: "Étiquette du Dua – Comment supplication correctement", de: "Etikette des Dua – Wie man richtig betet" },
    content: {
      en: "The Prophet taught us 13 etiquettes for dua: 1) Choose blessed times (Arafah, Ramadan, last third of night, Friday afternoon). 2) Use blessed states (in sujud, between adhan and iqama, when fasting before iftar). 3) Face the qibla. 4) Raise hands. 5) Speak softly – not too loud, not too quiet. 6) Do not force rhymes – use Quran and Sunnah duas. 7) Be humble, hopeful and fearful. 8) Be firm and certain of acceptance – do not say if You will. 9) Repeat the dua three times. 10) Do not be impatient. 11) Begin with praise of Allah and salawat on the Prophet. 12) Make dua for yourself before others. 13) Eat only halal – haram food blocks acceptance of dua.",
      fr: "Le Prophète nous a enseigné 13 règles pour le dua : 1) Choisir des moments bénis (Arafah, Ramadan, dernier tiers de la nuit, vendredi après-midi). 2) Profiter des états bénis (en sujud, entre adhan et iqama, en jeûnant avant l'iftar). 3) Se tourner vers la qibla. 4) Lever les mains. 5) Parler doucement. 6) Ne pas forcer les rimes – utiliser les duas du Coran et de la Sunna. 7) Être humble, plein d'espoir et de crainte. 8) Être ferme et certain de l'acceptation. 9) Répéter le dua trois fois. 10) Ne pas être impatient. 11) Commencer par la louange d'Allah et le salawat. 12) Faire dua pour soi avant les autres. 13) Manger uniquement du halal.",
      de: "Der Prophet lehrte uns 13 Etikette-Regeln für Dua: 1) Gesegnete Zeiten wählen (Arafah, Ramadan, letztes Drittel der Nacht, Freitagnachmittag). 2) Gesegnete Zustände nutzen (in Sujud, zwischen Adhan und Iqama, beim Fasten vor Iftar). 3) Zur Qibla gewandt sein. 4) Hände erheben. 5) Leise sprechen. 6) Keine Reime erzwingen – Dua aus Quran und Sunnah verwenden. 7) Demütig, hoffend und fürchtend sein. 8) Fest und sicher auf Erhörung vertrauen. 9) Dua dreimal wiederholen. 10) Nicht ungeduldig sein. 11) Mit Lobpreis Allahs und Salawat beginnen. 12) Zuerst für sich selbst beten. 13) Nur Halal essen – Haram-Nahrung blockiert die Erhörung." },
    source: ["Sahih Bukhari", "Sahih Muslim", "Abu Dawud"] },

  { id: 319, catId: "etiquette", type: "dua", order: 2,
    title: { en: "Praising Allah before Dua – Asking by Allah's greatest Name", fr: "Louer Allah avant le Dua – Demander par le plus grand Nom d'Allah", de: "Allah loben vor dem Dua – Bitten durch Allahs größten Namen" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ بِأَنِّي أَشْهَدُ أَنَّكَ أَنْتَ اللَّهُ، لاَ إِلَـٰهَ إِلاَّ أَنْتَ، اَلأَحَدُ الصَّمَدُ، اَلَّذِيْ لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدُ",
    transliteration: "Allaahumma innii as-aluka bi annii asyhadu annaka antallaahu, laa ilaaha illaa anta, al ahadush-shomad, alladzii lam yalid wa lam yuulad, wa lam yakul-lahu kufuwan ahad.",
    translation: {
      en: "O Allah, I ask You, bearing witness that You are Allah, there is no deity except You, the One, the Eternal Refuge, who neither begets nor was begotten, and there is none comparable to Him.",
      fr: "Ô Allah, je Te demande, en témoignant que Tu es Allah, il n'y a pas de divinité sauf Toi, l'Unique, le Refuge Éternel, qui n'engendre pas et n'a pas été engendré, et nul n'est comparable à Lui.",
      de: "O Allah, ich bitte Dich, bezeugend dass Du Allah bist, es gibt keinen Gott außer Dir, dem Einzigen, dem Ewigen, der weder zeugt noch gezeugt wurde, und dem niemand gleich ist." },
    benefit: {
      en: "The Prophet heard someone saying this before making dua and said: He has asked Allah by His greatest Name – when asked by it He gives, and when called by it He responds.",
      fr: "Le Prophète a entendu quelqu'un dire cela avant de faire dua et a dit : Il a demandé à Allah par Son plus grand Nom – quand on Lui demande par ce nom Il donne, et quand on L'appelle par ce nom Il répond.",
      de: "Der Prophet hörte jemanden dies vor dem Dua sagen und sagte: Er hat Allah bei Seinem größten Namen gebeten – wenn man bei ihm gebeten wird gibt Er, und wenn man bei ihm gerufen wird antwortet Er." },
    source: ["Abu Dawud", "An-Nasai", "At-Tirmidhi", "Sahih"] },

  { id: 320, catId: "etiquette", type: "dua", order: 3,
    title: { en: "When sneezing – Alhamdulillah and response", fr: "En éternuant – Alhamdulillah et réponse", de: "Beim Niesen – Alhamdulillah und Antwort" },
    arabic: "اَلْحَمْدُ لِلَّهِ",
    transliteration: "Alhamdulillaah.",
    translation: {
      en: "All praise is for Allah. (The one who hears responds: Yarhamukallah – May Allah have mercy on you. Then the sneezer says: Yahdiikumullahu wa yuslihu baalakum – May Allah guide you and set your affairs right.)",
      fr: "Toute louange est pour Allah. (Celui qui entend répond : Yarhamukallah – Qu'Allah te fasse miséricorde. Puis celui qui a éternué dit : Yahdiikumullahu wa yuslihu baalakum – Qu'Allah vous guide et améliore votre situation.)",
      de: "Aller Lob gebührt Allah. (Wer es hört antwortet: Yarhamukallah – Möge Allah Dich begnadigen. Dann sagt der Niesende: Yahdiikumullahu wa yuslihu baalakum – Möge Allah euch leiten und eure Angelegenheiten verbessern.)" },
    benefit: {
      en: "Complete sneezing etiquette: 1) Sneezer says Alhamdulillah. 2) Listener says Yarhamukallah. 3) Sneezer responds Yahdiikumullahu wa yuslihu baalakum. If the sneezer does not say Alhamdulillah, no response is required.",
      fr: "Étiquette complète du éternuement : 1) Celui qui éternue dit Alhamdulillah. 2) Celui qui entend dit Yarhamukallah. 3) Celui qui a éternué répond Yahdiikumullahu wa yuslihu baalakum.",
      de: "Vollständige Niesetikette: 1) Niesender sagt Alhamdulillah. 2) Zuhörer sagt Yarhamukallah. 3) Niesender antwortet Yahdiikumullahu wa yuslihu baalakum." },
    source: ["Sahih Bukhari"] },

  { id: 321, catId: "etiquette", type: "dua", order: 4,
    title: { en: "When a non-Muslim sneezes and praises Allah", fr: "Quand un non-musulman éternue et loue Allah", de: "Wenn ein Nicht-Muslim niest und Allah lobt" },
    arabic: "يَهْدِيْكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ",
    transliteration: "Yahdiikumullaahu wa yushlihu baalakum.",
    translation: {
      en: "May Allah guide you and set your affairs right.",
      fr: "Qu'Allah vous guide et améliore votre situation.",
      de: "Möge Allah euch leiten und eure Angelegenheiten in Ordnung bringen." },
    benefit: {
      en: "If a non-Muslim sneezes and says Alhamdulillah, you respond with this dua only – not Yarhamukallah (which is for Muslims). This dua is a call to guidance and Islam for them.",
      fr: "Si un non-musulman éternue et dit Alhamdulillah, on répond avec ce dua seulement – pas Yarhamukallah qui est pour les musulmans.",
      de: "Wenn ein Nicht-Muslim niest und Alhamdulillah sagt, antwortet man nur mit diesem Dua – nicht Yarhamukallah das für Muslime ist." },
    source: ["At-Tirmidhi", "Ahmad", "Abu Dawud", "Authenticated"] },

  { id: 322, catId: "etiquette", type: "dua", order: 5,
    title: { en: "For someone who does good to you – Jazakallahu Khairan", fr: "Pour quelqu'un qui te fait du bien – Jazakallahu Khairan", de: "Für jemanden der Gutes tut – Jazakallahu Khairan" },
    arabic: "جَزَاكَ اللَّهُ خَيْرًا",
    transliteration: "Jazaakallaahu khoiron.",
    translation: {
      en: "May Allah reward you with good.",
      fr: "Qu'Allah te récompense par le bien.",
      de: "Möge Allah dich mit Gutem belohnen." },
    benefit: {
      en: "The Prophet said: Whoever has a good deed done for them and says Jazakallahu Khairan has truly excelled in praise. It is better than saying shukran (thank you) because it invokes Allah's blessing for the person.",
      fr: "Le Prophète a dit : Quiconque reçoit un bienfait et dit Jazakallahu Khairan a vraiment excellé dans l'éloge. C'est mieux que de dire shukran car cela invoque la bénédiction d'Allah.",
      de: "Der Prophet sagte: Wer eine gute Tat empfängt und Jazakallahu Khairan sagt hat wahrlich die Lobpreisung übertroffen. Es ist besser als Shukran weil es Allahs Segen für die Person anruft." },
    source: ["At-Tirmidhi", "Sahih"] },

  { id: 323, catId: "etiquette", type: "dua", order: 6,
    title: { en: "Response to: Ghafarallahu laka (May Allah forgive you)", fr: "Réponse à : Ghafarallahu laka (Qu'Allah te pardonne)", de: "Antwort auf: Ghafarallahu laka (Möge Allah dir vergeben)" },
    arabic: "وَلَكَ",
    transliteration: "Wa laka.",
    translation: {
      en: "And for you too. (Response when someone says: May Allah forgive you.)",
      fr: "Et pour toi aussi. (Réponse quand quelqu'un dit : Qu'Allah te pardonne.)",
      de: "Und auch für dich. (Antwort wenn jemand sagt: Möge Allah dir vergeben.)" },
    benefit: {
      en: "When someone says Ghafarallahu laka (May Allah forgive you), respond with Wa laka (And for you too). A simple but beautiful exchange of duas between Muslims.",
      fr: "Quand quelqu'un dit Ghafarallahu laka, répondre Wa laka. Un échange simple mais beau de duas entre musulmans.",
      de: "Wenn jemand Ghafarallahu laka sagt, antwortet man mit Wa laka. Ein einfacher aber schöner Austausch von Duas zwischen Muslimen." },
    source: ["Ahmad", "An-Nasai", "Authenticated"] },

  { id: 324, catId: "etiquette", type: "dua", order: 7,
    title: { en: "Response to: Uhibbuka fillah (I love you for Allah)", fr: "Réponse à : Uhibbuka fillah (Je t'aime pour Allah)", de: "Antwort auf: Uhibbuka fillah (Ich liebe dich um Allahs willen)" },
    arabic: "أَحَبَّكَ الَّذِيْ أَحْبَبْتَنِي لَهُ",
    transliteration: "Ahabbakal-ladzii ahbabtanii lahu.",
    translation: {
      en: "May the One for whom you loved me also love you.",
      fr: "Que Celui pour lequel tu m'as aimé t'aime aussi.",
      de: "Möge Derjenige um dessentwillen du mich geliebt hast dich auch lieben." },
    benefit: {
      en: "When a Muslim says I love you for the sake of Allah (Uhibbuka fillah), respond with this beautiful dua. It completes the bond of brotherhood in Islam. The Prophet said: If one of you loves his brother, let him tell him.",
      fr: "Quand un musulman dit Je t'aime pour l'amour d'Allah, répondre avec ce beau dua. Il complète le lien de fraternité en Islam.",
      de: "Wenn ein Muslim sagt Ich liebe dich um Allahs willen, antwortet man mit diesem schönen Dua. Es vervollständigt die Bruderschaftsbindung im Islam." },
    source: ["Abu Dawud", "Hasan"] },

  { id: 325, catId: "etiquette", type: "dua", order: 8,
    title: { en: "Response to: Barakallahu fiika (May Allah bless you)", fr: "Réponse à : Barakallahu fiika (Qu'Allah te bénisse)", de: "Antwort auf: Barakallahu fiika (Möge Allah dich segnen)" },
    arabic: "وَفِيْكَ بَارَكَ اللَّهُ",
    transliteration: "Wa fiika baarokallaah.",
    translation: {
      en: "And may Allah bless you too.",
      fr: "Et qu'Allah te bénisse aussi.",
      de: "Und möge Allah dich auch segnen." },
    benefit: {
      en: "When someone says Barakallahu fiika (May Allah bless you), respond with Wa fiika barakallah (And may Allah bless you too). This exchange of blessings is a sunnah that strengthens the bonds between Muslims.",
      fr: "Quand quelqu'un dit Barakallahu fiika, répondre Wa fiika barakallah. Cet échange de bénédictions est une sunna qui renforce les liens entre musulmans.",
      de: "Wenn jemand Barakallahu fiika sagt, antwortet man mit Wa fiika barakallah. Dieser Austausch von Segen ist eine Sunnah die die Bindungen zwischen Muslimen stärkt." },
    source: ["Ibn Sunni", "Authenticated"] },

  { id: 326, catId: "etiquette", type: "dua", order: 9,
    title: { en: "Dua for someone you insulted or spoke harshly to", fr: "Invocation pour quelqu'un que vous avez insulté", de: "Dua für jemanden den man beschimpft hat" },
    arabic: "اَللَّهُمَّ فَأَيُّمَا مُؤْمِنٍ سَبَبْتُهُ فَاجْعَلْ ذَالِكَ لَهُ قُرْبَةً إِلَيْكَ يَوْمَ الْقِيَامَةِ",
    transliteration: "Allaahumma fa-ayyumaa mu-minin sababtuhu faj-al dzaalika lahu qurbatan ilaika yaumal qiyaamah.",
    translation: {
      en: "O Allah, whichever believer I have insulted, make that a means of drawing him closer to You on the Day of Resurrection.",
      fr: "Ô Allah, tout croyant que j'ai insulté, fais que cela soit pour lui un moyen de se rapprocher de Toi au Jour de la Résurrection.",
      de: "O Allah, welchen Gläubigen auch immer ich beschimpft habe, mache das zu einem Mittel seiner Annäherung an Dich am Tag der Auferstehung." },
    benefit: {
      en: "The Prophet made this dua because he was human and might have spoken harshly to someone. This dua transforms the harm done into a benefit for the wronged person on the Day of Judgment. A beautiful expression of remorse and care.",
      fr: "Le Prophète faisait ce dua car il était humain et pouvait avoir parlé durement à quelqu'un. Ce dua transforme le tort causé en bénéfice pour la personne lésée au Jour du Jugement.",
      de: "Der Prophet machte dieses Dua weil er Mensch war und möglicherweise hart zu jemandem gesprochen hatte. Dieses Dua verwandelt den zugefügten Schaden in einen Nutzen für die verletzte Person am Jüngsten Tag." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 327, catId: "etiquette", type: "info", order: 10,
    title: { en: "How to praise a companion – etiquette of complimenting others", fr: "Comment féliciter un compagnon – étiquette des compliments", de: "Wie man einen Freund lobt – Etikette beim Komplimentieren" },
    content: {
      en: "The Prophet said: If one of you must praise his brother, say: I think so-and-so is such-and-such – and Allah is his Reckoner – and I do not praise anyone before Allah. If you know him well, say: I think him to be like this and this. Do not say he is definitely righteous or definitely a good person – only Allah knows what is in the heart. This protects against flattery and false praise.",
      fr: "Le Prophète a dit : Si l'un de vous doit louer son frère, qu'il dise : Je pense qu'un tel est ainsi – et Allah est son Juge – et je ne fais pas l'éloge de quelqu'un devant Allah. Si tu le connais bien, dis : Je le crois être ainsi et ainsi. Ne dis pas qu'il est certainement vertueux – seul Allah connaît ce qui est dans le coeur.",
      de: "Der Prophet sagte: Wenn einer von euch seinen Bruder loben muss, sagt er: Ich denke so-und-so ist so-und-so – und Allah ist sein Rechnungsführer – und ich lobe niemanden vor Allah. Wenn du ihn gut kennst, sage: Ich glaube er ist so und so. Sage nicht er ist definitiv rechtschaffen – nur Allah kennt was im Herzen ist." },
    source: ["Sahih Muslim"] },

  { id: 328, catId: "etiquette", type: "dua", order: 11,
    title: { en: "When praised by others – version 1", fr: "Quand on est loué par les autres – version 1", de: "Wenn man von anderen gelobt wird – Version 1" },
    arabic: "اَللَّهُمَّ لَا تُؤَاخِذْنِي بِمَا يَقُولُونَ، وَاغْفِرْ لِي مَا لَا يَعْلَمُونَ",
    transliteration: "Allaahumma laa tu-aakhidznii bimaa yaquuluun, waghfir lii maa laa ya-lamuun.",
    translation: {
      en: "O Allah, do not hold me accountable for what they say, and forgive me for what they do not know.",
      fr: "Ô Allah, ne me tiens pas rigueur de ce qu'ils disent et pardonne-moi ce qu'ils ne savent pas.",
      de: "O Allah, halte mich nicht verantwortlich für das was sie sagen, und vergib mir was sie nicht wissen." },
    benefit: {
      en: "Said when someone praises you. It protects against arrogance by acknowledging that only Allah knows your true state, and that praise can be dangerous for the soul if taken seriously.",
      fr: "Dit quand quelqu'un vous fait l'éloge. Cela protège contre l'orgueil en reconnaissant qu'Allah seul connaît votre vrai état.",
      de: "Gesagt wenn jemand dich lobt. Es schützt vor Arroganz indem anerkannt wird dass nur Allah deinen wahren Zustand kennt." },
    source: ["Sahih Bukhari"] },

  { id: 329, catId: "etiquette", type: "info", order: 12,
    title: { en: "When praised by others – version 2", fr: "Quand on est loué par les autres – version 2", de: "Wenn man von anderen gelobt wird – Version 2" },
    content: {
      en: "When someone praises you excessively, you may also say: O Allah, make me better than what they think of me, and forgive me for what they do not know, and do not hold me accountable for what they say. This acknowledges the gap between how others see us and our true state before Allah.",
      fr: "Quand quelqu'un vous fait un éloge excessif, on peut aussi dire : Ô Allah, rends-moi meilleur que ce qu'ils pensent de moi, pardonne-moi ce qu'ils ne savent pas, et ne me tiens pas rigueur de ce qu'ils disent.",
      de: "Wenn jemand dich übermäßig lobt, kann man auch sagen: O Allah, mache mich besser als das was sie von mir denken, vergib mir was sie nicht wissen, und halte mich nicht verantwortlich für das was sie sagen." },
    source: ["Sahih Bukhari", "Al-Bukhari"] },

  { id: 330, catId: "etiquette", type: "dua", order: 13,
    title: { en: "When feeling angry", fr: "Quand on ressent de la colère", de: "Wenn man Zorn empfindet" },
    arabic: "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ",
    transliteration: "A-uudzu billaahi minasy-syaithaanir-rojiim.",
    translation: {
      en: "I seek refuge in Allah from the accursed Satan.",
      fr: "Je cherche refuge auprès d'Allah contre Satan le maudit.",
      de: "Ich suche Zuflucht bei Allah vor dem verfluchten Satan." },
    benefit: {
      en: "The Prophet's specific prescription for anger. When a man was overcome by anger before the Prophet, he said: I know a word that if he said it his anger would leave him – A-udhu billahi min ash-shaytaan ir-rajeem. The physical prescriptions: if standing, sit down; if sitting, lie down. And make wudu with cold water.",
      fr: "La prescription spécifique du Prophète pour la colère. Quand un homme était submergé par la colère, le Prophète dit : Je connais une parole qui si elle était dite sa colère partirait – A-udhu billahi min ash-shaytaan.",
      de: "Das spezifische Mittel des Propheten gegen Zorn. Als ein Mann von Zorn überwältigt wurde sagte der Prophet: Ich kenne ein Wort das wenn er es sagen würde sein Zorn weichen würde – A-udhu billahi min ash-shaytaan." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 331, catId: "etiquette", type: "dua", order: 14,
    title: { en: "When feeling fear", fr: "Quand on ressent de la peur", de: "Wenn man Angst empfindet" },
    arabic: "لاَ إِلَـٰهَ إِلاَّ اللَّهُ",
    transliteration: "Laa ilaaha illallaah.",
    translation: {
      en: "There is no deity worthy of worship except Allah.",
      fr: "Il n'y a pas de divinité digne d'adoration sauf Allah.",
      de: "Es gibt keine Gottheit die der Anbetung würdig ist außer Allah." },
    benefit: {
      en: "Said when overcome by fear. The remembrance of Allah dispels fear because true fear belongs only to Allah. Whoever fears Allah fears nothing else.",
      fr: "Dit quand on est submergé par la peur. Le souvenir d'Allah dissipe la peur car la vraie crainte n'appartient qu'à Allah.",
      de: "Gesagt wenn man von Angst überwältigt wird. Das Gedenken Allahs vertreibt die Angst denn wahre Furcht gehört nur Allah." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 332, catId: "etiquette", type: "dua", order: 15,
    title: { en: "Response when a non-Muslim greets with Salam", fr: "Réponse quand un non-musulman salue avec Salam", de: "Antwort wenn ein Nicht-Muslim mit Salam grüßt" },
    arabic: "وَعَلَيْكُمْ",
    transliteration: "Wa alaikum.",
    translation: {
      en: "And upon you too.",
      fr: "Et sur vous aussi.",
      de: "Und auf euch auch." },
    benefit: {
      en: "When a non-Muslim says As-Salamu Alaykum, respond only with Wa Alaykum – not the full greeting. The Prophet said this so that if they said saam (death) instead of salaam, the response would still be appropriate.",
      fr: "Quand un non-musulman dit As-Salamu Alaykum, répondre seulement Wa Alaykum. Le Prophète a dit cela pour que si quelqu'un dit saam au lieu de salaam, la réponse reste appropriée.",
      de: "Wenn ein Nicht-Muslim As-Salamu Alaykum sagt nur mit Wa Alaykum antworten. Der Prophet sagte dies damit wenn jemand saam statt salaam sagt die Antwort trotzdem angemessen bleibt." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  { id: 333, catId: "etiquette", type: "info", order: 16,
    title: { en: "Virtue of sending Salawat upon the Prophet", fr: "Vertu d'envoyer des Salawat sur le Prophète", de: "Tugend des Salawat auf den Propheten" },
    content: {
      en: "The Prophet said: Whoever sends one salawat upon me, Allah sends ten upon him. Whoever sends salawat sincerely, Allah sends ten salawat, raises his rank ten degrees, records ten good deeds and removes ten sins. The Prophet also said: The miser is the one who when I am mentioned does not send salawat upon me. And: Do not make my grave a place of festival – your salawat reaches me wherever you are.",
      fr: "Le Prophète a dit : Quiconque envoie un salawat sur moi, Allah en envoie dix sur lui. Quiconque envoie un salawat sincèrement, Allah envoie dix salawat, élève son rang de dix degrés, enregistre dix bonnes actions et efface dix péchés. L'avare est celui qui ne fait pas de salawat quand je suis mentionné. Votre salawat me parvient où que vous soyez.",
      de: "Der Prophet sagte: Wer einen Salawat auf mich sendet sendet Allah zehn auf ihn. Wer aufrichtig Salawat sendet sendet Allah zehn Salawat hebt seinen Rang um zehn Stufen an verzeichnet zehn gute Taten und tilgt zehn Sünden. Der Geizige ist der der keinen Salawat sendet wenn ich erwähnt werde. Euer Salawat erreicht mich wo immer ihr seid." },
    source: ["Sahih Muslim", "Abu Dawud", "At-Tirmidhi", "An-Nasai"] },

  { id: 334, catId: "etiquette", type: "info", order: 17,
    title: { en: "The command to spread the Salam greeting", fr: "Le commandement de répandre le salut Salam", de: "Der Befehl den Salam-Gruß zu verbreiten" },
    content: {
      en: "The Prophet said: You will not enter Paradise until you believe, and you will not believe fully until you love one another. Shall I tell you something that if you do it you will love one another? Spread the Salam among you. He also said: Feed others, spread the Salam to those you know and those you do not know. And: Three things gather complete faith – being just with yourself, spreading Salam to all people, and giving charity in poverty.",
      fr: "Le Prophète a dit : Vous n'entrerez pas au Paradis jusqu'à ce que vous croyiez, et vous ne croirez pas pleinement jusqu'à ce que vous vous aimiez. Dois-je vous indiquer quelque chose qui si vous le faites vous fera vous aimer ? Répandez le Salam entre vous. Nourrissez les autres, répandez le Salam à ceux que vous connaissez et ceux que vous ne connaissez pas.",
      de: "Der Prophet sagte: Ihr werdet das Paradies nicht betreten bis ihr glaubt und ihr werdet nicht vollständig glauben bis ihr euch liebt. Soll ich euch etwas sagen das euch wenn ihr es tut lieben lässt? Verbreitet den Salam untereinander. Ernährt andere verbreitet den Salam an die ihr kennt und nicht kennt." },
    source: ["Sahih Muslim", "Sahih Bukhari"] },

  { id: 335, catId: "etiquette", type: "dua", order: 18,
    title: { en: "When seeing something wrong or evil", fr: "Quand on voit quelque chose de mal ou d'interdit", de: "Wenn man etwas Falsches oder Verbotenes sieht" },
    arabic: "سُبْحَانَ اللَّهِ",
    transliteration: "Subhaanallaah.",
    translation: {
      en: "Glory be to Allah. How far Allah is from all imperfection.",
      fr: "Gloire à Allah. Combien Allah est loin de toute imperfection.",
      de: "Gepriesen sei Allah. Wie weit ist Allah von jeder Unvollkommenheit entfernt." },
    benefit: {
      en: "Said when witnessing wrongdoing, evil speech or immorality. Aisha and the companions said Subhanallah when they heard the great slander against her. The scholars say it expresses both amazement and glorification of Allah – affirming that Allah is far above what the wrongdoers claim or do.",
      fr: "Dit en témoin d'une mauvaise action, d'un discours mauvais ou d'une immoralité. Aisha et les compagnons ont dit Subhanallah quand ils ont entendu la grande calomnie contre elle. C'est à la fois étonnement et glorification d'Allah.",
      de: "Gesagt wenn man Unrecht böse Rede oder Unmoral bezeugt. Aisha und die Gefährten sagten Subhanallah als sie die große Verleumdung gegen sie hörten. Es drückt sowohl Erstaunen als auch Verherrlichung Allahs aus." },
    source: ["Sahih Bukhari", "Sahih Muslim", "Quran 24:16"] },

  // ── CATEGORY: ISTIGHFAR & TAWBAH ──
  { id: 336, catId: "istighfar", type: "info", order: 1,
    title: { en: "What to do when you sin", fr: "Que faire quand on commet un péché", de: "Was man tun soll wenn man sündigt" },
    content: {
      en: "If any servant commits a sin, then performs wudu properly, then stands and prays two rakats, then seeks forgiveness – Allah will certainly forgive him. The Prophet also taught: Follow a bad deed with a good deed and it will erase it. And treat people with good character.",
      fr: "Si un serviteur commet un péché, puis fait les ablutions correctement, puis se lève et prie deux rakats, puis demande pardon – Allah le pardonnera certainement. Le Prophète a aussi enseigné : Fais suivre une mauvaise action d'une bonne action et elle l'effacera. Et traite les gens avec un bon caractère.",
      de: "Wenn ein Diener eine Sünde begeht dann ordnungsgemäß Wudu macht dann aufsteht und zwei Rakats betet dann Vergebung sucht – wird Allah ihn gewiss vergeben. Der Prophet lehrte auch: Lass einer schlechten Tat eine gute Tat folgen und sie wird sie auslöschen. Und behandle die Menschen mit gutem Charakter." },
    source: ["Abu Dawud", "At-Tirmidhi", "Sahih"] },

  { id: 337, catId: "istighfar", type: "info", order: 2,
    title: { en: "The encouragement to make much Istighfar and Tawbah", fr: "L'encouragement à faire beaucoup d'Istighfar et de Tawbah", de: "Die Ermutigung viel Istighfar und Tawbah zu sprechen" },
    content: {
      en: "Blessed is the one who finds much Istighfar in his record of deeds. The Prophet said: O people! Repent to Allah for I repent to Him 100 times a day. He also said: My heart becomes heedless and I seek His forgiveness 100 times a day. And: By Allah I seek forgiveness from Allah and repent to Him more than 70 times a day. The Prophet never went a single day without seeking forgiveness – and he was already forgiven all sins.",
      fr: "Heureux est celui qui trouve beaucoup d'Istighfar dans son registre d'actes. Le Prophète a dit : O gens! Repentez-vous à Allah car je me repens à Lui 100 fois par jour. Il a aussi dit : Mon coeur devient inattentif et je demande Son pardon 100 fois par jour. Et : Par Allah je cherche le pardon d'Allah et me repens à Lui plus de 70 fois par jour.",
      de: "Gesegnet ist der der viel Istighfar in seinem Tatenbuch findet. Der Prophet sagte: O Menschen! Bereut zu Allah denn ich bereue zu Ihm 100-mal täglich. Er sagte auch: Mein Herz wird unachtsam und ich suche Seine Vergebung 100-mal täglich. Und: Bei Allah ich suche Allahs Vergebung und bereue zu Ihm mehr als 70-mal täglich." },
    source: ["Sahih Muslim", "Sahih Bukhari", "Ibn Majah"] },

  { id: 338, catId: "istighfar", type: "info", order: 3,
