      fr:"Ô Allah, je Te demande le Paradis et tout ce qui y rapproche en paroles et en actes. Je cherche refuge auprès de Toi contre le Feu et tout ce qui y rapproche en paroles et en actes. Et je Te demande de rendre bon tout décret que Tu as décrété pour moi.",
      de:"O Allah, ich bitte Dich um das Paradies und alles was mich ihm näherbringt an Worten und Taten. Ich suche Zuflucht bei Dir vor dem Feuer und allem was mich ihm näherbringt an Worten und Taten. Und ich bitte Dich jeden Beschluss den Du über mich gefällt hast gut zu machen."},
    source:["Ibn Majah","Ahmad","Sahih"] },

  { id:179, catId:"paradise", type:"info", order:3,
    title:{en:"Ask for Al-Firdaus – The Highest Paradise",fr:"Demander Al-Firdaus – Le plus haut Paradis",de:"Al-Firdaus erbitten – Das höchste Paradies"},
    content:{
      en:"The Prophet ﷺ said: 'When you ask Allah, ask Him for Al-Firdaus. It is the highest and best part of Paradise. Above it is the Throne of the Most Merciful, and from it spring the rivers of Paradise.' Do not settle for asking just for 'Paradise' – ask for the highest, Al-Firdaus.",
      fr:"Le Prophète ﷺ a dit : 'Quand vous demandez à Allah, demandez-Lui Al-Firdaus. C'est la partie la plus haute et la meilleure du Paradis. Au-dessus se trouve le Trône du Très Miséricordieux, et c'est de là que jaillissent les rivières du Paradis.' Ne vous contentez pas de demander simplement le 'Paradis' – demandez le plus haut, Al-Firdaus.", de:"Der Prophet ﷺ sagte: 'Wenn ihr Allah bittet, bittet Ihn um Al-Firdaus. Es ist der höchste und beste Teil des Paradieses. Darüber ist der Thron des Allerbarmderzigen und von dort entspringen die Flüsse des Paradieses.' Gebt euch nicht damit zufrieden nur um das 'Paradies' zu bitten – bittet um das Höchste, Al-Firdaus."}, source:["Sahih Bukhari"] },

  { id:180, catId:"paradise", type:"dua", order:4, title:{en:"Dua from the Quran – Turn away Hellfire (25:65)",fr:"Invocation du Coran – Éloigner l'Enfer (25:65)",de:"Dua aus dem Quran – Höllenstrafe abwenden (25:65)"},     arabic:"رَبَّنَا اصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ إِنَّ عَذَابَهَا كَانَ غَرَامًا ۝ إِنَّهَا سَاءَتْ مُسْتَقَرًّا وَمُقَامًا",     transliteration:"Robbanash-rif 'annaa 'adzaaba jahannam, inna 'adzaabahaa kaana ghorooman, innahaa saa-at mustaqorron wa muqoomaa.",
    translation:{
      en:"Our Lord, avert from us the punishment of Hell. Indeed, its punishment is ever adhering. Indeed, it is evil as a settlement and residence.",
      fr:"Seigneur, éloigne de nous le châtiment de l'Enfer. En vérité, son châtiment est permanent. En vérité, il est mauvais comme demeure et séjour.", de:"Unser Herr, wende die Strafe der Hölle von uns ab. Wahrlich ihre Strafe ist beständig haftend. Wahrlich sie ist böse als Aufenthalts- und Wohnstätte."}, benefit:{en:"This is the dua of the servants of the Most Merciful (Ibad ar-Rahman) as described in Surah Al-Furqan. These are the qualities of the true believers whom Allah praises in the Quran.",fr:"C'est l'invocation des serviteurs du Très Miséricordieux (Ibad ar-Rahman) tels que décrits dans la sourate Al-Furqan. Ce sont les qualités des vrais croyants que Allah loue dans le Coran.",de:"Dies ist das Dua der Diener des Allerbarmderzigen (Ibad ar-Rahman) wie in der Sure Al-Furqan beschrieben. Dies sind die Eigenschaften der wahren Gläubigen die Allah im Quran lobt."}, source:["Quran 25:65-66"] },

  { id:181, catId:"paradise", type:"info", order:5,     title:{en:"Asking 3 times – Paradise and Fire respond",fr:"Demander 3 fois – Le Paradis et le Feu répondent",de:"3-mal bitten – Paradies und Feuer antworten"},     content:{ en:"The Prophet ﷺ said: 'Whoever asks Allah for Paradise three times, Paradise will say: O Allah, admit him into Paradise. And whoever seeks refuge from the Fire three times, the Fire will say: O Allah, protect him from the Fire.' (At-Tirmidhi, Ibn Majah – Sahih)  Therefore: always say the dua for Paradise at least three times, and seek refuge from the Fire at least three times.", fr:"Le Prophète ﷺ a dit : 'Celui qui demande trois fois à Allah le Paradis, le Paradis dira : Ô Allah, fais-le entrer au Paradis. Et celui qui cherche trois fois refuge contre le Feu, le Feu dira : Ô Allah, protège-le du Feu.' (At-Tirmidhi, Ibn Majah – Sahih)  Donc : toujours dire l'invocation pour le Paradis au moins trois fois et chercher refuge contre le Feu au moins trois fois.", de:"Der Prophet ﷺ sagte: 'Wer Allah dreimal um das Paradies bittet wird das Paradies sagen: O Allah, lass ihn eintreten. Und wer dreimal Zuflucht vor dem Feuer sucht wird das Feuer sagen: O Allah, schütze ihn vor dem Feuer.' (At-Tirmidhi, Ibn Majah – Sahih)  Daher: das Dua für das Paradies immer mindestens dreimal sprechen und mindestens dreimal Zuflucht vor dem Feuer suchen."}, source:["At-Tirmidhi","Ibn Majah","Sahih"] },

  // ── CATEGORY: GOOD CHARACTER ──
  
  { id:182, catId:"character", type:"dua", order:1, title:{en:"Perfect my character as You perfected my creation",fr:"Embellis mon caractère comme Tu as embelli ma création",de:"Vervollkomne meinen Charakter wie Du meine Schöpfung vervollkommnet hast"},
    arabic:"اَللَّهُمَّ أَحْسَنْتَ خَلْقِي فَأَحْسِنْ خُلُقِي",
    transliteration:"Allaahumma ahsanta kholqii, fa-ahsin khuluqii.",
    translation:{
      en:"O Allah, just as You have perfected my creation, perfect my character.",
      fr:"Ô Allah, de même que Tu as embelli ma création, embellis mon comportement.", de:"O Allah, so wie Du meine Gestalt schön gemacht hast, mache auch meinen Charakter schön."}, benefit:{en:"A short but profound dua. Allah created the human form in the best shape – this dua asks that the inner character match the beauty of the outer form.",fr:"Une invocation courte mais profonde. Allah a créé la forme humaine dans la meilleure forme – cette invocation demande que le caractère intérieur corresponde à la beauté de la forme extérieure.",de:"Ein kurzes aber tiefgründiges Dua. Allah erschuf die menschliche Form in der besten Gestalt – dieses Dua bittet dass der innere Charakter der Schönheit der äußeren Form entspricht."},
    source:["Ibn Hibban","Ahmad","Sahih"] },

  { id:183, catId:"character", type:"dua", order:2,
    title:{en:"Guide me to the best character – short version",fr:"Guide-moi vers le meilleur caractère – version courte",de:"Leite mich zum besten Charakter – kurze Version"},
    arabic:"اَللَّهُمَّ اهْدِنِى لِأَحْسَنِ الأَخْلَاقِ، لَا يَهْدِى لِأَحْسَنِهَا إِلَّا أَنْتَ، وَاصْرِفْ عَنِّى سَيِّئَهَا، لَا يَصْرِفُ عَنِّى سَيِّئَهَا إِلَّا أَنْتَ",
    transliteration:"Allaahummahdinii li-ahsanil akhlaaq, laa yahdii li-ahsanihaa illaa anta, wash-rif 'annii sayyi-ahaa, laa yash-rifu 'annii sayyi-ahaa illaa anta.",
    translation:{
      en:"O Allah, guide me to the best character – none can guide to it except You. And turn me away from bad character – none can turn it away except You.",
      fr:"Ô Allah, guide-moi vers les meilleures qualités morales – nul ne peut y guider sauf Toi. Et éloigne de moi le mauvais comportement – nul ne peut l'éloigner sauf Toi.", de:"O Allah, leite mich zu den besten Charaktereigenschaften – niemand außer Dir kann dazu leiten. Und halte mich fern von schlechtem Charakter – niemand außer Dir kann ihn abwenden."}, benefit:{en:"From the opening duas of the night prayer (Qiyam al-Layl). It acknowledges that good character is a gift from Allah, not achieved by willpower alone.",fr:"Parmi les invocations d'ouverture de la prière de nuit (Qiyam al-Layl). Elle reconnaît que le bon caractère est un don d'Allah, non atteint par la seule volonté.",de:"Aus den Eröffnungsduas des Nachtgebets (Qiyam al-Layl). Es erkennt an dass guter Charakter eine Gabe Allahs ist, nicht allein durch Willenskraft erreicht."}, source:["Sahih Muslim"] },

  { id:184, catId:"character", type:"dua", order:3,     title:{en:"Guide me to the best deeds and character – full version",fr:"Guide-moi vers les meilleures actions et le meilleur caractère – version complète",de:"Leite mich zu den besten Taten und bestem Charakter – vollständige Version"},     arabic:"اَللَّهُمَّ اهْدِنِيْ لِأَحْسَنِ الْأَعْمَالِ، وَأَحْسَنِ الْأَخْلَاقِ، لَا يَهْدِي لِأَحْسَنِهَا إِلَّا أَنْتَ، وَقِنِي سَيِّئَ الْأَعْمَالِ، وَسَيِّئَ الْأَخْلَاقِ، لَا يَقِي سَيِّئَهَا إِلَّا أَنْتَ",     transliteration:"Allaahummahdinii li-ahsanil a'maal, wa ahsanil akhlaaq, laa yahdii li-ahsanihaa illaa anta, wa qinii sayyi-al a'maal, wa sayyi-al akhlaaq, laa yaqii sayyi-ahaa illaa anta.",
    translation:{ en:"O Allah, guide me to the best deeds and the best character – none can guide to them except You. And protect me from bad deeds and bad character – none can protect from them except You.", fr:"Ô Allah, guide-moi vers les meilleures actions et le meilleur caractère – nul ne peut y guider sauf Toi. Et préserve-moi des mauvaises actions et du mauvais comportement – nul ne peut m'en préserver sauf Toi.",
      de:"O Allah, leite mich zu den besten Taten und dem besten Charakter – niemand außer Dir kann dazu leiten. Und bewahre mich vor schlechten Taten und schlechtem Charakter – niemand außer Dir kann davor bewahren."},
    source:["At-Tabarani","Sahih Al-Albani"] },

  { id:185, catId:"character", type:"dua", order:4,
    title:{en:"Refuge from evil character, deeds and desires",fr:"Refuge contre le mauvais caractère, les mauvaises actions et les désirs",de:"Zuflucht vor schlechtem Charakter, Taten und Begierden"},
    arabic:"اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنْ مُنْكَرَاتِ الْأَخْلَاقِ، وَالْأَعْمَالِ، وَالْأَهْوَاءِ",
    transliteration:"Allaahumma innii a'uudzu bika min munkarootil akhlaaq, wal a'maal, wal ahwaa'.",
    translation:{ en:"O Allah, I seek refuge in You from evil character, bad deeds and desires.", fr:"Ô Allah, je cherche refuge auprès de Toi contre les mauvais comportements, les mauvaises actions et les passions.", de:"O Allah, ich suche Zuflucht bei Dir vor schlechtem Charakter, schlechten Taten und Begierden."}, source:["At-Tabarani","Sahih Al-Albani"] },

  { id:186, catId:"character", type:"dua", order:5, title:{en:"Refuge from evil character, deeds, desires and diseases",fr:"Refuge contre mauvais caractère, actes, désirs et maladies",de:"Zuflucht vor schlechtem Charakter, Taten, Begierden und Krankheiten"},     arabic:"اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنْ مُنْكَرَاتِ الْأَخْلَاقِ، وَالْأَعْمَالِ، وَالْأَهْوَاءِ، وَالْأَدْوَاءِ",     transliteration:"Allaahumma innii a'uudzu bika min munkarootil akhlaaq, wal a'maal, wal ahwaa', wal adwaa'.",
    translation:{ en:"O Allah, I seek refuge in You from evil character, bad deeds, desires, and diseases.", fr:"Ô Allah, je cherche refuge auprès de Toi contre les mauvais comportements, les mauvaises actions, les passions et les maladies.", de:"O Allah, ich suche Zuflucht bei Dir vor schlechtem Charakter, schlechten Taten, Begierden und Krankheiten."}, source:["At-Tabarani","Authenticated"] },

  { id:187, catId:"character", type:"dua", order:6, title:{en:"Keep me away from evil character, deeds, desires and diseases",fr:"Éloigne-moi du mauvais caractère, des mauvaises actions, des désirs et des maladies",de:"Halte mich fern von schlechtem Charakter, Taten, Begierden und Krankheiten"},     arabic:"اَللَّهُمَّ جَنِّبْنِيْ مُنْكَرَاتِ الْأَخْلَاقِ، وَالْأَعْمَالِ، وَالْأَهْوَاءِ، وَالْأَدْوَاءِ",     transliteration:"Allaahumma jannibnii munkarootil akhlaaq, wal a'maal, wal ahwaa', wal adwaa'.",
    translation:{
      en:"O Allah, keep me away from evil character, bad deeds, desires, and diseases.",
      fr:"Ô Allah, éloigne-moi des mauvais comportements, des mauvaises actions, des passions et des maladies.", de:"O Allah, halte mich fern von schlechtem Charakter, schlechten Taten, Begierden und Krankheiten."}, benefit:{en:"The difference between entries 5 and 6: Entry 5 asks for refuge (a'udhu – seeking protection) while entry 6 asks to be kept away (jannibni – distance from evil). Both meanings complement each other.",fr:"La différence entre les entrées 5 et 6 : l'entrée 5 demande refuge (a'udhu – chercher protection) tandis que l'entrée 6 demande d'être tenu éloigné (jannibni – distance du mal). Les deux sens se complètent.",de:"Der Unterschied zwischen Eintrag 5 und 6: Eintrag 5 bittet um Zuflucht (a'udhu – Schutz suchen) während Eintrag 6 bittet ferngehalten zu werden (jannibni – Abstand vom Bösen). Beide Bedeutungen ergänzen einander."},
    source:["At-Tabarani","Authenticated"] },

  // ── CATEGORY: PARENTS ──
  
  { id:188, catId:"parents", type:"dua", order:1,
    title:{en:"Dua for forgiveness – for oneself, parents and believers (Quran 14:41)",fr:"Invocation pour le pardon – pour soi, ses parents et les croyants (Coran 14:41)",de:"Dua um Vergebung – für sich, Eltern und Gläubige (Quran 14:41)"},
    arabic:"رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ",
    transliteration:"Robbanagh-fir lii wa liwaalidayya wa lil mu-miniina yauma yaquumul hisaab.",
    translation:{
      en:"Our Lord, forgive me, my parents, and the believers on the Day when the reckoning will be established.",
      fr:"Seigneur, pardonne-moi, ainsi qu'à mes parents et aux croyants, le Jour du Jugement.", de:"Unser Herr, vergib mir, meinen Eltern und den Gläubigen am Tag der Abrechnung."}, benefit:{en:"This is the dua of Prophet Ibrahim عليه السلام. Including parents in every dua is one of the greatest acts of gratitude and love a child can show.",fr:"C'est l'invocation du Prophète Ibrahim عليه السلام. Inclure les parents dans chaque invocation est l'un des plus grands actes de gratitude et d'amour qu'un enfant peut montrer.",de:"Dies ist das Dua des Propheten Ibrahim عليه السلام. Eltern in jedes Dua einzuschließen ist eine der größten Dankbarkeits- und Liebesbekundungen die ein Kind zeigen kann."},
    source:["Quran 14:41"] },

  { id:189, catId:"parents", type:"dua", order:2,
    title:{en:"Dua of Prophet Nuh – forgiveness for parents, believers and home (Quran 71:28)",fr:"Invocation du Prophète Nuh – pardon pour parents, croyants et maison (Coran 71:28)",de:"Dua des Propheten Nuh – Vergebung für Eltern, Gläubige und Haus (Quran 71:28)"},
    arabic:"رَّبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَن دَخَلَ بَيْتِيَ مُؤْمِنًا وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَلَا تَزِدِ الظَّالِمِينَ إِلَّا تَبَارًا",
    transliteration:"Robbigh-fir lii wa liwaalidayya wa liman dakhola baitiya mu-minan wa lil mu-miniina wal mu-minaati wa laa tazidizh-zhoolimiina illaa tabaaroo.",
    translation:{
      en:"My Lord, forgive me, my parents, and whoever enters my house as a believer, and all believing men and women. And do not increase the wrongdoers except in destruction.",
      fr:"Seigneur, pardonne-moi, ainsi qu'à mes parents, à quiconque entre dans ma maison en croyant, ainsi qu'aux croyants et aux croyantes. Et n'ajoute aux injustes que perdition.", de:"Mein Herr, vergib mir, meinen Eltern und jedem der gläubig mein Haus betritt, sowie allen gläubigen Männern und Frauen. Und mehre für die Ungerechten nichts außer Verderben."}, benefit:{en:"The dua of Prophet Nuh عليه السلام. A beautiful and comprehensive supplication that covers oneself, parents, all who enter the home in faith, and all believing men and women.",fr:"L'invocation du Prophète Nuh عليه السلام. Une belle supplication complète qui couvre soi-même, les parents, tous ceux qui entrent dans la maison avec foi, et tous les croyants.",de:"Das Dua des Propheten Nuh عليه السلام. Eine schöne umfassende Bitte die sich selbst, Eltern, alle die gläubig das Haus betreten und alle gläubigen Männer und Frauen umfasst."},
    source:["Quran 71:28"] },

  { id:190, catId:"parents", type:"dua", order:3,
    title:{en:"Dua for mercy upon parents (Quran 17:24)",fr:"Invocation pour la miséricorde envers les parents (Coran 17:24)",de:"Dua um Barmherzigkeit für die Eltern (Quran 17:24)"},
    arabic:"رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا",
    transliteration:"Robbir-hamhumaa kamaa robbayaanii shoghiiroo.",
    translation:{
      en:"My Lord, have mercy upon them as they raised me when I was small.",
      fr:"Seigneur, fais-leur miséricorde comme ils m'ont élevé lorsque j'étais petit.",
      de:"Mein Herr, erbarme Dich ihrer, so wie sie mich aufgezogen haben, als ich klein war."},
    benefit:{en:"One of the most moving duas in the Quran. Allah commands this dua in Surah Al-Isra (17:23-24) as part of the commandment to honor parents. It is short, powerful and should be said regularly – especially for parents who have passed away.",fr:"L'une des invocations les plus touchantes du Coran. Allah commande cette invocation dans la sourate Al-Isra (17:23-24) dans le cadre du commandement d'honorer les parents. Elle est courte, puissante et doit être dite régulièrement – surtout pour les parents décédés.",de:"Eines der bewegendsten Duas im Quran. Allah befiehlt dieses Dua in Sure Al-Isra (17:23-24) als Teil des Gebots Eltern zu ehren. Es ist kurz, kraftvoll und sollte regelmäßig gesprochen werden – besonders für verstorbene Eltern."},
    source:["Quran 17:24"] },

  // ── CATEGORY: FAMILY ──
  
  { id:191, catId:"family", type:"dua", order:1,
    title:{en:"Grant us comfort in spouses and children (Quran 25:74)",fr:"Accorde-nous la joie en nos époux et enfants (Coran 25:74)",de:"Schenke uns Freude durch Ehepartner und Kinder (Quran 25:74)"},
    arabic:"رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا",
    transliteration:"Robbanaa hab lanaa min azwaajinaa wa dzurriyyaatinaa qurrota a-yun, waj-alnaa lil muttaqiina imaamaa.",
    translation:{
      en:"Our Lord, grant us from among our spouses and offspring comfort to our eyes and make us leaders for the righteous.",
      fr:"Seigneur, accorde-nous en nos épouses et notre descendance une source de joie pour nos yeux et fais de nous des guides pour les pieux.", de:"Unser Herr, schenke uns durch unsere Ehepartner und Nachkommen Freude für unsere Augen und mache uns zu Vorbildern für die Gottesfürchtigen."}, benefit:{en:"The dua of the servants of the Most Merciful (Ibad ar-Rahman) in Surah Al-Furqan. It asks not just for a good family but to be an Imam – a righteous leader and example for others.",fr:"L'invocation des serviteurs du Très Miséricordieux dans la sourate Al-Furqan. Elle demande non seulement une bonne famille mais d'être un imam – un guide vertueux et un exemple pour les autres.",de:"Das Dua der Diener des Allerbarmderzigen in Sure Al-Furqan. Es bittet nicht nur um eine gute Familie sondern darum ein Imam zu sein – ein rechtschaffener Anführer und Vorbild für andere."}, source:["Quran 25:74"] },

  { id:192, catId:"family", type:"dua", order:2, title:{en:"Increase my wealth and children – short version",fr:"Augmente mes biens et mes enfants – version courte",de:"Mehre mein Vermögen und meine Kinder – kurze Version"},
    arabic:"اَللَّهُمَّ أَكْثِرْ مَالِي، وَوَلَدِي، وَبَارِكْ لِي فِيمَا أَعْطَيْتَنِي",
    transliteration:"Allaahumma ak-tsir maalii wa waladii, wa baarik lii fiimaa a'thoitanii.",
    translation:{ en:"O Allah, increase my wealth and my children, and bless what You have given me.", fr:"Ô Allah, multiplie mes biens et mes enfants et bénis ce que Tu m'as accordé.",
      de:"O Allah, vermehre mein Vermögen und meine Kinder und segne das was Du mir gegeben hast."},
    benefit:{en:"The Prophet ﷺ made this dua for Anas ibn Malik رضي الله عنه. It shows that asking for increase in wealth and children is a beloved dua, not something to be ashamed of.",fr:"Le Prophète ﷺ a fait cette invocation pour Anas ibn Malik رضي الله عنه. Cela montre que demander une augmentation des biens et des enfants est une invocation aimée.",de:"Der Prophet ﷺ sprach dieses Dua für Anas ibn Malik رضي الله عنه. Es zeigt dass um Vermehrung von Reichtum und Kindern zu bitten ein geliebtes Dua ist."},
    source:["Sahih Bukhari","Sahih Muslim"] },

  { id:193, catId:"family", type:"dua", order:3,
    title:{en:"Increase wealth and children – full version",fr:"Augmente biens et enfants – version complète",de:"Mehre Vermögen und Kinder – vollständige Version"},
    arabic:"اَللَّهُمَّ أَكْثِرْ مَالِي، وَوَلَدِي، وَبَارِكْ لِي فِيمَا أَعْطَيْتَنِي، وَأَطِلْ حَيَاتِي عَلَى طَاعَتِكَ، وَأَحْسِنْ عَمَلِي، وَاغْفِرْ لِي",
    transliteration:"Allaahumma ak-tsir maalii wa waladii, wa baarik lii fiimaa a'thoitanii, wa athil hayaatii 'alaa thoo'atik, wa ahsin 'amalii, wagh-fir lii.",
    translation:{
      en:"O Allah, increase my wealth and my children, bless what You have given me, prolong my life in obedience to You, improve my deeds and forgive me.",
      fr:"Ô Allah, multiplie mes biens et mes enfants, bénis ce que Tu m'as accordé, prolonge ma vie dans Ton obéissance, améliore mes actions et pardonne-moi.", de:"O Allah, vermehre mein Vermögen und meine Kinder, segne das was Du mir gegeben hast, verlängere mein Leben in Deinem Gehorsam, verbessere meine Taten und vergib mir."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:194, catId:"family", type:"dua", order:4,     title:{en:"Dua of Prophet Ibrahim – grant righteous offspring (Quran 37:100)",fr:"Invocation du Prophète Ibrahim – accorde une descendance vertueuse (Coran 37:100)",de:"Dua des Propheten Ibrahim – schenke rechtschaffene Nachkommen (Quran 37:100)"},     arabic:"رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ",     transliteration:"Robbi hab lii minash-shoolihiin.",
    translation:{ en:"My Lord, grant me [a child] from among the righteous.", fr:"Seigneur, accorde-moi une descendance parmi les vertueux.", de:"Mein Herr, schenke mir einen rechtschaffenen Nachkommen."}, benefit:{en:"The dua of Prophet Ibrahim عليه السلام when asking for a righteous child. A concise and powerful supplication for those wishing for children or wishing for their children to be righteous.",fr:"L'invocation du Prophète Ibrahim عليه السلام pour demander un enfant vertueux. Une supplication concise et puissante pour ceux qui souhaitent des enfants ou que leurs enfants soient vertueux.",de:"Das Dua des Propheten Ibrahim عليه السلام beim Bitten um ein rechtschaffenes Kind. Eine prägnante und kraftvolle Bitte für jene die sich Kinder oder rechtschaffene Kinder wünschen."}, source:["Quran 37:100"] },

  { id:195, catId:"family", type:"dua", order:5, title:{en:"Do not leave me without offspring (Quran 21:89)",fr:"Ne me laisse pas sans descendance (Coran 21:89)",de:"Lass mich nicht ohne Nachkommen (Quran 21:89)"},
    arabic:"رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ",
    transliteration:"Robbi laa tadzarnii fardan, wa anta khoirul waaritsiin.",
    translation:{
      en:"My Lord, do not leave me alone without offspring, and You are the best of inheritors.",
      fr:"Seigneur, ne me laisse pas seul sans descendance, et Tu es le meilleur des héritiers.", de:"Mein Herr, lass mich nicht allein ohne Nachkommen, und Du bist der beste Erbe."}, benefit:{en:"The dua of Prophet Zakariyya عليه السلام when asking Allah for a child in his old age. Allah answered him with Yahya (John). A powerful dua for those struggling with infertility.",fr:"L'invocation du Prophète Zakariyya عليه السلام pour demander à Allah un enfant dans sa vieillesse. Allah lui répondit avec Yahya (Jean). Une invocation puissante pour ceux qui luttent contre l'infertilité.",de:"Das Dua des Propheten Zakariyya عليه السلام beim Bitten um ein Kind in seinem Alter. Allah antwortete ihm mit Yahya (Johannes). Ein kraftvolles Dua für jene die mit Unfruchtbarkeit kämpfen."}, source:["Quran 21:89"] },

  { id:196, catId:"family", type:"dua", order:6, title:{en:"Gratitude, righteousness and righteous offspring (Quran 46:15)",fr:"Gratitude, vertu et descendance vertueuse (Coran 46:15)",de:"Dankbarkeit, Rechtschaffenheit und rechtschaffene Nachkommen (Quran 46:15)"},
    arabic:"رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ",
    transliteration:"Robbi auzi-nii an asykuro ni-matakallatii an-amta 'alayya wa 'alaa waalidayya wa an a-mala shoolihan tardhoohu, wa ashlih lii fii dzurriyyatii, innii tubtu ilaika wa innii minal muslimiin.",
    translation:{
      en:"My Lord, enable me to be grateful for Your blessing upon me and upon my parents, and to do righteousness that You approve. And make righteous for me my offspring. Indeed I have repented to You and indeed I am of the Muslims.",
      fr:"Seigneur, inspire-moi à être reconnaissant pour Ton bienfait accordé à moi et à mes parents, et à accomplir des œuvres vertueuses qui T'agréent. Et accorde-moi une descendance vertueuse. Je me repens à Toi et je suis parmi les musulmans.", de:"Mein Herr, gib mir ein dankbar zu sein für Deine Gnade die Du mir und meinen Eltern gewährt hast, und Rechtschaffenheit zu tun die Du billigst. Und mache meine Nachkommen rechtschaffen. Wahrlich ich habe mich Dir zugewendet und ich gehöre zu den Muslimen."}, benefit:{en:"This dua is recommended to be recited when one reaches 40 years of age, as mentioned in the verse context. It combines gratitude, righteous deeds, and a prayer for righteous children.",fr:"Cette invocation est recommandée à réciter quand on atteint 40 ans, comme mentionné dans le contexte du verset. Elle combine gratitude, bonnes actions et prière pour des enfants vertueux.",de:"Dieses Dua wird empfohlen wenn man 40 Jahre alt wird, wie im Verskontext erwähnt. Es verbindet Dankbarkeit, rechtschaffene Taten und ein Gebet für rechtschaffene Kinder."}, source:["Quran 46:15"] },

  { id:197, catId:"family", type:"dua", order:7,     title:{en:"Dua for a child – forgiveness, pure heart and chastity",fr:"Invocation pour un enfant – pardon, cœur pur et chasteté",de:"Dua für ein Kind – Vergebung, reines Herz und Keuschheit"},     arabic:"اَللَّهُمَّ اغْفِرْ ذَنْبَهُ، وَطَهِّرْ قَلْبَهُ، وَحَصِّنْ فَرْجَهُ",     transliteration:"Allaahummagh-fir dzanbahu, wa thohhir qolbahu, wa hash-shin farjahu.",
    translation:{ en:"O Allah, forgive his sins, purify his heart and protect his chastity.", fr:"Ô Allah, pardonne ses péchés, purifie son cœur et protège sa chasteté.", de:"O Allah, vergib ihm seine Sünden, reinige sein Herz und bewahre seine Keuschheit."}, benefit:{en:"A powerful dua to make for children and young family members. The three requests – forgiveness of sins, purification of the heart, and protection of chastity – are the most important foundations for a righteous life.",fr:"Une puissante invocation à faire pour les enfants et les jeunes membres de la famille. Les trois demandes – pardon des péchés, purification du cœur et protection de la chasteté – sont les fondements les plus importants pour une vie vertueuse.",de:"Ein kraftvolles Dua für Kinder und junge Familienmitglieder. Die drei Bitten – Vergebung der Sünden, Reinigung des Herzens und Schutz der Keuschheit – sind die wichtigsten Grundlagen für ein rechtschaffenes Leben."}, source:["Ahmad","Authenticated"] },

  // ── CATEGORY: NEWBORN ── 
  { id:198, catId:"newborn", type:"info", order:1,     title:{en:"No specific prescribed dua for newborns",fr:"Pas d'invocation spécifique prescrite pour les nouveau-nés",de:"Kein fest vorgeschriebenes Dua für Neugeborene"},
    content:{
      en:"There is no specific prescribed dua from the Prophet ﷺ for blessing a newborn at birth. One may supplicate freely in any language, for example: 'May Allah bless you and grant you a long, righteous life.' What is established sunnah is: reciting the Adhan in the right ear, giving the child a good name, performing Aqiqah on the 7th day, and reciting the protection duas below.",
      fr:"Il n'existe pas d'invocation spécifique prescrite du Prophète ﷺ pour bénir un nouveau-né à la naissance. On peut invoquer librement dans n'importe quelle langue, par exemple : Qu'Allah te bénisse et t'accorde une longue vie vertueuse.' Ce qui est une sunna établie : réciter l'adhan dans l'oreille droite, donner un beau prénom, faire l'Aqiqah le 7ème jour, et réciter les invocations de protection ci-dessous.',       de:'Es gibt keine spezifische vorgeschriebene Dua vom Propheten ﷺ für die Segnung eines Neugeborenen. Man kann frei in jeder Sprache beten, z.B.: 'Möge Allah dich segnen und dir ein langes rechtschaffenes Leben gewähren.' Was etablierte Sunnah ist: den Adhan ins rechte Ohr sprechen, dem Kind einen guten Namen geben, Aqiqah am 7. Tag durchführen, und die Schutz-Duas unten rezitieren."},
    source:["Sahih Bukhari","Scholars consensus"] },

  { id:199, catId:"newborn", type:"dua", order:2,
    title:{en:"Protection from Shaytan for the newborn",fr:"Protection contre Shaytan pour le nouveau-né",de:"Schutz vor Shaytan für das Neugeborene"},
    instruction:{en:"Say for a boy: 'u'iidzuhu' and 'dzurriyyatahu'. For a girl: 'u'iidzuhaa' and 'dzurriyyatahaa'.",fr:"Dire pour un garçon : 'u'iidzuhu' et 'dzurriyyatahu'. Pour une fille : 'u'iidzuhaa' et 'dzurriyyatahaa'.",de:"Für einen Jungen sagen: 'u'iidzuhu' und 'dzurriyyatahu'. Für ein Mädchen: 'u'iidzuhaa' und 'dzurriyyatahaa'."},
    arabic:"اَللَّهُمَّ إِنِّي أُعِيذُهُ بِكَ وَذُرِّيَّتَهُ مِنَ الشَّيْطَانِ الرَّجِيمِ",
    transliteration:"Allaahumma innii u'iidzuhu bika wa dzurriyyatahu minasy-syaithoonir-rojiim.",
    translation:{ en:"O Allah, I seek protection for him and his offspring from the accursed devil. (For a girl: her and her offspring)", fr:"Ô Allah, je Te demande de protéger cet enfant et sa descendance contre le diable maudit.", de:"O Allah, ich bitte Dich um Schutz für ihn und seine Nachkommenschaft vor dem verfluchten Satan. (Für ein Mädchen: sie und ihre Nachkommenschaft)"}, benefit:{en:"This is the dua that the mother of Maryam عليها السلام made for her newborn daughter. As a result, the Prophet ﷺ said: 'No child is born without being touched by Shaytan at birth – except Maryam and her son.' This dua is protection from that touch.",fr:"C'est l'invocation que fit la mère de Maryam عليها السلام pour sa fille nouveau-née. En conséquence le Prophète ﷺ dit : Aucun enfant ne nait sans etre touche par Shaytan a la naissance - sauf Maryam et son fils. Cette invocation est une protection contre ce toucher.",de:"Dies ist das Dua das die Mutter von Maryam عليها السلام für ihre neugeborene Tochter sprach. Daraufhin sagte der Prophet ﷺ: 'Kein Kind wird geboren ohne von Shaytan bei der Geburt berührt zu werden – außer Maryam und ihr Sohn.' Dieses Dua ist Schutz vor dieser Berührung."}, source:["Sahih Bukhari","Sahih Muslim","Quran 3:36"] },

  { id:200, catId:"newborn", type:"dua", order:3, title:{en:"Protection through the perfect words of Allah",fr:"Protection par les paroles parfaites d'Allah",de:"Schutz durch die vollkommenen Worte Allahs"},
    instruction:{en:"Blow lightly on the child after reciting. For a boy say 'u'iidzuka', for a girl say 'u'iidzuki'.",fr:"Souffler doucement sur l'enfant après avoir récité. Pour un garçon dire 'u'iidzuka', pour une fille 'u'iidzuki'.",de:"Nach dem Rezitieren leicht auf das Kind blasen. Für einen Jungen 'u'iidzuka' sagen, für ein Mädchen 'u'iidzuki'."},     arabic:"أُعِيْذُكَ بِكَلِمَاتِ اللَّهِ التَّامَّةِ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ",     transliteration:"U'iidzuka bikalimaatillaahit-taammah, min kulli syaithoonin wa haammah, wa min kulli 'ainin laammah.",
    translation:{ en:"I seek protection for you through the perfect words of Allah from every devil, every harmful creature, and every evil eye.", fr:"Je cherche protection pour toi par les paroles parfaites d'Allah contre tout démon, toute créature nuisible et tout mauvais regard.", de:"Ich suche Schutz für dich durch die vollkommenen Worte Allahs vor jedem Teufel, jedem schädlichen Geschöpf und jedem bösen Blick."}, benefit:{en:"The Prophet ﷺ would say this for Al-Hasan and Al-Husain رضي الله عنهما. He said: 'Your father Ibrahim used to seek protection for Ismail and Isaac with these words.' An established sunnah for newborns and young children.",fr:"Le Prophète ﷺ disait cela pour Al-Hasan et Al-Husain رضي الله عنهما. Il dit : 'Votre père Ibrahim cherchait protection pour Ismail et Isaac avec ces paroles.' Une sunna établie pour les nouveau-nés et les jeunes enfants.",de:"Der Prophet ﷺ sagte dies für Al-Hasan und Al-Husain رضي الله عنهما. Er sagte: 'Euer Vater Ibrahim suchte mit diesen Worten Schutz für Ismail und Isaak.' Eine etablierte Sunnah für Neugeborene und kleine Kinder."},
    source:["Sahih Bukhari"] },

  // ── CATEGORY: STEADFASTNESS ──
  
  { id:201, catId:"steadfast", type:"dua", order:1,
    title:{en:"O Turner of hearts – keep my heart firm on Your religion",fr:"Ô Toi qui retournes les cœurs – affermis mon cœur sur Ta religion",de:"O Du der die Herzen wendet – festige mein Herz auf Deiner Religion"},
    arabic:"يَا مُقَلِّبَ الْقُلُوبِ، ثَبِّتْ قَلْبِى عَلَى دِينِكَ",
    transliteration:"Yaa muqollibal quluub, tsabbit qolbii 'alaa diinik.",
    translation:{ en:"O Turner of the hearts, keep my heart firm upon Your religion.", fr:"Ô Toi qui retournes les cœurs, affermis mon cœur sur Ta religion.", de:"O Du der die Herzen wendet, festige mein Herz auf Deiner Religion."}, benefit:{en:"The Prophet ﷺ frequently recited this dua. Aisha رضي الله عنها said he recited it often. He explained that every heart is between two fingers of the Most Merciful who turns them as He wills. Reciting this shows awareness of how the heart can change and dependence on Allah to keep it firm.",fr:"Le Prophète ﷺ récitait souvent cette invocation. Aïcha رضي الله عنها dit qu'il la récitait fréquemment. Il expliqua que tout cœur est entre deux doigts du Très Miséricordieux qui les retourne comme Il le veut. La réciter montre la conscience que le cœur peut changer.",de:"Der Prophet ﷺ rezitierte dieses Dua häufig. Aisha رضي الله عنها sagte er rezitierte es oft. Er erklärte dass jedes Herz zwischen zwei Fingern des Allerbarmderzigen ist der sie nach Seinem Willen wendet. Es zu rezitieren zeigt das Bewusstsein dass das Herz sich ändern kann."},
    source:["At-Tirmidhi","Sahih"] },

  { id:202, catId:"steadfast", type:"dua", order:2,
    title:{en:"O Controller of hearts – direct our hearts to obedience",fr:"Ô Toi qui diriges les cœurs – dirige nos cœurs vers Ton obéissance",de:"O Lenker der Herzen – richte unsere Herzen auf Deinen Gehorsam"},
    arabic:"اَللَّهُمَّ مُصَرِّفَ الْقُلُوبِ، صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ",
    transliteration:"Allaahumma mushorrifal quluub, shorrif quluubanaa 'alaa thoo'atik.",
    translation:{
      en:"O Allah, Controller of the hearts, direct our hearts toward obedience to You.",
      fr:"Ô Allah, Toi qui diriges les cœurs, dirige nos cœurs vers Ton obéissance.", de:"O Allah, Lenker der Herzen, richte unsere Herzen auf Deinen Gehorsam aus."}, benefit:{en:"A comprehensive version that uses the name 'Musarrif al-Qulub' – the One who steers and directs hearts. Asking not just for firmness but for active direction toward obedience.",fr:"Une version complète qui utilise le nom 'Musarrif al-Qulub' – Celui qui dirige les cœurs. Demandant non seulement la fermeté mais une direction active vers l'obéissance.",de:"Eine umfassende Version die den Namen 'Musarrif al-Qulub' verwendet – Derjenige der Herzen lenkt und steuert. Er bittet nicht nur um Standhaftigkeit sondern um aktive Ausrichtung zum Gehorsam."}, source:["Sahih Muslim"] },

  { id:203, catId:"steadfast", type:"dua", order:3,     title:{en:"O Turner of hearts – turn our hearts to Your religion",fr:"Ô Toi qui diriges les cœurs – tourne nos cœurs vers Ta religion",de:"O Lenker der Herzen – wende unsere Herzen zu Deiner Religion"},     arabic:"اَللَّهُمَّ يَا مُصَرِّفَ الْقُلُوْبِ، صَرِّفْ قُلُوْبَنَا عَلَى دِيْنِكَ",     transliteration:"Allaahumma yaa mushorrifal quluub, shorrif quluubanaa 'alaa diinik.",
    translation:{
      en:"O Allah, Turner of the hearts, turn our hearts toward Your religion.",
      fr:"Ô Allah, Toi qui diriges les cœurs, tourne nos cœurs vers Ta religion.", de:"O Allah, Lenker der Herzen, wende unsere Herzen zu Deiner Religion."}, benefit:{en:"The difference between entries 2 and 3: Entry 2 asks for direction toward obedience (ta'a – performing acts), while entry 3 asks for direction toward the religion (din – the whole way of life). Together they complement each other perfectly.",fr:"La différence entre les entrées 2 et 3 : l'entrée 2 demande la direction vers l'obéissance (actes), tandis que l'entrée 3 demande la direction vers la religion (mode de vie complet). Ensemble elles se complètent parfaitement.",de:"Der Unterschied zwischen Eintrag 2 und 3: Eintrag 2 bittet um Ausrichtung zum Gehorsam (Taten), während Eintrag 3 um Ausrichtung zur Religion (gesamter Lebensstil) bittet. Zusammen ergänzen sie sich perfekt."},
    source:["Sahih Muslim"] },

  // ── CATEGORY: FORGIVENESS & MERCY ──
  
  { id:204, catId:"forgiveness", type:"dua", order:1,
    title:{en:"We believe – forgive and have mercy (Quran 23:109)",fr:"Nous croyons – pardonne et fais miséricorde (Coran 23:109)",de:"Wir glauben – vergib und erbarme Dich (Quran 23:109)"},
    arabic:"رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنْتَ خَيْرُ الرَّاحِمِينَ",
    transliteration:"Robbanaa aamannaa fagh-fir lanaa warhamnaa, wa anta khoirur-roohimiin.",
    translation:{en:"Our Lord, we have believed, so forgive us and have mercy upon us, and You are the best of the merciful.",fr:"Seigneur, nous croyons, pardonne-nous et fais-nous miséricorde, et Tu es le meilleur des miséricordieux.",de:"Unser Herr, wir haben geglaubt, so vergib uns und erbarme Dich unser, und Du bist der Beste der Barmherzigen."},
    source:["Quran 23:109"] },

  { id:205, catId:"forgiveness", type:"dua", order:2,
    title:{en:"Forgive and have mercy – short (Quran 23:118)",fr:"Pardonne et fais miséricorde – court (Coran 23:118)",de:"Vergib und erbarme Dich – kurz (Quran 23:118)"},
    arabic:"رَبِّ اغْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ الرَّاحِمِينَ",
    transliteration:"Robbigh-fir warham, wa anta khoirur-roohimiin.",
    translation:{en:"My Lord, forgive and have mercy, and You are the best of the merciful.",fr:"Seigneur, pardonne et fais miséricorde, et Tu es le meilleur des miséricordieux.",de:"Mein Herr, vergib und erbarme Dich, und Du bist der Beste der Barmherzigen."},
    source:["Quran 23:118"] },

  { id:206, catId:"forgiveness", type:"dua", order:3,
    title:{en:"Dua of Adam and Hawwa – we wronged ourselves (Quran 7:23)",fr:"Invocation d'Adam et Hawwa – nous nous sommes lésés (Coran 7:23)",de:"Dua von Adam und Hawwa – wir haben uns Unrecht getan (Quran 7:23)"},     arabic:"رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ",     transliteration:"Robbanaa zholamnaa anfusanaa, wa in lam tagh-fir lanaa wa tarhamnaa, lanakuunanna minal khoosiriin.",
    translation:{en:"Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy on us, we will surely be among the losers.",fr:"Seigneur, nous nous sommes fait du tort, et si Tu ne nous pardonnes pas et ne nous fais pas miséricorde, nous serons certes parmi les perdants.",de:"Unser Herr, wir haben uns selbst Unrecht getan, und wenn Du uns nicht vergibst und uns nicht barmherzig bist, werden wir gewiss zu den Verlierenden gehören."}, benefit:{en:"The first dua taught by Allah to Adam and Hawwa عليهما السلام after they erred. It is the model of sincere repentance: acknowledging wrongdoing and total dependence on Allahs forgiveness.",fr:"La première invocation enseignée par Allah à Adam et Hawwa عليهما السلام après leur faute. C'est le modèle du repentir sincère : reconnaître la faute et dépendre totalement du pardon d'Allah.",de:"Das erste Dua das Allah Adam und Hawwa عليهما السلام nach ihrem Fehler lehrte. Es ist das Modell aufrichtiger Reue: das Unrecht eingestehen und völlig auf Allahs Vergebung angewiesen sein."}, source:["Quran 7:23"] },

  { id:207, catId:"forgiveness", type:"dua", order:4,     title:{en:"Dua of Prophet Musa – I wronged myself, forgive me (Quran 28:16)",fr:"Invocation du Prophète Musa – je me suis lésé, pardonne-moi (Coran 28:16)",de:"Dua des Propheten Musa – ich habe mir Unrecht getan, vergib mir (Quran 28:16)"},     arabic:"رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي",     transliteration:"Robbi innii zholamtu nafsii, fagh-fir lii.",
    translation:{en:"My Lord, indeed I have wronged myself, so forgive me.",fr:"Seigneur, j'ai fait du tort à moi-même, pardonne-moi.",de:"Mein Herr, wahrlich ich habe mir selbst Unrecht getan, so vergib mir."},
    benefit:{en:"Short and sincere. The Prophet ﷺ said the best repentance includes acknowledging your sin and asking directly for forgiveness. Prophet Musa عليه السلام made this dua and Allah forgave him.",fr:"Court et sincère. Le Prophète ﷺ a dit que le meilleur repentir consiste à reconnaître son péché et à demander directement le pardon. Le Prophète Musa عليه السلام a fait cette invocation et Allah l'a pardonné.",de:"Kurz und aufrichtig. Der Prophet ﷺ sagte die beste Reue beinhaltet die Sünde einzugestehen und direkt um Vergebung zu bitten. Prophet Musa عليه السلام sprach dieses Dua und Allah vergab ihm."}, source:["Quran 28:16"] },

  { id:208, catId:"forgiveness", type:"dua", order:5,     title:{en:"Five comprehensive requests – forgiveness to provision",fr:"Cinq demandes complètes – du pardon à la subsistance",de:"Fünf umfassende Bitten – von Vergebung bis Versorgung"},     arabic:"اَللَّهُمَّ اغْفِرْ لِيْ، وَارْحَمْنِيْ، وَاهْدِنِيْ، وَعَافِنِيْ، وَارْزُقْنِيْ",     transliteration:"Allaahummagh-fir lii, warhamnii, wahdinii, wa-aafinii, warzuqnii.",
    translation:{en:"O Allah, forgive me, have mercy on me, guide me, grant me health, and provide for me.",fr:"Ô Allah, pardonne-moi, fais-moi miséricorde, guide-moi, accorde-moi la santé et pourvois à mes besoins.",de:"O Allah, vergib mir, erbarme Dich meiner, leite mich, gewähre mir Gesundheit und versorge mich."}, benefit:{en:"The Prophet ﷺ said these five words contain all that a person needs in this life and the next. Short but covering everything: forgiveness, mercy, guidance, health and provision.",fr:"Le Prophète ﷺ a dit que ces cinq mots contiennent tout ce dont une personne a besoin dans cette vie et dans la suivante.",de:"Der Prophet ﷺ sagte diese fünf Worte enthalten alles was ein Mensch in diesem Leben und im nächsten braucht."}, source:["Sahih Muslim"] },

  { id:209, catId:"forgiveness", type:"dua", order:6,     title:{en:"Four requests – forgiveness, mercy, health, provision",fr:"Quatre demandes – pardon, miséricorde, santé, subsistance",de:"Vier Bitten – Vergebung, Barmherzigkeit, Gesundheit, Versorgung"},     arabic:"اَللَّهُمَّ اغْفِرْ لِيْ، وَارْحَمْنِيْ، وَعَافِنِيْ، وَارْزُقْنِيْ",     transliteration:"Allaahummagh-fir lii, warhamnii, wa-aafinii, warzuqnii.",
    translation:{en:"O Allah, forgive me, have mercy on me, grant me well-being, and provide for me.",fr:"Ô Allah, pardonne-moi, fais-moi miséricorde, accorde-moi la santé et pourvois à mes besoins.",de:"O Allah, vergib mir, erbarme Dich meiner, gewähre mir Wohlbefinden und versorge mich."}, source:["Sahih Muslim"] },

  { id:210, catId:"forgiveness", type:"dua", order:7,     title:{en:"Forgive sins, strengthen feet, grant victory (Quran 3:147)",fr:"Pardonne les péchés, affermis les pas, accorde la victoire (Coran 3:147)",de:"Vergib Sünden, festige Schritte, gewähre Sieg (Quran 3:147)"},     arabic:"رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",     transliteration:"Robbanagh-fir lanaa dzunuubanaa wa israafanaa fii amrinaa wa tsabbit aqdaamanaa wanshurnaa alal qoumil kaafiriin.",
    translation:{en:"Our Lord, forgive us our sins and our excesses in our affairs, keep our feet firm, and grant us victory over the disbelieving people.",fr:"Seigneur, pardonne-nous nos péchés et nos excès dans nos affaires, affermis nos pas et accorde-nous la victoire sur les incroyants.",de:"Unser Herr, vergib uns unsere Sünden und unsere Übertretungen in unseren Angelegenheiten, festige unsere Schritte und gib uns Sieg über das ungläubige Volk."}, source:["Quran 3:147"] },

  { id:211, catId:"forgiveness", type:"dua", order:8,     title:{en:"Comprehensive forgiveness dua – mistakes, ignorance and excesses",fr:"Invocation de pardon complète – fautes, ignorance et excès",de:"Umfassendes Vergebungs-Dua – Fehler, Unwissenheit und Übertretungen"},     arabic:"اَللَّهُمَّ اغْفِرْ لِيْ خَطَايَايَ، وَجَهْلِيْ، وَإِسْرَافِيْ فِيْ أَمْرِيْ، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّيْ، اَللَّهُمَّ اغْفِرْ لِيْ جِدِّيْ وَهَزْلِيْ، وَخَطَأيَ وَعَمْدِيْ، وَكُلُّ ذَلِكَ عِنْدِيْ",     transliteration:"Allaahummagh-fir lii khothooyaaya, wa jahlii, wa israafii fii amrii, wa maa anta a'lamu bihi minnii. Allaahummagh-fir lii jiddii wa hazlii, wa khothoo-i wa 'amdii, wa kullu dzaalika 'indii.",
    translation:{en:"O Allah, forgive me my mistakes, my ignorance, my excesses in my affairs, and all that You know better than I. O Allah, forgive me what I did seriously and in jest, my mistakes and my intentional acts – all of that is within me.",fr:"Ô Allah, pardonne-moi mes fautes, mon ignorance, mes excès dans mes affaires, et tout ce que Tu connais mieux que moi. Ô Allah, pardonne-moi ce que j'ai fait sérieusement et en plaisantant, mes erreurs et mes actes intentionnels – tout cela est en moi.",de:"O Allah, vergib mir meine Fehler, meine Unwissenheit, meine Übertretungen in meinen Angelegenheiten und alles was Du besser als ich weißt. O Allah, vergib mir was ich ernsthaft und im Scherz getan habe, meine Fehler und meine absichtlichen Taten – all das ist bei mir."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:212, catId:"forgiveness", type:"dua", order:9,     title:{en:"We believe – forgive and protect from Fire (Quran 3:16)",fr:"Nous croyons – pardonne et protège du Feu (Coran 3:16)",de:"Wir glauben – vergib und schütze vor dem Feuer (Quran 3:16)"},     arabic:"رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ",     transliteration:"Robbanaa innanaa aamannaa fagh-fir lanaa dzunuubanaa wa qinaa adzaaban-naar.",
    translation:{en:"Our Lord, we believe, so forgive us our sins and protect us from the punishment of the Fire.",fr:"Seigneur, nous croyons, pardonne-nous nos péchés et préserve-nous du châtiment du Feu.",de:"Unser Herr, wir glauben, vergib uns unsere Sünden und bewahre uns vor der Strafe des Feuers."}, source:["Quran 3:16"] },

  { id:213, catId:"forgiveness", type:"dua", order:10,     title:{en:"Dua of the believers at the call to faith (Quran 3:193–194)",fr:"Invocation des croyants à l'appel à la foi (Coran 3:193–194)",de:"Dua der Gläubigen beim Ruf zum Glauben (Quran 3:193–194)"},
    arabic:"رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا ۚ رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ ۝ رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ ۗ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ",
    transliteration:"Robbanaa innanaa sami'naa munaadiyay-yunaadii lil-iimaani an aaminuu birrobbikum fa-aamannaa. Robbanaa fagh-fir lanaa dzunuubanaa wa kaffir 'annaa sayyi-aatinaa wa tawaffanaa ma-al abraar. Robbanaa wa aatinaa maa wa-adttanaa 'alaa rusulika wa laa tukhzinaa yaumal qiyaamah, innaka laa tukhliful mii-aad.",
    translation:{en:"Our Lord, we heard a caller calling to faith: Believe in your Lord, so we believed. Our Lord, forgive us our sins and remove our misdeeds and cause us to die with the righteous. Our Lord, grant us what You promised through Your messengers and do not disgrace us on the Day of Resurrection. Indeed, You do not fail in Your promise.",fr:"Seigneur, nous avons entendu un appel criant à la foi : Croyez en votre Seigneur ! Et nous avons cru. Seigneur, pardonne-nous nos péchés, efface nos mauvaises actions et fais-nous mourir parmi les vertueux. Seigneur, accorde-nous ce que Tu nous as promis par Tes messagers et ne nous humilie pas au Jour du Jugement. Tu ne manques pas à Ta promesse.",de:"Unser Herr, wir hörten einen Rufer der zum Glauben rief: Glaubt an euren Herrn! So glaubten wir. Unser Herr, vergib uns unsere Sünden, tilge unsere schlechten Taten und lass uns mit den Rechtschaffenen sterben. Unser Herr, gib uns was Du uns durch Deine Gesandten versprochen hast und blamiere uns nicht am Tag der Auferstehung. Wahrlich Du brichst Dein Versprechen nicht."}, source:["Quran 3:193-194"] },

  { id:214, catId:"forgiveness", type:"dua", order:11,     title:{en:"Forgiveness for us and our brothers in faith (Quran 59:10)",fr:"Pardon pour nous et nos frères en foi (Coran 59:10)",de:"Vergebung für uns und unsere Glaubensbrüder (Quran 59:10)"},     arabic:"رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَّحِيمٌ",     transliteration:"Robbanagh-fir lanaa wa li-ikhwaaninaal-ladziina sabaquunaa bil-iimaani wa laa taj-al fii quluubinaa ghillan lil-ladziina aamanuu, robbanaa innaka ro-uufur-rohiim.",
    translation:{en:"Our Lord, forgive us and our brothers who preceded us in faith and put not in our hearts any resentment toward those who have believed. Our Lord, indeed You are Kind and Merciful.",fr:"Seigneur, pardonne-nous ainsi qu'à nos frères qui nous ont précédés dans la foi, et ne mets pas dans nos cœurs de rancœur envers ceux qui ont cru. Seigneur, Tu es Très Clément et Très Miséricordieux.",de:"Unser Herr, vergib uns und unseren Brüdern die uns im Glauben vorangegangen sind und lege in unsere Herzen keinen Groll gegen die Gläubigen. Unser Herr, wahrlich Du bist Gütig und Barmherzig."},
    source:["Quran 59:10"] },

  { id:215, catId:"forgiveness", type:"dua", order:12,
    title:{en:"Forgive my sin on the Day of Judgment",fr:"Pardonne mon péché le Jour du Jugement",de:"Vergib mir meine Sünde am Tag des Gerichts"},
    arabic:"رَبِّ اغْفِرْ لِي خَطِيئَتِي يَوْمَ الدِّينِ",
    transliteration:"Robbigh-fir lii khothii-atii yaumad-diin.",
    translation:{en:"My Lord, forgive my sin on the Day of Judgment.",fr:"Seigneur, pardonne-moi mon péché le Jour du Jugement.",de:"Mein Herr, vergib mir meine Sünde am Tag des Gerichts."},
    source:["Ahmad","Authenticated"] },

  { id:216, catId:"forgiveness", type:"dua", order:13,
    title:{en:"You are our Protector – forgive and have mercy (Quran 7:155–156)",fr:"Tu es notre Protecteur – pardonne et fais miséricorde (Coran 7:155–156)",de:"Du bist unser Beschützer – vergib und erbarme Dich (Quran 7:155–156)"},
    arabic:"أَنتَ وَلِيُّنَا فَاغْفِرْ لَنَا وَارْحَمْنَا ۖ وَأَنتَ خَيْرُ الْغَافِرِينَ ۝ وَاكْتُبْ لَنَا فِي هَٰذِهِ الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ إِنَّا هُدْنَا إِلَيْكَ",
    transliteration:"Anta waliyyunaa fagh-fir lanaa warhamnaa wa anta khairul ghoofiiriin. Waktub lanaa fii haadzihid-dunyaa hasanatan wa fil aakhirah, innaa hudnaa ilaik.",
    translation:{en:"You are our Protector, so forgive us and have mercy upon us, and You are the best of those who forgive. And decree for us good in this world and in the Hereafter. Indeed, we have turned back to You.",fr:"Tu es notre Protecteur, pardonne-nous et fais-nous miséricorde, et Tu es le meilleur des pardonneurs. Et écris pour nous le bien dans cette vie et dans l'au-delà. Nous nous sommes tournés vers Toi.",de:"Du bist unser Beschützer, vergib uns und erbarme Dich unser, und Du bist der Beste der Vergebenden. Und bestimme für uns Gutes in dieser Welt und im Jenseits. Wahrlich wir haben uns Dir zugewandt."}, benefit:{en:"The dua of Prophet Musa عليه السلام for his people. It contains three powerful requests: forgiveness, mercy, and recorded good in both worlds. A perfect comprehensive supplication.",fr:"L'invocation du Prophète Musa عليه السلام pour son peuple. Elle contient trois demandes puissantes : pardon, miséricorde et bien inscrit dans les deux mondes.",de:"Das Dua des Propheten Musa عليه السلام für sein Volk. Es enthält drei kraftvolle Bitten: Vergebung, Barmherzigkeit und aufgezeichnetes Gutes in beiden Welten."},
    source:["Quran 7:155-156"] },

  // ── CATEGORY: PROTECTION FROM SHIRK ──
  
  { id:217, catId:"shirk", type:"dua", order:1,
    title:{en:"Refuge from knowingly committing Shirk",fr:"Refuge contre le Shirk commis sciemment",de:"Zuflucht vor wissentlichem Shirk"},
    arabic:"اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ أَنْ أُشْرِكَ بِكَ وَأَنَا أَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا لاَ أَعْلَمُ",
    transliteration:"Allaahumma innii a'uudzu bika an usyrika bika wa anaa a'lam, wa astagh-firuka limaa laa a'lam.",
    translation:{ en:"O Allah, I seek refuge in You from associating partners with You knowingly, and I ask Your forgiveness for what I do unknowingly.", fr:"Ô Allah, je cherche refuge auprès de Toi contre le fait de T'associer quoi que ce soit en le sachant, et je Te demande pardon pour ce que j'ignore.", de:"O Allah, ich suche Zuflucht bei Dir davor Dir wissentlich etwas beizugesellen, und ich bitte Dich um Vergebung für das was ich nicht weiß."}, benefit:{en:"The Prophet ﷺ said: 'Shirk among you is more hidden than the crawling of an ant.' He then taught this dua to protect against both hidden and open Shirk. It covers two fronts: seeking refuge from known Shirk and forgiveness for unknown Shirk.",fr:"Le Prophète ﷺ a dit : 'Le Shirk parmi vous est plus caché que le rampement d'une fourmi.' Il enseigna ensuite cette invocation pour se protéger contre le Shirk caché et manifeste. Elle couvre deux fronts : chercher refuge contre le Shirk connu et pardon pour le Shirk inconnu.",de:"Der Prophet ﷺ sagte: 'Der Shirk unter euch ist versteckter als das Kriechen einer Ameise.' Er lehrte dann dieses Dua zum Schutz vor verborgenem und offenem Shirk. Es deckt zwei Seiten ab: Zuflucht vor bekanntem Shirk und Vergebung für unbekannten Shirk."},
    source:["Ahmad","Sahih Al-Albani"] },

  { id:218, catId:"shirk", type:"dua", order:2,
    title:{en:"Refuge from Shirk – known and unknown",fr:"Refuge contre le Shirk – su et inconnu",de:"Zuflucht vor Shirk – bewusst und unbewusst"},
    arabic:"اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنْ أَنْ أُشْرِكَ بِكَ شَيْئًا وَأَنَا أَعْلَمُ، وَأَعُوْذُ بِكَ مِنْ أَنْ أُشْرِكَ بِكَ وَأَنَا لاَ أَعْلَمُ",
    transliteration:"Allaahumma innii a'uudzu bika min an usyrika bika syai-an wa anaa a'lam, wa a'uudzu bika min an usyrika bika wa anaa laa a'lam.",
    translation:{
      en:"O Allah, I seek refuge in You from associating anything with You knowingly, and I seek refuge in You from associating anything with You unknowingly.",
      fr:"Ô Allah, je cherche refuge auprès de Toi contre le fait de T'associer quoi que ce soit en le sachant, et contre le fait de T'associer quoi que ce soit sans le savoir.",
      de:"O Allah, ich suche Zuflucht bei Dir davor Dir wissentlich etwas beizugesellen, und ich suche Zuflucht bei Dir davor es unwissentlich zu tun."},
    benefit:{en:"A stronger version that seeks refuge twice – from both types of Shirk. The word 'a'udhu' (I seek refuge) appears twice, once for each danger. This version asks for protection, not just forgiveness, from unconscious Shirk.",fr:"Une version plus forte qui cherche refuge deux fois – contre les deux types de Shirk. Le mot 'a'udhu' apparaît deux fois, une pour chaque danger. Cette version demande la protection, pas seulement le pardon, contre le Shirk inconscient.",de:"Eine stärkere Version die zweimal Zuflucht sucht – vor beiden Arten von Shirk. Das Wort 'a'udhu' erscheint zweimal, einmal für jede Gefahr. Diese Version bittet um Schutz nicht nur Vergebung vor unbewusstem Shirk."}, source:["Ahmad","Sahih Al-Albani"] },

  { id:219, catId:"shirk", type:"dua", order:3,     title:{en:"We seek refuge from Shirk – collective dua",fr:"Nous cherchons refuge contre le Shirk – invocation collective",de:"Wir suchen Zuflucht vor Shirk – kollektives Dua"},     arabic:"اَللَّهُمَّ إِنَّا نَعُوْذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُ",     transliteration:"Allaahumma innaa na'uudzu bika min an nusyrika bika syai-an na'lamuhu, wa nastagh-firuka limaa laa na'lam.",
    translation:{
      en:"O Allah, we seek refuge in You from associating anything with You knowingly, and we seek Your forgiveness for what we do unknowingly.",
      fr:"Ô Allah, nous cherchons refuge auprès de Toi contre le fait de T'associer quoi que ce soit en le sachant, et nous Te demandons pardon pour ce que nous ignorons.", de:"O Allah, wir suchen Zuflucht bei Dir davor Dir wissentlich etwas beizugesellen, und wir bitten Dich um Vergebung für das was wir nicht wissen."}, benefit:{en:"The plural form – for reciting as a family or community. Same meaning as entry 1 but uses 'we' (nahnu) instead of 'I' (ana). Suitable for reciting together with family members.",fr:"La forme plurielle – pour réciter en famille ou en communauté. Même sens que l'entrée 1 mais utilise 'nous' au lieu de 'je'. Adapté pour réciter ensemble avec les membres de la famille.",de:"Die Pluralform – zum Rezitieren als Familie oder Gemeinschaft. Gleiche Bedeutung wie Eintrag 1 aber verwendet 'wir' statt 'ich'. Geeignet zum gemeinsamen Rezitieren mit Familienmitgliedern."},
    source:["Ahmad","Sahih Al-Albani"] },

  // ── CATEGORY: PROTECTION FROM FOUR THINGS ──
  
  { id:220, catId:"four_things", type:"dua", order:1,
    title:{en:"Refuge from four spiritual dangers – Version 1",fr:"Refuge contre quatre dangers spirituels – Version 1",de:"Zuflucht vor vier spirituellen Gefahren – Version 1"},
    arabic:"اَللَّهُمَّ إِنِّي أَعُوْذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ، وَمِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ دَعْوَةٍ لَا يُسْتَجَابُ لَهَا",
    transliteration:"Allaahumma innii a'uudzu bika min 'ilmin laa yanfa', wa min qolbin laa yakhsya', wa min nafsin laa tasyba', wa min da'watin laa yustajaabulahaa.",
    translation:{
      en:"O Allah, I seek refuge in You from knowledge that does not benefit, from a heart that does not humble itself, from a soul that is never satisfied, and from a supplication that is not answered.",
      fr:"Ô Allah, je cherche refuge auprès de Toi contre un savoir qui n'est pas bénéfique, un cœur qui n'est pas humble, une âme jamais satisfaite, et une invocation qui n'est pas exaucée.", de:"O Allah, ich suche Zuflucht bei Dir vor Wissen das keinen Nutzen bringt, vor einem Herzen das nicht demütig ist, vor einer Seele die niemals zufrieden ist, und vor einem Bittgebet das nicht erhört wird."}, benefit:{en:"The Prophet ﷺ regularly sought refuge from these four things. They represent four spiritual diseases that can ruin a believer: knowledge without action, a heart without awe of Allah, a greedy soul, and duas that are blocked due to sins or heedlessness.",fr:"Le Prophète ﷺ cherchait régulièrement refuge contre ces quatre choses. Elles représentent quatre maladies spirituelles qui peuvent ruiner un croyant : savoir sans action, cœur sans crainte d'Allah, âme avide, et invocations bloquées par les péchés.",de:"Der Prophet ﷺ suchte regelmäßig Zuflucht vor diesen vier Dingen. Sie repräsentieren vier spirituelle Krankheiten die einen Gläubigen ruinieren können: Wissen ohne Handeln, Herz ohne Ehrfurcht vor Allah, gierige Seele und Duas die durch Sünden blockiert sind."},
    source:["Sahih Muslim"] },

  { id:221, catId:"four_things", type:"dua", order:2,
    title:{en:"Refuge from four spiritual dangers – Version 2",fr:"Refuge contre quatre dangers spirituels – Version 2",de:"Zuflucht vor vier spirituellen Gefahren – Version 2"},
    arabic:"اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ، وَمِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ دُعَاءٍ لَا يُسْمَعُ",
    transliteration:"Allaahumma innii a'uudzu bika min 'ilmin laa yanfa', wa min qolbin laa yakhsya', wa min nafsin laa tasyba', wa min du'aa-in laa yusma'.",
    translation:{ en:"O Allah, I seek refuge in You from knowledge that does not benefit, from a heart that does not humble itself, from a soul that is never satisfied, and from a supplication that is not heard.", fr:"Ô Allah, je cherche refuge auprès de Toi contre un savoir qui n'est pas bénéfique, un cœur qui n'est pas humble, une âme jamais satisfaite, et une invocation qui n'est pas entendue.",
      de:"O Allah, ich suche Zuflucht bei Dir vor Wissen das keinen Nutzen bringt, vor einem Herzen das nicht demütig ist, vor einer Seele die niemals zufrieden ist, und vor einem Bittgebet das nicht gehört wird."},
    benefit:{en:"Slight variation from Version 1: here the last item is 'a supplication that is not heard' (laa yusma) instead of 'not answered' (laa yustajab). Both cover the fear that our duas may not reach Allah due to spiritual barriers.",fr:"Légère variation par rapport à la Version 1 : le dernier élément est 'une invocation qui n'est pas entendue' au lieu de 'non exaucée'. Les deux couvrent la crainte que nos invocations n'atteignent pas Allah en raison de barrières spirituelles.",de:"Leichte Variation zu Version 1: hier ist der letzte Punkt 'ein Bittgebet das nicht gehört wird' statt 'nicht erhört'. Beide decken die Angst ab dass unsere Duas Allah nicht erreichen aufgrund spiritueller Barrieren."},
    source:["Sahih Muslim"] },

  { id:222, catId:"four_things", type:"dua", order:3,
    title:{en:"Refuge – knowledge, deeds, heart and speech",fr:"Refuge – savoir, actes, cœur et parole",de:"Zuflucht – Wissen, Taten, Herz und Worte"},
    arabic:"اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ، وَعَمَلٍ لَا يُرْفَعُ، وَقَلْبٍ لَا يَخْشَعُ، وَقَوْلٍ لَا يُسْمَعُ",
    transliteration:"Allaahumma innii a'uudzu bika min 'ilmin laa yanfa', wa 'amalin laa yurfa', wa qolbin laa yakhsya', wa qoulin laa yusma'.",
    translation:{ en:"O Allah, I seek refuge in You from knowledge that does not benefit, from deeds that are not raised (accepted), from a heart that does not humble itself, and from speech that is not heard.", fr:"Ô Allah, je cherche refuge auprès de Toi contre un savoir qui n'est pas bénéfique, des œuvres qui ne sont pas élevées (acceptées), un cœur qui n'est pas humble, et des paroles qui ne sont pas entendues.", de:"O Allah, ich suche Zuflucht bei Dir vor Wissen das keinen Nutzen bringt, vor Taten die nicht angenommen werden, vor einem Herzen das nicht demütig ist, und vor Worten die nicht gehört werden."}, benefit:{en:"This version adds 'deeds not raised/accepted' (amal laa yurfa) instead of 'soul not satisfied.' It covers the fear of doing good deeds that are rejected by Allah due to showing off (riya), insincerity or other spiritual diseases.",fr:"Cette version ajoute 'des œuvres non acceptées' au lieu de 'l'âme jamais satisfaite'. Elle couvre la crainte de faire de bonnes actions qui sont rejetées par Allah à cause de l'ostentation, du manque de sincérité ou d'autres maladies spirituelles.",de:"Diese Version fügt 'Taten die nicht angenommen werden' statt 'Seele die nie zufrieden ist' hinzu. Sie deckt die Angst ab gute Taten zu tun die von Allah aufgrund von Selbstdarstellung, Unaufrichtigkeit oder anderen spirituellen Krankheiten abgelehnt werden."},
    source:["Ibn Majah","Authenticated"] },

  { id:223, catId:"four_things", type:"dua", order:4,
    title:{en:"Refuge from these four things – explicit ending",fr:"Refuge contre ces quatre choses – fin explicite",de:"Zuflucht vor diesen vier Dingen – explizites Ende"},
    arabic:"اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ قَلْبٍ لَا يَخْشَعُ، وَمِنْ دُعَاءٍ لَا يُسْمَعُ، وَمِنْ نَفْسٍ لَا تَشْبَعُ، وَمِنْ عِلْمٍ لَا يَنْفَعُ، أَعُوذُ بِكَ مِنْ هَـٰؤُلَاءِ الأَرْبَعِ",
    transliteration:"Allaahumma innii a'uudzu bika min qolbin laa yakhsya', wa min du'aa-in laa yusma', wa min nafsin laa tasyba', wa min 'ilmin laa yanfa'. A'uudzu bika min haa-ulaa-il arba'.",
    translation:{ en:"O Allah, I seek refuge in You from a heart that does not humble itself, from a supplication that is not heard, from a soul that is never satisfied, and from knowledge that does not benefit. I seek refuge in You from these four things.", fr:"Ô Allah, je cherche refuge auprès de Toi contre un cœur qui n'est pas humble, une invocation qui n'est pas entendue, une âme jamais satisfaite, et un savoir qui n'est pas bénéfique. Je cherche refuge auprès de Toi contre ces quatre choses.",
      de:"O Allah, ich suche Zuflucht bei Dir vor einem Herzen das nicht demütig ist, vor einem Bittgebet das nicht gehört wird, vor einer Seele die niemals zufrieden ist, und vor Wissen das keinen Nutzen bringt. Ich suche Zuflucht bei Dir vor diesen vier Dingen."},
    benefit:{en:"The most emphatic version – ending with 'I seek refuge in You from these four things' (a'udhu bika min ha-ula-il arba'). The explicit summary at the end adds weight and finality to the supplication.",fr:"La version la plus emphatique - se terminant par je cherche refuge aupres de Toi contre ces quatre choses. Le resume explicite a la fin ajoute du poids et de la finalite a la supplication.",de:"Die nachdrücklichste Version – endend mit 'Ich suche Zuflucht bei Dir vor diesen vier Dingen'. Die explizite Zusammenfassung am Ende verleiht der Bittrede Gewicht und Nachdruck."},
    source:["Sahih Muslim"] },

// ── CATEGORY: ACCIDENTS & TERRIBLE DEATH ──
  { id: 224, catId: "accidents", type: "dua", order: 1,
    title: { en: "Refuge from falling, drowning, fire and Satan at death", fr: "Refuge contre la chute, la noyade, le feu et Satan", de: "Zuflucht vor Sturz, Ertrinken, Feuer und Satan beim Tod" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ التَّرَدِّي، وَالْهَدْمِ، وَالْغَرَقِ، وَالْحَرِيقِ، وَأَعُوذُ بِكَ أَنْ يَتَخَبَّطَنِي الشَّيْطَانُ عِنْدَ الْمَوْتِ، وَأَعُوذُ بِكَ أَنْ أَمُوتَ فِي سَبِيلِكَ مُدْبِرًا، وَأَعُوذُ بِكَ أَنْ أَمُوتَ لَدِيغًا",
    transliteration: "Allaahumma innii auudzu bika minat-taroddii, wal hadmi, wal ghoroqi, wal hariiqi, wa auudzu bika an yatakhobbathonisy-syaithoonu indal mauti, wa auudzu bika an amuuta fii sabiilika mudbiron, wa auudzu bika an amuuta ladiighon.",
    translation: {
      en: "O Allah, I seek refuge in You from falling from a height, from being crushed, from drowning, and from burning. I seek refuge in You from being overtaken by Satan at the time of death, from dying while turning away from Your path, and from dying due to a poisonous sting.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre la chute, l'effondrement, la noyade et le feu. Je cherche refuge contre le fait que Satan m'égare au moment de la mort, contre le fait de mourir en me détournant de Ta voie, et contre le fait de mourir à cause d'une piqûre venimeuse.",
      de: "O Allah, ich suche Zuflucht bei Dir vor dem Absturz, vor dem Verschüttetwerden, vor dem Ertrinken und vor dem Verbrennen. Ich suche Zuflucht davor dass mich der Satan beim Sterben überwältigt, davor dass ich mich von Deinem Weg abwende sowie davor durch einen giftigen Stich zu sterben." },
    benefit: {
      en: "This dua covers four physical dangers – falling, collapse, drowning, fire – and three spiritual dangers – Satan at death, dying in cowardice, and dying from venom. The Prophet taught it as a comprehensive evening protection.",
      fr: "Ce dua couvre quatre dangers physiques et trois dangers spirituels. Le Prophète l'enseigna comme protection complète du soir.",
      de: "Dieses Dua deckt vier körperliche Gefahren und drei spirituelle Gefahren ab. Der Prophet lehrte es als umfassenden Abendschutz." },
    source: ["Abu Dawud", "An-Nasai", "Sahih"] },

  { id: 225, catId: "accidents", type: "dua", order: 2,
    title: { en: "Refuge from senility, accidents, grief and terrible death", fr: "Refuge contre la sénilité, accidents, tristesse et mauvaise mort", de: "Zuflucht vor Altersschwäche, Unfällen, Kummer und schrecklichem Tod" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَرَمِ، وَالتَّرَدِّي، وَالْهَدْمِ، وَالْغَمِّ، وَالْحَرِيقِ، وَالْغَرَقِ، وَأَعُوذُ بِكَ أَنْ يَتَخَبَّطَنِي الشَّيْطَانُ عِنْدَ الْمَوْتِ، وَأَنْ أُقْتَلَ فِي سَبِيلِكَ مُدْبِرًا، وَأَعُوذُ بِكَ أَنْ أَمُوتَ لَدِيغًا",
    transliteration: "Allaahumma innii auudzu bika minal haromi, wat-taroddii, wal hadmi, wal ghommi, wal hariiqi, wal ghoroqi, wa auudzu bika an yatakhobbathonisy-syaithoonu indal mauti, wa an uqtala fii sabiilika mudbiron, wa auudzu bika an amuuta ladiighon.",
    translation: {
      en: "O Allah, I seek refuge in You from senility, falling from heights, being crushed by collapse, grief, burning, and drowning. I seek refuge in You from being overpowered by Satan at the time of death, from being killed in Your cause while turning away, and from dying from a poisonous sting.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre la sénilité, la chute de hauteur, l'effondrement, la tristesse, le feu et la noyade. Je cherche refuge contre le fait d'être dominé par Satan au moment de la mort, d'être tué en fuyant sur Ton chemin, et de mourir d'une piqûre venimeuse.",
      de: "O Allah, ich suche Zuflucht bei Dir vor Altersschwäche, vor einem Sturz aus der Höhe, vor Einsturz, vor Kummer, vor Verbrennung und vor Ertrinken. Ich suche Zuflucht davor dass der Satan mich im Moment des Todes überwältigt, davor im Kampf auf Deinem Weg getötet zu werden sowie davor durch einen giftigen Stich zu sterben." },
    source: ["Abu Dawud", "An-Nasai", "Authenticated"] },

  { id: 226, catId: "accidents", type: "dua", order: 3,
    title: { en: "Refuge from collapse, fall, drowning, fire, senility and Satan", fr: "Refuge contre l'effondrement, la chute, la noyade, le feu, la sénilité et Satan", de: "Zuflucht vor Einsturz, Sturz, Ertrinken, Feuer, Altersschwäche und Satan" },
    arabic: "اَللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَدْمِ، وَأَعُوذُ بِكَ مِنَ التَّرَدِّي، وَأَعُوذُ بِكَ مِنَ الْغَرَقِ، وَالْحَرَقِ، وَالْهَرَمِ، وَأَعُوذُ بِكَ أَنْ يَتَخَبَّطَنِي الشَّيْطَانُ عِنْدَ الْمَوْتِ، وَأَعُوذُ بِكَ أَنْ أَمُوتَ فِي سَبِيلِكَ مُدْبِرًا، وَأَعُوذُ بِكَ أَنْ أَمُوتَ لَدِيغًا",
    transliteration: "Allaahumma innii auudzu bika minal hadmi, wa auudzu bika minat-taroddii, wa auudzu bika minal ghoroqi, wal haroqi, wal haromi, wa auudzu bika an yatakhobbathonisy-syaithoonu indal mauti, wa auudzu bika an amuuta fii sabiilika mudbiron, wa auudzu bika an amuuta ladiighon.",
    translation: {
      en: "O Allah, I seek refuge in You from being crushed by collapse, from falling, from drowning, from burning, and from senility. I seek refuge from being overtaken by Satan at the time of death, from dying in Your cause while turning away, and from dying from a poisonous sting.",
      fr: "Ô Allah, je cherche refuge auprès de Toi contre l'effondrement, la chute, la noyade, le feu et la sénilité. Je cherche refuge contre le fait d'être dominé par Satan au moment de la mort, de mourir en se détournant de Ta voie, et de mourir d'une piqûre venimeuse.",
      de: "O Allah, ich suche Zuflucht bei Dir vor dem Verschüttetwerden, vor einem Sturz, vor dem Ertrinken, vor dem Verbrennen und vor Altersschwäche. Ich suche Zuflucht davor dass mich der Satan beim Sterben überwältigt, auf Deinem Weg abgewandt zu sterben sowie durch einen giftigen Stich zu sterben." },
    source: ["Abu Dawud", "An-Nasai", "Authenticated"] },

  { id: 227, catId: "accidents", type: "dua", order: 4,
    title: { en: "Refuge from Satan at the moment of death", fr: "Refuge contre Satan au moment de la mort", de: "Zuflucht vor Satan im Moment des Todes" },
    arabic: "أَعُوذُ بِكَ أَنْ يَتَخَبَّطَنِي الشَّيْطَانُ عِنْدَ الْمَوْتِ",
    transliteration: "Auudzu bika an yatakhobbathonisy-syaithoonu indal maut.",
    translation: {
      en: "I seek refuge in You from being led astray by Satan at the time of death.",
      fr: "Je cherche refuge auprès de Toi contre le fait que Satan m'égare au moment de la mort.",
      de: "Ich suche Zuflucht bei Dir davor dass mich der Satan im Moment des Todes in die Irre führt." },
    benefit: {
      en: "This short dua focuses on the most critical spiritual danger – that Shaytan tries to mislead a person at their final moments. A good ending (husn al-khatima) is the greatest blessing. Say this often.",
      fr: "Ce court dua se concentre sur le danger spirituel le plus critique – que Shaytan essaie d'égarer une personne dans ses derniers instants. Une bonne fin est la plus grande bénédiction. Dire souvent.",
      de: "Dieses kurze Dua konzentriert sich auf die kritischste spirituelle Gefahr – dass Shaytan versucht einen Menschen in seinen letzten Momenten irrezuführen. Ein gutes Ende ist der größte Segen. Oft sprechen." },
    source: ["Abu Dawud", "An-Nasai", "Sahih"] },

  // ── CATEGORY: SEEKING KNOWLEDGE ──
  { id: 228, catId: "knowledge", type: "dua", order: 1,
    title: { en: "Increase me in knowledge (Quran 20:114)", fr: "Augmente-moi en savoir (Coran 20:114)", de: "Mehre mein Wissen (Quran 20:114)" },
    arabic: "رَبِّ زِدْنِي عِلْمًا",
    transliteration: "Robbi zidnii ilman.",
    translation: {
      en: "My Lord, increase me in knowledge.",
      fr: "Seigneur, augmente-moi en savoir.",
      de: "Mein Herr, mehre mein Wissen." },
    benefit: {
      en: "The shortest and most powerful dua for knowledge in the Quran. Allah commanded the Prophet to ask for more knowledge – showing that knowledge is so important that even the Prophet was instructed to seek more of it.",
      fr: "Le dua le plus court et le plus puissant pour le savoir dans le Coran. Allah ordonna au Prophète de demander plus de connaissance – montrant que le savoir est si important que même le Prophète reçut cette instruction.",
      de: "Das kürzeste und kraftvollste Dua für Wissen im Quran. Allah befahl dem Propheten um mehr Wissen zu bitten – was zeigt dass Wissen so wichtig ist dass sogar der Prophet diese Anweisung erhielt." },
    source: ["Quran 20:114"] },

  { id: 229, catId: "knowledge", type: "dua", order: 2,
    title: { en: "Benefit me, teach me, increase me in knowledge", fr: "Fais-moi bénéficier, enseigne-moi, augmente mon savoir", de: "Nutzen ziehen, lehre mich, mehre mein Wissen" },
    arabic: "اَللَّهُمَّ انْفَعْنِيْ بِمَا عَلَّمْتَنِيْ، وَعَلِّمْنِيْ مَا يَنْفَعُنِيْ، وَزِدْنِيْ عِلْماً",
    transliteration: "Allaahumman-fa-nii bimaa allamtanii, wa allimnii maa yanfa-unii, wa zidnii ilman.",
    translation: {
      en: "O Allah, benefit me with what You have taught me, teach me what will benefit me, and increase me in knowledge.",
      fr: "Ô Allah, fais-moi bénéficier de ce que Tu m'as appris, enseigne-moi ce qui m'est utile, et augmente-moi en savoir.",
      de: "O Allah, lass mich Nutzen ziehen aus dem was Du mich gelehrt hast, lehre mich was mir nützt, und mehre mein Wissen." },
    benefit: {
      en: "Three comprehensive requests in one: making existing knowledge useful, gaining new beneficial knowledge, and increasing in knowledge. Recommended to say after Fajr prayer.",
      fr: "Trois demandes complètes en une : rendre le savoir existant utile, acquérir de nouvelles connaissances utiles, et augmenter en savoir. Recommandé après la prière du Fajr.",
      de: "Drei umfassende Bitten in einer: bestehendes Wissen nützlich machen, neues nützliches Wissen erlangen, und im Wissen zunehmen. Empfohlen nach dem Fajr-Gebet." },
    source: ["At-Tirmidhi", "Ibn Majah", "Sahih"] },

  { id: 230, catId: "knowledge", type: "dua", order: 3,
    title: { en: "Grant me knowledge that benefits me", fr: "Accorde-moi un savoir qui me profite", de: "Schenke mir Wissen das mir nützt" },
    arabic: "اَللَّهُمَّ انْفَعْنِيْ بِمَا عَلَّمْتَنِيْ، وَعَلِّمْنِيْ مَا يَنْفَعُنِيْ، وَارْزُقْنِيْ عِلْماً تَنْفَعُنِيْ بِهِ",
    transliteration: "Allaahumman-fa-nii bimaa allamtanii, wa allimnii maa yanfa-unii, war-zuqnii ilman tanfa-unii bih.",
    translation: {
      en: "O Allah, benefit me with what You have taught me, teach me what will benefit me, and grant me knowledge that benefits me.",
      fr: "Ô Allah, fais-moi bénéficier de ce que Tu m'as appris, enseigne-moi ce qui m'est utile, et accorde-moi un savoir bénéfique.",
      de: "O Allah, lass mich Nutzen ziehen aus dem was Du mich gelehrt hast, lehre mich was mir nützt, und schenke mir Wissen das mir Nutzen bringt." },
    benefit: {
      en: "Variation of entry 2 – uses warzuqni (grant me as provision) instead of zidni (increase me). This adds the dimension of asking Allah to provide knowledge as a rizq (blessing) – emphasising that knowledge is a gift from Allah.",
      fr: "Variation de l'entrée 2 – utilise warzuqni (accorde-moi comme subsistance) au lieu de zidni (augmente-moi). Cela ajoute la dimension de demander à Allah de fournir la connaissance comme rizq.",
      de: "Variation von Eintrag 2 – verwendet warzuqni (schenke mir als Versorgung) statt zidni (mehre mich). Dies fügt die Dimension hinzu um Wissen als Rizq von Allah zu erbitten." },
    source: ["At-Tirmidhi", "Authenticated"] },

  { id: 231, catId: "knowledge", type: "dua", order: 4,
    title: { en: "Ask for beneficial knowledge, seek refuge from useless knowledge", fr: "Demander un savoir utile, se protéger du savoir inutile", de: "Nützliches Wissen erbitten, vor nutzlosem Wissen schützen" },
    arabic: "اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ عِلْمًا نَافِعًا، وَأَعُوْذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ",
    transliteration: "Allaahumma innii as-aluka ilman naafian, wa auudzu bika min ilmin laa yanfa.",
    translation: {
      en: "O Allah, I ask You for beneficial knowledge, and I seek refuge in You from knowledge that does not benefit.",
      fr: "Ô Allah, je Te demande un savoir utile et je cherche refuge auprès de Toi contre un savoir qui ne profite pas.",
      de: "O Allah, ich bitte Dich um nützliches Wissen und suche Zuflucht bei Dir vor Wissen das keinen Nutzen bringt." },
    benefit: {
      en: "Knowledge without benefit is one of the four things the Prophet sought refuge from (see category: Four Spiritual Dangers). This dua asks for the positive AND seeks protection from the negative – a complete supplication for students and scholars.",
      fr: "Le savoir sans bénéfice est l'une des quatre choses dont le Prophète cherchait refuge. Ce dua demande le positif ET cherche protection contre le négatif.",
      de: "Wissen ohne Nutzen ist eine der vier Dinge vor denen der Prophet Zuflucht suchte. Dieses Dua bittet um das Positive UND sucht Schutz vor dem Negativen." },
    source: ["Ibn Majah", "Sahih"] },

  { id: 232, catId: "knowledge", type: "dua", order: 5,
    title: { en: "Grant me deep understanding of the religion", fr: "Accorde-moi la compréhension profonde de la religion", de: "Gewähre mir tiefes Verständnis der Religion" },
    arabic: "اَللَّهُمَّ فَقِّهْنِيْ فِى الدِّيْنِ",
    transliteration: "Allaahumma faqqihnii fid-diin.",
    translation: {
      en: "O Allah, grant me understanding of the religion.",
      fr: "Ô Allah, accorde-moi la compréhension de la religion.",
      de: "O Allah, gewähre mir Verständnis der Religion." },
    benefit: {
      en: "The Prophet made this specific dua for Ibn Abbas and said: whoever Allah wants good for, He grants them fiqh (deep understanding) of the religion. Fiqh is not just knowing rules – it is understanding the wisdom, spirit and purpose behind them.",
      fr: "Le Prophète fit ce dua spécifique pour Ibn Abbas et dit : quiconque Allah veut du bien pour lui, Il lui accorde la compréhension profonde de la religion. Le fiqh n'est pas seulement connaitre les règles mais en comprendre la sagesse.",
      de: "Der Prophet machte dieses spezifische Dua für Ibn Abbas und sagte: Wem Allah Gutes will dem gewährt Er das tiefe Verständnis der Religion. Fiqh bedeutet nicht nur Regeln zu kennen sondern ihre Weisheit und ihren Zweck zu verstehen." },
    source: ["Sahih Bukhari", "Sahih Muslim"] },

  // ── CATEGORY: SEEKING GOODNESS ──
  { id: 233, catId: "goodness", type: "dua", order: 1,
    title: { en: "Make me an establisher of prayer (Quran 14:40)", fr: "Fais de moi quelqu'un qui accomplit la prière (Coran 14:40)", de: "Mache mich zum Beter (Quran 14:40)" },
