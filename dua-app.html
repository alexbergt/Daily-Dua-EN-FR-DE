    translation:{en:"O Allah, Lord of mankind, remove the harm and heal. You are the Healer. There is no healing except Your healing, a healing that leaves no illness behind.",fr:"Ô Allah, Seigneur des hommes, enlève le mal et guéris. Tu es le Guérisseur. Il n'y a de guérison que Ta guérison, une guérison qui ne laisse aucune maladie.",de:"O Allah, Herr der Menschen, nimm das Leid weg und heile. Du bist der Heiler. Es gibt keine Heilung außer Deiner Heilung, eine Heilung die keine Krankheit zurücklässt."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:115, catId:"visiting_sick", type:"dua", order:4, title:{en:"Dua for the sick (2)",fr:"Invocation pour le malade (2)",de:"Dua für den Kranken (2)"}, arabic:"اَللَّهُمَّ رَبَّ النَّاسِ، مُذْهِبَ الْبَاسِ، اِشْفِ، أَنْتَ الشَّافِى، لاَ شَافِىَ إِلاَّ أَنْتَ، شِفَاءً لاَ يُغَادِرُ سَقَمًا", transliteration:"Allaahumma robban-naas, mudh-hibal baas, isyfi, antasy-syaafii, laa syaafiya illaa anta, syifaa-an laa yughaadiru saqoman.",
    translation:{en:"O Allah, Lord of mankind, remover of harm, heal. You are the Healer. There is no healer except You, a healing that leaves no illness behind.",fr:"Ô Allah, Seigneur des hommes, Celui qui enlève le mal, guéris. Tu es le Guérisseur. Il n'y a de guérisseur que Toi, une guérison qui ne laisse aucune maladie.",de:"O Allah, Herr der Menschen, der das Leid entfernt, heile. Du bist der Heiler. Es gibt keinen Heiler außer Dir, eine Heilung die keine Krankheit zurücklässt."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:116, catId:"visiting_sick", type:"dua", order:5, title:{en:"Dua for healing (7 times)",fr:"Invocation pour la guérison (7 fois)",de:"Dua für Heilung (7-mal)"}, arabic:"أَسْأَلُ اللَّهَ الْعَظِيْمَ رَبَّ الْعَرْشِ الْعَظِيْمِ أَنْ يَشْفِيَكَ", transliteration:"As-alullaahal 'azhiim, robbal 'arsyil 'azhiim, an yasyfiyaka (7x).",
    translation:{en:"I ask Allah, the Most Great, Lord of the Mighty Throne, to heal you. (Recite 7 times)",fr:"Je demande à Allah le Très Grand, Seigneur du Trône immense, de te guérir. (7 fois)",de:"Ich bitte Allah, den Allgewaltigen, den Herrn des gewaltigen Thrones, dich zu heilen. (7×)"}, benefit:{en:"The Prophet ﷺ said: whoever visits a sick person not at the point of death and says this 7 times, Allah will cure him of that illness.",fr:"Le Prophète ﷺ a dit : quiconque visite un malade qui n'est pas à l'agonie et dit cela 7 fois, Allah le guérira de cette maladie.",de:"Der Prophet ﷺ sagte: Wer einen Kranken besucht der nicht im Sterben liegt und dies 7-mal sagt, Allah wird ihn von dieser Krankheit heilen."}, source:["Abu Dawud","At-Tirmidhi","Sahih"] },

  { id:117, catId:"visiting_sick", type:"dua", order:6, title:{en:"Ruqyah for someone else",fr:"Ruqyah pour quelqu'un d'autre",de:"Ruqyah für jemand anderen"}, arabic:"بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنٍ حَاسِدٍ، اَللَّهُ يَشْفِيكَ، بِسْمِ اللَّهِ أَرْقِيكَ", transliteration:"Bismillaahi arqiika, min kulli syai-in yu'dziika, min syarri kulli nafsin au 'ainin haasidin, allaahu yasyfiika, bismillaahi arqiika.",
    translation:{en:"In the name of Allah, I perform ruqyah for you, from everything that harms you, from the evil of every soul or envious eye. May Allah heal you.",fr:"Au nom d'Allah, je fais une ruqyah pour toi contre tout ce qui te nuit, contre le mal de toute âme ou de tout regard envieux. Qu'Allah te guérisse.",de:"Im Namen Allahs spreche ich Ruqyah für dich, vor allem was dir schadet, vor dem Übel jeder Seele und jedes neidischen Blicks. Möge Allah dich heilen."}, source:["Sahih Muslim"] },

  { id:118, catId:"visiting_sick", type:"dua", order:7, title:{en:"Dua for sick warrior or worshipper",fr:"Invocation pour le guerrier ou adorateur malade",de:"Dua für den kranken Kämpfer oder Gläubigen"}, arabic:"اَللَّهُمَّ اشْفِ عَبْدَكَ يَنْكَأُ لَكَ عَدُوًّا، أَوْ يَمْشِي لَكَ إِلَى صَلَاةٍ", transliteration:"Allaahummasyfi 'abdaka yanka-u laka 'aduwwan, au yamsyii laka ilaa sholaah.",
    translation:{en:"O Allah, heal Your servant, who fights Your enemy and walks to prayer for Your sake.",fr:"Ô Allah, guéris Ton serviteur qui combat Ton ennemi et marche vers la prière pour Toi.",de:"O Allah, heile Deinen Diener, der Deinen Feind bekämpft und für Dich zum Gebet geht."}, source:["Abu Dawud","Sahih"] },

  { id:119, catId:"visiting_sick", type:"dua", order:8, title:{en:"Short dua for a specific person",fr:"Courte invocation pour une personne précise",de:"Kurzes Dua für eine bestimmte Person"}, arabic:"اَللَّهُمَّ اشْفِ (فُلَانًا)", transliteration:"Allaahummasyfi (fulaanan).",
    translation:{en:"O Allah, heal (name the person).",fr:"Ô Allah, guéris (nommez la personne).",de:"O Allah, heile (Name einsetzen)."}, benefit:{en:"A simple but powerful dua to make for any sick person by name. The Prophet ﷺ used to name the person when making dua.",fr:"Une invocation simple mais puissante à faire pour tout malade en le nommant. Le Prophète ﷺ nommait la personne lors de ses invocations.",de:"Ein einfaches aber kraftvolles Dua für jeden Kranken mit Namen. Der Prophet ﷺ nannte die Person bei seinen Duas."}, source:["Sahih Bukhari","Sahih Muslim"] },

  // ── CATEGORY: NEAR DEATH ──
  
  { id:120, catId:"near_death", type:"info", order:1, title:{en:"Good expectations of Allah at death (Husn al-Dhann)",fr:"Bonne opinion d'Allah à la mort (Husn al-Dhann)",de:"Gute Erwartung gegenüber Allah beim Sterben (Husn adh-Dhann)"}, content:{en:"Having good expectations of Allah (husn al-dhann) at the time of death means that a servant firmly believes that Allah, the Most Merciful, will forgive him in his final moments. The Prophet ﷺ said: 'None of you should die except while having good expectations of Allah.'",fr:"Avoir une bonne opinion d'Allah (husn al-dhann) au moment de la mort signifie que le serviteur est convaincu qu'Allah, le Très Miséricordieux, lui pardonnera dans ses derniers instants. Le Prophète ﷺ a dit : 'Que personne parmi vous ne meure sans avoir une bonne opinion d'Allah.'",de:"Gutes Denken über Allah (husn adh-dhann) beim Sterben bedeutet dass der Diener fest daran glaubt dass Allah ihm in seinen letzten Momenten vergibt. Der Prophet ﷺ sagte: 'Keiner von euch soll sterben außer er hat eine gute Erwartung gegenüber Allah.'"}, source:["Sahih Muslim"] },

  { id:121, catId:"near_death", type:"dua", order:2, title:{en:"Dua for martyrdom and dying in Medina",fr:"Invocation pour le martyre et mourir à Médine",de:"Dua für den Märtyrertod und Sterben in Medina"}, arabic:"اللَّهُمَّ ارْزُقْنِي الشَّهَادَةَ فِي سَبِيلِكَ، وَاجْعَلْ مَوْتِي فِي بَلَدِ رَسُولِكَ", transliteration:"Allaahumma-rzuqnii asy-syahaadata fii sabiilika, waj'al mawtii fii baladi rasuulika.",
    translation:{en:"O Allah, grant me martyrdom in Your path and let my death be in the land of Your Messenger.",fr:"Ô Allah, accorde-moi le martyre dans Ton sentier et fais que je meure dans la terre de Ton Messager.",de:"O Allah, gewähre mir den Märtyrertod auf Deinem Weg und lasse mich im Land Deines Gesandten sterben."}, source:["Sahih Bukhari"] },

  { id:122, catId:"near_death", type:"dua", order:3, title:{en:"Last words of the Prophet ﷺ",fr:"Dernières paroles du Prophète ﷺ",de:"Letzte Worte des Propheten ﷺ"}, arabic:"اَللَّهُمَّ اغْفِرْ لِيْ وَارْحَمْنِيْ وَأَلْحِقْنِيْ بِالرَّفِيْقِ اْلأَعْلَى", transliteration:"Allaahummagh-fir lii warhamnii wa alhiqnii bir-rofiiqil a'laa.",
    translation:{en:"O Allah, forgive me, have mercy on me, and join me with the highest companions.",fr:"Ô Allah, pardonne-moi, fais-moi miséricorde et fais-moi rejoindre les compagnons les plus élevés.",de:"O Allah, vergib mir, erbarme Dich meiner und lasse mich zu den höchsten Gefährten gehören."}, benefit:{en:"These were among the last words of the Prophet ﷺ before his death. Al-Rafiq Al-Ala refers to the highest companions in Paradise – the prophets and the righteous.",fr:"Ce furent parmi les dernières paroles du Prophète ﷺ avant sa mort. 'Al-Rafiq Al-A'la' désigne les compagnons les plus élevés au Paradis.",de:"Dies waren unter den letzten Worten des Propheten ﷺ vor seinem Tod. 'Al-Rafiq Al-A'la' bezeichnet die höchsten Gefährten im Paradies."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:123, catId:"near_death", type:"dua", order:4, title:{en:"Words of the Prophet ﷺ during death agonies",fr:"Paroles du Prophète ﷺ durant les affres de la mort",de:"Worte des Propheten ﷺ während der Todesqualen"}, arabic:"لاَ إِلَـٰهَ إِلاَّ اللَّهُ إِنَّ لِلْمَوْتِ لَسَكَرَاتٍ", transliteration:"Laa ilaaha illallaah, inna lil mauti lasakaroot.",
    translation:{en:"There is no deity worthy of worship except Allah. Indeed, death has its agonies.",fr:"Il n'y a pas de divinité digne d'adoration en dehors d'Allah. Certes, la mort a ses souffrances.",de:"Es gibt keinen Gott außer Allah. Wahrlich, der Tod hat seine Schmerzen."}, benefit:{en:"The Prophet ﷺ said this while experiencing the agonies of death, reminding us to remember Allah even at the hardest moment.",fr:"Le Prophète ﷺ a dit cela en éprouvant les affres de la mort, nous rappelant de nous souvenir d'Allah même au moment le plus difficile.",de:"Der Prophet ﷺ sagte dies während er die Todesqualen erlebte und erinnerte uns daran Allah selbst im schwersten Moment zu erwähnen."}, source:["Sahih Bukhari"] },

  { id:124, catId:"near_death", type:"dua", order:5, title:{en:"Dhikr for the dying – Four testimonies",fr:"Dhikr pour le mourant – Quatre témoignages",de:"Dhikr für den Sterbenden – Vier Bezeugungen"}, arabic:"لَا إِلَـٰهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ، لَا إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَا إِلَـٰهَ إِلاَّ اللَّهُ لَهُ المُلْكُ وَلَهُ الحَمْدُ، لَا إِلَـٰهَ إِلاَّ اللَّهُ وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ", transliteration:"Laa ilaaha illallaah wallaahu akbar, laa ilaaha illallaah wahdahu laa syariika lah, laa ilaaha illallaah lahul mulku wa lahul hamdu, laa ilaaha illallaah wa laa haula wa laa quwwata illaa billaah.",
    translation:{en:"There is no deity except Allah, and Allah is the Greatest. There is no deity except Allah alone, without partner. To Him belongs all dominion and all praise. There is no power and no strength except with Allah.",fr:"Il n'y a pas de divinité en dehors d'Allah, et Allah est le Plus Grand. Il n'y a pas de divinité en dehors d'Allah, Seul sans associé. À Lui appartiennent la royauté et la louange. Il n'y a de force ni de puissance qu'avec Allah.",de:"Es gibt keinen Gott außer Allah und Allah ist der Größte. Es gibt keinen Gott außer Allah allein ohne Partner. Ihm gehört die Herrschaft und Ihm gebührt alles Lob. Es gibt keine Kraft und keine Macht außer durch Allah."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:125, catId:"near_death", type:"dua", order:6, title:{en:"Dua – Life if good, death if better",fr:"Invocation – Vie si bonne, mort si meilleure",de:"Dua – Leben wenn gut, Tod wenn besser"}, arabic:"اَللَّهُمَّ أَحْيِنِي مَا كَانَتِ الحَيَاةُ خَيْرًا لِي، وَتَوَفَّنِي إِذَا كَانَتِ الوَفَاةُ خَيْرًا لِي", transliteration:"Allaahumma ahyinii maa kaanatil hayaatu khoiron lii, wa tawaffanii idzaa kaanatil wafaatu khoiron lii.",
    translation:{en:"O Allah, keep me alive as long as life is better for me, and let me die if death is better for me.",fr:"Ô Allah, fais-moi vivre tant que la vie est meilleure pour moi, et fais-moi mourir si la mort est meilleure pour moi.",de:"O Allah, lasse mich leben solange das Leben besser für mich ist, und lasse mich sterben wenn der Tod besser für mich ist."}, source:["Sahih Bukhari","Sahih Muslim"] },

  // ── CATEGORY: FUNERAL ──
  
  { id:126, catId:"funeral", type:"dua", order:1, title:{en:"Talqin – Reminding the dying",fr:"Talqin – Rappel à celui qui meurt",de:"Talqin – Erinnerung für den Sterbenden"}, arabic:"لاَ إِلَـٰهَ إِلاَّ اللَّهُ", transliteration:"Laa ilaaha illallaah.",
    translation:{en:"There is no deity worthy of worship except Allah.",fr:"Il n'y a pas de divinité digne d'adoration en dehors d'Allah.",de:"Es gibt keinen Gott außer Allah."}, benefit:{en:"The Prophet ﷺ said: 'Remind your dying ones to say La ilaha illallah.' Whoever's last words are this will enter Paradise.",fr:"Le Prophète ﷺ a dit : 'Rappelez à vos mourants de dire La ilaha illallah.' Celui dont les dernières paroles sont celles-ci entrera au Paradis.",de:"Der Prophet ﷺ sagte: 'Erinnert eure Sterbenden daran La ilaha illallah zu sagen.' Wessen letzte Worte dies sind wird ins Paradies eintreten."}, source:["Sahih Muslim","Abu Dawud"] },

  { id:127, catId:"funeral", type:"dua", order:2, title:{en:"Dua after closing the eyes of the deceased",fr:"Invocation après avoir fermé les yeux du défunt",de:"Dua nach dem Schließen der Augen des Verstorbenen"}, arabic:"اَللَّهُمَّ اغْفِرْ لِفُلاَنٍ (بِاسْمِهِ) وَارْفَعْ دَرَجَتَهُ فِي الْمَهْدِيِّيْنَ، وَاخْلُفْهُ فِيْ عَقِبِهِ فِي الْغَابِرِيْنَ، وَاغْفِرْ لَنَا وَلَهُ يَا رَبَّ الْعَالَمِيْنَ، وَافْسَحْ لَهُ فِيْ قَبْرِهِ وَنَوِّرْ لَهُ فِيْهِ", transliteration:"Allaahummagh-fir lifulaan (bismihi), warfa' darojatahu fil mahdiyyiin, wakhlufhu fii ʿaqibihi fil ghoobiriin, wagh-fir lanaa wa lahu yaa robbal ʿaalamin, wafsah lahu fii qobrihi wa nawwir lahu fiihi.",
    translation:{en:"O Allah, forgive (name), raise his rank among the guided, grant a successor for those he left behind, forgive us and him O Lord of all worlds, expand his grave and illuminate it.",fr:"Ô Allah, pardonne à (nom), élève son rang parmi les guidés, accorde un successeur pour ceux qu'il a laissés, pardonne-nous ainsi qu'à lui ô Seigneur des mondes, élargis sa tombe et illumine-la.",de:"O Allah, vergib (Name), erhöhe seinen Rang unter den Rechtgeleiteten, schenke seinen Hinterbliebenen Ersatz, vergib uns und ihm o Herr der Welten, erweitere sein Grab und erhelle es."}, source:["Sahih Muslim"] },

  { id:128, catId:"funeral", type:"info", order:3, title:{en:"Al-Fatihah in the funeral prayer",fr:"Al-Fatiha dans la prière funéraire",de:"Al-Fatiha im Totengebet"}, content:{en:"In the first unit (takbir) of the funeral prayer (Salat al-Janazah), Surah Al-Fatihah is recited after the opening Takbir. This is established by authentic hadith.",fr:"Dans la première unité (takbir) de la prière funéraire (Salat al-Janaza), la sourate Al-Fatiha est récitée après le takbir d'ouverture. Cela est établi par des hadiths authentiques.",de:"In der ersten Einheit (Takbir) des Totengebets (Salat al-Dschanaza) wird nach dem eröffnenden Takbir die Sure Al-Fatiha rezitiert. Dies ist durch authentische Hadithe belegt."}, source:["Sahih Bukhari"] },

  { id:129, catId:"funeral", type:"dua", order:4, title:{en:"Words at the moment of death",fr:"Paroles au moment de la mort",de:"Worte im Moment des Todes"}, arabic:"لاَ إِلَـٰهَ إِلاَّ اللَّهُ إِنَّ لِلْمَوْتِ لَسَكَرَاتٍ", transliteration:"Laa ilaaha illallaah, inna lil mauti lasakaroot.",
    translation:{en:"There is no deity except Allah. Indeed, death has its agonies.",fr:"Il n'y a pas de divinité sauf Allah. Certes, la mort a ses souffrances.",de:"Es gibt keinen Gott außer Allah. Wahrlich, der Tod hat seine Schmerzen."}, source:["Sahih Bukhari"] },

  { id:130, catId:"funeral", type:"dua", order:5, title:{en:"Dua in the funeral prayer – for the deceased",fr:"Invocation dans la prière funéraire – pour le défunt",de:"Dua im Totengebet – für den Verstorbenen"}, arabic:"اَللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ وَوَسِّعْ مَدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ", transliteration:"Allaahummaghfir lahu warhamhu wa ʿaafihi waʿfu ʿanhu, wa akrim nuzulahu wa wassiʼ madkhalahu, waghsilhu bil-maaʼii wath-thalji wal-barad.",
    translation:{en:"O Allah, forgive him, have mercy on him, grant him wellbeing, pardon him, honor his reception, widen his entrance, and wash him with water, snow and hail.",fr:"Ô Allah, pardonne-lui, fais-lui miséricorde, accorde-lui la santé, pardonne-lui, honore son accueil, élargis son entrée et lave-le avec l'eau, la neige et la grêle.",de:"O Allah, vergib ihm, erbarme Dich seiner, gewähre ihm Wohlbefinden, verzeihe ihm, ehre seinen Empfang, erweitere seinen Eingang und wasche ihn mit Wasser, Schnee und Hagel."}, source:["Sahih Muslim"] },

  { id:131, catId:"funeral", type:"dua", order:6, title:{en:"Dua in the funeral prayer – comprehensive",fr:"Invocation dans la prière funéraire – complète",de:"Dua im Totengebet – umfassend"}, arabic:"اَللَّهُمَّ اغْفِرْ لِحَيِّنَا وَمَيِّتِنَا، وَشَاهِدِنَا وَغَائِبِنَا، وَصَغِيْرِنَا وَكَبِيْرِنَا، وَذَكَرِنَا وَأُنْثَانَا", transliteration:"Allaahummaghfir lihayyinaa wa mayyitinaa, wa syaahidinaa wa ghooibinaa, wa shoghiirinaa wa kabirinaa, wa dzakarinaa wa untsaanaa.",
    translation:{en:"O Allah, forgive our living and our dead, those present and those absent, our young and our old, our males and our females.",fr:"Ô Allah, pardonne à nos vivants et à nos morts, à ceux qui sont présents et à ceux qui sont absents, à nos jeunes et à nos vieux, à nos hommes et à nos femmes.",de:"O Allah, vergib unseren Lebenden und unseren Toten, den Anwesenden und den Abwesenden, unseren Jungen und unseren Alten, unseren Männern und unseren Frauen."}, source:["Abu Dawud","At-Tirmidhi","Ibn Majah","Sahih"] },

  { id:132, catId:"funeral", type:"dua", order:7, title:{en:"Dua for a child in the funeral prayer",fr:"Invocation pour un enfant dans la prière funéraire",de:"Dua für ein Kind im Totengebet"}, arabic:"اَللَّهُمَّ اجْعَلْهُ لَنَا فَرَطًا، وَسَلَفًا، وَأَجْرًا", transliteration:"Allaahummaj'alhu lanaa farothon, wa salafan, wa ajron.",
    translation:{en:"O Allah, make him a preceding reward, a righteous predecessor, and a source of reward for us.",fr:"Ô Allah, fais de lui une récompense qui nous précède, un pieux prédécesseur et une source de récompense.",de:"O Allah, mache ihn zu einer vorausgehenden Belohnung, einem rechtschaffenen Vorgänger und einer Quelle des Lohns für uns."}, benefit:{en:"This dua is said in the funeral prayer for a young child. The child becomes an intercessor for the parents.",fr:"Cette invocation est dite dans la prière funéraire pour un jeune enfant. L'enfant devient un intercesseur pour les parents.",de:"Dieses Dua wird im Totengebet für ein kleines Kind gesprochen. Das Kind wird zum Fürsprecher der Eltern."}, source:["Abu Dawud","Authenticated"] },

  { id:133, catId:"funeral", type:"dua", order:8, title:{en:"Dua when placing the deceased in the grave (1)",fr:"Invocation en plaçant le défunt dans la tombe (1)",de:"Dua beim Legen des Verstorbenen ins Grab (1)"}, arabic:"بِسْمِ اللَّهِ وَعَلَى سُنَّةِ رَسُوْلِ اللَّهِ", transliteration:"Bismillaahi wa 'alaa sunnati rosuulillaah.",
    translation:{en:"In the name of Allah and upon the Sunnah of the Messenger of Allah.",fr:"Au nom d'Allah et selon la Sunna du Messager d'Allah.",de:"Im Namen Allahs und gemäß der Sunnah des Gesandten Allahs."}, source:["Abu Dawud","Sahih"] },

  { id:134, catId:"funeral", type:"dua", order:9, title:{en:"Dua when placing the deceased in the grave (2)",fr:"Invocation en plaçant le défunt dans la tombe (2)",de:"Dua beim Legen des Verstorbenen ins Grab (2)"}, arabic:"بِسْمِ اللَّهِ وَعَلَى مِلَّةِ رَسُوْلِ اللَّهِ", transliteration:"Bismillaahi wa 'alaa millati rosuulillaah.",
    translation:{en:"In the name of Allah and upon the religion of the Messenger of Allah.",fr:"Au nom d'Allah et selon la religion du Messager d'Allah.",de:"Im Namen Allahs und gemäß der Religion des Gesandten Allahs."}, source:["At-Tirmidhi","Sahih"] },

  { id:135, catId:"funeral", type:"dua", order:10, title:{en:"Dua at the graveside after burial",fr:"Invocation au bord de la tombe après l'enterrement",de:"Dua am Grab nach der Bestattung"}, arabic:"اَللَّهُمَّ اغْفِرْ لَهُ اَللَّهُمَّ ثَبِّتْهُ", transliteration:"Allaahummaghfir lahu, allaahumma tsabbit-hu.",
    translation:{en:"O Allah, forgive him. O Allah, make him firm.",fr:"Ô Allah, pardonne-lui. Ô Allah, raffermis-le.",de:"O Allah, vergib ihm. O Allah, festige ihn."}, benefit:{en:"The Prophet ﷺ used to stand at the grave after burial and say: 'Ask Allah to forgive your brother and ask for his firmness, for he is being questioned now.'",fr:"Le Prophète ﷺ se tenait au bord de la tombe après l'enterrement et disait : 'Demandez à Allah de pardonner à votre frère et demandez sa fermeté, car il est interrogé maintenant.'",de:"Der Prophet ﷺ stand nach der Bestattung am Grab und sagte: 'Bittet Allah eurem Bruder zu vergeben und bittet für seine Standhaftigkeit, denn er wird jetzt befragt.'"}, source:["Abu Dawud","Sahih"] },

  { id:136, catId:"funeral", type:"dua", order:11, title:{en:"Greeting the people of the graves",fr:"Salutation aux gens des tombes",de:"Gruß an die Bewohner der Gräber"}, arabic:"اَلسَّلَامُ عَلَيْكُمْ دَارَ قَوْمٍ مُؤْمِنِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَاحِقُونَ", transliteration:"As-salaamu 'alaikum daaro qoumin mu'miniin, wa innaa in syaa-allaahu bikum laahiqoon.",
    translation:{en:"Peace be upon you, O dwelling of believing people. We will join you, if Allah wills.",fr:"Que la paix soit sur vous, demeure des croyants. Nous vous rejoindrons, si Allah le veut.",de:"Friede sei mit euch, Wohnstätte der Gläubigen. Wir werden euch folgen, so Allah will."}, benefit:{en:"Recited when visiting the graveyard. The Prophet ﷺ taught this greeting and encouraged visiting graves to remember death.",fr:"Récité lors de la visite du cimetière. Le Prophète ﷺ a enseigné ce salut et encouragé la visite des tombes pour se souvenir de la mort.",de:"Gesprochen beim Besuch des Friedhofs. Der Prophet ﷺ lehrte diesen Gruß und ermutigte den Besuch von Gräbern zur Erinnerung an den Tod."}, source:["Sahih Muslim"] },

  // ── CATEGORY: SADNESS & DIFFICULTIES ──
  
  { id:137, catId:"sadness", type:"dua", order:1,
    title:{en:"Dua for grief and worry – Quran as healer",fr:"Invocation pour la tristesse – Le Coran comme guérisseur",de:"Dua für Trauer und Sorge – Der Quran als Heiler"},
    arabic:"اَللَّهُمَّ إِنِّيْ عَبْدُكَ، وَابْنُ عَبْدِكَ، وَابْنُ أَمَتِكَ، نَاصِيَتِيْ بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ، سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ أَنْزَلْتَهُ فِيْ كِتَابِكَ، أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِيْ عِلْمِ الْغَيْبِ عِنْدَكَ، أَنْ تَجْعَلَ الْقُرْآنَ رَبِيْعَ قَلْبِيْ، وَنُوْرَ صَدْرِيْ، وَجَلاَءَ حُزْنِيْ، وَذَهَابَ هَمِّيْ",
    transliteration:"Allaahumma innii 'abduka, wabnu 'abdika, wabnu amatika, naashiyatii biyadika, maadhin fiyya hukmuka, 'adlun fiyya qodhoo-uka, as-aluka bikullismin huwa laka, sammaita bihi nafsaka, au anzaltahu fii kitaabika, au 'allamtahu ahadan min kholqika, awista'tsarta bihi fii 'ilmil ghoibi 'indaka, an taj'alal qur-aana robii'a qolbii, wa nuuro shodrii, wa jalaa-a huznii, wa dzahaaba hammii.",
    translation:{ en:"O Allah, I am Your servant, the son of Your servant, the son of Your maidservant. My forelock is in Your hand. Your judgment upon me is certain. Your decree concerning me is just. I ask You by every name that belongs to You, by which You have named Yourself, or revealed in Your Book, or taught to any of Your creation, or kept hidden in the knowledge of the unseen with You – that You make the Quran the spring of my heart, the light of my chest, the removal of my sadness, and the departure of my anxiety.", fr:"Ô Allah, je suis Ton serviteur, le fils de Ton serviteur, le fils de Ta servante. Ma mèche est dans Ta main. Ton jugement sur moi est certain. Ton décret me concernant est juste. Je Te demande par chaque nom qui T'appartient, par lequel Tu T'es nommé, ou révélé dans Ton Livre, ou enseigné à l'une de Tes créatures, ou gardé caché dans Ta science de l'invisible – de faire du Coran le printemps de mon cœur, la lumière de ma poitrine, la dissipation de ma tristesse et le départ de mon anxiété.", de:"O Allah, ich bin Dein Diener, der Sohn Deines Dieners, der Sohn Deiner Dienerin. Meine Stirnlocke ist in Deiner Hand. Dein Urteil über mich ist gewiss. Dein Beschluss über mich ist gerecht. Ich bitte Dich bei jedem Namen der Dir gehört, mit dem Du Dich benannt hast, oder den Du in Deinem Buch offenbart hast, oder den Du einem Deiner Geschöpfe gelehrt hast, oder den Du im Wissen des Verborgenen bei Dir bewahrt hast – dass Du den Quran zum Frühling meines Herzens machst, zum Licht meiner Brust, zur Auflösung meiner Trauer und zum Vergehen meiner Sorge."}, benefit:{en:"The Prophet ﷺ said: whoever is afflicted with grief and recites this dua, Allah will remove his grief and replace it with joy.",fr:"Le Prophète ﷺ a dit : celui qui est affligé et récite cette invocation, Allah enlèvera sa tristesse et la remplacera par la joie.",de:"Der Prophet ﷺ sagte: Wer von Kummer befallen ist und dieses Dua spricht, wird Allah seinen Kummer nehmen und durch Freude ersetzen."}, source:["Ahmad","Ibn Hibban","Sahih"] },

  { id:138, catId:"sadness", type:"dua", order:2,     title:{en:"Dua for ease in difficulty",fr:"Invocation pour la facilité dans la difficulté",de:"Dua für Erleichterung in der Schwierigkeit"},     arabic:"اَللَّهُمَّ لاَ سَهْلَ إِلاَّ مَا جَعَلْتَهُ سَهْلاً، وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلاً",     transliteration:"Allaahumma laa sahla illaa maa ja-altahu sahlan, wa anta taj-alul hazna idzaa syi-ta sahlan.",
    translation:{ en:"O Allah, there is no ease except what You make easy, and You make hardship easy when You will.", fr:"Ô Allah, il n'y a de facilité que ce que Tu rends facile, et Tu rends la peine facile quand Tu le veux.",
      de:"O Allah, es gibt keine Erleichterung außer der, die Du leicht machst, und Du machst die Schwierigkeit leicht wenn Du es willst."},
    benefit:{en:"A concise and powerful dua acknowledging that all ease and relief comes only from Allah.",fr:"Une invocation concise et puissante reconnaissant que tout soulagement vient uniquement d'Allah.",de:"Ein prägnantes und kraftvolles Dua das anerkennt dass alle Erleichterung nur von Allah kommt."}, source:["Ibn Hibban","Sahih"] },

  { id:139, catId:"sadness", type:"dua", order:3,     title:{en:"Dua for mercy and healing of all affairs",fr:"Invocation pour la miséricorde et la guérison de toutes les affaires",de:"Dua für Barmherzigkeit und Heilung aller Angelegenheiten"},     arabic:"اَللَّهُمَّ رَحْمَتَكَ أَرْجُو، فَلاَ تَكِلْنِيْ إِلَى نَفْسِيْ طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِيْ شَأْنِيْ كُلَّهُ، لاَ إِلَـٰهَ إِلاَّ أَنْتَ",     transliteration:"Allaahumma rohmataka arjuu, falaa takilnii ilaa nafsii torfata ainin, wa ashlih lii syaa-nii kullahu, laa ilaaha illaa anta.",
    translation:{ en:"O Allah, it is Your mercy that I hope for. Do not leave me to myself for the blink of an eye. Set right all my affairs. There is no deity except You.", fr:"Ô Allah, c'est Ta miséricorde que j'espère. Ne me laisse pas à moi-même le temps d'un clin d'oeil. Arrange toutes mes affaires. Il n'y a pas de divinité sauf Toi.",
      de:"O Allah, auf Deine Barmherzigkeit hoffe ich. Überlass mich mir selbst nicht für einen Augenblick. Richte alle meine Angelegenheiten. Es gibt keinen Gott außer Dir."},
    benefit:{en:"This dua expresses total dependence on Allah and asks Him not to leave us to our own weakness even for a moment.",fr:"Cette invocation exprime une totale dépendance envers Allah et Lui demande de ne pas nous laisser à notre propre faiblesse.",de:"Dieses Dua drückt völlige Abhängigkeit von Allah aus und bittet Ihn uns nicht einmal für einen Moment unserer eigenen Schwäche zu überlassen."},
    source:["Abu Dawud","Hasan"] },

  { id:140, catId:"sadness", type:"dua", order:4,
    title:{en:"Dua of Prophet Yunus (Jonah) – from darkness",fr:"Invocation du Prophète Yunus – des ténèbres",de:"Dua des Propheten Yunus – aus der Dunkelheit"},
    arabic:"لاَ إِلَـٰهَ إِلاَّ أَنْتَ سُبْحَانَكَ إِنِّيْ كُنْتُ مِنَ الظَّالِمِيْنَ",
    transliteration:"Laa ilaaha illaa anta subhaanaka innii kuntu minazh-zhoolimiin.",
    translation:{
      en:"There is no deity except You. Glory be to You. Indeed, I have been among the wrongdoers.",
      fr:"Il n'y a pas de divinité sauf Toi. Gloire à Toi. En vérité, j'ai été parmi les injustes.",
      de:"Es gibt keinen Gott außer Dir. Gepriesen seist Du. Wahrlich, ich gehörte zu den Ungerechten."},
    benefit:{en:"This is the dua of Prophet Yunus عليه السلام from the belly of the whale. Allah says in the Quran that He answered him and delivered him. No Muslim calls upon Allah with this dua in any matter except that Allah answers him.",fr:"C'est l'invocation du Prophète Yunus عليه السلام du ventre de la baleine. Allah dit dans le Coran qu'Il l'a exaucé et délivré. Aucun musulman n'invoque Allah avec cette invocation sans qu'Allah lui réponde.",de:"Dies ist das Dua des Propheten Yunus عليه السلام aus dem Bauch des Wals. Allah sagt im Quran dass Er ihn erhörte und errettete. Kein Muslim ruft Allah mit diesem Dua an ohne dass Allah ihn erhört."},
    source:["Quran 21:87","At-Tirmidhi","Sahih"] },

  { id:141, catId:"sadness", type:"dua", order:5,
    title:{en:"Dua of reliance on Allah alone",fr:"Invocation de confiance en Allah seul",de:"Dua des Vertrauens auf Allah allein"},
    arabic:"اَللَّهُ اَللَّهُ رَبِّيْ، لاَ أُشْرِكُ بِهِ شَيْئًا",
    transliteration:"Allaah allaah robbii, laa usyriku bihi syai-an.",
    translation:{
      en:"Allah, Allah is my Lord. I do not associate anything with Him.",
      fr:"Allah, Allah est mon Seigneur. Je ne Lui associe rien.", de:"Allah, Allah ist mein Herr. Ich stelle Ihm nichts zur Seite."}, benefit:{en:"This dua affirms pure Tawhid in times of distress. Repeating the name of Allah and affirming His Lordship brings peace and drives away anxiety.",fr:"Cette invocation affirme le pur Tawhid dans les moments de détresse. Répéter le nom d'Allah et affirmer Sa Seigneurie apporte la paix.",de:"Dieses Dua bekräftigt das reine Tawhid in Zeiten der Not. Das Wiederholen des Namens Allahs und das Bestätigen Seiner Herrschaft bringt Frieden."}, source:["Abu Dawud","Ibn Majah","Sahih"] },

  { id:142, catId:"sadness", type:"dua", order:6,     title:{en:"Dua for relief from worry and grief",fr:"Invocation pour le soulagement de l'inquiétude",de:"Dua zur Befreiung von Sorge und Kummer"},
    arabic:"لاَ إِلَـٰهَ إِلاَّ اللَّهُ الْعَظِيْمُ الْحَلِيْمُ، لاَ إِلَـٰهَ إِلاَّ اللَّهُ رَبُّ الْعَرْشِ الْعَظِيْمِ، لاَ إِلَـٰهَ إِلاَّ اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيْمِ",
    transliteration:"Laa ilaaha illallaahul 'azhiimul haliim, laa ilaaha illallaahu rabbul 'arsyil 'azhiim, laa ilaaha illallaahu rabbus-samaawaati wa rabbul ardhi wa rabbul 'arsyil kariim.",
    translation:{
      en:"There is no deity except Allah, the Most Great, the Most Forbearing. There is no deity except Allah, Lord of the Magnificent Throne. There is no deity except Allah, Lord of the heavens, Lord of the earth, and Lord of the Noble Throne.",
      fr:"Il n'y a pas de divinité sauf Allah, le Très Grand, le Très Clément. Il n'y a pas de divinité sauf Allah, Seigneur du Trône Majestueux. Il n'y a pas de divinité sauf Allah, Seigneur des cieux, Seigneur de la terre et Seigneur du Trône Noble.", de:"Es gibt keinen Gott außer Allah, dem Allgewaltigen, dem Nachsichtigen. Es gibt keinen Gott außer Allah, dem Herrn des gewaltigen Thrones. Es gibt keinen Gott außer Allah, dem Herrn der Himmel, dem Herrn der Erde und dem Herrn des edlen Thrones."}, benefit:{en:"The Prophet ﷺ used this dua when he faced something serious or worrying. It contains three profound declarations of Tawhid with powerful names of Allah.",fr:"Le Prophète ﷺ utilisait cette invocation lorsqu'il faisait face à quelque chose de sérieux. Elle contient trois déclarations profondes de Tawhid.",de:"Der Prophet ﷺ verwendete dieses Dua wenn er etwas Ernstes oder Beunruhigendes erlebte. Es enthält drei tiefgründige Tawhid-Bezeugungen."},
    source:["Sahih Bukhari","Sahih Muslim"] },

  // ── CATEGORY: EVENTS (GOOD OR BAD) ──
  
  { id:143, catId:"events", type:"dua", order:1,
    title:{en:"When something bad happens – Decree of Allah",fr:"Quand quelque chose de mauvais arrive – Le décret d'Allah",de:"Wenn etwas Schlechtes passiert – Der Beschluss Allahs"},     arabic:"قَدَرُ اللَّهِ وَمَا شَاءَ فَعَلَ",     transliteration:"Qodarullaahi wa maa syaa-a fa-ala.",
    translation:{ en:"This is the decree of Allah, and whatever He wills, He does.", fr:"Ceci est le décret d'Allah, et tout ce qu'Il veut, Il le fait.", de:"Dies ist die Bestimmung Allahs, und was Er will, das tut Er."}, benefit:{en:"The Prophet ﷺ said: 'The strong believer is better than the weak believer. But if something overwhelms you, say: This is the decree of Allah and whatever He wills He does. Do not say: If only I had done this.' Accepting the decree of Allah is the foundation of patience.",fr:"Le Prophète ﷺ a dit : 'Le croyant fort vaut mieux que le croyant faible. Mais si quelque chose t'accable, dis : C'est le décret d'Allah et ce qu'Il veut Il le fait. Ne dis pas : Si seulement j'avais fait ceci.'",de:"Der Prophet ﷺ sagte: 'Der starke Gläubige ist besser als der schwache Gläubige. Aber wenn dich etwas überwältigt, sage: Dies ist Allahs Bestimmung und was Er will tut Er. Sag nicht: Wenn ich nur... das getan hätte.'"},
    source:["Sahih Muslim"] },

  { id:144, catId:"events", type:"dua", order:2,
    title:{en:"Inna lillahi – after a calamity (version 1)",fr:"Inna lillahi – après une calamité (version 1)",de:"Inna lillahi – nach einer Prüfung (Version 1)"},
    arabic:"إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُوْنَ، اَللَّهُمَّ أْجُرْنِيْ فِيْ مُصِيْبَتِيْ، وَأَخْلِفْ لِيْ خَيْرًا مِنْهَا",
    transliteration:"Innaa lillaahi wa innaa ilaihi rooji'uun, allaahumma' jurnii fii mushiibatii, wa akh-lif lii khoiron minhaa.",
    translation:{
      en:"Indeed, we belong to Allah and to Him we shall return. O Allah, reward me in my affliction and replace it with something better.",
      fr:"Nous appartenons à Allah et c'est vers Lui que nous retournons. Ô Allah, accorde-moi une récompense dans mon épreuve et remplace-la par quelque chose de meilleur.", de:"Wahrlich, wir gehören Allah und zu Ihm kehren wir zurück. O Allah, belohne mich in meiner Prüfung und ersetze sie durch etwas Besseres."}, benefit:{en:"Whoever says this after a calamity, Allah will replace it with something better. Umm Salamah said: when Abu Salamah died she said this dua, and Allah replaced him with the Messenger of Allah ﷺ himself.",fr:"Celui qui dit cela après une calamité, Allah la remplacera par quelque chose de meilleur. Umm Salama a dit que quand Abu Salama mourut, elle récita cette invocation, et Allah le remplaça par le Messager d'Allah ﷺ lui-même.",de:"Wer dies nach einer Prüfung sagt, wird Allah es durch etwas Besseres ersetzen. Umm Salama sagte: Als Abu Salama starb sprach sie dieses Dua, und Allah ersetzte ihn durch den Gesandten Allahs ﷺ selbst."},
    source:["Sahih Muslim"] },

  { id:145, catId:"events", type:"dua", order:3,
    title:{en:"Inna lillahi – after a calamity (version 2)",fr:"Inna lillahi – après une calamité (version 2)",de:"Inna lillahi – nach einer Prüfung (Version 2)"},
    arabic:"إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُوْنَ، اَللَّهُمَّ أْجُرْنِي فِي مُصِيْبَتِي، وَاخْلُفْ لِي خَيْرًا مِنْهَا",
    transliteration:"Innaa lillaahi wa innaa ilaihi rooji'uun, allaahumma' jurnii fii mushiibatii, wakh-luf lii khoiron minhaa.",
    translation:{
      en:"Indeed, we belong to Allah and to Him we shall return. O Allah, reward me for my patience and replace it with something better.",
      fr:"Nous appartenons à Allah et c'est vers Lui que nous retournons. Ô Allah, récompense-moi pour ma patience et remplace cela par quelque chose de meilleur.", de:"Wahrlich, wir gehören Allah und zu Ihm kehren wir zurück. O Allah, belohne mich für meine Geduld und ersetze es durch etwas Besseres."}, source:["Sahih Muslim"] },

  { id:146, catId:"events", type:"dua", order:4,     title:{en:"Inna lillahi – after a calamity (version 3)",fr:"Inna lillahi – après une calamité (version 3)",de:"Inna lillahi – nach einer Prüfung (Version 3)"},     arabic:"إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اَللَّهُمَّ أَجِرْنِي فِي مُصِيبَتِي، وَاخْلُفْ لِي خَيْرًا مِنْهَا",     transliteration:"Innaa lillaahi wa innaa ilaihi rooji'uun, allaahumma ajirnii fii mushiibatii, wakh-luf lii khoiron minhaa.",
    translation:{
      en:"Indeed, we belong to Allah and to Him we shall return. O Allah, grant me reward in my calamity and replace it with something better.",
      fr:"Nous appartenons à Allah et c'est vers Lui que nous retournons. Ô Allah, accorde-moi une récompense dans cette épreuve et remplace-la par quelque chose de meilleur.", de:"Wahrlich, wir gehören Allah und zu Ihm kehren wir zurück. O Allah, gewähre mir eine Belohnung in meiner Prüfung und ersetze es durch etwas Besseres."}, source:["Sahih Muslim"] },

  { id:147, catId:"events", type:"dua", order:5,     title:{en:"When seeing someone afflicted with illness",fr:"En voyant quelqu'un affligé d'une maladie",de:"Wenn man jemanden mit Krankheit sieht"},     arabic:"اَلْحَمْدُ لِلَّهِ الَّذِيْ عَافَانِيْ مِمَّا ابْتَلَاكَ بِهِ، وَفَضَّلَنِيْ عَلَى كَثِيْرٍ مِمَّنْ خَلَقَ تَفْضِيْلًا",     transliteration:"Alhamdulillaahil-ladzii 'aafaanii mimmab-talaaka bihi, wa fadh-dholanii 'alaa katsiirin mimman kholaqo tafdhiilan.",
    translation:{ en:"All praise is due to Allah who has protected me from what He has afflicted you with, and has preferred me above many of His creation.", fr:"Louange à Allah qui m'a préservé de ce dont Il t'a éprouvé, et m'a favorisé sur beaucoup de ceux qu'Il a créés.", de:"Alles Lob gebührt Allah, der mich vor dem bewahrt hat womit Er dich geprüft hat, und der mich vielen Seiner Geschöpfe vorgezogen hat."}, instruction:{en:"Said quietly to oneself, not out loud, so the afflicted person does not hear.",fr:"Dit à voix basse pour soi-même, pas à voix haute, afin que la personne affligée n'entende pas.",de:"Leise für sich selbst gesagt, nicht laut, damit die betroffene Person es nicht hört."},
    benefit:{en:"Whoever sees a person with affliction and says this dua quietly to himself, Allah will protect him from that affliction.",fr:"Celui qui voit une personne affligée et dit cette invocation à voix basse, Allah le protégera de cette affliction.",de:"Wer jemanden mit einer Prüfung sieht und dieses Dua leise sagt, wird Allah ihn vor dieser Prüfung schützen."},
    source:["At-Tirmidhi","Sahih"] },

  { id:148, catId:"events", type:"dua", order:6,
    title:{en:"When something good happens – Praise Allah",fr:"Quand quelque chose de bien arrive – Louange à Allah",de:"Wenn etwas Gutes passiert – Allah loben"},
    arabic:"اَلْحَمْدُ لِلَّهِ الَّذِيْ بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ",
    transliteration:"Alhamdulillaahil-ladzii bini-matihi tatimmush-shoolihaat.",
    translation:{
      en:"All praise is due to Allah by whose blessings good deeds are completed.",
      fr:"Louange à Allah par dont la grâce les bonnes actions s'accomplissent.", de:"Alles Lob gebührt Allah, durch dessen Gunst gute Taten vollendet werden."}, benefit:{en:"Said when something good happens. The companion dua is: 'Alhamdulillahi ala kulli hal' (All praise to Allah in every situation) – said when something bad happens.",fr:"Dit quand quelque chose de bien arrive. L'invocation complémentaire est : 'Alhamdulillahi ala kulli hal' (Louange à Allah en toute situation) – dite quand quelque chose de mauvais arrive.",de:"Gesagt wenn etwas Gutes passiert. Das zugehörige Dua ist: 'Alhamdulillahi ala kulli hal' (Alles Lob gebührt Allah in jeder Lage) – gesagt wenn etwas Schlechtes passiert."},
    source:["Ibn Majah","Sahih"] },

  { id:149, catId:"events", type:"info", order:7,
    title:{en:"Sujood ash-Shukr – Prostration of Gratitude",fr:"Sujood ash-Shukr – La Prosternation de Gratitude",de:"Sujood ash-Shukr – Die Dankbarkeitsniederwerfung"},
    content:{
      en:"When something joyful or good news came to the Prophet ﷺ, he would perform a prostration of gratitude (Sujood ash-Shukr) – prostrating to Allah in thanks. This sunnah is recommended when receiving good news, achieving something, or when a blessing arrives.",
      fr:"Lorsqu'une bonne nouvelle ou quelque chose de réjouissant arrivait au Prophète ﷺ, il se prosternait en signe de gratitude (Sujood ash-Shukr). Cette sunna est recommandée lors de l'annonce d'une bonne nouvelle, d'une réalisation ou de l'arrivée d'une bénédiction.",
      de:"Wenn dem Propheten ﷺ eine freudige oder gute Nachricht kam, warf er sich dankbar nieder (Sujood ash-Shukr). Diese Sunnah wird empfohlen beim Erhalt guter Nachrichten, beim Erreichen eines Ziels oder beim Eintreten eines Segens."},
    source:["Abu Dawud","At-Tirmidhi","Sahih"] },

  // ── CATEGORY: WEALTH & DEBT ──
  
  { id:150, catId:"wealth", type:"dua", order:1,
    title:{en:"Dua for halal provision and independence",fr:"Invocation pour une subsistance licite et l'indépendance",de:"Dua für halales Einkommen und Unabhängigkeit"},     arabic:"اَللَّهُمَّ اكْفِنِيْ بِحَلاَلِكَ عَنْ حَرَامِكَ وَأَغْنِنِيْ بِفَضْلِكَ عَمَّنْ سِوَاكَ",     transliteration:"Allaahummakfinii bihalaalika 'an haroomika, wa aghninii bifadhlika 'amman siwaak.",
    translation:{ en:"O Allah, suffice me with what You have made lawful instead of what You have made unlawful, and make me independent by Your grace from all others besides You.", fr:"Ô Allah, accorde-moi ce qui est licite afin que je n'aie pas besoin de l'illicite, et enrichis-moi par Ta grâce afin que je n'aie besoin de personne d'autre que Toi.", de:"O Allah, genüge mir mit dem was Du erlaubt hast statt mit dem Verbotenen, und mache mich durch Deine Gunst unabhängig von allen außer Dir."}, benefit:{en:"One of the most comprehensive duas for provision. It asks for sufficiency in halal, protection from haram, and freedom from dependence on creation.",fr:"L'une des invocations les plus complètes pour la subsistance. Elle demande la suffisance dans le licite, la protection contre l'illicite et la liberté de dépendance envers la création.",de:"Eines der umfassendsten Duas für Versorgung. Es bittet um Genügsamkeit im Halal, Schutz vor Haram und Freiheit von der Abhängigkeit von der Schöpfung."}, source:["At-Tirmidhi","Sahih"] },

  { id:151, catId:"wealth", type:"dua", order:2,     title:{en:"Dua from Surah Ali Imran – Sovereignty of Allah",fr:"Invocation de la Sourate Ali Imran – La Souveraineté d'Allah",de:"Dua aus Sure Ali Imran – Allahs Herrschaft"},
    arabic:"اَللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَنْ تَشَاءُ وَتَنزِعُ الْمُلْكَ مِمَّن تَشَاءُ وَتُعِزُّ مَن تَشَاءُ وَتُذِلُّ مَن تَشَاءُ بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
    transliteration:"Allaahumma maalikal mulki tu'til mulka man tasyaa-u wa tanzi'ul mulka mimman tasyaa-u wa tu'izzu man tasyaa-u wa tudzillu man tasyaa-u biyadikal khoiru innaka 'alaa kulli syai-in qodiir.",
    translation:{
      en:"O Allah, Owner of sovereignty – You give authority to whom You will and You take it away from whom You will. You honor whom You will and You humble whom You will. In Your hand is all goodness. Indeed, You are over all things competent.",
      fr:"Ô Allah, Maître de la royauté – Tu accordes la royauté à qui Tu veux et Tu l'enlèves à qui Tu veux. Tu élèves qui Tu veux et Tu humilies qui Tu veux. Entre Tes mains est tout le bien. Certes, Tu es en mesure de faire toute chose.", de:"O Allah, Besitzer der Herrschaft – Du gibst die Herrschaft wem Du willst und nimmst sie weg von wem Du willst. Du ehrst wen Du willst und Du erniedrigst wen Du willst. In Deiner Hand liegt alles Gute. Wahrlich Du bist über alle Dinge mächtig."}, source:["Quran 3:26","Sahih Bukhari","Sahih Muslim"] },

  { id:152, catId:"wealth", type:"dua", order:3,     title:{en:"Seeking refuge from sin and debt",fr:"Chercher refuge contre le péché et les dettes",de:"Zuflucht vor Sünde und Schulden suchen"},     arabic:"اَللَّهُمَّ إِنِّى أَعُوْذُ بِكَ مِنَ الْمَأْثَمِ وَالْمَغْرَمِ",     transliteration:"Allaahumma innii a'uudzu bika minal ma'tsami wal maghrom.",
    translation:{ en:"O Allah, I seek refuge in You from sin and from debt.", fr:"Ô Allah, je cherche refuge auprès de Toi contre le péché et les dettes.", de:"O Allah, ich suche Zuflucht bei Dir vor Sünde und Schulden."}, benefit:{en:"The Prophet ﷺ frequently sought refuge from debt. When asked why, he said: 'When a man is indebted, he lies when he speaks, and breaks his promise when he makes one.' Debt puts pressure on one's character and honor.",fr:"Le Prophète ﷺ cherchait souvent refuge contre les dettes. Interrogé sur la raison, il dit : 'Quand un homme est endetté, il ment quand il parle et ne tient pas sa promesse.' La dette pèse sur le caractère et l'honneur.",de:"Der Prophet ﷺ suchte häufig Zuflucht vor Schulden. Als er gefragt wurde warum, sagte er: 'Wenn ein Mann verschuldet ist, lügt er wenn er spricht und bricht sein Versprechen.' Schulden belasten den Charakter und die Ehre."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:153, catId:"wealth", type:"dua", order:4,     title:{en:"Blessing for the one who lends (short)",fr:"Bénédiction pour celui qui prête (court)",de:"Segen für den Verleihenden (kurz)"},     arabic:"بَارَكَ اللَّهُ لَكَ فِيْ أَهْلِكَ وَمَالِكَ",     transliteration:"Baarokallaahu laka fii ahlika wa maalika.",
    translation:{ en:"May Allah bless your family and your wealth.", fr:"Qu'Allah bénisse ta famille et ta richesse.",
      de:"Möge Allah deine Familie und dein Vermögen segnen."},
    benefit:{en:"Said to someone who lends you money as a dua of gratitude and blessing for them.",fr:"Dit à quelqu'un qui vous prête de l'argent comme invocation de gratitude et de bénédiction.",de:"Gesagt zu jemandem der dir Geld leiht als Dua der Dankbarkeit und des Segens für ihn."},
    source:["Ibn Majah","At-Tirmidhi","Sahih"] },

  { id:154, catId:"wealth", type:"dua", order:5,
    title:{en:"Blessing for the one who lends (full)",fr:"Bénédiction pour celui qui prête (complète)",de:"Segen für den Verleihenden (vollständig)"},
    arabic:"بَارَكَ اللَّهُ لَكَ فِيْ أَهْلِكَ وَمَالِكَ، إِنَّمَا جَزَاءُ السَّلَفِ الْحَمْدُ وَاْلأَدَاءُ",
    transliteration:"Baarokallaahu laka fii ahlika wa maalika, innamaa jazaa-us-salafil hamdu wal adaa-u.",
    translation:{
      en:"May Allah bless you in your family and wealth. The reward for lending is gratitude and repayment.",
      fr:"Qu'Allah te bénisse dans ta famille et ta richesse. La récompense pour un prêt est la gratitude et le remboursement.", de:"Möge Allah dich in deiner Familie und deinem Vermögen segnen. Die Belohnung für ein Darlehen ist Dank und Rückzahlung."}, benefit:{en:"This is the complete version said when repaying a debt. It both blesses the lender and acknowledges that good repayment and thanks are the proper reward for lending.",fr:"C'est la version complète dite lors du remboursement d'une dette. Elle bénit le prêteur et reconnaît que le bon remboursement et la gratitude sont la récompense pour un prêt.",de:"Dies ist die vollständige Version die beim Zurückzahlen einer Schuld gesagt wird. Sie segnet den Verleiher und erkennt an dass gute Rückzahlung und Dankbarkeit die richtige Belohnung für ein Darlehen sind."}, source:["Ibn Majah","At-Tirmidhi","Sahih"] },

  { id:155, catId:"wealth", type:"dua", order:6,     title:{en:"Asking for Allah's grace and mercy",fr:"Demander la grâce et la miséricorde d'Allah",de:"Um Allahs Gnade und Barmherzigkeit bitten"},     arabic:"اَللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ وَرَحْمَتِكَ، فَإِنَّهُ لاَ يَمْلِكُهَا إِلاَّ أَنْتَ",     transliteration:"Allaahumma innii as-aluka min fadhlika wa rohmatik, fa-innahu laa yamlikuhaa illaa anta.",
    translation:{ en:"O Allah, I ask You for Your grace and mercy, for none possesses them except You.", fr:"Ô Allah, je Te demande Ta grâce et Ta miséricorde, car nul ne les possède sauf Toi.", de:"O Allah, ich bitte Dich um Deine Gnade und Barmherzigkeit, denn niemand besitzt sie außer Dir."}, source:["Ahmad","Sahih"] },

  { id:156, catId:"wealth", type:"dua", order:7,     title:{en:"Dua for firmness, guidance and gratitude",fr:"Invocation pour la fermeté, la guidance et la gratitude",de:"Dua für Standhaftigkeit, Rechtleitung und Dankbarkeit"},     arabic:"اَللَّهُمَّ إِنِّي أَسْأَلُكَ الثَّبَاتَ فِي الْأَمْرِ، وَالْعَزِيمَةَ عَلَى الرُّشْدِ، وَأَسْأَلُكَ شُكْرَ نِعْمَتِكَ، وَحُسْنَ عِبَادَتِكَ، وَأَسْأَلُكَ قَلْبًا سَلِيمًا، وَلِسَانًا صَادِقًا، وَأَسْأَلُكَ مِنْ خَيْرِ مَا تَعْلَمُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا تَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا تَعْلَمُ",     transliteration:"Allaahumma innii as-alukats-tsabaata fil amri, wal aziimata alar-rusydi, wa as-aluka syukra nimatika, wa husna ibaadatika, wa as-aluka qolban saliiman, wa lisaanan shodiqon, wa as-aluka min khoiri maa talamu, wa auudzu bika min syarri maa talamu, wa astaghfiruka limaa talamu.",
    translation:{ en:"O Allah, I ask You for firmness in all matters, and determination upon guidance. I ask You for gratitude for Your blessings and excellence in worshipping You. I ask You for a sound heart and a truthful tongue. I ask You for the good of what You know, I seek refuge in You from the evil of what You know, and I seek Your forgiveness for what You know.", fr:"O Allah, je Te demande la fermete dans toutes les affaires et la determination sur la voie droite. Je Te demande la gratitude pour Tes bienfaits et l'excellence dans Ton adoration. Je Te demande un coeur sain et une langue veridique. Je Te demande le bien de ce que Tu sais, et je Te demande pardon pour ce que Tu sais.",
      de:"O Allah, ich bitte Dich um Standhaftigkeit in allen Angelegenheiten und Entschlossenheit auf dem Weg der Rechtleitung. Ich bitte Dich um Dankbarkeit fuer Deine Gaben und Vortrefflichkeit in Deiner Anbetung. Ich bitte Dich um ein gesundes Herz und eine wahrhaftige Zunge. Ich bitte Dich um das Gute von dem Du weisst, ich suche Zuflucht bei Dir vor dem Boesen von dem Du weisst, und ich bitte Dich um Vergebung fuer das was Du weisst."},
    source:["At-Tabarani","Sahih Al-Albani"] },

  { id:157, catId:"travel", type:"dua", order:1,
    title:{en:"Farewell dua – Entrusting to Allah (1)",fr:"Invocation d'adieu – Confier à Allah (1)",de:"Abschiedsdua – Allah anvertrauen (1)"},     arabic:"أَسْتَوْدِعُكُمُ اللَّهَ الَّذِيْ لاَ تَضِيْعُ وَدَائِعُهُ",     transliteration:"Astaudi'ukumullaahal-ladzii laa tadhii'u wa daa-i'uh.",
    translation:{en:"I entrust you to Allah whose trusts are never lost.",fr:"Je vous confie à Allah dont les dépôts ne sont jamais perdus.",de:"Ich vertraue euch Allah an, bei Dem nichts verloren geht."},
    benefit:{en:"Said to those staying behind when departing for travel. It is a dua of love and protection for the family left at home.",fr:"Dit à ceux qui restent en partant en voyage. C'est une invocation d'amour et de protection pour la famille restée à la maison.",de:"Gesagt an die Zurückbleibenden beim Aufbruch zur Reise. Es ist ein Dua der Liebe und des Schutzes für die zu Hause gebliebene Familie."},
    source:["Ibn Majah","Ahmad","Sahih"] },

  { id:158, catId:"travel", type:"dua", order:2,
    title:{en:"Farewell dua – Entrusting to Allah (2)",fr:"Invocation d'adieu – Confier à Allah (2)",de:"Abschiedsdua – Allah anvertrauen (2)"},     arabic:"أَسْتَوْدِعُ اللَّهَ دِيْنَكَ وَأَمَانَتَكَ وَخَوَاتِيْمَ عَمَلِكَ",     transliteration:"Astaudi'ullaaha diinaka wa amaanataka wa khowaatiima 'amalik.",
    translation:{en:"I entrust your religion, your trust, and the end of your deeds to Allah.",fr:"Je confie à Allah ta religion, ta confiance et la fin de tes actes.",de:"Ich vertraue Allah deine Religion, dein anvertrautes Gut und das Ende deiner Taten an."}, source:["At-Tirmidhi","Ibn Majah","Sahih"] },

  { id:159, catId:"travel", type:"dua", order:3,     title:{en:"Farewell dua – Taqwa and forgiveness",fr:"Invocation d'adieu – Piété et pardon",de:"Abschiedsdua – Taqwa und Vergebung"},
    arabic:"زَوَّدَكَ اللَّهُ التَّقْوَى، وَغَفَرَ ذَنْبَكَ، وَيَسَّرَ لَكَ الْخَيْرَ حَيْثُ مَا كُنْتَ",
    transliteration:"Zawwadakallaahut-taqwaa, wa ghofara dzanbaka, wa yassaro lakal khoiro haitsu maa kunta.",
    translation:{en:"May Allah provide you with piety, forgive your sins, and make goodness easy for you wherever you are.",fr:"Qu'Allah te dote de piété, pardonne tes péchés et facilite le bien pour toi où que tu sois.",de:"Möge Allah dir Gottesfurcht geben, deine Sünden vergeben und dir das Gute erleichtern wo immer du bist."}, source:["At-Tirmidhi","Sahih"] },

  { id:160, catId:"travel", type:"dua", order:4,     title:{en:"Dua when boarding a vehicle or mount",fr:"Invocation en montant dans un véhicule",de:"Dua beim Besteigen eines Fahrzeugs"}, instruction:{en:"Say Bismillah when boarding, then recite this dua.",fr:"Dire Bismillah en montant, puis réciter cette invocation.",de:"Bismillah beim Einsteigen sagen, dann dieses Dua rezitieren."},     arabic:"بِسْمِ اللَّهِ، وَالْحَمْدُ لِلَّهِ، سُبْحَانَ الَّذِيْ سَخَّرَ لَنَا هَـٰذَا وَمَا كُنَّا لَهُ مُقْرِنِيْنَ، وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ، اَلْحَمْدُ لِلَّهِ، اَلْحَمْدُ لِلَّهِ، اَلْحَمْدُ لِلَّهِ، اَللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ، سُبْحَانَكَ اَللَّهُمَّ إِنِّيْ ظَلَمْتُ نَفْسِيْ فَاغْفِرْ لِيْ، فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ",     transliteration:"Bismillaah, walhamdulillaah, subhaanal-ladzii sakhkhoro lanaa haadzaa wa maa kunnaa lahu muqriniin, wa innaa ilaa robbinaa lamunqolibuun, alhamdulillaah (3x), allaahu akbar (3x), subhaanaka allaahumma innii zholamtu nafsii faghfir lii, fa-innahu laa yaghfirudz-dzunuuba illaa anta.",
    translation:{en:"In the name of Allah, all praise is for Allah. Glory be to the One who subjected this to us, and we could not have done so ourselves. And indeed we will return to our Lord. All praise is for Allah (3x). Allah is the Greatest (3x). Glory be to You O Allah, I have wronged myself so forgive me, for none forgives sins except You.",fr:"Au nom d'Allah, toute louange est à Allah. Gloire à Celui qui nous a soumis cela, nous n'aurions pas pu le faire nous-mêmes. Nous retournerons vers notre Seigneur. Toute louange à Allah (3x). Allah est le Plus Grand (3x). Gloire à Toi ô Allah, j'ai lésé mon âme alors pardonne-moi, car nul ne pardonne les péchés sauf Toi.",de:"Im Namen Allahs, alles Lob gebührt Allah. Gepriesen sei Derjenige der uns dies unterworfen hat, wir hätten es selbst nicht gekonnt. Und wahrlich zu unserem Herrn kehren wir zurück. Alles Lob gebührt Allah (3x). Allah ist der Größte (3x). Gepriesen seist Du o Allah, ich habe mir selbst Unrecht getan, vergib mir, denn niemand vergibt Sünden außer Dir."},
    source:["Abu Dawud","At-Tirmidhi","Sahih"] },

  { id:161, catId:"travel", type:"dua", order:5,
    title:{en:"Allahu Akbar when going uphill",fr:"Allahu Akbar en montant",de:"Allahu Akbar beim Aufstieg"},
    instruction:{en:"Say Allahu Akbar (Allah is the Greatest) when going uphill or ascending.",fr:"Dire Allahu Akbar en montant une pente.",de:"Allahu Akbar sagen wenn man bergauf oder aufwärts geht."},
    arabic:"اَللَّهُ أَكْبَرُ",
    transliteration:"Allaahu akbar.",
    translation:{en:"Allah is the Greatest.",fr:"Allah est le Plus Grand.",de:"Allah ist der Größte."},
    benefit:{en:"The Prophet ﷺ would say Allahu Akbar when going uphill and Subhanallah when going downhill. This teaches mindfulness of Allah in every movement of travel.",fr:"Le Prophète ﷺ disait Allahu Akbar en montant et Subhanallah en descendant. Cela enseigne la conscience d'Allah dans chaque mouvement.",de:"Der Prophet ﷺ sagte Allahu Akbar beim Aufstieg und Subhanallah beim Abstieg. Dies lehrt Bewusstsein für Allah bei jeder Bewegung."}, source:["Sahih Bukhari"] },

  { id:162, catId:"travel", type:"dua", order:6,     title:{en:"Subhanallah when going downhill",fr:"Subhanallah en descendant",de:"Subhanallah beim Abstieg"}, instruction:{en:"Say Subhanallah (Glory be to Allah) when going downhill or descending.",fr:"Dire Subhanallah en descendant une pente.",de:"Subhanallah sagen wenn man bergab oder abwärts geht."},     arabic:"سُبْحَانَ اللَّهِ",     transliteration:"Subhaanallaah.",
    translation:{en:"Glory be to Allah.",fr:"Gloire à Allah.",de:"Gepriesen sei Allah."}, source:["Sahih Bukhari"] },

  { id:163, catId:"travel", type:"dua", order:7,     title:{en:"Dua during travel – Samma-a sami'un",fr:"Invocation pendant le voyage – Samma-a sami'un",de:"Dua während der Reise – Samma-a sami'un"},
    arabic:"سَمَّعَ اللَّهُ بِحَمْدِنَا إِنَّا نَحْمَدُهُ، وَإِلَيْهِ نَتَوَكَّلُ، وَعَلَيْهِ نَتَوَكَّلُ، لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ",
    transliteration:"Samma'allaahu bihamdina, innaa nahmaduh, wa ilaihi nata-wakkal, wa 'alaihi nata-wakkal, laa hawla wa laa quwwata illaa billaah.",
    translation:{en:"May Allah make our praise heard. We praise Him, and to Him we turn, and upon Him we rely. There is no power and no strength except with Allah.",fr:"Qu'Allah fasse entendre notre louange. Nous Le louons, c'est vers Lui que nous nous tournons et sur Lui que nous nous reposons. Il n'y a de force ni de puissance qu'avec Allah.",de:"Möge Allah unser Lob hören. Wir preisen Ihn, zu Ihm wenden wir uns und auf Ihn verlassen wir uns. Es gibt keine Kraft und keine Macht außer durch Allah."},
    source:["Abu Dawud","Authenticated"] },

  { id:164, catId:"travel", type:"dua", order:8,
    title:{en:"Dua when stopping at a place",fr:"Invocation en s'arrêtant dans un endroit",de:"Dua beim Anhalten an einem Ort"},     arabic:"أَعُوْذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",     transliteration:"A'uudzu bikalimaatillaahit-taammaati min syarri maa kholaq.",
    translation:{en:"I seek refuge in the perfect words of Allah from the evil of what He has created.",fr:"Je cherche refuge dans les paroles parfaites d'Allah contre le mal de ce qu'Il a créé.",de:"Ich suche Zuflucht in den vollkommenen Worten Allahs vor dem Bösen dessen was Er erschaffen hat."},
    benefit:{en:"The Prophet ﷺ said: whoever stops at a place and says this, nothing will harm him until he leaves that place.",fr:"Le Prophète ﷺ a dit : quiconque s'arrête dans un endroit et dit cela, rien ne lui nuira jusqu'à ce qu'il quitte cet endroit.",de:"Der Prophet ﷺ sagte: Wer an einem Ort anhält und dies sagt, wird ihm nichts schaden bis er diesen Ort verlässt."}, source:["Sahih Muslim"] },

  { id:165, catId:"travel", type:"dua", order:9,     title:{en:"Dua when entering a town or city",fr:"Invocation en entrant dans une ville",de:"Dua beim Eintreten in eine Stadt"},     arabic:"اَللَّهُمَّ رَبَّ السَّمَاوَاتِ السَّبْعِ وَمَا أَظْلَلْنَ، وَرَبَّ الْأَرَضِيْنَ السَّبْعِ وَمَا أَقْلَلْنَ، وَرَبَّ الشَّيَاطِيْنِ وَمَا أَضْلَلْنَ، وَرَبَّ الرِّيَاحِ وَمَا ذَرَيْنَ، أَسْأَلُكَ خَيْرَ هَذِهِ الْقَرْيَةِ وَخَيْرَ أَهْلِهَا وَخَيْرَ مَا فِيْهَا، وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَشَرِّ أَهْلِهَا وَشَرِّ مَا فِيْهَا",     transliteration:"Allaahumma robbas-samaawaatis-sab'i wa maa azhlalna, wa robbal ardhodhiinas-sab'i wa maa aqllalna, wa robbasysyayaathiini wa maa adhllalna, wa robbair-riyaahi wa maa dzaraina, as-aluka khoyra haadzihil qoryati wa khoira ahliha wa khoira maa fiihaa, wa a'uudzu bika min syarrihaa wa syarri ahliha wa syarri maa fiihaa.",
    translation:{en:"O Allah, Lord of the seven heavens and all they shade, Lord of the seven earths and all they carry, Lord of the devils and all they lead astray, and Lord of the winds and all they scatter – I ask You for the good of this town, the good of its people and the good of what is in it, and I seek refuge in You from its evil, the evil of its people and the evil of what is in it.",fr:"Ô Allah, Seigneur des sept cieux et de tout ce qu'ils couvrent, Seigneur des sept terres et de tout ce qu'elles portent, Seigneur des démons et de ceux qu'ils égarent, Seigneur des vents et de ce qu'ils dispersent – je Te demande le bien de cette ville, le bien de ses habitants et le bien de ce qui s'y trouve, et je cherche refuge en Toi contre son mal, le mal de ses habitants et le mal de ce qui s'y trouve.",de:"O Allah, Herr der sieben Himmel und allem was sie beschatten, Herr der sieben Erden und allem was sie tragen, Herr der Teufel und allem wen sie irreführen, Herr der Winde und allem was sie verteilen – ich bitte Dich um das Gute dieser Stadt, das Gute ihrer Bewohner und das Gute was in ihr ist, und suche Zuflucht bei Dir vor ihrem Bösen, dem Bösen ihrer Bewohner und dem Bösen was in ihr ist."},
    source:["Al-Hakim","Sahih Al-Albani"] },

  { id:166, catId:"travel", type:"dua", order:10,
    title:{en:"Dua when returning from travel",fr:"Invocation au retour de voyage",de:"Dua bei der Rückkehr von der Reise"},
    arabic:"لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيْكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ، آيِبُوْنَ تَائِبُوْنَ عَابِدُوْنَ سَاجِدُوْنَ لِرَبِّنَا حَامِدُوْنَ، صَدَقَ اللَّهُ وَعْدَهُ وَنَصَرَ عَبْدَهُ وَهَزَمَ الأَحْزَابَ وَحْدَهُ",
    transliteration:"Laa ilaaha illallaah wahdahu laa syariika lah, lahul mulku wa lahul hamdu wa huwa 'alaa kulli syai-in qodiir, aa-ibuuna taa-ibuuna 'aabiduuna saajiduna li-robbinaa haamiduun, shodaqollaahu wa'dahu wa nashoro 'abdahu wa hazamal ahzaaba wahdah.",
    translation:{en:"There is no deity except Allah, alone without partner. To Him belongs the dominion and all praise, and He is over all things capable. We are returning, repenting, worshipping, prostrating and praising our Lord. Allah fulfilled His promise, aided His servant and defeated the confederates alone.",fr:"Il n'y a pas de divinité sauf Allah seul sans associé. À Lui la souveraineté et toute louange, et Il est capable de toute chose. Nous revenons, nous nous repentons, adorons, prosternons et louons notre Seigneur. Allah a accompli Sa promesse, soutenu Son serviteur et vaincu les coalisés seul.",de:"Es gibt keinen Gott außer Allah allein ohne Partner. Ihm gehört die Herrschaft und alles Lob und Er ist über alle Dinge mächtig. Wir kehren zurück, bereuen, beten, werfen uns nieder und loben unseren Herrn. Allah erfüllte Sein Versprechen, half Seinem Diener und besiegte die Verbündeten allein."}, benefit:{en:"The Prophet ﷺ said this upon returning from travel and also after every prayer. It is especially encouraged upon returning from Hajj, Umrah or any journey.",fr:"Le Prophète ﷺ disait cela en revenant de voyage et aussi après chaque prière. C'est particulièrement recommandé au retour du Hajj, de l'Umra ou de tout voyage.",de:"Der Prophet ﷺ sagte dies bei der Rückkehr von der Reise und auch nach jedem Gebet. Es wird besonders empfohlen bei der Rückkehr von Hajj, Umra oder jeder Reise."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:167, catId:"travel", type:"dua", order:11,     title:{en:"Bismillah when getting into a vehicle",fr:"Bismillah en montant dans un véhicule",de:"Bismillah beim Einsteigen"},     arabic:"بِسْمِ اللَّهِ",     transliteration:"Bismillaah.",
    translation:{en:"In the name of Allah.",fr:"Au nom d'Allah.",de:"Im Namen Allahs."},
    benefit:{en:"Say Bismillah every time you get into any vehicle – car, plane, boat or animal. It invokes protection and blessing for the journey.",fr:"Dire Bismillah chaque fois que l'on monte dans un véhicule – voiture, avion, bateau ou animal. Cela invoque la protection et la bénédiction pour le voyage.",de:"Bismillah sagen jedes Mal wenn man in ein Fahrzeug einsteigt – Auto, Flugzeug, Schiff oder Tier. Es ruft Schutz und Segen für die Reise."}, source:["Abu Dawud","Authenticated"] },

  { id:168, catId:"travel", type:"dua", order:12,     title:{en:"Dua upon returning from travel (complete)",fr:"Invocation au retour de voyage (complète)",de:"Dua bei der Rückkehr von der Reise (vollständig)"},     arabic:"اَللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ، اَللَّهُ أَكْبَرُ، لاَ إِلَـٰهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيْكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ، آيِبُوْنَ تَائِبُوْنَ عَابِدُوْنَ لِرَبِّنَا حَامِدُوْنَ",     transliteration:"Allaahu akbar (3x), laa ilaaha illallaah wahdahu laa syariika lah, lahul mulku wa lahul hamdu wa huwa 'alaa kulli syai-in qodiir, aa-ibuuna taa-ibuuna 'aabiduuna li-robbinaa haamiduun.",
    translation:{en:"Allah is the Greatest (3 times). There is no deity except Allah, alone without partner. To Him belongs the dominion and all praise, and He is over all things capable. We are returning, repenting, worshipping and praising our Lord.",fr:"Allah est le Plus Grand (3 fois). Il n'y a pas de divinité sauf Allah seul sans associé. À Lui la souveraineté et toute louange, et Il est capable de toute chose. Nous revenons, nous nous repentons, adorons et louons notre Seigneur.",de:"Allah ist der Größte (3-mal). Es gibt keinen Gott außer Allah allein ohne Partner. Ihm gehört die Herrschaft und alles Lob und Er ist über alle Dinge mächtig. Wir kehren zurück, bereuen, beten und loben unseren Herrn."},
    source:["Sahih Bukhari","Sahih Muslim"] },

  // ── CATEGORY: PROTECTION FROM SHAYTAN & DAJJAL ──
  
  { id:169, catId:"protection", type:"dua", order:1,
    title:{en:"Ta'awwudh – Seeking refuge from Shaytan",fr:"Ta'awwudh – Chercher refuge contre Shaytan",de:"Ta'awwudh – Zuflucht vor Shaytan suchen"},     arabic:"أَعُوْذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيْمِ",     transliteration:"A'uudzu billaahi minasy-syaithoonir-rojiim.",
    translation:{en:"I seek refuge in Allah from the accursed devil.",fr:"Je cherche refuge auprès d'Allah contre Satan le maudit.",de:"Ich suche Zuflucht bei Allah vor dem verfluchten Satan."}, benefit:{en:"Recited before reading the Quran, before prayer, and whenever feeling whispers or temptations from Shaytan. Allah commands it in the Quran (16:98).",fr:"Récité avant de lire le Coran, avant la prière, et chaque fois qu'on ressent des murmures ou des tentations de Shaytan. Allah le commande dans le Coran (16:98).",de:"Rezitiert vor dem Lesen des Qurans, vor dem Gebet und immer wenn man Einflüsterungen oder Versuchungen von Shaytan spürt. Allah befiehlt es im Quran (16:98)."},
    source:["Quran 16:98","Sahih Bukhari","Sahih Muslim"] },

  { id:170, catId:"protection", type:"dua", order:2,
    title:{en:"Dua against whispers of the devils (Quran 23:97–98)",fr:"Invocation contre les murmures des démons (Coran 23:97–98)",de:"Dua gegen Einflüsterungen der Teufel (Quran 23:97–98)"},
    arabic:"رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ ۝ وَأَعُوذُ بِكَ رَبِّ أَنْ يَحْضُرُونِ",
    transliteration:"Robbi a'uudzu bika min hamazaatisy-syayaathiin. Wa a'uudzu bika robbi an yah-dhuruun.",
    translation:{en:"My Lord, I seek refuge in You from the whispers of the devils. And I seek refuge in You, my Lord, lest they come near me.",fr:"Seigneur, je cherche refuge auprès de Toi contre les incitations des démons. Et je cherche refuge auprès de Toi, mon Seigneur, de peur qu'ils s'approchent de moi.",de:"Mein Herr, ich suche Zuflucht bei Dir vor den Einflüsterungen der Teufel. Und ich suche Zuflucht bei Dir, mein Herr, dass sie mir nicht nahe kommen."},
    source:["Quran 23:97-98"] },

  { id:171, catId:"protection", type:"dua", order:3,
    title:{en:"Seeking refuge in the perfect words of Allah",fr:"Chercher refuge dans les paroles parfaites d'Allah",de:"Zuflucht in den vollkommenen Worten Allahs suchen"},     arabic:"أَعُوْذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ الَّتِيْ لاَ يُجَاوِزُهُنَّ بِرٌّ وَلاَ فَاجِرٌ، مِنْ شَرِّ مَا خَلَقَ وَبَرَأَ وَذَرَأَ، وَمِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ، وَمِنْ شَرِّ مَا يَعْرُجُ فِيْهَا، وَمِنْ شَرِّ مَا ذَرَأَ فِي الْأَرْضِ، وَمِنْ شَرِّ مَا يَخْرُجُ مِنْهَا، وَمِنْ شَرِّ فِتَنِ اللَّيْلِ وَالنَّهَارِ، وَمِنْ شَرِّ كُلِّ طَارِقٍ إِلَّا طَارِقًا يَطْرُقُ بِخَيْرٍ يَا رَحْمَانُ",     transliteration:"A'uudzu bikalimaatillaahit-taammaatil-latii laa yujaawizuhunna barrun wa laa faajir, min syarri maa kholaqo wa bara-a wa dzaro-a, wa min syarri maa yanzilu minas-samaa', wa min syarri maa ya'ruju fiihaa, wa min syarri maa dzaro-a fil ardhi, wa min syarri maa yakhruju minhaa, wa min syarri fitanil laili wan-nahaari, wa min syarri kulli thaaariqin illaa thaaariqan yathruqu bikhoirin yaa Rohmaanu.",
    translation:{en:"I seek refuge in the perfect words of Allah which neither the righteous nor the wicked can exceed – from the evil of what He created, formed and multiplied, from the evil of what descends from the sky and what ascends to it, from the evil of what He spread in the earth and what comes out of it, from the evil of the trials of night and day, and from the evil of every night visitor except the one who comes with good, O Most Merciful.",fr:"Je cherche refuge dans les paroles parfaites d'Allah que ni le pieux ni le pervers ne peut dépasser – contre le mal de ce qu'Il a créé, formé et multiplié, contre le mal de ce qui descend du ciel et de ce qui y monte, contre le mal de ce qu'Il a répandu sur terre et de ce qui en sort, contre le mal des épreuves de la nuit et du jour, et contre le mal de tout visiteur nocturne sauf celui qui vient avec le bien, ô Très Miséricordieux.",de:"Ich suche Zuflucht in den vollkommenen Worten Allahs die weder der Fromme noch der Sünder überschreiten kann – vor dem Bösen von dem was Er erschaffen, geformt und vermehrt hat, vor dem Bösen von dem was vom Himmel herabsteigt und was zu ihm aufsteigt, vor dem Bösen von dem was Er auf der Erde verbreitet hat und was daraus hervorkommt, vor dem Bösen der Prüfungen der Nacht und des Tages, und vor dem Bösen jedes Nachtbesuchers außer dem der mit Gutem kommt, o Allerbarmer."}, source:["Ahmad","Authenticated"] },

  { id:172, catId:"protection", type:"dua", order:4,     title:{en:"La ilaha illallah – 100 times daily protection",fr:"La ilaha illallah – 100 fois protection quotidienne",de:"La ilaha illallah – 100-mal täglicher Schutz"},     arabic:"لَا إِلَـٰهَ إِلَّا اللَّهُ، وَحْدَهُ لَا شَرِيْكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ",     transliteration:"Laa ilaaha illallaah, wahdahu laa syariika lah, lahul mulku wa lahul hamdu, wa huwa 'alaa kulli syai-in qodiir.",
    translation:{en:"There is no deity except Allah, alone without partner. To Him belongs the dominion and all praise, and He is over all things capable.",fr:"Il n'y a pas de divinité sauf Allah seul sans associé. À Lui la souveraineté et toute louange, et Il est capable de toute chose.",de:"Es gibt keinen Gott außer Allah allein ohne Partner. Ihm gehört die Herrschaft und alles Lob und Er ist über alle Dinge mächtig."}, instruction:{en:"Recite 100 times each day.",fr:"Réciter 100 fois chaque jour.",de:"100-mal täglich rezitieren."}, benefit:{en:"The Prophet ﷺ said: 'Whoever says this 100 times daily will have a reward equivalent to freeing ten slaves, one hundred good deeds written for him, one hundred sins erased, and it will be a protection from Shaytan for that entire day.'",fr:"Le Prophète ﷺ a dit : 'Celui qui dit cela 100 fois par jour aura une récompense équivalente à l'affranchissement de dix esclaves, cent bonnes actions inscrites, cent péchés effacés, et cela sera une protection contre Shaytan pour toute la journée.'",de:"Der Prophet ﷺ sagte: 'Wer dies täglich 100-mal sagt, hat eine Belohnung entsprechend der Freilassung von zehn Sklaven, hundert gute Taten werden ihm geschrieben, hundert Sünden getilgt und es ist Schutz vor Shaytan für den ganzen Tag.'"},
    source:["Sahih Bukhari","Sahih Muslim"] },

  { id:173, catId:"protection", type:"info", order:5,
    title:{en:"Quran, adhkar and Ayatul Kursi – Shields against Shaytan",fr:"Coran, adhkar et Ayat al-Kursi – Boucliers contre Shaytan",de:"Quran, Adhkar und Ayatul Kursi – Schutzschilde gegen Shaytan"},
    content:{en:"Several practices protect against Shaytan: 1. Reciting Surah Al-Baqarah in the house – Shaytan flees from a house where it is recited (Sahih Muslim). 2. Ayatul Kursi before sleeping – Allah appoints a guardian angel and no Shaytan can come near (Sahih Bukhari). 3. Morning and evening adhkar – a comprehensive daily shield. 4. Saying Bismillah before eating, entering the house and intimacy.",fr:"Plusieurs pratiques protègent contre Shaytan : 1. Réciter la sourate Al-Baqara dans la maison – Shaytan fuit la maison où elle est récitée (Sahih Muslim). 2. Ayat al-Kursi avant de dormir – Allah envoie un ange gardien et aucun Shaytan ne peut s'approcher (Sahih Bukhari). 3. Les adhkar du matin et du soir – un bouclier quotidien complet. 4. Dire Bismillah avant de manger, d'entrer dans la maison et lors de l'intimité.",de:"Mehrere Praktiken schützen vor Shaytan: 1. Die Sure Al-Baqara im Haus rezitieren – Shaytan flieht aus einem Haus wo sie rezitiert wird (Sahih Muslim). 2. Ayatul Kursi vor dem Schlafen – Allah schickt einen Schutzengel und kein Shaytan kann sich nähern (Sahih Bukhari). 3. Morgen- und Abend-Adhkar – ein umfassender täglicher Schutzschild. 4. Bismillah sagen vor dem Essen, beim Eintreten ins Haus und bei der Intimität."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:174, catId:"protection", type:"info", order:6,     title:{en:"The Adhan drives Shaytan away",fr:"L'Adhan fait fuir Shaytan",de:"Der Adhan vertreibt Shaytan"},
    content:{en:"The Prophet ﷺ said: 'When the call to prayer is made, Shaytan flees with loud flatulence so he cannot hear it. When it is finished he returns. When the Iqamah is called, he flees again. When it is done he returns and whispers between the man and his heart.' Therefore: saying the Adhan aloud in your home drives Shaytan away.",fr:"Le Prophète ﷺ a dit : 'Quand l'appel à la prière est lancé, Shaytan s'enfuit bruyamment pour ne pas l'entendre. Quand c'est terminé il revient. Quand l'iqama est lancée, il s'enfuit à nouveau. Quand c'est terminé il revient et chuchote entre l'homme et son cœur.' Donc : dire l'adhan à voix haute dans votre maison chasse Shaytan.",de:"Der Prophet ﷺ sagte: 'Wenn der Gebetsruf ertönt, flieht Shaytan laut um ihn nicht zu hören. Wenn er endet kehrt er zurück. Wenn die Iqama gerufen wird, flieht er erneut. Wenn sie endet kehrt er zurück und flüstert zwischen dem Mann und seinem Herzen.' Daher: den Adhan laut im Haus zu rufen vertreibt Shaytan."}, source:["Sahih Bukhari","Sahih Muslim"] },

  { id:175, catId:"protection", type:"info", order:7,     title:{en:"Surah Al-Kahf – Protection from Dajjal",fr:"Sourate Al-Kahf – Protection contre le Dajjal",de:"Sure Al-Kahf – Schutz vor dem Dajjal"},     content:{en:"The Prophet ﷺ said: 'Whoever memorizes ten verses from the beginning of Surah Al-Kahf will be protected from Dajjal.' In another narration: 'from the end of Surah Al-Kahf.' Surah Al-Kahf should be recited every Friday. Whoever recites it, it will be a light for him between two Fridays.",fr:"Le Prophète ﷺ a dit : 'Celui qui mémorise dix versets du début de la sourate Al-Kahf sera protégé du Dajjal.' Dans une autre narration : 'de la fin de la sourate Al-Kahf.' La sourate Al-Kahf doit être récitée chaque vendredi. Celui qui la récite, elle sera une lumière entre deux vendredis.",de:"Der Prophet ﷺ sagte: 'Wer zehn Verse vom Anfang der Sure Al-Kahf auswendig lernt wird vor dem Dajjal geschützt.' In einer anderen Überlieferung: 'vom Ende der Sure Al-Kahf.' Die Sure Al-Kahf soll jeden Freitag rezitiert werden. Wer sie rezitiert sie wird ein Licht zwischen zwei Freitagen sein."}, source:["Sahih Muslim","Abu Dawud"] },

  { id:176, catId:"protection", type:"dua", order:8,     title:{en:"Dua in Tashahhud – Refuge from Dajjal",fr:"Invocation dans le Tashahhud – Refuge contre le Dajjal",de:"Dua im Tashahhud – Zuflucht vor dem Dajjal"}, instruction:{en:"Recite this after the final Tashahhud in every prayer, before the Salam.",fr:"Réciter après le dernier Tashahhud dans chaque prière, avant le Salam.",de:"Nach dem letzten Tashahhud in jedem Gebet vor dem Salam rezitieren."},     arabic:"اَللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَمِنْ عَذَابِ جَهَنَّمَ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ",     transliteration:"Allaahumma innii a'uudzu bika min 'adzaabil qobri, wa min 'adzaabi jahannam, wa min fitnatil mahyaa wal mamaat, wa min syarri fitnatil masiihid-dajjaal.",
    translation:{en:"O Allah, I seek refuge in You from the punishment of the grave, from the punishment of Hellfire, from the trials of life and death, and from the evil of the trial of the False Messiah (Dajjal).",fr:"Ô Allah, je cherche refuge auprès de Toi contre le châtiment de la tombe, contre le châtiment de l'Enfer, contre les épreuves de la vie et de la mort, et contre le mal de l'épreuve du faux Messie (Dajjal).",de:"O Allah, ich suche Zuflucht bei Dir vor der Strafe des Grabes, vor der Höllenstrafe, vor den Prüfungen des Lebens und des Todes, und vor dem Bösen der Prüfung des falschen Messias (Dajjal)."},
    benefit:{en:"The Prophet ﷺ commanded every Muslim to seek refuge from four things after the Tashahhud, including the trial of Dajjal. This dua should be said in every prayer.",fr:"Le Prophète ﷺ a ordonné à chaque musulman de chercher refuge contre quatre choses après le Tashahhud, y compris l'épreuve du Dajjal. Cette invocation doit être dite dans chaque prière.",de:"Der Prophet ﷺ befahl jedem Muslim nach dem Tashahhud Zuflucht vor vier Dingen zu suchen, darunter die Prüfung des Dajjal. Dieses Dua soll in jedem Gebet gesprochen werden."}, source:["Sahih Bukhari","Sahih Muslim"] },

  // ── CATEGORY: PARADISE & HELL ── 
  { id:177, catId:"paradise", type:"dua", order:1,     title:{en:"Simple dua for Paradise and refuge from Fire",fr:"Invocation simple pour le Paradis et refuge du Feu",de:"Einfaches Dua für das Paradies und Schutz vor dem Feuer"},     arabic:"اَللَّهُمَّ إِنِّيْ أَسْأَلُكَ الْجَنَّةَ، وَأَعُوْذُ بِكَ مِنَ النَّارِ",     transliteration:"Allaahumma innii as-alukal jannah, wa a'uudzu bika minan-naar.",
    translation:{
      en:"O Allah, I ask You for Paradise and I seek refuge in You from the Fire.",
      fr:"Ô Allah, je Te demande le Paradis et je cherche refuge auprès de Toi contre le Feu.",
      de:"O Allah, ich bitte Dich um das Paradies und suche Zuflucht bei Dir vor dem Feuer."},
    benefit:{en:"The Prophet ﷺ said: 'Whoever asks Allah for Paradise three times, Paradise itself will say: O Allah, admit him. And whoever seeks refuge from the Fire three times, the Fire will say: O Allah, protect him.' So repeat this dua three times.",fr:"Le Prophète ﷺ a dit : 'Celui qui demande trois fois à Allah le Paradis, le Paradis dira lui-même : Ô Allah, fais-le entrer. Et celui qui cherche trois fois refuge contre le Feu, le Feu dira : Ô Allah, protège-le.' Répéter cette invocation trois fois.",de:"Der Prophet ﷺ sagte: 'Wer Allah dreimal um das Paradies bittet wird das Paradies selbst sagen: O Allah, lass ihn eintreten. Und wer dreimal Zuflucht vor dem Feuer sucht wird das Feuer sagen: O Allah, schütze ihn.' Dieses Dua daher dreimal wiederholen."},
    source:["At-Tirmidhi","Ibn Majah","Sahih"] },

  { id:178, catId:"paradise", type:"dua", order:2,
    title:{en:"Comprehensive dua – Paradise, protection from Fire, all decrees good",fr:"Invocation complète – Paradis, protection du Feu, tous les décrets bons",de:"Umfassendes Dua – Paradies, Schutz vor Feuer, alle Beschlüsse gut"},
    arabic:"اَللَّهُمَّ إِنِّى أَسْأَلُكَ الْجَنَّةَ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ، وَأَعُوذُ بِكَ مِنَ النَّارِ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ، وَأَسْأَلُكَ أَنْ تَجْعَلَ كُلَّ قَضَاءٍ قَضَيْتَهُ لِى خَيْرًا",
    transliteration:"Allaahumma innii as-alukal jannata wa maa qorroba ilaihaa min qoulin au 'amal, wa a'uudzu bika minan-naari wa maa qorroba ilaihaa min qoulin au 'amal, wa as-aluka an taj'ala kulla qodhoo-in qodhoitahu lii khoiron.",
    translation:{
      en:"O Allah, I ask You for Paradise and everything that brings me closer to it of words and deeds. I seek refuge in You from the Fire and everything that brings me closer to it of words and deeds. And I ask You to make every decree You have decreed for me good.",
